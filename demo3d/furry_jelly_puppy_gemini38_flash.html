<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ultra-Fluffy Pomeranian on Jelly Cushion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #2a2233 0%, #171220 50%, #0a0710 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==========================================
    // 1. SCENE SETUP & RENDERER
    // ==========================================
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.7, 7.8);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.45, 0.1);
    controls.minDistance = 3.0;
    controls.maxDistance = 14.0;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;

    // ==========================================
    // 2. LIGHTING & ENVIRONMENT
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0x382c42, 1.4);
    scene.add(ambientLight);

    // Warm Sun Key Light
    const keyLight = new THREE.DirectionalLight(0xfff3e0, 2.8);
    keyLight.position.set(4.5, 7.5, 5.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.camera.left = -3.5;
    keyLight.shadow.camera.right = 3.5;
    keyLight.shadow.camera.top = 3.5;
    keyLight.shadow.camera.bottom = -3.5;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    // Fluffy Golden Rim / Back Light
    const rimLight = new THREE.DirectionalLight(0xffd599, 3.2);
    rimLight.position.set(-3.5, 6.0, -5.5);
    scene.add(rimLight);

    // Soft Lavender-Blue Fill Light
    const fillLight = new THREE.DirectionalLight(0xb5c6ff, 1.1);
    fillLight.position.set(-5.0, 3.5, 3.5);
    scene.add(fillLight);

    // Glowing Jelly Cushion Uplight (Shines through jelly to puppy belly & fur)
    const jellyPointLight = new THREE.PointLight(0xff4d79, 3.5, 5.5, 1.5);
    jellyPointLight.position.set(0, 0.7, 0);
    scene.add(jellyPointLight);

    // ==========================================
    // 3. PORCELAIN DESSERT PLATE & GROUND
    // ==========================================
    const plateGroup = new THREE.Group();
    scene.add(plateGroup);

    // Soft Contact Shadow Disc
    const shadowGeo = new THREE.CircleGeometry(3.6, 64);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x060309,
      transparent: true,
      opacity: 0.65
    });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.y = -0.01;
    plateGroup.add(shadowMesh);

    // White Porcelain Plate
    const plateGeo = new THREE.CylinderGeometry(3.2, 3.4, 0.16, 64);
    const plateMat = new THREE.MeshStandardMaterial({
      color: 0xf6f3ef,
      roughness: 0.12,
      metalness: 0.05
    });
    const plateMesh = new THREE.Mesh(plateGeo, plateMat);
    plateMesh.position.y = 0.08;
    plateMesh.receiveShadow = true;
    plateGroup.add(plateMesh);

    // Elegant Gold Rim
    const goldRimGeo = new THREE.TorusGeometry(3.25, 0.05, 16, 64);
    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xffd269,
      roughness: 0.22,
      metalness: 0.85
    });
    const goldRim = new THREE.Mesh(goldRimGeo, goldMat);
    goldRim.rotation.x = Math.PI / 2;
    goldRim.position.y = 0.16;
    plateGroup.add(goldRim);

    // ==========================================
    // 4. TRANSLUCENT WOBBLY JELLY CUSHION
    // ==========================================
    const jellySegmentsRadial = 96;
    const jellySegmentsHeight = 32;
    const jellyGeo = new THREE.CylinderGeometry(2.15, 2.7, 1.15, jellySegmentsRadial, jellySegmentsHeight);

    const jellyPosAttr = jellyGeo.attributes.position;
    const jellyOrigPositions = new Float32Array(jellyPosAttr.array.length);
    for (let i = 0; i < jellyPosAttr.count; i++) {
      let x = jellyPosAttr.getX(i);
      let y = jellyPosAttr.getY(i);
      let z = jellyPosAttr.getZ(i);

      const angle = Math.atan2(z, x);
      let r = Math.sqrt(x * x + z * z);

      // 12 scalloped petal flutes around the circumference
      const flute = Math.cos(angle * 12.0);
      r += flute * 0.11 * (1.0 - Math.abs(y / 0.58));

      // Gentle convex belly bulge
      const bulge = Math.cos((y / 0.58) * Math.PI * 0.5) * 0.12;
      r += bulge;

      // Top indent depression for puppy body to nestle comfortably
      if (y > 0.4) {
        const distFromCenter = Math.sqrt(x * x + z * z);
        const sink = Math.exp(-distFromCenter * distFromCenter * 0.9) * 0.25;
        y -= sink;
      }

      x = Math.cos(angle) * r;
      z = Math.sin(angle) * r;

      jellyPosAttr.setXYZ(i, x, y, z);
      jellyOrigPositions[i * 3] = x;
      jellyOrigPositions[i * 3 + 1] = y;
      jellyOrigPositions[i * 3 + 2] = z;
    }
    jellyGeo.computeVertexNormals();

    const jellyMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xff6b88, // sweet strawberry-peach
      emissive: 0x3d0a16,
      transmission: 0.93,
      opacity: 1.0,
      transparent: true,
      roughness: 0.08,
      metalness: 0.02,
      ior: 1.44,
      thickness: 2.8,
      attenuationColor: 0xff1744,
      attenuationDistance: 1.3,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      specularIntensity: 1.0
    });

    const jellyMesh = new THREE.Mesh(jellyGeo, jellyMaterial);
    jellyMesh.position.set(0, 0.72, 0);
    jellyMesh.castShadow = true;
    jellyMesh.receiveShadow = true;
    scene.add(jellyMesh);

    // Internal Glowing Jelly Core
    const innerJellyGeo = new THREE.SphereGeometry(1.05, 32, 16);
    innerJellyGeo.scale(1.3, 0.55, 1.3);
    const innerJellyMat = new THREE.MeshBasicMaterial({
      color: 0xff8fab,
      transparent: true,
      opacity: 0.28
    });
    const innerJellyMesh = new THREE.Mesh(innerJellyGeo, innerJellyMat);
    innerJellyMesh.position.set(0, 0.65, 0);
    scene.add(innerJellyMesh);

    // ==========================================
    // 5. POMERANIAN PUPPY ANATOMY & RIG
    // ==========================================
    const puppyGroup = new THREE.Group();
    puppyGroup.position.set(0, 1.25, 0);
    scene.add(puppyGroup);

    // Under-body base materials (Velvety skin/under-coat beneath dense fur)
    const baseCoatMat = new THREE.MeshStandardMaterial({
      color: 0xdf8e3f,
      roughness: 0.88,
      metalness: 0.02
    });
    const creamCoatMat = new THREE.MeshStandardMaterial({
      color: 0xfff6ea,
      roughness: 0.88,
      metalness: 0.02
    });

    // --- Body Group ---
    const bodyGroup = new THREE.Group();
    puppyGroup.add(bodyGroup);

    // Main plump puppy torso
    const torsoGeo = new THREE.SphereGeometry(0.82, 32, 24);
    torsoGeo.scale(1.05, 0.95, 1.25);
    const torsoMesh = new THREE.Mesh(torsoGeo, baseCoatMat);
    torsoMesh.position.set(0, 0.28, -0.08);
    torsoMesh.castShadow = true;
    bodyGroup.add(torsoMesh);

    // Voluminous Lion-like Chest Mane Core (Puffing outward)
    const chestGeo = new THREE.SphereGeometry(0.72, 32, 24);
    chestGeo.scale(1.0, 1.05, 0.9);
    const chestMesh = new THREE.Mesh(chestGeo, creamCoatMat);
    chestMesh.position.set(0, 0.46, 0.42);
    chestMesh.castShadow = true;
    bodyGroup.add(chestMesh);

    // --- Head Group ---
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.05, 0.38);
    puppyGroup.add(headGroup);

    // Skull core
    const headGeo = new THREE.SphereGeometry(0.62, 32, 24);
    headGeo.scale(1.08, 0.98, 1.02);
    const headMesh = new THREE.Mesh(headGeo, baseCoatMat);
    headMesh.castShadow = true;
    headGroup.add(headMesh);

    // Chubby Cheek Puffs (Left & Right)
    const cheekGeo = new THREE.SphereGeometry(0.32, 24, 16);
    cheekGeo.scale(1.1, 0.9, 0.95);
    const leftCheek = new THREE.Mesh(cheekGeo, creamCoatMat);
    leftCheek.position.set(-0.35, -0.12, 0.22);
    headGroup.add(leftCheek);

    const rightCheek = new THREE.Mesh(cheekGeo, creamCoatMat);
    rightCheek.position.set(0.35, -0.12, 0.22);
    headGroup.add(rightCheek);

    // Soft Peach Cheek Blush
    const blushGeo = new THREE.CircleGeometry(0.12, 24);
    const blushMat = new THREE.MeshBasicMaterial({
      color: 0xff7b7b,
      transparent: true,
      opacity: 0.38,
      side: THREE.DoubleSide
    });
    const leftBlush = new THREE.Mesh(blushGeo, blushMat);
    leftBlush.position.set(-0.48, -0.08, 0.34);
    leftBlush.rotation.y = -0.55;
    headGroup.add(leftBlush);

    const rightBlush = new THREE.Mesh(blushGeo, blushMat);
    rightBlush.position.set(0.48, -0.08, 0.34);
    rightBlush.rotation.y = 0.55;
    headGroup.add(rightBlush);

    // Short Rounded Cream Muzzle
    const muzzleGeo = new THREE.ConeGeometry(0.24, 0.42, 24);
    muzzleGeo.rotateX(Math.PI / 2);
    muzzleGeo.scale(1.25, 0.95, 1.0);
    const muzzleMesh = new THREE.Mesh(muzzleGeo, creamCoatMat);
    muzzleMesh.position.set(0, -0.12, 0.58);
    headGroup.add(muzzleMesh);

    // Shiny Black Button Nose
    const noseGeo = new THREE.SphereGeometry(0.088, 20, 16);
    noseGeo.scale(1.25, 0.85, 1.05);
    const noseMat = new THREE.MeshPhysicalMaterial({
      color: 0x110c0a,
      roughness: 0.1,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });
    const noseMesh = new THREE.Mesh(noseGeo, noseMat);
    noseMesh.position.set(0, -0.06, 0.79);
    headGroup.add(noseMesh);

    // Happy Slightly Open Mouth Cavity
    const mouthGeo = new THREE.SphereGeometry(0.12, 16, 12);
    mouthGeo.scale(1.2, 0.6, 0.8);
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x3d0812 });
    const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
    mouthMesh.position.set(0, -0.22, 0.62);
    headGroup.add(mouthMesh);

    // Soft Pink Tongue Peeking Out
    const tongueGeo = new THREE.CylinderGeometry(0.055, 0.075, 0.18, 16);
    tongueGeo.rotateX(0.7);
    tongueGeo.scale(1.2, 0.4, 1.0);
    const tongueMat = new THREE.MeshPhysicalMaterial({
      color: 0xff6688,
      roughness: 0.25,
      metalness: 0.0,
      clearcoat: 0.6,
      clearcoatRoughness: 0.15
    });
    const tongueMesh = new THREE.Mesh(tongueGeo, tongueMat);
    tongueMesh.position.set(0, -0.23, 0.69);
    headGroup.add(tongueMesh);

    // Glossy Dark Glass Eyes with Crisp Dual Catchlights
    const eyeMat = new THREE.MeshPhysicalMaterial({
      color: 0x0c0704,
      roughness: 0.03,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      ior: 1.52
    });

    const eyeGeo = new THREE.SphereGeometry(0.11, 24, 20);
    const catchlightBigGeo = new THREE.SphereGeometry(0.032, 12, 12);
    const catchlightSmallGeo = new THREE.SphereGeometry(0.018, 10, 10);
    const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function createPuppyEye(isRight) {
      const eyePivot = new THREE.Group();
      const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
      eyePivot.add(eyeMesh);

      // Primary sparkle
      const c1 = new THREE.Mesh(catchlightBigGeo, catchlightMat);
      c1.position.set(isRight ? 0.04 : -0.04, 0.045, 0.088);
      eyePivot.add(c1);

      // Secondary baby sparkle
      const c2 = new THREE.Mesh(catchlightSmallGeo, catchlightMat);
      c2.position.set(isRight ? -0.03 : 0.03, -0.035, 0.095);
      eyePivot.add(c2);

      return eyePivot;
    }

    const leftEye = createPuppyEye(false);
    leftEye.position.set(-0.25, 0.04, 0.54);
    leftEye.rotation.y = -0.25;
    headGroup.add(leftEye);

    const rightEye = createPuppyEye(true);
    rightEye.position.set(0.25, 0.04, 0.54);
    rightEye.rotation.y = 0.25;
    headGroup.add(rightEye);

    // Perky Triangular Ears (High set on crown)
    const earGeo = new THREE.ConeGeometry(0.22, 0.38, 16);
    earGeo.scale(1.0, 1.0, 0.45);
    earGeo.rotateX(0.25);

    const innerEarMat = new THREE.MeshStandardMaterial({
      color: 0xffb7af,
      roughness: 0.75
    });

    const leftEarGroup = new THREE.Group();
    leftEarGroup.position.set(-0.38, 0.52, 0.12);
    leftEarGroup.rotation.set(-0.15, -0.2, 0.3);
    const leftEarOuter = new THREE.Mesh(earGeo, baseCoatMat);
    leftEarGroup.add(leftEarOuter);
    const leftEarInner = new THREE.Mesh(earGeo, innerEarMat);
    leftEarInner.scale.set(0.72, 0.72, 0.5);
    leftEarInner.position.set(0, -0.02, 0.04);
    leftEarGroup.add(leftEarInner);
    headGroup.add(leftEarGroup);

    const rightEarGroup = new THREE.Group();
    rightEarGroup.position.set(0.38, 0.52, 0.12);
    rightEarGroup.rotation.set(-0.15, 0.2, -0.3);
    const rightEarOuter = new THREE.Mesh(earGeo, baseCoatMat);
    rightEarGroup.add(rightEarOuter);
    const rightEarInner = new THREE.Mesh(earGeo, innerEarMat);
    rightEarInner.scale.set(0.72, 0.72, 0.5);
    rightEarInner.position.set(0, -0.02, 0.04);
    rightEarGroup.add(rightEarInner);
    headGroup.add(rightEarGroup);

    // --- Curled Tail Plume (Arches up and rests over back) ---
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 0.45, -0.75);
    puppyGroup.add(tailGroup);

    const tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.45, -0.25),
      new THREE.Vector3(0, 0.85, 0.05),
      new THREE.Vector3(0, 0.95, 0.45),
      new THREE.Vector3(0, 0.82, 0.72)
    ]);
    const tailSpineGeo = new THREE.TubeGeometry(tailCurve, 24, 0.09, 12, false);
    const tailSpineMesh = new THREE.Mesh(tailSpineGeo, creamCoatMat);
    tailGroup.add(tailSpineMesh);

    // --- Legs & Translucent Squishy Jelly Paw Pads ---
    // Cute Pink Translucent Squishy Jelly Paw Pad Material
    const jellyPawPadMat = new THREE.MeshPhysicalMaterial({
      color: 0xff7ea5, // sweet candy strawberry milk pink
      emissive: 0x3d0c18,
      transmission: 0.82,
      thickness: 0.9,
      roughness: 0.14,
      metalness: 0.02,
      ior: 1.45,
      specularIntensity: 1.0,
      clearcoat: 0.95,
      clearcoatRoughness: 0.08,
      attenuationColor: 0xff2a55,
      attenuationDistance: 0.6
    });

    // Helper to build a detailed puppy paw with center pad & 4 toe beans
    function createPuppyPaw() {
      const paw = new THREE.Group();

      // Main metacarpal/palm cushion pad (3-lobed heart shape)
      const mainPadCenterGeo = new THREE.SphereGeometry(0.082, 16, 12);
      mainPadCenterGeo.scale(1.2, 0.45, 0.95);
      const mainPadCenter = new THREE.Mesh(mainPadCenterGeo, jellyPawPadMat);
      paw.add(mainPadCenter);

      const lobeGeo = new THREE.SphereGeometry(0.065, 14, 10);
      lobeGeo.scale(1.0, 0.45, 0.9);
      const lobeL = new THREE.Mesh(lobeGeo, jellyPawPadMat);
      lobeL.position.set(-0.062, 0, -0.04);
      paw.add(lobeL);

      const lobeR = new THREE.Mesh(lobeGeo, jellyPawPadMat);
      lobeR.position.set(0.062, 0, -0.04);
      paw.add(lobeR);

      // 4 tiny cute digital pads (toe beans)
      const toeGeo = new THREE.SphereGeometry(0.044, 14, 10);
      toeGeo.scale(1.0, 0.5, 1.0);

      const toePositions = [
        [-0.105, 0, 0.10],
        [-0.038, 0, 0.14],
        [0.038, 0, 0.14],
        [0.105, 0, 0.10]
      ];
      toePositions.forEach(([tx, ty, tz]) => {
        const toe = new THREE.Mesh(toeGeo, jellyPawPadMat);
        toe.position.set(tx, ty, tz);
        paw.add(toe);
      });

      return paw;
    }

    // Four Legs:
    // 1. Back Right Leg (Sitting tucked)
    const legGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.55, 16);
    const backRightLeg = new THREE.Mesh(legGeo, baseCoatMat);
    backRightLeg.position.set(0.58, 0.05, -0.28);
    backRightLeg.rotation.set(0.6, 0, -0.5);
    puppyGroup.add(backRightLeg);

    const backRightPaw = createPuppyPaw();
    backRightPaw.position.set(0.68, -0.16, -0.05);
    backRightPaw.rotation.set(Math.PI / 2, 0, 0.4);
    puppyGroup.add(backRightPaw);

    // 2. Back Left Leg (Sitting tucked)
    const backLeftLeg = new THREE.Mesh(legGeo, baseCoatMat);
    backLeftLeg.position.set(-0.58, 0.05, -0.28);
    backLeftLeg.rotation.set(0.6, 0, 0.5);
    puppyGroup.add(backLeftLeg);

    const backLeftPaw = createPuppyPaw();
    backLeftPaw.position.set(-0.68, -0.16, -0.05);
    backLeftPaw.rotation.set(Math.PI / 2, 0, -0.4);
    puppyGroup.add(backLeftPaw);

    // 3. Front Right Leg (Resting softly on the jelly cushion)
    const frontRightLeg = new THREE.Mesh(legGeo, creamCoatMat);
    frontRightLeg.position.set(0.36, 0.06, 0.42);
    frontRightLeg.rotation.set(0.15, 0, -0.1);
    puppyGroup.add(frontRightLeg);

    const frontRightPaw = createPuppyPaw();
    frontRightPaw.position.set(0.40, -0.21, 0.50);
    frontRightPaw.rotation.set(Math.PI / 2, 0, 0);
    puppyGroup.add(frontRightPaw);

    // 4. FRONT LEFT LEG (SLIGHTLY RAISED & TURNED UPWARD TO PROMINENTLY SHOW OFF TRANSLUCENT PINK JELLY PAW PADS!)
    const raisedPawGroup = new THREE.Group();
    raisedPawGroup.position.set(-0.42, 0.18, 0.48);
    puppyGroup.add(raisedPawGroup);

    const raisedLegMesh = new THREE.Mesh(legGeo, creamCoatMat);
    raisedLegMesh.rotation.set(-0.55, 0.25, 0.35);
    raisedPawGroup.add(raisedLegMesh);

    const raisedPaw = createPuppyPaw();
    // Facing forward & slightly tilted up towards the camera:
    raisedPaw.position.set(-0.12, 0.22, 0.25);
    raisedPaw.rotation.set(-0.55, 0.35, 0.28);
    raisedPawGroup.add(raisedPaw);

    // ==========================================
    // 6. ULTRA-DENSE 3D FUR SYSTEM (28,000+ STRANDS)
    // ==========================================
    // Low-poly 3D tapered blade/cone for GPU instancing
    const furBladeGeo = new THREE.ConeGeometry(0.022, 1.0, 4, 3, false);
    furBladeGeo.translate(0, 0.5, 0); // Root at y=0, Tip at y=1

    // Shader Uniforms for Dynamic Fur Breeze, Breathing & Mouse Petting
    const furUniforms = {
      uTime: { value: 0 },
      uWindStrength: { value: 0.12 },
      uMouseHit: { value: new THREE.Vector3(999, 999, 999) },
      uPettingRadius: { value: 0.95 },
      uPettingStrength: { value: 0.0 }
    };

    const furMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.78,
      metalness: 0.02
    });

    furMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = furUniforms.uTime;
      shader.uniforms.uWindStrength = furUniforms.uWindStrength;
      shader.uniforms.uMouseHit = furUniforms.uMouseHit;
      shader.uniforms.uPettingRadius = furUniforms.uPettingRadius;
      shader.uniforms.uPettingStrength = furUniforms.uPettingStrength;

      shader.vertexShader = `
        uniform float uTime;
        uniform float uWindStrength;
        uniform vec3 uMouseHit;
        uniform float uPettingRadius;
        uniform float uPettingStrength;
        varying float vHairY;
        ${shader.vertexShader}
      `;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        float h = clamp(position.y, 0.0, 1.0);
        vHairY = h;

        #ifdef USE_INSTANCING
          vec4 worldOrigin = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        #else
          vec4 worldOrigin = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        #endif

        // Natural Multi-frequency Soft Breeze
        float windX = sin(uTime * 3.2 + worldOrigin.x * 4.0 + worldOrigin.z * 3.5) * uWindStrength;
        float windZ = cos(uTime * 2.7 + worldOrigin.y * 4.5 + worldOrigin.x * 2.0) * (uWindStrength * 0.7);
        transformed.x += windX * pow(h, 1.6) * 0.35;
        transformed.z += windZ * pow(h, 1.6) * 0.35;

        // Interactive Mouse Petting Physics (Parts and bends fur strands away from cursor)
        float distToMouse = distance(worldOrigin.xyz, uMouseHit);
        if (distToMouse < uPettingRadius && uPettingStrength > 0.001) {
          float petFactor = smoothstep(uPettingRadius, 0.0, distToMouse) * uPettingStrength;
          transformed.x += (worldOrigin.x - uMouseHit.x) * petFactor * pow(h, 1.8) * 0.6;
          transformed.z += (worldOrigin.z - uMouseHit.z) * petFactor * pow(h, 1.8) * 0.6;
          transformed.y -= petFactor * pow(h, 2.0) * 0.25;
        }
        `
      );

      shader.fragmentShader = `
        varying float vHairY;
        ${shader.fragmentShader}
      `;

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <color_fragment>',
        `
        #include <color_fragment>
        // Multi-tone root-to-tip subtle depth shading and sunny tip highlights
        diffuseColor.rgb *= mix(vec3(0.78, 0.72, 0.68), vec3(1.15, 1.10, 1.05), pow(vHairY, 0.9));
        diffuseColor.rgb += vec3(0.08, 0.06, 0.04) * pow(vHairY, 2.2);
        `
      );
    };

    // Color Palettes
    const colGoldenSable = new THREE.Color('#cb6c18'); // warm orange-sable
    const colGoldenApricot = new THREE.Color('#df862e'); // golden apricot
    const colWarmHoney = new THREE.Color('#ec9e47'); // warm honey
    const colCreamTransition = new THREE.Color('#faebd4'); // soft cream transition
    const colCreamWhite = new THREE.Color('#fff9ef'); // pure fluffy cream white

    const dummyMatrix = new THREE.Matrix4();
    const dummyQuat = new THREE.Quaternion();
    const upVector = new THREE.Vector3(0, 1, 0);

    // 6.1 Body & Chest Mane Fur (11,000 strands)
    const BODY_STRANDS = 11000;
    const bodyFurMesh = new THREE.InstancedMesh(furBladeGeo, furMaterial, BODY_STRANDS);
    bodyFurMesh.castShadow = true;
    bodyFurMesh.receiveShadow = true;

    for (let i = 0; i < BODY_STRANDS; i++) {
      // Golden ratio spherical distribution on body & chest mane
      const u = Math.random() * 2 - 1;
      const phi = Math.random() * Math.PI * 2;
      const sqrtU = Math.sqrt(Math.max(0, 1 - u * u));

      let isMane = Math.random() < 0.45; // 45% dense lion chest mane
      let x, y, z, nx, ny, nz, len, strandCol;

      if (isMane) {
        // Lion-like chest mane puff (centered forward and wide)
        x = sqrtU * Math.cos(phi) * 0.74;
        y = u * 0.78 + 0.48;
        z = Math.abs(sqrtU * Math.sin(phi)) * 0.62 + 0.35;

        nx = x / 0.74;
        ny = (y - 0.48) / 0.78;
        nz = (z - 0.35) / 0.62;

        len = 0.36 + Math.random() * 0.16; // extra long lion ruff!
        strandCol = colCreamWhite.clone().lerp(colCreamTransition, Math.random() * 0.25);
      } else {
        // Torso & Back saddle
        x = sqrtU * Math.cos(phi) * 0.85;
        y = u * 0.78 + 0.28;
        z = sqrtU * Math.sin(phi) * 1.05 - 0.08;

        nx = x / 0.85;
        ny = (y - 0.28) / 0.78;
        nz = (z + 0.08) / 1.05;

        len = 0.26 + Math.random() * 0.12;

        if (y > 0.45 && z < 0.2) {
          // Rich golden apricot / orange sable on spine & back
          strandCol = colGoldenSable.clone().lerp(colGoldenApricot, Math.random() * 0.7);
        } else if (y < 0.1) {
          // Soft cream belly
          strandCol = colCreamWhite.clone().lerp(colCreamTransition, 0.4);
        } else {
          strandCol = colWarmHoney.clone().lerp(colCreamTransition, 0.5);
        }
      }

      const norm = new THREE.Vector3(nx, ny, nz).normalize();
      // Natural outward fluff & subtle gravity sag
      norm.y -= 0.12;
      norm.x += (Math.random() - 0.5) * 0.22;
      norm.z += (Math.random() - 0.5) * 0.22;
      norm.normalize();

      dummyQuat.setFromUnitVectors(upVector, norm);
      dummyMatrix.compose(
        new THREE.Vector3(x, y, z),
        dummyQuat,
        new THREE.Vector3(1.1, len, 1.1)
      );

      bodyFurMesh.setMatrixAt(i, dummyMatrix);
      bodyFurMesh.setColorAt(i, strandCol);
    }
    bodyFurMesh.instanceMatrix.needsUpdate = true;
    bodyFurMesh.instanceColor.needsUpdate = true;
    bodyGroup.add(bodyFurMesh);

    // 6.2 Head, Cheeks & Crown Fur (8,000 strands)
    const HEAD_STRANDS = 8000;
    const headFurMesh = new THREE.InstancedMesh(furBladeGeo, furMaterial, HEAD_STRANDS);
    headFurMesh.castShadow = true;
    headFurMesh.receiveShadow = true;

    for (let i = 0; i < HEAD_STRANDS; i++) {
      const u = Math.random() * 2 - 1;
      const phi = Math.random() * Math.PI * 2;
      const sqrtU = Math.sqrt(Math.max(0, 1 - u * u));

      let x = sqrtU * Math.cos(phi) * 0.65;
      let y = u * 0.60;
      let z = sqrtU * Math.sin(phi) * 0.64;

      let len = 0.22 + Math.random() * 0.12;
      let strandCol;

      // Chubby cheeks outward flair
      if (Math.abs(x) > 0.28 && y < 0.05 && z > -0.05) {
        x *= 1.25;
        len = 0.32 + Math.random() * 0.14; // long fluffy cheeks!
        strandCol = colCreamWhite.clone().lerp(colCreamTransition, Math.random() * 0.2);
      } else if (z > 0.42 && y < 0.05 && Math.abs(x) < 0.22) {
        // Short soft muzzle fur
        len = 0.08 + Math.random() * 0.05;
        strandCol = colCreamWhite;
      } else if (y > 0.2) {
        // Golden crown & forehead
        strandCol = colGoldenApricot.clone().lerp(colWarmHoney, Math.random() * 0.6);
      } else {
        strandCol = colWarmHoney.clone().lerp(colCreamWhite, Math.random() * 0.4);
      }

      const norm = new THREE.Vector3(x, y + 0.05, z).normalize();
      norm.x += (Math.random() - 0.5) * 0.18;
      norm.y += (Math.random() - 0.5) * 0.15;
      norm.z += (Math.random() - 0.5) * 0.18;
      norm.normalize();

      dummyQuat.setFromUnitVectors(upVector, norm);
      dummyMatrix.compose(
        new THREE.Vector3(x, y, z),
        dummyQuat,
        new THREE.Vector3(0.9, len, 0.9)
      );

      headFurMesh.setMatrixAt(i, dummyMatrix);
      headFurMesh.setColorAt(i, strandCol);
    }
    headFurMesh.instanceMatrix.needsUpdate = true;
    headFurMesh.instanceColor.needsUpdate = true;
    headGroup.add(headFurMesh);

    // 6.3 Ears Fringe Fur (1,800 strands)
    const EAR_STRANDS = 1800;
    const earFurMesh = new THREE.InstancedMesh(furBladeGeo, furMaterial, EAR_STRANDS);

    for (let i = 0; i < EAR_STRANDS; i++) {
      const isLeft = i < EAR_STRANDS / 2;
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.22;
      const h = Math.random() * 0.36;

      const x = (isLeft ? -0.38 : 0.38) + Math.cos(angle) * r;
      const y = 0.48 + h;
      const z = 0.12 + Math.sin(angle) * r * 0.4;

      const norm = new THREE.Vector3(isLeft ? -0.4 : 0.4, 0.6, 0.1).normalize();
      norm.x += (Math.random() - 0.5) * 0.3;
      norm.y += (Math.random() - 0.5) * 0.2;
      norm.normalize();

      const len = 0.14 + Math.random() * 0.12;
      const strandCol = colGoldenApricot.clone().lerp(colCreamWhite, Math.random() * 0.5);

      dummyQuat.setFromUnitVectors(upVector, norm);
      dummyMatrix.compose(
        new THREE.Vector3(x, y, z),
        dummyQuat,
        new THREE.Vector3(0.7, len, 0.7)
      );

      earFurMesh.setMatrixAt(i, dummyMatrix);
      earFurMesh.setColorAt(i, strandCol);
    }
    earFurMesh.instanceMatrix.needsUpdate = true;
    earFurMesh.instanceColor.needsUpdate = true;
    headGroup.add(earFurMesh);

    // 6.4 Curled Plume Tail Fur (4,800 strands radiating outward like a lion plume)
    const TAIL_STRANDS = 4800;
    const tailFurMesh = new THREE.InstancedMesh(furBladeGeo, furMaterial, TAIL_STRANDS);
    tailFurMesh.castShadow = true;

    for (let i = 0; i < TAIL_STRANDS; i++) {
      const t = Math.random();
      const pt = tailCurve.getPoint(t);
      const tangent = tailCurve.getTangent(t);

      // Radial plume radiating outward around tail curve
      const angle = Math.random() * Math.PI * 2;
      const spreadR = 0.08 + Math.random() * 0.06;

      // Create perpendicular vector to tangent
      const normalAxis = new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0);
      normalAxis.cross(tangent).normalize();

      const x = pt.x + normalAxis.x * spreadR;
      const y = pt.y + normalAxis.y * spreadR;
      const z = pt.z + normalAxis.z * spreadR;

      const norm = normalAxis.clone();
      norm.y += 0.2; // fluffing upwards
      norm.normalize();

      const len = 0.38 + Math.random() * 0.18; // long luxurious tail plume!
      const strandCol = t < 0.25
        ? colGoldenSable.clone().lerp(colGoldenApricot, t * 4.0)
        : colGoldenApricot.clone().lerp(colCreamWhite, (t - 0.25) * 1.33);

      dummyQuat.setFromUnitVectors(upVector, norm);
      dummyMatrix.compose(
        new THREE.Vector3(x, y, z),
        dummyQuat,
        new THREE.Vector3(1.0, len, 1.0)
      );

      tailFurMesh.setMatrixAt(i, dummyMatrix);
      tailFurMesh.setColorAt(i, strandCol);
    }
    tailFurMesh.instanceMatrix.needsUpdate = true;
    tailFurMesh.instanceColor.needsUpdate = true;
    tailGroup.add(tailFurMesh);

    // 6.5 Legs Fur (3,200 strands)
    const LEG_STRANDS = 3200;
    const legFurMesh = new THREE.InstancedMesh(furBladeGeo, furMaterial, LEG_STRANDS);
    legFurMesh.castShadow = true;

    for (let i = 0; i < LEG_STRANDS; i++) {
      const legChoice = Math.floor(Math.random() * 4);
      let lx, ly, lz, len, strandCol;

      if (legChoice === 0) {
        // Back right
        lx = 0.58 + (Math.random() - 0.5) * 0.35;
        ly = (Math.random() - 0.5) * 0.35;
        lz = -0.25 + (Math.random() - 0.5) * 0.35;
        strandCol = colGoldenApricot;
        len = 0.22;
      } else if (legChoice === 1) {
        // Back left
        lx = -0.58 + (Math.random() - 0.5) * 0.35;
        ly = (Math.random() - 0.5) * 0.35;
        lz = -0.25 + (Math.random() - 0.5) * 0.35;
        strandCol = colGoldenApricot;
        len = 0.22;
      } else if (legChoice === 2) {
        // Front right
        lx = 0.36 + (Math.random() - 0.5) * 0.25;
        ly = (Math.random() - 0.5) * 0.32;
        lz = 0.42 + (Math.random() - 0.5) * 0.25;
        strandCol = colCreamWhite;
        len = 0.20;
      } else {
        // Front left (Raised leg)
        lx = -0.38 + (Math.random() - 0.5) * 0.25;
        ly = 0.12 + (Math.random() - 0.5) * 0.32;
        lz = 0.42 + (Math.random() - 0.5) * 0.25;
        strandCol = colCreamWhite;
        len = 0.18;
      }

      const norm = new THREE.Vector3(lx, -0.2, lz).normalize();
      norm.x += (Math.random() - 0.5) * 0.2;
      norm.z += (Math.random() - 0.5) * 0.2;
      norm.normalize();

      dummyQuat.setFromUnitVectors(upVector, norm);
      dummyMatrix.compose(
        new THREE.Vector3(lx, ly, lz),
        dummyQuat,
        new THREE.Vector3(0.85, len, 0.85)
      );

      legFurMesh.setMatrixAt(i, dummyMatrix);
      legFurMesh.setColorAt(i, strandCol);
    }
    legFurMesh.instanceMatrix.needsUpdate = true;
    legFurMesh.instanceColor.needsUpdate = true;
    puppyGroup.add(legFurMesh);

    // TOTAL 3D FUR STRANDS = 11,000 + 8,000 + 1,800 + 4,800 + 3,200 = 28,800 strands!

    // ==========================================
    // 7. INTERACTIVE MOUSE PETTING & JELLY WOBBLE
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    const interactiveTargets = [jellyMesh, torsoMesh, chestMesh, headMesh, leftCheek, rightCheek];

    let jellyJiggleImpulse = 0.0;
    let targetPettingStrength = 0.0;

    function handlePointer(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveTargets, false);

      if (intersects.length > 0) {
        const hit = intersects[0];
        if (hit.object === jellyMesh) {
          // Touch jelly -> trigger elastic wobble ripple
          jellyJiggleImpulse = Math.min(jellyJiggleImpulse + 0.25, 1.2);
        } else {
          // Touch puppy -> pet fur!
          furUniforms.uMouseHit.value.copy(hit.point);
          targetPettingStrength = 1.0;
        }
      } else {
        targetPettingStrength = 0.0;
      }
    }

    window.addEventListener('pointermove', handlePointer);
    window.addEventListener('pointerdown', (e) => {
      handlePointer(e);
      jellyJiggleImpulse = Math.min(jellyJiggleImpulse + 0.45, 1.5);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 8. LIFELIKE ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      // 1. Puppy Gentle Chest Breathing
      const breathe = Math.sin(time * 2.8);
      chestMesh.scale.set(1.0 + breathe * 0.035, 1.05 + breathe * 0.03, 0.9 + breathe * 0.03);
      torsoMesh.scale.set(1.05 + breathe * 0.02, 0.95 + breathe * 0.02, 1.25 + breathe * 0.015);
      puppyGroup.position.y = 1.25 + breathe * 0.012;

      // 2. Playful Inquisitive Head Tilts
      headGroup.rotation.z = Math.sin(time * 0.85) * 0.06 + Math.sin(time * 1.6) * 0.02;
      headGroup.rotation.y = Math.sin(time * 0.55) * 0.09;
      headGroup.rotation.x = Math.sin(time * 1.2) * 0.035 - 0.03;

      // 3. Perky Ear Twitches
      const earTwitchCycle = (time * 0.6) % 3.5;
      let earTwitch = 0;
      if (earTwitchCycle < 0.25) {
        earTwitch = Math.sin((earTwitchCycle / 0.25) * Math.PI * 4) * 0.15;
      }
      leftEarGroup.rotation.z = 0.3 + earTwitch;
      rightEarGroup.rotation.z = -0.3 - earTwitch * 0.7;

      // 4. Happy Rapid Tail Wagging
      const tailWag = Math.sin(time * 6.2) * 0.24;
      tailGroup.rotation.y = tailWag;
      tailGroup.rotation.z = Math.cos(time * 6.2) * 0.09;

      // 5. Natural Eye Blinking Cycle
      const blinkCycle = (time * 0.28) % 1.0;
      const eyeScaleY = (blinkCycle > 0.95) ? 0.06 : 1.0;
      leftEye.scale.y = eyeScaleY;
      rightEye.scale.y = eyeScaleY;

      // 6. Raised Paw Cute Gentle Hover
      raisedPawGroup.position.y = 0.18 + Math.sin(time * 2.2) * 0.025;
      raisedPawGroup.rotation.z = Math.sin(time * 1.8) * 0.04;

      // 7. Translucent Jelly Cushion Elastic Wobble & Breathing Squish
      const jellyBreathingSquish = Math.sin(time * 2.8) * 0.018;
      const jiggleWave = Math.sin(time * 18.0) * jellyJiggleImpulse * 0.035;

      jellyMesh.scale.set(
        1.0 - jellyBreathingSquish + jiggleWave,
        1.0 + jellyBreathingSquish * 1.6 - jiggleWave * 1.4,
        1.0 - jellyBreathingSquish + jiggleWave
      );
      jellyJiggleImpulse *= 0.94; // smooth exponential decay

      // 8. Update Fur Shader Uniforms (Wind breeze + mouse petting)
      furUniforms.uTime.value = time;
      furUniforms.uPettingStrength.value = THREE.MathUtils.lerp(
        furUniforms.uPettingStrength.value,
        targetPettingStrength,
        0.08
      );

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
