<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ultra-Fluffy Baby Koala Hugging Eucalyptus Branch</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #121815;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    display: block;
    outline: none;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
<canvas id="webgl-canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Scene & Renderer Setup ---
const canvas = document.getElementById('webgl-canvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x131a16);
scene.fog = new THREE.FogExp2(0x131a16, 0.08);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(1.9, 0.9, 2.6);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0.1, 0.25, 0.1);
controls.minDistance = 1.2;
controls.maxDistance = 6.0;
controls.maxPolarAngle = Math.PI * 0.75;

// --- Procedural Environment Map ---
const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

const envCanvas = document.createElement('canvas');
envCanvas.width = 512;
envCanvas.height = 256;
const envCtx = envCanvas.getContext('2d');
const envGrad = envCtx.createLinearGradient(0, 0, 0, 256);
envGrad.addColorStop(0, '#5a7065');   // soft canopy skylight
envGrad.addColorStop(0.4, '#9bb3a8'); // warm horizon glow
envGrad.addColorStop(0.7, '#38483f'); // forest floor
envGrad.addColorStop(1, '#1b241e');
envCtx.fillStyle = envGrad;
envCtx.fillRect(0, 0, 512, 256);

// Soft sun dapples
for (let i = 0; i < 20; i++) {
  const x = Math.random() * 512;
  const y = Math.random() * 150;
  const r = 20 + Math.random() * 45;
  const spotGrad = envCtx.createRadialGradient(x, y, 0, x, y, r);
  spotGrad.addColorStop(0, 'rgba(255, 250, 230, 0.55)');
  spotGrad.addColorStop(1, 'rgba(255, 250, 230, 0)');
  envCtx.fillStyle = spotGrad;
  envCtx.beginPath();
  envCtx.arc(x, y, r, 0, Math.PI * 2);
  envCtx.fill();
}

const envTexture = new THREE.CanvasTexture(envCanvas);
envTexture.mapping = THREE.EquirectangularReflectionMapping;
const envMap = pmremGenerator.fromEquirectangular(envTexture).texture;
scene.environment = envMap;
pmremGenerator.dispose();
envTexture.dispose();

// --- Studio & Forest Lighting ---
const keyLight = new THREE.DirectionalLight(0xfffaed, 2.2);
keyLight.position.set(2.8, 3.8, 2.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0004;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 10;
keyLight.shadow.camera.left = -1.8;
keyLight.shadow.camera.right = 1.8;
keyLight.shadow.camera.top = 1.8;
keyLight.shadow.camera.bottom = -1.8;
keyLight.shadow.radius = 2.5;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xffecd6, 1.8);
rimLight.position.set(-2.5, 2.0, -3.0);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x8cb6d4, 0.85);
fillLight.position.set(-2.5, 1.5, 2.0);
scene.add(fillLight);

const bounceLight = new THREE.DirectionalLight(0xd9c2a7, 0.6);
bounceLight.position.set(0.5, -2.5, 1.0);
scene.add(bounceLight);

const hemiLight = new THREE.HemisphereLight(0xebf2ec, 0x1f2923, 0.7);
scene.add(hemiLight);

// --- Procedural Bark Textures ---
function createEucalyptusBarkTexture() {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#b8b4a8';
  ctx.fillRect(0, 0, 1024, 1024);

  // Grain lines
  for (let x = 0; x < 1024; x += 2) {
    const v = Math.sin(x * 0.15) * 15 + Math.random() * 25;
    ctx.fillStyle = `rgba(${160 + v}, ${155 + v}, ${145 + v}, 0.25)`;
    ctx.fillRect(x, 0, 1 + Math.random() * 2, 1024);
  }

  // Peeling ribbons
  const colors = ['#8f9c89', '#dcd8c8', '#e8e5d8', '#73614d', '#4d3e33', '#a3aa9a'];
  for (let i = 0; i < 95; i++) {
    const px = Math.random() * 1024;
    const py = Math.random() * 1024;
    const pw = 25 + Math.random() * 80;
    const ph = 120 + Math.random() * 350;
    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    ctx.globalAlpha = 0.55 + Math.random() * 0.35;
    ctx.fillRect(px, py, pw, ph);

    ctx.strokeStyle = '#2b2118';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.moveTo(px + pw, py);
    ctx.lineTo(px + pw, py + ph);
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1.5, 4);
  return tex;
}

function createEucalyptusBumpTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, 512, 512);

  for (let i = 0; i < 60; i++) {
    const px = Math.random() * 512;
    const py = Math.random() * 512;
    const pw = 15 + Math.random() * 50;
    const ph = 80 + Math.random() * 200;
    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#333333';
    ctx.globalAlpha = 0.25;
    ctx.fillRect(px, py, pw, ph);
  }
  ctx.globalAlpha = 1.0;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1.5, 4);
  return tex;
}

const barkTex = createEucalyptusBarkTexture();
const barkBump = createEucalyptusBumpTexture();
const trunkMat = new THREE.MeshStandardMaterial({
  map: barkTex,
  bumpMap: barkBump,
  bumpScale: 0.04,
  roughness: 0.85,
  metalness: 0.05
});

// --- Diagonal Eucalyptus Trunk ---
const trunkCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.8, -1.8, -0.4),
  new THREE.Vector3(-0.9, -0.9, -0.2),
  new THREE.Vector3(0.0, 0.0, 0.0),
  new THREE.Vector3(0.9, 0.9, 0.2),
  new THREE.Vector3(1.8, 1.8, 0.4)
]);
const trunkGeo = new THREE.TubeGeometry(trunkCurve, 64, 0.32, 24, false);
const trunkPos = trunkGeo.attributes.position;
for (let i = 0; i < trunkPos.count; i++) {
  const vx = trunkPos.getX(i);
  const vy = trunkPos.getY(i);
  const vz = trunkPos.getZ(i);
  const noise = (Math.sin(vx * 7.0 + vy * 5.0) + Math.cos(vz * 6.0)) * 0.015;
  trunkPos.setXYZ(i, vx + noise, vy + noise * 0.5, vz + noise);
}
trunkGeo.computeVertexNormals();

const trunkMesh = new THREE.Mesh(trunkGeo, trunkMat);
trunkMesh.castShadow = true;
trunkMesh.receiveShadow = true;
scene.add(trunkMesh);

// Side branches
const branch1Curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.7, 0.7, 0.15),
  new THREE.Vector3(1.2, 0.95, -0.1),
  new THREE.Vector3(1.7, 1.15, -0.3)
]);
const branch1Mesh = new THREE.Mesh(new THREE.TubeGeometry(branch1Curve, 24, 0.09, 16, false), trunkMat);
branch1Mesh.castShadow = true;
branch1Mesh.receiveShadow = true;
scene.add(branch1Mesh);

const branch2Curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.7, -0.7, -0.15),
  new THREE.Vector3(-1.1, -0.5, 0.2),
  new THREE.Vector3(-1.5, -0.35, 0.4)
]);
const branch2Mesh = new THREE.Mesh(new THREE.TubeGeometry(branch2Curve, 24, 0.08, 16, false), trunkMat);
branch2Mesh.castShadow = true;
branch2Mesh.receiveShadow = true;
scene.add(branch2Mesh);

// --- Eucalyptus Leaves ---
function createEucalyptusLeafGeometry() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.04, 0.12, 0.07, 0.32, 0.05, 0.55);
  shape.bezierCurveTo(0.02, 0.72, 0.01, 0.82, 0.0, 0.95);
  shape.bezierCurveTo(-0.02, 0.78, -0.06, 0.52, -0.05, 0.28);
  shape.bezierCurveTo(-0.04, 0.12, -0.02, 0.04, 0, 0);

  const geom = new THREE.ShapeGeometry(shape, 12);
  const pos = geom.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const zArch = Math.sin(y * Math.PI) * 0.05 - (x * x) * 4.0;
    pos.setZ(i, zArch);
  }
  geom.computeVertexNormals();
  return geom;
}

const leafGeo = createEucalyptusLeafGeometry();
const leafMat = new THREE.MeshStandardMaterial({
  color: 0x5b8270,
  roughness: 0.38,
  metalness: 0.05,
  side: THREE.DoubleSide
});

const leafGroup = new THREE.Group();
const leafMeshes = [];

function addLeafCluster(origin, count, dir, spread) {
  for (let i = 0; i < count; i++) {
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    const scale = 0.28 + Math.random() * 0.16;
    leaf.scale.set(scale, scale, scale);
    
    const offset = new THREE.Vector3(
      (Math.random() - 0.5) * spread,
      (Math.random() - 0.5) * spread,
      (Math.random() - 0.5) * spread
    );
    leaf.position.copy(origin).add(offset);
    leaf.rotation.set(
      dir.x + (Math.random() - 0.5) * 0.8,
      dir.y + (Math.random() - 0.5) * 0.8,
      dir.z + (Math.random() - 0.5) * 0.8
    );
    leaf.castShadow = true;
    leafGroup.add(leaf);
    leafMeshes.push({
      mesh: leaf,
      baseRotX: leaf.rotation.x,
      baseRotY: leaf.rotation.y,
      baseRotZ: leaf.rotation.z,
      phase: Math.random() * Math.PI * 2,
      speed: 1.5 + Math.random() * 1.5
    });
  }
}

addLeafCluster(new THREE.Vector3(1.6, 1.2, -0.3), 16, new THREE.Vector3(-0.4, 0.5, -0.6), 0.4);
addLeafCluster(new THREE.Vector3(1.2, 1.0, -0.1), 12, new THREE.Vector3(-0.2, 0.2, -0.4), 0.35);
addLeafCluster(new THREE.Vector3(1.7, 1.8, 0.35), 14, new THREE.Vector3(0.2, 0.6, -0.3), 0.4);
addLeafCluster(new THREE.Vector3(-1.4, -0.4, 0.35), 14, new THREE.Vector3(0.4, -0.3, 0.5), 0.35);
scene.add(leafGroup);

// --- Koala Body Hierarchy ---
const koalaRoot = new THREE.Group();
koalaRoot.position.set(0.05, 0.08, 0.18);
scene.add(koalaRoot);

const koalaBody = new THREE.Group();
koalaRoot.add(koalaBody);

const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x828583,
  roughness: 0.9,
  metalness: 0.02
});

const bodyGeo = new THREE.SphereGeometry(0.38, 32, 24);
bodyGeo.scale(0.92, 1.15, 0.95);
const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
bodyMesh.castShadow = true;
koalaBody.add(bodyMesh);

const koalaHead = new THREE.Group();
koalaHead.position.set(0.02, 0.52, 0.08);
koalaRoot.add(koalaHead);

const headGeo = new THREE.SphereGeometry(0.35, 32, 24);
headGeo.scale(1.05, 0.98, 1.0);
const headMesh = new THREE.Mesh(headGeo, bodyMat);
headMesh.castShadow = true;
koalaHead.add(headMesh);

// --- Iconic Koala Face: Leathery Charcoal Nose ---
function createNoseTexture() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1c1d1e';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    ctx.fillStyle = Math.random() > 0.5 ? '#27292a' : '#141516';
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  return new THREE.CanvasTexture(c);
}

const noseGeo = new THREE.SphereGeometry(0.12, 24, 20);
noseGeo.scale(1.08, 1.45, 0.85);
const noseMat = new THREE.MeshStandardMaterial({
  color: 0x18191a,
  map: createNoseTexture(),
  roughness: 0.62,
  metalness: 0.08
});
const noseMesh = new THREE.Mesh(noseGeo, noseMat);
noseMesh.position.set(0, 0.02, 0.32);
noseMesh.rotation.x = -0.08;
noseMesh.castShadow = true;
koalaHead.add(noseMesh);

// Nostril Slits
const nostrilGeo = new THREE.SphereGeometry(0.028, 12, 8);
nostrilGeo.scale(0.65, 1.4, 0.5);
const nostrilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });

const leftNostril = new THREE.Mesh(nostrilGeo, nostrilMat);
leftNostril.position.set(-0.042, -0.05, 0.38);
leftNostril.rotation.set(0.2, 0, 0.3);
koalaHead.add(leftNostril);

const rightNostril = new THREE.Mesh(nostrilGeo, nostrilMat);
rightNostril.position.set(0.042, -0.05, 0.38);
rightNostril.rotation.set(0.2, 0, -0.3);
koalaHead.add(rightNostril);

// --- Glossy Eyes with Catchlights & Sleepy Eyelids ---
const eyeGroupLeft = new THREE.Group();
const eyeGroupRight = new THREE.Group();
eyeGroupLeft.position.set(-0.165, 0.08, 0.285);
eyeGroupRight.position.set(0.165, 0.08, 0.285);
koalaHead.add(eyeGroupLeft);
koalaHead.add(eyeGroupRight);

const eyeGeo = new THREE.SphereGeometry(0.045, 24, 24);
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x090706,
  roughness: 0.03,
  metalness: 0.1
});
const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
eyeGroupLeft.add(leftEye);
eyeGroupRight.add(rightEye);

const catchlightGeo = new THREE.SphereGeometry(0.009, 12, 12);
const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const leftCatch = new THREE.Mesh(catchlightGeo, catchlightMat);
leftCatch.position.set(0.014, 0.016, 0.038);
eyeGroupLeft.add(leftCatch);

const rightCatch = new THREE.Mesh(catchlightGeo, catchlightMat);
rightCatch.position.set(-0.014, 0.016, 0.038);
eyeGroupRight.add(rightCatch);

const subCatchGeo = new THREE.SphereGeometry(0.0045, 8, 8);
const leftSubCatch = new THREE.Mesh(subCatchGeo, catchlightMat);
leftSubCatch.position.set(-0.012, -0.014, 0.039);
eyeGroupLeft.add(leftSubCatch);
const rightSubCatch = new THREE.Mesh(subCatchGeo, catchlightMat);
rightSubCatch.position.set(0.012, -0.014, 0.039);
eyeGroupRight.add(rightSubCatch);

// Sleepy Eyelids
const upperLidGeo = new THREE.SphereGeometry(0.048, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.52);
const lidMat = new THREE.MeshStandardMaterial({
  color: 0x767a78,
  roughness: 0.85
});
const leftUpperLid = new THREE.Mesh(upperLidGeo, lidMat);
leftUpperLid.rotation.x = 0.25;
eyeGroupLeft.add(leftUpperLid);

const rightUpperLid = new THREE.Mesh(upperLidGeo, lidMat);
rightUpperLid.rotation.x = 0.25;
eyeGroupRight.add(rightUpperLid);

// --- Large Round Ears & Warm Pink Inner Ears ---
const leftEarGroup = new THREE.Group();
leftEarGroup.position.set(-0.35, 0.26, 0.02);
leftEarGroup.rotation.set(0.12, -0.22, 0.35);
koalaHead.add(leftEarGroup);

const rightEarGroup = new THREE.Group();
rightEarGroup.position.set(0.35, 0.26, 0.02);
rightEarGroup.rotation.set(0.12, 0.22, -0.35);
koalaHead.add(rightEarGroup);

const earDiskGeo = new THREE.CylinderGeometry(0.20, 0.21, 0.035, 32);
earDiskGeo.rotateX(Math.PI / 2);
const earBackMeshL = new THREE.Mesh(earDiskGeo, bodyMat);
leftEarGroup.add(earBackMeshL);
const earBackMeshR = new THREE.Mesh(earDiskGeo, bodyMat);
rightEarGroup.add(earBackMeshR);

const innerEarGeo = new THREE.CircleGeometry(0.14, 24);
const innerEarMat = new THREE.MeshStandardMaterial({
  color: 0xdda09e,
  roughness: 0.75,
  metalness: 0.02
});
const innerEarMeshL = new THREE.Mesh(innerEarGeo, innerEarMat);
innerEarMeshL.position.set(0, 0, 0.02);
leftEarGroup.add(innerEarMeshL);

const innerEarMeshR = new THREE.Mesh(innerEarGeo, innerEarMat);
innerEarMeshR.position.set(0, 0, 0.02);
rightEarGroup.add(innerEarMeshR);

// --- Limbs & Curved Gripping Claws ---
const armGeo = new THREE.CylinderGeometry(0.09, 0.11, 0.48, 16);
const clawGeo = new THREE.ConeGeometry(0.013, 0.065, 8);
clawGeo.rotateX(-Math.PI / 2);
const clawMat = new THREE.MeshStandardMaterial({
  color: 0x222325,
  roughness: 0.35,
  metalness: 0.2
});

// Left Arm
const leftArm = new THREE.Group();
leftArm.position.set(-0.28, 0.12, 0.15);
leftArm.rotation.set(0.4, -0.3, 0.75);
const leftArmMesh = new THREE.Mesh(armGeo, bodyMat);
leftArmMesh.castShadow = true;
leftArm.add(leftArmMesh);
koalaRoot.add(leftArm);

for (let c = 0; c < 5; c++) {
  const claw = new THREE.Mesh(clawGeo, clawMat);
  claw.position.set((c - 2) * 0.028, -0.25, 0.05 + Math.sin(c * 0.6) * 0.015);
  claw.rotation.set(0.6, (c - 2) * 0.2, 0);
  leftArm.add(claw);
}

// Right Arm
const rightArm = new THREE.Group();
rightArm.position.set(0.32, 0.08, 0.18);
rightArm.rotation.set(0.4, 0.35, -0.85);
const rightArmMesh = new THREE.Mesh(armGeo, bodyMat);
rightArmMesh.castShadow = true;
rightArm.add(rightArmMesh);
koalaRoot.add(rightArm);

for (let c = 0; c < 5; c++) {
  const claw = new THREE.Mesh(clawGeo, clawMat);
  claw.position.set((c - 2) * 0.028, -0.25, 0.05 + Math.sin(c * 0.6) * 0.015);
  claw.rotation.set(0.6, (c - 2) * -0.2, 0);
  rightArm.add(claw);
}

// Legs
const legGeo = new THREE.CylinderGeometry(0.11, 0.13, 0.44, 16);

const leftLeg = new THREE.Group();
leftLeg.position.set(-0.25, -0.32, 0.08);
leftLeg.rotation.set(-0.35, -0.3, 0.55);
const leftLegMesh = new THREE.Mesh(legGeo, bodyMat);
leftLegMesh.castShadow = true;
leftLeg.add(leftLegMesh);
koalaRoot.add(leftLeg);

for (let c = 0; c < 4; c++) {
  const claw = new THREE.Mesh(clawGeo, clawMat);
  claw.position.set((c - 1.5) * 0.03, -0.23, 0.06);
  claw.rotation.set(0.5, (c - 1.5) * 0.2, 0);
  leftLeg.add(claw);
}

const rightLeg = new THREE.Group();
rightLeg.position.set(0.26, -0.35, 0.08);
rightLeg.rotation.set(-0.35, 0.3, -0.55);
const rightLegMesh = new THREE.Mesh(legGeo, bodyMat);
rightLegMesh.castShadow = true;
rightLeg.add(rightLegMesh);
koalaRoot.add(rightLeg);

for (let c = 0; c < 4; c++) {
  const claw = new THREE.Mesh(clawGeo, clawMat);
  claw.position.set((c - 1.5) * 0.03, -0.23, 0.06);
  claw.rotation.set(0.5, (c - 1.5) * -0.2, 0);
  rightLeg.add(claw);
}

// --- 3D FUR STRANDS (32,000+ INSTANCES) ---
const strandGeo = new THREE.CylinderGeometry(0.001, 0.005, 0.1, 3, 1, false);
strandGeo.translate(0, 0.05, 0);

const furUniforms = {
  uTime: { value: 0 },
  uMouseWorld: { value: new THREE.Vector3(999, 999, 999) },
  uMouseStrength: { value: 0.0 },
  uBreath: { value: 0.0 }
};

const furMaterial = new THREE.MeshStandardMaterial({
  roughness: 0.88,
  metalness: 0.04,
  side: THREE.DoubleSide
});

furMaterial.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = furUniforms.uTime;
  shader.uniforms.uMouseWorld = furUniforms.uMouseWorld;
  shader.uniforms.uMouseStrength = furUniforms.uMouseStrength;
  shader.uniforms.uBreath = furUniforms.uBreath;

  shader.vertexShader = `
    uniform float uTime;
    uniform vec3 uMouseWorld;
    uniform float uMouseStrength;
    uniform float uBreath;
    varying float vTip;
  ` + shader.vertexShader;

  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `
    #include <begin_vertex>
    float tip = clamp(position.y / 0.1, 0.0, 1.0);
    vTip = tip;
    
    vec4 wInstRoot = modelMatrix * (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0));
    
    // Breeze wave
    float wave = sin(uTime * 3.0 + wInstRoot.x * 4.0 + wInstRoot.y * 3.0);
    vec3 wind = vec3(wave * 0.015, sin(uTime * 3.8 + wInstRoot.z * 4.0) * 0.008, cos(uTime * 2.2) * 0.01) * tip;
    
    // Breathing sway
    vec3 breathSway = vec3(0.0, uBreath * 0.012, uBreath * 0.01) * tip;
    
    // Interactive mouse petting fluff effect
    vec3 toMouse = wInstRoot.xyz - uMouseWorld;
    float dist = length(toMouse);
    float petFactor = smoothstep(0.48, 0.0, dist) * uMouseStrength;
    vec3 fluffDir = normalize(toMouse + vec3(0.0, 0.12, 0.05));
    vec3 petFluff = (fluffDir * 0.075 + vec3(0.0, 0.04, 0.0)) * petFactor * tip;
    
    transformed += wind + breathSway + petFluff;
    `
  );

  shader.fragmentShader = `
    varying float vTip;
  ` + shader.fragmentShader;

  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <dithering_fragment>',
    `
    #include <dithering_fragment>
    float rootAO = mix(0.45, 1.0, vTip);
    gl_FragColor.rgb *= rootAO;
    `
  );
};

const _up = new THREE.Vector3(0, 1, 0);
const _mat = new THREE.Matrix4();
const _quat = new THREE.Quaternion();
const _scale = new THREE.Vector3();
const _col = new THREE.Color();

function setStrand(mesh, index, pos, dir, length, thickness, color) {
  _quat.setFromUnitVectors(_up, dir.normalize());
  _scale.set(thickness, length / 0.1, thickness);
  _mat.compose(pos, _quat, _scale);
  mesh.setMatrixAt(index, _mat);
  mesh.setColorAt(index, color);
}

// 1. Body Fur (13,000 strands)
const BODY_COUNT = 13000;
const bodyFurMesh = new THREE.InstancedMesh(strandGeo, furMaterial, BODY_COUNT);
bodyFurMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bodyFurMesh.castShadow = true;
bodyFurMesh.receiveShadow = true;

const rx = 0.36, ry = 0.44, rz = 0.36;
for (let i = 0; i < BODY_COUNT; i++) {
  const u = Math.random();
  const v = Math.random();
  const theta = u * Math.PI * 2;
  const phi = Math.acos(2 * v - 1);
  
  const nx = Math.sin(phi) * Math.cos(theta);
  const ny = Math.cos(phi);
  const nz = Math.sin(phi) * Math.sin(theta);
  
  const px = nx * rx + (Math.random() - 0.5) * 0.015;
  const py = ny * ry + (Math.random() - 0.5) * 0.015;
  const pz = nz * rz + (Math.random() - 0.5) * 0.015;
  
  const norm = new THREE.Vector3(nx / (rx * rx), ny / (ry * ry), nz / (rz * rz)).normalize();
  const dir = norm.clone().add(new THREE.Vector3(
    (Math.random() - 0.5) * 0.25,
    (Math.random() - 0.5) * 0.25,
    (Math.random() - 0.5) * 0.25
  )).normalize();

  const pos = new THREE.Vector3(px, py, pz);
  const isChest = (pz > 0.06 && py > -0.32 && py < 0.28 && Math.abs(px) < 0.24);
  
  let length, thickness;
  if (isChest) {
    length = 0.075 + Math.random() * 0.035;
    thickness = 0.9 + Math.random() * 0.3;
    const tone = 0.94 + Math.random() * 0.06;
    _col.setRGB(tone, tone * 0.98, tone * 0.95);
  } else {
    length = 0.065 + Math.random() * 0.03;
    thickness = 0.85 + Math.random() * 0.3;
    const baseGrey = 0.48 + Math.random() * 0.22;
    _col.setRGB(baseGrey, baseGrey * 1.01, baseGrey * 0.99);
  }
  
  setStrand(bodyFurMesh, i, pos, dir, length, thickness, _col);
}
bodyFurMesh.instanceMatrix.needsUpdate = true;
if (bodyFurMesh.instanceColor) bodyFurMesh.instanceColor.needsUpdate = true;
koalaBody.add(bodyFurMesh);

// 2. Head Fur (8,500 strands)
const HEAD_COUNT = 8500;
const headFurMesh = new THREE.InstancedMesh(strandGeo, furMaterial, HEAD_COUNT);
headFurMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
headFurMesh.castShadow = true;
headFurMesh.receiveShadow = true;

const hrx = 0.36, hry = 0.33, hrz = 0.34;
let placedHead = 0;
while (placedHead < HEAD_COUNT) {
  const u = Math.random();
  const v = Math.random();
  const theta = u * Math.PI * 2;
  const phi = Math.acos(2 * v - 1);
  
  const nx = Math.sin(phi) * Math.cos(theta);
  const ny = Math.cos(phi);
  const nz = Math.sin(phi) * Math.sin(theta);
  
  const px = nx * hrx;
  const py = ny * hry;
  const pz = nz * hrz;
  
  const distNose = Math.hypot(px - 0, py - 0.02, pz - 0.32);
  if (distNose < 0.13) continue;
  
  const distEyeL = Math.hypot(px - (-0.165), py - 0.08, pz - 0.285);
  if (distEyeL < 0.075) continue;
  
  const distEyeR = Math.hypot(px - 0.165, py - 0.08, pz - 0.285);
  if (distEyeR < 0.075) continue;

  const norm = new THREE.Vector3(nx / (hrx * hrx), ny / (hry * hry), nz / (hrz * hrz)).normalize();
  const dir = norm.clone().add(new THREE.Vector3(
    (Math.random() - 0.5) * 0.2,
    (Math.random() - 0.5) * 0.2,
    (Math.random() - 0.5) * 0.2
  )).normalize();

  const pos = new THREE.Vector3(px, py, pz);
  const isCheek = (Math.abs(px) > 0.22 && py > -0.15 && py < 0.15 && pz > 0.0);
  const isChin = (py < -0.18 && pz > 0.1);
  
  let length, thickness;
  if (isCheek) {
    length = 0.085 + Math.random() * 0.04;
    thickness = 1.0;
    const tone = 0.88 + Math.random() * 0.1;
    _col.setRGB(tone, tone, tone * 0.98);
    dir.x += Math.sign(px) * 0.35;
    dir.normalize();
  } else if (isChin) {
    length = 0.06 + Math.random() * 0.025;
    thickness = 0.9;
    _col.setRGB(0.92, 0.92, 0.9);
  } else {
    length = 0.055 + Math.random() * 0.025;
    thickness = 0.85;
    const tone = 0.55 + Math.random() * 0.18;
    _col.setRGB(tone, tone * 1.01, tone * 0.99);
  }

  setStrand(headFurMesh, placedHead, pos, dir, length, thickness, _col);
  placedHead++;
}
headFurMesh.instanceMatrix.needsUpdate = true;
if (headFurMesh.instanceColor) headFurMesh.instanceColor.needsUpdate = true;
koalaHead.add(headFurMesh);

// 3. Extra-Long Fluffy Ear Tufts (3,000 strands each = 6,000 strands)
const EAR_COUNT = 3000;
function createEarTuftMesh() {
  const earMesh = new THREE.InstancedMesh(strandGeo, furMaterial, EAR_COUNT);
  earMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  earMesh.castShadow = true;
  earMesh.receiveShadow = true;

  const earRadius = 0.20;
  for (let i = 0; i < EAR_COUNT; i++) {
    const angle = -0.6 + Math.random() * (Math.PI + 1.2);
    const rad = earRadius + (Math.random() - 0.5) * 0.035;
    
    const px = Math.cos(angle) * rad;
    const py = Math.sin(angle) * rad;
    const pz = (Math.random() - 0.5) * 0.03;
    
    const outX = Math.cos(angle);
    const outY = Math.sin(angle);
    const dir = new THREE.Vector3(
      outX + (Math.random() - 0.5) * 0.35,
      outY + (Math.random() - 0.5) * 0.35,
      -0.2 + (Math.random() - 0.5) * 0.3
    ).normalize();
    
    const length = 0.12 + Math.random() * 0.11;
    const thickness = 0.95 + Math.random() * 0.35;
    
    if (Math.random() < 0.85) {
      const w = 0.96 + Math.random() * 0.04;
      _col.setRGB(w, w, w * 0.98);
    } else {
      const s = 0.75 + Math.random() * 0.15;
      _col.setRGB(s, s * 1.01, s * 0.98);
    }

    const pos = new THREE.Vector3(px, py, pz);
    setStrand(earMesh, i, pos, dir, length, thickness, _col);
  }
  earMesh.instanceMatrix.needsUpdate = true;
  if (earMesh.instanceColor) earMesh.instanceColor.needsUpdate = true;
  return earMesh;
}

const leftEarTufts = createEarTuftMesh();
leftEarGroup.add(leftEarTufts);

const rightEarTufts = createEarTuftMesh();
rightEarGroup.add(rightEarTufts);

// 4. Limb Fur (4,500 strands)
const LIMB_COUNT = 4500;
const limbFurMesh = new THREE.InstancedMesh(strandGeo, furMaterial, LIMB_COUNT);
limbFurMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
limbFurMesh.castShadow = true;
limbFurMesh.receiveShadow = true;

koalaRoot.updateMatrixWorld(true);

const limbs = [
  { group: leftArm, count: 1125, r: 0.10, h: 0.44 },
  { group: rightArm, count: 1125, r: 0.10, h: 0.44 },
  { group: leftLeg, count: 1125, r: 0.12, h: 0.40 },
  { group: rightLeg, count: 1125, r: 0.12, h: 0.40 }
];

let globalLimbIdx = 0;
limbs.forEach(limb => {
  limb.group.updateMatrix();
  for (let k = 0; k < limb.count; k++) {
    const angle = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * limb.h;
    const r = limb.r + (Math.random() - 0.5) * 0.015;
    
    const localPos = new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r);
    const localDir = new THREE.Vector3(Math.cos(angle), (Math.random() - 0.5) * 0.4, Math.sin(angle)).normalize();
    
    const worldPos = localPos.clone().applyMatrix4(limb.group.matrix);
    const worldDir = localDir.clone().transformDirection(limb.group.matrix);

    const length = 0.05 + Math.random() * 0.025;
    const thickness = 0.8;
    const grey = 0.5 + Math.random() * 0.2;
    _col.setRGB(grey, grey * 1.01, grey * 0.98);

    setStrand(limbFurMesh, globalLimbIdx++, worldPos, worldDir, length, thickness, _col);
  }
});
limbFurMesh.instanceMatrix.needsUpdate = true;
if (limbFurMesh.instanceColor) limbFurMesh.instanceColor.needsUpdate = true;
koalaRoot.add(limbFurMesh);

// --- Raycasting for Petting Physics ---
const raycastTargetGroup = new THREE.Group();
const hitMat = new THREE.MeshBasicMaterial({ visible: false });

const hitHead = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), hitMat);
hitHead.position.set(0.08, 0.55, 0.22);
raycastTargetGroup.add(hitHead);

const hitBody = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 12), hitMat);
hitBody.position.set(0.05, 0.05, 0.18);
raycastTargetGroup.add(hitBody);

const hitEarL = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8), hitMat);
hitEarL.position.set(-0.35, 0.78, 0.20);
raycastTargetGroup.add(hitEarL);

const hitEarR = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8), hitMat);
hitEarR.position.set(0.42, 0.78, 0.22);
raycastTargetGroup.add(hitEarR);

scene.add(raycastTargetGroup);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-999, -999);
const targetMouseWorld = new THREE.Vector3(999, 999, 999);
const currentMouseWorld = new THREE.Vector3(999, 999, 999);
let petIntensity = 0.0;

function updatePointerCoords(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

window.addEventListener('pointermove', (e) => {
  updatePointerCoords(e);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(raycastTargetGroup.children, false);
  if (hits.length > 0) {
    targetMouseWorld.copy(hits[0].point);
    petIntensity = Math.min(petIntensity + 0.35, 1.8);
  }
});

window.addEventListener('pointerdown', (e) => {
  updatePointerCoords(e);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(raycastTargetGroup.children, false);
  if (hits.length > 0) {
    targetMouseWorld.copy(hits[0].point);
    petIntensity = 2.2;
    controls.enabled = false;
  }
});

window.addEventListener('pointerup', () => {
  controls.enabled = true;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// --- Animation State ---
let blinkTimer = 0;
let nextBlinkTime = 3.2;
let blinkProgress = 0;
let isBlinking = false;

let earTimer = 0;
let nextEarTime = 2.2;
let leftTwitchAmp = 0;
let rightTwitchAmp = 0;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  // 1. Slow peaceful breathing
  const breathRate = 1.3;
  const breathCycle = Math.sin(time * breathRate);
  koalaBody.scale.set(
    1.0 + breathCycle * 0.022,
    1.0 + breathCycle * 0.032,
    1.0 + breathCycle * 0.028
  );
  koalaHead.position.y = 0.52 + breathCycle * 0.006;
  koalaHead.rotation.x = -0.04 + breathCycle * 0.012;
  furUniforms.uBreath.value = breathCycle * 0.5 + 0.5;

  // 2. Sleepy eye blinks
  blinkTimer += dt;
  if (!isBlinking && blinkTimer > nextBlinkTime) {
    isBlinking = true;
    blinkProgress = 0;
    blinkTimer = 0;
    nextBlinkTime = 3.5 + Math.random() * 4.0;
  }
  if (isBlinking) {
    blinkProgress += dt * 9.0;
    if (blinkProgress >= Math.PI) {
      blinkProgress = 0;
      isBlinking = false;
    }
  }
  const lidAngle = 0.25 + Math.sin(blinkProgress) * 1.1;
  leftUpperLid.rotation.x = lidAngle;
  rightUpperLid.rotation.x = lidAngle;

  // 3. Ear twitches
  earTimer += dt;
  if (earTimer > nextEarTime) {
    if (Math.random() < 0.55) {
      leftTwitchAmp = 0.28;
    } else {
      rightTwitchAmp = 0.28;
    }
    earTimer = 0;
    nextEarTime = 2.0 + Math.random() * 3.5;
  }
  leftTwitchAmp *= Math.pow(0.1, dt);
  rightTwitchAmp *= Math.pow(0.1, dt);

  const twitchFreq = 26.0;
  leftEarGroup.rotation.z = 0.35 + Math.sin(time * twitchFreq) * leftTwitchAmp;
  rightEarGroup.rotation.z = -0.35 - Math.sin(time * twitchFreq) * rightTwitchAmp;

  // 4. Eucalyptus leaves swaying in the breeze
  for (let i = 0; i < leafMeshes.length; i++) {
    const item = leafMeshes[i];
    const wave = Math.sin(time * item.speed + item.phase);
    item.mesh.rotation.x = item.baseRotX + wave * 0.08;
    item.mesh.rotation.y = item.baseRotY + Math.cos(time * item.speed * 0.8 + item.phase) * 0.06;
    item.mesh.rotation.z = item.baseRotZ + wave * 0.05;
  }

  // 5. Interactive fur fluffing & mouse physics
  petIntensity *= Math.pow(0.35, dt);
  currentMouseWorld.lerp(targetMouseWorld, dt * 10.0);

  furUniforms.uTime.value = time;
  furUniforms.uMouseWorld.value.copy(currentMouseWorld);
  furUniforms.uMouseStrength.value = petIntensity;

  // Affectionate head snuggle towards pet position
  if (petIntensity > 0.05) {
    const headWorld = new THREE.Vector3();
    koalaHead.getWorldPosition(headWorld);
    const diffX = (currentMouseWorld.x - headWorld.x);
    const diffY = (currentMouseWorld.y - headWorld.y);
    koalaHead.rotation.z += (diffX * 0.2 - koalaHead.rotation.z) * dt * 3.0;
    koalaHead.rotation.x += (-0.04 + diffY * 0.15 - koalaHead.rotation.x) * dt * 3.0;
  } else {
    koalaHead.rotation.z += (0.0 - koalaHead.rotation.z) * dt * 2.0;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
