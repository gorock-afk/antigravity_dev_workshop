<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitreledonella richardi - Glass Octopus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #020710;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. RENDERER, SCENE, CAMERA & CONTROLS
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020813);
    scene.fog = new THREE.FogExp2(0x020813, 0.036);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0.0, 1.4, 9.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.target.set(0, 0.15, 0);
    controls.minDistance = 3.2;
    controls.maxDistance = 20.0;
    controls.maxPolarAngle = Math.PI * 0.88;

    // =========================================================================
    // 2. PROCEDURAL ENVIRONMENT MAP & TEXTURES
    // =========================================================================
    function createDeepSeaEnvironment(rendererInstance) {
      const pmrem = new THREE.PMREMGenerator(rendererInstance);
      pmrem.compileEquirectangularShader();

      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x030c1a);

      // Dome with smooth oceanic caustics & studio light panels for glass refraction
      const domeGeo = new THREE.SphereGeometry(20, 48, 32);
      const pos = domeGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const cTop = new THREE.Color(0x165b8c);
      const cMid = new THREE.Color(0x041428);
      const cBot = new THREE.Color(0x01050c);
      const temp = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i) / 20;
        const x = pos.getX(i) / 20;
        const z = pos.getZ(i) / 20;
        if (y >= 0) {
          temp.lerpColors(cMid, cTop, Math.pow(y, 0.65));
        } else {
          temp.lerpColors(cMid, cBot, Math.pow(-y, 0.7));
        }
        // Subtle caustic bands in upper hemisphere
        const caustic = Math.max(0, Math.sin(x * 9 + z * 7) * Math.cos(z * 11 - x * 5)) * Math.max(0, y);
        temp.r += caustic * 0.18;
        temp.g += caustic * 0.35;
        temp.b += caustic * 0.45;
        colors[i * 3] = temp.r;
        colors[i * 3 + 1] = temp.g;
        colors[i * 3 + 2] = temp.b;
      }
      domeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const domeMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide });
      envScene.add(new THREE.Mesh(domeGeo, domeMat));

      // Studio reflection strips for crisp glass highlights
      const stripGeo = new THREE.PlaneGeometry(8, 3);
      const strip1 = new THREE.Mesh(
        stripGeo,
        new THREE.MeshBasicMaterial({ color: 0x88eeff, side: THREE.DoubleSide })
      );
      strip1.position.set(6, 8, 6);
      strip1.lookAt(0, 0, 0);
      envScene.add(strip1);

      const strip2 = new THREE.Mesh(
        stripGeo,
        new THREE.MeshBasicMaterial({ color: 0xff88cc, side: THREE.DoubleSide })
      );
      strip2.position.set(-8, 3, -5);
      strip2.lookAt(0, 0, 0);
      envScene.add(strip2);

      const strip3 = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffaa44 })
      );
      strip3.position.set(0, -7, 2);
      envScene.add(strip3);

      const envTex = pmrem.fromScene(envScene, 0.035).texture;
      pmrem.dispose();
      return envTex;
    }

    scene.environment = createDeepSeaEnvironment(renderer);

    // Procedural Chromatophore & Subsurface Iridescent Texture
    function createChromatophoreTextures() {
      const size = 1024;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = size;
      colorCanvas.height = size;
      const ctx = colorCanvas.getContext('2d');

      const emissiveCanvas = document.createElement('canvas');
      emissiveCanvas.width = size;
      emissiveCanvas.height = size;
      const eCtx = emissiveCanvas.getContext('2d');

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size;
      roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');

      // Base translucent cyan-pearl skin tone
      const baseGrad = ctx.createLinearGradient(0, 0, 0, size);
      baseGrad.addColorStop(0.0, '#b8f2ff');
      baseGrad.addColorStop(0.45, '#d8f6ff');
      baseGrad.addColorStop(0.8, '#ffe0f4');
      baseGrad.addColorStop(1.0, '#c8e8ff');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, size, size);

      eCtx.fillStyle = '#041222';
      eCtx.fillRect(0, 0, size, size);

      rCtx.fillStyle = '#181818';
      rCtx.fillRect(0, 0, size, size);

      // Subtle dermal collagen / vascular network lines
      ctx.strokeStyle = 'rgba(130, 225, 255, 0.14)';
      eCtx.strokeStyle = 'rgba(30, 140, 210, 0.12)';
      ctx.lineWidth = 1.2;
      eCtx.lineWidth = 1.5;
      for (let i = 0; i < 64; i++) {
        const startX = (i / 64) * size;
        ctx.beginPath();
        eCtx.beginPath();
        let x = startX;
        ctx.moveTo(x, 0);
        eCtx.moveTo(x, 0);
        for (let y = 0; y <= size; y += 32) {
          x += Math.sin(y * 0.025 + i * 0.7) * 6;
          ctx.lineTo(x, y);
          eCtx.lineTo(x, y);
        }
        ctx.stroke();
        eCtx.stroke();
      }

      // Deterministic pseudo-random helper for rich chromatophore placement
      let seed = 42;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      // Vitreledonella richardi characteristic jewel-like chromatophores
      // (Amber-gold, ruby-crimson, magenta-rose, and electric cyan-violet speckles)
      const palette = [
        { c: 'rgba(255, 145, 35, 0.88)', e: 'rgba(255, 130, 20, 0.75)', r: 3.4 },
        { c: 'rgba(235, 65, 90, 0.82)',  e: 'rgba(220, 50, 80, 0.55)',  r: 2.8 },
        { c: 'rgba(255, 195, 70, 0.85)', e: 'rgba(255, 190, 60, 0.80)', r: 2.4 },
        { c: 'rgba(90, 235, 255, 0.75)', e: 'rgba(70, 220, 255, 0.85)', r: 2.2 },
        { c: 'rgba(210, 95, 240, 0.72)', e: 'rgba(190, 80, 255, 0.65)', r: 2.6 }
      ];

      for (let i = 0; i < 950; i++) {
        const cx = rand() * size;
        const cy = rand() * size;
        const spec = palette[Math.floor(rand() * palette.length)];
        const radius = (0.55 + rand() * 1.35) * spec.r;

        // Color speckle with soft halo
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.1);
        g.addColorStop(0.0, spec.c);
        g.addColorStop(0.55, spec.c);
        g.addColorStop(1.0, 'rgba(200, 240, 255, 0.0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 2.1, 0, Math.PI * 2);
        ctx.fill();

        // Emissive bioluminescent core
        const eg = eCtx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.4);
        eg.addColorStop(0.0, spec.e);
        eg.addColorStop(0.5, spec.e);
        eg.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        eCtx.fillStyle = eg;
        eCtx.beginPath();
        eCtx.arc(cx, cy, radius * 2.4, 0, Math.PI * 2);
        eCtx.fill();

        // Slight surface micro-relief in roughness map
        rCtx.fillStyle = 'rgba(95, 95, 95, 0.5)';
        rCtx.beginPath();
        rCtx.arc(cx, cy, radius * 1.1, 0, Math.PI * 2);
        rCtx.fill();
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.wrapS = THREE.RepeatWrapping;
      colorTex.wrapT = THREE.RepeatWrapping;
      colorTex.colorSpace = THREE.SRGBColorSpace;

      const emissiveTex = new THREE.CanvasTexture(emissiveCanvas);
      emissiveTex.wrapS = THREE.RepeatWrapping;
      emissiveTex.wrapT = THREE.RepeatWrapping;
      emissiveTex.colorSpace = THREE.SRGBColorSpace;

      const roughTex = new THREE.CanvasTexture(roughCanvas);
      roughTex.wrapS = THREE.RepeatWrapping;
      roughTex.wrapT = THREE.RepeatWrapping;

      return { colorTex, emissiveTex, roughTex };
    }

    const skinTextures = createChromatophoreTextures();

    // =========================================================================
    // 3. STUDIO THREE-POINT LIGHTING & SOFT CONTACT SHADOW FLOOR
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0x16324f, 0.85);
    scene.add(ambientLight);

    // Key Light (Cool oceanic cyan-white from top-right-front)
    const keyLight = new THREE.DirectionalLight(0xbbf2ff, 2.8);
    keyLight.position.set(5.5, 9.0, 6.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1.0;
    keyLight.shadow.camera.far = 25.0;
    const d = 5.5;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.radius = 4;
    scene.add(keyLight);

    // Fill Light (Soft iridescent rose-violet from left)
    const fillLight = new THREE.DirectionalLight(0xe088ff, 1.35);
    fillLight.position.set(-7.0, 2.5, 3.5);
    scene.add(fillLight);

    // Rim Light (Bright deep-water aquamarine from back-top)
    const rimLight = new THREE.DirectionalLight(0x33ffd8, 2.4);
    rimLight.position.set(0.0, 6.5, -7.5);
    scene.add(rimLight);

    // Soft Contact Shadow & Abyssal Studio Floor
    function createContactShadowFloor() {
      const group = new THREE.Group();
      group.position.y = -3.55;

      // Subtle dark studio ground receiver
      const floorGeo = new THREE.PlaneGeometry(40, 40);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x030b17,
        roughness: 0.9,
        metalness: 0.05
      });
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      group.add(floorMesh);

      // Soft radial contact shadow decal beneath the hovering octopus
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 512;
      shadowCanvas.height = 512;
      const sCtx = shadowCanvas.getContext('2d');
      const grad = sCtx.createRadialGradient(256, 256, 12, 256, 256, 245);
      grad.addColorStop(0.0, 'rgba(0, 2, 8, 0.72)');
      grad.addColorStop(0.35, 'rgba(0, 6, 16, 0.45)');
      grad.addColorStop(0.7, 'rgba(2, 16, 32, 0.14)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, 512, 512);

      const shadowTex = new THREE.CanvasTexture(shadowCanvas);
      const contactShadowMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(7.2, 7.2),
        new THREE.MeshBasicMaterial({
          map: shadowTex,
          transparent: true,
          depthWrite: false
        })
      );
      contactShadowMesh.rotation.x = -Math.PI / 2;
      contactShadowMesh.position.y = 0.01;
      group.add(contactShadowMesh);

      return { group, contactShadowMesh };
    }

    const { group: floorGroup, contactShadowMesh } = createContactShadowFloor();
    scene.add(floorGroup);

    // =========================================================================
    // 4. MASTER OCTOPUS HIERARCHY & SHARED MATERIALS
    // =========================================================================
    const octopusRoot = new THREE.Group();
    scene.add(octopusRoot);

    // Primary Translucent Gelatinous Mantle Material (MeshPhysicalMaterial)
    const mantleGlassMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xdcf7ff),
      map: skinTextures.colorTex,
      emissive: new THREE.Color(0x286688),
      emissiveMap: skinTextures.emissiveTex,
      emissiveIntensity: 0.65,
      roughness: 0.11,
      roughnessMap: skinTextures.roughTex,
      metalness: 0.0,
      transmission: 0.91,
      thickness: 2.1,
      ior: 1.37,
      reflectivity: 0.65,
      iridescence: 0.92,
      iridescenceIOR: 1.34,
      iridescenceThicknessRange: [140, 620],
      attenuationColor: new THREE.Color(0x45d2ff),
      attenuationDistance: 3.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      transparent: true,
      opacity: 0.98,
      side: THREE.DoubleSide
    });

    // Translucent Tentacle Flesh Material
    const tentacleGlassMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xdaf6ff),
      map: skinTextures.colorTex,
      emissive: new THREE.Color(0x245577),
      emissiveMap: skinTextures.emissiveTex,
      emissiveIntensity: 0.55,
      roughness: 0.14,
      metalness: 0.0,
      transmission: 0.86,
      thickness: 0.95,
      ior: 1.36,
      iridescence: 0.85,
      iridescenceIOR: 1.33,
      iridescenceThicknessRange: [160, 560],
      attenuationColor: new THREE.Color(0x66ddff),
      attenuationDistance: 1.8,
      clearcoat: 0.9,
      clearcoatRoughness: 0.08,
      transparent: true,
      opacity: 0.96
    });

    // Thin Translucent Interbrachial Web Material
    const webGlassMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xcff2ff),
      map: skinTextures.colorTex,
      emissive: new THREE.Color(0x1b4560),
      emissiveMap: skinTextures.emissiveTex,
      emissiveIntensity: 0.4,
      roughness: 0.16,
      metalness: 0.0,
      transmission: 0.93,
      thickness: 0.25,
      ior: 1.35,
      iridescence: 0.95,
      iridescenceIOR: 1.33,
      iridescenceThicknessRange: [120, 680],
      attenuationColor: new THREE.Color(0x70e4ff),
      attenuationDistance: 2.5,
      clearcoat: 0.85,
      clearcoatRoughness: 0.1,
      transparent: true,
      opacity: 0.88,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    // =========================================================================
    // 5. BULBOUS TRANSLUCENT MANTLE / HEAD WITH DYNAMIC JELLY DEFORMATION
    // =========================================================================
    const mantleGroup = new THREE.Group();
    mantleGroup.position.set(0, 1.05, 0);
    octopusRoot.add(mantleGroup);

    // Sculpted Bulbous Mantle Geometry (Vitreledonella richardi profile)
    const mantleGeo = new THREE.SphereGeometry(1.0, 96, 72);
    const mPos = mantleGeo.attributes.position;
    const mBasePositions = new Float32Array(mPos.count * 3);
    const mBaseNormals = new Float32Array(mPos.count * 3);

    for (let i = 0; i < mPos.count; i++) {
      let x = mPos.getX(i);
      let y = mPos.getY(i);
      let z = mPos.getZ(i);

      // Normalized vertical coordinate u in [-1, 1] (-1 = collar base, +1 = dome apex)
      const u = y;
      // Elongate vertically into a graceful bulbous dome tilted slightly posteriorly
      let scaleY = 1.62;
      let radiusXZ = 1.0;

      if (u > 0) {
        // Upper bulbous dome with gentle taper near apex
        radiusXZ = 1.06 * (1.0 - 0.14 * Math.pow(u, 2.2)) + 0.12 * Math.sin(u * Math.PI);
      } else {
        // Lower mantle narrowing toward the muscular neck collar, then flaring slightly at base
        const t = -u; // 0..1
        const pinch = Math.exp(-Math.pow((t - 0.72) / 0.22, 2)) * 0.26;
        const flare = Math.exp(-Math.pow((t - 0.96) / 0.12, 2)) * 0.10;
        radiusXZ = (1.06 - 0.22 * Math.pow(t, 1.4)) - pinch + flare;
      }

      // Slightly wider laterally & subtly streamlined dorsoventrally
      const lateralFactor = 1.04;
      const dorsalFactor = 0.96 + (z < 0 ? 0.08 * Math.sin((u + 1) * Math.PI * 0.5) : 0.0);

      // Gentle anatomical arch toward the dorsal/posterior side (-z)
      const archZ = -0.18 * Math.pow(Math.max(0, u + 0.3), 1.6);

      // Subtle organic longitudinal ribs / lobes along the mantle bell
      const angle = Math.atan2(z, x);
      const rib = 1.0 + 0.022 * Math.cos(angle * 8) * (1.0 - Math.abs(u));

      x = x * radiusXZ * lateralFactor * rib;
      y = y * scaleY + 0.28;
      z = z * radiusXZ * dorsalFactor * rib + archZ;

      mPos.setXYZ(i, x, y, z);
      mBasePositions[i * 3] = x;
      mBasePositions[i * 3 + 1] = y;
      mBasePositions[i * 3 + 2] = z;
    }
    mantleGeo.computeVertexNormals();
    const mNormAttr = mantleGeo.attributes.normal;
    for (let i = 0; i < mNormAttr.count * 3; i++) {
      mBaseNormals[i] = mNormAttr.array[i];
    }

    const mantleMesh = new THREE.Mesh(mantleGeo, mantleGlassMat);
    mantleMesh.castShadow = true;
    mantleGroup.add(mantleMesh);

    // Inner Subsurface Cavity Membrane (gives double-walled gelatinous depth)
    const innerMantleGeo = mantleGeo.clone();
    const innerMantleMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0x70e5ff),
      emissive: new THREE.Color(0x0b3450),
      emissiveIntensity: 0.45,
      roughness: 0.2,
      transmission: 0.92,
      thickness: 0.5,
      ior: 1.34,
      transparent: true,
      opacity: 0.42,
      side: THREE.BackSide,
      depthWrite: false
    });
    const innerMantleMesh = new THREE.Mesh(innerMantleGeo, innerMantleMat);
    innerMantleMesh.scale.set(0.91, 0.92, 0.91);
    mantleGroup.add(innerMantleMesh);

    // =========================================================================
    // 6. INTERNAL ANATOMY: AMBER-GOLD OPTIC NERVES, BRAIN, DIGESTIVE CORE & HEARTS
    // =========================================================================
    const internalOrgansGroup = new THREE.Group();
    mantleGroup.add(internalOrgansGroup);

    // Warm Amber-Gold Internal Bioluminescent Point Light
    const coreLight = new THREE.PointLight(0xffaa33, 3.8, 6.5, 1.5);
    coreLight.position.set(0, 0.15, -0.05);
    internalOrgansGroup.add(coreLight);

    // Secondary Cyan-Bioluminescent Neural Light
    const neuralLight = new THREE.PointLight(0x44eeff, 2.2, 5.0, 1.6);
    neuralLight.position.set(0, -0.85, 0.1);
    internalOrgansGroup.add(neuralLight);

    // 6A. Spindle-Shaped Digestive Gland / Visceral Core (Iconic Amber-Bronze Organ)
    const spindlePoints = [];
    for (let i = 0; i <= 32; i++) {
      const t = i / 32; // 0 (bottom tip) to 1 (top tip)
      const y = (t - 0.5) * 1.65;
      // Fusiform spindle silhouette
      const r = Math.sin(t * Math.PI) * (0.31 - 0.07 * Math.cos(t * Math.PI * 2));
      spindlePoints.push(new THREE.Vector2(Math.max(0.004, r), y));
    }
    const digestiveGeo = new THREE.LatheGeometry(spindlePoints, 40);
    // Add subtle organic spiral grooves to the digestive gland
    const dPos = digestiveGeo.attributes.position;
    for (let i = 0; i < dPos.count; i++) {
      const vx = dPos.getX(i);
      const vy = dPos.getY(i);
      const vz = dPos.getZ(i);
      const ang = Math.atan2(vz, vx);
      const groove = 1.0 + 0.055 * Math.sin(ang * 6 + vy * 5.0);
      dPos.setXYZ(i, vx * groove, vy, vz * groove);
    }
    digestiveGeo.computeVertexNormals();

    const digestiveMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xff9d2e),
      emissive: new THREE.Color(0xd96800),
      emissiveIntensity: 0.85,
      roughness: 0.24,
      metalness: 0.35,
      clearcoat: 0.8,
      clearcoatRoughness: 0.15,
      iridescence: 0.7,
      iridescenceIOR: 1.45
    });
    const digestiveCore = new THREE.Mesh(digestiveGeo, digestiveMat);
    digestiveCore.position.set(0, 0.35, -0.08);
    digestiveCore.rotation.x = -0.14;
    internalOrgansGroup.add(digestiveCore);

    // Translucent Peritoneal Capsule surrounding the Digestive Gland
    const capsuleMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xffd588),
      emissive: new THREE.Color(0xff8811),
      emissiveIntensity: 0.35,
      roughness: 0.12,
      transmission: 0.78,
      thickness: 0.4,
      ior: 1.4,
      transparent: true,
      opacity: 0.65
    });
    const digestiveCapsule = new THREE.Mesh(digestiveGeo.clone(), capsuleMat);
    digestiveCapsule.scale.set(1.14, 1.06, 1.14);
    digestiveCore.add(digestiveCapsule);

    // 6B. Systemic Heart & Paired Branchial Hearts + Feathery Gills (Ctenidia)
    const heartMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xff6b4a),
      emissive: new THREE.Color(0xff4411),
      emissiveIntensity: 1.1,
      roughness: 0.22,
      transmission: 0.45,
      thickness: 0.5,
      clearcoat: 0.9
    });
    const systemicHeart = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 24), heartMat);
    systemicHeart.scale.set(1.2, 0.95, 0.9);
    systemicHeart.position.set(0, -0.45, -0.12);
    internalOrgansGroup.add(systemicHeart);

    const gillMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xffb899),
      emissive: new THREE.Color(0xe06030),
      emissiveIntensity: 0.45,
      roughness: 0.25,
      transmission: 0.72,
      transparent: true,
      opacity: 0.82,
      side: THREE.DoubleSide
    });

    const gillsGroup = new THREE.Group();
    internalOrgansGroup.add(gillsGroup);

    [-1, 1].forEach((side) => {
      const branchialHeart = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 16), heartMat);
      branchialHeart.position.set(side * 0.36, -0.42, -0.06);
      gillsGroup.add(branchialHeart);

      // Feathery gill lamellae stack
      const gillStack = new THREE.Group();
      gillStack.position.set(side * 0.44, -0.12, -0.04);
      gillStack.rotation.z = -side * 0.22;

    // 8A. Create Distinct 3D Cup-Shaped White/Pink Suction Cup Geometry (빨판)
    function createSuctionCupGeometry() {
      // Lathe profile of an authentic cephalopod suction cup:
      // Narrow peduncle stalk -> fleshy bulbous acetabulum cup -> raised white/pink rim -> deep concave suction cavity
      const profile = [
        new THREE.Vector2(0.001, 0.00), // Attachment center on tentacle
        new THREE.Vector2(0.42,  0.02), // Basal cushion
        new THREE.Vector2(0.34,  0.18), // Constricted muscular stalk (peduncle)
        new THREE.Vector2(0.58,  0.38), // Flaring lower cup wall
        new THREE.Vector2(0.86,  0.64), // Full bulbous cup cheek (infundibulum)
        new THREE.Vector2(1.00,  0.86), // Outer fleshy suction rim
        new THREE.Vector2(0.95,  0.98), // Top lip edge
        new THREE.Vector2(0.76,  1.00), // Inner lip bevel
        new THREE.Vector2(0.55,  0.82), // Upper inner suction chamber wall
        new THREE.Vector2(0.32,  0.52), // Deep concave acetabular cavity
        new THREE.Vector2(0.001, 0.42)  // Center floor of suction cavity
      ];

      const geo = new THREE.LatheGeometry(profile, 22);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);

      const cStalk = new THREE.Color(0xffb5d0);  // Translucent blush pink base
      const cCup   = new THREE.Color(0xffeaf2);  // Pearlescent creamy white-pink cup wall
      const cRim   = new THREE.Color(0xffffff);  // Crisp ivory-white suction lip
      const cInner = new THREE.Color(0xe86b9c);  // Warm rose-pink inner suction hollow
      const temp = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const r = Math.hypot(vx, vz);

        if (vy < 0.35) {
          temp.lerpColors(cStalk, cCup, vy / 0.35);
        } else if (vy > 0.84 && r >= 0.72) {
          temp.lerpColors(cCup, cRim, (vy - 0.84) / 0.16);
        } else if (r < 0.68 && vy >= 0.40) {
          // Deep concave inner cavity
          const depthFactor = Math.min(1, (0.68 - r) / 0.55);
          temp.lerpColors(cRim, cInner, depthFactor);
        } else {
          temp.copy(cCup);
        }

        colors[i * 3] = temp.r;
        colors[i * 3 + 1] = temp.g;
        colors[i * 3 + 2] = temp.b;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      return geo;
    }

        for (let j = 0; j <= radSegs; j++) {
          const u = j / radSegs;
          const idx = i * (radSegs + 1) + j;
          uvs[idx * 2] = u;
          uvs[idx * 2 + 1] = v * 3.0;

      for (let i = 0; i < segs; i++) {
        for (let j = 0; j < radSegs; j++) {
          const a = i * (radSegs + 1) + j;
          const b = (i + 1) * (radSegs + 1) + j;
          const c = (i + 1) * (radSegs + 1) + (j + 1);
          const d = i * (radSegs + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

      pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
      isPointerActive = true;

      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(rayTargets, false);

      if (hits.length > 0) {
        pointerWorld.copy(hits[0].point);
        if (hits[0].object === mantleMesh && Math.random() < 0.35) {
          triggerInteractionImpulse(hits[0].point, false);
        }
        neuralFlashIntensity = Math.min(1.2, neuralFlashIntensity + 0.08);
      } else {
        // Project cursor onto plane facing camera through octopus center
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        interactionPlane.setFromNormalAndCoplanarPoint(camDir, octopusRoot.position);
        raycaster.ray.intersectPlane(interactionPlane, pointerWorld);
      }
    });

    window.addEventListener('pointerdown', (e) => {
      pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
      isPointerActive = true;

      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(rayTargets, false);
      if (hits.length > 0) {
        pointerWorld.copy(hits[0].point);
        triggerInteractionImpulse(hits[0].point, true);
      } else {
        triggerInteractionImpulse(new THREE.Vector3(0, 1.2, 0.8), true);
      }
    });

    window.addEventListener('pointerleave', () => {
      isPointerActive = false;
    });

    // =========================================================================
    // 11. KINEMATICS & REAL-TIME GEOMETRY UPDATE ENGINE
    // =========================================================================
    const dummyMatrix = new THREE.Matrix4();
    const cupPos = new THREE.Vector3();
    const cupQuat = new THREE.Quaternion();
    const cupScale = new THREE.Vector3();
    const cupBasisMat = new THREE.Matrix4();
    const cupX = new THREE.Vector3();
    const cupY = new THREE.Vector3();
    const cupZ = new THREE.Vector3();

    const tmpVec1 = new THREE.Vector3();
    const tmpVec2 = new THREE.Vector3();
    const tmpVec3 = new THREE.Vector3();
    const rotAxis = new THREE.Vector3();

    // Update Mantle Viscoelastic Jelly + Breathing Contraction
    function updateMantleAndOrgans(time, dt) {
      const breathPhase = time * 1.65;
      const breathWave = Math.sin(breathPhase);

      // Decay click-induced jet pulse
      jetPulseVelocity += (-jetPulseOffset * 14.0 - jetPulseVelocity * 3.8) * dt;
      jetPulseOffset += jetPulseVelocity * dt;
      neuralFlashIntensity = Math.max(0, neuralFlashIntensity - dt * 1.4);

      const posAttr = mantleGeo.attributes.position;
      const posArr = posAttr.array;

      // Advance & prune surface ripples
      for (let r = mantleRipples.length - 1; r >= 0; r--) {
        mantleRipples[r].age += dt;
        if (mantleRipples[r].age > 2.4) {
          mantleRipples.splice(r, 1);
        }
      }

      for (let i = 0; i < posAttr.count; i++) {
        const ix = i * 3;
        const bx = mBasePositions[ix];
        const by = mBasePositions[ix + 1];
        const bz = mBasePositions[ix + 2];

        const nx = mBaseNormals[ix];
        const ny = mBaseNormals[ix + 1];
        const nz = mBaseNormals[ix + 2];

        // Normalized height along mantle bell (approx 0 at collar, 1 at dome top)
        const h = Math.max(0, Math.min(1, (by + 1.35) / 3.1));

        // Travelling peristaltic breathing wave + subtle gelatinous bell undulation
        const bellPulse =
          Math.sin(breathPhase - h * 2.4) * 0.048 * (1.0 - 0.35 * h) +
          Math.cos(time * 2.9 + bx * 2.2 - bz * 2.2) * 0.014 +
          jetPulseOffset * Math.sin(h * Math.PI) * 0.22;

        // Sum viscoelastic surface ripples from mouse interaction
        let rippleDisp = 0.0;
        if (mantleRipples.length > 0) {
          const vLen = Math.hypot(bx, by, bz) || 1.0;
          const vx = bx / vLen;
          const vy = by / vLen;
          const vz = bz / vLen;

          for (let r = 0; r < mantleRipples.length; r++) {
            const rp = mantleRipples[r];
            const dot = Math.max(-1, Math.min(1, vx * rp.center.x + vy * rp.center.y + vz * rp.center.z));
            const angDist = Math.acos(dot);
            const decay = Math.exp(-rp.age * 2.4) * Math.exp(-angDist * 2.8);
            rippleDisp +=
              Math.sin(angDist * rp.freq - rp.age * 16.0) * rp.strength * decay;
          }
        }

        const totalRadial = 1.0 + bellPulse;
        const verticalStretch = 1.0 - bellPulse * 0.38;

        posArr[ix] = bx * totalRadial + nx * rippleDisp;
        posArr[ix + 1] = by * verticalStretch + ny * rippleDisp;
        posArr[ix + 2] = bz * totalRadial + nz * rippleDisp;
      }

      posAttr.needsUpdate = true;
      mantleGeo.computeVertexNormals();

      // Internal Organ animations: Heartbeat, gill flare, optic nerve bioluminescence
      const heartbeat = 1.0 + Math.pow(Math.max(0, Math.sin(time * 3.8)), 3) * 0.22;
      systemicHeart.scale.set(1.2 * heartbeat, 0.95 * heartbeat, 0.9 * heartbeat);
      digestiveCore.rotation.y = Math.sin(time * 0.9) * 0.14;
      digestiveCore.position.y = 0.35 + Math.sin(breathPhase - 0.6) * 0.04;

      coreLight.intensity = 3.6 + Math.sin(time * 3.8) * 0.9 + neuralFlashIntensity * 3.2;
      neuralLight.intensity = 2.0 + Math.cos(time * 2.5) * 0.6 + neuralFlashIntensity * 2.8;
      mantleGlassMat.emissiveIntensity = 0.62 + neuralFlashIntensity * 0.65;
      tentacleGlassMat.emissiveIntensity = 0.52 + neuralFlashIntensity * 0.55;
      nerveMat.emissiveIntensity = 1.4 + Math.sin(time * 4.0) * 0.3 + neuralFlashIntensity * 1.8;

      // Update travelling synaptic pulses along optic & brachial nerves
      for (let i = 0; i < numPulses; i++) {
        const p = pulseData[i];
        p.t = (p.t + dt * p.speed * (1.0 + neuralFlashIntensity * 1.8)) % 1.0;
        const curveObj = nerveCurves[p.curveIndex];
        curveObj.curve.getPointAt(p.t, tmpVec1);
        const s = (0.7 + 0.5 * Math.sin(p.t * Math.PI)) * (1.0 + neuralFlashIntensity * 0.6);
        dummyMatrix.makeScale(s, s, s);
        dummyMatrix.setPosition(tmpVec1);
        pulseInstanced.setMatrixAt(i, dummyMatrix);
      }
      pulseInstanced.instanceMatrix.needsUpdate = true;

      // Siphon tubes flare on exhalation (out of phase with mantle expansion)
      const siphonFlare = 1.0 + Math.sin(breathPhase + Math.PI * 0.65) * 0.16 + Math.abs(jetPulseOffset) * 0.45;
      siphonTubes.forEach((st) => {
        st.mesh.scale.set(siphonFlare, 1.0 - (siphonFlare - 1.0) * 0.3, siphonFlare);
        st.pivot.rotation.z = -st.side * (0.52 + Math.sin(breathPhase) * 0.06);
      });

      // Subtle eye stabilization & tracking toward camera / pointer
      eyeAssemblies.forEach((eye) => {
        eye.pivot.rotation.x = Math.sin(time * 1.2 + eye.side) * 0.05;
        eye.pivot.rotation.y = eye.side * 0.22 + Math.cos(time * 0.9) * 0.05;
      });
    }

    // Update All 8 Tentacles, Double-Row Staggered 3D Suction Cups & Interbrachial Web
    function updateTentaclesAndSuctionCups(time, dt) {
      let globalCupIndex = 0;

      // Convert world pointer into octopusRoot local space
      const localPointer = octopusRoot.worldToLocal(pointerWorld.clone());

      for (let tIdx = 0; tIdx < NUM_TENTACLES; tIdx++) {
        const tent = tentacles[tIdx];
        const baseAngle = tent.baseAngle;
        const cosA = Math.cos(baseAngle);
        const sinA = Math.sin(baseAngle);

        // Radial outward direction and lateral tangent around the oral crown
        const radialDirX = cosA;
        const radialDirZ = sinA;
        const lateralDirX = -sinA;
        const lateralDirZ = cosA;

        // Interactive Mouse Physics per tentacle:
        // Tentacles sense the 3D cursor and gracefully curl/reach & undulate in response
        const approxMidWorld = new THREE.Vector3(
          cosA * 1.65,
          -1.05,
          sinA * 1.65
        );
        const targetOffset = new THREE.Vector3();
        let targetCurl = 0;

        if (isPointerActive) {
          const toCursor = tmpVec1.subVectors(localPointer, approxMidWorld);
          const dist = toCursor.length();
          if (dist < 4.2) {
            const influence = Math.pow(1.0 - dist / 4.2, 1.6);
            // Gently attract/curl tentacle tip toward cursor while deflecting smoothly on close pass
            if (dist < 1.15) {
              // Soft physical deflection when brushing directly through the tentacle
              targetOffset.copy(toCursor).normalize().multiplyScalar(-0.75 * influence);
              targetCurl = 0.85 * influence;
            } else {
              // Inquisitive organic reaching & helical curling toward the cursor
              targetOffset.copy(toCursor).multiplyScalar(0.38 * influence);
              targetCurl = 0.65 * influence;
            }
          }
        }

        // Spring-damper integration for smooth tentacle response
        const kSpring = 12.0;
        const kDamp = 4.2;
        tent.mouseVel.x += ((targetOffset.x - tent.mouseOffset.x) * kSpring - tent.mouseVel.x * kDamp) * dt;
        tent.mouseVel.y += ((targetOffset.y - tent.mouseOffset.y) * kSpring - tent.mouseVel.y * kDamp) * dt;
        tent.mouseVel.z += ((targetOffset.z - tent.mouseOffset.z) * kSpring - tent.mouseVel.z * kDamp) * dt;
        tent.mouseOffset.addScaledVector(tent.mouseVel, dt);

        tent.curlBoostVel += ((targetCurl - tent.curlBoost) * 9.0 - tent.curlBoostVel * 3.5) * dt;
        tent.curlBoost += tent.curlBoostVel * dt;

        // -------------------------------------------------------------------
        // A. Compute 3D Multi-Harmonic Travelling Sine/Helix Spine Curve
        // -------------------------------------------------------------------
        const phase = tent.phaseOffset;
        const w = time * tent.freqMult;

        // Autonomous slow coiling/uncoiling cycle per tentacle
        const autoCurlCycle =
          0.5 + 0.5 * Math.sin(w * 0.52 + phase * 1.7 + Math.cos(w * 0.31 + tIdx));
        const totalCurl = (0.42 + 0.72 * autoCurlCycle) + tent.curlBoost;

        // Root attachment on collar base
        const rootRadius = 0.54;
        const spine = tent.spine;
        spine[0].set(radialDirX * rootRadius, -0.32, radialDirZ * rootRadius);

        // Integrate tangent steps along s = 1..SEGMENTS for natural inextensible tentacle motion
        const segLen = TENTACLE_LENGTH / SEGMENTS;

        for (let s = 1; s <= SEGMENTS; s++) {
          const t = s / SEGMENTS; // 0 (base) -> 1 (tip)
          const env = Math.pow(t, 1.25);

          // Multi-harmonic travelling radial wave (graceful umbrella stroke + travelling undulation)
          const wave1 = Math.sin(w * 1.65 - t * 4.8 + phase) * 0.42;
          const wave2 = Math.sin(w * 3.10 - t * 8.5 + phase * 1.9) * 0.22 * t;
          const wave3 = Math.cos(w * 0.95 - t * 3.2 - phase * 0.7) * 0.26;

          // Progressive distal spiral curl (coiling inward or outward near the whip-like tip)
          const tipSpiral = Math.pow(Math.max(0, (t - 0.32) / 0.68), 2.1) * totalCurl * 2.85;
          const pitchAngle =
            -0.55 -
            0.65 * Math.pow(t, 0.75) +
            (wave1 + wave2 + wave3) * env +
            tipSpiral;

          // Lateral 3D helical wave (creates mesmerizing 3D corkscrew/helix motion)
          const latWave1 = Math.cos(w * 1.85 - t * 5.6 + phase * 1.3) * 0.34 * env;
          const latWave2 = Math.sin(w * 2.75 - t * 9.2 - phase) * 0.19 * (t * t);

          const cosPitch = Math.cos(pitchAngle);
          const sinPitch = Math.sin(pitchAngle);

          // Base step vector in radial + vertical + lateral frame
          let dx = radialDirX * cosPitch + lateralDirX * (latWave1 + latWave2);
          let dy = sinPitch;
          let dz = radialDirZ * cosPitch + lateralDirZ * (latWave1 + latWave2);

          // Blend interactive mouse displacement smoothly along the middle-to-distal tentacle
          const mouseWeight = Math.sin(t * Math.PI * 0.85) * 0.55;
          dx += tent.mouseOffset.x * mouseWeight;
          dy += tent.mouseOffset.y * mouseWeight;
          dz += tent.mouseOffset.z * mouseWeight;

          const invLen = segLen / (Math.hypot(dx, dy, dz) || 1.0);
          spine[s].set(
            spine[s - 1].x + dx * invLen,
            spine[s - 1].y + dy * invLen,
            spine[s - 1].z + dz * invLen
          );
        }

        // -------------------------------------------------------------------
        // B. Parallel Transport Frame (Bishop Frame) Along Tentacle Spine
        // -------------------------------------------------------------------
        const tangents = tent.tangents;
        const normals = tent.normals;     // Oral direction (underside where suction cups sit)
        const binormals = tent.binormals; // Lateral direction

        for (let s = 0; s <= SEGMENTS; s++) {
          if (s === 0) {
            tangents[0].subVectors(spine[1], spine[0]).normalize();
          } else if (s === SEGMENTS) {
            tangents[s].subVectors(spine[s], spine[s - 1]).normalize();
          } else {
            tangents[s].subVectors(spine[s + 1], spine[s - 1]).normalize();
          }
        }

        // Initialize frame at root (s = 0): binormal is horizontal lateralVector
        binormals[0].set(lateralDirX, 0, lateralDirZ).normalize();
        // Ensure orthogonality with tangent[0]
        binormals[0].addScaledVector(tangents[0], -binormals[0].dot(tangents[0])).normalize();
        // Oral normal points inward/downward toward the underside of the tentacle
        normals[0].crossVectors(tangents[0], binormals[0]).normalize();

        // Propagate frame smoothly along s = 1..SEGMENTS without Frenet flipping
        for (let s = 1; s <= SEGMENTS; s++) {
          const prevT = tangents[s - 1];
          const currT = tangents[s];
          normals[s].copy(normals[s - 1]);

          rotAxis.crossVectors(prevT, currT);
          const sinTheta = rotAxis.length();
          if (sinTheta > 1e-5) {
            rotAxis.multiplyScalar(1.0 / sinTheta);
            const theta = Math.atan2(sinTheta, prevT.dot(currT));
            normals[s].applyAxisAngle(rotAxis, theta);
          }

          // Subtle organic helical torsion along the distal tip
          const t = s / SEGMENTS;
          const torsion = Math.sin(w * 1.4 - t * 4.5 + phase) * 0.018 * t;
          if (Math.abs(torsion) > 1e-5) {
            normals[s].applyAxisAngle(currT, torsion);
          }

          // Re-orthogonalize
          normals[s].addScaledVector(currT, -normals[s].dot(currT)).normalize();
          binormals[s].crossVectors(normals[s], currT).normalize();
        }

        // -------------------------------------------------------------------
        // C. Update Tentacle Flesh Mesh & Internal Nerve Cord Vertices
        // -------------------------------------------------------------------
        const posAttr = tent.geo.attributes.position;
        const normAttr = tent.geo.attributes.normal;
        const posArr = posAttr.array;
        const normArr = normAttr.array;

        const nPosAttr = tent.nerveGeo.attributes.position;
        const nNormAttr = tent.nerveGeo.attributes.normal;
        const nPosArr = nPosAttr.array;
        const nNormArr = nNormAttr.array;

        for (let s = 0; s <= SEGMENTS; s++) {
          const t = s / SEGMENTS;
          // Graceful muscular taper from base (r=0.22) to delicate whip tip (r=0.010)
          const baseRadius = 0.225 * Math.pow(1.0 - t, 1.18) + 0.010 * (1.0 - t * 0.6);

          const P = spine[s];
          const N = normals[s];   // Oral (+N is underside with suction cups)
          const B = binormals[s]; // Lateral

          for (let j = 0; j <= RADIAL_SEGS; j++) {
            const theta = (j / RADIAL_SEGS) * Math.PI * 2;
            const cosT = Math.cos(theta); // +1 on oral underside, -1 on dorsal back
            const sinT = Math.sin(theta); // ±1 laterally

            // Slightly flattened oral suction-cup surface & subtle dorsal ridge
            const oralFlatten = cosT > 0 ? 0.86 : 1.06 + 0.08 * Math.pow(-cosT, 3);
            const rN = baseRadius * cosT * oralFlatten;
            const rB = baseRadius * sinT * 1.04;

            const vx = P.x + N.x * rN + B.x * rB;
            const vy = P.y + N.y * rN + B.y * rB;
            const vz = P.z + N.z * rN + B.z * rB;

            const nx = N.x * cosT + B.x * sinT;
            const ny = N.y * cosT + B.y * sinT;
            const nz = N.z * cosT + B.z * sinT;
            const invN = 1.0 / (Math.hypot(nx, ny, nz) || 1.0);

            const vIdx = (s * (RADIAL_SEGS + 1) + j) * 3;
            posArr[vIdx] = vx;
            posArr[vIdx + 1] = vy;
            posArr[vIdx + 2] = vz;

            normArr[vIdx] = nx * invN;
            normArr[vIdx + 1] = ny * invN;
            normArr[vIdx + 2] = nz * invN;
          }

          // Internal axial nerve cord (runs slightly toward oral center of tentacle)
          const nerveR = Math.max(0.003, baseRadius * 0.16);
          for (let j = 0; j <= 6; j++) {
            const theta = (j / 6) * Math.PI * 2;
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);
            const vIdx = (s * 7 + j) * 3;

            const nx = N.x * cosT + B.x * sinT;
            const ny = N.y * cosT + B.y * sinT;
            const nz = N.z * cosT + B.z * sinT;

            nPosArr[vIdx] = P.x + nx * nerveR;
            nPosArr[vIdx + 1] = P.y + ny * nerveR;
            nPosArr[vIdx + 2] = P.z + nz * nerveR;

            nNormArr[vIdx] = nx;
            nNormArr[vIdx + 1] = ny;
            nNormArr[vIdx + 2] = nz;
          }
        }

        posAttr.needsUpdate = true;
        normAttr.needsUpdate = true;
        nPosAttr.needsUpdate = true;
        nNormAttr.needsUpdate = true;

        // -------------------------------------------------------------------
        // D. Position & Orient Two Staggered Rows of 3D Suction Cups (빨판)
        // -------------------------------------------------------------------
        for (let c = 0; c < CUPS_PER_TENTACLE; c++) {
          // Staggered progression along tentacle underside from t = 0.055 to t = 0.92
          const u = 0.055 + (c / (CUPS_PER_TENTACLE - 1)) * 0.865;
          const exactSeg = u * SEGMENTS;
          const s0 = Math.min(SEGMENTS - 1, Math.floor(exactSeg));
          const frac = exactSeg - s0;

          // Interpolate spine position & Bishop frame at u
          tmpVec1.lerpVectors(spine[s0], spine[s0 + 1], frac);       // Center P
          tmpVec2.lerpVectors(normals[s0], normals[s0 + 1], frac).normalize();   // Oral normal N
          tmpVec3.lerpVectors(binormals[s0], binormals[s0 + 1], frac).normalize(); // Lateral B
          const T = cupZ.lerpVectors(tangents[s0], tangents[s0 + 1], frac).normalize();

          // Alternate left (-1) and right (+1) row for authentic staggered biserial arrangement
          const rowSide = c % 2 === 0 ? -1 : 1;
          const tentRadiusAtU = 0.225 * Math.pow(1.0 - u, 1.18) + 0.010 * (1.0 - u * 0.6);

          // Tilt each row ±25 degrees laterally from the oral midline + subtle live flexing
          const cupFlex = Math.sin(w * 2.4 - u * 7.0 + c * 0.6) * 0.08;
          const spreadAngle = rowSide * (0.43 + cupFlex);
          const cosSpread = Math.cos(spreadAngle);
          const sinSpread = Math.sin(spreadAngle);

          // Cup outward axis (Y axis of LatheGeometry) points out from the oral surface
          cupY.set(
            tmpVec2.x * cosSpread + tmpVec3.x * sinSpread,
            tmpVec2.y * cosSpread + tmpVec3.y * sinSpread,
            tmpVec2.z * cosSpread + tmpVec3.z * sinSpread
          ).normalize();

          // Orthonormal basis for the suction cup
          cupX.crossVectors(cupY, T).normalize();
          cupZ.crossVectors(cupX, cupY).normalize();

          cupBasisMat.makeBasis(cupX, cupY, cupZ);
          cupQuat.setFromRotationMatrix(cupBasisMat);

          // Anchor cup slightly embedded into the tentacle's oral flesh surface
          const embedRadius = tentRadiusAtU * 0.78;
          cupPos.set(
            tmpVec1.x + cupY.x * embedRadius,
            tmpVec1.y + cupY.y * embedRadius,
            tmpVec1.z + cupY.z * embedRadius
          );

          // Size of suction cups peaks in the proximal-middle third and tapers smoothly toward tip
          const sizeProfile =
            Math.sin(Math.pow(u, 0.72) * Math.PI) * 0.082 +
            0.048 * Math.pow(1.0 - u, 1.3);
          const cupRadius = Math.max(0.011, sizeProfile);
          const cupHeight = cupRadius * 0.78;

          cupScale.set(cupRadius, cupHeight, cupRadius);
          dummyMatrix.compose(cupPos, cupQuat, cupScale);
          suctionCupsInstanced.setMatrixAt(globalCupIndex++, dummyMatrix);
        }
      }

      suctionCupsInstanced.instanceMatrix.needsUpdate = true;

      // -------------------------------------------------------------------
      // E. Update Translucent Interbrachial Web Membrane Between Tentacles
      // -------------------------------------------------------------------
      const wPosAttr = webGeo.attributes.position;
      const wPosArr = wPosAttr.array;
      const MAX_WEB_SEG = Math.floor(SEGMENTS * 0.27); // Web extends ~27% down the arms

      for (let tIdx = 0; tIdx < NUM_TENTACLES; tIdx++) {
        const nextIdx = (tIdx + 1) % NUM_TENTACLES;
        const tentA = tentacles[tIdx];
        const tentB = tentacles[nextIdx];
        const baseV = tIdx * webVertsPerSector;

        for (let r = 0; r <= WEB_RINGS; r++) {
          const ringFrac = r / WEB_RINGS; // 0 = oral crown, 1 = scalloped web edge
          const exactSeg = ringFrac * MAX_WEB_SEG;
          const s0 = Math.min(MAX_WEB_SEG - 1, Math.floor(exactSeg));
          const sFrac = exactSeg - s0;

          // Endpoints on tentacle A and tentacle B
          tmpVec1.lerpVectors(tentA.spine[s0], tentA.spine[s0 + 1], sFrac);
          tmpVec2.lerpVectors(tentB.spine[s0], tentB.spine[s0 + 1], sFrac);

          for (let c = 0; c <= WEB_SPAN; c++) {
            const spanFrac = c / WEB_SPAN;
            // Smooth interpolation across the gap with catenary scallop & billowing
            const arch = Math.sin(spanFrac * Math.PI);
            const scallopPullback = arch * Math.pow(ringFrac, 1.5) * 0.26;

            let wx = tmpVec1.x + (tmpVec2.x - tmpVec1.x) * spanFrac;
            let wy = tmpVec1.y + (tmpVec2.y - tmpVec1.y) * spanFrac;
            let wz = tmpVec1.z + (tmpVec2.z - tmpVec1.z) * spanFrac;

            // Pull web margin gracefully inward and upward in a catenary curve
            wx *= 1.0 - scallopPullback * 0.48;
            wz *= 1.0 - scallopPullback * 0.48;
            wy += scallopPullback * 0.42 + arch * Math.sin(time * 2.1 - ringFrac * 3.0 + tIdx) * 0.045;

            const vIdx = (baseV + r * (WEB_SPAN + 1) + c) * 3;
            wPosArr[vIdx] = wx;
            wPosArr[vIdx + 1] = wy;
            wPosArr[vIdx + 2] = wz;
          }
        }
      }

      wPosAttr.needsUpdate = true;
      webGeo.computeVertexNormals();
    }

    // =========================================================================
    // 12. MAIN ANIMATION LOOP & RESIZE HANDLER
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Graceful mid-water hovering & gentle swimming posture
      const hoverY = Math.sin(elapsed * 1.15) * 0.22 + Math.cos(elapsed * 0.55) * 0.08 + jetPulseOffset * 0.55;
      octopusRoot.position.y = 0.25 + hoverY;
      octopusRoot.rotation.y = Math.sin(elapsed * 0.28) * 0.24;
      octopusRoot.rotation.z = Math.sin(elapsed * 0.62) * 0.045;
      octopusRoot.rotation.x = 0.08 + Math.cos(elapsed * 0.75) * 0.04;

      // Update soft contact shadow scale & opacity with hovering height
      const shadowScale = 1.0 - hoverY * 0.09;
      contactShadowMesh.scale.set(shadowScale, shadowScale, 1.0);
      contactShadowMesh.material.opacity = 0.78 - hoverY * 0.12;

      // Update mantle, internal organs, 8 tentacles, 352 suction cups & web
      updateMantleAndOrgans(elapsed, dt);
      updateTentaclesAndSuctionCups(elapsed, dt);

      // Drift deep-sea marine snow particles
      const pArr = marineSnow.geometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const ix = i * 3;
        pArr[ix + 1] += dt * (0.14 + 0.06 * Math.sin(pSeeds[i]));
        pArr[ix] += Math.sin(elapsed * 0.5 + pSeeds[i]) * dt * 0.08;
        if (pArr[ix + 1] > 7.0) pArr[ix + 1] = -7.0;
      }
      marineSnow.geometry.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
