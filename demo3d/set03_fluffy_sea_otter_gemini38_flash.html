<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fluffy Baby Sea Otter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #16384c 0%, #0a1b24 100%);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------
    // 1. Scene, Camera & WebGL Renderer Setup
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0e2533, 0.045);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.6, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.04; // Keep camera above water plane
    controls.minDistance = 1.5;
    controls.maxDistance = 8.5;
    controls.target.set(0, 0.15, 0.1);
    controls.update();

    // -------------------------------------------------------------
    // 2. Studio Lighting & Aquatic Mood
    // -------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xdaf5ff, 0x06283d, 1.2);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff6e6, 2.8);
    sunLight.position.set(3.5, 6.0, 4.0);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 16;
    sunLight.shadow.camera.left = -2.5;
    sunLight.shadow.camera.right = 2.5;
    sunLight.shadow.camera.top = 2.5;
    sunLight.shadow.camera.bottom = -2.5;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x76c9ff, 1.8);
    rimLight.position.set(-4.0, 2.5, -4.0);
    scene.add(rimLight);

    const waterBounceLight = new THREE.PointLight(0x38e5d8, 1.6, 6);
    waterBounceLight.position.set(0, -0.6, 0.5);
    scene.add(waterBounceLight);

    // -------------------------------------------------------------
    // 3. Water Patch & Aquatic Environment
    // -------------------------------------------------------------
    const waterGroup = new THREE.Group();
    scene.add(waterGroup);

    // Translucent aquamarine ocean disk
    const waterGeo = new THREE.CylinderGeometry(4.8, 4.8, 0.4, 64, 1);
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x1abec7,
      transmission: 0.88,
      opacity: 0.85,
      transparent: true,
      roughness: 0.12,
      metalness: 0.05,
      ior: 1.333,
      reflectivity: 0.65,
      clearcoat: 0.8,
      clearcoatRoughness: 0.1
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.position.y = -0.2;
    waterMesh.receiveShadow = true;
    waterGroup.add(waterMesh);

    // Deep water bed disk
    const bedGeo = new THREE.CircleGeometry(4.75, 48);
    const bedMat = new THREE.MeshStandardMaterial({
      color: 0x072533,
      roughness: 0.9,
      metalness: 0.1
    });
    const bedMesh = new THREE.Mesh(bedGeo, bedMat);
    bedMesh.rotation.x = -Math.PI / 2;
    bedMesh.position.y = -0.39;
    bedMesh.receiveShadow = true;
    waterGroup.add(bedMesh);

    // Floating Kelp Strands around the otter
    const kelpGroup = new THREE.Group();
    const kelpMaterial = new THREE.MeshStandardMaterial({
      color: 0x225528,
      roughness: 0.4,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    for (let k = 0; k < 7; k++) {
      const angle = (k / 7) * Math.PI * 2 + Math.random() * 0.4;
      const radius = 2.1 + Math.random() * 1.5;
      const kelpCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(Math.cos(angle) * radius, -0.35, Math.sin(angle) * radius),
        new THREE.Vector3(Math.cos(angle) * (radius - 0.2), -0.15, Math.sin(angle) * (radius - 0.2)),
        new THREE.Vector3(Math.cos(angle) * (radius - 0.4) + 0.2, 0.0, Math.sin(angle) * (radius - 0.4) + 0.1),
        new THREE.Vector3(Math.cos(angle) * (radius - 0.7), -0.05, Math.sin(angle) * (radius - 0.7))
      ]);
      const kelpGeo = new THREE.TubeGeometry(kelpCurve, 16, 0.035, 6, false);
      const kelpMesh = new THREE.Mesh(kelpGeo, kelpMaterial);
      kelpMesh.receiveShadow = true;
      kelpGroup.add(kelpMesh);
    }
    waterGroup.add(kelpGroup);

    // Expanding Ripple Rings
    const rippleCount = 4;
    const rippleMeshes = [];
    const rippleGeo = new THREE.RingGeometry(0.8, 0.92, 48);
    rippleGeo.rotateX(-Math.PI / 2);
    for (let r = 0; r < rippleCount; r++) {
      const rippleMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.45,
        side: THREE.DoubleSide
      });
      const rMesh = new THREE.Mesh(rippleGeo, rippleMat);
      rMesh.position.y = 0.008;
      rMesh.userData = { phase: r / rippleCount };
      waterGroup.add(rMesh);
      rippleMeshes.push(rMesh);
    }

    // -------------------------------------------------------------
    // 4. Baby Sea Otter Hierarchy
    // -------------------------------------------------------------
    const otterRoot = new THREE.Group();
    scene.add(otterRoot);

    // Floating body group (receives bobbing, breathing, pitching)
    const otterFloatGroup = new THREE.Group();
    otterRoot.add(otterFloatGroup);

    // Materials
    const darkFurSkinMat = new THREE.MeshStandardMaterial({
      color: 0x331c11,
      roughness: 0.85,
      metalness: 0.05
    });
    const creamFurSkinMat = new THREE.MeshStandardMaterial({
      color: 0xdfba91,
      roughness: 0.85,
      metalness: 0.05
    });
    const leatheryNoseMat = new THREE.MeshStandardMaterial({
      color: 0x111113,
      roughness: 0.28,
      metalness: 0.15
    });
    const glossyEyeMat = new THREE.MeshPhysicalMaterial({
      color: 0x050507,
      roughness: 0.05,
      metalness: 0.1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02
    });
    const flipperPadMat = new THREE.MeshStandardMaterial({
      color: 0xd98585,
      roughness: 0.55,
      metalness: 0.05
    });

    // Raycast collection for interactive mouse petting
    const petTargetMeshes = [];

    // --- Torso & Chubby Belly ---
    const torsoGroup = new THREE.Group();
    otterFloatGroup.add(torsoGroup);

    // Plump elongated body (lying on back, spine towards -Y/water, belly towards +Y)
    const bodyGeo = new THREE.SphereGeometry(0.55, 32, 24);
    bodyGeo.scale(1.0, 0.72, 1.7);
    const bodyMesh = new THREE.Mesh(bodyGeo, darkFurSkinMat);
    bodyMesh.position.set(0, 0.08, 0);
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    torsoGroup.add(bodyMesh);
    petTargetMeshes.push(bodyMesh);

    // Soft round belly mound
    const bellyGeo = new THREE.SphereGeometry(0.42, 24, 20);
    bellyGeo.scale(0.95, 0.65, 1.25);
    const bellyMesh = new THREE.Mesh(bellyGeo, creamFurSkinMat);
    bellyMesh.position.set(0, 0.22, 0.08);
    bellyMesh.castShadow = true;
    bellyMesh.receiveShadow = true;
    torsoGroup.add(bellyMesh);
    petTargetMeshes.push(bellyMesh);

    // --- Cute Baby Head ---
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 0.28, 0.95);
    headGroup.rotation.x = -0.22; // Inquisitive upward gaze
    otterFloatGroup.add(headGroup);

    const headGeo = new THREE.SphereGeometry(0.42, 32, 24);
    headGeo.scale(1.1, 0.98, 1.02);
    const headMesh = new THREE.Mesh(headGeo, creamFurSkinMat);
    headMesh.castShadow = true;
    headMesh.receiveShadow = true;
    headGroup.add(headMesh);
    petTargetMeshes.push(headMesh);

    // Chubby Puffy Cheeks
    const cheekGeo = new THREE.SphereGeometry(0.24, 20, 16);
    cheekGeo.scale(1.1, 0.9, 1.0);
    const leftCheek = new THREE.Mesh(cheekGeo, creamFurSkinMat);
    leftCheek.position.set(0.24, -0.06, 0.16);
    leftCheek.castShadow = true;
    headGroup.add(leftCheek);
    petTargetMeshes.push(leftCheek);

    const rightCheek = leftCheek.clone();
    rightCheek.position.x = -0.24;
    headGroup.add(rightCheek);
    petTargetMeshes.push(rightCheek);

    // Snout / Muzzle
    const snoutGeo = new THREE.SphereGeometry(0.2, 20, 16);
    snoutGeo.scale(1.2, 0.85, 1.0);
    const snoutMesh = new THREE.Mesh(snoutGeo, creamFurSkinMat);
    snoutMesh.position.set(0, -0.05, 0.34);
    snoutMesh.castShadow = true;
    headGroup.add(snoutMesh);
    petTargetMeshes.push(snoutMesh);

    // Diamond Leathery Nose
    const noseGeo = new THREE.CylinderGeometry(0.01, 0.085, 0.075, 4);
    noseGeo.rotateZ(Math.PI / 4);
    noseGeo.scale(1.2, 0.7, 0.9);
    const noseMesh = new THREE.Mesh(noseGeo, leatheryNoseMat);
    noseMesh.position.set(0, 0.02, 0.50);
    noseMesh.rotation.x = 0.45;
    noseMesh.castShadow = true;
    headGroup.add(noseMesh);

    // Dual Catchlight Eyes (Heart-melting baby otter expression)
    const eyeGeo = new THREE.SphereGeometry(0.055, 20, 16);
    const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function createEye(isRight) {
      const eyePivot = new THREE.Group();
      eyePivot.position.set(isRight ? -0.21 : 0.21, 0.08, 0.35);

      const eye = new THREE.Mesh(eyeGeo, glossyEyeMat);
      eye.castShadow = true;
      eyePivot.add(eye);

      // Primary catchlight
      const cl1 = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 8), catchlightMat);
      cl1.position.set(isRight ? -0.018 : 0.018, 0.022, 0.048);
      eyePivot.add(cl1);

      // Secondary twinkle catchlight
      const cl2 = new THREE.Mesh(new THREE.SphereGeometry(0.009, 8, 8), catchlightMat);
      cl2.position.set(isRight ? 0.015 : -0.015, -0.018, 0.048);
      eyePivot.add(cl2);

      return eyePivot;
    }
    headGroup.add(createEye(false));
    headGroup.add(createEye(true));

    // Cute Rounded Teddy Bear Ears
    const earGeo = new THREE.SphereGeometry(0.11, 16, 12);
    earGeo.scale(0.65, 0.9, 0.5);
    const leftEar = new THREE.Mesh(earGeo, darkFurSkinMat);
    leftEar.position.set(0.42, 0.16, -0.08);
    leftEar.rotation.set(0.2, 0.4, -0.3);
    headGroup.add(leftEar);

    const rightEar = leftEar.clone();
    rightEar.position.x = -0.42;
    rightEar.rotation.set(0.2, -0.4, 0.3);
    headGroup.add(rightEar);

    // White Vibrissae Whiskers
    const whiskerMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.3,
      metalness: 0.1
    });
    const whiskersGroup = new THREE.Group();
    headGroup.add(whiskersGroup);

    for (let side = -1; side <= 1; side += 2) {
      for (let w = 0; w < 12; w++) {
        const row = Math.floor(w / 4);
        const col = w % 4;
        const startX = side * (0.12 + col * 0.035);
        const startY = -0.04 - row * 0.035;
        const startZ = 0.38 + col * 0.015;

        const whiskerCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(startX, startY, startZ),
          new THREE.Vector3(startX + side * 0.18, startY + 0.01, startZ - 0.05),
          new THREE.Vector3(startX + side * 0.38, startY - 0.06 - row * 0.02, startZ - 0.16)
        ]);
        const wGeo = new THREE.TubeGeometry(whiskerCurve, 10, 0.0035, 4, false);
        const wMesh = new THREE.Mesh(wGeo, whiskerMat);
        whiskersGroup.add(wMesh);
      }
    }

    // --- Forearms & Paws Holding Scallop Shell ---
    const pawsGroup = new THREE.Group();
    otterFloatGroup.add(pawsGroup);

    // Scallop Shell (Parametric Ribbed Fan Design)
    const shellGroup = new THREE.Group();
    shellGroup.position.set(0, 0.38, 0.28);
    shellGroup.rotation.set(0.55, 0, 0);
    otterFloatGroup.add(shellGroup);

    function createScallopShell() {
      const shellGeom = new THREE.BufferGeometry();
      const uSegs = 36;
      const vSegs = 20;
      const positions = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      for (let j = 0; j <= vSegs; j++) {
        const v = j / vSegs; // 0 to 1 radius
        const r = Math.pow(v, 0.85) * 0.28;
        for (let i = 0; i <= uSegs; i++) {
          const u = i / uSegs; // 0 to 1 fan angle
          const theta = (u - 0.5) * Math.PI * 0.72;

          // Rib ripples
          const ribs = Math.sin(u * Math.PI * 18) * 0.016 * v;
          const dishCup = Math.sin(v * Math.PI) * 0.055;

          const x = Math.sin(theta) * r;
          const y = dishCup + ribs;
          const z = Math.cos(theta) * r;

          positions.push(x, y, z);
          uvs.push(u, v);
        }
      }

      for (let j = 0; j < vSegs; j++) {
        for (let i = 0; i < uSegs; i++) {
          const a = j * (uSegs + 1) + i;
          const b = (j + 1) * (uSegs + 1) + i;
          const c = (j + 1) * (uSegs + 1) + (i + 1);
          const d = j * (uSegs + 1) + (i + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      shellGeom.setIndex(indices);
      shellGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      shellGeom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      shellGeom.computeVertexNormals();

      const shellMat = new THREE.MeshPhysicalMaterial({
        color: 0xe692bb,
        roughness: 0.22,
        metalness: 0.15,
        clearcoat: 0.65,
        clearcoatRoughness: 0.15,
        reflectivity: 0.8,
        side: THREE.DoubleSide
      });

      return new THREE.Mesh(shellGeom, shellMat);
    }
    const scallopMesh = createScallopShell();
    scallopMesh.castShadow = true;
    scallopMesh.receiveShadow = true;
    shellGroup.add(scallopMesh);

    // Left Paw (Holding shell side)
    const pawGeo = new THREE.SphereGeometry(0.08, 16, 12);
    pawGeo.scale(1.1, 0.7, 1.3);

    const leftArmGroup = new THREE.Group();
    leftArmGroup.position.set(0.36, 0.22, 0.32);
    const leftArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.28, 12), darkFurSkinMat);
    leftArmMesh.position.set(-0.08, 0.05, 0.02);
    leftArmMesh.rotation.set(-0.4, 0.2, 1.1);
    leftArmGroup.add(leftArmMesh);

    const leftPaw = new THREE.Mesh(pawGeo, darkFurSkinMat);
    leftPaw.position.set(-0.19, 0.14, 0.02);
    leftPaw.castShadow = true;
    leftArmGroup.add(leftPaw);
    pawsGroup.add(leftArmGroup);
    petTargetMeshes.push(leftPaw);

    // Right Arm & Paw (Taps shell cutely)
    const rightArmGroup = new THREE.Group();
    rightArmGroup.position.set(-0.36, 0.22, 0.32);
    const rightArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.28, 12), darkFurSkinMat);
    rightArmMesh.position.set(0.08, 0.05, 0.02);
    rightArmMesh.rotation.set(-0.4, -0.2, -1.1);
    rightArmGroup.add(rightArmMesh);

    const rightPaw = new THREE.Mesh(pawGeo, darkFurSkinMat);
    rightPaw.position.set(0.19, 0.14, 0.02);
    rightPaw.castShadow = true;
    rightArmGroup.add(rightPaw);
    pawsGroup.add(rightArmGroup);
    petTargetMeshes.push(rightPaw);

    // --- Webbed Hind Flippers (Paddling upright) ---
    const flippersGroup = new THREE.Group();
    otterFloatGroup.add(flippersGroup);

    function createWebbedFlipper(isRight) {
      const flipperAssembly = new THREE.Group();
      flipperAssembly.position.set(isRight ? -0.42 : 0.42, 0.12, -0.75);

      // Thigh / leg
      const legGeo = new THREE.CylinderGeometry(0.10, 0.13, 0.32, 12);
      const leg = new THREE.Mesh(legGeo, darkFurSkinMat);
      leg.rotation.set(0.7, isRight ? -0.2 : 0.2, isRight ? -0.3 : 0.3);
      leg.position.set(0, 0.08, 0.05);
      flipperAssembly.add(leg);

      // Wide webbed flipper paddle sticking up
      const paddleGroup = new THREE.Group();
      paddleGroup.position.set(isRight ? -0.08 : 0.08, 0.22, -0.08);
      paddleGroup.rotation.set(-0.65, 0, isRight ? 0.35 : -0.35);

      const paddleGeo = new THREE.BoxGeometry(0.24, 0.035, 0.36);
      const paddle = new THREE.Mesh(paddleGeo, darkFurSkinMat);
      paddle.castShadow = true;
      paddleGroup.add(paddle);

      // 5 soft pink toe pads
      for (let t = -2; t <= 2; t++) {
        const pad = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), flipperPadMat);
        pad.scale.set(0.9, 0.6, 1.4);
        pad.position.set(t * 0.048, 0.016, 0.16);
        paddleGroup.add(pad);
      }

      // Central pink sole pad
      const solePad = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), flipperPadMat);
      solePad.scale.set(1.4, 0.4, 1.8);
      solePad.position.set(0, 0.018, -0.02);
      paddleGroup.add(solePad);

      flipperAssembly.add(paddleGroup);
      flipperAssembly.userData = { paddleGroup, isRight };
      petTargetMeshes.push(paddle);

      return flipperAssembly;
    }
    const leftFlipper = createWebbedFlipper(false);
    const rightFlipper = createWebbedFlipper(true);
    flippersGroup.add(leftFlipper);
    flippersGroup.add(rightFlipper);

    // --- Flattened Rudder Tail ---
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 0.04, -0.85);
    const tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, -0.04, -0.32),
      new THREE.Vector3(0, -0.06, -0.72)
    ]);
    const tailGeo = new THREE.TubeGeometry(tailCurve, 16, 0.09, 12, false);
    tailGeo.scale(1.4, 0.65, 1.0); // Flattened paddle-like tail
    const tailMesh = new THREE.Mesh(tailGeo, darkFurSkinMat);
    tailMesh.castShadow = true;
    tailMesh.receiveShadow = true;
    tailGroup.add(tailMesh);
    otterFloatGroup.add(tailGroup);
    petTargetMeshes.push(tailMesh);

    // -------------------------------------------------------------
    // 5. 26,000+ Individual 3D Fur Strands (`InstancedMesh`)
    // -------------------------------------------------------------
    const TOTAL_FUR_STRANDS = 26500; // Well exceeds the 20,000 requirement

    // Strand 3D geometry: slender tapered cone
    const furStrandGeo = new THREE.ConeGeometry(0.0075, 0.095, 4);
    furStrandGeo.translate(0, 0.0475, 0); // Base at origin
    furStrandGeo.rotateX(Math.PI / 2); // Point along +Z

    const furMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.88,
      metalness: 0.02,
      shadowSide: THREE.DoubleSide
    });

    const furInstancedMesh = new THREE.InstancedMesh(furStrandGeo, furMaterial, TOTAL_FUR_STRANDS);
    furInstancedMesh.castShadow = true;
    furInstancedMesh.receiveShadow = true;
    otterFloatGroup.add(furInstancedMesh);

    // Strand tracking structures
    const furBasePos = new Float32Array(TOTAL_FUR_STRANDS * 3);
    const furBaseNorm = new Float32Array(TOTAL_FUR_STRANDS * 3);
    const furDeflections = new Float32Array(TOTAL_FUR_STRANDS * 3);
    const furLengths = new Float32Array(TOTAL_FUR_STRANDS);
    const furTargetGroupIndex = new Uint8Array(TOTAL_FUR_STRANDS); // 0: torso, 1: head, 2: tail, 3: flippers

    // Palette Colors
    const colDarkBrown = new THREE.Color(0x351f14);
    const colMidBrown = new THREE.Color(0x4d301f);
    const colWarmTan = new THREE.Color(0x8f6a4b);
    const colCheekCream = new THREE.Color(0xe8c7a2);
    const colMuzzleBlonde = new THREE.Color(0xf6e5ce);

    const dummy = new THREE.Object3D();
    const upVec = new THREE.Vector3(0, 1, 0);
    const tempQuat = new THREE.Quaternion();
    const tempDir = new THREE.Vector3();
    const tempColor = new THREE.Color();

    let furIndex = 0;

    // Helper: generate golden spiral points on ellipsoid
    function generateFurOnSurface(count, center, radii, rotEuler, groupType, colorProfile) {
      const phiRatio = (1 + Math.sqrt(5)) / 2;
      const rotMatrix = new THREE.Matrix4().makeRotationFromEuler(rotEuler);

      for (let i = 0; i < count && furIndex < TOTAL_FUR_STRANDS; i++) {
        // Uniform spherical sampling
        const y = 1 - (i / (count - 1)) * 2;
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = 2 * Math.PI * i / phiRatio;

        const x = Math.cos(theta) * radiusAtY;
        const z = Math.sin(theta) * radiusAtY;

        // Ellipsoidal position & surface normal
        const localPos = new THREE.Vector3(x * radii.x, y * radii.y, z * radii.z);
        const localNorm = new THREE.Vector3(x / radii.x, y / radii.y, z / radii.z).normalize();

        // Apply rotation and center translation
        localPos.applyMatrix4(rotMatrix).add(center);
        localNorm.applyMatrix4(rotMatrix).normalize();

        // Waterline clipping (less dense underneath water line)
        if (localPos.y < -0.12 && Math.random() > 0.35) continue;

        // Store positions
        furBasePos[furIndex * 3 + 0] = localPos.x;
        furBasePos[furIndex * 3 + 1] = localPos.y;
        furBasePos[furIndex * 3 + 2] = localPos.z;

        // Combed orientation: blend surface normal with slight backwards groom
        const groomDir = new THREE.Vector3(0, 0, -1);
        const finalNorm = localNorm.clone().addScaledVector(groomDir, 0.25).normalize();

        furBaseNorm[furIndex * 3 + 0] = finalNorm.x;
        furBaseNorm[furIndex * 3 + 1] = finalNorm.y;
        furBaseNorm[furIndex * 3 + 2] = finalNorm.z;

        // Length variation
        const length = (colorProfile.baseLength || 0.08) * (0.85 + Math.random() * 0.35);
        furLengths[furIndex] = length;
        furTargetGroupIndex[furIndex] = groupType;

        // Color computation
        if (colorProfile.type === 'head') {
          // Creamy face, lighter cheeks/snout, darker brow
          if (localPos.z > 0.22 && localPos.y > -0.05) {
            tempColor.lerpColors(colCheekCream, colMuzzleBlonde, (localPos.z - 0.22) * 3.5);
          } else {
            tempColor.lerpColors(colWarmTan, colCheekCream, 0.5);
          }
        } else if (colorProfile.type === 'torso') {
          // Creamy chest/belly, chocolate back
          if (localPos.y > 0.15 && Math.abs(localPos.x) < 0.28) {
            tempColor.lerpColors(colWarmTan, colCheekCream, (localPos.y - 0.15) * 2.0);
          } else {
            tempColor.lerpColors(colDarkBrown, colMidBrown, Math.random());
          }
        } else {
          // Dense waterproof dark brown coat
          tempColor.lerpColors(colDarkBrown, colMidBrown, Math.random() * 0.4);
        }

        // Slight micro-variation per strand for realistic depth
        tempColor.offsetHSL(0, 0, (Math.random() - 0.5) * 0.06);
        furInstancedMesh.setColorAt(furIndex, tempColor);

        // Initial matrix setup
        dummy.position.copy(localPos);
        tempDir.copy(finalNorm);
        dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tempDir);
        dummy.scale.set(1, 1, length / 0.095);
        dummy.updateMatrix();
        furInstancedMesh.setMatrixAt(furIndex, dummy.matrix);

        furIndex++;
      }
    }

    // Populate the fur across the otter anatomy:
    // 1. Torso & Belly (~13,500 strands)
    generateFurOnSurface(13800, new THREE.Vector3(0, 0.10, 0.0), new THREE.Vector3(0.52, 0.38, 0.88), new THREE.Euler(0, 0, 0), 0, { type: 'torso', baseLength: 0.09 });

    // 2. Head & Cheeks & Chin (~7,500 strands, fluffy baby fur)
    generateFurOnSurface(7800, new THREE.Vector3(0, 0.28, 0.95), new THREE.Vector3(0.44, 0.40, 0.42), new THREE.Euler(-0.22, 0, 0), 1, { type: 'head', baseLength: 0.11 });

    // 3. Forearms & Shoulders (~2,400 strands)
    generateFurOnSurface(1200, new THREE.Vector3(0.32, 0.22, 0.32), new THREE.Vector3(0.14, 0.12, 0.22), new THREE.Euler(-0.3, 0.2, 0.8), 0, { type: 'dark', baseLength: 0.075 });
    generateFurOnSurface(1200, new THREE.Vector3(-0.32, 0.22, 0.32), new THREE.Vector3(0.14, 0.12, 0.22), new THREE.Euler(-0.3, -0.2, -0.8), 0, { type: 'dark', baseLength: 0.075 });

    // 4. Tail & Flanks (~2,200 strands)
    generateFurOnSurface(2400, new THREE.Vector3(0, 0.02, -0.85), new THREE.Vector3(0.24, 0.12, 0.52), new THREE.Euler(0, 0, 0), 2, { type: 'dark', baseLength: 0.08 });

    furInstancedMesh.instanceMatrix.needsUpdate = true;
    if (furInstancedMesh.instanceColor) furInstancedMesh.instanceColor.needsUpdate = true;

    // -------------------------------------------------------------
    // 6. Interactive Mouse Physics (Petting & Brushing Fur)
    // -------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    const prevMousePos = new THREE.Vector3();
    const mouseDelta = new THREE.Vector3();
    let isInteracting = false;
    let lastHitWorld = new THREE.Vector3();

    // Floating bubble burst effect upon clicking or petting
    const bubbleCount = 35;
    const bubbleGeo = new THREE.SphereGeometry(0.022, 12, 10);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: 0xebffff,
      transmission: 0.95,
      opacity: 0.8,
      transparent: true,
      roughness: 0.05,
      ior: 1.2
    });
    const bubbleInstanced = new THREE.InstancedMesh(bubbleGeo, bubbleMat, bubbleCount);
    bubbleInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(bubbleInstanced);

    const bubbles = [];
    for (let b = 0; b < bubbleCount; b++) {
      bubbles.push({
        active: false,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        life: 0,
        maxLife: 1.0,
        scale: 1.0
      });
      const dummyB = new THREE.Object3D();
      dummyB.scale.set(0, 0, 0);
      dummyB.updateMatrix();
      bubbleInstanced.setMatrixAt(b, dummyB.matrix);
    }
    bubbleInstanced.instanceMatrix.needsUpdate = true;

    function spawnPetBubbles(centerPoint, strength) {
      for (let i = 0; i < 4; i++) {
        const freeB = bubbles.find(b => !b.active);
        if (!freeB) break;
        freeB.active = true;
        freeB.pos.copy(centerPoint).add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.15,
          (Math.random() - 0.5) * 0.08,
          (Math.random() - 0.5) * 0.15
        ));
        freeB.vel.set(
          (Math.random() - 0.5) * 0.4 * strength,
          0.3 + Math.random() * 0.5 * strength,
          (Math.random() - 0.5) * 0.4 * strength
        );
        freeB.life = 0;
        freeB.maxLife = 0.6 + Math.random() * 0.5;
        freeB.scale = 0.5 + Math.random() * 0.8;
      }
    }

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      isInteracting = true;
    });

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycastPet(true);
    });

    function raycastPet(isClick) {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(petTargetMeshes, false);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const hitLocal = hit.point.clone();
        otterFloatGroup.worldToLocal(hitLocal);

        // Calculate stroke direction in local otter coordinates
        const curHitWorld = hit.point.clone();
        mouseDelta.subVectors(curHitWorld, lastHitWorld);
        lastHitWorld.copy(curHitWorld);

        const strokeRadius = 0.48;
        const pushForce = isClick ? 0.35 : 0.15;

        // Apply deflection to nearby fur strands
        for (let i = 0; i < furIndex; i++) {
          const dx = furBasePos[i * 3 + 0] - hitLocal.x;
          const dy = furBasePos[i * 3 + 1] - hitLocal.y;
          const dz = furBasePos[i * 3 + 2] - hitLocal.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < strokeRadius * strokeRadius) {
            const dist = Math.sqrt(distSq);
            const falloff = 1 - dist / strokeRadius;

            // Push outward from stroke center + in mouse movement direction
            furDeflections[i * 3 + 0] += (dx / dist * 0.08 + mouseDelta.x * 2.0) * falloff * pushForce;
            furDeflections[i * 3 + 1] += (dy / dist * 0.08 + mouseDelta.y * 2.0) * falloff * pushForce;
            furDeflections[i * 3 + 2] += (dz / dist * 0.08 + mouseDelta.z * 2.0) * falloff * pushForce;

            // Clamp deflection magnitude
            const maxDef = 0.14;
            const defMag = Math.sqrt(
              furDeflections[i * 3 + 0] ** 2 +
              furDeflections[i * 3 + 1] ** 2 +
              furDeflections[i * 3 + 2] ** 2
            );
            if (defMag > maxDef) {
              const s = maxDef / defMag;
              furDeflections[i * 3 + 0] *= s;
              furDeflections[i * 3 + 1] *= s;
              furDeflections[i * 3 + 2] *= s;
            }
          }
        }

        spawnPetBubbles(hit.point, isClick ? 1.6 : 0.8);
      }
    }

    // -------------------------------------------------------------
    // 7. Render Loop & Lifelike Animations
    // -------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      controls.update();

      // --- Interactive Fur Raycasting ---
      if (isInteracting) {
        raycastPet(false);
      }

      // --- 1. Water Bobbing & Buoyancy ---
      const bobY = Math.sin(elapsedTime * 1.6) * 0.038;
      const pitchX = Math.sin(elapsedTime * 1.2) * 0.024;
      const rollZ = Math.cos(elapsedTime * 0.9) * 0.018;

      otterFloatGroup.position.y = bobY;
      otterFloatGroup.rotation.x = pitchX;
      otterFloatGroup.rotation.z = rollZ;

      // --- 2. Chest & Belly Breathing Motion ---
      const breath = Math.sin(elapsedTime * 2.4);
      bellyMesh.scale.set(0.95, 0.65 + breath * 0.022, 1.25 + breath * 0.015);
      torsoGroup.scale.set(1.0, 1.0 + breath * 0.012, 1.0 + breath * 0.008);

      // --- 3. Shell Tapping by Right Paw ---
      // Sea otters playfully tap shells on their chest in rhythmic bursts
      const tapBurst = Math.sin(elapsedTime * 4.8);
      const isTapping = Math.sin(elapsedTime * 0.8) > -0.2;
      const tapAngle = isTapping ? Math.max(0, tapBurst) * 0.18 : 0;
      rightPaw.position.y = 0.14 + tapAngle * 0.35;
      rightPaw.position.z = 0.02 - tapAngle * 0.15;
      scallopMesh.rotation.x = tapAngle * 0.08;

      // --- 4. Hind Flippers Wiggling / Paddling ---
      const paddleSpeed = 2.4;
      const flipperL = leftFlipper.userData.paddleGroup;
      const flipperR = rightFlipper.userData.paddleGroup;
      flipperL.rotation.x = -0.65 + Math.sin(elapsedTime * paddleSpeed) * 0.14;
      flipperR.rotation.x = -0.65 + Math.sin(elapsedTime * paddleSpeed + Math.PI) * 0.14;

      // --- 5. Inquisitive Head Sway & Whiskers Twitch ---
      headGroup.rotation.y = Math.sin(elapsedTime * 0.8) * 0.06;
      headGroup.rotation.z = Math.cos(elapsedTime * 0.7) * 0.04;
      const twitch = Math.sin(elapsedTime * 9.5) * 0.015;
      whiskersGroup.rotation.y = twitch;

      // --- 6. Tail Water Drag Sway ---
      tailGroup.rotation.y = Math.sin(elapsedTime * 1.5) * 0.09;

      // --- 7. Dynamic Water Ripples Animation ---
      rippleMeshes.forEach((mesh) => {
        mesh.userData.phase = (mesh.userData.phase + 0.0045) % 1.0;
        const p = mesh.userData.phase;
        const scale = 1.0 + p * 2.4;
        mesh.scale.set(scale, scale, scale);
        mesh.material.opacity = Math.sin(p * Math.PI) * 0.42;
      });

      // --- 8. Dynamic Fur Strands Spring Simulation & Rendering ---
      const decay = 0.91; // Spring damping
      const waveFreq = elapsedTime * 3.5;

      for (let i = 0; i < furIndex; i++) {
        // Damping deflection
        furDeflections[i * 3 + 0] *= decay;
        furDeflections[i * 3 + 1] *= decay;
        furDeflections[i * 3 + 2] *= decay;

        const bx = furBasePos[i * 3 + 0];
        const by = furBasePos[i * 3 + 1];
        const bz = furBasePos[i * 3 + 2];

        // Breathing offset on torso & belly fur
        let breathOffset = 0;
        if (furTargetGroupIndex[i] === 0 && by > 0.1) {
          breathOffset = breath * 0.012;
        }

        // Ambient aquatic drift/wind sway
        const sway = Math.sin(waveFreq + bx * 4.0 + bz * 4.0) * 0.018;

        dummy.position.set(
          bx + furDeflections[i * 3 + 0],
          by + furDeflections[i * 3 + 1] + breathOffset,
          bz + furDeflections[i * 3 + 2]
        );

        // Direction aligns with normal + pet deflection + sway
        tempDir.set(
          furBaseNorm[i * 3 + 0] + furDeflections[i * 3 + 0] * 1.8 + sway,
          furBaseNorm[i * 3 + 1] + furDeflections[i * 3 + 1] * 1.8,
          furBaseNorm[i * 3 + 2] + furDeflections[i * 3 + 2] * 1.8
        ).normalize();

        dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tempDir);
        dummy.scale.set(1.0, 1.0, furLengths[i] / 0.095);
        dummy.updateMatrix();

        furInstancedMesh.setMatrixAt(i, dummy.matrix);
      }
      furInstancedMesh.instanceMatrix.needsUpdate = true;

      // --- 9. Bubble Particle Dynamics ---
      let activeBubbles = false;
      for (let b = 0; b < bubbleCount; b++) {
        const bub = bubbles[b];
        if (bub.active) {
          bub.life += 0.016;
          if (bub.life >= bub.maxLife) {
            bub.active = false;
            dummy.scale.set(0, 0, 0);
          } else {
            bub.pos.addScaledVector(bub.vel, 0.016);
            bub.vel.y += 0.008; // Buoyancy upward
            const popScale = Math.sin((bub.life / bub.maxLife) * Math.PI) * bub.scale;
            dummy.position.copy(bub.pos);
            dummy.scale.set(popScale, popScale, popScale);
            activeBubbles = true;
          }
          dummy.updateMatrix();
          bubbleInstanced.setMatrixAt(b, dummy.matrix);
        }
      }
      if (activeBubbles) {
        bubbleInstanced.instanceMatrix.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    // -------------------------------------------------------------
    // 8. Responsive Resize
    // -------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Animation Loop
    animate();
  </script>
</body>
