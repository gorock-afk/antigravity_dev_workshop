    cMid: { value: new THREE.Color('#f5e1d8') },
    cBot: { value: new THREE.Color('#e8d1c7') }
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 cTop, cMid, cBot;
    varying vec3 vDir;
    void main(){
      float h = vDir.y;
      vec3 c = h > 0.0 ? mix(cMid, cTop, smoothstep(0.0, 0.55, h)) : mix(cMid, cBot, smoothstep(0.0, -0.25, h));
      float vig = 1.0 - 0.06 * pow(abs(vDir.x), 2.0);
      gl_FragColor = vec4(c * vig, 1.0);

    }`
});

function makeBlobTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0.0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.35, 'rgba(255,255,255,0.7)');
  gr.addColorStop(0.7, 'rgba(255,255,255,0.2)');
  gr.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const BLOB = makeBlobTexture();

function roundedLathe(R, H, bev, seg = 10) {
  const pts = [new THREE.Vector2(0, 0)];
  for (let i = 0; i <= seg; i++) {
    const a = -Math.PI / 2 + (i / seg) * Math.PI / 2;
    pts.push(new THREE.Vector2(R - bev + Math.cos(a) * bev, bev + Math.sin(a) * bev));
  }
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI / 2;
    pts.push(new THREE.Vector2(R - bev + Math.cos(a) * bev, H - bev + Math.sin(a) * bev));
  }
  pts.push(new THREE.Vector2(0, H));
  return new THREE.LatheGeometry(pts, 160);
}

/* ------------------------------------------------------------------ */
/*  Gummy bear SDF sculpt                                              */
/* ------------------------------------------------------------------ */
function sdEll(x, y, z, rx, ry, rz) {
  const a = x / rx, b = y / ry, c = z / rz;
  const k0 = Math.sqrt(a * a + b * b + c * c);
  const a2 = a / rx, b2 = b / ry, c2 = c / rz;
  const k1 = Math.sqrt(a2 * a2 + b2 * b2 + c2 * c2);
  return k1 < 1e-9 ? -Math.min(rx, ry, rz) : k0 * (k0 - 1) / k1;
}
function sdCap(x, y, z, ax, ay, az, bx, by, bz, r) {
  const px = x - ax, py = y - ay, pz = z - az, qx = bx - ax, qy = by - ay, qz = bz - az;
  let h = (px * qx + py * qy + pz * qz) / (qx * qx + qy * qy + qz * qz);
  h = h < 0 ? 0 : h > 1 ? 1 : h;
  const dx = px - qx * h, dy = py - qy * h, dz = pz - qz * h;
  return Math.sqrt(dx * dx + dy * dy + dz * dz) - r;
}
function sdSph(x, y, z, r) { return Math.sqrt(x * x + y * y + z * z) - r; }
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }
function smax(a, b, k) { return -smin(-a, -b, k); }

function sdBear(x, y, z) {
  const ax = Math.abs(x);
  // chubby body + rounded belly
  let d = sdEll(x, y - 0.68, z, 0.52, 0.58, 0.44);
  d = smin(d, sdEll(x, y - 0.60, z - 0.10, 0.45, 0.44, 0.38), 0.12);
  // head
  d = smin(d, sdEll(x, y - 1.42, z - 0.02, 0.50, 0.43, 0.42), 0.14);
  // round ears
  d = smin(d, sdEll(ax - 0.34, y - 1.78, z + 0.02, 0.155, 0.15, 0.10), 0.07);
  // muzzle
  d = smin(d, sdEll(x, y - 1.32, z - 0.36, 0.22, 0.15, 0.13), 0.07);
  // embossed nose bump
  d = smin(d, sdEll(x, y - 1.40, z - 0.47, 0.075, 0.055, 0.05), 0.03);
  // embossed eyes
  d = smin(d, sdSph(ax - 0.17, y - 1.54, z - 0.385, 0.042), 0.025);
  // stubby arms
  d = smin(d, sdCap(ax, y, z, 0.42, 0.95, 0.04, 0.70, 0.62, 0.20, 0.13), 0.07);
  // stubby legs + feet
  d = smin(d, sdCap(ax, y, z, 0.25, 0.45, 0.0, 0.28, 0.20, 0.08, 0.19), 0.08);
  d = smin(d, sdEll(ax - 0.28, y - 0.16, z - 0.12, 0.20, 0.16, 0.25), 0.06);

  // ear cups
  if (y > 1.55 && z > -0.05) d = smax(d, -sdSph(ax - 0.34, y - 1.79, z - 0.12, 0.07), 0.03);
  // toe grooves (paw indentations on feet)
  if (y < 0.34 && z > 0.18) {
    for (const s of [-0.065, 0.065]) {
      d = smax(d, -sdCap(ax, y, z, 0.28 + s, 0.07, 0.352, 0.28 + s, 0.25, 0.352, 0.02), 0.015);
    }
    d = smax(d, -sdSph(ax - 0.28, y - 0.17, z - 0.405, 0.05), 0.02);
  }
  // paw pad dimples at arm tips
  if (ax > 0.6 && y < 0.75) d = smax(d, -sdSph(ax - 0.803, y - 0.498, z - 0.259, 0.055), 0.02);
  // U-shaped smile groove + philtrum
  if (z > 0.3 && y > 1.15 && y < 1.46 && ax < 0.2) {
    const zc = 0.36 + 0.13 * Math.sqrt(Math.max(0, 1 - (x / 0.22) ** 2 - ((y - 1.32) / 0.15) ** 2)) + 0.008;
    const qy = y - 1.30;
    let dr = qy < 0 ? Math.abs(Math.sqrt(x * x + qy * qy) - 0.075) : Math.sqrt((ax - 0.075) ** 2 + qy * qy);
    const py2 = y < 1.30 ? 1.30 - y : (y > 1.35 ? y - 1.35 : 0);
    dr = Math.min(dr, Math.sqrt(x * x + py2 * py2));
    const tube = Math.sqrt(dr * dr + (z - zc) ** 2) - 0.022;
    d = smax(d, -tube, 0.01);
  }
  return d;
}

/* Naive surface nets polygonizer with analytic SDF normals */
function buildGummyGeometry(R) {
  const X0 = -0.92, Y0 = -0.06, Z0 = -0.52;
  const NX = Math.round(1.84 / R) + 1, NY = Math.round(2.06 / R) + 1, NZ = Math.round(1.12 / R) + 1;
  const SY = NX, SZ = NX * NY;
  const F = new Float32Array(NX * NY * NZ);
  let q = 0;
  for (let k = 0; k < NZ; k++) {
    const z = Z0 + k * R;
    for (let j = 0; j < NY; j++) {
      const y = Y0 + j * R;
      for (let i = 0; i < NX; i++) F[q++] = sdBear(X0 + i * R, y, z);
    }
  }
  const CX = NX - 1, CY = NY - 1, CZ = NZ - 1, CXY = CX * CY;
  const cellV = new Int32Array(CX * CY * CZ).fill(-1);
  const pos = [];
  const off = [0, 1, SY, 1 + SY, SZ, 1 + SZ, SY + SZ, 1 + SY + SZ];
  const E = [];
  for (let c = 0; c < 8; c++) for (let bit = 0; bit < 3; bit++) if (!(c & (1 << bit))) E.push(c, c | (1 << bit));
  const cv = new Float32Array(8);
  let vc = 0;
  for (let k = 0; k < CZ; k++) for (let j = 0; j < CY; j++) for (let i = 0; i < CX; i++) {
    const b0 = i + j * SY + k * SZ;
    let mask = 0;
    for (let c = 0; c < 8; c++) { const v = F[b0 + off[c]]; cv[c] = v; if (v < 0) mask |= (1 << c); }
    if (mask === 0 || mask === 255) continue;
    let sx = 0, sy = 0, sz = 0, n = 0;
    for (let e = 0; e < 24; e += 2) {
      const a = E[e], b = E[e + 1], va = cv[a], vb = cv[b];
      if ((va < 0) === (vb < 0)) continue;
      const t = va / (va - vb);
      const ax = a & 1, ay = (a >> 1) & 1, az = (a >> 2) & 1;
      const bx = b & 1, by = (b >> 1) & 1, bz = (b >> 2) & 1;
      sx += ax + (bx - ax) * t; sy += ay + (by - ay) * t; sz += az + (bz - az) * t; n++;
    }
    pos.push(X0 + (i + sx / n) * R, Y0 + (j + sy / n) * R, Z0 + (k + sz / n) * R);
    cellV[i + j * CX + k * CXY] = vc++;
  }
  const nrm = new Float32Array(pos.length);
  const eps = 0.0025;
  for (let v = 0; v < vc; v++) {
    const x = pos[3 * v], y = pos[3 * v + 1], z = pos[3 * v + 2];
    const gx = sdBear(x + eps, y, z) - sdBear(x - eps, y, z);
    const gy = sdBear(x, y + eps, z) - sdBear(x, y - eps, z);
    const gz = sdBear(x, y, z + eps) - sdBear(x, y, z - eps);
    const l = Math.hypot(gx, gy, gz) || 1;
    nrm[3 * v] = gx / l; nrm[3 * v + 1] = gy / l; nrm[3 * v + 2] = gz / l;
  }
  const idx = [];
  const quad = (c0, c1, c2, c3) => {
    const a = cellV[c0], b = cellV[c1], c = cellV[c2], d = cellV[c3];
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    const ux = pos[3 * b] - pos[3 * a], uy = pos[3 * b + 1] - pos[3 * a + 1], uz = pos[3 * b + 2] - pos[3 * a + 2];
    const wx = pos[3 * c] - pos[3 * a], wy = pos[3 * c + 1] - pos[3 * a + 1], wz = pos[3 * c + 2] - pos[3 * a + 2];
    const fx = uy * wz - uz * wy, fy = uz * wx - ux * wz, fz = ux * wy - uy * wx;
    const s = fx * (nrm[3 * a] + nrm[3 * b] + nrm[3 * c]) +
              fy * (nrm[3 * a + 1] + nrm[3 * b + 1] + nrm[3 * c + 1]) +
              fz * (nrm[3 * a + 2] + nrm[3 * b + 2] + nrm[3 * c + 2]);
    if (s >= 0) idx.push(a, b, c, a, c, d); else idx.push(a, c, b, a, d, c);
  };
  for (let k = 0; k < NZ; k++) for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const p0 = i + j * SY + k * SZ;
    const in0 = F[p0] < 0;
    if (i < NX - 1 && j > 0 && k > 0 && j < NY - 1 && k < NZ - 1 && in0 !== (F[p0 + 1] < 0))
      quad(i + (j - 1) * CX + (k - 1) * CXY, i + j * CX + (k - 1) * CXY, i + j * CX + k * CXY, i + (j - 1) * CX + k * CXY);
    if (j < NY - 1 && i > 0 && k > 0 && i < NX - 1 && k < NZ - 1 && in0 !== (F[p0 + SY] < 0))
      quad((i - 1) + j * CX + (k - 1) * CXY, i + j * CX + (k - 1) * CXY, i + j * CX + k * CXY, (i - 1) + j * CX + k * CXY);
    if (k < NZ - 1 && i > 0 && j > 0 && i < NX - 1 && j < NY - 1 && in0 !== (F[p0 + SZ] < 0))
      quad((i - 1) + (j - 1) * CX + k * CXY, i + (j - 1) * CX + k * CXY, i + j * CX + k * CXY, (i - 1) + j * CX + k * CXY);
  }
  let minY = Infinity;
  for (let v = 0; v < vc; v++) minY = Math.min(minY, pos[3 * v + 1]);
  for (let v = 0; v < vc; v++) pos[3 * v + 1] -= minY;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setIndex(idx);
  geo.computeBoundingSphere();
  geo.computeBoundingBox();
  return geo;
}

const bearGeo = buildGummyGeometry(0.016);
const bearProxyGeo = buildGummyGeometry(0.045);   // light-weight raycast proxy

/* ------------------------------------------------------------------ */
/*  Gummy material (MeshPhysicalMaterial + jelly deformation shader)   */
/* ------------------------------------------------------------------ */
const G = {
  uTime: { value: 0 },
  uKeyV: { value: new THREE.Vector3(0, 1, 0) },
  uRimV: { value: new THREE.Vector3(0, 1, 0) }
};

const VERT_PARS = /* glsl */`
uniform vec3 uHead;
uniform float uHeadTilt;
uniform float uArmL;
uniform float uArmR;
uniform float uBelly;
uniform vec4 uPoke[4];
uniform vec3 uPokeN[4];
varying vec3 vGPos;
vec2 gRot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
void gummyDeform(inout vec3 p, inout vec3 n){
  vec3 p0 = p;
  // elastic poke dents (with volume-preserving rim bulge)
  for(int i = 0; i < 4; i++){
    float a = uPoke[i].w;
    vec3 d = p0 - uPoke[i].xyz;
    float R2 = 0.07;
    float dd = dot(d, d);
    float g = exp(-dd / R2);
    float g2 = exp(-dd / (R2 * 4.0));
    p -= uPokeN[i] * a * g;
    p += n * a * 0.2 * (g2 - g);
    n -= 2.0 * a * g * d / R2;
  }
  n = normalize(n);
  // belly wobble
  vec3 bd = (p0 - vec3(0.0, 0.62, 0.18)) * vec3(1.0, 0.85, 1.1);
  float wb = exp(-dot(bd, bd) / 0.18);
  p.xz += p0.xz * uBelly * wb;
  p.y -= (p0.y - 0.62) * uBelly * wb * 0.5;
  // arm jiggle / pose
  float side = p0.x >= 0.0 ? 1.0 : -1.0;
  vec3 ap = vec3(abs(p0.x), p0.y, p0.z);
  vec3 A = vec3(0.42, 0.95, 0.04);
  vec3 B = vec3(0.70, 0.62, 0.20);
  vec3 ba = B - A;
  float t = clamp(dot(ap - A, ba) / dot(ba, ba), 0.0, 1.0);
  float sd = length(ap - (A + ba * t));
  float wa = smoothstep(0.25, 0.13, sd) * smoothstep(0.0, 0.55, t);
  float ang = (side > 0.0 ? uArmR : -uArmL) * wa;
  vec2 piv = vec2(side * 0.40, 0.95);
  p.xy = piv + gRot(p.xy - piv, ang);
  n.xy = gRot(n.xy, ang);
  // head jiggle
  float wh = smoothstep(0.98, 1.28, p0.y);
  vec2 hp = vec2(0.0, 1.05);
  p.xy = hp + gRot(p.xy - hp, uHeadTilt * wh);
  n.xy = gRot(n.xy, uHeadTilt * wh);
  p += uHead * wh;
}
`;

const FRAG_PARS = /* glsl */`
uniform float uTime;
uniform float uSparkle;
uniform vec3 uKeyV;
uniform vec3 uRimV;
uniform vec3 uSSS;
uniform float uSSSStr;
varying vec3 vGPos;
float gHash(vec3 p){
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.x + p.y) * p.z);
}
`;

const THICK_CODE = /* glsl */`
float gThick;
{
  vec3 tV = normalize(vViewPosition);
  float tNV = abs(dot(normalize(normal), tV));
  gThick = mix(0.3, 1.25, smoothstep(0.0, 0.9, tNV));
}
`;

const FRAG_END = /* glsl */`
{
  vec3 eV = normalize(vViewPosition);
  vec3 eN = normalize(normal);
  float eNV = clamp(dot(eN, eV), 0.0, 1.0);
  vec3 eR = normalize(uRimV);
  vec3 eK = normalize(uKeyV);
  // fake subsurface scattering: back-light bleeding + gelatin rim glow
  float back = pow(clamp(dot(eV, -normalize(eR + eN * 0.45)), 0.0, 1.0), 3.0);
  float backK = pow(clamp(dot(eV, -normalize(eK + eN * 0.6)), 0.0, 1.0), 4.0);
  float rimG = pow(1.0 - eNV, 2.5);
  vec3 sss = uSSS * (back * 0.6 + backK * 0.25 + rimG * 0.22 + 0.05) * uSSSStr;
  // sugar crystal micro sparkle
  vec3 sc = vGPos * 65.0;
  vec3 cell = floor(sc);
  float h = gHash(cell);
  vec3 jit = vec3(gHash(cell + vec3(1.7, 0.0, 0.0)), gHash(cell + vec3(0.0, 5.3, 0.0)), gHash(cell + vec3(0.0, 0.0, 9.1))) - 0.5;
  vec3 Ns = normalize(eN + jit * 1.4);
  vec3 H = normalize(eK + eV);
  float spec = pow(max(dot(Ns, H), 0.0), 90.0);
  float dotm = smoothstep(0.42, 0.05, length(fract(sc) - 0.5 - jit * 0.3));
  float tw = 0.55 + 0.45 * sin(uTime * 5.0 + h * 80.0);
  float sp = spec * dotm * tw * step(0.9 - 0.3 * uSparkle, h);
  gl_FragColor.rgb += sss + vec3(1.0, 0.97, 0.9) * sp * 7.0 * uSparkle;
}
`;

function makeGummyMaterial(d) {
  const m = new THREE.MeshPhysicalMaterial({
    color: d.color, metalness: 0, roughness: 0.13,
    transmission: 1, thickness: 1.0, ior: 1.48,
    attenuationColor: new THREE.Color(d.att), attenuationDistance: d.dist,
    clearcoat: 1, clearcoatRoughness: 0.05,
    specularIntensity: 1, specularColor: new THREE.Color('#ffffff'),
    envMapIntensity: 1.25,
    sheen: 0, sheenColor: new THREE.Color('#ffffff'), sheenRoughness: 0.5
  });
  const U = {
    uTime: G.uTime, uKeyV: G.uKeyV, uRimV: G.uRimV,
    uHead: { value: new THREE.Vector3() },
    uHeadTilt: { value: 0 },
    uArmL: { value: 0 },
    uArmR: { value: 0 },
    uBelly: { value: 0 },
    uPoke: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
    uPokeN: { value: [new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 1)] },
    uSparkle: { value: 0.22 },
    uSSS: { value: new THREE.Color(d.sss) },
    uSSSStr: { value: d.sssStr }
  };
  m.userData.U = U;
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + VERT_PARS)
      .replace('#include <beginnormal_vertex>',
        '#include <beginnormal_vertex>\nvec3 gP = position;\nvec3 gN = objectNormal;\nvGPos = position;\ngummyDeform(gP, gN);\nobjectNormal = gN;')
      .replace('#include <begin_vertex>', 'vec3 transformed = gP;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + FRAG_PARS)
      .replace('#include <transmission_fragment>',
        THICK_CODE + THREE.ShaderChunk.transmission_fragment.replace('material.thickness = thickness;', 'material.thickness = thickness * gThick;'))
      .replace('#include <tonemapping_fragment>', FRAG_END + '\n#include <tonemapping_fragment>');
  };
  return m;
}

/* ------------------------------------------------------------------ */
/*  The five bears                                                     */
/* ------------------------------------------------------------------ */
const BEAR_S = 0.55;
const LAYOUT = [[-1.72, -0.55], [-0.86, 0.12], [0, 0.42], [0.86, 0.12], [1.72, -0.55]];
const DEFS = [
  { name: 'orange', color: '#ffb46c', att: '#ff6602', dist: 0.30, sss: '#ff7414', sssStr: 0.55, yawOff: 0.18,
    pose: t => ({ L: 0.15 + 0.05 * Math.sin(t * 1.4), R: 1.15 + 0.22 * Math.sin(t * 7.5), tilt: 0.09 }) },
  { name: 'lemon', color: '#fffbf2', att: '#fff0c0', dist: 1.6, sss: '#fff0c8', sssStr: 0.32, yawOff: 0.08,
    pose: t => ({ L: 0.95 + 0.1 * Math.sin(t * 3.1), R: 0.95 + 0.1 * Math.sin(t * 3.1 + 0.6), tilt: 0.06 * Math.sin(t * 1.6) }) },
  { name: 'raspberry', color: '#ff7c88', att: '#d00a20', dist: 0.20, sss: '#ff2340', sssStr: 0.6, yawOff: 0.0,
    pose: t => ({ L: 0.28 + 0.06 * Math.sin(t * 2.0), R: 0.28 + 0.06 * Math.sin(t * 2.0 + 1.0), tilt: -0.05 + 0.04 * Math.sin(t * 1.1) }) },
  { name: 'pineapple', color: '#ffe780', att: '#ffb402', dist: 0.38, sss: '#ffc21c', sssStr: 0.5, yawOff: -0.08,
    pose: t => ({ L: 1.15 + 0.22 * Math.sin(t * 7.0 + 1.3), R: 0.12, tilt: -0.1 }) },
  { name: 'apple', color: '#aaff88', att: '#24b82a', dist: 0.28, sss: '#48e035', sssStr: 0.55, yawOff: -0.18,
    pose: t => ({ L: 0.55 + 0.4 * Math.sin(t * 2.6), R: 0.55 - 0.4 * Math.sin(t * 2.6), tilt: 0.13 * Math.sin(t * 2.6) }) }
];

const proxyMat = new THREE.MeshBasicMaterial({ visible: false });
const bears = [];
const proxies = [];

DEFS.forEach((d, i) => {
  const [px, pz] = LAYOUT[i];
  const group = new THREE.Group();
  group.position.set(px, PT, pz);
  group.rotation.y = Math.atan2(-px, camera.position.z - pz) + d.yawOff;
  group.scale.setScalar(BEAR_S);
  scene.add(group);

  const mesh = new THREE.Mesh(bearGeo, makeGummyMaterial(d));
  mesh.castShadow = true;
  group.add(mesh);

  const proxy = new THREE.Mesh(bearProxyGeo, proxyMat);
  mesh.add(proxy);
  proxies.push(proxy);

  // soft contact shadows + colored caustic glow
  const tint = new THREE.Color(d.att).lerp(new THREE.Color('#3a2520'), 0.55);
  const blobWide = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 0.9),
    new THREE.MeshBasicMaterial({ map: BLOB, color: tint, transparent: true, opacity: 0.42, depthWrite: false }));
  const blobCore = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.36),
    new THREE.MeshBasicMaterial({ map: BLOB, color: '#2a1a16', transparent: true, opacity: 0.5, depthWrite: false }));
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.75),
    new THREE.MeshBasicMaterial({ map: BLOB, color: new THREE.Color(d.sss), transparent: true, opacity: 0.45,
      depthWrite: false, blending: THREE.AdditiveBlending }));
  for (const bl of [blobWide, blobCore, glow]) {
    bl.rotation.order = 'YXZ';
    bl.rotation.x = -Math.PI / 2;
    bl.rotation.y = group.rotation.y;
    bl.renderOrder = 2;
    scene.add(bl);
  }

  const b = {
    i, d, group, mesh, U: mesh.material.userData.U, pose: d.pose,
    blobWide, blobCore, glow,
    y: 0, vy: 0, state: 'ground', chargeT: 0, nextJump: 0.9 + i * 0.2,
    sq: 1, vsq: 0,
    hx: 0, hy: 0, hz: 0, vhx: 0, vhy: 0, vhz: 0,
    tilt: 0, vtilt: 0,
    armL: 0.3, varmL: 0, armR: 0.3, varmR: 0,
    belly: 0, vbelly: 0,
    lx: 0, vlx: 0, lz: 0, vlz: 0,
    pokes: [0, 1, 2, 3].map(() => ({ p: new THREE.Vector3(0, 1, 0.5), n: new THREE.Vector3(0, 0, 1), a: 0, va: 0, target: 0 })),
    pokeIdx: 0, pressed: false, pressSlot: null, lastHoverW: new THREE.Vector3()
  };
  mesh.userData.bear = b;
  proxy.userData.bear = b;
  bears.push(b);
});

/* scattered sugar crystals on the glass */
{
  const N = 170;
  const grains = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.028, 0.028, 0.028),
    new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.6 }),
    N
  );
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let placed = 0, guard = 0;
  while (placed < N && guard++ < 5000) {
    const r = 0.25 + Math.sqrt(Math.random()) * 2.0, a = Math.random() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (LAYOUT.some(([bx, bz]) => Math.hypot(x - bx, z - bz) < 0.45)) continue;
    const sc = 0.5 + Math.random() * 1.0;
    p.set(x, PT + 0.014 * sc, z);
    e.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    q.setFromEuler(e);
    s.setScalar(sc);
    grains.setMatrixAt(placed++, m4.compose(p, q, s));
  }
  grains.count = placed;
  scene.add(grains);
}

/* ------------------------------------------------------------------ */
/*  Interaction: raycast poke / squish / brush                         */
/* ------------------------------------------------------------------ */
let controls = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const qInv = new THREE.Quaternion();
const tmpV = new THREE.Vector3();
let pendingMove = null;
let hoverBear = null;
let pressedBear = null;

function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(proxies, false);
  return hits.length ? hits[0] : null;
}
function toGroupLocal(b, v) { qInv.copy(b.group.quaternion).invert(); return v.applyQuaternion(qInv); }

renderer.domElement.addEventListener('pointerdown', (ev) => {
  const h = pick(ev);
  if (!h) return;
  const b = h.object.userData.bear;
  if (controls) controls.enabled = false;
  pressedBear = b;
  b.pressed = true;
  const local = b.mesh.worldToLocal(h.point.clone());
  const slot = b.pokes[1 + (b.pokeIdx++ % 3)];
  slot.p.copy(local);
  slot.n.copy(h.face.normal);
  slot.target = 0.17;
  slot.va += 3.2;
  b.pressSlot = slot;
  // global jelly response
  const push = h.face.normal.clone().transformDirection(b.mesh.matrixWorld).negate();
  toGroupLocal(b, push);
  b.vsq -= 3.0;
  b.vbelly += 0.9;
  b.vhy -= 0.6;
  b.vhx += push.x * 1.2; b.vhz += push.z * 1.2;
  b.vlz -= push.x * 1.8; b.vlx += push.z * 1.8;
  b.vtilt -= push.x * 1.5;
  b.varmL += 2.4; b.varmR += 2.4;
  renderer.domElement.style.cursor = 'grabbing';
});

function release() {
  if (pressedBear) {
    const b = pressedBear;
    b.pressed = false;
    if (b.pressSlot) { b.pressSlot.target = 0; b.pressSlot.va -= 1.4; b.pressSlot = null; }
    b.vsq += 4.0;
    b.vbelly -= 0.6;
    b.varmL += 2.0; b.varmR += 2.0;
    if (b.state === 'ground') { b.state = 'air'; b.vy = 2.2; }
    b.nextJump = Math.max(b.nextJump, T + 1.8);
    pressedBear = null;
    renderer.domElement.style.cursor = hoverBear ? 'grab' : 'default';
  }
  if (controls) controls.enabled = true;
}
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
renderer.domElement.addEventListener('pointermove', (ev) => { pendingMove = ev; });
renderer.domElement.addEventListener('pointerleave', () => {
  pendingMove = null;
  if (hoverBear) { hoverBear.pokes[0].target = 0; hoverBear = null; }
});

function handleHover(h) {
  if (h) {
    const b = h.object.userData.bear;
    const local = b.mesh.worldToLocal(h.point.clone());
    const s0 = b.pokes[0];
    if (hoverBear !== b) {
      if (hoverBear) hoverBear.pokes[0].target = 0;
      s0.p.copy(local);
      s0.n.copy(h.face.normal);
      s0.va += 1.2;
      b.vsq -= 0.8;
      b.vbelly += 0.3;
      b.lastHoverW.copy(h.point);
      hoverBear = b;
    } else {
      s0.p.lerp(local, 0.5);
      s0.n.lerp(h.face.normal, 0.5).normalize();
      tmpV.copy(h.point).sub(b.lastHoverW);
      b.lastHoverW.copy(h.point);
      if (tmpV.lengthSq() < 0.25) {
        toGroupLocal(b, tmpV);
        const k = 3.2;
        b.vlz -= tmpV.x * k; b.vlx += tmpV.z * k;
        b.vhx += tmpV.x * 2.2; b.vhy += tmpV.y * 1.2; b.vhz += tmpV.z * 1.5;
        b.vtilt -= tmpV.x * 2.6;
        b.vbelly += tmpV.length() * 0.9;
        b.varmL += tmpV.y * 3.0; b.varmR += tmpV.y * 3.0;
      }
      if (b.pressed && b.pressSlot) {
        b.pressSlot.p.lerp(local, 0.3);
        b.pressSlot.n.lerp(h.face.normal, 0.3).normalize();
      }
    }
    s0.target = 0.055;
    if (!pressedBear) renderer.domElement.style.cursor = 'grab';
  } else {
    if (hoverBear) { hoverBear.pokes[0].target = 0; hoverBear = null; }
    if (!pressedBear) renderer.domElement.style.cursor = 'default';
  }
}

let sugar = false;
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyS') {
    sugar = !sugar;
    for (const b of bears) b.mesh.material.sheen = sugar ? 0.35 : 0;
  } else if (e.code === 'Space') {
    for (const b of bears) if (b.state === 'ground' && !b.pressed) b.nextJump = T + b.i * 0.08;
    e.preventDefault();
  }
});

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 0.72, 0);
controls.minDistance = 3.2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ------------------------------------------------------------------ */
/*  Squishy jelly physics                                              */
/* ------------------------------------------------------------------ */
const GRAV = -16.0;
const JUMP_V = 3.0;
const CYCLE = 2.8;
let T = 0;

function sp(o, k0, k1, target, k, c, h) {
  o[k1] += (-k * (o[k0] - target) - c * o[k1]) * h;
  o[k0] += o[k1] * h;
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function scheduleNext(t, i) {
  const n = Math.floor(t / CYCLE) + 1;
  const order = (n % 2 === 0) ? i : 4 - i;
  let tt = n * CYCLE + order * 0.2;
  if (tt < t + 0.9) tt += CYCLE;
  return tt;
}

function stepBear(b, t, h) {
  const P = b.pose(t);
  let sqT = 1 + 0.02 * Math.sin(t * 2.4 + b.i * 1.7);

  if (b.state === 'ground' && !b.pressed && t >= b.nextJump) { b.state = 'charge'; b.chargeT = 0; }
  if (b.state === 'charge') {
    b.chargeT += h;
    sqT = 0.8;
    if (b.chargeT >= 0.17) {
      b.state = 'air';
      b.vy = JUMP_V * (0.92 + Math.random() * 0.16);
      b.vsq += 6.0;
      b.vhy -= 1.1;
      b.varmL -= 2.2; b.varmR -= 2.2;
      b.vtilt += (Math.random() - 0.5) * 1.4;
      b.vbelly -= 0.5;
    }
  }
  if (b.state === 'air') {
    b.vy += GRAV * h;
    b.y += b.vy * h;
    sqT = 1 + Math.min(0.2, Math.abs(b.vy) * 0.055);
    if (b.y <= 0 && b.vy < 0) {
      const imp = -b.vy;
      b.y = 0; b.vy = 0; b.state = 'ground';
      b.vsq -= imp * 1.5;
      b.vhy -= imp * 0.5;
      b.vbelly += imp * 0.4;
      b.varmL += imp * 1.8; b.varmR += imp * 1.8;
      b.vtilt += (Math.random() - 0.5) * imp * 0.5;
      b.vlx += (Math.random() - 0.5) * imp * 0.3;
      b.vlz += (Math.random() - 0.5) * imp * 0.3;
      b.nextJump = scheduleNext(t, b.i);
    }
  }
  if (b.pressed) sqT = Math.min(sqT, 0.84);

  sp(b, 'sq', 'vsq', sqT, 200, 7, h);
  sp(b, 'hx', 'vhx', 0, 150, 7, h);
  sp(b, 'hy', 'vhy', 0, 160, 7, h);
  sp(b, 'hz', 'vhz', 0, 150, 7, h);
  sp(b, 'tilt', 'vtilt', P.tilt, 110, 6.5, h);
  sp(b, 'armL', 'varmL', P.L, 110, 7, h);
  sp(b, 'armR', 'varmR', P.R, 110, 7, h);
  sp(b, 'belly', 'vbelly', 0, 150, 5, h);
  sp(b, 'lx', 'vlx', 0, 90, 5.5, h);
  sp(b, 'lz', 'vlz', 0, 90, 5.5, h);
  for (const s of b.pokes) sp(s, 'a', 'va', s.target, 300, 11, h);

  b.sq = clamp(b.sq, 0.55, 1.45);
  b.hx = clamp(b.hx, -0.25, 0.25); b.hy = clamp(b.hy, -0.25, 0.25); b.hz = clamp(b.hz, -0.25, 0.25);
  b.tilt = clamp(b.tilt, -0.5, 0.5);
  b.armL = clamp(b.armL, -0.6, 2.0); b.armR = clamp(b.armR, -0.6, 2.0);
  b.belly = clamp(b.belly, -0.2, 0.22);
  b.lx = clamp(b.lx, -0.35, 0.35); b.lz = clamp(b.lz, -0.35, 0.35);
  for (const s of b.pokes) s.a = clamp(s.a, -0.08, 0.26);
}

let sugarAmt = 0;
function applyBear(b) {
  const sxz = 1 / Math.sqrt(b.sq);   // volume preserving squash & stretch
  b.mesh.scale.set(sxz, b.sq, sxz);
  b.mesh.rotation.set(b.lx, 0, b.lz);
  b.group.position.y = PT + b.y;

  const U = b.U;
  U.uHead.value.set(b.hx, b.hy, b.hz);
  U.uHeadTilt.value = b.tilt;
  U.uArmL.value = b.armL;
  U.uArmR.value = b.armR;
  U.uBelly.value = b.belly;
  for (let k = 0; k < 4; k++) {
    const s = b.pokes[k];
    U.uPoke.value[k].set(s.p.x, s.p.y, s.p.z, s.a);
    U.uPokeN.value[k].copy(s.n);
  }
  U.uSparkle.value = 0.22 + 0.9 * sugarAmt;
  const m = b.mesh.material;
  m.roughness = 0.13 + 0.22 * sugarAmt;
  m.clearcoatRoughness = 0.05 + 0.4 * sugarAmt;

  // contact shadow + caustic glow follow the bear
  const gx = b.group.position.x, gz = b.group.position.z;
  const lift = 1 / (1 + b.y * 2.2);
  const spread = sxz * (1 + b.y * 0.6);
  b.blobWide.position.set(gx, PT + 0.003, gz + 0.03);
  b.blobWide.scale.set(spread, spread, 1);
  b.blobWide.material.opacity = 0.42 * lift;
  b.blobCore.position.set(gx, PT + 0.004, gz + 0.04);
  b.blobCore.scale.set(sxz * (1 + b.y * 1.5), sxz * (1 + b.y * 1.5), 1);
  b.blobCore.material.opacity = 0.5 * lift * lift;
  b.glow.position.set(gx + 0.16, PT + 0.005, gz - 0.2);
  b.glow.scale.set(spread * 1.05, spread * 1.1, 1);
  b.glow.material.opacity = 0.45 * lift;
}

/* ------------------------------------------------------------------ */
/*  Loop                                                               */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const dirTmp = new THREE.Vector3();

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 24);

  if (pendingMove) { handleHover(pick(pendingMove)); pendingMove = null; }

  const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    T += h;
    for (const b of bears) stepBear(b, T, h);
  }
  sugarAmt += ((sugar ? 1 : 0) - sugarAmt) * Math.min(1, dt * 4);

  G.uTime.value = T;
  camera.updateMatrixWorld();
  G.uKeyV.value.copy(dirTmp.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse));
  G.uRimV.value.copy(dirTmp.copy(rim.position).normalize().transformDirection(camera.matrixWorldInverse));

  for (const b of bears) applyBear(b);

  led.material.color.setRGB(1.0, 0.93, 0.84).multiplyScalar(2.3 + 0.25 * Math.sin(T * 1.3));

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
