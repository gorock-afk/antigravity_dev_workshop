<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Furry Jelly Puppy</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #f0d6dd; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- helpers
const ss = (e0, e1, x) => { let t = (x - e0) / (e1 - e0); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261103);
const R = () => rng();
const RS = () => rng() * 2 - 1;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const jit = s => V(RS() * s, RS() * s, RS() * s);
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp, damp = THREE.MathUtils.damp;

// ---------------------------------------------------------------- renderer / scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const BG = new THREE.Color('#f0d6dd');
renderer.setClearColor(BG, 1);

const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 9, 24);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const aspect0 = window.innerWidth / window.innerHeight;
const camera = new THREE.PerspectiveCamera(35, aspect0, 0.05, 100);
const camDist = aspect0 < 1 ? 5.9 / Math.max(aspect0, 0.45) * 0.75 : 5.9;
camera.position.set(0.27, 0.2, 0.94).normalize().multiplyScalar(camDist).add(V(0, 0.75, 0));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;
controls.minDistance = 2.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.62;
controls.enablePan = false;
controls.update();

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight('#fff6ec', '#e7a9b6', 0.9));
const key = new THREE.DirectionalLight('#fff0dc', 2.6);
key.position.set(3, 5.5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
{ const sc = key.shadow.camera; sc.left = -3; sc.right = 3; sc.top = 3; sc.bottom = -3; sc.near = 0.5; sc.far = 20; }
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight('#cfe0ff', 1.8); rim.position.set(-4, 3, -5); scene.add(rim);
const fill = new THREE.DirectionalLight('#ffd9e4', 0.7); fill.position.set(-3, 1.2, 4); scene.add(fill);
const jellyGlow = new THREE.PointLight('#ff8da1', 5, 4.5, 2); jellyGlow.position.set(0, 0.15, 1.6); scene.add(jellyGlow);

// ---------------------------------------------------------------- floor + contact shadow
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: '#f3dbe1', roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.562; floor.receiveShadow = true; scene.add(floor);
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const cx = cv.getContext('2d');
  const gr = cx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(150,60,80,0.5)'); gr.addColorStop(0.55, 'rgba(170,80,100,0.28)'); gr.addColorStop(1, 'rgba(170,80,100,0)');
  cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  decal.rotation.x = -Math.PI / 2; decal.position.y = -0.558; scene.add(decal);
}

// ---------------------------------------------------------------- fur material (wind + gravity + petting in shader)
const U = {
  uTime: { value: 0 }, uWind: { value: 0.1 }, uDroop: { value: 0.22 },
  uHand: { value: new THREE.Vector3(0, -50, 0) }, uHandAmt: { value: 0 }, uHandR: { value: 0.36 },
  uHandVel: { value: new THREE.Vector3() }
};
const furMat = new THREE.MeshStandardMaterial({ roughness: 0.82, metalness: 0.0, envMapIntensity: 0.6 });
furMat.onBeforeCompile = (sh) => {
  for (const k in U) sh.uniforms[k] = U[k];
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
uniform float uTime; uniform float uWind; uniform float uDroop; uniform float uHandAmt; uniform float uHandR;
uniform vec3 uHand; uniform vec3 uHandVel;
varying float vH;`)
    .replace('#include <project_vertex>', `
vH = position.y;
mat4 fm = modelMatrix * instanceMatrix;
vec3 rootW = (fm * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
vec3 tipW  = (fm * vec4(0.0, 1.0, 0.0, 1.0)).xyz;
vec3 strandW = tipW - rootW;
float sLen = max(length(strandW), 1e-5);
vec3 sdir = strandW / sLen;
vec4 worldP = fm * vec4(transformed, 1.0);
float hh = clamp(position.y, 0.0, 1.0);
float bend = hh * hh;
float ph = dot(rootW, vec3(2.7, 1.3, 2.1)) - uTime * 2.4;
vec3 windV = vec3(sin(ph) + 0.5 * sin(ph * 2.3 + 1.3), 0.35 * sin(ph * 1.7 + 0.4), cos(ph * 0.8) + 0.4 * sin(ph * 3.1 + 2.0)) * uWind;
vec3 nd = sdir + windV;
nd.y -= uDroop;
vec3 toR = rootW - uHand;
float hd = length(toR);
float infl = uHandAmt * (1.0 - smoothstep(0.0, uHandR, hd));
vec3 lateral = toR - sdir * dot(toR, sdir);
float latL = length(lateral);
vec3 latN = latL > 1e-4 ? lateral / latL : vec3(0.0);
nd += (latN * 0.9 - sdir * 0.55 + uHandVel * 2.2) * infl;
nd = normalize(nd);
vec3 tipNew = rootW + nd * sLen;
worldP.xyz += (tipNew - tipW) * bend;
vec4 mvPosition = viewMatrix * worldP;
gl_Position = projectionMatrix * mvPosition;
`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
varying float vH;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
diffuseColor.rgb *= mix(0.42, 1.06, smoothstep(0.0, 0.95, vH));
diffuseColor.rgb += vec3(0.045, 0.032, 0.02) * smoothstep(0.75, 1.0, vH);`);
};

const furGeo = new THREE.ConeGeometry(1, 1, 5, 4, true);
furGeo.translate(0, 0.5, 0);
let furTotal = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function makeFur(parent, specs) {
  const mesh = new THREE.InstancedMesh(furGeo, furMat, specs.length);
  for (let i = 0; i < specs.length; i++) {
    const sp = specs[i];
    _q.setFromUnitVectors(_up, sp.d);
    _s.set(sp.w, sp.len, sp.w);
    _m.compose(sp.p, _q, _s);
    mesh.setMatrixAt(i, _m);
    mesh.setColorAt(i, sp.col);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.frustumCulled = false;
  mesh.receiveShadow = true;
  parent.add(mesh);
  furTotal += specs.length;
  return mesh;
}
function S(p, n, d, len, w, col) {
  if (d.lengthSq() < 1e-8) d.copy(n);
  return { p: p.clone().addScaledVector(n, -0.012), d: d.normalize(), len, w, col };
}
const COL = {
  apricot: new THREE.Color('#e08b3e'), sable: new THREE.Color('#a85a26'), gold: new THREE.Color('#f2b56b'),
  cream: new THREE.Color('#fbe5c4'), white: new THREE.Color('#fff7ea'), blush: new THREE.Color('#ff8f9f')
};
function tone(a, b, t, vary = 0.1) {
  const c = a.clone().lerp(b, clamp(t, 0, 1));
  const k = 1 + RS() * vary;
  c.r *= k; c.g *= k * (1 + RS() * 0.03); c.b *= k;
  return c;
}
const _u = new THREE.Vector3();
function sampleEllipsoid(out, c, r, count, fn) {
  let made = 0, tries = 0;
  while (made < count && tries < count * 10) {
    tries++;
    const z = R() * 2 - 1, th = R() * Math.PI * 2, sq = Math.sqrt(1 - z * z);
    _u.set(sq * Math.cos(th), z, sq * Math.sin(th));
    const p = V(c.x + _u.x * r.x, c.y + _u.y * r.y, c.z + _u.z * r.z);
    const n = V(_u.x / r.x, _u.y / r.y, _u.z / r.z).normalize();
    const s = fn(p, n);
    if (!s) continue;
    out.push(s); made++;
  }
}

// ---------------------------------------------------------------- puppy skin + proxies
const puppy = new THREE.Group();
scene.add(puppy);
const skinOr = new THREE.MeshStandardMaterial({ color: '#b86f35', roughness: 1 });
const skinCr = new THREE.MeshStandardMaterial({ color: '#e3c9a2', roughness: 1 });
const proxyMat = new THREE.MeshBasicMaterial();
const sphereGeo = new THREE.SphereGeometry(1, 32, 20);
const pettable = [];
function blob(parent, c, r, mat, pet = true) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.copy(c); m.scale.copy(r); m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  if (pet) {
    const px = new THREE.Mesh(sphereGeo, proxyMat);
    px.position.copy(c); px.scale.copy(r).multiplyScalar(1.28); px.visible = false;
    parent.add(px); pettable.push(px);
  }
  return m;
}

// ---- static body: rump, haunches, hind paws, standing front leg
const staticSpecs = [];
{
  const rc = V(0, 0.42, -0.22), rr = V(0.6, 0.44, 0.56);
  blob(puppy, rc, rr, skinOr);
  sampleEllipsoid(staticSpecs, rc, rr, 3600, (p, n) => {
    if (n.y < -0.55) return null;
    const d = n.clone().add(V(0, -0.18, -0.12)).add(jit(0.35));
    const t = ss(0.0, -0.6, n.y) * 0.9 + ss(0.35, 0.9, n.z) * 0.5;
    const col = tone(COL.apricot, COL.cream, t);
    if (n.y > 0.3 && R() < 0.4) col.lerp(COL.sable, 0.4);
    return S(p, n, d, 0.16 + R() * 0.09, 0.016 + R() * 0.005, col);
  });
  for (const s of [1, -1]) {
    const hc = V(s * 0.38, 0.27, -0.04), hr = V(0.22, 0.26, 0.34);
    blob(puppy, hc, hr, skinOr);
    sampleEllipsoid(staticSpecs, hc, hr, 760, (p, n) => {
      if (n.y < -0.6) return null;
      const d = n.clone().add(V(0, -0.3, -0.1)).add(jit(0.3));
      const t = ss(0.1, 0.75, n.z) * 0.7 + ss(0.0, -0.6, n.y) * 0.7;
      const col = tone(COL.apricot, COL.cream, t);
      if (n.y > 0.4 && R() < 0.3) col.lerp(COL.sable, 0.3);
      return S(p, n, d, 0.12 + R() * 0.08, 0.015 + R() * 0.004, col);
    });
    const pc = V(s * 0.36, 0.065, 0.27), pr = V(0.11, 0.07, 0.16);
    blob(puppy, pc, pr, skinCr);
    sampleEllipsoid(staticSpecs, pc, pr, 260, (p, n) => {
      if (n.y < -0.3) return null;
      const d = n.clone().add(V(0, 0, 0.35)).add(jit(0.25));
      return S(p, n, d, 0.045 + R() * 0.04, 0.012 + R() * 0.003, tone(COL.cream, COL.white, R()));
    });
  }
  const flc = V(0.2, 0.3, 0.3), flr = V(0.11, 0.28, 0.11);
  blob(puppy, flc, flr, skinCr);
  sampleEllipsoid(staticSpecs, flc, flr, 520, (p, n) => {
    const back = ss(-0.1, -0.7, n.z);
    const d = n.clone().add(V(0, -0.55, -0.3 * back)).add(jit(0.3));
    return S(p, n, d, (0.08 + R() * 0.05) * (1 + back * 0.6), 0.013 + R() * 0.004, tone(COL.cream, COL.gold, back * 0.6));
  });
  const fpc = V(0.2, 0.065, 0.41), fpr = V(0.12, 0.07, 0.15);
  blob(puppy, fpc, fpr, skinCr);
  sampleEllipsoid(staticSpecs, fpc, fpr, 300, (p, n) => {
    if (n.y < -0.3) return null;
    const d = n.clone().add(V(0, 0, 0.35)).add(jit(0.25));
    return S(p, n, d, 0.045 + R() * 0.04, 0.012 + R() * 0.003, tone(COL.cream, COL.white, R()));
  });
  for (const sp of staticSpecs) {
    const tipY = sp.p.y + sp.d.y * sp.len;
    if (tipY < 0.015) { sp.d.y += (0.015 - tipY) / sp.len; sp.d.normalize(); }
  }
  makeFur(puppy, staticSpecs);
}

// ---- torso: chest + lion-like mane (breathes)
const torso = new THREE.Group();
torso.position.set(0, 0.8, 0.05);
puppy.add(torso);
{
  const specs = [];
  const pawAvoid = [V(-0.2, -0.276, 0.679), V(-0.2, -0.224, 0.445)];
  const avoid = (sp) => {
    if (!sp) return sp;
    const tip = sp.p.clone().addScaledVector(sp.d, sp.len);
    if (tip.distanceTo(pawAvoid[0]) < 0.25 || tip.distanceTo(pawAvoid[1]) < 0.2) sp.len = Math.min(sp.len, 0.06);
    return sp;
  };
  const cc = V(0, -0.02, -0.05), cr = V(0.48, 0.5, 0.46);
  blob(torso, cc, cr, skinCr);
  sampleEllipsoid(specs, cc, cr, 2600, (p, n) => {
    const d = n.clone().add(V(0, -0.3, 0)).add(jit(0.3));
    const col = tone(COL.apricot, COL.cream, ss(-0.2, 0.5, n.z));
    return avoid(S(p, n, d, 0.15 + R() * 0.07, 0.016 + R() * 0.004, col));
  });
  const mc = V(0, 0.12, 0.05), mr = V(0.6, 0.48, 0.5);
  blob(torso, mc, mr, skinCr);
  sampleEllipsoid(specs, mc, mr, 4600, (p, n) => {
    if (n.y > 0.5 && n.z > -0.25) return null;
    const d = n.clone().add(V(0, -0.5, 0.05)).add(jit(0.3));
    const f = ss(-0.45, 0.35, n.z);
    const col = f < 0.5 ? tone(COL.apricot, COL.gold, f * 2) : tone(COL.gold, COL.white, (f - 0.5) * 2);
    if (f < 0.3 && R() < 0.25) col.lerp(COL.sable, 0.3);
    return avoid(S(p, n, d, 0.22 + R() * 0.12, 0.017 + R() * 0.005, col));
  });
  makeFur(torso, specs);
}

// ---- head
const head = new THREE.Group();
head.position.set(0, 1.35, 0.2);
puppy.add(head);
const HC = V(0, 0.15, 0.05), HR = V(0.42, 0.39, 0.40);
const eyeP = [V(0.15, 0.2, 0.375), V(-0.15, 0.2, 0.375)];
const noseP = V(0, 0.065, 0.53);
const MC = V(0, 0.0, 0.38), MR = V(0.16, 0.12, 0.16);
const blushP = [V(0.25, 0.07, 0.33), V(-0.25, 0.07, 0.33)];
const inE = (p, c, r, k) => ((p.x - c.x) / r.x) ** 2 + ((p.y - c.y) / r.y) ** 2 + ((p.z - c.z) / r.z) ** 2 < k;
const nearestEye = p => p.distanceTo(eyeP[0]) < p.distanceTo(eyeP[1]) ? eyeP[0] : eyeP[1];
{
  const specs = [];
  blob(head, HC, HR, skinOr);
  sampleEllipsoid(specs, HC, HR, 3600, (p, n) => {
    const e = nearestEye(p), de = p.distanceTo(e);
    if (de < 0.1) return null;
    if (inE(p, MC, MR, 1.0)) return null;
    if (p.distanceTo(noseP) < 0.1) return null;
    const face = ss(0.15, 0.85, n.z);
    let len = lerp(0.16, 0.05, face) * (0.8 + R() * 0.4);
    if (de < 0.2) len *= 0.45 + (de - 0.1) * 3.0;
    const d = n.clone().add(V(0, 0.06, -0.4).multiplyScalar(1 - face)).add(jit(0.28));
    if (de < 0.26) d.add(p.clone().sub(e).normalize().multiplyScalar(0.8));
    const col = tone(COL.apricot, COL.gold, 0.25 + face * 0.75);
    col.lerp(COL.cream, face * ss(0.26, 0.05, p.y));
    if (n.y > 0.45 && face < 0.6 && R() < 0.5) col.lerp(COL.sable, 0.45);
    if (de < 0.17) col.lerp(COL.sable, 0.4);
    const db = Math.min(p.distanceTo(blushP[0]), p.distanceTo(blushP[1]));
    if (db < 0.12) col.lerp(COL.blush, 0.6 * (1 - db / 0.12));
    return S(p, n, d, len, 0.014 + R() * 0.004, col);
  });
  for (const s of [1, -1]) {
    const cc = V(s * 0.27, 0.0, 0.16), cr = V(0.19, 0.17, 0.17);
    blob(head, cc, cr, skinCr);
    sampleEllipsoid(specs, cc, cr, 650, (p, n) => {
      const de = p.distanceTo(nearestEye(p));
      if (de < 0.15) return null;
      if (inE(p, HC, HR, 0.75)) return null;
      if (inE(p, MC, MR, 1.0)) return null;
      const d = n.clone().add(V(s * 0.25, -0.35, -0.15)).add(jit(0.3));
      let len = 0.09 + R() * 0.06; if (de < 0.25) len *= 0.6;
      const col = tone(COL.cream, COL.white, R() * 0.6);
      const db = p.distanceTo(blushP[s > 0 ? 0 : 1]);
      if (db < 0.14) col.lerp(COL.blush, 0.55 * (1 - db / 0.14));
      return S(p, n, d, len, 0.014 + R() * 0.004, col);
    });
  }
  blob(head, MC, MR, skinCr);
  sampleEllipsoid(specs, MC, MR, 950, (p, n) => {
    if (n.z < -0.2) return null;
    if (p.distanceTo(noseP) < 0.075) return null;
    if (p.z > 0.46 && Math.abs(p.x) < 0.1 && p.y < 0.02) return null;
    const d = n.clone().add(V(0, 0.12, -0.75)).add(jit(0.2));
    return S(p, n, d, 0.026 + R() * 0.026, 0.009 + R() * 0.003, tone(COL.cream, COL.white, R()));
  });
  makeFur(head, specs);
  blob(head, V(0, -0.118, 0.44), V(0.085, 0.035, 0.075), skinCr, false); // chin
}

// ---- face details
const eyeMat = new THREE.MeshPhysicalMaterial({ color: '#1a0d09', roughness: 0.03, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.0, ior: 1.5, envMapIntensity: 1.6 });
const rimMat = new THREE.MeshStandardMaterial({ color: '#2b1710', roughness: 0.6 });
const catchMat = new THREE.MeshBasicMaterial({ color: '#ffffff', toneMapped: false });
const eyes = [];
for (const s of [1, -1]) {
  const g = new THREE.Group();
  g.position.copy(eyeP[s > 0 ? 0 : 1]); g.rotation.y = s * 0.28;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.072, 32, 24), eyeMat); ball.scale.z = 0.85; g.add(ball);
  const rimM = new THREE.Mesh(new THREE.TorusGeometry(0.073, 0.013, 10, 40), rimMat); rimM.position.z = 0.012; g.add(rimM);
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(0.017, 16, 12), catchMat); c1.position.set(-0.024, 0.03, 0.053); c1.scale.z = 0.4; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.0085, 12, 8), catchMat); c2.position.set(0.026, -0.024, 0.055); c2.scale.z = 0.4; g.add(c2);
  head.add(g); eyes.push(g);
}
const noseMat = new THREE.MeshPhysicalMaterial({ color: '#0d0908', roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.4 });
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055, 32, 16), noseMat);
nose.position.copy(noseP); nose.scale.set(1.3, 0.85, 0.95); head.add(nose);
const lineMat = new THREE.MeshStandardMaterial({ color: '#2a1614', roughness: 0.5 });
{
  const phil = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.055, 8), lineMat);
  phil.position.set(0, -0.008, 0.535); phil.rotation.x = 0.15; head.add(phil);
  for (const s of [1, -1]) {
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.038, 0.0065, 8, 24, Math.PI), lineMat);
    arc.position.set(s * 0.038, -0.035, 0.52); arc.rotation.set(0, s * 0.35, Math.PI); head.add(arc);
  }
}
const mouthIn = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color: '#4a1a1c', roughness: 0.6 }));
mouthIn.position.set(0, -0.078, 0.468); mouthIn.scale.set(0.08, 0.045, 0.065); head.add(mouthIn);
const tongueMat = new THREE.MeshPhysicalMaterial({ color: '#ff7f96', roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.2, sheen: 0.6, sheenColor: new THREE.Color('#ffc2cf') });
const tongue = new THREE.Mesh(sphereGeo, tongueMat);
