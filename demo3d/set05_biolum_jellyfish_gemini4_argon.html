<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100vw;
    height: 100vh;

    background: #01040d;

    -webkit-user-select: none;

    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================================
// 1. RENDERER, SCENE, CAMERA & CONTROLS
// ============================================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010510);
scene.fog = new THREE.FogExp2(0x010615, 0.026);

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  120
);
camera.position.set(0, 0.4, 19.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.target.set(0, -1.2, 0);
controls.minDistance = 7.0;
controls.maxDistance = 38.0;
controls.maxPolarAngle = Math.PI * 0.92;
controls.minPolarAngle = Math.PI * 0.06;

// Post-processing with subtle Abyssal Bioluminescent Bloom
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.62, // strength
  0.55, // radius
  0.52  // threshold
);
composer.addPass(bloomPass);

// ============================================================================
// 2. PROCEDURAL ENVIRONMENT MAP & STUDIO THREE-POINT LIGHTING
// ============================================================================
function createAbyssalEnvironment(renderer) {
  const envCanvas = document.createElement('canvas');
  envCanvas.width = 1024;
  envCanvas.height = 512;
  const ctx = envCanvas.getContext('2d');

  // Deep ocean vertical gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
  bgGrad.addColorStop(0.0, '#072a4f');
  bgGrad.addColorStop(0.25, '#03152c');
  bgGrad.addColorStop(0.6, '#020918');
  bgGrad.addColorStop(1.0, '#01030a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1024, 512);

  // Soft studio & caustic reflection bands for physical iridescence/transmission
  const bands = [
    { x: 240, y: 110, rx: 190, ry: 75, color: 'rgba(0, 245, 255, 0.55)' },
    { x: 760, y: 140, rx: 210, ry: 80, color: 'rgba(192, 72, 255, 0.45)' },
    { x: 512, y: 70,  rx: 280, ry: 55, color: 'rgba(130, 230, 255, 0.65)' },
    { x: 350, y: 360, rx: 200, ry: 90, color: 'rgba(255, 45, 145, 0.35)' },
    { x: 820, y: 340, rx: 180, ry: 85, color: 'rgba(0, 195, 255, 0.38)' }
  ];

  ctx.globalCompositeOperation = 'screen';
  for (const b of bands) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1, b.ry / b.rx);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, b.rx);
    g.addColorStop(0.0, b.color);
    g.addColorStop(0.5, b.color.replace(/[\d.]+\)$/, '0.18)'));
    g.addColorStop(1.0, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, b.rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const envTex = new THREE.CanvasTexture(envCanvas);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.SRGBColorSpace;

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envMap = pmrem.fromEquirectangular(envTex).texture;
  envTex.dispose();
  pmrem.dispose();
  return envMap;
}

scene.environment = createAbyssalEnvironment(renderer);
scene.environmentIntensity = 1.25;

// Studio Three-Point Lighting + Internal Bioluminescent Lights
const ambientLight = new THREE.HemisphereLight(0x1a4b7c, 0x050714, 0.75);
scene.add(ambientLight);

// 1. Key Light (Cool Abyssal Cyan-White from top-front-left)
const keyLight = new THREE.DirectionalLight(0x88f2ff, 2.4);
keyLight.position.set(-8, 14, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 2;
keyLight.shadow.camera.far = 35;
const d = 10;
keyLight.shadow.camera.left = -d;
keyLight.shadow.camera.right = d;
keyLight.shadow.camera.top = d;
keyLight.shadow.camera.bottom = -d;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

// 2. Fill Light (Bioluminescent Magenta-Violet from right-below)
const fillLight = new THREE.DirectionalLight(0xe040fb, 1.65);
fillLight.position.set(11, -6, 7);
scene.add(fillLight);

// 3. Rim / Backlight (Crisp Aquamarine from behind-top for bell edge translucency)
const rimLight = new THREE.DirectionalLight(0x64ffda, 2.8);
rimLight.position.set(2, 10, -12);
scene.add(rimLight);

// Soft Contact Shadow / Abyssal Caustic Floor Disc
function createSoftContactShadowDisc() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 256, 10, 256, 256, 245);
  g.addColorStop(0.0, 'rgba(0, 12, 28, 0.72)');
  g.addColorStop(0.28, 'rgba(0, 45, 78, 0.32)');
  g.addColorStop(0.55, 'rgba(18, 8, 42, 0.14)');
  g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);

  const tex = new THREE.CanvasTexture(c);
  const geo = new THREE.PlaneGeometry(18, 18);
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = -11.2;
  return mesh;
}
const contactShadowDisc = createSoftContactShadowDisc();
scene.add(contactShadowDisc);

// Soft Glow Sprite Texture Helper
function createGlowTexture() {
  const c = document.createElement('canvas');
  c.width = 128;
  c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
  g.addColorStop(0.2, 'rgba(180, 245, 255, 0.78)');
  g.addColorStop(0.5, 'rgba(80, 180, 255, 0.25)');
  g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowSpriteTex = createGlowTexture();

// ============================================================================
// 3. JELLYFISH MASTER GROUP & MOUSE FLUID VORTEX STATE
// ============================================================================
const jellyGroup = new THREE.Group();
scene.add(jellyGroup);

// Internal dynamic point lights attached inside the bell
const coreCyanLight = new THREE.PointLight(0x00f7ff, 4.5, 14, 1.4);
coreCyanLight.position.set(0, 2.3, 0);
jellyGroup.add(coreCyanLight);

const coreMagentaLight = new THREE.PointLight(0xff2a95, 3.8, 12, 1.5);
coreMagentaLight.position.set(0, 1.2, 0);
jellyGroup.add(coreMagentaLight);

// Invisible collider volume for smooth Raycaster hit detection across bell & tentacles
const hitVolumeGeo = new THREE.CylinderGeometry(3.8, 2.8, 13.5, 24, 1);
hitVolumeGeo.translate(0, -2.5, 0);
const hitVolumeMat = new THREE.MeshBasicMaterial({ visible: false });
const hitVolumeMesh = new THREE.Mesh(hitVolumeGeo, hitVolumeMat);
jellyGroup.add(hitVolumeMesh);

// Interactive Mouse Fluid Vortex & Bioluminescent Pulse State
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2(999, 999);
const prevMouseWorld = new THREE.Vector3();
const mouseWorld = new THREE.Vector3(0, -999, 0);
const mouseVelocity = new THREE.Vector3();
const vortexCenter = new THREE.Vector3(0, -999, 0);
const vortexVel = new THREE.Vector3();
let vortexStrength = 0.0;
let biolumWaveTime = -10.0;
let biolumWaveOrigin = new THREE.Vector3(0, 2.0, 0);
let extraPulseBoost = 0.0;

// Track Bell localized elastic deformation impulses from mouse touches
const bellImpulses = []; // { theta, u, strength, phase }

function updatePointerRay(clientX, clientY, isClick = false) {
  mouseNDC.x = (clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);

  const hits = raycaster.intersectObject(hitVolumeMesh, false);
  let targetPt = new THREE.Vector3();

  if (hits.length > 0) {
    targetPt.copy(hits[0].point);
  } else {
    // Project onto plane facing camera passing through jellyfish center
    const planeNormal = new THREE.Vector3();
    camera.getWorldDirection(planeNormal).negate();
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(
      planeNormal,
      jellyGroup.position
    );
    raycaster.ray.intersectPlane(plane, targetPt);
  }

  if (targetPt) {
    if (prevMouseWorld.y < -500) {
      prevMouseWorld.copy(targetPt);
    }
    mouseVelocity.subVectors(targetPt, prevMouseWorld);
    const speed = mouseVelocity.length();
    if (speed > 2.5) mouseVelocity.multiplyScalar(2.5 / speed);

    prevMouseWorld.copy(targetPt);
    mouseWorld.copy(targetPt);

    // Check distance to jellyfish axis
    const localPt = targetPt.clone().sub(jellyGroup.position);
    const radialDist = Math.hypot(localPt.x, localPt.z);
    if (radialDist < 5.5 && localPt.y > -10.5 && localPt.y < 5.5) {
      vortexCenter.lerp(targetPt, 0.45);
      vortexVel.lerp(mouseVelocity, 0.5);
      vortexStrength = Math.min(1.8, vortexStrength + speed * 1.45 + (isClick ? 1.35 : 0.12));

      // Trigger bioluminescent color wave if moving fast or clicked
      if (speed > 0.06 || isClick) {
        if (performance.now() * 0.001 - biolumWaveTime > 0.35 || isClick) {
          biolumWaveTime = performance.now() * 0.001;
          biolumWaveOrigin.copy(localPt);
        }
      }

      // If near the umbrella bell, add elastic jelly wobble impulse
      if (localPt.y > 0.2 && localPt.y < 4.5 && radialDist < 4.2) {
        const theta = Math.atan2(localPt.z, localPt.x);
        const u = Math.min(1.0, radialDist / 3.2);
        bellImpulses.push({
          theta,
          u,
          strength: Math.min(0.65, speed * 1.6 + (isClick ? 0.55 : 0.08)),
          age: 0
        });
        if (bellImpulses.length > 10) bellImpulses.shift();
      }

      if (isClick) {
        extraPulseBoost = Math.min(1.0, extraPulseBoost + 0.65);
      }
    }
  }
}

window.addEventListener('pointermove', (e) => {
  updatePointerRay(e.clientX, e.clientY, false);
});

window.addEventListener('pointerdown', (e) => {
  updatePointerRay(e.clientX, e.clientY, true);
});

// ============================================================================
// 4. UMBRELLA BELL KINEMATICS & PARAMETRIC SURFACE EVALUATOR
// ============================================================================
const NUM_LOBES = 16; // 16 marginal scalloped lappets & rhopalia
const BELL_RADIAL_SEGS = 128;
const BELL_HEIGHT_SEGS = 52;
const BELL_BASE_RADIUS = 3.15;
const BELL_BASE_HEIGHT = 2.65;

// Evaluates a point (and analytic tangent info) on the pulsing scalloped bell
// u in [0, 1] (apex to margin), theta in [0, 2*PI]
function evaluateBellPoint(u, theta, time, pulsePhase, outVec) {
  // Travelling radial contraction wave from apex (u=0) to margin (u=1)
  const waveLag = u * 1.85;
  const phase = pulsePhase - waveLag;

  // Asymmetric jellyfish contraction curve: sharp power stroke, graceful recovery
  const rawSin = Math.sin(phase);
  const contraction = Math.pow(0.5 + 0.5 * rawSin, 1.55) * 2.0 - 1.0;

  // 16 scalloped marginal lobes (Chrysaora lappets)
  const lobeCos = Math.cos(NUM_LOBES * theta);
  const lobeProfile = Math.pow(u, 2.6);
  const scallopRadiusMod = 1.0 + 0.038 * lobeCos * lobeProfile;
  const scallopSkirtDrop = -0.14 * (0.5 + 0.5 * lobeCos) * Math.pow(u, 3.2);

  // Secondary subtle 32-fold exumbrella radial crease
  const fineCrease = 0.012 * Math.cos(NUM_LOBES * 2 * theta) * Math.sin(u * Math.PI);

  // Base dome profile: flattened apex, curved shoulder, slightly tucked margin
  const rProfile = Math.sin(u * Math.PI * 0.56) * (1.0 - 0.06 * Math.pow(u, 3.0));
  const yProfile = Math.cos(u * Math.PI * 0.53) * BELL_BASE_HEIGHT;

  // Dynamic radial contraction (strongest near margin u ~ 0.65..1.0)
  const contractFactor = 1.0 - (0.21 + 0.06 * extraPulseBoost) * contraction * Math.pow(u, 1.35);
  // Bell elongates slightly vertically during contraction power stroke
  const stretchFactor = 1.0 + 0.11 * contraction * (1.0 - 0.4 * u);
  // Marginal flare wave at the rim (u > 0.72)
  const rimFlare = Math.sin(phase - 0.65) * 0.24 * Math.pow(Math.max(0, (u - 0.62) / 0.38), 2.0);

  // Mouse elastic jelly wobble impulses
  let wobbleR = 0.0;
  let wobbleY = 0.0;
  for (let i = 0; i < bellImpulses.length; i++) {
    const imp = bellImpulses[i];
    let dTheta = Math.abs(theta - imp.theta);
    if (dTheta > Math.PI) dTheta = Math.PI * 2 - dTheta;
    const distSq = dTheta * dTheta * 0.6 + (u - imp.u) * (u - imp.u) * 2.5;
    const env = Math.exp(-distSq * 4.5) * Math.exp(-imp.age * 2.4);
    const osc = Math.sin(imp.age * 16.0 - Math.sqrt(distSq) * 7.0);
    wobbleR += imp.strength * env * osc * 0.45;
    wobbleY += imp.strength * env * osc * 0.28;
  }

  const r = (BELL_BASE_RADIUS * rProfile * contractFactor * scallopRadiusMod + rimFlare + fineCrease + wobbleR);
  const y = 1.65 + yProfile * stretchFactor + scallopSkirtDrop + wobbleY;

  outVec.set(r * Math.cos(theta), y, r * Math.sin(theta));
  return outVec;
}

// Compute bioluminescent excitation factor at local position p
function getBiolumExcitation(x, y, z, time) {
  const dx = x - biolumWaveOrigin.x;
  const dy = y - biolumWaveOrigin.y;
  const dz = z - biolumWaveOrigin.z;
  const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
  const elapsed = time - biolumWaveTime;
  let waveBoost = 0.0;
  if (elapsed > 0 && elapsed < 3.5) {
    const waveRadius = elapsed * 5.2;
    const ring = Math.exp(-Math.pow(dist - waveRadius, 2) * 0.85);
    const decay = Math.exp(-elapsed * 0.95);
    waveBoost = ring * decay * 1.45;
  }
  return waveBoost;
}

// ============================================================================
// 5. CONSTRUCT TRANSLUCENT UMBRELLA BELL & INNER VELARIUM
// ============================================================================
const bellVertexCount = (BELL_HEIGHT_SEGS + 1) * (BELL_RADIAL_SEGS + 1);
const bellPositions = new Float32Array(bellVertexCount * 3);
const bellColors = new Float32Array(bellVertexCount * 3);
const bellUVs = new Float32Array(bellVertexCount * 2);
const bellIndices = [];

for (let iy = 0; iy <= BELL_HEIGHT_SEGS; iy++) {
  const u = iy / BELL_HEIGHT_SEGS;
  for (let ix = 0; ix <= BELL_RADIAL_SEGS; ix++) {
    const v = ix / BELL_RADIAL_SEGS;
    const idx = iy * (BELL_RADIAL_SEGS + 1) + ix;
    bellUVs[idx * 2] = v;
    bellUVs[idx * 2 + 1] = u;

    if (iy < BELL_HEIGHT_SEGS && ix < BELL_RADIAL_SEGS) {
      const a = idx;
      const b = idx + BELL_RADIAL_SEGS + 1;
      const c = idx + BELL_RADIAL_SEGS + 2;
      const d = idx + 1;
      bellIndices.push(a, b, d);
      bellIndices.push(b, c, d);
    }
  }
}

const bellGeo = new THREE.BufferGeometry();
bellGeo.setAttribute('position', new THREE.BufferAttribute(bellPositions, 3));
bellGeo.setAttribute('color', new THREE.BufferAttribute(bellColors, 3));
bellGeo.setAttribute('uv', new THREE.BufferAttribute(bellUVs, 2));
bellGeo.setIndex(bellIndices);

const bellMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdffaff,
  vertexColors: true,
  transmission: 0.91,
  transparent: true,
  opacity: 0.96,
  roughness: 0.11,
  metalness: 0.02,
  ior: 1.38,
  thickness: 2.1,
  attenuationColor: new THREE.Color(0x063868),
  attenuationDistance: 4.2,
  iridescence: 1.0,
  iridescenceIOR: 1.42,
  iridescenceThicknessRange: [160, 680],
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  emissive: new THREE.Color(0x16648c),
  emissiveIntensity: 0.42,
  side: THREE.DoubleSide,
  depthWrite: false
});

const bellMesh = new THREE.Mesh(bellGeo, bellMaterial);
bellMesh.renderOrder = 2;
jellyGroup.add(bellMesh);

// Inner translucent subumbrella dome layer for volumetric depth
const innerBellMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffb8f0,
  vertexColors: true,
  transmission: 0.85,
  transparent: true,
  opacity: 0.55,
  roughness: 0.18,
  ior: 1.34,
  thickness: 0.9,
  iridescence: 0.85,
  iridescenceIOR: 1.5,
  emissive: new THREE.Color(0x3a0f52),
  emissiveIntensity: 0.35,
  side: THREE.BackSide,
  depthWrite: false
});
const innerBellMesh = new THREE.Mesh(bellGeo, innerBellMaterial);
innerBellMesh.scale.set(0.955, 0.965, 0.955);
innerBellMesh.renderOrder = 1;
jellyGroup.add(innerBellMesh);

// ============================================================================
// 6. 16 RADIAL CANALS, SCALLOPED RING CANAL & 16 RHOPALIA SENSORY PEARLS
// ============================================================================
const CANAL_SEGS = 44;
// 16 primary radial canals (to rhopalia clefts) + 16 secondary interradial canals (to lobe tips)
const TOTAL_CANALS = 32;
const canalPositions = new Float32Array(TOTAL_CANALS * CANAL_SEGS * 2 * 3);
const canalColors = new Float32Array(TOTAL_CANALS * CANAL_SEGS * 2 * 3);

const canalGeo = new THREE.BufferGeometry();
canalGeo.setAttribute('position', new THREE.BufferAttribute(canalPositions, 3));
canalGeo.setAttribute('color', new THREE.BufferAttribute(canalColors, 3));

const canalMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.92,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const canalLines = new THREE.LineSegments(canalGeo, canalMat);
canalLines.renderOrder = 3;
jellyGroup.add(canalLines);

// 16 Glowing Rhopalia (sensory organs nestled in the 16 clefts between lobes)
const rhopaliaGroup = new THREE.Group();
jellyGroup.add(rhopaliaGroup);

const rhopaliaMeshes = [];
const rhopaliaSprites = [];
const rhopaliaGeo = new THREE.SphereGeometry(0.055, 12, 12);
const rhopaliaMat = new THREE.MeshBasicMaterial({
  color: 0x70ffff,
  blending: THREE.AdditiveBlending
});

for (let i = 0; i < NUM_LOBES; i++) {
  const m = new THREE.Mesh(rhopaliaGeo, rhopaliaMat.clone());
  rhopaliaGroup.add(m);
  rhopaliaMeshes.push(m);

  const spMat = new THREE.SpriteMaterial({
    map: glowSpriteTex,
    color: i % 2 === 0 ? 0x00f7ff : 0xff38b8,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const sp = new THREE.Sprite(spMat);
  sp.scale.set(0.48, 0.48, 1.0);
  rhopaliaGroup.add(sp);
  rhopaliaSprites.push(sp);
}

// ============================================================================
// 7. INTERNAL BIOLUMINESCENT GONADS & STOMACH CORE (MANUBRIUM)
// ============================================================================
const coreGroup = new THREE.Group();
coreGroup.position.set(0, 2.25, 0);
jellyGroup.add(coreGroup);

// Central Gastrovascular Stomach Pouch
const stomachGeo = new THREE.SphereGeometry(0.85, 32, 24);
stomachGeo.scale(1.0, 0.68, 1.0);
const stomachMat = new THREE.MeshPhysicalMaterial({
  color: 0xff80df,
  transmission: 0.78,
  transparent: true,
  opacity: 0.88,
  roughness: 0.2,
  ior: 1.4,
  thickness: 1.4,
  iridescence: 0.9,
  emissive: new THREE.Color(0xb5179e),
  emissiveIntensity: 0.95,
  depthWrite: false
});
const stomachMesh = new THREE.Mesh(stomachGeo, stomachMat);
coreGroup.add(stomachMesh);

// 4 Horseshoe-shaped Convoluted Bioluminescent Gonads inside the Bell
const gonadGroup = new THREE.Group();
coreGroup.add(gonadGroup);

class GonadCurve extends THREE.Curve {
  constructor(quadrantIndex) {
    super();
    this.qAngle = (quadrantIndex * Math.PI) / 2 + Math.PI / 4;
  }
  getPoint(t, optionalTarget = new THREE.Vector3()) {
    // Horseshoe arc in local quadrant with sinusoidal frilled undulations
    const arc = (t - 0.5) * Math.PI * 1.35;
    const baseR = 0.58 + 0.16 * Math.cos(arc * 1.5);
    const waveR = 0.065 * Math.sin(t * Math.PI * 14.0);
    const waveY = 0.065 * Math.cos(t * Math.PI * 14.0) - 0.12 * Math.cos(arc);

    const lx = Math.cos(arc) * (baseR + waveR) * 0.48 + 0.52;
    const lz = Math.sin(arc) * (baseR + waveR) * 0.48;

    const cosQ = Math.cos(this.qAngle);
    const sinQ = Math.sin(this.qAngle);
    const x = lx * cosQ - lz * sinQ;
    const z = lx * sinQ + lz * cosQ;
    const y = waveY + 0.1;

    return optionalTarget.set(x, y, z);
  }
}

const gonadMat = new THREE.MeshPhysicalMaterial({
  color: 0xff66cc,
  emissive: new THREE.Color(0xff1493),
  emissiveIntensity: 1.45,
  roughness: 0.18,
  transmission: 0.5,
  transparent: true,
  opacity: 0.95
});

const gonadMeshes = [];
for (let q = 0; q < 4; q++) {
  const curve = new GonadCurve(q);

// 11. REAL-TIME KINEMATICS, FLUID DRAG & VORTEX SIMULATION LOOP
// ============================================================================
const tempVec = new THREE.Vector3();
const tempVec2 = new THREE.Vector3();
const tempNormal = new THREE.Vector3();
const tempTangent = new THREE.Vector3();
const tempBinormal = new THREE.Vector3();
const tempColor = new THREE.Color();

let clock = new THREE.Clock();
let pulsePhase = 0.0;

function updateBellAndCanals(time, dt) {
  // Update bell wobble impulses decay
  for (let i = bellImpulses.length - 1; i >= 0; i--) {
    bellImpulses[i].age += dt;
    if (bellImpulses[i].age > 2.2) {
      bellImpulses.splice(i, 1);
    }
  }

  // Update Umbrella Bell vertices and bioluminescent vertex colors
  for (let iy = 0; iy <= BELL_HEIGHT_SEGS; iy++) {
    const u = iy / BELL_HEIGHT_SEGS;
    for (let ix = 0; ix <= BELL_RADIAL_SEGS; ix++) {
      const v = ix / BELL_RADIAL_SEGS;
      const theta = v * Math.PI * 2;
      const idx = (iy * (BELL_RADIAL_SEGS + 1) + ix) * 3;

      evaluateBellPoint(u, theta, time, pulsePhase, tempVec);
      bellPositions[idx] = tempVec.x;
      bellPositions[idx + 1] = tempVec.y;
      bellPositions[idx + 2] = tempVec.z;

      // Bioluminescent coloring along 16 radial canals, scalloped rim, and mouse wave
      const canalProximity = Math.pow(0.5 + 0.5 * Math.cos(NUM_LOBES * theta), 6.0);
      const interCanalProx = Math.pow(0.5 + 0.5 * Math.cos(NUM_LOBES * theta + Math.PI), 8.0);
      const rimGlow = Math.pow(u, 3.2);
      const apexGlow = Math.pow(1.0 - u, 2.5);
      const waveBoost = getBiolumExcitation(tempVec.x, tempVec.y, tempVec.z, time);
      const travelPulse = 0.5 + 0.5 * Math.sin(pulsePhase - u * 4.2);

      // Base translucent sapphire-aqua shifting to neon cyan and magenta on lobes
      const rCol =
        0.08 +
        0.52 * apexGlow +
        0.85 * interCanalProx * (0.3 + 0.7 * u) +
        0.65 * rimGlow * (0.5 + 0.5 * Math.sin(NUM_LOBES * theta)) +
        waveBoost * 0.55;
      const gCol =
        0.38 +
        0.58 * canalProximity * travelPulse +
        0.45 * rimGlow +
        waveBoost * 0.95;
      const bCol =
        0.65 +
        0.35 * canalProximity +
        0.35 * rimGlow +
        waveBoost * 0.85;

      bellColors[idx] = Math.min(1.6, rCol);
      bellColors[idx + 1] = Math.min(1.6, gCol);
      bellColors[idx + 2] = Math.min(1.6, bCol);
    }
  }

  bellGeo.attributes.position.needsUpdate = true;
  bellGeo.attributes.color.needsUpdate = true;
  bellGeo.computeVertexNormals();

  // Update 32 Radial Canals (16 primary to rhopalia + 16 secondary to lobe tips)
  let cPtr = 0;
  for (let c = 0; c < TOTAL_CANALS; c++) {
    const theta = (c / TOTAL_CANALS) * Math.PI * 2;
    const isRhopalar = c % 2 === 1; // Odd indices land in the 16 clefts between lobes

    for (let s = 0; s < CANAL_SEGS; s++) {
      const u0 = 0.08 + (s / CANAL_SEGS) * 0.89;
      const u1 = 0.08 + ((s + 1) / CANAL_SEGS) * 0.89;

      evaluateBellPoint(u0, theta, time, pulsePhase, tempVec);
      evaluateBellPoint(u1, theta, time, pulsePhase, tempVec2);

      // Slightly inset into inner bell wall
      canalPositions[cPtr] = tempVec.x * 0.985;
      canalPositions[cPtr + 1] = tempVec.y - 0.015;
      canalPositions[cPtr + 2] = tempVec.z * 0.985;

      canalPositions[cPtr + 3] = tempVec2.x * 0.985;
      canalPositions[cPtr + 4] = tempVec2.y - 0.015;
      canalPositions[cPtr + 5] = tempVec2.z * 0.985;

      // Travelling photon packet along radial canals
      const packet = Math.pow(0.5 + 0.5 * Math.sin(time * 5.2 - u0 * 9.0 + c * 0.4), 6.0);
      const waveBoost = getBiolumExcitation(tempVec.x, tempVec.y, tempVec.z, time);
      const intensity = 0.45 + 0.75 * packet + waveBoost;

      const cr = isRhopalar ? 0.15 * intensity : 0.95 * intensity;
      const cg = isRhopalar ? 0.98 * intensity : 0.28 * intensity;
      const cb = 1.0 * intensity;

      canalColors[cPtr] = cr;
      canalColors[cPtr + 1] = cg;
      canalColors[cPtr + 2] = cb;
      canalColors[cPtr + 3] = cr;
      canalColors[cPtr + 4] = cg;
      canalColors[cPtr + 5] = cb;

      cPtr += 6;
    }
  }
  canalGeo.attributes.position.needsUpdate = true;
  canalGeo.attributes.color.needsUpdate = true;

  // Update 16 Rhopalia Sensory Organs at the 16 Marginal Clefts
  for (let i = 0; i < NUM_LOBES; i++) {
    const cleftTheta = ((i + 0.5) / NUM_LOBES) * Math.PI * 2;
    evaluateBellPoint(0.96, cleftTheta, time, pulsePhase, tempVec);
    rhopaliaMeshes[i].position.copy(tempVec);
    rhopaliaSprites[i].position.copy(tempVec);

    const waveBoost = getBiolumExcitation(tempVec.x, tempVec.y, tempVec.z, time);
    const pulseScale = 0.38 + 0.14 * Math.sin(pulsePhase + i * 0.5) + waveBoost * 0.28;
    rhopaliaSprites[i].scale.set(pulseScale, pulseScale, 1.0);
  }
}

// Helper: Apply Mouse Fluid Vortex Current & Hydrodynamic Drag to a node
function applyVortexForce(nodePos, nodeVel, nodeIndexRatio, dt) {
  if (vortexStrength <= 0.001) return 0.0;

  // Transform vortexCenter into jellyGroup local space
  const localVortex = tempVec2.copy(vortexCenter).sub(jellyGroup.position);
  const dx = nodePos.x - localVortex.x;
  const dy = nodePos.y - localVortex.y;
  const dz = nodePos.z - localVortex.z;
  const distSq = dx * dx + dy * dy + dz * dz;
  const radius = 4.6;

  if (distSq < radius * radius) {
    const dist = Math.sqrt(distSq) + 0.001;
    const falloff = Math.pow(1.0 - dist / radius, 2.0) * vortexStrength * (0.35 + 0.65 * nodeIndexRatio);

    // Swirl tangential force (cross product of vertical/mouse axis with radial offset)
    const swirlX = -dz / dist;
    const swirlZ = dx / dist;

    nodeVel.x += (swirlX * 12.0 + vortexVel.x * 26.0 + (dx / dist) * 4.5) * falloff * dt;
    nodeVel.y += (vortexVel.y * 18.0 + (dy / dist) * 2.5) * falloff * dt;
    nodeVel.z += (swirlZ * 12.0 + vortexVel.z * 26.0 + (dz / dist) * 4.5) * falloff * dt;
    return falloff;
  }
  return 0.0;
}

function updateOralArms(time, dt) {
  const segLen = ARM_LENGTH / (ARM_SPINE_NODES - 1);
  const bellThrust = Math.sin(pulsePhase - 0.5);

  for (let a = 0; a < NUM_ORAL_ARMS; a++) {
    const arm = oralArmSpines[a];
    const nodes = arm.nodes;
    const baseAngle = arm.angle;

    // Anchor node 0 to subumbrella manubrium
    const anchorR = 0.34 + 0.05 * bellThrust;
    nodes[0].pos.set(
      Math.cos(baseAngle) * anchorR,
      1.68 + 0.12 * bellThrust,
      Math.sin(baseAngle) * anchorR
    );

    // Multi-segment wave kinematics with realistic phase lag & fluid drag
    for (let i = 1; i < ARM_SPINE_NODES; i++) {
      const s = i / (ARM_SPINE_NODES - 1);
      const node = nodes[i];

      // Travelling helical wave down the oral arm with phase lag
      const phaseLag = time * 2.35 - s * 5.8 + a * (Math.PI * 0.5);
      const secondaryLag = time * 3.9 - s * 10.5 + a * 1.1;

      const waveAmp = (0.18 + 0.52 * Math.pow(s, 1.25)) * (1.0 + 0.25 * extraPulseBoost);
      const targetX =
        Math.cos(baseAngle) * (0.34 * (1.0 - 0.45 * s) + 0.22 * bellThrust * Math.sin(s * Math.PI)) +
        Math.cos(phaseLag) * waveAmp +
        Math.sin(secondaryLag) * waveAmp * 0.22;
      const targetZ =
        Math.sin(baseAngle) * (0.34 * (1.0 - 0.45 * s) + 0.22 * bellThrust * Math.sin(s * Math.PI)) +
        Math.sin(phaseLag) * waveAmp +
        Math.cos(secondaryLag) * waveAmp * 0.22;
      const targetY = nodes[0].pos.y - s * ARM_LENGTH + 0.18 * Math.cos(phaseLag * 0.5) * s;

      // Spring restoration toward travelling wave target + fluid drag
      const stiffness = 8.5 * (1.0 - 0.45 * s);
      node.vel.x += (targetX - node.pos.x) * stiffness * dt;
      node.vel.y += (targetY - node.pos.y) * stiffness * dt;
      node.vel.z += (targetZ - node.pos.z) * stiffness * dt;

      // Mouse fluid vortex swirl
      const vortexHit = applyVortexForce(node.pos, node.vel, s, dt);
      node.glow = Math.max(node.glow * Math.exp(-dt * 2.2), vortexHit * 1.8);

      // Abyssal water viscous drag
      const drag = Math.exp(-dt * 5.4);
      node.vel.multiplyScalar(drag);
      node.pos.addScaledVector(node.vel, dt);

      // Inextensible chain constraint with parent node
      tempVec.subVectors(node.pos, nodes[i - 1].pos);
      const d = tempVec.length() || 0.001;
      if (d > segLen * 1.05 || d < segLen * 0.92) {
        const targetD = THREE.MathUtils.clamp(d, segLen * 0.92, segLen * 1.05);
        node.pos.copy(nodes[i - 1].pos).addScaledVector(tempVec, targetD / d);
      }
    }

    // Reconstruct Ruffled Spiral-Ribbon Geometry along the simulated spine
    const geo = oralArmGeos[a];
    const posArr = geo.attributes.position.array;
    const colArr = geo.attributes.color.array;

    for (let i = 0; i < ARM_SPINE_NODES; i++) {
      const s = i / (ARM_SPINE_NODES - 1);
      const p = nodes[i].pos;

      // Compute smooth spine tangent
      if (i === 0) {
        tempTangent.subVectors(nodes[1].pos, nodes[0].pos).normalize();
      } else if (i === ARM_SPINE_NODES - 1) {
        tempTangent.subVectors(nodes[i].pos, nodes[i - 1].pos).normalize();
      } else {
        tempTangent.subVectors(nodes[i + 1].pos, nodes[i - 1].pos).normalize();
      }

      // Helical ribbon twist along the oral arm
      const twistAngle = baseAngle + s * Math.PI * 3.8 + Math.sin(time * 1.4 - s * 3.0) * 0.45;
      tempNormal.set(Math.cos(twistAngle), 0, Math.sin(twistAngle));
      // Gram-Schmidt orthogonalize against tangent
      tempNormal.addScaledVector(tempTangent, -tempNormal.dot(tempTangent)).normalize();
      tempBinormal.crossVectors(tempTangent, tempNormal).normalize();

      // Oral arm width profile (broad ruffled curtains in middle, tapering to delicate point)
      const widthEnvelope = Math.sin(Math.pow(s, 0.72) * Math.PI) * (1.0 - 0.25 * Math.pow(s, 2.0));
      const halfWidth = 0.62 * widthEnvelope + 0.025;

      const waveExcite = getBiolumExcitation(p.x, p.y, p.z, time) + nodes[i].glow;

      for (let j = 0; j <= ARM_WIDTH_SEGS; j++) {
        const w = (j / ARM_WIDTH_SEGS) * 2.0 - 1.0; // [-1, 1] across ribbon width
        const absW = Math.abs(w);

        // Multi-frequency hyperbolic frill ruffle concentrated toward outer ribbon margins
        const frillAmp = Math.pow(absW, 1.55) * halfWidth * 0.62;
        const frillWave1 = Math.sin(s * 52.0 - time * 2.8 + w * 2.5 + a * 1.7);
        const frillWave2 = 0.42 * Math.cos(s * 112.0 + time * 3.6 - w * 4.0);
        const ruffleOffset = (frillWave1 + frillWave2) * frillAmp;

        // V-shaped folded trough cross-section + ruffled normal displacement
        const troughDepth = (1.0 - Math.cos(w * Math.PI * 0.65)) * halfWidth * 0.38;

        const vx =
          p.x +
          tempNormal.x * (w * halfWidth) +
          tempBinormal.x * (troughDepth + ruffleOffset);
        const vy =
          p.y +
          tempNormal.y * (w * halfWidth) +
          tempBinormal.y * (troughDepth + ruffleOffset);
        const vz =
          p.z +
          tempNormal.z * (w * halfWidth) +
          tempBinormal.z * (troughDepth + ruffleOffset);

        const vIdx = (i * (ARM_WIDTH_SEGS + 1) + j) * 3;
        posArr[vIdx] = vx;
        posArr[vIdx + 1] = vy;
        posArr[vIdx + 2] = vz;

        // Bioluminescent coloring: translucent violet-rose midrib with glowing magenta & cyan frill edges
        const edgeFactor = Math.pow(absW, 2.2);
        const midribFactor = Math.pow(1.0 - absW, 4.0);
        const shimmer = 0.5 + 0.5 * Math.sin(s * 24.0 - time * 3.2 + absW * 3.0);

        const rCol = 0.42 + 0.68 * edgeFactor + 0.35 * midribFactor + waveExcite * 0.45;
        const gCol = 0.14 + 0.55 * edgeFactor * shimmer + 0.25 * midribFactor + waveExcite * 0.95;
        const bCol = 0.58 + 0.52 * edgeFactor + 0.45 * midribFactor + waveExcite * 0.9;

        colArr[vIdx] = Math.min(1.65, rCol);
        colArr[vIdx + 1] = Math.min(1.65, gCol);
        colArr[vIdx + 2] = Math.min(1.65, bCol);
      }
    }

    geo.attributes.position.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
    geo.computeVertexNormals();
  }
}

function updateTentacles(time, dt) {
  let beadIdx = 0;

  for (let t = 0; t < NUM_TENTACLES; t++) {
    const tent = tentacles[t];
    const nodes = tent.nodes;
    const segLen = tent.length / (TENT_NODES - 1);

    // Lock Node 0 to the pulsing umbrella bell margin
    evaluateBellPoint(0.965, tent.theta, time, pulsePhase, nodes[0].pos);

    const cosT = Math.cos(tent.theta);
    const sinT = Math.sin(tent.theta);
    const perpX = -sinT;
    const perpZ = cosT;

    // Wake propulsion wave from bell margin contraction
    const marginJet = Math.sin(pulsePhase - 1.45);

    for (let i = 1; i < TENT_NODES; i++) {
      const s = i / (TENT_NODES - 1);
      const node = nodes[i];

      // Travelling wave along the slender tentacle with phase lag
      const wavePhase = time * 3.1 - s * 7.2 + tent.phaseOffset;
      const fineWave = time * 5.4 - s * 13.5 - tent.phaseOffset * 0.7;

      const radialSpread = 0.25 * s + 0.22 * marginJet * Math.sin(s * Math.PI * 0.85);
      const radialWave = (0.14 + 0.46 * Math.pow(s, 1.35)) * Math.sin(wavePhase);
      const tangWave = (0.12 + 0.38 * Math.pow(s, 1.4)) * Math.cos(wavePhase * 0.85) + 0.08 * Math.sin(fineWave) * s;

      const targetX =
        nodes[0].pos.x +
        cosT * (radialSpread + radialWave) +
        perpX * tangWave;
      const targetZ =
        nodes[0].pos.z +
        sinT * (radialSpread + radialWave) +
        perpZ * tangWave;
      const targetY = nodes[0].pos.y - s * tent.length + 0.14 * Math.cos(wavePhase) * s;

      // Damped fluid spring force with realistic lag toward tip
      const kSpring = 9.2 * Math.pow(1.0 - s * 0.55, 1.2);
      node.vel.x += (targetX - node.pos.x) * kSpring * dt;
      node.vel.y += (targetY - node.pos.y) * kSpring * dt;
      node.vel.z += (targetZ - node.pos.z) * kSpring * dt;

      // Interactive Mouse Fluid Vortex Current
      const vortexHit = applyVortexForce(node.pos, node.vel, s, dt);
      node.glow = Math.max(node.glow * Math.exp(-dt * 2.0), vortexHit * 2.1);

      // Fluid drag
      node.vel.multiplyScalar(Math.exp(-dt * 5.8));
      node.pos.addScaledVector(node.vel, dt);

      // Segment distance constraint
      tempVec.subVectors(node.pos, nodes[i - 1].pos);
      const d = tempVec.length() || 0.001;
      if (d > segLen * 1.06 || d < segLen * 0.9) {
        const clampedD = THREE.MathUtils.clamp(d, segLen * 0.9, segLen * 1.06);
        node.pos.copy(nodes[i - 1].pos).addScaledVector(tempVec, clampedD / d);
      }
    }

    // Build tubular vertices for this tentacle using stable parallel frames
    const baseV = t * vertsPerTentacle;
    tempNormal.set(cosT, 0, sinT);

    for (let i = 0; i < TENT_NODES; i++) {
      const s = i / (TENT_NODES - 1);
      const p = nodes[i].pos;

      if (i === 0) {
        tempTangent.subVectors(nodes[1].pos, nodes[0].pos).normalize();
      } else if (i === TENT_NODES - 1) {
        tempTangent.subVectors(nodes[i].pos, nodes[i - 1].pos).normalize();
      } else {
        tempTangent.subVectors(nodes[i + 1].pos, nodes[i - 1].pos).normalize();
      }

      // Parallel transport normal projection
      tempNormal.addScaledVector(tempTangent, -tempNormal.dot(tempTangent));
      if (tempNormal.lengthSq() < 1e-5) {
        tempNormal.set(1, 0, 0);
      } else {
        tempNormal.normalize();
      }
      tempBinormal.crossVectors(tempTangent, tempNormal).normalize();

      // Taper radius from bell margin to fine filament tip
      const radius = tent.baseRadius * (1.0 - 0.78 * Math.pow(s, 0.85));

      // Travelling bioluminescent pulse + mouse vortex excitation
      const waveExcite = getBiolumExcitation(p.x, p.y, p.z, time) + nodes[i].glow;
      const pulseBead = 0.5 + 0.5 * Math.sin(time * 4.5 - s * 10.0 + tent.phaseOffset);

      // Color gradient along tentacle (neon cyan at base -> electric violet/magenta -> glowing aqua tip)
      const isMagentaTier = tent.tier === 1;
      const rCol = (isMagentaTier ? 0.85 : 0.15 + 0.65 * s) + waveExcite * 0.55;
      const gCol = (isMagentaTier ? 0.25 + 0.55 * pulseBead : 0.82) + waveExcite * 0.95;
      const bCol = 0.98 + waveExcite * 0.65;

      for (let r = 0; r < TENT_RADIAL_SEGS; r++) {
        const ang = (r / TENT_RADIAL_SEGS) * Math.PI * 2;
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);

        const nx = tempNormal.x * ca + tempBinormal.x * sa;
        const ny = tempNormal.y * ca + tempBinormal.y * sa;
        const nz = tempNormal.z * ca + tempBinormal.z * sa;

        const vOffset = (baseV + i * TENT_RADIAL_SEGS + r) * 3;
        tentPositions[vOffset] = p.x + nx * radius;
        tentPositions[vOffset + 1] = p.y + ny * radius;
        tentPositions[vOffset + 2] = p.z + nz * radius;

        tentNormals[vOffset] = nx;
        tentNormals[vOffset + 1] = ny;
        tentNormals[vOffset + 2] = nz;

        tentColors[vOffset] = Math.min(1.8, rCol);
        tentColors[vOffset + 1] = Math.min(1.8, gCol);
        tentColors[vOffset + 2] = Math.min(1.8, bCol);
      }
    }

    // Update glowing nematocyst beads along this tentacle
    for (let b = 0; b < BEADS_PER_TENT; b++) {
      const nodeFloat = ((b + 0.5) / BEADS_PER_TENT) * (TENT_NODES - 2);
      const n0 = Math.floor(nodeFloat);
      const frac = nodeFloat - n0;
      const p0 = nodes[n0].pos;
      const p1 = nodes[n0 + 1].pos;

      const bx = p0.x + (p1.x - p0.x) * frac;
      const by = p0.y + (p1.y - p0.y) * frac;
      const bz = p0.z + (p1.z - p0.z) * frac;

      const bOff = beadIdx * 3;
      beadPositions[bOff] = bx;
      beadPositions[bOff + 1] = by;
      beadPositions[bOff + 2] = bz;

      const excite = getBiolumExcitation(bx, by, bz, time) + nodes[n0].glow;
      const twinkle = 0.55 + 0.45 * Math.sin(time * 5.8 - b * 1.1 + tent.phaseOffset);
      beadColors[bOff] = Math.min(1.8, (b % 2 === 0 ? 0.15 : 0.95) * twinkle + excite * 0.6);
      beadColors[bOff + 1] = Math.min(1.8, (b % 2 === 0 ? 0.95 : 0.35) * twinkle + excite * 0.9);
      beadColors[bOff + 2] = Math.min(1.8, 1.0 * twinkle + excite * 0.8);
      beadIdx++;
    }
  }

  tentGeo.attributes.position.needsUpdate = true;
  tentGeo.attributes.normal.needsUpdate = true;
  tentGeo.attributes.color.needsUpdate = true;
  beadGeo.attributes.position.needsUpdate = true;
  beadGeo.attributes.color.needsUpdate = true;
}

function updateMarineSnow(time, dt) {
  for (let i = 0; i < SNOW_COUNT; i++) {
    const idx = i * 3;
    const sv = snowVelocities[i];

    let x = snowPositions[idx];
    let y = snowPositions[idx + 1];
    let z = snowPositions[idx + 2];

    // Gentle abyssal current drift
    x += sv.vx + Math.sin(time * 0.6 + sv.phase) * 0.004;
    y += sv.vy;
    z += sv.vz + Math.cos(time * 0.5 + sv.phase) * 0.004;

    // Swirl marine snow when near mouse fluid vortex
    if (vortexStrength > 0.01) {
      const dx = x - vortexCenter.x;
      const dy = y - vortexCenter.y;
      const dz = z - vortexCenter.z;
      const dSq = dx * dx + dy * dy + dz * dz;
      if (dSq < 25.0) {
        const d = Math.sqrt(dSq) + 0.1;
        const f = (1.0 - d / 5.0) * vortexStrength * 0.08;
        x += (-dz / d + vortexVel.x * 2.0) * f;
        y += vortexVel.y * 1.5 * f;
        z += (dx / d + vortexVel.z * 2.0) * f;
      }
    }

    if (y > 13.0) y = -13.0;
    snowPositions[idx] = x;
    snowPositions[idx + 1] = y;
    snowPositions[idx + 2] = z;
  }
  snowGeo.attributes.position.needsUpdate = true;
}

// ============================================================================
// 12. MAIN ANIMATION LOOP & RESIZE HANDLER
// ============================================================================
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.033);
  const time = clock.getElapsedTime();

  // Decay interactive mouse vortex & click boost smoothly
  vortexStrength *= Math.exp(-dt * 2.8);
  vortexVel.multiplyScalar(Math.exp(-dt * 5.0));
  extraPulseBoost *= Math.exp(-dt * 1.8);

  // Advance rhythmic bell contraction phase (speeds up slightly when excited)
  const pulseFreq = 2.05 + extraPulseBoost * 1.1;
  pulsePhase += dt * pulseFreq;

  // Whole-body buoyant locomotion bobbing and gentle tilt in the abyssal current
  const thrustBob = Math.sin(pulsePhase - 0.8) * 0.28 + Math.sin(time * 0.55) * 0.18;
  jellyGroup.position.y = 0.85 + thrustBob;
  jellyGroup.position.x = Math.sin(time * 0.38) * 0.22;
  jellyGroup.rotation.z = Math.sin(time * 0.42) * 0.075 + vortexVel.x * 0.12 * vortexStrength;
  jellyGroup.rotation.x = Math.cos(time * 0.35) * 0.055 + vortexVel.z * 0.12 * vortexStrength;
  jellyGroup.rotation.y = time * 0.08;

  // Pulse internal core gonads & lights in sync with the bell and bioluminescent wave
  const coreExcite = getBiolumExcitation(0, 2.0, 0, time);
  const coreBeat = 0.5 + 0.5 * Math.sin(pulsePhase);
  coreGroup.position.y = 2.22 + 0.16 * Math.sin(pulsePhase - 0.3);
  const gonadScale = 1.0 + 0.08 * coreBeat + 0.12 * coreExcite;
  gonadGroup.scale.set(gonadScale, 1.0 - 0.05 * coreBeat, gonadScale);
  gonadMat.emissiveIntensity = 1.3 + 0.65 * coreBeat + 1.2 * coreExcite;
  stomachMat.emissiveIntensity = 0.85 + 0.45 * coreBeat + 0.9 * coreExcite;

  coreCyanLight.intensity = 4.2 + 2.2 * coreBeat + 3.5 * coreExcite;
  coreMagentaLight.intensity = 3.5 + 1.8 * (1.0 - coreBeat) + 3.0 * coreExcite;

  // Update all anatomical & particle systems
  updateBellAndCanals(time, dt);
  updateOralArms(time, dt);
  updateTentacles(time, dt);
  updateMarineSnow(time, dt);

  controls.update();
  composer.render();
}

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

animate();
</script>
