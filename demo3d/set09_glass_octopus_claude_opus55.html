<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Octopus</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #020a12; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const TAU = Math.PI * 2;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03111d);
scene.fog = new THREE.FogExp2(0x052233, 0.03);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 300);
camera.position.set(0.0, 1.3, 8.8);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------- ocean dome (opaque, so it appears inside transmission)
const domeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x2b86b0) },
    mid: { value: new THREE.Color(0x06304a) },
    bot: { value: new THREE.Color(0x01070e) },
    time: { value: 0 }
  },
  vertexShader: `
    varying vec3 vP;
    void main(){
      vP = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform float time;
    varying vec3 vP;
    void main(){
      float h = vP.y;
      vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.85)) : mix(mid, bot, pow(-h, 0.6));
      float a = atan(vP.x, vP.z);
      float rays = pow(max(0.0, sin(a * 9.0 + time * 0.12) * 0.5 + 0.5), 6.0)
                 * pow(max(0.0, sin(a * 5.0 - time * 0.07) * 0.5 + 0.5), 2.0);
      c += vec3(0.35, 0.75, 1.0) * rays * smoothstep(-0.1, 0.9, h) * 0.12;
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const dome = new THREE.Mesh(new THREE.SphereGeometry(120, 48, 32), domeMat);
scene.add(dome);

// ---------------------------------------------------------------- lights (studio three-point + hemi)
scene.add(new THREE.HemisphereLight(0x8fd8ff, 0x0a1a2a, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff1e0, 2.6);
keyLight.position.set(4, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6; keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6; keyLight.shadow.camera.bottom = -6;
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.radius = 4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7fb6ff, 0.9);
fillLight.position.set(-6, 3, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x9ff0ff, 2.2);
rimLight.position.set(0, 4, -7);
scene.add(rimLight);

// ---------------------------------------------------------------- helpers
function radialTexture(stops, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) grd.addColorStop(o, col);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

// ---------------------------------------------------------------- floor + contact shadow
const floorAlpha = radialTexture([[0, '#ffffff'], [0.45, '#888888'], [1, '#000000']], 256);
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 96),
  new THREE.MeshStandardMaterial({ color: 0x0c2735, roughness: 0.95, metalness: 0, alphaMap: floorAlpha, transparent: true, depthWrite: false })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.6;
floor.receiveShadow = true;
scene.add(floor);

const blobTex = radialTexture([[0, '#ffffff'], [0.35, '#9a9a9a'], [1, '#000000']], 128);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x000000, alphaMap: blobTex, transparent: true, depthWrite: false, opacity: 0.5 });
const blob = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 5.5), blobMat);
blob.rotation.x = -Math.PI / 2;
blob.position.y = -2.585;
blob.renderOrder = 2;
scene.add(blob);

// ---------------------------------------------------------------- marine snow
const SN = 1400;
const snowPos = new Float32Array(SN * 3);
const snowSpd = new Float32Array(SN);
for (let i = 0; i < SN; i++) {
  snowPos[i * 3] = (Math.random() - 0.5) * 30;
  snowPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
  snowSpd[i] = 0.03 + Math.random() * 0.08;
}
const snowGeo = new THREE.BufferGeometry();
const snowAttr = new THREE.BufferAttribute(snowPos, 3);
snowAttr.setUsage(THREE.DynamicDrawUsage);
snowGeo.setAttribute('position', snowAttr);
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({
  color: 0xbfe6ff, size: 0.05, sizeAttenuation: true, transparent: true, opacity: 0.55, depthWrite: false,
  map: radialTexture([[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,0.5)'], [1, 'rgba(255,255,255,0)']], 64)
}));
snow.frustumCulled = false;
scene.add(snow);

// ---------------------------------------------------------------- materials
const mantleMat = new THREE.MeshPhysicalMaterial({
  color: 0xeef8ff, roughness: 0.07, metalness: 0,
  transmission: 0.96, thickness: 1.2, ior: 1.34,
  attenuationColor: 0xbfe6ff, attenuationDistance: 2.6,
  clearcoat: 1, clearcoatRoughness: 0.07,
  iridescence: 0.55, iridescenceIOR: 1.3, iridescenceThicknessRange: [120, 480],
  sheen: 0.6, sheenColor: 0x9fe6ff, sheenRoughness: 0.4,
  emissive: 0x0a2a3a, emissiveIntensity: 0.25, envMapIntensity: 1.2, specularIntensity: 1
});
const headMat = mantleMat.clone();
headMat.thickness = 0.8;

const armMat = new THREE.MeshPhysicalMaterial({
  color: 0xf8e4dc, roughness: 0.2, metalness: 0,
  transmission: 0.6, thickness: 0.35, ior: 1.36,
  attenuationColor: 0xffd2c0, attenuationDistance: 0.9,
  clearcoat: 0.8, clearcoatRoughness: 0.15,
  sheen: 0.5, sheenColor: 0xffc8d8, sheenRoughness: 0.5,
  iridescence: 0.3, iridescenceIOR: 1.3,
  emissive: 0x2a0f10, emissiveIntensity: 0.15, envMapIntensity: 1.0
});
const siphonMat = armMat.clone();
siphonMat.side = THREE.DoubleSide;

const suckerMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, vertexColors: true, roughness: 0.35, metalness: 0,
  sheen: 1, sheenColor: 0xff9fb8, sheenRoughness: 0.4,
  clearcoat: 0.6, clearcoatRoughness: 0.2,
  emissive: 0x3a1018, emissiveIntensity: 0.18, side: THREE.DoubleSide
});

const webMat = new THREE.MeshPhysicalMaterial({
  color: 0xf3e2dc, roughness: 0.3, metalness: 0, transparent: true, opacity: 0.33,
  side: THREE.DoubleSide, depthWrite: false,
  iridescence: 0.7, iridescenceIOR: 1.35, sheen: 0.6, sheenColor: 0xffd0e0,
  emissive: 0x1a0a0a, emissiveIntensity: 0.2
});

const coreMat = new THREE.MeshStandardMaterial({ color: 0xc8781a, emissive: 0xffa424, emissiveIntensity: 1.6, roughness: 0.4 });
const nerveMat = new THREE.MeshStandardMaterial({ color: 0xd9a030, emissive: 0xffc040, emissiveIntensity: 1.25, roughness: 0.45 });

const speckMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.35, metalness: 0.1, iridescence: 0.9, iridescenceIOR: 1.6,
  emissive: 0x1a0600, emissiveIntensity: 0.6
});

const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0xd4dee6, metalness: 0.85, roughness: 0.15, iridescence: 1, iridescenceIOR: 1.8, clearcoat: 1 });
const irisMat = new THREE.MeshPhysicalMaterial({ color: 0xd8a640, metalness: 0.7, roughness: 0.25, emissive: 0x3a2400, emissiveIntensity: 0.6, clearcoat: 1 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.08, metalness: 0.2 });
const corneaMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, transparent: true, opacity: 0.16, clearcoat: 1, depthWrite: false });

// ---------------------------------------------------------------- octopus root
const octo = new THREE.Group();
scene.add(octo);
const MANTLE_C = new THREE.Vector3(0, 1.12, 0);

// global animation state
let time = 0, breath = 0, spread = 0.5, recoil = 0, mInf = 0, jetY = 0, jetV = 0;
const wob = { x: 0, v: 0, dir: new THREE.Vector3(0, 0, 1) };

// ---------------------------------------------------------------- mantle (bulbous gelatinous)
let mantleGeo = new THREE.SphereGeometry(1, 80, 60);
mantleGeo.deleteAttribute('uv');
mantleGeo.deleteAttribute('normal');
mantleGeo = mergeVertices(mantleGeo);
mantleGeo.computeVertexNormals();
const mPosAttr = mantleGeo.attributes.position;
mPosAttr.setUsage(THREE.DynamicDrawUsage);
const mCount = mPosAttr.count;
const mDir = new Float32Array(mCount * 3);
{
  const v = new THREE.Vector3();
  for (let i = 0; i < mCount; i++) {
    v.fromBufferAttribute(mPosAttr, i).normalize();
    mDir[i * 3] = v.x; mDir[i * 3 + 1] = v.y; mDir[i * 3 + 2] = v.z;
  }
}
const mantle = new THREE.Mesh(mantleGeo, mantleMat);
mantle.position.copy(MANTLE_C);
mantle.castShadow = true;
octo.add(mantle);

function shapeAt(dx, dy, dz, out) {
  const topv = dy > 0 ? dy : 0;
  const bulge = 1 + 0.1 * topv;
  const r = 1 + breath
    + wob.x * 0.17 * (dx * wob.dir.x + dy * wob.dir.y + dz * wob.dir.z)
    + Math.abs(wob.x) * 0.05 * Math.sin(7 * dy + 5 * dx + 14 * time)
    + 0.012 * Math.sin(5 * dx + 3 * dz + 2 * time);
  out.x = dx * 0.8 * bulge * r;
  out.y = dy * 0.98 * r * (1 - breath * 0.5);
  out.z = dz * 0.76 * bulge * r - 0.14 * topv * topv;
  return out;
}

// chromatophore / iridophore speckles on mantle
const MS = 340;
const mSpeck = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), speckMat, MS);
mSpeck.frustumCulled = false;
const mSpeckDir = new Float32Array(MS * 3);
const mSpeckSize = new Float32Array(MS);
const speckPalette = [0x8a2a14, 0xb8441a, 0xd0661c, 0xe0a030, 0x6a1a10, 0x40c0c0, 0x8060e0].map(c => new THREE.Color(c));
{
  let n = 0;
  while (n < MS) {
    const u = Math.random() * 2 - 1, ph = Math.random() * TAU;
    if (u < -0.85) continue;
    const q = Math.sqrt(1 - u * u);
    mSpeckDir[n * 3] = q * Math.cos(ph); mSpeckDir[n * 3 + 1] = u; mSpeckDir[n * 3 + 2] = q * Math.sin(ph);
    mSpeckSize[n] = 0.01 + Math.pow(Math.random(), 2) * 0.022;
    mSpeck.setColorAt(n, speckPalette[Math.floor(Math.random() * speckPalette.length)]);
    n++;
  }
  mSpeck.instanceColor.needsUpdate = true;
}
mantle.add(mSpeck);

// ---------------------------------------------------------------- head (eye / arm crown region)
const head = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), headMat);
head.position.set(0, 0.22, 0);
head.scale.set(0.52, 0.36, 0.5);
head.castShadow = true;
octo.add(head);

// eyes
function makeEye(side) {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 24), eyeMat);
  ball.scale.set(0.85, 1.25, 0.9);
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.06, 24, 16), irisMat);
  iris.position.x = 0.095; iris.scale.set(0.6, 1.9, 1.2);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 24, 16), pupilMat);
  pupil.position.x = 0.1; pupil.scale.set(0.6, 1.5, 0.9);
  const cornea = new THREE.Mesh(new THREE.SphereGeometry(0.158, 32, 24), corneaMat);
  cornea.scale.set(0.85, 1.25, 0.9);
  g.add(ball, iris, pupil, cornea);
  g.position.set(side * 0.44, 0.34, 0.1);
  if (side < 0) g.rotation.y = Math.PI;
  g.rotation.z = side * 0.15 * (side < 0 ? -1 : 1);
  ball.castShadow = true;
  octo.add(g);
  return g;
}
makeEye(1); makeEye(-1);

// siphon tubes
const siphonGeo = new THREE.CylinderGeometry(0.035, 0.075, 0.34, 20, 1, true);
for (const side of [-1, 1]) {
  const m = new THREE.Mesh(siphonGeo, siphonMat);
  m.position.set(side * 0.2, 0.55, 0.52);
  m.rotation.set(1.15, 0, -side * 0.35);
  octo.add(m);
}

// ---------------------------------------------------------------- glowing internal core and nerves
const gland = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.7, 8, 20), coreMat);
gland.position.set(0, 1.1, -0.06);
gland.rotation.x = 0.18;
octo.add(gland);
const brain = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 16), coreMat);
brain.position.set(0, 0.3, 0);
brain.scale.set(1.35, 0.8, 1.05);
octo.add(brain);
for (const side of [-1, 1]) {
  const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 14), nerveMat);
  lobe.position.set(side * 0.22, 0.33, 0.06);
  octo.add(lobe);
}
function nerve(pts, rad) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, rad, 8, false), nerveMat);
  octo.add(m);
  return m;
}
for (const side of [-1, 1]) {
  nerve([[side * 0.08, 0.3, 0.02], [side * 0.2, 0.33, 0.06], [side * 0.33, 0.35, 0.1], [side * 0.42, 0.34, 0.1]], 0.022);
}
nerve([[0, 0.36, 0], [0.02, 0.55, -0.03], [0, 0.72, -0.05]], 0.02);
const coreLight = new THREE.PointLight(0xffa030, 3.5, 4, 2);
coreLight.position.set(0, 0.9, 0);
octo.add(coreLight);

// ---------------------------------------------------------------- tentacles
const NARMS = 8, N = 56, R = 12, RC = 6, BASE_LEN = 3.3;
const cosR = [], sinR = [], cosC = [], sinC = [];
for (let j = 0; j <= R; j++) { cosR.push(Math.cos(j / R * TAU)); sinR.push(Math.sin(j / R * TAU)); }
for (let j = 0; j <= RC; j++) { cosC.push(Math.cos(j / RC * TAU)); sinC.push(Math.sin(j / RC * TAU)); }

function rAt(s) { return 0.105 * Math.pow(1 - s, 1.15) + 0.011 + 0.045 * Math.exp(-s * 10); }

function makeTubeGeo(RR) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((N + 1) * (RR + 1) * 3);
  const nor = new Float32Array((N + 1) * (RR + 1) * 3);
  const idx = [];
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < RR; j++) {
      const a = i * (RR + 1) + j, b = (i + 1) * (RR + 1) + j, c = (i + 1) * (RR + 1) + j + 1, d = i * (RR + 1) + j + 1;
      idx.push(a, d, b, b, d, c);
    }
  }
  geo.setIndex(idx);
  const pa = new THREE.BufferAttribute(pos, 3); pa.setUsage(THREE.DynamicDrawUsage);
  const na = new THREE.BufferAttribute(nor, 3); na.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', pa);
  geo.setAttribute('normal', na);
  return geo;
}

const arms = [];
const pickables = [mantle, head];
const SUCK_ANG = 0.5;
let totalSuckers = 0;
for (let a = 0; a < NARMS; a++) {
  const theta = a / NARMS * TAU + Math.PI / 8;
  const geo = makeTubeGeo(R);
  const mesh = new THREE.Mesh(geo, armMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  mesh.userData.arm = a;
  octo.add(mesh);
  pickables.push(mesh);

  const cordGeo = makeTubeGeo(RC);
  const cord = new THREE.Mesh(cordGeo, nerveMat);
  cord.frustumCulled = false;
  octo.add(cord);

  const arm = {
    theta, mesh, geo, cordGeo,
    ph: Math.random() * TAU, ph2: Math.random() * TAU,
    len: BASE_LEN * (0.9 + Math.random() * 0.2),
    base: new THREE.Vector3(Math.cos(theta) * 0.3, 0.06, Math.sin(theta) * 0.3),
    out: new THREE.Vector3(Math.cos(theta), 0, Math.sin(theta)),
    P: [], T: [], U: [], V: [], r: new Float32Array(N + 1),
    x: 0, v: 0, pokeS: 0.5, pokeDir: new THREE.Vector3(0, 0, -1),
    suckers: [], specks: []
  };
  for (let i = 0; i <= N; i++) {
    arm.P.push(new THREE.Vector3()); arm.T.push(new THREE.Vector3());
    arm.U.push(new THREE.Vector3()); arm.V.push(new THREE.Vector3());
    arm.r[i] = rAt(i / N);
  }
  // two staggered rows of suckers along the oral (ventral) side
  let s = 0.06, side = 1;
  while (s < 0.9) {
    const fi = s * N;
    const i0 = Math.min(N - 1, Math.floor(fi));
    arm.suckers.push({ i0, f: fi - i0, side });
    side = -side;
    s += (rAt(s) * 0.6) / arm.len;
  }
  totalSuckers += arm.suckers.length;
  // dorsal chromatophores
  for (let k = 0; k < 26; k++) {
    const ss = 0.03 + Math.random() * 0.82;
    const fi = ss * N;
    const i0 = Math.min(N - 1, Math.floor(fi));
    arm.specks.push({ i0, f: fi - i0, ang: (Math.random() * 2 - 1) * 1.2, size: 0.1 + Math.random() * 0.1 });
  }
  arms.push(arm);
  // radial nerve from brain to the arm base
  nerve([[Math.cos(theta) * 0.06, 0.26, Math.sin(theta) * 0.06], [Math.cos(theta) * 0.18, 0.15, Math.sin(theta) * 0.18], [Math.cos(theta) * 0.3, 0.06, Math.sin(theta) * 0.3]], 0.012);
}

// sucker cup geometry (lathe profile, opening along +Y)
const prof = [
  [0.0, 0.18], [0.3, 0.2], [0.55, 0.3], [0.72, 0.48], [0.8, 0.62],
  [0.92, 0.67], [1.0, 0.58], [0.98, 0.4], [0.85, 0.15], [0.7, 0.0], [0.55, -0.15]
].map(p => new THREE.Vector2(p[0], p[1]));
const suckerGeo = new THREE.LatheGeometry(prof, 16);
{
  const cnt = suckerGeo.attributes.position.count;
  const cols = new Float32Array(cnt * 3);
  const inner = new THREE.Color(0xff9fb5), outer = new THREE.Color(0xfff2f4);
  for (let v = 0; v < cnt; v++) {
    const j = v % prof.length;
    const c = j <= 3 ? inner : (j === 4 ? inner.clone().lerp(outer, 0.5) : outer);
    cols[v * 3] = c.r; cols[v * 3 + 1] = c.g; cols[v * 3 + 2] = c.b;
  }
  suckerGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
}
const suckerMesh = new THREE.InstancedMesh(suckerGeo, suckerMat, totalSuckers);
suckerMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
suckerMesh.frustumCulled = false;
octo.add(suckerMesh);

const armSpeck = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), speckMat, NARMS * 26);
armSpeck.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
armSpeck.frustumCulled = false;
for (let i = 0; i < NARMS * 26; i++) armSpeck.setColorAt(i, speckPalette[Math.floor(Math.random() * 5)]);
armSpeck.instanceColor.needsUpdate = true;
octo.add(armSpeck);

// interbrachial web
const WU = 12, WV = 8, SWEB = 0.24;
const webGeo = new THREE.BufferGeometry();
const webPos = new Float32Array(NARMS * (WU + 1) * (WV + 1) * 3);
{
  const idx = [];
  for (let a = 0; a < NARMS; a++) {
    const base = a * (WU + 1) * (WV + 1);
    for (let v = 0; v < WV; v++) {
      for (let u = 0; u < WU; u++) {
        const i0 = base + v * (WU + 1) + u, i1 = i0 + 1, i2 = i0 + WU + 1, i3 = i2 + 1;
        idx.push(i0, i2, i1, i1, i2, i3);
      }
    }
  }
  webGeo.setIndex(idx);
  const wa = new THREE.BufferAttribute(webPos, 3);
  wa.setUsage(THREE.DynamicDrawUsage);
  webGeo.setAttribute('position', wa);
}
const web = new THREE.Mesh(webGeo, webMat);
web.frustumCulled = false;
web.renderOrder = 1;
octo.add(web);

// ---------------------------------------------------------------- kinematics
const UP = new THREE.Vector3(0, 1, 0), DOWN = new THREE.Vector3(0, -1, 0);
const _q = new THREE.Quaternion(), _ax = new THREE.Vector3(), _dp = new THREE.Vector3(), _tm = new THREE.Vector3();
const _dir = new THREE.Vector3(), _p = new THREE.Vector3(), _n = new THREE.Vector3(), _z = new THREE.Vector3();
const _pa = new THREE.Vector3(), _pb = new THREE.Vector3(), _sc = new THREE.Vector3(), _m = new THREE.Matrix4();
const cT = new THREE.Vector3(), cU = new THREE.Vector3(), cV = new THREE.Vector3(), cP = new THREE.Vector3();
const mouseLocal = new THREE.Vector3(0, -1, 3);

function rot(axis, ang) {
  if (ang === 0) return;
  _q.setFromAxisAngle(axis, ang);
  cT.applyQuaternion(_q); cU.applyQuaternion(_q); cV.applyQuaternion(_q);
}
function steer(D, g) {
  const d = cT.dot(D);
  _dp.copy(D).addScaledVector(cT, -d);
  const m = _dp.length();
  if (m < 1e-5) return;
  _ax.crossVectors(cT, _dp).multiplyScalar(1 / m);
  let ang = g * m;
  if (ang > 0.35) ang = 0.35; else if (ang < -0.35) ang = -0.35;
  rot(_ax, ang);
}

function updateArm(arm, t) {
  const el = -0.32 - 0.5 * (1 - spread) + 0.1 * Math.sin(t * 0.9 + arm.ph);
  const az = arm.theta + 0.06 * Math.sin(t * 0.7 + arm.ph2);
  cT.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
  cU.copy(UP).addScaledVector(cT, -cT.y).normalize();
  cV.crossVectors(cT, cU);
  cP.copy(arm.base);
  const ds = arm.len / N;

  const mh = Math.hypot(mouseLocal.x, mouseLocal.z);
  const facing = mh > 0.05 ? 0.35 + 0.65 * Math.max(0, (arm.out.x * mouseLocal.x + arm.out.z * mouseLocal.z) / mh) : 1;
  const curlAmp = (0.5 + 0.55 * Math.sin(0.42 * t + arm.ph)) * (1 + recoil * 1.6);

  for (let i = 0; i <= N; i++) {
    arm.P[i].copy(cP); arm.T[i].copy(cT); arm.U[i].copy(cU); arm.V[i].copy(cV);
    if (i === N) break;
    const s = i / N;
    // multi-harmonic travelling waves (curl about V, sideways about U, twist about T)
    const ku = -curlAmp * s * s * 3.4
      + 0.8 * Math.sin(TAU * 1.15 * s - 1.45 * t + arm.ph) * (0.3 + s)
      + 0.32 * Math.sin(TAU * 2.6 * s - 2.6 * t + arm.ph2) * s;
    const kv = 0.6 * Math.sin(TAU * 0.85 * s - 1.05 * t + arm.ph2) * (0.3 + s)
      + 0.22 * Math.sin(TAU * 2.2 * s - 2.1 * t + arm.ph * 1.3);
    const tw = 0.45 * Math.sin(0.8 * t + arm.ph + s * 3.0);
    _tm.copy(cV); rot(_tm, ku * ds);
    _tm.copy(cU); rot(_tm, kv * ds);
    _tm.copy(cT); rot(_tm, tw * ds);
    // buoyant droop and swim spread
    steer(DOWN, 0.3 * ds);
    steer(arm.out, (0.15 + 0.45 * spread) * (1 - s) * ds);
    // curiosity toward / recoil away from cursor
    if (Math.abs(mInf) > 0.01) {
      _dir.subVectors(mouseLocal, cP);
      const dist = _dir.length() + 1e-4;
      _dir.multiplyScalar(1 / dist);
      steer(_dir, mInf * 1.7 * facing * Math.pow(s, 1.2) * Math.exp(-dist * 0.18) * ds);
    }
    // local deflection from raycast poke / brushing
    if (Math.abs(arm.x) > 0.002) {
      const zz = (s - arm.pokeS) / 0.2;
      steer(arm.pokeDir, arm.x * 2.4 * Math.exp(-zz * zz) * ds);
    }
    cT.normalize();
    cU.addScaledVector(cT, -cU.dot(cT)).normalize();
    cV.crossVectors(cT, cU);
    cP.addScaledVector(cT, ds);
  }
}

function writeTube(arm, geo, RR, cs, sn, scale) {
  const pa = geo.attributes.position.array, na = geo.attributes.normal.array;
  let k = 0;
  for (let i = 0; i <= N; i++) {
    const P = arm.P[i], U = arm.U[i], V = arm.V[i], rr = arm.r[i] * scale;
    for (let j = 0; j <= RR; j++) {
      const c = cs[j], s = sn[j];
      const nx = U.x * c + V.x * s, ny = U.y * c + V.y * s, nz = U.z * c + V.z * s;
      pa[k] = P.x + nx * rr; pa[k + 1] = P.y + ny * rr; pa[k + 2] = P.z + nz * rr;
      na[k] = nx; na[k + 1] = ny; na[k + 2] = nz;
      k += 3;
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.normal.needsUpdate = true;
}

function armPointAt(arm, s, out) {
  const fi = s * N;
  let i0 = Math.floor(fi);
  if (i0 > N - 1) i0 = N - 1;
  return out.lerpVectors(arm.P[i0], arm.P[i0 + 1], fi - i0);
}

const CA = Math.cos(SUCK_ANG), SA = Math.sin(SUCK_ANG);
function updateSuckersAndSpecks() {
  let si = 0, pi = 0;
  for (const arm of arms) {
    for (const sk of arm.suckers) {
      const i0 = sk.i0, f = sk.f;
      _p.lerpVectors(arm.P[i0], arm.P[i0 + 1], f);
      const T = arm.T[i0], U = arm.U[i0], V = arm.V[i0];
      const rr = arm.r[i0] * (1 - f) + arm.r[i0 + 1] * f;
      _n.copy(U).multiplyScalar(-CA).addScaledVector(V, SA * sk.side);
      _z.crossVectors(T, _n);
      _m.makeBasis(T, _n, _z);
      const sz = rr * 0.5;
      _sc.set(sz, sz * 0.85, sz);
      _m.scale(_sc);
      _p.addScaledVector(_n, rr * 0.8);
      _m.setPosition(_p);
      suckerMesh.setMatrixAt(si++, _m);
    }
    for (const sp of arm.specks) {
      const i0 = sp.i0, f = sp.f;
      _p.lerpVectors(arm.P[i0], arm.P[i0 + 1], f);
      const U = arm.U[i0], V = arm.V[i0];
      const rr = arm.r[i0] * (1 - f) + arm.r[i0 + 1] * f;
      _n.copy(U).multiplyScalar(Math.cos(sp.ang)).addScaledVector(V, Math.sin(sp.ang));
      _p.addScaledVector(_n, rr * 0.98);
      const sz = rr * sp.size;
      _m.makeScale(sz, sz, sz).setPosition(_p);
      armSpeck.setMatrixAt(pi++, _m);
    }
  }
  suckerMesh.instanceMatrix.needsUpdate = true;
  armSpeck.instanceMatrix.needsUpdate = true;
}

function updateWeb() {
  let k = 0;
  for (let a = 0; a < NARMS; a++) {
    const A = arms[a], B = arms[(a + 1) % NARMS];
    for (let v = 0; v <= WV; v++) {
      const vv = v / WV;
      for (let u = 0; u <= WU; u++) {
        const uu = u / WU;
        const sm = SWEB * (1 - 0.5 * Math.sin(Math.PI * uu));
        const s = vv * sm;
        armPointAt(A, s, _pa);
        armPointAt(B, s, _pb);
        _p.lerpVectors(_pa, _pb, uu);
        const bow = Math.sin(Math.PI * uu) * vv;
        const hl = Math.hypot(_p.x, _p.z) + 1e-5;
        _p.x -= _p.x / hl * 0.1 * bow;
        _p.z -= _p.z / hl * 0.1 * bow;
        _p.y += 0.05 * bow;
        webPos[k++] = _p.x; webPos[k++] = _p.y; webPos[k++] = _p.z;
      }
    }
  }
  webGeo.attributes.position.needsUpdate = true;
  webGeo.computeVertexNormals();
}

function updateMantle() {
  const arr = mPosAttr.array;
  for (let i = 0; i < mCount; i++) {
    shapeAt(mDir[i * 3], mDir[i * 3 + 1], mDir[i * 3 + 2], _p);
    arr[i * 3] = _p.x; arr[i * 3 + 1] = _p.y; arr[i * 3 + 2] = _p.z;
  }
  mPosAttr.needsUpdate = true;
  mantleGeo.computeVertexNormals();
  mantleGeo.computeBoundingSphere();
  for (let i = 0; i < MS; i++) {
    shapeAt(mSpeckDir[i * 3], mSpeckDir[i * 3 + 1], mSpeckDir[i * 3 + 2], _p).multiplyScalar(1.004);
    const sz = mSpeckSize[i];
    _m.makeScale(sz, sz, sz).setPosition(_p);
    mSpeck.setMatrixAt(i, _m);
  }
  mSpeck.instanceMatrix.needsUpdate = true;
}

// ---------------------------------------------------------------- interaction
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const invM = new THREE.Matrix4();
const mouseWorld = new THREE.Vector3(), prevMouseWorld = new THREE.Vector3(), _hw = new THREE.Vector3(), _hp = new THREE.Vector3();
const plane = new THREE.Plane(), camDir = new THREE.Vector3(), pivot = new THREE.Vector3();
const localRay = new THREE.Vector3(), moveLocal = new THREE.Vector3(), _d = new THREE.Vector3();
let pointerInside = false, pointerMoved = false, pressingObject = false, hasMouse = false;
let controls = null;

function setNdc(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function poke(hit, strength, dirLocal) {
  const obj = hit.object;
  if (obj.userData.arm !== undefined) {
    const arm = arms[obj.userData.arm];
    const ring = Math.floor((hit.faceIndex || 0) / (2 * R));
    arm.pokeS = Math.min(0.95, Math.max(0.04, ring / N));
    arm.pokeDir.copy(dirLocal);
    arm.v += strength;
    return true;
  }
  _hp.copy(hit.point).applyMatrix4(invM).sub(MANTLE_C).normalize();
  wob.dir.copy(_hp);
  wob.v -= strength;
  return false;
}

canvas.addEventListener('pointermove', (e) => { setNdc(e); pointerInside = true; pointerMoved = true; });
canvas.addEventListener('pointerleave', () => { pointerInside = false; });
canvas.addEventListener('pointerdown', (e) => {
  setNdc(e);
  pointerInside = true;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) return;
  if (controls) controls.enabled = false;
  pressingObject = true;
  localRay.copy(raycaster.ray.direction).transformDirection(invM);
  const h = hits[0];
  if (h.object.userData.arm !== undefined) {
    poke(h, 5.5, localRay);
    const a = h.object.userData.arm;
    for (const nb of [(a + 1) % NARMS, (a + NARMS - 1) % NARMS]) {
      const arm = arms[nb];
      arm.pokeS = arms[a].pokeS;
      arm.pokeDir.copy(localRay);
      arm.v += 2.2;
    }
    recoil = Math.max(recoil, 0.7);
  } else {
    poke(h, 7, localRay);
    recoil = 1;
  }
  jetV += 1.2;
});
function releasePointer() {
  if (pressingObject) { if (controls) controls.enabled = true; pressingObject = false; }
}
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

// OrbitControls created after our pointerdown listener so object-grabs can suspend orbiting
controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.1, 0);
controls.minDistance = 3;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.92;
controls.update();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let leanX = 0, leanZ = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  time += dt;
  const t = time;

  const pulse = Math.sin(t * 0.85);
  breath = 0.035 * pulse;
  spread = 0.5 + 0.5 * pulse;

  // flinch jet spring
  jetV += (-5 * jetY - 2.2 * jetV) * dt;
  jetY += jetV * dt;

  // gentle lean toward the cursor
  const lzT = hasMouse ? THREE.MathUtils.clamp(-mouseWorld.x * 0.03, -0.12, 0.12) * Math.max(0, mInf) : 0;
  const lxT = hasMouse ? THREE.MathUtils.clamp((mouseWorld.y - 0.5) * -0.02, -0.08, 0.08) * Math.max(0, mInf) : 0;
  leanZ += (lzT - leanZ) * (1 - Math.exp(-dt * 2));
  leanX += (lxT - leanX) * (1 - Math.exp(-dt * 2));

  octo.position.set(0, 0.55 + 0.12 * Math.sin(0.7 * t) + 0.06 * pulse + jetY, 0);
  octo.rotation.set(0.07 * Math.sin(0.5 * t) + leanX, 0.25 * Math.sin(0.13 * t), 0.05 * Math.sin(0.37 * t) + leanZ);
  octo.updateMatrixWorld(true);
  invM.copy(octo.matrixWorld).invert();

  head.scale.set(0.52 * (1 + breath * 0.4), 0.36 * (1 - breath * 0.3), 0.5 * (1 + breath * 0.4));

  // cursor tracking and brushing
  if (pointerInside) {
    raycaster.setFromCamera(ndc, camera);
    camera.getWorldDirection(camDir);
    pivot.set(0, 0.4, 0).applyMatrix4(octo.matrixWorld);
    plane.setFromNormalAndCoplanarPoint(camDir, pivot);
    if (raycaster.ray.intersectPlane(plane, _hw)) {
      prevMouseWorld.copy(hasMouse ? mouseWorld : _hw);
      mouseWorld.copy(_hw);
      hasMouse = true;
    }
    if (pointerMoved) {
      pointerMoved = false;
      const moveLen = mouseWorld.distanceTo(prevMouseWorld);
      if (moveLen > 1e-4) {
        const hits = raycaster.intersectObjects(pickables, false);
        if (hits.length) {
          moveLocal.subVectors(mouseWorld, prevMouseWorld).transformDirection(invM);
          localRay.copy(raycaster.ray.direction).transformDirection(invM);
          _d.copy(moveLocal).addScaledVector(localRay, 0.35).normalize();
          const imp = Math.min(2.2, moveLen * 30);
          if (hits[0].object.userData.arm !== undefined) poke(hits[0], imp, _d);
          else poke(hits[0], imp * 0.6, _d);
        }
      }
    }
    mouseLocal.copy(mouseWorld).applyMatrix4(invM);
  }

  recoil *= Math.exp(-dt * 1.3);
  const mT = (pointerInside && hasMouse ? 1 : 0) - recoil * 2.6;
  mInf += (mT - mInf) * (1 - Math.exp(-dt * 3));

  // springs
  for (const arm of arms) {
    arm.v += (-38 * arm.x - 4.5 * arm.v) * dt;
    arm.x += arm.v * dt;
    if (arm.x > 0.85) { arm.x = 0.85; arm.v *= 0.5; } else if (arm.x < -0.85) { arm.x = -0.85; arm.v *= 0.5; }
  }
  wob.v += (-70 * wob.x - 5 * wob.v) * dt;
  wob.x += wob.v * dt;
  wob.x = THREE.MathUtils.clamp(wob.x, -1.2, 1.2);

  // tentacles
  for (const arm of arms) {
    updateArm(arm, t);
    writeTube(arm, arm.geo, R, cosR, sinR, 1);
    arm.geo.computeBoundingSphere();
    writeTube(arm, arm.cordGeo, RC, cosC, sinC, 0.16);
  }
  updateSuckersAndSpecks();
  updateWeb();
  updateMantle();

  coreLight.intensity = 3.2 + 0.8 * Math.sin(t * 1.7) + Math.abs(wob.x) * 2;
  coreMat.emissiveIntensity = 1.5 + 0.25 * Math.sin(t * 1.7);

  // contact shadow follows hover height
  const hgt = octo.position.y - floor.position.y;
  blobMat.opacity = THREE.MathUtils.clamp(0.75 - hgt * 0.12, 0.15, 0.6);
  const bs = 0.8 + hgt * 0.12;
  blob.scale.set(bs, bs, 1);

  // marine snow drift
  for (let i = 0; i < SN; i++) {
    let y = snowPos[i * 3 + 1] + snowSpd[i] * dt;
    if (y > 8) y -= 16;
    snowPos[i * 3 + 1] = y;
    snowPos[i * 3] += Math.sin(t * 0.3 + i) * 0.0015;
  }
  snowAttr.needsUpdate = true;

  domeMat.uniforms.time.value = t;

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
</script>
