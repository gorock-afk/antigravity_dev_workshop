<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// -----------------------------------------------------------------------------
// Deterministic PRNG & Smooth 3D Value Noise
// -----------------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(6062026);

function hash3(ix, iy, iz) {
  let n = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(iz, 1274126177);
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function noise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const uz = fz * fz * (3 - 2 * fz);

  const n000 = hash3(ix, iy, iz), n100 = hash3(ix + 1, iy, iz);
  const n010 = hash3(ix, iy + 1, iz), n110 = hash3(ix + 1, iy + 1, iz);
  const n001 = hash3(ix, iy, iz + 1), n101 = hash3(ix + 1, iy, iz + 1);
  const n011 = hash3(ix, iy + 1, iz + 1), n111 = hash3(ix + 1, iy + 1, iz + 1);

  const nx00 = n000 + (n100 - n000) * ux;
  const nx10 = n010 + (n110 - n010) * ux;
  const nx01 = n001 + (n101 - n001) * ux;
  const nx11 = n011 + (n111 - n011) * ux;
  const nxy0 = nx00 + (nx10 - nx00) * uy;
  const nxy1 = nx01 + (nx11 - nx01) * uy;
  return nxy0 + (nxy1 - nxy0) * uz;
}

function fbm3(x, y, z, octaves = 3) {
  let val = 0, amp = 0.5, freq = 1.0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    val += amp * noise3(x * freq, y * freq, z * freq);
    norm += amp;
    amp *= 0.5;
    freq *= 2.07;
  }
  return val / norm;
}

function smin(a, b, k) {
  const h = Math.max(k - Math.abs(a - b), 0.0) / k;
  return Math.min(a, b) - h * h * k * 0.25;
}

function sdEllipsoid(px, py, pz, cx, cy, cz, rx, ry, rz) {
  const dx = (px - cx) / rx;
  const dy = (py - cy) / ry;
  const dz = (pz - cz) / rz;
  const k0 = Math.hypot(dx, dy, dz);
  if (k0 < 1e-6) return -Math.min(rx, ry, rz);
  const k1 = Math.hypot(dx / rx, dy / ry, dz / rz);
  return (k0 * (k0 - 1.0)) / k1;
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
  return t * t * (3.0 - 2.0 * t);
}

// -----------------------------------------------------------------------------
// Renderer, Scene, Camera, OrbitControls
// -----------------------------------------------------------------------------
const canvas = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  60
);
camera.position.set(0.24, 1.98, 3.78);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.target.set(0.10, 1.44, 0.06);
controls.minDistance = 1.45;
controls.maxDistance = 8.5;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minPolarAngle = 0.15;
controls.update();

// -----------------------------------------------------------------------------
// Procedural Studio + Woodland Environment Map (PMREM) & Backdrop
// -----------------------------------------------------------------------------
function createEnvironment(rendererInstance) {
  const pmrem = new THREE.PMREMGenerator(rendererInstance);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  const skyGeo = new THREE.SphereGeometry(20, 48, 32);
  const pos = skyGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const cTop = new THREE.Color(0x526b7a);
  const cMid = new THREE.Color(0x2f3b36);
  const cBot = new THREE.Color(0x141210);
  const tmp = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const ny = pos.getY(i) / 20;
    if (ny >= 0) {
      tmp.copy(cMid).lerp(cTop, Math.pow(ny, 0.65));
    } else {
      tmp.copy(cMid).lerp(cBot, Math.pow(-ny, 0.55));
    }
    cols[i * 3] = tmp.r;
    cols[i * 3 + 1] = tmp.g;
    cols[i * 3 + 2] = tmp.b;
  }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({
    vertexColors: true,
    side: THREE.BackSide
  })));

  // Studio softbox reflection cards for sparkling eye & nose reflections
  const addLightPanel = (w, h, colorHex, intensity, px, py, pz) => {
    const col = new THREE.Color(colorHex).multiplyScalar(intensity);
    const panel = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })
    );
    panel.position.set(px, py, pz);
    panel.lookAt(0, 1.5, 0);
    envScene.add(panel);
  };

  addLightPanel(6.5, 5.0, 0xfff4e4, 3.6, -5.5, 7.5, 6.5);   // Warm key softbox
  addLightPanel(5.5, 4.5, 0xd4e8ff, 1.9, 6.5, 4.5, 5.0);    // Cool fill softbox
  addLightPanel(7.0, 3.5, 0xffc88a, 3.0, 1.5, 5.5, -7.5);   // Warm rim reflector
  addLightPanel(5.0, 3.0, 0x6b9e58, 1.0, -4.0, 2.5, -4.0);  // Forest canopy bounce

  const envRT = pmrem.fromScene(envScene, 0.035);
  pmrem.dispose();
  skyGeo.dispose();
  return envRT.texture;
}

scene.environment = createEnvironment(renderer);

// Subtle atmospheric studio dome
{
  const bgGeo = new THREE.SphereGeometry(28, 48, 32);
  const p = bgGeo.attributes.position;
  const bgCols = new Float32Array(p.count * 3);
  const cZenith = new THREE.Color(0x1c2524);
  const cHorizon = new THREE.Color(0x27312d);
  const cNadir = new THREE.Color(0x101413);
  const tc = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 28;
    const z = p.getZ(i) / 28;
    if (y >= 0) {
      tc.copy(cHorizon).lerp(cZenith, Math.pow(y, 0.7));
    } else {
      tc.copy(cHorizon).lerp(cNadir, Math.pow(-y, 0.45));
    }
    const glow = Math.max(0, -z * 0.5 + 0.5) * 0.035;
    bgCols[i * 3] = tc.r + glow;
    bgCols[i * 3 + 1] = tc.g + glow * 0.9;
    bgCols[i * 3 + 2] = tc.b + glow * 0.7;
  }
  bgGeo.setAttribute('color', new THREE.BufferAttribute(bgCols, 3));
  const bgDome = new THREE.Mesh(bgGeo, new THREE.MeshBasicMaterial({
    vertexColors: true,
    side: THREE.BackSide,
    depthWrite: false
  }));
  scene.add(bgDome);
}

// -----------------------------------------------------------------------------
// Studio Three-Point Lighting + Rim Backlight
// -----------------------------------------------------------------------------
const hemiLight = new THREE.HemisphereLight(0xdcebff, 0x3b2c20, 0.76);
hemiLight.position.set(0, 8, 0);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xfff1dc, 2.55);
keyLight.position.set(-2.9, 4.9, 3.8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1.0;
keyLight.shadow.camera.far = 12.0;
keyLight.shadow.camera.left = -2.25;
keyLight.shadow.camera.right = 2.45;
keyLight.shadow.camera.top = 2.55;
keyLight.shadow.camera.bottom = -1.35;
keyLight.shadow.bias = -0.00045;
keyLight.shadow.normalBias = 0.018;
keyLight.target.position.set(0.1, 1.3, 0.0);
scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0xc8e0ff, 0.92);
fillLight.position.set(3.8, 2.7, 2.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffcb90, 2.15);
rimLight.position.set(1.3, 3.5, -4.1);
scene.add(rimLight);

// Soft studio floor & radial contact shadow
{
  const floorGeo = new THREE.CircleGeometry(9.0, 64);
  floorGeo.rotateX(-Math.PI / 2);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x191f1d,
    roughness: 0.94,
    metalness: 0.0,
    envMapIntensity: 0.35
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.receiveShadow = true;
  scene.add(floor);

  // Soft elliptical ambient contact shadow directly beneath the mossy log
  const shCanvas = document.createElement('canvas');
  shCanvas.width = 256;
  shCanvas.height = 256;
  const ctx = shCanvas.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 12, 128, 128, 122);
  grad.addColorStop(0.0, 'rgba(5, 7, 6, 0.78)');
  grad.addColorStop(0.45, 'rgba(6, 8, 7, 0.45)');
  grad.addColorStop(0.78, 'rgba(6, 8, 7, 0.12)');
  grad.addColorStop(1.0, 'rgba(6, 8, 7, 0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);

  const shTex = new THREE.CanvasTexture(shCanvas);
  const contactPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(4.3, 2.1),
    new THREE.MeshBasicMaterial({
      map: shTex,
      transparent: true,
      depthWrite: false
    })
  );
  contactPlane.rotation.x = -Math.PI / 2;
  contactPlane.rotation.z = -0.06;
  contactPlane.position.set(0.02, 0.004, 0.05);
  scene.add(contactPlane);
}

// -----------------------------------------------------------------------------
// Mossy Woodland Log Segment + Shelf Fungi + 3D Moss Tufts
// -----------------------------------------------------------------------------
const LOG_CENTER_Y = 0.44;
const LOG_CENTER_Z = 0.04;
const LOG_RADIUS = 0.455;
const LOG_LENGTH = 2.98;

function createBarkTextures() {
  const w = 1024, h = 512;
  const colCanvas = document.createElement('canvas');
  colCanvas.width = w; colCanvas.height = h;
  const cCtx = colCanvas.getContext('2d');

  const bumpCanvas = document.createElement('canvas');
  bumpCanvas.width = w; bumpCanvas.height = h;
  const bCtx = bumpCanvas.getContext('2d');

  const cImg = cCtx.createImageData(w, h);
  const bImg = bCtx.createImageData(w, h);

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      const ridge = fbm3(u * 6.0, v * 28.0, 1.3, 4);
      const fissure = Math.pow(fbm3(u * 4.5 + 3.1, v * 36.0, 2.7, 3), 1.7);
      const detail = noise3(u * 28.0, v * 90.0, 5.2);
      const hVal = clamp(ridge * 0.68 + detail * 0.22 - fissure * 0.35 + 0.18, 0, 1);

      // Subtle mossy green tint in upper bark crevices
      const mossCrevice = smoothstep(0.32, 0.68, Math.sin(v * Math.PI)) * (1.0 - hVal) * 0.45;
      const r = clamp((42 + hVal * 58) * (1 - mossCrevice * 0.45) + mossCrevice * 38, 0, 255);
      const g = clamp((30 + hVal * 44) * (1 - mossCrevice * 0.2) + mossCrevice * 68, 0, 255);
      const b = clamp((23 + hVal * 32) * (1 - mossCrevice * 0.5) + mossCrevice * 24, 0, 255);

      const idx = (y * w + x) * 4;
      cImg.data[idx] = r;
      cImg.data[idx + 1] = g;
      cImg.data[idx + 2] = b;
      cImg.data[idx + 3] = 255;

      const bv = Math.floor(hVal * 255);
      bImg.data[idx] = bv;
      bImg.data[idx + 1] = bv;
      bImg.data[idx + 2] = bv;
      bImg.data[idx + 3] = 255;
    }
  }
  cCtx.putImageData(cImg, 0, 0);
  bCtx.putImageData(bImg, 0, 0);

  const map = new THREE.CanvasTexture(colCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;

  const bumpMap = new THREE.CanvasTexture(bumpCanvas);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;

  // Wood end-grain texture
  const ew = 512;
  const endCanvas = document.createElement('canvas');
  endCanvas.width = ew; endCanvas.height = ew;
  const eCtx = endCanvas.getContext('2d');
  const eImg = eCtx.createImageData(ew, ew);
  for (let y = 0; y < ew; y++) {
    for (let x = 0; x < ew; x++) {
      const dx = (x - 256) / 256;
      const dy = (y - 256) / 256;
      const rDist = Math.hypot(dx, dy) + fbm3(dx * 4, dy * 4, 8.1, 3) * 0.07;
      const angle = Math.atan2(dy, dx);
      const rings = 0.5 + 0.5 * Math.sin(rDist * 78.0 + noise3(dx * 8, dy * 8, 1.1) * 2.5);
      const crack = Math.pow(Math.max(0, Math.sin(angle * 7.0 + 0.8)), 24.0) * smoothstep(0.15, 0.7, rDist);
      const heartwood = 1.0 - smoothstep(0.45, 0.75, rDist);
      const barkEdge = smoothstep(0.86, 0.95, rDist);

      let cr = 148 - heartwood * 34 - rings * 22 - crack * 55;
      let cg = 108 - heartwood * 28 - rings * 18 - crack * 42;
      let cb = 72 - heartwood * 20 - rings * 13 - crack * 30;
      cr = cr * (1 - barkEdge) + 48 * barkEdge;
      cg = cg * (1 - barkEdge) + 35 * barkEdge;
      cb = cb * (1 - barkEdge) + 26 * barkEdge;

      const idx = (y * ew + x) * 4;
      eImg.data[idx] = clamp(cr, 0, 255);
      eImg.data[idx + 1] = clamp(cg, 0, 255);
      eImg.data[idx + 2] = clamp(cb, 0, 255);
      eImg.data[idx + 3] = 255;
    }
  }
  eCtx.putImageData(eImg, 0, 0);
  const endMap = new THREE.CanvasTexture(endCanvas);
  endMap.colorSpace = THREE.SRGBColorSpace;

  return { map, bumpMap, endMap };
}

function logSurfacePoint(x, theta) {
  const arch = Math.sin(((x + LOG_LENGTH * 0.5) / LOG_LENGTH) * Math.PI) * 0.025;
  const ridge = (fbm3(x * 2.3 + 4.0, Math.cos(theta) * 2.2, Math.sin(theta) * 2.2, 3) - 0.5) * 0.055;
  const knotDx = x + 0.78;
  const knotDTheta = theta - 0.55;
  const knot = Math.exp(-(knotDx * knotDx * 14.0 + knotDTheta * knotDTheta * 7.0)) * 0.055;
  const r = LOG_RADIUS + ridge + knot;

  let py = LOG_CENTER_Y + arch + Math.sin(theta) * r;
  const pz = LOG_CENTER_Z + Math.cos(theta) * r;
  if (py < 0.005) py = 0.005;
  return new THREE.Vector3(x, py, pz);
}

const logGroup = new THREE.Group();
scene.add(logGroup);

{
  const { map, bumpMap, endMap } = createBarkTextures();
  const barkMat = new THREE.MeshStandardMaterial({
    map,
    bumpMap,
    bumpScale: 0.032,
    roughness: 0.89,
    metalness: 0.01
  });
  const endMat = new THREE.MeshStandardMaterial({
    map: endMap,
    bumpMap: endMap,
    bumpScale: 0.015,
    roughness: 0.84,
    metalness: 0.0
  });

  // Sculpted cylinder tube + end caps
  const segX = 72, segR = 72;
  const tubeGeo = new THREE.BufferGeometry();
  const verts = [];
  const uvs = [];
  const cols = [];
  const indices = [];

  for (let ix = 0; ix <= segX; ix++) {
    const u = ix / segX;
    const x = (u - 0.5) * LOG_LENGTH;
    for (let ir = 0; ir <= segR; ir++) {
      const v = ir / segR;
      const theta = v * Math.PI * 2;
      const p = logSurfacePoint(x, theta);
      verts.push(p.x, p.y, p.z);
      uvs.push(u * 1.4, v * 2.0);

      // Subtle contact AO under the seated baby Red Panda & underside of log
      const seatDist = Math.hypot((x + 0.06) / 0.44, (p.z - 0.02) / 0.42);
      const seatAO = p.y > 0.72 ? 1.0 - 0.32 * Math.max(0, 1.0 - seatDist) : 1.0;
      const bottomAO = 0.65 + 0.35 * smoothstep(0.02, 0.45, p.y);
      const shade = seatAO * bottomAO;
      cols.push(shade, shade, shade);
    }
  }
  for (let ix = 0; ix < segX; ix++) {
    for (let ir = 0; ir < segR; ir++) {
      const a = ix * (segR + 1) + ir;
      const b = a + (segR + 1);
      const c = b + 1;
      const d = a + 1;
      indices.push(a, d, b, b, d, c);
    }
  }
  tubeGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  tubeGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  tubeGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  tubeGeo.setIndex(indices);
  tubeGeo.computeVertexNormals();
  barkMat.vertexColors = true;

  const logMesh = new THREE.Mesh(tubeGeo, barkMat);
  logMesh.castShadow = true;
  logMesh.receiveShadow = true;
  logGroup.add(logMesh);

  // Left & Right cut wood end caps
  for (const side of [-1, 1]) {
    const xEnd = side * LOG_LENGTH * 0.5;
    const capGeo = new THREE.BufferGeometry();
    const cVerts = [xEnd + side * 0.008, LOG_CENTER_Y + 0.01, LOG_CENTER_Z];
    const cUVs = [0.5, 0.5];
    const cIdx = [];
    for (let ir = 0; ir <= segR; ir++) {
      const theta = (ir / segR) * Math.PI * 2;
      const p = logSurfacePoint(xEnd, theta);
      cVerts.push(p.x, p.y, p.z);
      cUVs.push(0.5 + 0.47 * Math.cos(theta), 0.5 + 0.47 * Math.sin(theta));
    }
    for (let ir = 1; ir <= segR; ir++) {
      if (side > 0) cIdx.push(0, ir + 1, ir);
      else cIdx.push(0, ir, ir + 1);
    }
    capGeo.setAttribute('position', new THREE.Float32BufferAttribute(cVerts, 3));
    capGeo.setAttribute('uv', new THREE.Float32BufferAttribute(cUVs, 2));
    capGeo.setIndex(cIdx);
    capGeo.computeVertexNormals();
    const capMesh = new THREE.Mesh(capGeo, endMat);
    capMesh.castShadow = true;
    capMesh.receiveShadow = true;
    logGroup.add(capMesh);
  }

  // Velvety 3D moss cushions + 5,500 individual 3D moss shoots on the log
  const mossBaseMat = new THREE.MeshStandardMaterial({
    color: 0x3b6326,
    roughness: 0.92,
    metalness: 0.0
  });

  const mossPatches = [
    { cx: -0.92, th: 1.42, sx: 0.36, sth: 0.55 },
    { cx: -0.45, th: 1.62, sx: 0.30, sth: 0.48 },
    { cx: -0.02, th: 1.54, sx: 0.38, sth: 0.52 },
    { cx: 0.52, th: 1.48, sx: 0.42, sth: 0.58 },
    { cx: 1.02, th: 1.32, sx: 0.32, sth: 0.48 },
    { cx: -0.68, th: 0.85, sx: 0.22, sth: 0.35 },
    { cx: 0.78, th: 0.82, sx: 0.25, sth: 0.36 }
  ];

  const mossDensity = (x, theta) => {
    let d = 0;
    for (const mp of mossPatches) {
      let dt = theta - mp.th;
      while (dt > Math.PI) dt -= Math.PI * 2;
      while (dt < -Math.PI) dt += Math.PI * 2;
      const q = (x - mp.cx) * (x - mp.cx) / (mp.sx * mp.sx) + (dt * dt) / (mp.sth * mp.sth);
      if (q < 1.3) {
        d = Math.max(d, (1.3 - q) / 1.3);
      }
    }
    const n = fbm3(x * 4.5 + 1.7, Math.cos(theta) * 3.8, Math.sin(theta) * 3.8, 3);
    return clamp(d * 1.15 + (n - 0.52) * 0.55, 0, 1);
  };

  // Sculpted moss cushion skin over log top
  const mSegX = 64, mSegT = 36;
  const mGeo = new THREE.BufferGeometry();
  const mVerts = [], mCols = [], mIndices = [];
  for (let ix = 0; ix <= mSegX; ix++) {
    const x = ((ix / mSegX) - 0.5) * (LOG_LENGTH - 0.14);
    for (let it = 0; it <= mSegT; it++) {
      const theta = 0.35 + (it / mSegT) * 2.35;
      const dens = mossDensity(x, theta);
      const lift = dens > 0.16 ? (dens - 0.16) * 0.042 : -0.022;
      const baseP = logSurfacePoint(x, theta);
      const nx = 0, ny = Math.sin(theta), nz = Math.cos(theta);
      mVerts.push(baseP.x + nx * lift, baseP.y + ny * lift, baseP.z + nz * lift);
      const cMix = fbm3(x * 7.0, ny * 6.0, nz * 6.0, 2);
      const seatShade = 1.0 - 0.35 * Math.max(0, 1.0 - Math.hypot((x + 0.06) / 0.42, (baseP.z - 0.02) / 0.40));
      mCols.push(
        (0.18 + cMix * 0.18) * seatShade,
        (0.34 + cMix * 0.25) * seatShade,
        (0.10 + cMix * 0.09) * seatShade
      );
    }
  }
  for (let ix = 0; ix < mSegX; ix++) {

function createBambooLeafGeometry(length = 0.22, width = 0.044, arch = 0.038) {
  const segL = 12, segW = 4;
  const geo = new THREE.BufferGeometry();
  const pos = [];
  const cols = [];
  const idx = [];

  for (let i = 0; i <= segL; i++) {
    const u = i / segL;
    // Tapered lanceolate bamboo leaf profile
    const profile = Math.sin(Math.pow(u, 0.68) * Math.PI) * (1.0 - 0.18 * u);
    const halfW = width * 0.5 * profile;
    const zPos = u * length;
    const yArch = Math.sin(u * Math.PI * 0.82) * arch - u * u * arch * 1.45;

    for (let j = 0; j <= segW; j++) {
      const v = (j / segW) * 2.0 - 1.0; // -1..1
      const xPos = v * halfW;
      // Slight V-fold along central midrib vein
      const vFold = Math.abs(v) * 0.0055 * profile;
      pos.push(xPos, yArch + vFold, zPos);

      const midrib = 1.0 - Math.min(1.0, Math.abs(v) * 3.8);
      const tipWarm = u * 0.12;
      cols.push(
        0.22 + midrib * 0.16 + tipWarm,
        0.58 + midrib * 0.16 + u * 0.08,
        0.16 + midrib * 0.10
      );
    }
  }
  for (let i = 0; i < segL; i++) {
    for (let j = 0; j < segW; j++) {
      const a = i * (segW + 1) + j;
      const b = a + (segW + 1);
      const c = b + 1;
      const d = a + 1;
      idx.push(a, b, d, b, c, d);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

// Head SDF in skull-centered coordinates (skull center is (0, 0.16, 0.03) inside Head station 4)
function headSDF(x, y, z) {
  const cranium = sdEllipsoid(x, y, z, 0.0, 0.02, -0.02, 0.425, 0.375, 0.395);
  const cheekL = sdEllipsoid(x, y, z, 0.295, -0.105, 0.055, 0.235, 0.195, 0.215);
  const cheekR = sdEllipsoid(x, y, z, -0.295, -0.105, 0.055, 0.235, 0.195, 0.215);
  const snout = sdEllipsoid(x, y, z, 0.0, -0.095, 0.335, 0.168, 0.132, 0.175);
  const browL = sdEllipsoid(x, y, z, 0.135, 0.115, 0.295, 0.115, 0.082, 0.105);
  const browR = sdEllipsoid(x, y, z, -0.135, 0.115, 0.295, 0.115, 0.082, 0.105);

  let d = smin(cranium, cheekL, 0.125);
  d = smin(d, cheekR, 0.125);
  d = smin(d, snout, 0.095);
  d = smin(d, browL, 0.085);
  d = smin(d, browR, 0.085);
  return d;
}

function headGrad(x, y, z) {
  const e = 0.0025;
  const gx = headSDF(x + e, y, z) - headSDF(x - e, y, z);
  const gy = headSDF(x, y + e, z) - headSDF(x, y - e, z);
  const gz = headSDF(x, y, z + e) - headSDF(x, y, z - e);
  const len = Math.hypot(gx, gy, gz) || 1;
  return [gx / len, gy / len, gz / len];
}

function raycastHeadSDF(dx, dy, dz) {
  const len = Math.hypot(dx, dy, dz) || 1;
  const rx = dx / len, ry = dy / len, rz = dz / len;
  const cx = 0.0, cy = -0.03, cz = 0.05;
  let lo = 0.04, hi = 0.85;
  for (let i = 0; i < 16; i++) {
    const mid = 0.5 * (lo + hi);
    if (headSDF(cx + rx * mid, cy + ry * mid, cz + rz * mid) < 0) lo = mid;
    else hi = mid;
  }
  const t = 0.5 * (lo + hi);
  return [cx + rx * t, cy + ry * t, cz + rz * t];
}

// Torso SDF in world rest coordinates
function torsoSDF(x, y, z) {
  const rump = sdEllipsoid(x, y, z, -0.06, 1.13, -0.02, 0.435, 0.345, 0.415);
  const belly = sdEllipsoid(x, y, z, -0.05, 1.39, 0.025, 0.385, 0.325, 0.355);
  const chest = sdEllipsoid(x, y, z, -0.04, 1.61, 0.055, 0.315, 0.255, 0.295);
  const neck = sdEllipsoid(x, y, z, -0.03, 1.79, 0.075, 0.245, 0.185, 0.235);
  const thighL = sdEllipsoid(x, y, z, 0.23, 1.07, 0.13, 0.215, 0.195, 0.245);
  const thighR = sdEllipsoid(x, y, z, -0.33, 1.07, 0.10, 0.215, 0.195, 0.245);

  let d = smin(rump, belly, 0.12);
  d = smin(d, chest, 0.11);
  d = smin(d, neck, 0.10);
  d = smin(d, thighL, 0.11);
  d = smin(d, thighR, 0.11);
  return d;
}

function torsoGrad(x, y, z) {
  const e = 0.0025;
  const gx = torsoSDF(x + e, y, z) - torsoSDF(x - e, y, z);
  const gy = torsoSDF(x, y + e, z) - torsoSDF(x, y - e, z);
  const gz = torsoSDF(x, y, z + e) - torsoSDF(x, y, z - e);
  const len = Math.hypot(gx, gy, gz) || 1;
  return [gx / len, gy / len, gz / len];
}

function raycastTorsoFromSpine(y, dirX, dirY, dirZ) {
  const u = clamp((y - 0.90) / (1.86 - 0.90), 0, 1);
  const sx = -0.06 + 0.03 * u;
  const sy = clamp(y, 0.96, 1.82);
  const sz = -0.02 + 0.095 * u;
  const len = Math.hypot(dirX, dirY, dirZ) || 1;
  const rx = dirX / len, ry = dirY / len, rz = dirZ / len;
  let lo = 0.03, hi = 0.85;
  for (let i = 0; i < 16; i++) {
    const mid = 0.5 * (lo + hi);
    if (torsoSDF(sx + rx * mid, sy + ry * mid, sz + rz * mid) < 0) lo = mid;
    else hi = mid;
  }
  const t = 0.5 * (lo + hi);
  return [sx + rx * t, sy + ry * t, sz + rz * t];
}

const COL_RUST_DARK = new THREE.Color(0x9b2e0e);

const EYE_R_SKULL = [-EYE_L_SKULL[0], EYE_L_SKULL[1], EYE_L_SKULL[2]];

function getHeadFurColor(sx, sy, sz, jitter, outColor) {
  const n = (fbm3(sx * 9.0, sy * 9.0, sz * 9.0, 2) - 0.5) * 0.032 + jitter * 0.015;
  const ax = Math.abs(sx);

  // 1. Bright white muzzle surrounding shiny black nose
  const dMuzzle = Math.hypot(ax / 0.168, (sy + 0.112) / 0.136, (sz - 0.355) / 0.195) + n;
  // 2. Distinct bright white eyebrow patches above eyes
  const bx = ax - 0.132, by = sy - 0.146;
  const bu = bx * 0.93 - by * 0.36;
  const bv = bx * 0.36 + by * 0.93;
  const dBrow = (sz > 0.16) ? Math.hypot(bu / 0.084, bv / 0.056, (sz - 0.325) / 0.135) + n : 9.0;

  // 3. Dark mahogany-rust tear-streak curving down from inner-lower eye
  const tearCenterX = 0.152 + Math.max(0, 0.032 - sy) * 0.24;
  const inTearBand = (sz > 0.18 && sy < 0.035 && sy > -0.235 && dMuzzle > 0.94)
    ? Math.abs(ax - tearCenterX) + n * 0.55
    : 9.0;

  // 4. Bright white tear-border crescent + expansive fluffy white cheek patches
  const dUnderEye = (sz > 0.16)
    ? Math.hypot((ax - 0.215) / 0.078, (sy + 0.025) / 0.058, (sz - 0.305) / 0.13) + n
    : 9.0;
  const dCheekWhite = (ax > tearCenterX + 0.028 && sz > -0.07)
    ? Math.hypot((ax - 0.335) / 0.215, (sy + 0.118) / 0.152, (sz - 0.11) / 0.215) + n
    : 9.0;

  const whiteMask = Math.max(
    1.0 - smoothstep(0.86, 1.04, dMuzzle),
    1.0 - smoothstep(0.82, 1.03, dBrow),
    1.0 - smoothstep(0.82, 1.03, dUnderEye),
    1.0 - smoothstep(0.80, 1.04, dCheekWhite)
  );

  // Base rich rust / cinnamon-red head coat
  const crownShade = smoothstep(-0.15, 0.32, sy) * 0.4 + smoothstep(0.28, -0.25, sz) * 0.35;
  outColor.copy(COL_RUST_BRIGHT).lerp(COL_RUST_MID, 0.45 + jitter * 0.25);
  outColor.lerp(COL_RUST_DARK, clamp(crownShade * 0.55, 0, 0.65));

  // Apply mahogany tear-track channel
  const tearMask = (1.0 - smoothstep(0.026, 0.046, inTearBand)) * (1.0 - whiteMask * 0.6);
  if (tearMask > 0.001) {
    outColor.lerp(COL_TEAR_TRACK, tearMask * 0.92);
  }

  // Apply crisp bright white markings
  if (whiteMask > 0.001) {
    outColor.lerp(COL_WHITE, whiteMask);
  }

  // Slight organic per-strand tonal shimmer
  outColor.offsetHSL(jitter * 0.008, jitter * 0.03, jitter * 0.035);
  return outColor;
}

function getTorsoFurColor(wx, wy, wz, jitter, outColor) {
  const n = (fbm3(wx * 6.5, wy * 6.5, wz * 6.5, 2) - 0.5) * 0.08 + jitter * 0.025;
  // Dark chocolate-black chest & belly on the front/underside, rich rust/cinnamon on back, nape & flanks
  const uSpine = clamp((wy - 0.95) / 0.85, 0, 1);
  const spineZ = -0.02 + 0.095 * uSpine;
  const dz = wz - spineZ;
  const ax = Math.abs(wx + 0.05);

  // Belly/chest dark zone on front (+Z) and lower flank/thighs
  const bellyFront = smoothstep(0.04, 0.21, dz + n) * (1.0 - smoothstep(1.64, 1.79, wy));
  const lowerLegZone = (1.0 - smoothstep(1.06, 1.24, wy + n * 0.5)) * smoothstep(-0.08, 0.12, dz);
  const shoulderDark = smoothstep(0.18, 0.31, ax) * smoothstep(1.38, 1.58, wy) * smoothstep(-0.02, 0.14, dz);
  const darkMask = clamp(Math.max(bellyFront, lowerLegZone, shoulderDark), 0, 1);

  // Rich rust/cinnamon dorsal & flank coat
  const dorsalRichness = smoothstep(0.05, -0.28, dz);
  outColor.copy(COL_RUST_MID).lerp(COL_RUST_BRIGHT, 0.38 + (1.0 - dorsalRichness) * 0.35);
  outColor.lerp(COL_RUST_DARK, dorsalRichness * 0.48);

  if (darkMask > 0.001) {
    const choco = outColor.clone().copy(COL_CHOCO_DARK).lerp(COL_CHOCO_TIP, 0.35 + jitter * 0.35);
    outColor.lerp(choco, darkMask);
  }
  outColor.offsetHSL(jitter * 0.008, 0, jitter * 0.03);
  return outColor;
}

// 6 alternating rust-red and cream-white rings along the huge bushy tail + dark russet tip
function getTailFurColor(u, jitter, outColor) {
  const uj = clamp(u + jitter * 0.015, 0.0, 1.0);
  // Tip cap at u in [0.925, 1.0] -> deep russet-chocolate
  const tipMask = smoothstep(0.915, 0.955, uj);

  // 6 complete alternating rust-red and cream-white rings across [0.0, 0.925]
  const ringCoord = (uj / 0.925) * 6.0;
  const wave = Math.cos(ringCoord * Math.PI * 2.0); // +1 rust, -1 cream-white (6 cycles)
  const creamMask = smoothstep(0.12, -0.18, wave);

  outColor.copy(COL_RUST_MID).lerp(COL_RUST_BRIGHT, 0.35 + jitter * 0.25);
  outColor.lerp(COL_RUST_DARK, 0.22);
  if (creamMask > 0.001) {
    outColor.lerp(COL_CREAM_RING, creamMask * 0.94);
  }
  if (tipMask > 0.001) {
    outColor.lerp(COL_EAR_BACK, tipMask * 0.88);
  }
  outColor.offsetHSL(jitter * 0.006, 0, jitter * 0.032);
  return outColor;
}

];

const tailAnimCtrl = TAIL_REST_CTRL.map((v) => v.clone());
const tailCurve = new THREE.CatmullRomCurve3(tailAnimCtrl);

function computeTailStationFrames(curve, outPositions, outNormals, outBinormals, outTangents) {
  let prevUp = new THREE.Vector3(0, 1, 0);
  for (let k = 0; k < TAIL_STATIONS; k++) {
    const u = k / (TAIL_STATIONS - 1);
    const pt = curve.getPointAt(u, outPositions[k]);
    const tan = curve.getTangentAt(u, outTangents[k]).normalize();

    const up = outNormals[k].copy(prevUp).addScaledVector(tan, -prevUp.dot(tan));
    if (up.lengthSq() < 1e-6) up.set(0, 1, 0);
    up.normalize();
    prevUp.copy(up);

    outBinormals[k].crossVectors(up, tan).normalize();
    void pt;
  }
}

const tailPosArr = Array.from({ length: TAIL_STATIONS }, () => new THREE.Vector3());
const tailUpArr = Array.from({ length: TAIL_STATIONS }, () => new THREE.Vector3());
const tailSideArr = Array.from({ length: TAIL_STATIONS }, () => new THREE.Vector3());
const tailTanArr = Array.from({ length: TAIL_STATIONS }, () => new THREE.Vector3());

// Initialize rest station matrices
{
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const eul = new THREE.Euler();
  const one = new THREE.Vector3(1, 1, 1);

  stationRestMats[0].makeTranslation(-0.06, 1.12, -0.02);
  stationRestMats[1].makeTranslation(-0.05, 1.38, 0.02);
  stationRestMats[2].makeTranslation(-0.04, 1.60, 0.05);
  stationRestMats[3].makeTranslation(-0.03, 1.75, 0.07);
  stationRestMats[4].makeTranslation(HEAD_PIVOT_REST.x, HEAD_PIVOT_REST.y, HEAD_PIVOT_REST.z);

  m.makeTranslation(JAW_LOCAL_PIVOT.x, JAW_LOCAL_PIVOT.y, JAW_LOCAL_PIVOT.z);
  stationRestMats[5].multiplyMatrices(stationRestMats[4], m);

  eul.set(0.14, 0.12, -0.50);
  q.setFromEuler(eul);
  m.compose(EAR_L_LOCAL_PIVOT, q, one);
  stationRestMats[6].multiplyMatrices(stationRestMats[4], m);

  eul.set(0.14, -0.12, 0.50);
  q.setFromEuler(eul);
  m.compose(EAR_R_LOCAL_PIVOT, q, one);
  stationRestMats[7].multiplyMatrices(stationRestMats[4], m);

  for (const key of Object.keys(LIMBS)) {
    const limb = LIMBS[key];
    const dir = new THREE.Vector3().subVectors(limb.b, limb.a).normalize();
    q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    stationRestMats[limb.station].compose(limb.a, q, one);
  }

  computeTailStationFrames(tailCurve, tailPosArr, tailUpArr, tailSideArr, tailTanArr);
  for (let k = 0; k < TAIL_STATIONS; k++) {
    stationRestMats[14 + k].makeBasis(tailSideArr[k], tailUpArr[k], tailTanArr[k]);
    stationRestMats[14 + k].setPosition(tailPosArr[k]);
  }

  for (let s = 0; s < STATION_COUNT; s++) {
    stationRestInvMats[s].copy(stationRestMats[s]).invert();
    stationRestMats[s].toArray(stationMats, s * 16);
  }
}

function buildEarShell(stationIdx) {
  const earGroup = new THREE.Group();
  earGroup.matrixAutoUpdate = false;
  earGroup.matrix.copy(stationRestMats[stationIdx]);
  scene.add(earGroup);
  dynamicStationMeshes.push({ mesh: earGroup, station: stationIdx });

  const segU = 18, segV = 16;
  const geo = new THREE.BufferGeometry();
  const pos = [], cols = [], idx = [];

  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV; // 0 base -> 1 rounded tip
    const widthProfile = Math.sin(Math.pow(v, 0.55) * Math.PI * 0.92) * 0.135 + (1 - v) * 0.055;
    const y = v * 0.255;
    for (let iu = 0; iu <= segU; iu++) {
      const th = (iu / segU) * Math.PI * 2;
      const cs = Math.cos(th), sn = Math.sin(th);
      const x = cs * widthProfile;
      // Cupped concave front (+Z), convex back (-Z)
      let z = sn * 0.036 * (1.0 - v * 0.45);
      if (sn > 0) z = -sn * 0.016 * (1.0 - v * 0.6) + 0.012;
      pos.push(x, y, z);

      const isRim = Math.abs(cs) > 0.72 || v > 0.82;
      if (isRim || sn > 0.15) {
        cols.push(0.75, 0.70, 0.66);
      } else {
        cols.push(0.16, 0.08, 0.06);
      }
    }
  }
  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * (segU + 1) + iu;
      const b = a + (segU + 1);
      const c = b + 1;
      const d = a + 1;
      idx.push(a, d, b, b, d, c);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const earMesh = new THREE.Mesh(geo, undercoatMat);
  earMesh.castShadow = true;
  earMesh.receiveShadow = true;
  earGroup.add(earMesh);

  addStationCollider(new THREE.SphereGeometry(0.18, 12, 10), stationIdx, new THREE.Vector3(0, 0.13, 0));
}

    scene.add(lGroup);
    dynamicStationMeshes.push({ mesh: lGroup, station: limb.station });

    const lMesh = new THREE.Mesh(lGeo, undercoatMat);
    lMesh.castShadow = true;
    lMesh.receiveShadow = true;
    lGroup.add(lMesh);

    addStationCollider(
      new THREE.SphereGeometry(Math.max(limb.r0, limb.r1) + 0.075, 12, 10),
      limb.station,
      new THREE.Vector3(0, len * 0.55, 0)
    );

    // Add paw toes & tiny curved ivory claws on distal limbs (9, 11, 12, 13)
    const isFrontPaw = (limb.station === 9 || limb.station === 11);
    const isHindFoot = (limb.station === 12 || limb.station === 13);
    if (isFrontPaw || isHindFoot) {
      const pawGroup = new THREE.Group();
      pawGroup.position.set(0, len, 0);

      for (let t = 0; t < 4; t++) {
        const spread = (t - 1.5) * 0.028;
        const toe = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 8), padMat);
        toe.scale.set(0.95, 1.25, 1.05);
        if (isFrontPaw) {
          const sign = limb.station === 9 ? -1 : 1;
          toe.position.set(sign * 0.022, 0.015 + t * 0.014, spread * 0.7);
          const claw = new THREE.Mesh(new THREE.ConeGeometry(0.0075, 0.028, 7), clawMat);
          claw.position.set(sign * 0.042, 0.015 + t * 0.014, spread * 0.7);
          claw.rotation.z = -sign * Math.PI * 0.42;
          pawGroup.add(claw);
        } else {
          // Pigeon-toed chunky hind feet resting on log
          const inward = limb.station === 12 ? -0.24 : 0.24;
          toe.position.set(spread + inward * 0.05, 0.022, 0.015);
          const claw = new THREE.Mesh(new THREE.ConeGeometry(0.008, 0.030, 7), clawMat);
          claw.position.set(spread + inward * 0.06, 0.046, 0.012);
          claw.rotation.x = 0.25;
          pawGroup.add(claw);
        }
        pawGroup.add(toe);
      }
      lGroup.add(pawGroup);
    }
  }
}

function tailCoreRadius(u) {
  const swell = 0.105 + 0.052 * Math.sin(Math.pow(u, 0.72) * Math.PI * 0.88);
  const tipRound = u > 0.88 ? Math.sqrt(Math.max(0, 1.0 - Math.pow((u - 0.88) / 0.12, 2))) : 1.0;
  return swell * tipRound;
}

function updateTailTubeGeometry() {
  for (let k = 0; k < TAIL_STATIONS; k++) {
    const u = k / (TAIL_STATIONS - 1);
    const r = tailCoreRadius(u);
    const P = tailPosArr[k];
    const U = tailUpArr[k];
    const S = tailSideArr[k];
    for (let j = 0; j <= TAIL_TUBE_RAD_SEGS; j++) {
      const th = (j / TAIL_TUBE_RAD_SEGS) * Math.PI * 2;
      const cs = Math.cos(th), sn = Math.sin(th);
      const vi = (k * (TAIL_TUBE_RAD_SEGS + 1) + j) * 3;
      tailTubePos[vi]     = P.x + (S.x * cs + U.x * sn) * r;
      tailTubePos[vi + 1] = P.y + (S.y * cs + U.y * sn) * r;
      tailTubePos[vi + 2] = P.z + (S.z * cs + U.z * sn) * r;
    }
  }
  tailTubeGeo.attributes.position.needsUpdate = true;
  tailTubeGeo.computeVertexNormals();
}
updateTailTubeGeometry();

// -----------------------------------------------------------------------------
// 36,000+ Individual 3D Fur Strands via Unified InstancedMesh
// -----------------------------------------------------------------------------
function createFurStrandGeometry() {
  // Curved, tapered 3-sided plush 3D hair tuft with root-to-tip AO vertex color gradient
  const sides = 3;
  const segs = 3;
  const geo = new THREE.BufferGeometry();
  const pos = [];
  const nrm = [];
  const col = [];
  const idx = [];

  for (let iy = 0; iy <= segs; iy++) {
    const t = iy / segs; // 0 root -> 1 tip
    const y = t;
    const zCurve = 0.17 * t * t;
    const rad = (1.0 - Math.pow(t, 0.82)) * 1.0;

    // Root-to-tip self-occlusion & soft tip sheen (multiplies with instanceColor!)
    const ao = 0.50 + 0.62 * Math.pow(t, 0.72);

    if (iy === segs) {
      pos.push(0, y, zCurve);
      nrm.push(0, 0.92, 0.39);
      col.push(ao * 1.03, ao * 1.01, ao * 0.99);
    } else {
      for (let is = 0; is < sides; is++) {
        const th = (is / sides) * Math.PI * 2 + t * 0.22;
        const cs = Math.cos(th), sn = Math.sin(th);
        pos.push(cs * rad, y, zCurve + sn * rad * 0.75);
        // Plush mammal normal softening (blend radial normal with upward tip normal)
        const nx = cs * 0.72, ny = 0.58, nz = sn * 0.55;
        const nl = Math.hypot(nx, ny, nz);
        nrm.push(nx / nl, ny / nl, nz / nl);
        col.push(ao, ao * 0.985, ao * 0.97);
      }
    }
  }

  for (let iy = 0; iy < segs - 1; iy++) {
    const r0 = iy * sides;
    const r1 = (iy + 1) * sides;
    for (let is = 0; is < sides; is++) {
      const isN = (is + 1) % sides;
      idx.push(r0 + is, r0 + isN, r1 + is);
      idx.push(r0 + isN, r1 + isN, r1 + is);
    }
  }
  const lastRing = (segs - 1) * sides;
  const tipIdx = segs * sides;
  for (let is = 0; is < sides; is++) {
    const isN = (is + 1) % sides;
    idx.push(lastRing + is, lastRing + isN, tipIdx);
  }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  return geo;
}

const MAX_FUR = 36000;
const furStation = new Uint8Array(MAX_FUR);
// Local position & orthonormal hair basis in station space
const furLocPos = new Float32Array(MAX_FUR * 3);
const furLocDir = new Float32Array(MAX_FUR * 3);
const furLocBend = new Float32Array(MAX_FUR * 3);
const furLen = new Float32Array(MAX_FUR);
const furRad = new Float32Array(MAX_FUR);
const furPhase = new Float32Array(MAX_FUR);
// Interactive spring deflection state in world space
const furDef = new Float32Array(MAX_FUR * 3);
const furVel = new Float32Array(MAX_FUR * 3);
const furActive = new Uint8Array(MAX_FUR);

const furGeo = createFurStrandGeometry();
const furMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 0.76,
  metalness: 0.02,
  envMapIntensity: 0.65
});

const furMesh = new THREE.InstancedMesh(furGeo, furMat, MAX_FUR);
furMesh.castShadow = true;
furMesh.receiveShadow = true;
furMesh.frustumCulled = false;
furMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(furMesh);

let furCount = 0;
const tmpCol = new THREE.Color();

function pushFurStrand(stationIdx, lx, ly, lz, nx, ny, nz, gx, gy, gz, loft, length, radius, color) {
  if (furCount >= MAX_FUR) return;
  const i = furCount++;
  furStation[i] = stationIdx;

  // Project groom direction perpendicular-ish to normal, then loft outward
  let dx = nx * loft + gx * (1.0 - loft) + (rand() - 0.5) * 0.14;
  let dy = ny * loft + gy * (1.0 - loft) + (rand() - 0.5) * 0.14;
  let dz = nz * loft + gz * (1.0 - loft) + (rand() - 0.5) * 0.14;
  let dLen = Math.hypot(dx, dy, dz) || 1;
  dx /= dLen; dy /= dLen; dz /= dLen;

  // Ensure hair never points back into skin
  const dotN = dx * nx + dy * ny + dz * nz;
  if (dotN < 0.22) {
    dx += nx * (0.28 - dotN);
    dy += ny * (0.28 - dotN);
    dz += nz * (0.28 - dotN);
    dLen = Math.hypot(dx, dy, dz) || 1;
    dx /= dLen; dy /= dLen; dz /= dLen;
  }

  // Bend vector arches hair naturally along groom flow
  let bx = gx - 0.35 * nx;
  let by = gy - 0.35 * ny;
  let bz = gz - 0.35 * nz;
  let dotBD = bx * dx + by * dy + bz * dz;
  bx -= dotBD * dx; by -= dotBD * dy; bz -= dotBD * dz;
  let bLen = Math.hypot(bx, by, bz);
  if (bLen < 1e-4) {
    if (Math.abs(dx) < 0.8) { bx = 1; by = 0; bz = 0; }
    else { bx = 0; by = 1; bz = 0; }
    dotBD = bx * dx + by * dy + bz * dz;
    bx -= dotBD * dx; by -= dotBD * dy; bz -= dotBD * dz;
    bLen = Math.hypot(bx, by, bz) || 1;
  }
  bx /= bLen; by /= bLen; bz /= bLen;

  const i3 = i * 3;
  // Slightly sink root 0.008 inside undercoat skin so zero gap ever shows
  furLocPos[i3]     = lx - nx * 0.008;
  furLocPos[i3 + 1] = ly - ny * 0.008;
  furLocPos[i3 + 2] = lz - nz * 0.008;

  furLocDir[i3]     = dx;
  furLocDir[i3 + 1] = dy;
  furLocDir[i3 + 2] = dz;

  furLocBend[i3]     = bx;
  furLocBend[i3 + 1] = by;
  furLocBend[i3 + 2] = bz;

  furLen[i] = length;
  furRad[i] = radius;
  furPhase[i] = rand() * Math.PI * 2;
  furMesh.setColorAt(i, color);
}

// Populate all 36,000 multi-zone fur strands!
{
  const goldenAngle = Math.PI * (3.0 - Math.sqrt(5.0));

  // 1. Head, Face, Eyebrows & Fluffy Cheek Ruffs (7,600 strands -> Station 4)
  const HEAD_TARGET = 7600;
  let hPlaced = 0, hIdx = 0;
  while (hPlaced < HEAD_TARGET && hIdx < HEAD_TARGET * 3) {
    const u = (hIdx + 0.5) / (HEAD_TARGET * 1.12);
    hIdx++;
    if (u >= 1.0) break;
    const ySph = 1.0 - 2.0 * u;
    const rSph = Math.sqrt(Math.max(0, 1.0 - ySph * ySph));
    const th = hIdx * goldenAngle + (rand() - 0.5) * 0.08;
    const rx = Math.cos(th) * rSph;
    const ry = ySph;
    const rz = Math.sin(th) * rSph;

    const [sx, sy, sz] = raycastHeadSDF(rx, ry, rz);

    // Distance to eyes, nose, and mouth opening for clean facial feature framing
    const dEyeL = Math.hypot(sx - EYE_L_SKULL[0], sy - EYE_L_SKULL[1], sz - EYE_L_SKULL[2]);
    const dEyeR = Math.hypot(sx - EYE_R_SKULL[0], sy - EYE_R_SKULL[1], sz - EYE_R_SKULL[2]);
    const dEye = Math.min(dEyeL, dEyeR);
    const dNose = Math.hypot((sx - NOSE_SKULL[0]) / 1.15, (sy - NOSE_SKULL[1]) / 0.9, (sz - NOSE_SKULL[2]) / 0.95);
    const dMouth = Math.hypot(sx / 0.10, (sy + 0.165) / 0.045, (sz - 0.37) / 0.08);

    if (dEye < 0.062 || dNose < 0.062 || dMouth < 0.85) continue;

    const [nx, ny, nz] = headGrad(sx, sy, sz);
    // Natural mammal facial groom radiates smoothly away from nose tip!
    let gx = sx - 0.0;
    let gy = sy - (NOSE_SKULL[1] - 0.02);
    let gz = sz - (NOSE_SKULL[2] + 0.04);
    const gl = Math.hypot(gx, gy, gz) || 1;

    const ax = Math.abs(sx);

    if (cheekBoost > 0.05) {
      gx = gx * 0.55 + Math.sign(sx) * 0.65;
      gy -= 0.22 * cheekBoost;
      gz -= 0.18 * cheekBoost;
      const g2 = Math.hypot(gx, gy, gz) || 1;
      gx /= g2; gy /= g2; gz /= g2;
    }

    const eyeTaper = smoothstep(0.062, 0.165, dEye);
    const noseTaper = smoothstep(0.062, 0.175, dNose);
    const muzzleShort = 1.0 - 0.52 * smoothstep(0.24, 0.46, sz) * (1.0 - smoothstep(0.04, 0.18, sy));
    const baseLen = (0.115 + cheekBoost * 0.115 + rand() * 0.042) * muzzleShort;
    const finalLen = Math.max(0.026, baseLen * Math.min(eyeTaper, noseTaper));
    const rad = 0.0085 + finalLen * 0.052;
    const loft = 0.46 + cheekBoost * 0.26;

    const jitter = (rand() - 0.5) * 2.0;

    pushFurStrand(
      4,
      sx + SKULL_OFFSET.x,
      sy + SKULL_OFFSET.y,
      sz + SKULL_OFFSET.z,
      nx, ny, nz,
      gx, gy, gz,
      loft, finalLen, rad, tmpCol
    );
    hPlaced++;
  }

  // 2. Lower Jaw White Chin Fur (900 strands -> Station 5)
  for (let k = 0; k < 900; k++) {
    const u = (k + 0.5) / 900;
    const th = k * goldenAngle;
    const r = Math.sqrt(u);
    const lx = Math.cos(th) * r * 0.115;
    const lz = 0.03 + (0.5 + 0.5 * Math.sin(th) * r) * 0.165;
    const ly = -0.035 - Math.sqrt(Math.max(0, 1.0 - r * r * 0.85)) * 0.052;
    const nx = lx * 3.0, ny = -0.85, nz = (lz - 0.09) * 2.5;
    const nl = Math.hypot(nx, ny, nz) || 1;
    tmpCol.copy(COL_WHITE).offsetHSL(0, 0, (rand() - 0.5) * 0.03);
    pushFurStrand(
      5, lx, ly, lz,
      nx / nl, ny / nl, nz / nl,
      0, -0.35, -0.93,
      0.52,
      0.048 + (1.0 - lz * 2.2) * 0.03 + rand() * 0.02,
      0.0085,
      tmpCol
    );
  }

  // 3. Left & Right Ears with Bright White Rims & Long Inner Tufts (2,800 strands -> Stations 6 & 7)
  for (const stationIdx of [6, 7]) {
    for (let k = 0; k < 1400; k++) {
      const v = Math.pow(rand(), 0.72) * 0.98;
      const th = rand() * Math.PI * 2;
      const widthProfile = Math.sin(Math.pow(v, 0.55) * Math.PI * 0.92) * 0.135 + (1 - v) * 0.055;
      const cs = Math.cos(th), sn = Math.sin(th);
      const lx = cs * widthProfile;
      const ly = v * 0.255;
      let lz = sn * 0.036 * (1.0 - v * 0.45);
      if (sn > 0) lz = -sn * 0.016 * (1.0 - v * 0.6) + 0.012;

      const isFront = sn > 0.05;
      const isRim = Math.abs(cs) > 0.70 || v > 0.80;
      const nx = cs * 0.55;
      const ny = 0.25 + v * 0.35;
      const nz = isFront ? 0.82 : -0.85;
      const nl = Math.hypot(nx, ny, nz) || 1;

      let len = 0.075 + rand() * 0.035;
      let gx = cs * 0.45, gy = 0.88, gz = isFront ? 0.25 : -0.15;
      let loft = 0.52;

      if (isRim || isFront) {
        // Iconic fluffy bright white ear rims and long wispy inner-ear tufts!
        tmpCol.copy(COL_WHITE).offsetHSL(0, 0, (rand() - 0.5) * 0.03);
        len = (isRim ? 0.135 : 0.155) + rand() * 0.055;
        gx = cs * 0.72;
        gy = 0.68;
        gz = 0.35;
        loft = 0.68;
      } else {
        tmpCol.copy(COL_EAR_BACK).offsetHSL((rand() - 0.5) * 0.01, 0, (rand() - 0.5) * 0.03);
      }
      const gl = Math.hypot(gx, gy, gz) || 1;

  // 4. Torso, Back, Flanks, Chest & Dark Belly (9,500 strands -> Stations 0, 1, 2, 3)
  const TORSO_TARGET = 9500;
  for (let k = 0; k < TORSO_TARGET; k++) {
    const v = (k + 0.5) / TORSO_TARGET;
    const y = 0.89 + v * 0.96 + (rand() - 0.5) * 0.015;
    const th = k * goldenAngle + (rand() - 0.5) * 0.08;
    const elev = (v - 0.5) * 0.75;
    const [wx, wy, wz] = raycastTorsoFromSpine(y, Math.sin(th), elev, Math.cos(th));
    const [nx, ny, nz] = torsoGrad(wx, wy, wz);

    // Assign to nearest spine station (0: rump, 1: mid belly, 2: chest, 3: neck)
    let st = 1;
    if (wy < 1.24) st = 0;
    else if (wy < 1.50) st = 1;
    else if (wy < 1.70) st = 2;
    else st = 3;

    const inv = stationRestInvMats[st];
    const lp = new THREE.Vector3(wx, wy, wz).applyMatrix4(inv);
    // Stations 0..3 are pure translations in rest pose so normals & groom stay direct
    let gx = nx * 0.25;
    let gy = -0.82;
    let gz = -0.35;
    const gl = Math.hypot(gx, gy, gz) || 1;

    const jitter = (rand() - 0.5) * 2.0;
    getTorsoFurColor(wx, wy, wz, jitter, tmpCol);
    const len = 0.145 + (1.0 - v * 0.25) * 0.045 + rand() * 0.045;
    pushFurStrand(
      st, lp.x, lp.y, lp.z,
      nx, ny, nz,
      gx / gl, gy / gl, gz / gl,
      0.56, len, 0.011 + rand() * 0.004, tmpCol

  // 5. Dark Chocolate-Black Front Arms & Hind Legs (6,200 strands -> Stations 8..13)
  const limbAllocation = [
    { key: 'armLUpper', count: 800 },
    { key: 'armLLower', count: 800 },
    { key: 'armRUpper', count: 800 },

  for (const item of limbAllocation) {

    const segLen = limb.a.distanceTo(limb.b);
    const isDistal = (limb.station === 9 || limb.station === 11 || limb.station === 12 || limb.station === 13);

    for (let k = 0; k < item.count; k++) {

      const r = limb.r0 + (limb.r1 - limb.r0) * u;
      let ly = (u * 1.16 - 0.08) * segLen;
      let radScale = 1.0;
      if (ly < 0) {
        radScale = Math.sqrt(Math.max(0, 1.0 - Math.pow(ly / (limb.r0 * 0.95), 2)));
      } else if (ly > segLen) {
        radScale = Math.sqrt(Math.max(0, 1.0 - Math.pow((ly - segLen) / (limb.r1 * 0.95), 2)));
      }
      const cs = Math.cos(th), sn = Math.sin(th);
      const lx = cs * r * radScale;
      const lz = sn * r * radScale;

      const nx = cs, ny = ly > segLen ? 0.55 : (ly < 0 ? -0.35 : 0.0), nz = sn;
      const nl = Math.hypot(nx, ny, nz) || 1;

      // Shorten neatly near grasping paw tips so claws & bamboo clasp stay crisp
      const pawTaper = isDistal ? 1.0 - 0.58 * smoothstep(0.72, 1.05, u) : 1.0;
      const len = (0.115 + rand() * 0.038) * pawTaper;

      const jitter = rand();
      tmpCol.copy(COL_CHOCO_DARK).lerp(COL_CHOCO_TIP, 0.28 + jitter * 0.52);
      pushFurStrand(
        limb.station, lx, ly, lz,
        nx / nl, ny / nl, nz / nl,
        cs * 0.22, 0.94, sn * 0.22,
        0.54, len, 0.010 + rand() * 0.003, tmpCol
      );

  // 6. Huge, Ultra-Bushy 6-Ringed Tail (9,000+ strands -> Stations 14..37)
  const remainingForTail = MAX_FUR - furCount;
  for (let k = 0; k < remainingForTail; k++) {
    const u = Math.pow((k + 0.5) / remainingForTail, 0.94);
    const stFloat = u * (TAIL_STATIONS - 1);

    const th = k * goldenAngle + (rand() - 0.5) * 0.14;

    const tipForward = smoothstep(0.86, 1.0, u);
    const nx = cs * (1.0 - tipForward * 0.45);
    const ny = sn * (1.0 - tipForward * 0.45);
    const nz = tipForward * 0.85;
    const nl = Math.hypot(nx, ny, nz) || 1;

    // Fluffy cloud-like radial + backward loft for an enormous bushy silhouette!
    const fluffEnvelope = 0.85 + 0.35 * Math.sin(Math.pow(u, 0.65) * Math.PI * 0.92);
    const len = (0.185 + rand() * 0.075) * fluffEnvelope;
    const jitter = (rand() - 0.5) * 2.0;
    getTailFurColor(u, jitter, tmpCol);

    pushFurStrand(
      14 + stIdx, lx, ly, lz,
      nx / nl, ny / nl, nz / nl,
      cs * 0.38, sn * 0.38, 0.84,
      0.72, len, 0.0125 + rand() * 0.0045, tmpCol
    );
  }

  furMesh.count = furCount;
  if (furMesh.instanceColor) furMesh.instanceColor.needsUpdate = true;
}

// -----------------------------------------------------------------------------
// Interactive Mouse Raycaster Physics (Fur Parting & Brushing)
// -----------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(99, 99);
let pointerInside = false;
let pointerPressed = false;
let hasHit = false;
const hitWorld = new THREE.Vector3();
const prevHitWorld = new THREE.Vector3();
const hitNormalWorld = new THREE.Vector3(0, 1, 0);
const brushVelocity = new THREE.Vector3();
let boopExcitement = 0.0;

window.addEventListener('pointermove', (e) => {
  pointerNDC.x = (e.clientX / window.innerWidth) * 2.0 - 1.0;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2.0 + 1.0;
  pointerInside = true;
});

window.addEventListener('pointerdown', (e) => {
  pointerNDC.x = (e.clientX / window.innerWidth) * 2.0 - 1.0;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2.0 + 1.0;
  pointerInside = true;
  pointerPressed = true;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(raycastColliders, false);
  if (hits.length > 0) {
    boopExcitement = Math.min(1.0, boopExcitement + 0.85);
  }
});

window.addEventListener('pointerup', () => {
  pointerPressed = false;
});

window.addEventListener('pointerleave', () => {
  pointerInside = false;
  pointerPressed = false;
  hasHit = false;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// -----------------------------------------------------------------------------
// Animation Loop: Chewing/Nibbling Mouth, Ear Twitches, Bushy Tail Sway & Fur Physics
// -----------------------------------------------------------------------------
const clock = new THREE.Clock();
const tmpMatA = new THREE.Matrix4();
const tmpMatB = new THREE.Matrix4();
const tmpMatHead = new THREE.Matrix4();
const tmpQuat = new THREE.Quaternion();
const tmpEuler = new THREE.Euler();
const tmpPos = new THREE.Vector3();
const tmpScale = new THREE.Vector3(1, 1, 1);

const instArray = furMesh.instanceMatrix.array;
let nextBlinkTime = 2.4;
let blinkTimer = -1.0;
let smoothLookX = 0, smoothLookY = 0;

function updateSkeletalStations(t, dt) {
  boopExcitement = Math.max(0, boopExcitement - dt * 0.75);

  // 1. Chewing / Nibbling Cycle on the Fresh Green Bamboo Leaf!
  // Alternates adorable rapid nibble bursts with contented soft chews
  const cycle = t % 4.6;
  let nibbleEnv = 0.0;
  if (cycle < 2.8) {
    nibbleEnv = smoothstep(0.0, 0.25, cycle) * (1.0 - smoothstep(2.45, 2.8, cycle));
  } else if (cycle > 3.35 && cycle < 4.25) {
    nibbleEnv = 0.55 * smoothstep(3.35, 3.55, cycle) * (1.0 - smoothstep(4.05, 4.25, cycle));
  }
  const chewWave = 0.5 - 0.5 * Math.cos(t * 27.0); // ~4.3 Hz cute rapid munches
  const jawOpen = nibbleEnv * (0.08 + 0.24 * chewWave) + 0.025;
  const jawGrindX = nibbleEnv * Math.sin(t * 13.5) * 0.012;

  // 2. Gentle Breathing & Seated Torso Sway (Stations 0..3)
  const breath = Math.sin(t * 2.15);
  const bodyRockZ = Math.sin(t * 0.92) * 0.018;
  const bodyBobY = breath * 0.008;

  // Station 0: Pelvis/Rump anchored on mossy log
  tmpEuler.set(0, 0, bodyRockZ * 0.35);
  tmpQuat.setFromEuler(tmpEuler);
  tmpPos.set(-0.06, 1.12 + bodyBobY * 0.3, -0.02);
  tmpScale.set(1.0 + breath * 0.008, 1.0, 1.0 + breath * 0.008);
  tmpMatA.compose(tmpPos, tmpQuat, tmpScale);
  tmpMatA.toArray(stationMats, 0 * 16);

  // Station 1: Mid Torso / Belly
  tmpEuler.set(breath * 0.016, Math.sin(t * 0.7) * 0.015, bodyRockZ * 0.7);
  tmpQuat.setFromEuler(tmpEuler);
  tmpPos.set(-0.05 - bodyRockZ * 0.2, 1.38 + bodyBobY, 0.02 + breath * 0.007);
  tmpScale.set(1.0 + breath * 0.016, 1.0 + breath * 0.006, 1.0 + breath * 0.018);
  tmpMatA.compose(tmpPos, tmpQuat, tmpScale);
  tmpMatA.toArray(stationMats, 1 * 16);

  // Station 2: Chest / Shoulders
  tmpEuler.set(breath * 0.02 + nibbleEnv * 0.025, Math.sin(t * 0.7) * 0.02, bodyRockZ);
  tmpQuat.setFromEuler(tmpEuler);
  tmpPos.set(-0.04 - bodyRockZ * 0.35, 1.60 + bodyBobY * 1.2, 0.05 + breath * 0.009);
  tmpScale.set(1, 1, 1);
  tmpMatA.compose(tmpPos, tmpQuat, tmpScale);
  tmpMatA.toArray(stationMats, 2 * 16);

  // Station 3: Neck
  tmpPos.set(-0.03 - bodyRockZ * 0.45, 1.75 + bodyBobY * 1.3, 0.07 + nibbleEnv * 0.012);
  tmpMatA.compose(tmpPos, tmpQuat, tmpScale);
  tmpMatA.toArray(stationMats, 3 * 16);

  // 3. Expressive Baby Head + Curious Cursor Glance + Nibble Nod (Station 4)
  let targetLookX = 0, targetLookY = 0;
  if (pointerInside) {
    targetLookX = clamp(pointerNDC.x * 0.075, -0.08, 0.08);
    targetLookY = clamp(-pointerNDC.y * 0.055, -0.06, 0.06);
  }
  smoothLookX += (targetLookX - smoothLookX) * Math.min(1, dt * 4.5);
  smoothLookY += (targetLookY - smoothLookY) * Math.min(1, dt * 4.5);

  const nibbleNod = nibbleEnv * chewWave * 0.032 + nibbleEnv * 0.035;
  const cuteHeadTilt = Math.sin(t * 0.82 + 0.5) * 0.042 + bodyRockZ * 0.8 + boopExcitement * Math.sin(t * 14.0) * 0.04;
  tmpEuler.set(
    0.04 + nibbleNod + smoothLookY,
    Math.sin(t * 0.58) * 0.038 + smoothLookX,
    cuteHeadTilt
  );
  tmpQuat.setFromEuler(tmpEuler);
  tmpPos.set(
    HEAD_PIVOT_REST.x - bodyRockZ * 0.5,
    HEAD_PIVOT_REST.y + bodyBobY * 1.35,
    HEAD_PIVOT_REST.z + nibbleEnv * 0.015
  );
  tmpScale.set(1 + nibbleEnv * chewWave * 0.015, 1, 1); // Subtle cheek puff when munching!
  tmpMatHead.compose(tmpPos, tmpQuat, tmpScale);
  tmpMatHead.toArray(stationMats, 4 * 16);

  // Eye Blink Update
  if (t > nextBlinkTime && blinkTimer < 0) {
    blinkTimer = 0.0;
    nextBlinkTime = t + 2.8 + (Math.sin(t * 7.3) * 0.5 + 0.5) * 3.4;
  }
  if (blinkTimer >= 0) {
    blinkTimer += dt;
    const bDur = 0.16;
    if (blinkTimer >= bDur) {
      blinkTimer = -1.0;
      leftEyelid.rotation.x = -Math.PI * 0.52;
      rightEyelid.rotation.x = -Math.PI * 0.52;
    } else {
      const closeAmt = Math.sin((blinkTimer / bDur) * Math.PI);
      const lidAng = -Math.PI * 0.52 + closeAmt * (Math.PI * 0.54);
      leftEyelid.rotation.x = lidAng;
      rightEyelid.rotation.x = lidAng;
    }
  }

  // 4. Lower Jaw Chewing Motion (Station 5)
  tmpEuler.set(jawOpen, jawGrindX * 1.8, 0);
  tmpQuat.setFromEuler(tmpEuler);
  tmpPos.set(JAW_LOCAL_PIVOT.x + jawGrindX, JAW_LOCAL_PIVOT.y - jawOpen * 0.025, JAW_LOCAL_PIVOT.z);
  tmpScale.set(1, 1, 1);
  tmpMatB.compose(tmpPos, tmpQuat, tmpScale);
  tmpMatA.multiplyMatrices(tmpMatHead, tmpMatB);
  tmpMatA.toArray(stationMats, 5 * 16);

  // 5. Independent Organic Ear Twitches (Stations 6 & 7)
  const twitchWindowL = (t * 0.43 + 0.2) % 1.0;
  const flickL = (twitchWindowL < 0.08 ? Math.sin((twitchWindowL / 0.08) * Math.PI * 2) * 0.22 : 0)
    + boopExcitement * Math.sin(t * 22.0) * 0.16;

  const twitchWindowR = (t * 0.37 + 0.65) % 1.0;
  const flickR = (twitchWindowR < 0.10 ? Math.sin((twitchWindowR / 0.10) * Math.PI * 3) * 0.24 : 0)
    - boopExcitement * Math.sin(t * 20.0 + 0.8) * 0.16;

  tmpEuler.set(
    0.14 + Math.sin(t * 1.7) * 0.03 + flickL * 0.4,
    0.12 + flickL * 0.55,
    -0.50 - flickL * 0.85 - nibbleEnv * chewWave * 0.025
  );
  tmpQuat.setFromEuler(tmpEuler);
  tmpMatB.compose(EAR_L_LOCAL_PIVOT, tmpQuat, tmpScale);
  tmpMatA.multiplyMatrices(tmpMatHead, tmpMatB);
  tmpMatA.toArray(stationMats, 6 * 16);

  tmpEuler.set(
    0.14 + Math.cos(t * 1.45) * 0.03 + flickR * 0.4,
    -0.12 - flickR * 0.55,
    0.50 + flickR * 0.85 + nibbleEnv * chewWave * 0.025
  );
  tmpQuat.setFromEuler(tmpEuler);
  tmpMatB.compose(EAR_R_LOCAL_PIVOT, tmpQuat, tmpScale);
  tmpMatA.multiplyMatrices(tmpMatHead, tmpMatB);
  tmpMatA.toArray(stationMats, 7 * 16);

  // 6. Front Arms & Paws Synchronized with Nibbled Bamboo Stalk (Stations 8..11)
  const bambooBobY = bodyBobY * 1.1 - nibbleEnv * chewWave * 0.011;
  const bambooRotZ = bodyRockZ * 0.45 - nibbleEnv * chewWave * 0.014;
  bambooRoot.position.set(-bodyRockZ * 0.25, bambooBobY, 0);
  bambooRoot.rotation.set(nibbleEnv * chewWave * 0.012, 0, bambooRotZ);

  // Hero bamboo leaf flexes & quivers right in the panda's mouth on every bite!
  heroNibbleLeafPivot.rotation.set(
    -nibbleEnv * chewWave * 0.16,
    nibbleEnv * Math.sin(t * 27.0) * 0.06,
    -nibbleEnv * chewWave * 0.11
  );

  const upVec = new THREE.Vector3(0, 1, 0);
  const setLimbMatrix = (stIdx, pA, pB) => {
    const dir = tmpPos.subVectors(pB, pA).normalize();
    tmpQuat.setFromUnitVectors(upVec, dir);
    tmpMatA.compose(pA, tmpQuat, tmpScale);
    tmpMatA.toArray(stationMats, stIdx * 16);
  };

  const shOffX = -bodyRockZ * 0.35;
  const shOffY = bodyBobY * 1.2;
  const pawOffX = -bodyRockZ * 0.25;
  const pawOffY = bambooBobY;

  const aLU_A = new THREE.Vector3(0.21 + shOffX, 1.57 + shOffY, 0.09);
  const aLU_B = new THREE.Vector3(0.16 + shOffX * 0.6, 1.53 + (shOffY + pawOffY) * 0.5, 0.32);
  const aLL_B = new THREE.Vector3(-0.055 + pawOffX, 1.555 + pawOffY, 0.495);
  setLimbMatrix(8, aLU_A, aLU_B);
  setLimbMatrix(9, aLU_B, aLL_B);

  const aRU_A = new THREE.Vector3(-0.30 + shOffX, 1.55 + shOffY, 0.09);
  const aRU_B = new THREE.Vector3(-0.33 + shOffX * 0.6, 1.38 + (shOffY + pawOffY) * 0.5, 0.28);
  const aRL_B = new THREE.Vector3(-0.215 + pawOffX, 1.29 + pawOffY, 0.445);
  setLimbMatrix(10, aRU_A, aRU_B);
  setLimbMatrix(11, aRU_B, aRL_B);

  // Hind legs resting steadily on mossy log (Stations 12 & 13)
  setLimbMatrix(12, LIMBS.legL.a, LIMBS.legL.b);
  setLimbMatrix(13, LIMBS.legR.a, LIMBS.legR.b);

  // 7. Huge Bushy Ringed Tail Swaying Side-to-Side (Stations 14..37)
  const wagSpeed = 2.05 + boopExcitement * 1.8;
  const wagAmp = 1.0 + boopExcitement * 0.55;

  tailAnimCtrl[0].set(-0.06, 1.05 + bodyBobY * 0.3, -0.25);
  for (let c = 1; c < 5; c++) {
    const rest = TAIL_REST_CTRL[c];
    const f = c / 4.0;
    const phase = t * wagSpeed - c * 0.58;
    const swayLateral = Math.sin(phase) * (0.14 * f * f + 0.04 * f) * wagAmp;
    const swayLift = (0.5 + 0.5 * Math.sin(phase * 2.0 - 0.4)) * 0.055 * f * wagAmp;

    // Lateral sway sweeps smoothly across Z & X while staying cleanly above the mossy log!
    let nx = rest.x - swayLateral * 0.42;
    let ny = rest.y + swayLift;
    let nz = rest.z + swayLateral * 0.95;

    // Guarantee zero penetration with log cylinder
    if (Math.abs(nx) < LOG_LENGTH * 0.5 + 0.12) {
      const dyLog = ny - LOG_CENTER_Y;
      const dzLog = nz - LOG_CENTER_Z;
      const distLog = Math.hypot(dyLog, dzLog);
      const minClearance = LOG_RADIUS + 0.19;
      if (distLog < minClearance && distLog > 1e-4) {
        const push = minClearance / distLog;
        ny = LOG_CENTER_Y + dyLog * push;
        nz = LOG_CENTER_Z + dzLog * push;
      }
    }
    tailAnimCtrl[c].set(nx, ny, nz);
  }

  computeTailStationFrames(tailCurve, tailPosArr, tailUpArr, tailSideArr, tailTanArr);
  for (let k = 0; k < TAIL_STATIONS; k++) {
    tmpMatA.makeBasis(tailSideArr[k], tailUpArr[k], tailTanArr[k]);
    tmpMatA.setPosition(tailPosArr[k]);
    tmpMatA.toArray(stationMats, (14 + k) * 16);
  }
  updateTailTubeGeometry();

  // Sync all visual skin groups & raycast colliders with station matrices
  for (let i = 0; i < dynamicStationMeshes.length; i++) {
    const item = dynamicStationMeshes[i];
    item.mesh.matrix.fromArray(stationMats, item.station * 16);
    item.mesh.matrixWorldNeedsUpdate = true;
  }
}

function updateFurPhysicsAndInstances(t, dt) {
  // Raycast mouse cursor over the animated Red Panda
  let hitNow = false;
  if (pointerInside) {
    raycaster.setFromCamera(pointerNDC, camera);
    scene.updateMatrixWorld();
    const hits = raycaster.intersectObjects(raycastColliders, false);
    if (hits.length > 0) {
      hitNow = true;
      if (hasHit) {
        brushVelocity.subVectors(hits[0].point, prevHitWorld).multiplyScalar(1.0 / Math.max(dt, 0.008));
        const maxVel = 3.5;
        if (brushVelocity.lengthSq() > maxVel * maxVel) brushVelocity.setLength(maxVel);
      } else {
        brushVelocity.set(0, 0, 0);
      }
      hitWorld.copy(hits[0].point);
      prevHitWorld.copy(hitWorld);
      if (hits[0].face) {
        hitNormalWorld.copy(hits[0].face.normal).transformDirection(hits[0].object.matrixWorld).normalize();
      }
    }
  }
  hasHit = hitNow;

  const brushR = pointerPressed ? 0.56 : 0.42;
  const brushR2 = brushR * brushR;
  const brushStrength = pointerPressed ? 2.15 : 1.38;
  const hx = hitWorld.x, hy = hitWorld.y, hz = hitWorld.z;
  const hnx = hitNormalWorld.x, hny = hitNormalWorld.y, hnz = hitNormalWorld.z;
  const bvx = brushVelocity.x * 0.14, bvy = brushVelocity.y * 0.14, bvz = brushVelocity.z * 0.14;

  const springK = 36.0;
  const damp = Math.exp(-8.5 * dt);

  for (let i = 0; i < furCount; i++) {
    const s16 = furStation[i] * 16;
    const m00 = stationMats[s16],     m01 = stationMats[s16 + 4], m02 = stationMats[s16 + 8],  m03 = stationMats[s16 + 12];
    const m10 = stationMats[s16 + 1], m11 = stationMats[s16 + 5], m12 = stationMats[s16 + 9],  m13 = stationMats[s16 + 13];
    const m20 = stationMats[s16 + 2], m21 = stationMats[s16 + 6], m22 = stationMats[s16 + 10], m23 = stationMats[s16 + 14];

    const i3 = i * 3;
    const lx = furLocPos[i3], ly = furLocPos[i3 + 1], lz = furLocPos[i3 + 2];
    const wx = m00 * lx + m01 * ly + m02 * lz + m03;
    const wy = m10 * lx + m11 * ly + m12 * lz + m13;
    const wz = m20 * lx + m21 * ly + m22 * lz + m23;

    const ldx = furLocDir[i3], ldy = furLocDir[i3 + 1], ldz = furLocDir[i3 + 2];
    let dx = m00 * ldx + m01 * ldy + m02 * ldz;
    let dy = m10 * ldx + m11 * ldy + m12 * ldz;
    let dz = m20 * ldx + m21 * ldy + m22 * ldz;

    const len = furLen[i];
    const rad = furRad[i];

    // Gentle living woodland breeze shimmer on longer guard hairs
    const breeze = Math.sin(t * 2.1 + furPhase[i] + wx * 3.0) * (len * 0.12);
    dx += breeze;
    dz += breeze * 0.6;

    // Interactive cursor fur parting + spring recovery
    if (hitNow) {
      const mx = wx + dx * len * 0.65 - hx;
      if (mx > -brushR && mx < brushR) {
        const my = wy + dy * len * 0.65 - hy;
        if (my > -brushR && my < brushR) {
          const mz = wz + dz * len * 0.65 - hz;
          const d2 = mx * mx + my * my + mz * mz;
          if (d2 < brushR2) {
            const dist = Math.sqrt(d2) + 1e-4;
            const fall = 1.0 - dist / brushR;
            const wgt = fall * fall * brushStrength;

            // Part radially away from cursor ray projected onto tangent plane + stroke velocity
            const dotN = (mx * hnx + my * hny + mz * hnz) / dist;
            let px = (mx / dist) - hnx * dotN * 0.55 + bvx;
            let py = (my / dist) - hny * dotN * 0.55 + bvy;
            let pz = (mz / dist) - hnz * dotN * 0.55 + bvz;
            const pl = Math.hypot(px, py, pz) || 1;
            px /= pl; py /= pl; pz /= pl;

            furVel[i3]     += (px * wgt - furDef[i3]) * 26.0 * dt;
            furVel[i3 + 1] += (py * wgt - furDef[i3 + 1]) * 26.0 * dt;
            furVel[i3 + 2] += (pz * wgt - furDef[i3 + 2]) * 26.0 * dt;
            furActive[i] = 1;
          }
        }
      }
    }

    if (furActive[i]) {
      let dfx = furDef[i3], dfy = furDef[i3 + 1], dfz = furDef[i3 + 2];
      let vfx = furVel[i3], vfy = furVel[i3 + 1], vfz = furVel[i3 + 2];

      vfx = (vfx - dfx * springK * dt) * damp;
      vfy = (vfy - dfy * springK * dt) * damp;
      vfz = (vfz - dfz * springK * dt) * damp;

      dfx += vfx * dt;
      dfy += vfy * dt;
      dfz += vfz * dt;

      // Clamp maximum deflection so parted fur lies plushly along coat without inverting
      const dMag = Math.hypot(dfx, dfy, dfz);
      if (dMag > 1.35) {
        const sc = 1.35 / dMag;
        dfx *= sc; dfy *= sc; dfz *= sc;
      }

      furDef[i3] = dfx; furDef[i3 + 1] = dfy; furDef[i3 + 2] = dfz;
      furVel[i3] = vfx; furVel[i3 + 1] = vfy; furVel[i3 + 2] = vfz;

      dx += dfx;
      dy += dfy;
      dz += dfz;

      if (dMag + Math.hypot(vfx, vfy, vfz) < 0.0025) {
        furDef[i3] = furDef[i3 + 1] = furDef[i3 + 2] = 0;
        furVel[i3] = furVel[i3 + 1] = furVel[i3 + 2] = 0;
        furActive[i] = 0;
      }
    }

    const invDL = 1.0 / (Math.hypot(dx, dy, dz) || 1);
    dx *= invDL; dy *= invDL; dz *= invDL;

    const lbx = furLocBend[i3], lby = furLocBend[i3 + 1], lbz = furLocBend[i3 + 2];
    let bx = m00 * lbx + m01 * lby + m02 * lbz;
    let by = m10 * lbx + m11 * lby + m12 * lbz;
    let bz = m20 * lbx + m21 * lby + m22 * lbz;

    const dotBD = bx * dx + by * dy + bz * dz;
    bx -= dotBD * dx;
    by -= dotBD * dy;
    bz -= dotBD * dz;
    let bNorm = Math.hypot(bx, by, bz);
    if (bNorm < 1e-4) {
      bx = -dz; by = 0; bz = dx;
      bNorm = Math.hypot(bx, by, bz) || 1;
    }
    const invBL = 1.0 / bNorm;
    bx *= invBL; by *= invBL; bz *= invBL;

    // Right-handed X = D cross B
    const rx = dy * bz - dz * by;
    const ry = dz * bx - dx * bz;
    const rz = dx * by - dy * bx;

    const radZ = rad * 1.18;
    const o = i * 16;
    instArray[o]      = rx * rad;
    instArray[o + 1]  = ry * rad;
    instArray[o + 2]  = rz * rad;
    instArray[o + 3]  = 0;

    instArray[o + 4]  = dx * len;
    instArray[o + 5]  = dy * len;
    instArray[o + 6]  = dz * len;
    instArray[o + 7]  = 0;

    instArray[o + 8]  = bx * radZ;
    instArray[o + 9]  = by * radZ;
    instArray[o + 10] = bz * radZ;
    instArray[o + 11] = 0;

    instArray[o + 12] = wx;
    instArray[o + 13] = wy;
    instArray[o + 14] = wz;
    instArray[o + 15] = 1;
  }

  furMesh.instanceMatrix.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  controls.update();
  updateSkeletalStations(elapsed, dt);
  updateFurPhysicsAndInstances(elapsed, dt);

  renderer.render(scene, camera);
}

animate();
</script>
