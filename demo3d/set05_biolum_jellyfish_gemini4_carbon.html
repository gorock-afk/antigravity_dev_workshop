<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #02050c;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // -------------------------------------------------------------------------
    // 1. Renderer, Scene, Camera & OrbitControls
    // -------------------------------------------------------------------------
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020611, 0.042);

    // Rich abyssal gradient background texture
    {
      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = 4;
      bgCanvas.height = 512;
      const ctx = bgCanvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#041226');
      grad.addColorStop(0.35, '#030b19');
      grad.addColorStop(0.75, '#02060f');
      grad.addColorStop(1.0, '#010308');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 4, 512);
      const bgTex = new THREE.CanvasTexture(bgCanvas);
      bgTex.colorSpace = THREE.SRGBColorSpace;
      scene.background = bgTex;
    }

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(3.1, 1.15, 14.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.target.set(0, -0.45, 0);
    controls.minDistance = 5.0;
    controls.maxDistance = 26.0;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.update();

    // -------------------------------------------------------------------------
    // 2. Post-Processing (HDR Bloom + OutputPass)
    // -------------------------------------------------------------------------
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.setSize(window.innerWidth, window.innerHeight);

    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.66, // strength
      0.62, // radius
      0.62  // threshold
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // -------------------------------------------------------------------------
    // 3. Procedural Studio-Abyssal Environment Map & Three-Point Lighting
    // -------------------------------------------------------------------------
    {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x020610);

      const envDome = new THREE.Mesh(
        new THREE.SphereGeometry(20, 32, 24),
        new THREE.MeshBasicMaterial({ color: 0x051329, side: THREE.BackSide })
      );
      envScene.add(envDome);

      const addPanel = (color, intensity, pos, rot, sx, sy) => {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(sx, sy),
          new THREE.MeshBasicMaterial({
            color: new THREE.Color(color).multiplyScalar(intensity),
            side: THREE.DoubleSide
          })
        );
        m.position.copy(pos);
        m.lookAt(0, 0, 0);
        if (rot) m.rotateZ(rot);
        envScene.add(m);
      };

      // Studio reflection panels for glassy wet iridescence on the bell
      addPanel(0x5cecff, 3.2, new THREE.Vector3(7, 9, 7), 0.2, 8, 5);
      addPanel(0xff38c4, 2.6, new THREE.Vector3(-8, 5, -7), -0.3, 9, 4);
      addPanel(0x3a6bff, 2.0, new THREE.Vector3(-7, -2, 8), 0.1, 7, 5);
      addPanel(0xd8f8ff, 3.8, new THREE.Vector3(0, 12, 1), 0.0, 6, 6);
      addPanel(0x0cf2b4, 1.6, new THREE.Vector3(5, -8, -4), 0.0, 8, 4);

      const envRT = pmrem.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      envDome.geometry.dispose();
      pmrem.dispose();
    }

    // Studio Three-Point Lighting
    const hemiLight = new THREE.HemisphereLight(0x1f4d80, 0x03060f, 0.7);
    scene.add(hemiLight);

    // 1) Key Light (casts soft contact shadow onto abyssal floor)
    const keyLight = new THREE.DirectionalLight(0xaeeeff, 2.1);
    keyLight.position.set(4.8, 12.5, 6.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 2.0;
    keyLight.shadow.camera.far = 28.0;
    keyLight.shadow.camera.left = -7.5;
    keyLight.shadow.camera.right = 7.5;
    keyLight.shadow.camera.top = 7.5;
    keyLight.shadow.camera.bottom = -7.5;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.radius = 4.5;
    scene.add(keyLight);

    // 2) Fill Light (cool indigo-violet)
    const fillLight = new THREE.DirectionalLight(0x4f68ff, 1.15);
    fillLight.position.set(-7.5, 2.5, 6.0);
    scene.add(fillLight);

    // 3) Rim / Back Light (bioluminescent magenta-aqua edge separation)
    const rimLight = new THREE.DirectionalLight(0xff4de1, 2.35);
    rimLight.position.set(-3.5, 6.5, -9.0);
    scene.add(rimLight);

    // Soft Contact Shadow & Abyssal Floor Plane
    const floorGroup = new THREE.Group();
    floorGroup.position.y = -6.85;
    scene.add(floorGroup);

    let contactGlowMat = null;
    {
      const floorGeo = new THREE.CircleGeometry(22, 96);
      floorGeo.rotateX(-Math.PI / 2);

      // Radial alpha fade texture so floor merges invisibly into abyssal fog
      const fCanvas = document.createElement('canvas');
      fCanvas.width = 256;
      fCanvas.height = 256;
      const fCtx = fCanvas.getContext('2d');
      const fGrad = fCtx.createRadialGradient(128, 128, 8, 128, 128, 126);
      fGrad.addColorStop(0.0, 'rgba(13, 28, 52, 0.92)');
      fGrad.addColorStop(0.45, 'rgba(8, 18, 36, 0.65)');
      fGrad.addColorStop(0.8, 'rgba(3, 8, 18, 0.22)');
      fGrad.addColorStop(1.0, 'rgba(2, 5, 12, 0.0)');
      fCtx.fillStyle = fGrad;
      fCtx.fillRect(0, 0, 256, 256);
      const floorTex = new THREE.CanvasTexture(fCanvas);

      const floorMat = new THREE.MeshStandardMaterial({
        map: floorTex,
        transparent: true,
        roughness: 0.92,
        metalness: 0.05,
        depthWrite: false
      });
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.receiveShadow = true;
      floorGroup.add(floorMesh);

      // Soft contact shadow + subtle bioluminescent bounce ring right below jellyfish
      const cCanvas = document.createElement('canvas');
      cCanvas.width = 256;
      cCanvas.height = 256;
      const cCtx = cCanvas.getContext('2d');
      const cGrad = cCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
      cGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.68)');
      cGrad.addColorStop(0.38, 'rgba(0, 4, 14, 0.44)');
      cGrad.addColorStop(0.72, 'rgba(0, 18, 38, 0.12)');
      cGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      cCtx.fillStyle = cGrad;
      cCtx.fillRect(0, 0, 256, 256);
      const cTex = new THREE.CanvasTexture(cCanvas);

      contactGlowMat = new THREE.MeshBasicMaterial({
        map: cTex,
        transparent: true,
        opacity: 0.78,
        depthWrite: false
      });
      const contactDisc = new THREE.Mesh(
        new THREE.PlaneGeometry(8.5, 8.5).rotateX(-Math.PI / 2),
        contactGlowMat
      );
      contactDisc.position.y = 0.01;
      contactDisc.name = 'contactDisc';
      floorGroup.add(contactDisc);
    }

    // -------------------------------------------------------------------------
    // 4. Custom Per-Vertex HDR Bioluminescence Shader Hook
    // -------------------------------------------------------------------------
    function attachBiolumAttribute(material, keySuffix) {
      material.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            '#include <common>\nattribute vec3 aBiolum;\nvarying vec3 vBiolum;'
          )
          .replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvBiolum = aBiolum;'
          );
        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vBiolum;'
          )
          .replace(
            '#include <emissivemap_fragment>',
            '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vBiolum;'
          );
      };
      material.customProgramCacheKey = () => 'biolum_hdr_' + keySuffix;
      return material;
    }

    // Helper: Vivid deep-sea bioluminescent palette (cyan <-> violet <-> magenta <-> aqua)
    const tmpColor = new THREE.Color();
    function evalBiolumPalette(phase, outArr, idx, intensity) {
      const p = ((phase % 1) + 1) % 1;
      // Smooth 3-lobe cosine palette tuned for neon cyan (0.0), electric violet (0.35), neon magenta (0.65)
      const angle = p * Math.PI * 2.0;
      const r = Math.max(0.0, 0.46 + 0.54 * Math.cos(angle - 4.15));
      const g = Math.max(0.0, 0.44 + 0.56 * Math.cos(angle - 0.35));
      const b = Math.max(0.0, 0.72 + 0.28 * Math.cos(angle - 1.95));
      outArr[idx] = r * intensity;
      outArr[idx + 1] = g * intensity;
      outArr[idx + 2] = b * intensity;
    }

    // -------------------------------------------------------------------------
    // 5. Interactive Bioluminescent Pulse Waves & Mouse Vortex State
    // -------------------------------------------------------------------------
    const MAX_PULSES = 10;
    const pulses = [];
    for (let i = 0; i < MAX_PULSES; i++) {
      pulses.push({
        active: false,
        x: 0,
        y: 0,
        z: 0,
        lx: 0,
        ly: 0,
        lz: 0,
        radius: 0,
        speed: 4.5,
        strength: 0,
        hueOffset: 0,
        age: 0,
        maxAge: 2.2
      });
    }
    let nextPulseIdx = 0;

    function spawnBiolumPulse(wx, wy, wz, strength = 1.0, speed = 5.2, hueOffset = 0.0) {
      const p = pulses[nextPulseIdx];
      nextPulseIdx = (nextPulseIdx + 1) % MAX_PULSES;
      p.active = true;
      p.x = wx;
      p.y = wy;
      p.z = wz;
      p.radius = 0.05;
      p.speed = speed;
      p.strength = strength;
      p.hueOffset = hueOffset;
      p.age = 0;
      p.maxAge = 2.35;
    }

    // Elastic jelly bell harmonic wobble modes (excited by mouse raycast / vortex)
    const MAX_WOBBLES = 6;
    const bellWobbles = [];
    for (let i = 0; i < MAX_WOBBLES; i++) {
      bellWobbles.push({
        active: false,
        theta: 0,
        u: 0.6,
        amp: 0,
        age: 0,
        freq: 9.5
      });
    }
    let nextWobbleIdx = 0;

    function triggerBellWobble(theta, u, amp) {
      const w = bellWobbles[nextWobbleIdx];
      nextWobbleIdx = (nextWobbleIdx + 1) % MAX_WOBBLES;
      w.active = true;
      w.theta = theta;
      w.u = u;
      w.amp = Math.min(amp, 0.42);
      w.age = 0;
      w.freq = 8.5 + Math.random() * 2.5;
    }

    // -------------------------------------------------------------------------
    // 6. Jellyfish Root Transform & Travelling Contraction Kinematics
    // -------------------------------------------------------------------------
    const bellGroup = new THREE.Group();
    bellGroup.position.set(0, 1.85, 0);
    scene.add(bellGroup);

    const coreLight = new THREE.PointLight(0x00f2ff, 3.4, 11.5, 1.65);
    coreLight.position.set(0, 1.15, 0);
    bellGroup.add(coreLight);

    const gonadLight = new THREE.PointLight(0xff26be, 2.3, 8.5, 1.75);
    gonadLight.position.set(0, 1.45, 0);
    bellGroup.add(gonadLight);

    // Dynamic jellyfish body swim state
    const jellyState = {
      basePos: new THREE.Vector3(0, 1.9, 0),
      offsetPos: new THREE.Vector3(0, 0, 0),
      velPos: new THREE.Vector3(0, 0, 0),
      tiltX: 0.14,
      tiltZ: -0.09,
      velTiltX: 0,
      velTiltZ: 0,
      swimPhase: 0,
      jetStrength: 0
    };

    const NUM_LOBES = 16;
    const BELL_RADIUS = 2.58;
    const BELL_HEIGHT = 2.18;

    // Asymmetric biological scyphozoan swim contraction waveform
    // Returns contraction value in [-0.25, +1.0] at normalized meridional coord u in [0, 1]
    function evalContractionWave(u, swimTime) {
      // Period = 1.0 in swimTime; radial propagation phase lag from mid-dome toward margin
      const lag = Math.max(0, u - 0.15) * 0.26;
      const ph = (((swimTime - lag) % 1) + 1) % 1;
      // Power stroke (0..0.38): brisk muscular squeeze; Recovery (0.38..1.0): slow elastic expansion
      if (ph < 0.38) {
        const s = ph / 0.38;
        return Math.sin(s * Math.PI * 0.5) * Math.sin(s * Math.PI * 0.88) * 1.12;
      } else {
        const r = (ph - 0.38) / 0.62;
        return Math.cos(r * Math.PI * 0.5) * 0.86 * Math.exp(-r * 2.1) - 0.14 * Math.sin(r * Math.PI);
      }
    }

    // Evaluates the 3D position on the Jellyfish Bell given:
    // u in [0, 1] (0 = apex, 1 = scalloped margin),
    // theta in [0, 2*PI],
    // layer in [-1, +1] (+1 = outer exumbrella, 0 = mid-mesoglea canal layer, -1 = inner subumbrella)
    const tmpBellVec = new THREE.Vector3();
    function evalBellSurface(u, theta, layer, swimTime, time, outVec) {
      // 16 scalloped marginal lobes (Chrysaora lappets):
      // Peaks of lobes at k * (2*PI/16); rhopaliar/tentacular clefts at (k + 0.5) * (2*PI/16)
      const cos16 = Math.cos(theta * NUM_LOBES);
      const lobeFactor = Math.pow(0.5 + 0.5 * cos16, 0.68); // 1 at lobe center, 0 at cleft
      const cleftFactor = 1.0 - lobeFactor;

      // Base dome meridional curve
      const sinCurve = Math.sin(u * Math.PI * 0.535);
      let rMid = BELL_RADIUS * Math.pow(sinCurve, 0.88);
      // Gentle Chrysaora bell skirt inflection near margin
      rMid += 0.14 * Math.pow(u, 3.2);

      let yMid = BELL_HEIGHT * Math.cos(u * Math.PI * 0.515);
      // Slight gentle curve near rim
      yMid -= 0.12 * Math.pow(u, 2.6);

      // Scalloped 16-lobe rim modulation (strongest as u -> 1)
      const rimMask = Math.pow(u, 3.4);
      const ribMask = Math.sin(u * Math.PI) * Math.pow(u, 0.65);

      // Lobes extend downward & flare delicately; clefts notch upward & inward
      yMid += rimMask * (-0.25 * lobeFactor + 0.09 * cleftFactor);
      rMid += rimMask * (0.11 * lobeFactor - 0.085 * cleftFactor);

      // Travelling radial contraction kinematics
      const cWave = evalContractionWave(u, swimTime);
      const contractWeight = Math.pow(u, 1.45);
      // Rim squeezes inward and curls downward during power stroke; crown rises slightly
      rMid -= cWave * contractWeight * (0.48 + 0.09 * lobeFactor);
      yMid -= cWave * contractWeight * (0.24 + 0.12 * lobeFactor);
      yMid += cWave * (1.0 - u) * 0.13;

      // Subtle trailing fluid drag flutter on the 16 delicate marginal lappets
      const flutter = Math.sin(theta * 5.0 - time * 2.2) * 0.022 * rimMask;
      rMid += flutter;

      // Interactive elastic wobble modes from mouse touch / vortex
      let wobbleDisp = 0;
      for (let i = 0; i < MAX_WOBBLES; i++) {
        const w = bellWobbles[i];
        if (!w.active) continue;
        const dAng = Math.atan2(Math.sin(theta - w.theta), Math.cos(theta - w.theta));
        const dU = u - w.u;
        const distSq = dAng * dAng * 0.55 + dU * dU * 3.2;
        const dist = Math.sqrt(distSq);
        const env = Math.exp(-distSq * 2.4) * Math.exp(-w.age * 2.3);
        wobbleDisp += w.amp * env * Math.cos(dist * 7.5 - w.age * w.freq);
      }

      // Mesoglea jelly thickness profile (thick lens at crown ~0.52, tapering smoothly to ~0.045 at rim)
      const halfThick = 0.26 * Math.pow(1.0 - u * 0.86, 1.35) + 0.022;
      // Subtle 16 radial exumbrella furrows along cleft lines
      const exRib = layer > 0 ? -0.028 * cleftFactor * ribMask * layer : 0.0;

      // Approximate surface normal direction in (r, y) meridional plane
      const normAngle = u * Math.PI * 0.52;
      const nr = Math.sin(normAngle);
      const ny = Math.cos(normAngle);

      const offset = layer * halfThick + exRib + wobbleDisp * (0.25 + 0.75 * u);
      const rFinal = Math.max(0.0, rMid + nr * offset * (u < 0.02 ? u / 0.02 : 1.0));
      const yFinal = yMid + ny * offset + wobbleDisp * (1.0 - u) * 0.5;

      outVec.set(rFinal * Math.cos(theta), yFinal, rFinal * Math.sin(theta));
      return outVec;
    }

    // -------------------------------------------------------------------------
    // 7. Build Closed Double-Walled Scalloped Umbrella Bell Mesh
    // -------------------------------------------------------------------------
    const BELL_COLS = 192; // 12 subdivisions per each of the 16 marginal lobes
    const BELL_OUTER_ROWS = 24;
    const BELL_LIP_ROWS = 4;
    const BELL_INNER_ROWS = 14;
    const BELL_TOTAL_ROWS = BELL_OUTER_ROWS + BELL_LIP_ROWS + BELL_INNER_ROWS; // 42 rings (0..42)
    const bellStride = BELL_COLS + 1;
    const bellVertCount = (BELL_TOTAL_ROWS + 1) * bellStride;

    // Precompute meridional (u, layer) profile along the closed double-walled dome
    const bellProfileU = new Float32Array(BELL_TOTAL_ROWS + 1);
    const bellProfileLayer = new Float32Array(BELL_TOTAL_ROWS + 1);
    for (let row = 0; row <= BELL_TOTAL_ROWS; row++) {
      if (row <= BELL_OUTER_ROWS) {
        // Outer exumbrella: apex (u=0, layer=+1) -> outer scalloped rim (u=1, layer=+1)
        const t = row / BELL_OUTER_ROWS;
        bellProfileU[row] = Math.pow(t, 0.92);
        bellProfileLayer[row] = 1.0;
      } else if (row <= BELL_OUTER_ROWS + BELL_LIP_ROWS) {
        // Smooth rounded marginal lip wrapping from outer (+1) to inner (-1)
        const lt = (row - BELL_OUTER_ROWS) / BELL_LIP_ROWS;
        const ang = lt * Math.PI;
        bellProfileU[row] = 1.0 - 0.012 * (1.0 - Math.sin(ang));
        bellProfileLayer[row] = Math.cos(ang);
      } else {
        // Inner subumbrella cavity: inner margin (u=0.988, layer=-1) -> inner apex (u=0, layer=-1)
        const it = (row - BELL_OUTER_ROWS - BELL_LIP_ROWS) / BELL_INNER_ROWS;
        bellProfileU[row] = (1.0 - it) * 0.988;
        bellProfileLayer[row] = -1.0;
      }
    }

    const bellGeo = new THREE.BufferGeometry();
    const bellPositions = new Float32Array(bellVertCount * 3);
    const bellNormals = new Float32Array(bellVertCount * 3);
    const bellUVs = new Float32Array(bellVertCount * 2);
    const bellBiolum = new Float32Array(bellVertCount * 3);

    for (let row = 0; row <= BELL_TOTAL_ROWS; row++) {
      const vCoord = row / BELL_TOTAL_ROWS;
      for (let col = 0; col <= BELL_COLS; col++) {
        const idx = row * bellStride + col;
        bellUVs[idx * 2] = col / BELL_COLS;
        bellUVs[idx * 2 + 1] = vCoord;
      }
    }

    const bellIndices = [];
    for (let row = 0; row < BELL_TOTAL_ROWS; row++) {
      for (let col = 0; col < BELL_COLS; col++) {
        const i00 = row * bellStride + col;
        const i01 = row * bellStride + col + 1;
        const i10 = (row + 1) * bellStride + col;
        const i11 = (row + 1) * bellStride + col + 1;
        // Outward-from-mesoglea CCW winding across outer dome, rounded lip, and inner dome
        bellIndices.push(i00, i01, i10);
        bellIndices.push(i01, i11, i10);
      }
    }

    bellGeo.setIndex(bellIndices);
    bellGeo.setAttribute('position', new THREE.BufferAttribute(bellPositions, 3));
    bellGeo.setAttribute('normal', new THREE.BufferAttribute(bellNormals, 3));
    bellGeo.setAttribute('uv', new THREE.BufferAttribute(bellUVs, 2));
    bellGeo.setAttribute('aBiolum', new THREE.BufferAttribute(bellBiolum, 3));

    const bellMaterial = attachBiolumAttribute(
      new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0xdcf6ff),
        transmission: 0.92,
        opacity: 1.0,
        transparent: true,
        ior: 1.38,
        thickness: 2.25,
        attenuationColor: new THREE.Color(0x1678d8),
        attenuationDistance: 2.6,
        roughness: 0.065,
        metalness: 0.0,
        iridescence: 1.0,
        iridescenceIOR: 1.34,
        iridescenceThicknessRange: [150, 580],
        clearcoat: 1.0,
        clearcoatRoughness: 0.045,
        envMapIntensity: 1.75
      }),
      'bell'
    );

    const bellMesh = new THREE.Mesh(bellGeo, bellMaterial);
    bellMesh.castShadow = true;
    bellGroup.add(bellMesh);

    // -------------------------------------------------------------------------
    // 8. Glowing 16 Radial Canals, Forked Lobe Canals, Ring Canal & 16 Rhopalia
    // -------------------------------------------------------------------------
    // Build sleek tubular canal descriptors embedded at layer = -0.15 (inside bell mesoglea)
    const canalPaths = [];
    // A) 16 Primary Radial Canals (8 cleft/rhopaliar canals + 8 lobe-center canals -> 16 radial canals + 16 cleft branches)
    for (let k = 0; k < NUM_LOBES; k++) {
      // Primary cleft canal leading straight to each of the 16 marginal rhopalia
      const thetaCleft = ((k + 0.5) / NUM_LOBES) * Math.PI * 2.0;
      canalPaths.push({
        type: 'cleft',
        index: k,
        steps: 22,
        radius: 0.0155,
        sample: (t) => {
          const u = 0.14 + t * 0.815;
          return { u, theta: thetaCleft };
        }
      });

      // Adradial / Lobe-center branching radial canal reaching into each of the 16 scalloped lobes
      const thetaLobe = (k / NUM_LOBES) * Math.PI * 2.0;
      canalPaths.push({
        type: 'lobe',

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2(99, 99);
    const prevVortexPos = new THREE.Vector3();
    const vortexPos = new THREE.Vector3(0, -99, 0);

    const interactionPlane = new THREE.Plane();

    let pointerActive = false;

    let globalClockTime = 0;

    function updatePointerRay(clientX, clientY, isClick) {
      pointerNDC.x = (clientX / window.innerWidth) * 2.0 - 1.0;
      pointerNDC.y = -(clientY / window.innerHeight) * 2.0 + 1.0;
      raycaster.setFromCamera(pointerNDC, camera);
      vortexDir.copy(raycaster.ray.direction);

      // 1) Direct Raycaster check against the 3D Umbrella Bell mesh
      const bellHits = raycaster.intersectObject(bellMesh, false);
      let hit3D = false;

      if (bellHits.length > 0) {
        hitPointTmp.copy(bellHits[0].point);
        hit3D = true;

        // Convert world hit point to bell local coordinates to excite exact lobe/u wobble
        bellInvMat.copy(bellGroup.matrixWorld).invert();
        localHitTmp.copy(hitPointTmp).applyMatrix4(bellInvMat);
        const hitTheta = Math.atan2(localHitTmp.z, localHitTmp.x);
        const hitR = Math.hypot(localHitTmp.x, localHitTmp.z);
        const hitU = THREE.MathUtils.clamp(hitR / BELL_RADIUS, 0.08, 0.98);

        if (isClick || globalClockTime - lastWobbleTime > 0.065) {
          triggerBellWobble(hitTheta, hitU, isClick ? 0.36 : 0.14);
          lastWobbleTime = globalClockTime;
        }

        // Physical hydrodynamic nudge on bell body
        const pushScale = isClick ? 1.15 : 0.22;
        jellyState.velTiltZ -= localHitTmp.x * 0.32 * pushScale;
        jellyState.velTiltX += localHitTmp.z * 0.32 * pushScale;
        jellyState.velPos.addScaledVector(raycaster.ray.direction, 0.35 * pushScale);
      } else {
        // 2) Intersect camera-aligned fluid plane passing through the jellyfish spine/tentacles
        camera.getWorldDirection(camDirTmp);
        interactionPlane.setFromNormalAndCoplanarPoint(camDirTmp, new THREE.Vector3(
          bellGroup.position.x,
          -0.6,
          bellGroup.position.z
        ));
        if (raycaster.ray.intersectPlane(interactionPlane, hitPointTmp)) {
          hit3D = true;
        }
      }

      if (hit3D) {
        if (!pointerActive) {
          prevVortexPos.copy(hitPointTmp);
          vortexPos.copy(hitPointTmp);
          pointerActive = true;
        } else {
          prevVortexPos.copy(vortexPos);
          vortexPos.lerp(hitPointTmp, 0.55);
          const dx = vortexPos.x - prevVortexPos.x;
          const dy = vortexPos.y - prevVortexPos.y;
          const dz = vortexPos.z - prevVortexPos.z;
          vortexVel.set(dx * 32.0, dy * 32.0, dz * 32.0);
          const speed = vortexVel.length();
          if (speed > 26.0) vortexVel.multiplyScalar(26.0 / speed);
          vortexEnergy = Math.min(1.6, vortexEnergy + speed * 0.045 + (isClick ? 1.1 : 0.0));
        }

        // Check proximity to jellyfish bell or tentacle curtain to trigger bioluminescent color pulse wave
        const distToJellyAxis = Math.hypot(
          vortexPos.x - bellGroup.position.x,
          vortexPos.z - bellGroup.position.z
        );
        const inVerticalRange = vortexPos.y > -6.0 && vortexPos.y < 4.5;

        if (isClick && distToJellyAxis < 4.8 && inVerticalRange) {
          spawnBiolumPulse(
            vortexPos.x,
            vortexPos.y,
            vortexPos.z,
            1.65,
            6.2,
            (globalClockTime * 0.35) % 1.0
          );
        } else if (
          distToJellyAxis < 3.45 &&
          inVerticalRange &&
          vortexVel.lengthSq() > 0.45 &&
          globalClockTime - lastPulseSpawnTime > 0.11
        ) {
          spawnBiolumPulse(
            vortexPos.x,
            vortexPos.y,
            vortexPos.z,
            Math.min(1.35, 0.55 + vortexVel.length() * 0.055),
            5.0,
            (globalClockTime * 0.28 + vortexPos.y * 0.08) % 1.0
          );
          lastPulseSpawnTime = globalClockTime;

          // If mouse sweeps close to the bell margin, also gently wobble nearest lobe
          if (vortexPos.y > bellGroup.position.y - 0.6 && vortexPos.y < bellGroup.position.y + 2.5) {
            if (globalClockTime - lastWobbleTime > 0.09) {
              const nearTheta = Math.atan2(
                vortexPos.z - bellGroup.position.z,
                vortexPos.x - bellGroup.position.x
              );
              triggerBellWobble(nearTheta, 0.85, 0.11);
              lastWobbleTime = globalClockTime;
            }
          }
        }
      }
    }

    window.addEventListener('pointermove', (e) => {

    // Helper: Evaluates 3D fluid vortex current velocity at world point (x, y, z)
    const fluidOut = new THREE.Vector3();
    const relRay = new THREE.Vector3();
    const closestOnRay = new THREE.Vector3();
    function evalVortexCurrent(x, y, z, out) {
      out.set(0, 0, 0);
      if (vortexEnergy < 0.005) return out;

      // Closest point along the 3D mouse ray so swirling reaches seamlessly through depth
      relRay.set(
        x - raycaster.ray.origin.x,
        y - raycaster.ray.origin.y,
        z - raycaster.ray.origin.z
      );
      const proj = Math.max(0, relRay.dot(vortexDir));
      closestOnRay.copy(raycaster.ray.origin).addScaledVector(vortexDir, proj);

      // Blend ray tube proximity and 3D vortex focal point
      const dx = x - closestOnRay.x;
      const dy = y - closestOnRay.y;
      const dz = z - closestOnRay.z;
      const distSq = dx * dx + dy * dy + dz * dz;
      const R2 = 3.1 * 3.1;
      if (distSq > R2) return out;

      const falloff = Math.exp(-distSq * 0.42) * vortexEnergy;

      // Swirling helical tangential velocity around mouse ray + upward eddy lift + cursor drag wake
      const swirlX = vortexDir.y * dz - vortexDir.z * dy;
      const swirlY = vortexDir.z * dx - vortexDir.x * dz;
      const swirlZ = vortexDir.x * dy - vortexDir.y * dx;

      out.set(
        swirlX * 4.8 + vortexVel.x * 0.42 - dx * 0.45,
        swirlY * 4.8 + vortexVel.y * 0.42 + 0.65,
        swirlZ * 4.8 + vortexVel.z * 0.42 - dz * 0.45
      ).multiplyScalar(falloff);

      return out;
    }

    // -------------------------------------------------------------------------
    // 14. Physics & Geometry Update Routines
    // -------------------------------------------------------------------------
    const bellWorldMat = new THREE.Matrix4();
    const rootWorldTmp = new THREE.Vector3();
    const eulerTmp = new THREE.Euler();

    function stepPhysics(dt, time, swimTime) {
      // Decay mouse vortex energy smoothly
      vortexVel.multiplyScalar(Math.exp(-dt * 7.5));
      vortexEnergy *= Math.exp(-dt * 2.8);

      // Advance bioluminescent pulse waves
      bellInvMat.copy(bellGroup.matrixWorld).invert();
      for (let i = 0; i < MAX_PULSES; i++) {
        const p = pulses[i];
        if (!p.active) continue;
        p.age += dt;
        if (p.age >= p.maxAge) {
          p.active = false;
          continue;
        }
        p.radius += p.speed * dt;
        localHitTmp.set(p.x, p.y, p.z).applyMatrix4(bellInvMat);
        p.lx = localHitTmp.x;
        p.ly = localHitTmp.y;
        p.lz = localHitTmp.z;
      }

      // Advance bell elastic wobbles
      for (let i = 0; i < MAX_WOBBLES; i++) {
        const w = bellWobbles[i];
        if (!w.active) continue;
        w.age += dt;
        if (w.age > 3.0) w.active = false;
      }

      // Jellyfish buoyant propulsion & gentle abyssal precession
      const rimContract = evalContractionWave(0.85, swimTime);
      const jetImpulse = Math.max(0, rimContract);
      jellyState.jetStrength = THREE.MathUtils.lerp(jellyState.jetStrength, jetImpulse, dt * 6.0);

      // Spring-damper body dynamics
      const targetTiltX = 0.13 + 0.055 * Math.sin(time * 0.37);
      const targetTiltZ = -0.09 + 0.055 * Math.cos(time * 0.29);
      jellyState.velTiltX += (targetTiltX - jellyState.tiltX) * 5.2 * dt;
      jellyState.velTiltZ += (targetTiltZ - jellyState.tiltZ) * 5.2 * dt;
      jellyState.velTiltX *= Math.exp(-dt * 3.1);
      jellyState.velTiltZ *= Math.exp(-dt * 3.1);
      jellyState.tiltX += jellyState.velTiltX * dt;
      jellyState.tiltZ += jellyState.velTiltZ * dt;

      jellyState.velPos.x += -jellyState.offsetPos.x * 2.2 * dt;
      jellyState.velPos.y += (-jellyState.offsetPos.y * 2.4 + (jetImpulse - 0.24) * 1.35) * dt;
      jellyState.velPos.z += -jellyState.offsetPos.z * 2.2 * dt;
      jellyState.velPos.multiplyScalar(Math.exp(-dt * 2.6));
      jellyState.offsetPos.addScaledVector(jellyState.velPos, dt);

      const swimBob = Math.sin(time * 0.55) * 0.14;
      bellGroup.position.set(
        jellyState.basePos.x + jellyState.offsetPos.x + Math.sin(time * 0.27) * 0.18,
        jellyState.basePos.y + jellyState.offsetPos.y + swimBob,
        jellyState.basePos.z + jellyState.offsetPos.z + Math.cos(time * 0.23) * 0.15
      );
      eulerTmp.set(jellyState.tiltX, Math.sin(time * 0.16) * 0.35, jellyState.tiltZ);
      bellGroup.quaternion.setFromEuler(eulerTmp);
      bellGroup.updateMatrixWorld(true);
      bellWorldMat.copy(bellGroup.matrixWorld);

      // Update soft contact shadow disc beneath jellyfish
      const contactDisc = floorGroup.getObjectByName('contactDisc');
      if (contactDisc) {
        contactDisc.position.x = bellGroup.position.x * 0.85;
        contactDisc.position.z = bellGroup.position.z * 0.85;
        const sScale = 1.0 - rimContract * 0.12;
        contactDisc.scale.set(sScale, 1.0, sScale);
      }

      // Sub-stepped fluid chain dynamics for Oral Arms & 24 Marginal Tentacles
      const subSteps = 2;
      const sdt = dt / subSteps;

      for (let step = 0; step < subSteps; step++) {
        // --- A) 4 Ruffled Oral Arms Spine Kinematics ---
        for (let a = 0; a < NUM_ARMS; a++) {
          const baseIdx = a * ARM_NODES;
          const armAngle = a * (Math.PI * 0.5);

          // Root node anchored to manubrium beneath stomach core
          rootWorldTmp.set(
            Math.cos(armAngle) * 0.34,
            0.94 - jellyState.jetStrength * 0.08,
            Math.sin(armAngle) * 0.34
          ).applyMatrix4(bellWorldMat);

          armPX[baseIdx] = rootWorldTmp.x;
          armPY[baseIdx] = rootWorldTmp.y;
          armPZ[baseIdx] = rootWorldTmp.z;
          armVX[baseIdx] = 0;
          armVY[baseIdx] = 0;
          armVZ[baseIdx] = 0;

          const radDirX = Math.cos(armAngle);
          const radDirZ = Math.sin(armAngle);
          const tanDirX = -radDirZ;
          const tanDirZ = radDirX;

          for (let i = 1; i < ARM_NODES; i++) {
            const idx = baseIdx + i;
            const s = i / (ARM_NODES - 1);

            // Travelling muscular wave with realistic progressive phase lag & bell jet wake
            const wavePhase = s * 5.6 - time * 1.85 + a * 1.57;
            const wavePhase2 = s * 9.5 - time * 2.7 + a * 0.9;
            const amp = (0.18 + 0.65 * Math.pow(s, 1.15));

            let fx = (radDirX * Math.sin(wavePhase) * 0.95 + tanDirX * Math.cos(wavePhase * 0.85) * 0.82) * amp;
            let fz = (radDirZ * Math.sin(wavePhase) * 0.95 + tanDirZ * Math.cos(wavePhase * 0.85) * 0.82) * amp;
            fx += tanDirX * Math.sin(wavePhase2) * 0.25 * s;
            fz += tanDirZ * Math.sin(wavePhase2) * 0.25 * s;

            // Gentle downward gravity + downward pulse jet wake inside subumbrella
            const jetWake = jellyState.jetStrength * Math.exp(-s * 1.8) * 1.45;
            let fy = -1.65 - jetWake;

            // Interactive mouse fluid vortex current
            evalVortexCurrent(armPX[idx], armPY[idx], armPZ[idx], fluidOut);
            fx += fluidOut.x * 3.6;
            fy += fluidOut.y * 3.2;
            fz += fluidOut.z * 3.6;

            // Viscous abyssal fluid drag (increases toward broad ruffled veil)
            const drag = Math.exp(-sdt * (2.6 + 1.4 * s));
            armVX[idx] = (armVX[idx] + fx * sdt) * drag;
            armVY[idx] = (armVY[idx] + fy * sdt) * drag;
            armVZ[idx] = (armVZ[idx] + fz * sdt) * drag;

            armPX[idx] += armVX[idx] * sdt;
            armPY[idx] += armVY[idx] * sdt;
            armPZ[idx] += armVZ[idx] * sdt;
          }

          // Inextensible segment length + soft root alignment constraints (3 passes)
          for (let iter = 0; iter < 3; iter++) {
            for (let i = 0; i < ARM_NODES - 1; i++) {
              const i0 = baseIdx + i;
              const i1 = i0 + 1;
              const dx = armPX[i1] - armPX[i0];
              const dy = armPY[i1] - armPY[i0];
              const dz = armPZ[i1] - armPZ[i0];
              const dist = Math.hypot(dx, dy, dz) || 1e-5;
              const diff = (dist - ARM_SEG_LEN) / dist;

              if (i === 0) {
                armPX[i1] -= dx * diff;
                armPY[i1] -= dy * diff;
                armPZ[i1] -= dz * diff;
                armVX[i1] -= (dx * diff) * 8.0 * sdt;
                armVY[i1] -= (dy * diff) * 8.0 * sdt;
                armVZ[i1] -= (dz * diff) * 8.0 * sdt;
              } else {
                const w0 = 0.36;
                const w1 = 0.64;
                armPX[i0] += dx * diff * w0;
                armPY[i0] += dy * diff * w0;
                armPZ[i0] += dz * diff * w0;
                armPX[i1] -= dx * diff * w1;
                armPY[i1] -= dy * diff * w1;
                armPZ[i1] -= dz * diff * w1;
              }
            }
          }
        }

        // --- B) 24 Slender Marginal Tentacles Fluid Kinematics ---
        for (let t = 0; t < NUM_TENTACLES; t++) {
          const baseIdx = t * TENT_NODES;
          const theta = tentThetas[t];
          const tPhase = tentPhases[t];
          const segL = tentSegLens[t];

          // Exact animated attachment point on the pulsing, wobbling scalloped bell margin
          evalBellSurface(0.95, theta, -0.45, swimTime, time, rootWorldTmp);
          rootWorldTmp.applyMatrix4(bellWorldMat);

          tentPX[baseIdx] = rootWorldTmp.x;
          tentPY[baseIdx] = rootWorldTmp.y;
          tentPZ[baseIdx] = rootWorldTmp.z;
          tentVX[baseIdx] = 0;
          tentVY[baseIdx] = 0;
          tentVZ[baseIdx] = 0;

          const radX = Math.cos(theta);
          const radZ = Math.sin(theta);
          const tanX = -radZ;
          const tanZ = radX;

          for (let j = 1; j < TENT_NODES; j++) {
            const idx = baseIdx + j;
            const s = j / (TENT_NODES - 1);

            // Multi-harmonic travelling wave propagating from bell rim down to tentacle tip with phase lag
            const lagWave = s * 6.8 - swimTime * Math.PI * 2.0 + Math.sin(t * 1.7) * 0.4;
            const serpentine = s * 8.2 - time * 2.15 + tPhase;
            const whipAmp = (0.14 + 0.85 * Math.pow(s, 1.25));

            // Outward radial flare + contraction wave whip + gentle tangential serpentine flow
            let fx = (radX * (0.28 * (1.0 - s * 0.5) + 0.62 * Math.sin(lagWave)) + tanX * 0.52 * Math.cos(serpentine)) * whipAmp;
            let fz = (radZ * (0.28 * (1.0 - s * 0.5) + 0.62 * Math.sin(lagWave)) + tanZ * 0.52 * Math.cos(serpentine)) * whipAmp;
            let fy = -1.42 - jellyState.jetStrength * 0.45 * (1.0 - s);

            // Mouse fluid vortex swirl current
            evalVortexCurrent(tentPX[idx], tentPY[idx], tentPZ[idx], fluidOut);
            fx += fluidOut.x * 4.4;
            fy += fluidOut.y * 3.8;
            fz += fluidOut.z * 4.4;

            // Anisotropic viscous fluid drag along filament
            const tx = tentPX[idx] - tentPX[idx - 1];
            const ty = tentPY[idx] - tentPY[idx - 1];
            const tz = tentPZ[idx] - tentPZ[idx - 1];
            const tLen = Math.hypot(tx, ty, tz) || 1e-5;
            const ux = tx / tLen;
            const uy = ty / tLen;
            const uz = tz / tLen;

            let vx = tentVX[idx] + fx * sdt;
            let vy = tentVY[idx] + fy * sdt;
            let vz = tentVZ[idx] + fz * sdt;

            // Decompose into axial and normal velocity for realistic filament drag in seawater
            const vAxial = vx * ux + vy * uy + vz * uz;
            const vnx = vx - ux * vAxial;
            const vny = vy - uy * vAxial;
            const vnz = vz - uz * vAxial;

            const axialDrag = Math.exp(-sdt * 1.6);
            const normalDrag = Math.exp(-sdt * (3.8 + 1.5 * s));

            tentVX[idx] = ux * vAxial * axialDrag + vnx * normalDrag;
            tentVY[idx] = uy * vAxial * axialDrag + vny * normalDrag;
            tentVZ[idx] = uz * vAxial * axialDrag + vnz * normalDrag;

            tentPX[idx] += tentVX[idx] * sdt;
            tentPY[idx] += tentVY[idx] * sdt;
            tentPZ[idx] += tentVZ[idx] * sdt;
          }

          // Distance constraint passes for whip-smooth inextensible tentacles
          for (let iter = 0; iter < 3; iter++) {
            for (let j = 0; j < TENT_NODES - 1; j++) {
              const i0 = baseIdx + j;
              const i1 = i0 + 1;
              const dx = tentPX[i1] - tentPX[i0];
              const dy = tentPY[i1] - tentPY[i0];
              const dz = tentPZ[i1] - tentPZ[i0];
              const dist = Math.hypot(dx, dy, dz) || 1e-5;
              const diff = (dist - segL) / dist;

              if (j === 0) {
                tentPX[i1] -= dx * diff;
                tentPY[i1] -= dy * diff;
                tentPZ[i1] -= dz * diff;
              } else {
                const w0 = 0.34;
                const w1 = 0.66;
                tentPX[i0] += dx * diff * w0;
                tentPY[i0] += dy * diff * w0;
                tentPZ[i0] += dz * diff * w0;
                tentPX[i1] -= dx * diff * w1;
                tentPY[i1] -= dy * diff * w1;
                tentPZ[i1] -= dz * diff * w1;
              }
            }
          }
        }
      }
    }

    // Evaluates additive pulse wave glow at local or world coordinates
    function sumPulseGlow(x, y, z, useLocal, time, baseHue, baseGlow, outArr, idx) {
      let extraEnergy = 0;
      let hueShift = 0;
      for (let pIdx = 0; pIdx < MAX_PULSES; pIdx++) {
        const p = pulses[pIdx];
        if (!p.active) continue;
        const px = useLocal ? p.lx : p.x;
        const py = useLocal ? p.ly : p.y;
        const pz = useLocal ? p.lz : p.z;
        const d = Math.hypot(x - px, y - py, z - pz);
        const delta = (d - p.radius) / 0.85;
        if (Math.abs(delta) < 2.6) {
          const ring = Math.exp(-delta * delta) * (1.0 - p.age / p.maxAge) * p.strength;
          extraEnergy += ring;
          hueShift += ring * (p.hueOffset + d * 0.09);
        }
      }
      const totalGlow = baseGlow + extraEnergy * 2.1;
      const finalHue = baseHue + (extraEnergy > 0.001 ? hueShift / (extraEnergy + 0.25) : 0.0) + time * 0.03;
      evalBiolumPalette(finalHue, outArr, idx, totalGlow);
    }

    //Scratch vectors for mesh updates
    const vTmpA = new THREE.Vector3();
    const vTmpB = new THREE.Vector3();
    const vTmpT = new THREE.Vector3();
    const vTmpN = new THREE.Vector3();
    const vTmpBin = new THREE.Vector3();

    function updateMeshes(time, swimTime, dt) {
      // -----------------------------------------------------------------------
      // 1) Update Scalloped Umbrella Bell Vertices, Seam-Free Normals & Glow
      // -----------------------------------------------------------------------
      for (let row = 0; row <= BELL_TOTAL_ROWS; row++) {
        const u = bellProfileU[row];
        const layer = bellProfileLayer[row];
        const rimGlow = Math.pow(u, 4.2) * 0.28;

        for (let col = 0; col <= BELL_COLS; col++) {
          const theta = (col / BELL_COLS) * Math.PI * 2.0;
          const vIdx = (row * bellStride + col) * 3;
          evalBellSurface(u, theta, layer, swimTime, time, vTmpA);
          bellPositions[vIdx] = vTmpA.x;
          bellPositions[vIdx + 1] = vTmpA.y;
          bellPositions[vIdx + 2] = vTmpA.z;

          // Subtle travelling rim & cleft bioluminescence + interactive pulse shockwaves
          const cleftGlow = (0.5 - 0.5 * Math.cos(theta * NUM_LOBES)) * Math.pow(u, 2.5) * 0.16;
          const baseHue = 0.06 + u * 0.45 + 0.08 * Math.sin(theta * 4.0);
          sumPulseGlow(
            vTmpA.x,
            vTmpA.y,
            vTmpA.z,
            true,
            time,
            baseHue,
            rimGlow + cleftGlow,
            bellBiolum,
            vIdx
          );
        }
      }

      bellGeo.attributes.position.needsUpdate = true;
      bellGeo.attributes.aBiolum.needsUpdate = true;
      bellGeo.computeVertexNormals();

      // Stitch azimuthal seam normals (col 0 & col BELL_COLS) and apex poles for flawless refraction
      for (let row = 0; row <= BELL_TOTAL_ROWS; row++) {
        const i0 = (row * bellStride) * 3;
        const iLast = (row * bellStride + BELL_COLS) * 3;
        if (row === 0) {
          for (let col = 0; col <= BELL_COLS; col++) {
            const ic = col * 3;
            bellNormals[ic] = 0;
            bellNormals[ic + 1] = 1;
            bellNormals[ic + 2] = 0;
          }
        } else if (row === BELL_TOTAL_ROWS) {
          for (let col = 0; col <= BELL_COLS; col++) {
            const ic = (row * bellStride + col) * 3;
            bellNormals[ic] = 0;
            bellNormals[ic + 1] = -1;
            bellNormals[ic + 2] = 0;
          }
        } else {
          const nx = bellNormals[i0] + bellNormals[iLast];
          const ny = bellNormals[i0 + 1] + bellNormals[iLast + 1];
          const nz = bellNormals[i0 + 2] + bellNormals[iLast + 2];
          const nl = Math.hypot(nx, ny, nz) || 1.0;
          bellNormals[i0] = bellNormals[iLast] = nx / nl;
          bellNormals[i0 + 1] = bellNormals[iLast + 1] = ny / nl;
          bellNormals[i0 + 2] = bellNormals[iLast + 2] = nz / nl;
        }
      }
      bellGeo.attributes.normal.needsUpdate = true;

      // -----------------------------------------------------------------------
      // 2) Update 16 Radial Canals, Forked Lobe Canals, Ring Canal & 16 Rhopalia
      // -----------------------------------------------------------------------
      for (let p = 0; p < canalPaths.length; p++) {
        const path = canalPaths[p];
        const steps = path.steps;
        const rad = path.radius;

        for (let r = 0; r <= steps; r++) {
          const t = r / steps;
          const s0 = path.sample(t);
          evalBellSurface(s0.u, s0.theta, -0.08, swimTime, time, vTmpA);

          const dtStep = 0.02;
          const sNext = path.sample(Math.min(1.0, t + dtStep));
          const sPrev = path.sample(Math.max(0.0, t - dtStep));
          if (r < steps) {
            evalBellSurface(sNext.u, sNext.theta, -0.08, swimTime, time, vTmpB);
            vTmpT.subVectors(vTmpB, vTmpA).normalize();
          } else {
            evalBellSurface(sPrev.u, sPrev.theta, -0.08, swimTime, time, vTmpB);
            vTmpT.subVectors(vTmpA, vTmpB).normalize();
          }

          // Outward radial reference normal
          evalBellSurface(s0.u, s0.theta, 0.35, swimTime, time, vTmpB);
          vTmpN.subVectors(vTmpB, vTmpA).normalize();
          vTmpBin.crossVectors(vTmpT, vTmpN).normalize();
          vTmpN.crossVectors(vTmpBin, vTmpT).normalize();

          // Travelling metabolic light pulse racing outward along radial canals in sync with contraction
          const metabolicPulse = Math.pow(0.5 + 0.5 * Math.sin(s0.u * 9.0 - swimTime * Math.PI * 2.0), 3.0);
          let baseGlow = 0.95 + metabolicPulse * 1.45;
          let baseHue = 0.02 + s0.u * 0.58;
          if (path.type === 'cleft') {
            baseHue = (path.index % 2 === 0 ? 0.0 : 0.62) + s0.u * 0.18;
            baseGlow = 1.25 + metabolicPulse * 1.65;
          } else if (path.type === 'branch') {
            baseGlow = 0.8 + metabolicPulse * 1.1;
          } else if (path.type === 'ring') {
            baseHue = 0.58 + 0.12 * Math.sin(s0.theta * 8.0);
            baseGlow = 1.15 + metabolicPulse * 1.2;
          }

          for (let s = 0; s < CANAL_SIDES; s++) {
            const ang = (s / CANAL_SIDES) * Math.PI * 2.0;
            const ca = Math.cos(ang);
            const sa = Math.sin(ang);
            const nx = vTmpN.x * ca + vTmpBin.x * sa;
            const ny = vTmpN.y * ca + vTmpBin.y * sa;
            const nz = vTmpN.z * ca + vTmpBin.z * sa;

            const vIdx = (path.vOffset + r * CANAL_SIDES + s) * 3;
            canalPositions[vIdx] = vTmpA.x + nx * rad;
            canalPositions[vIdx + 1] = vTmpA.y + ny * rad;
            canalPositions[vIdx + 2] = vTmpA.z + nz * rad;
            canalNormals[vIdx] = nx;
            canalNormals[vIdx + 1] = ny;
            canalNormals[vIdx + 2] = nz;

            sumPulseGlow(
              vTmpA.x,
              vTmpA.y,
              vTmpA.z,
              true,
              time,
              baseHue,
              baseGlow,
              canalBiolum,
              vIdx
            );
          }
        }
      }
      canalGeo.attributes.position.needsUpdate = true;
      canalGeo.attributes.normal.needsUpdate = true;
      canalGeo.attributes.aBiolum.needsUpdate = true;

      // Update the 16 Rhopalia sensory bulbs in the 16 marginal clefts
      const rimFlash = Math.pow(Math.max(0, evalContractionWave(0.95, swimTime)), 1.5);
      for (let k = 0; k < NUM_LOBES; k++) {
        const thetaCleft = ((k + 0.5) / NUM_LOBES) * Math.PI * 2.0;
        evalBellSurface(0.955, thetaCleft, -0.05, swimTime, time, vTmpA);
        const rMesh = rhopaliaMeshes[k];
        rMesh.position.copy(vTmpA);

        let pulseBoost = 0;
        for (let pIdx = 0; pIdx < MAX_PULSES; pIdx++) {
          const p = pulses[pIdx];
          if (!p.active) continue;
          const d = Math.hypot(vTmpA.x - p.lx, vTmpA.y - p.ly, vTmpA.z - p.lz);
          const delta = (d - p.radius) / 0.85;
          if (Math.abs(delta) < 2.4) {
            pulseBoost += Math.exp(-delta * delta) * (1.0 - p.age / p.maxAge) * p.strength * 2.8;
          }
        }

        const huePhase = (k % 2 === 0 ? 0.64 : 0.03) + Math.sin(time * 0.7 + k) * 0.06;
        const glowArr = [0, 0, 0];
        evalBiolumPalette(huePhase, glowArr, 0, 1.85 + rimFlash * 2.1 + pulseBoost);
        rhopaliaMats[k].emissive.setRGB(glowArr[0], glowArr[1], glowArr[2]);
        rhopaliaMats[k].emissiveIntensity = 1.0;
      }

      // -----------------------------------------------------------------------
      // 3) Animate Internal Gonads & Stomach Core
      // -----------------------------------------------------------------------
      const organPulse = evalContractionWave(0.28, swimTime);
      const stPos = stomachGeo.attributes.position.array;
      const stBio = stomachGeo.attributes.aBiolum.array;
      for (let i = 0; i < stPos.length; i += 3) {
        const bx = stomachBasePos[i];
        const by = stomachBasePos[i + 1];
        const bz = stomachBasePos[i + 2];
        const sq = 1.0 - organPulse * 0.12;
        stPos[i] = bx * sq;
        stPos[i + 1] = 1.36 + (by - 1.36) * (1.0 + organPulse * 0.14);
        stPos[i + 2] = bz * sq;
        sumPulseGlow(stPos[i], stPos[i + 1], stPos[i + 2], true, time, 0.62, 1.15 + organPulse * 0.45, stBio, i);
      }
      stomachGeo.attributes.position.needsUpdate = true;
      stomachGeo.attributes.aBiolum.needsUpdate = true;

      for (let i = 0; i < gonadPos.length; i += 3) {
        const bx = gonadBasePos[i];
        const by = gonadBasePos[i + 1];
        const bz = gonadBasePos[i + 2];
        const breathe = 1.0 - organPulse * 0.11 + 0.03 * Math.sin(time * 2.8 + bx * 5.0);
        gonadPos[i] = bx * breathe;
        gonadPos[i + 1] = by + organPulse * 0.06;
        gonadPos[i + 2] = bz * breathe;
        const gHue = 0.66 + 0.12 * Math.sin(bx * 3.0 + bz * 3.0 + time * 0.6);
        sumPulseGlow(
          gonadPos[i],
          gonadPos[i + 1],
          gonadPos[i + 2],
          true,
          time,
          gHue,
          1.45 + Math.max(0, organPulse) * 0.85,
          gonadBiolum,
          i
        );
      }
      gonadGeo.attributes.position.needsUpdate = true;
      gonadGeo.attributes.aBiolum.needsUpdate = true;

      // Dynamic internal bioluminescent lights
      coreLight.intensity = 3.1 + Math.max(0, organPulse) * 1.6 + vortexEnergy * 0.9;
      gonadLight.intensity = 2.1 + rimFlash * 1.4 + vortexEnergy * 0.7;

      // -----------------------------------------------------------------------
      // 4) Update 4 Ruffled Spiral-Ribbon Oral Arms Geometry & Smooth Normals
      // -----------------------------------------------------------------------
      for (let a = 0; a < NUM_ARMS; a++) {
        const spineOffset = a * ARM_NODES;
        const vertOffset = a * armVertsPer;
        const armAngle = a * (Math.PI * 0.5);

        // Initial parallel-transport normal at root
        vTmpN.set(Math.cos(armAngle), 0, Math.sin(armAngle)).applyQuaternion(bellGroup.quaternion).normalize();

        for (let i = 0; i < ARM_NODES; i++) {
          const s = i / (ARM_NODES - 1);
          const idx = spineOffset + i;
          const cx = armPX[idx];
          const cy = armPY[idx];
          const cz = armPZ[idx];

          // Spine tangent T
          if (i < ARM_NODES - 1) {
            vTmpT.set(armPX[idx + 1] - cx, armPY[idx + 1] - cy, armPZ[idx + 1] - cz);
          } else {
            vTmpT.set(cx - armPX[idx - 1], cy - armPY[idx - 1], cz - armPZ[idx - 1]);
          }
          if (vTmpT.lengthSq() < 1e-8) vTmpT.set(0, -1, 0);
          else vTmpT.normalize();

          // Twist-free Gram-Schmidt parallel transport frame
          const dotNT = vTmpN.dot(vTmpT);
          vTmpN.addScaledVector(vTmpT, -dotNT);
          if (vTmpN.lengthSq() < 1e-6) {
            vTmpN.set(1, 0, 0).cross(vTmpT);
            if (vTmpN.lengthSq() < 1e-6) vTmpN.set(0, 0, 1).cross(vTmpT);
          }
          vTmpN.normalize();
          vTmpBin.crossVectors(vTmpT, vTmpN).normalize();

          // Graceful spiral twist along ribbon length
          const twist = s * Math.PI * 3.4 + a * Math.PI * 0.5 + 0.32 * Math.sin(s * 4.5 - time * 1.3);
          const ct = Math.cos(twist);
          const st = Math.sin(twist);
          const rx = vTmpN.x * ct + vTmpBin.x * st;
          const ry = vTmpN.y * ct + vTmpBin.y * st;
          const rz = vTmpN.z * ct + vTmpBin.z * st;
          const bx = -vTmpN.x * st + vTmpBin.x * ct;
          const by = -vTmpN.y * st + vTmpBin.y * ct;
          const bz = -vTmpN.z * st + vTmpBin.z * ct;

          // Organic Chrysaora oral-arm ribbon width envelope
          const widthEnv = 0.62 * Math.sin(Math.pow(s, 0.58) * Math.PI * 0.92 + 0.14) * (1.0 - 0.18 * s);

          for (let c = 0; c < ARM_COLS; c++) {
            const v = (c / (ARM_COLS - 1)) * 2.0 - 1.0; // -1 .. +1
            const absV = Math.abs(v);
            const edgeWeight = Math.pow(absV, 1.55);

            // Multi-harmonic curtain frills along outer ribbon edges
            const frill1 = Math.sin(s * 34.0 - time * 2.1 + a * 1.7 + (v > 0 ? 0.0 : 1.9));
            const frill2 = Math.sin(s * 68.0 - time * 3.1 + v * 2.6 + a);
            const normalRuffle = edgeWeight * widthEnv * (0.52 * frill1 + 0.24 * frill2);
            const tangRuffle = edgeWeight * widthEnv * 0.14 * Math.cos(s * 34.0 - time * 2.1 + a * 1.7);
            const span = v * widthEnv;

            const vx = cx + rx * span + bx * normalRuffle + vTmpT.x * tangRuffle;
            const vy = cy + ry * span + by * normalRuffle + vTmpT.y * tangRuffle;
            const vz = cz + rz * span + bz * normalRuffle + vTmpT.z * tangRuffle;

            const outIdx = (vertOffset + i * ARM_COLS + c) * 3;
            armPositions[outIdx] = vx;
            armPositions[outIdx + 1] = vy;
            armPositions[outIdx + 2] = vz;

            // Luminous ruffled frill edges & midrib bioluminescence + mouse pulse waves
            const midribGlow = Math.exp(-v * v * 18.0) * 0.28 * (1.0 - s * 0.5);
            const frillRimGlow = Math.pow(absV, 3.2) * (0.48 + 0.28 * Math.sin(s * 14.0 - time * 2.4 + a));
            const armHue = 0.68 - s * 0.42 + absV * 0.12;
            sumPulseGlow(
              vx,
              vy,
              vz,
              false,
              time,
              armHue,
              midribGlow + frillRimGlow,
              armBiolum,
              outIdx
            );
          }
        }
      }
      armGeo.attributes.position.needsUpdate = true;
      armGeo.attributes.aBiolum.needsUpdate = true;
      armGeo.computeVertexNormals();

      // -----------------------------------------------------------------------
      // 5) Update 24 Slender Marginal Tentacles Tube Mesh & Bioluminescence
      // -----------------------------------------------------------------------
      for (let t = 0; t < NUM_TENTACLES; t++) {
        const spineOffset = t * TENT_NODES;
        const vertOffset = t * tentVertsPer;
        const theta = tentThetas[t];

        vTmpN.set(Math.cos(theta), 0, Math.sin(theta));

        for (let j = 0; j < TENT_NODES; j++) {
          const s = j / (TENT_NODES - 1);
          const idx = spineOffset + j;
          const cx = tentPX[idx];
          const cy = tentPY[idx];
          const cz = tentPZ[idx];

          if (j < TENT_NODES - 1) {
            vTmpT.set(tentPX[idx + 1] - cx, tentPY[idx + 1] - cy, tentPZ[idx + 1] - cz);
          } else {
            vTmpT.set(cx - tentPX[idx - 1], cy - tentPY[idx - 1], cz - tentPZ[idx - 1]);
          }
          if (vTmpT.lengthSq() < 1e-8) vTmpT.set(0, -1, 0);
          else vTmpT.normalize();

          const dotNT = vTmpN.dot(vTmpT);
          vTmpN.addScaledVector(vTmpT, -dotNT);
          if (vTmpN.lengthSq() < 1e-6) {
            vTmpN.set(1, 0, 0).cross(vTmpT);
            if (vTmpN.lengthSq() < 1e-6) vTmpN.set(0, 0, 1).cross(vTmpT);
          }
          vTmpN.normalize();
          vTmpBin.crossVectors(vTmpT, vTmpN).normalize();

          // Slender tapering filament with delicate glowing nematocyst bead clusters
          const bead = 1.0 + 0.34 * Math.pow(0.5 + 0.5 * Math.sin(j * 2.35 + t), 4.0);
          const rad = (0.024 * Math.pow(1.0 - s, 0.72) + 0.0045) * bead;

          // Travelling bioluminescent shimmer cascading down each tentacle
          const tentShimmer = Math.pow(0.5 + 0.5 * Math.sin(s * 12.0 - time * 2.8 + tentPhases[t]), 4.0);
          const baseGlow = 0.36 + 0.55 * tentShimmer + (1.0 - s) * 0.25 + Math.pow(s, 3.0) * 0.45;
          const tHue = (t % 3 === 0 ? 0.64 : 0.04) + s * 0.32;

          for (let k = 0; k < TENT_SIDES; k++) {
            const ang = (k / TENT_SIDES) * Math.PI * 2.0;
            const ca = Math.cos(ang);
            const sa = Math.sin(ang);
            const nx = vTmpN.x * ca + vTmpBin.x * sa;
            const ny = vTmpN.y * ca + vTmpBin.y * sa;
            const nz = vTmpN.z * ca + vTmpBin.z * sa;

            const outIdx = (vertOffset + j * TENT_SIDES + k) * 3;
            tentPositions[outIdx] = cx + nx * rad;
            tentPositions[outIdx + 1] = cy + ny * rad;
            tentPositions[outIdx + 2] = cz + nz * rad;
            tentNormals[outIdx] = nx;
            tentNormals[outIdx + 1] = ny;
            tentNormals[outIdx + 2] = nz;

            sumPulseGlow(
              cx,
              cy,
              cz,
              false,
              time,
              tHue,
              baseGlow,
              tentBiolum,
              outIdx
            );
          }
        }
      }
      tentGeo.attributes.position.needsUpdate = true;
      tentGeo.attributes.normal.needsUpdate = true;
      tentGeo.attributes.aBiolum.needsUpdate = true;

      // -----------------------------------------------------------------------
      // 6) Update Abyssal Marine Snow Particles (reacts to vortex current!)
      // -----------------------------------------------------------------------
      for (let i = 0; i < SNOW_COUNT; i++) {
        const i3 = i * 3;
        let sx = snowPositions[i3];
        let sy = snowPositions[i3 + 1];
        let sz = snowPositions[i3 + 2];
        const ph = snowPhase[i];

        // Gentle abyssal current + mouse vortex swirl
        evalVortexCurrent(sx, sy, sz, fluidOut);
        snowVel[i3] = snowVel[i3] * 0.94 + fluidOut.x * 0.08;
        snowVel[i3 + 2] = snowVel[i3 + 2] * 0.94 + fluidOut.z * 0.08;

        sx += (Math.sin(time * 0.35 + ph) * 0.06 + snowVel[i3]) * dt;
        sy += (0.09 + 0.04 * Math.cos(ph) + fluidOut.y * 0.35) * dt;
        sz += (Math.cos(time * 0.31 + ph * 1.3) * 0.06 + snowVel[i3 + 2]) * dt;

        if (sy > 8.5) {
          sy = -8.2;
          const r = 1.6 + Math.pow(Math.random(), 0.7) * 14.5;
          const ang = Math.random() * Math.PI * 2.0;
          sx = Math.cos(ang) * r;
          sz = Math.sin(ang) * r;
        }
        snowPositions[i3] = sx;
        snowPositions[i3 + 1] = sy;
        snowPositions[i3 + 2] = sz;
      }
      snowGeo.attributes.position.needsUpdate = true;
    }

    // -------------------------------------------------------------------------
    // 15. Pre-Warm Fluid Simulation so Frame 0 is Hydrodynamically Settled
    // -------------------------------------------------------------------------
    {
      bellGroup.updateMatrixWorld(true);
      for (let w = 0; w < 45; w++) {
        const wt = w * 0.02;
        stepPhysics(0.02, wt, wt * 0.42);
      }
      updateMeshes(0, 0, 0.016);
    }

    // -------------------------------------------------------------------------
    // 16. Responsive Resize & Main Animation Loop
    // -------------------------------------------------------------------------
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
    }
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();
    let swimAccum = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.033);
      globalClockTime += dt;

      // Rhythmic abyssal pulsation (~0.40 Hz swim cycle, speeds up slightly when stirred!)
      const swimFreq = 0.40 + Math.min(0.18, vortexEnergy * 0.08);
      swimAccum += dt * swimFreq;

      stepPhysics(dt, globalClockTime, swimAccum);
      updateMeshes(globalClockTime, swimAccum, dt);

      controls.update();
      composer.render();
    }

    animate();
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
</body>
