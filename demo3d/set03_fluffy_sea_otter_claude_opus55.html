// ------------------------------------------------------------------ utils
const rand = Math.random;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
function basisQuat(zDir, yHint) { // local +Z -> zDir, local +Y ~ yHint
  const z = zDir.clone().normalize();
  const x = new THREE.Vector3().crossVectors(yHint, z).normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}
function basisQuatY(yDir, zHint) { // local +Y -> yDir
  const y = yDir.clone().normalize();
  const x = new THREE.Vector3().crossVectors(y, zHint).normalize();
  const z = new THREE.Vector3().crossVectors(x, y);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}
function basisQuatX(xDir, yHint) { // local +X -> xDir
  const x = xDir.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, yHint).normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}
function inEll(e, p, k) {
  const x = (p.x - e.c.x) / e.r.x, y = (p.y - e.c.y) / e.r.y, z = (p.z - e.c.z) / e.r.z;
  return x * x + y * y + z * z < k;
}

// ------------------------------------------------------------------ fur colours

};
function bodyColor(p, n, out) {
  out.copy(COL.dark);
  out.lerp(COL.choc, smooth(-0.6, 0.5, n.y));

  out.lerp(COL.cream, smooth(-0.1, 0.9, p.x) * smooth(-0.1, 0.55, n.y));
  out.lerp(COL.tan, smooth(0.6, 1.2, p.x) * smooth(-0.5, 0.2, n.y) * 0.7);
}
function headColor(p, n, out) {
  out.copy(COL.cream);
  out.lerp(COL.tan, smooth(0.15, -0.45, p.z) * 0.8);
  out.lerp(COL.white, smooth(0.35, 0.6, p.z) * smooth(0.1, -0.2, p.y) * 0.5);
  const ear = Math.min(p.distanceTo(EAR_L), p.distanceTo(EAR_R));
  out.lerp(COL.mid, smooth(0.25, 0.13, ear) * 0.6);
}
const muzzleColor = (p, n, out) => out.copy(COL.white);
const tailColor = (p, n, out) => out.copy(COL.dark).lerp(COL.choc, smooth(-0.5, 0.8, n.y) * 0.6);
const limbColor = (p, n, out) => out.copy(COL.dark).lerp(COL.choc, 0.35);
const armColor = (p, n, out) => out.copy(COL.choc).lerp(COL.mid, 0.25);

// ------------------------------------------------------------------ surface sampler / skin painter / fur
function buildSampler(meshes, parent) {
  parent.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(parent.matrixWorld).invert();
  const P = [], N = [], cum = []; let total = 0;
  const a = V3(), b = V3(), c = V3(), e1 = V3(), e2 = V3();
  for (const m of meshes) {
    m.updateMatrixWorld(true);
    const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld));
    const pa = g.attributes.position.array, na = g.attributes.normal.array;
    for (let i = 0; i + 8 < pa.length; i += 9) {
      a.fromArray(pa, i); b.fromArray(pa, i + 3); c.fromArray(pa, i + 6);
      e1.subVectors(b, a); e2.subVectors(c, a);
      const area = e1.cross(e2).length() * 0.5;
      if (area < 1e-10) continue;
      total += area; cum.push(total);
      for (let k = 0; k < 9; k++) { P.push(pa[i + k]); N.push(na[i + k]); }
    }
    g.dispose();
  }
  const Pa = new Float32Array(P), Na = new Float32Array(N), Ca = new Float64Array(cum);
  return function sample(outP, outN) {
    const r = rand() * total;
    let lo = 0, hi = Ca.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (Ca[mid] < r) lo = mid + 1; else hi = mid; }
    const o = lo * 9;
    let u = rand(), v = rand(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const w = 1 - u - v;
    outP.set(Pa[o] * w + Pa[o + 3] * u + Pa[o + 6] * v, Pa[o + 1] * w + Pa[o + 4] * u + Pa[o + 7] * v, Pa[o + 2] * w + Pa[o + 5] * u + Pa[o + 8] * v);
    outN.set(Na[o] * w + Na[o + 3] * u + Na[o + 6] * v, Na[o + 1] * w + Na[o + 4] * u + Na[o + 7] * v, Na[o + 2] * w + Na[o + 5] * u + Na[o + 8] * v).normalize();
  };
}

function paintSkin(mesh, parent, fn, mul) {
  const g = mesh.geometry, p = g.attributes.position, n = g.attributes.normal;
  const rel = new THREE.Matrix4().copy(parent.matrixWorld).invert().multiply(mesh.matrixWorld);
  const nm = new THREE.Matrix3().getNormalMatrix(rel);
  const cols = new Float32Array(p.count * 3);
  const v = V3(), nn = V3(), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(rel);
    nn.fromBufferAttribute(n, i).applyMatrix3(nm).normalize();
    fn(v, nn, c); c.multiplyScalar(mul);
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
}

const U_TIME = { value: 0 };
function makeFurMaterial() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, metalness: 0, envMapIntensity: 0.55 });
  const u = { uTime: U_TIME, uMouse: { value: V3(999, 999, 999) }, uStr: { value: 0 }, uBrush: { value: V3() }, uRad: { value: 0.34 } };
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = u.uTime; sh.uniforms.uMouse = u.uMouse; sh.uniforms.uStr = u.uStr;
    sh.uniforms.uBrush = u.uBrush; sh.uniforms.uRad = u.uRad;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; uniform vec3 uMouse; uniform float uStr; uniform vec3 uBrush; uniform float uRad;
        attribute vec3 aSurfN;
        varying float vH;`)
      .replace('#include <defaultnormal_vertex>', `#include <defaultnormal_vertex>
        transformedNormal = normalize( mix( transformedNormal, normalMatrix * aSurfN, 0.6 ) );`)
      .replace('#include <project_vertex>', `
        vH = position.y;
        vec4 mvPosition = instanceMatrix * vec4( transformed, 1.0 );
        vec3 fRoot = instanceMatrix[3].xyz;
        vec3 fAxis = instanceMatrix[1].xyz;
        float fLen = length( fAxis );
        vec3 fDir = fAxis / max( fLen, 1e-5 );
        float fH = position.y;
        float fH2 = fH * fH;
        vec3 toR = fRoot - uMouse;
        float dM = length( toR );
        float fall = exp( -( dM * dM ) / ( uRad * uRad ) ) * uStr;
        vec3 pushV = toR / max( dM, 1e-4 );
        pushV -= fDir * dot( pushV, fDir );
        vec3 brV = uBrush - fDir * dot( uBrush, fDir );
        vec3 bend = ( pushV * 1.1 + brV ) * fall;
        float sw = sin( uTime * 1.7 + fRoot.x * 6.0 + fRoot.z * 4.0 ) * 0.10 + sin( uTime * 2.9 + fRoot.y * 9.0 ) * 0.05;
        vec3 extra = vec3( sw, sw * 0.3, sw * 0.6 );
        extra += vec3( sin( fRoot.y * 37.0 + fRoot.z * 11.0 ), sin( fRoot.z * 41.0 + fRoot.x * 7.0 ), sin( fRoot.x * 43.0 + fRoot.y * 13.0 ) ) * 0.22;
        extra -= fDir * dot( extra, fDir );
        bend += extra;
        float bl = length( bend );
        if ( bl > 1.5 ) { bend *= 1.5 / bl; bl = 1.5; }
        mvPosition.xyz += ( bend - fDir * bl * 0.4 ) * fLen * fH2;
        mvPosition = modelViewMatrix * mvPosition;
        gl_Position = projectionMatrix * mvPosition;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vH;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb *= mix( 0.42, 1.18, smoothstep( 0.0, 1.0, vH ) );`);
  };
  return { mat, u };
}

const STRAND = new THREE.ConeGeometry(0.0115, 1, 4, 3, true);
STRAND.translate(0, 0.5, 0);
const UP = V3(0, 1, 0);
const furList = [];
let totalStrands = 0;

function makeFur(o) {
  const { parent, sources, count, reject, color, len, comb, combAmt = 0.7, jitter = 0.4, width = 1 } = o;
  const sample = buildSampler(sources, parent);
  const geo = STRAND.clone();
  const sn = new Float32Array(count * 3);
  const { mat, u } = makeFurMaterial();
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  const p = V3(), n = V3(), wp = V3(), d = V3(), cb = V3(), s = V3();
  const q = new THREE.Quaternion(), m4 = new THREE.Matrix4(), col = new THREE.Color();
  let i = 0, guard = 0;
  while (i < count && guard < count * 60) {
    guard++;
    sample(p, n);
    wp.copy(p).applyMatrix4(parent.matrixWorld);
    if (reject && reject(p, n, wp)) continue;
    const L = len(p, n);
    if (!(L > 0)) continue;
    comb(p, n, cb);
    cb.addScaledVector(n, -cb.dot(n));
    if (cb.lengthSq() > 1e-8) cb.normalize();
    s.set(rand() - 0.5, rand() - 0.5, rand() - 0.5).multiplyScalar(jitter * 2);
    d.copy(n).addScaledVector(cb, combAmt).add(s).normalize();
    const dn = d.dot(n);
    if (dn < 0.3) d.addScaledVector(n, 0.3 - dn).normalize();
    q.setFromUnitVectors(UP, d);
    const w = width * (0.7 + rand() * 0.65);
    s.set(w, L * (0.75 + rand() * 0.5), w);
    p.addScaledVector(n, -0.004);
    m4.compose(p, q, s);
    mesh.setMatrixAt(i, m4);
    color(p, n, col);
    col.multiplyScalar(0.85 + rand() * 0.3);
    mesh.setColorAt(i, col);
    sn[i * 3] = n.x; sn[i * 3 + 1] = n.y; sn[i * 3 + 2] = n.z;
    i++;
  }
  if (i === 0) { mesh.setColorAt(0, col.set(0xffffff)); }
  mesh.count = i;
  geo.setAttribute('aSurfN', new THREE.InstancedBufferAttribute(sn, 3));
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.frustumCulled = false;
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  parent.add(mesh);
  furList.push({ mesh, u });
  totalStrands += i;
  return mesh;
}

// ------------------------------------------------------------------ otter build
const otter = new THREE.Group();
scene.add(otter);
const chest = new THREE.Group();
otter.add(chest);
const hitMeshes = [];
function mk(geo, mat, parent, pos, scl, hit = true) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (scl) m.scale.set(scl[0], scl[1], scl[2]);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  if (hit) hitMeshes.push(m);
  return m;
}

// body
const torso = mk(new THREE.SphereGeometry(1, 72, 48), skinMat, chest, [0, 0, 0], [1.25, 0.7, 0.82]);
const neck = mk(new THREE.SphereGeometry(1, 48, 32), skinMat, chest, [1.0, 0.3, 0], [0.62, 0.6, 0.64]);

// head
const headPivot = new THREE.Group();
headPivot.position.copy(HEAD_POS);
const headBaseQ = basisQuat(V3(-0.3, 0.65, 0.7), V3(1, 0.2, 0));
headPivot.quaternion.copy(headBaseQ);
otter.add(headPivot);
const head = mk(new THREE.SphereGeometry(0.58, 64, 48), skinMat, headPivot, [0, 0, 0], [1.06, 0.96, 1]);
const padL = mk(new THREE.SphereGeometry(0.17, 32, 24), skinMat, headPivot, PAD_L.toArray());
const padR = mk(new THREE.SphereGeometry(0.17, 32, 24), skinMat, headPivot, PAD_R.toArray());
const chin = mk(new THREE.SphereGeometry(0.13, 28, 20), skinMat, headPivot, CHIN.toArray(), [1.2, 0.8, 1]);

// diamond nose (rounded rhombus)
const noseGeo = new THREE.SphereGeometry(1, 32, 20);
{
  const pa = noseGeo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const x = pa.getX(i), y = pa.getY(i), z = pa.getZ(i);
    const r = Math.hypot(x, y);
    if (r > 1e-5) { const k = (Math.abs(x) + Math.abs(y)) / r; const f = 1 / Math.pow(k, 0.85); pa.setXYZ(i, x * f, y * f, z); }
  }
  noseGeo.computeVertexNormals();
}
const nose = mk(noseGeo, noseMat, headPivot, NOSE.toArray(), [0.085, 0.062, 0.05], false);
nose.rotation.x = -0.25;

// mouth "ω" + philtrum
const mouthArcGeo = new THREE.TorusGeometry(0.038, 0.0075, 6, 18, Math.PI);
const mouthL = mk(mouthArcGeo, mouthMat, headPivot, [-0.038, -0.13, 0.622], null, false);
mouthL.rotation.set(0, 0.4, Math.PI);
const mouthR = mk(mouthArcGeo, mouthMat, headPivot, [0.038, -0.13, 0.622], null, false);
mouthR.rotation.set(0, -0.4, Math.PI);
mk(new THREE.CylinderGeometry(0.005, 0.005, 0.075, 6), mouthMat, headPivot, [0, -0.095, 0.61], null, false);

// glossy eyes with dual catchlights
const eyes = [];
for (const s of [-1, 1]) {
  const eg = new THREE.Group();
  eg.position.copy(s < 0 ? EYE_L : EYE_R);
  eg.quaternion.copy(basisQuat(V3(s * 0.32, 0.12, 1), V3(0, 1, 0)));
  headPivot.add(eg);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.082, 32, 24), eyeMat);
  eg.add(eye);
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(0.021, 12, 10), catchMat);
  c1.position.set(-0.028, 0.034, 0.066); c1.scale.z = 0.45; eg.add(c1);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.011, 10, 8), catchMat);
  c2.position.set(0.03, -0.027, 0.069); c2.scale.z = 0.45; eg.add(c2);
  eyes.push(eg);
}

// rounded ears
for (const s of [-1, 1]) {
  const e = mk(new THREE.SphereGeometry(0.1, 20, 16), earMat, headPivot, (s < 0 ? EAR_L : EAR_R).toArray(), [0.95, 1, 0.5]);
  e.quaternion.copy(basisQuat(V3(s, 0.35, 0.15), V3(0, 1, 0)));
}

// vibrissae whiskers
const whiskerGroups = [];
for (const s of [-1, 1]) {
  const g = new THREE.Group();
  g.position.set(s * 0.18, -0.1, 0.58);
  headPivot.add(g);
  for (let k = 0; k < 10; k++) {
    const row = Math.floor(k / 3) % 4, ci = k % 3;
    const start = V3(s * (0.0 + ci * 0.025), 0.03 - row * 0.03, 0.02 - ci * 0.012);
    const e = 0.34 - k * 0.07;
    const L = 0.48 + rand() * 0.14 - row * 0.03;
    const dir = V3(s * Math.cos(e), Math.sin(e) * 0.8, 0.35).normalize();
    const p1 = start.clone().addScaledVector(dir, L * 0.5).add(V3(0, 0.02, 0.03));
    const p2 = start.clone().addScaledVector(dir, L).add(V3(0, -0.06 - row * 0.02, -0.04));
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([start, p1, p2]), 14, 0.0042, 4, false), whiskerMat);
    g.add(tube);
  }

function makeValve(dome, sign) {
  const SA = 120, SR = 40, NR = 17, AM = 1.18;
  const vc = (SR + 1) * (SA + 1);
  const pos = new Float32Array(vc * 3), col = new Float32Array(vc * 3), idx = [];
  const cH = new THREE.Color(0x6e3a8e), cE = new THREE.Color(0xf28ab6), cR = new THREE.Color(0xffd3ea), cW = new THREE.Color(0xfff2f6), c = new THREE.Color();
  let k = 0;
  for (let i = 0; i <= SR; i++) {
    const t = i / SR;
    for (let j = 0; j <= SA; j++) {
      const u = j / SA, a = -AM + 2 * AM * u;
      const rib = 0.5 + 0.5 * Math.cos(u * NR * 2 * Math.PI);
      const outline = 1 - 0.12 * Math.pow(Math.abs(a) / AM, 3);
      const R = t * outline;
      const prof = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(t, 0.85))), 0.7) * (1 - 0.35 * (a / AM) * (a / AM));
      const y = 0.025 * (rib - 0.5) * t * t + sign * (dome * prof + (sign > 0 ? 0.04 : 0.02) * rib * Math.pow(t, 0.7) * (1 - t * t * t));
      pos[k * 3] = R * Math.sin(a); pos[k * 3 + 1] = y; pos[k * 3 + 2] = R * Math.cos(a);
      c.copy(cH).lerp(cE, Math.pow(t, 0.6)).lerp(cR, rib * 0.35 * t);
      if (((t * 10) % 1) < 0.1 && t > 0.15) c.multiplyScalar(0.82);
      if (sign < 0) c.lerp(cW, 0.3);

      k++;
    }
  }
  for (let i = 0; i < SR; i++) for (let j = 0; j < SA; j++) {
    const a = i * (SA + 1) + j, b = a + 1, cc = a + SA + 1, d = cc + 1;
    if (sign > 0) idx.push(a, cc, b, b, cc, d); else idx.push(a, b, cc, b, d, cc);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const clock = new THREE.Clock();

    const lift = gate * Math.pow(raw, 1.3) * 0.3 + (1 - gate) * (0.04 + 0.03 * Math.sin(t * 1.6 + i * 2));
    tmpE.set(0.05 * Math.sin(t * 1.1 + i), 0, lift);
    a.pivot.quaternion.copy(a.baseQ).multiply(tmpQ.setFromEuler(tmpE));
  });
  const ct = Math.cos(tapPhase);
  const impact = gate * Math.pow(Math.abs(ct), 16);
  shellGroup.position.y = SHELL_Y - 0.006 * impact;
  shellGroup.rotation.x = 0.03 * gate * ct * Math.pow(Math.abs(ct), 8) + shellKick * 0.12 * Math.sin(t * 25);

  // flipper wiggle / paddling
  const sp = 1 + hp * 1.2;
  legs.forEach((l, i) => {
    tmpE.set(Math.sin(t * 2.4 * sp + i * 1.7) * (0.18 + hp * 0.15), 0, Math.sin(t * 1.3 + i) * 0.08);
    l.pivot.quaternion.copy(l.baseQ).multiply(tmpQ.setFromEuler(tmpE));
    tmpE.set(Math.sin(t * 3.2 * sp + i * 2.1) * 0.35, Math.sin(t * 1.7 + i) * 0.15, 0);
    l.foot.quaternion.copy(l.footBaseQ).multiply(tmpQ.setFromEuler(tmpE));
  });

  // tail sway
  tailPivot.rotation.set(0, Math.sin(t * 1.1) * 0.2, -0.14 + Math.sin(t * 0.9) * 0.06);

  // water + shadows
  updateWater(t);
  blobGroup.position.set(ox - 0.1, -1.585, oz);
  blobGroup.rotation.y = otter.rotation.y;

  // fur uniforms in each fur mesh's local space
  scene.updateMatrixWorld();
  for (const f of furList) {
    f.mesh.worldToLocal(tmpA.copy(hitPoint));
    f.u.uMouse.value.copy(tmpA);
    f.mesh.worldToLocal(tmpB.copy(hitPoint).add(brush));
    f.u.uBrush.value.copy(tmpB).sub(tmpA);
    f.u.uStr.value = uS;
    f.u.uRad.value = uR;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</head>

<canvas id="c"></canvas>
