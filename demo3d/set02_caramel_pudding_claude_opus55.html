<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caramel Custard Pudding Jelly</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #e9dccd; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const TAU = Math.PI * 2;

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = makeBackdrop();

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(4.6, 3.3, 5.0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------------------------------------------------------------- lights (three-point)
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x8a6f5a, 0.35));
const key = new THREE.DirectionalLight(0xfff0dc, 2.6);
key.position.set(4.5, 7.5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3.6; key.shadow.camera.right = 3.6;
key.shadow.camera.top = 3.6; key.shadow.camera.bottom = -3.6;
key.shadow.camera.near = 1; key.shadow.camera.far = 22;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.025;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdbe6ff, 0.7);
fill.position.set(-6, 3, 2.5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.9);
rim.position.set(-1.5, 4.5, -6);
scene.add(rim);

// ---------------------------------------------------------------- helpers
let seed = 1337;
function rand() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function sstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

function grid(rows, cols, wrap, fn) {
  const pos = new Float32Array(rows * cols * 3);
  let k = 0;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const p = fn(i, j);
    pos[k++] = p[0]; pos[k++] = p[1]; pos[k++] = p[2];
  }
  const idx = [];
  const jm = wrap ? cols : cols - 1;
  for (let i = 0; i < rows - 1; i++) for (let j = 0; j < jm; j++) {
    const jn = (j + 1) % cols;
    const a = i * cols + j, b = (i + 1) * cols + j, c = (i + 1) * cols + jn, d = i * cols + jn;
    idx.push(a, d, b, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeBackdrop() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(256, 210, 0, 256, 256, 430);
  gr.addColorStop(0, '#fbf4ea');
  gr.addColorStop(0.55, '#efe1cf');
  gr.addColorStop(1, '#c4ab93');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function blobTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,1)');
  gr.addColorStop(0.42, 'rgba(0,0,0,0.6)');
  gr.addColorStop(0.75, 'rgba(0,0,0,0.18)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

// ---------------------------------------------------------------- jelly deformation shader
const H = 1.35, RB = 1.12, RT = 0.82, A = 0.045, NF = 12;

const JU = {
  uTime: { value: 0 },
  uH: { value: H },
  uShear: { value: new THREE.Vector2() },
  uShear2: { value: new THREE.Vector2() },
  uSquash: { value: 0 },
  uHits: { value: [new THREE.Vector4(0, 0, 0, -100), new THREE.Vector4(0, 0, 0, -100), new THREE.Vector4(0, 0, 0, -100), new THREE.Vector4(0, 0, 0, -100)] },
  uAmps: { value: [0, 0, 0, 0] }
};

const JELLY_HEAD = /* glsl */`
uniform float uTime;
uniform float uH;
uniform vec2 uShear;
uniform vec2 uShear2;
uniform float uSquash;
uniform vec4 uHits[4];
uniform float uAmps[4];
vec3 jellyDeform(vec3 p) {
  float h = clamp(p.y / uH, 0.0, 1.7);
  vec3 q = p;
  vec3 c = vec3(0.0, uH * 0.42, 0.0);
  vec3 rd = q - c;
  float rl = length(rd);
  rd = rl > 1e-4 ? rd / rl : vec3(0.0, 1.0, 0.0);
  float rip = 0.0;
  for (int i = 0; i < 4; i++) {
    float age = uTime - uHits[i].w;
    if (age > 0.0 && age < 5.0) {
      float d = distance(p, uHits[i].xyz);
      float front = clamp((age * 1.6 - d) * 5.0 + 1.0, 0.0, 1.0);
      rip += uAmps[i] * exp(-age * 1.7) * exp(-d * 0.9) * sin(d * 11.0 - age * 17.0) * front;
    }
  }
  float glue = smoothstep(0.0, 0.22, h);
  q += rd * rip * glue;
  float s = uSquash;
  float g = smoothstep(0.0, 0.55, h);
  q.y *= (1.0 + s);
  q.xz *= (1.0 - 0.5 * s * g);
  float w1 = h * h;
  float hh = min(h, 1.25);
  float w2 = hh * (1.0 - hh) * 4.0;
  q.xz += uShear * w1 + uShear2 * w2;
  q.y -= 0.3 * dot(uShear, uShear) * w1 / uH;
  return q;
}
vec3 jellyNormal(vec3 p, vec3 n) {
  vec3 t = normalize(abs(n.y) < 0.95 ? cross(n, vec3(0.0, 1.0, 0.0)) : cross(n, vec3(1.0, 0.0, 0.0)));
  vec3 b = cross(n, t);
  float e = 0.01;
  vec3 d0 = jellyDeform(p);
  vec3 dt = jellyDeform(p + t * e) - d0;
  vec3 db = jellyDeform(p + b * e) - d0;
  vec3 nn = cross(dt, db);
  float l = length(nn);
  return l > 1e-9 ? nn / l : n;
}
`;

const GLOW_FRAG_HEAD = /* glsl */`
uniform float uTime;
varying vec3 vJP;
float jellyCaustic(vec3 p) {
  float t = uTime * 0.7;
  vec3 q = p * 5.0;
  float c = sin(q.x + 1.6 * sin(q.z * 1.3 + t) + 0.7 * q.y)
          + sin(q.z * 1.1 + 1.6 * sin(q.x * 0.9 - t * 1.2) - 0.5 * q.y)
          + sin((q.x + q.z) * 0.8 + 1.4 * sin(q.y * 1.7 + t * 0.8));
  c /= 3.0;
  return pow(1.0 - abs(c), 10.0);
}
`;

const GLOW_FRAG_BODY = /* glsl */`
#include <emissivemap_fragment>
{
  vec3 vdirJ = normalize(vViewPosition);
  float ndvJ = clamp(dot(normal, vdirJ), 0.0, 1.0);
  float rimJ = pow(1.0 - ndvJ, 2.0);
  float hyJ = clamp(vJP.y / 1.4, 0.0, 1.0);
  float caJ = jellyCaustic(vJP);
  vec3 sssJ = vec3(1.0, 0.52, 0.10) * (0.07 + 0.30 * rimJ) * (0.7 + 0.5 * (1.0 - hyJ));
  totalEmissiveRadiance += sssJ + vec3(1.0, 0.78, 0.38) * caJ * (0.10 + 0.25 * ndvJ);
}
`;

function patchJelly(mat, glow) {
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, JU);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + JELLY_HEAD + (glow ? '\nvarying vec3 vJP;\n' : ''))
      .replace('#include <beginnormal_vertex>',
        'vec3 objectNormal = jellyNormal(position, normal);\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3( tangent.xyz );\n#endif')
      .replace('#include <begin_vertex>', 'vec3 transformed = jellyDeform(position);' + (glow ? '\nvJP = transformed;' : ''));
    if (glow) {
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\n' + GLOW_FRAG_HEAD)
        .replace('#include <emissivemap_fragment>', GLOW_FRAG_BODY);
    }
  };
  mat.customProgramCacheKey = () => 'jelly_' + (glow ? 'glow' : 'plain') + '_' + mat.type;
  return mat;
}

const jellyDepth = patchJelly(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), false);

// ---------------------------------------------------------------- materials
const puddingMat = patchJelly(new THREE.MeshPhysicalMaterial({
  color: 0xffc94f, roughness: 0.16, metalness: 0,
  transmission: 0.55, thickness: 1.4, ior: 1.38,
  attenuationColor: 0xffa01a, attenuationDistance: 0.9,
  clearcoat: 0.7, clearcoatRoughness: 0.12,
  sheen: 0.25, sheenColor: 0xfff0c0, specularIntensity: 0.85
}), true);

const caramelMat = patchJelly(new THREE.MeshPhysicalMaterial({
  color: 0x5a2204, roughness: 0.06, metalness: 0,
  clearcoat: 1.0, clearcoatRoughness: 0.02, ior: 1.5,
  sheen: 0.25, sheenColor: 0xc46a1a, specularIntensity: 1.0,
  emissive: 0x1a0700, envMapIntensity: 1.2
}), false);

const creamMat = patchJelly(new THREE.MeshPhysicalMaterial({
  color: 0xfffaf2, roughness: 0.6, metalness: 0,
  sheen: 0.5, sheenRoughness: 0.6, sheenColor: 0xffffff,
  clearcoat: 0.05, emissive: 0x15110b, side: THREE.DoubleSide
}), false);

const cherryMat = patchJelly(new THREE.MeshPhysicalMaterial({
  color: 0x8c0012, roughness: 0.14, metalness: 0,
  clearcoat: 1.0, clearcoatRoughness: 0.03,
  sheen: 0.3, sheenColor: 0xff6070, emissive: 0x220003, envMapIntensity: 1.3
}), false);

const stemMat = patchJelly(new THREE.MeshPhysicalMaterial({
  color: 0x4f6b1c, roughness: 0.45, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.3
}), false);

const plateMat = new THREE.MeshPhysicalMaterial({
  color: 0xfbfbf8, roughness: 0.12, metalness: 0,
  clearcoat: 1.0, clearcoatRoughness: 0.05, side: THREE.DoubleSide
});

const poolMat = new THREE.MeshPhysicalMaterial({
  color: 0xb5530f, roughness: 0.04, metalness: 0,
  transmission: 0.7, thickness: 0.08, ior: 1.48,
  attenuationColor: 0x8a3a05, attenuationDistance: 0.15,
  clearcoat: 1.0, clearcoatRoughness: 0.02
});

// ---------------------------------------------------------------- pudding profile (scalloped frustum)
const flute = (u) => Math.cos(NF * u) - 0.18 * Math.cos(2 * NF * u);
const prof = [];
const sideDir = (() => { const dx = RB - RT, dy = -H; const l = Math.hypot(dx, dy); return [dx / l, dy / l]; })();
const rB = 0.14, rC = 0.05;
const Bc = [RT, H], Cc = [RB, 0];
const B1 = [RT - rB, H], B2 = [RT + sideDir[0] * rB, H + sideDir[1] * rB];
const C1 = [RB - sideDir[0] * rC, -sideDir[1] * rC], C2 = [RB - rC, 0];
for (let i = 0; i <= 18; i++) { const r = B1[0] * i / 18; prof.push([r, H + 0.014 * (1 - (r / B1[0]) ** 2)]); }
function quad(p0, c, p1, n) {
  for (let i = 1; i <= n; i++) {
    const t = i / n, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, d = t * t;
    prof.push([a * p0[0] + b * c[0] + d * p1[0], a * p0[1] + b * c[1] + d * p1[1]]);
  }
}
function line(p0, p1, n) {
  for (let i = 1; i <= n; i++) { const t = i / n; prof.push([p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t]); }
}
quad(B1, Bc, B2, 16); const iB2 = prof.length - 1;
line(B2, C1, 56); const iC1 = prof.length - 1;
quad(C1, Cc, C2, 8); const iC2 = prof.length - 1;
line(C2, [0, 0], 8);
const sArr = [0];
for (let i = 1; i < prof.length; i++) sArr.push(sArr[i - 1] + Math.hypot(prof[i][0] - prof[i - 1][0], prof[i][1] - prof[i - 1][1]));
const sB2 = sArr[iB2], sC1 = sArr[iC1], sC2 = sArr[iC2], sTot = sArr[sArr.length - 1];

function profAt(s) {
  if (s <= 0) return prof[0];
  if (s >= sTot) return prof[prof.length - 1];
  let lo = 0, hi = sArr.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (sArr[m] <= s) lo = m; else hi = m; }
  const t = (s - sArr[lo]) / ((sArr[hi] - sArr[lo]) || 1);
  return [prof[lo][0] + (prof[hi][0] - prof[lo][0]) * t, prof[lo][1] + (prof[hi][1] - prof[lo][1]) * t];
}
function surf(s, u) {
  const p = profAt(s);
  const R = p[0] * (1 + A * flute(u));
  return [R * Math.cos(u), p[1], R * Math.sin(u)];
}
function surfN(s, u) {
  const e = 0.004;
  const ps1 = surf(s + e, u), ps0 = surf(Math.max(0, s - e), u);
  const pu1 = surf(s, u + e), pu0 = surf(s, u - e);
  const a = [pu1[0] - pu0[0], pu1[1] - pu0[1], pu1[2] - pu0[2]];
  const b = [ps1[0] - ps0[0], ps1[1] - ps0[1], ps1[2] - ps0[2]];
  const n = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const l = Math.hypot(n[0], n[1], n[2]);
  if (l < 1e-10) return [0, 1, 0];
  return [n[0] / l, n[1] / l, n[2] / l];
}

// ---------------------------------------------------------------- jelly group
const jelly = new THREE.Group();
jelly.position.y = 0.003;
scene.add(jelly);

function addJellyMesh(geo, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = receive;
  m.customDepthMaterial = jellyDepth;
  jelly.add(m);
  return m;
}

// pudding body
const PCOLS = 192;
const puddingGeo = grid(prof.length, PCOLS, true, (i, j) => {
  const u = j / PCOLS * TAU;
  const p = prof[i];
  const R = p[0] * (1 + A * flute(u));
  return [R * Math.cos(u), p[1], R * Math.sin(u)];
});
const pudding = addJellyMesh(puddingGeo, puddingMat);

// caramel cap
const capEnd = (u) => sB2 + 0.07 + 0.045 * Math.sin(3 * u + 0.7) + 0.03 * Math.sin(7 * u + 2.1) + 0.02 * Math.sin(11 * u);
const CAPR = 64;
const capGeo = grid(CAPR, PCOLS, true, (i, j) => {
  const u = j / PCOLS * TAU;
  const se = capEnd(u);
  const s = se * i / (CAPR - 1);
  const p = surf(s, u), n = surfN(s, u);
  const off = 0.006 + 0.026 * (1 - sstep(se - 0.15, se, s));
  return [p[0] + n[0] * off, p[1] + n[1] * off, p[2] + n[2] * off];
});
const cap = addJellyMesh(capGeo, caramelMat);

// caramel drips running down the flute valleys
const dripDefs = [
  { k: 0, long: true }, { k: 1, long: false, len: 0.55 }, { k: 3, long: true }, { k: 4, long: false, len: 0.34 },
  { k: 6, long: true }, { k: 7, long: true }, { k: 9, long: false, len: 0.72 }, { k: 10, long: true }
];
const drips = [];
const longAngles = [];
for (const d of dripDefs) {
  const uc = (2 * d.k + 1) * Math.PI / NF;
  if (d.long) longAngles.push(uc);
  const w0 = 0.05 + 0.018 * rand();
  const th0 = 0.028 + 0.012 * rand();
  const sStart = sB2 - 0.06;
  const sStop = d.long ? sC2 : sB2 + d.len * (sC1 - sB2);
  const ROWS = 72, COLS = 15;
  const geo = grid(ROWS, COLS, false, (i, j) => {
    const t = i / (ROWS - 1);
    const v = -1 + 2 * j / (COLS - 1);
    const s = sStart + t * (sStop - sStart);
    let hw = w0 * (0.78 + 0.32 * t);
    let th = th0;
    hw *= 1 + 1.0 * (1 - sstep(0, 0.12, t));
    if (d.long) {
      hw *= 1 + 1.2 * sstep(0.82, 1, t);
      th *= 1 - 0.3 * sstep(0.85, 1, t);
    } else {
      const bulb = Math.exp(-Math.pow((t - 0.88) / 0.07, 2));
      hw *= 1 + 0.65 * bulb;
      th *= 1 + 0.9 * bulb;
      if (t > 0.9) { const e = Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.9) / 0.1, 2))); hw *= e; th *= e; }
    }
    const pr = Math.max(profAt(s)[0], 0.2);
    const u = uc + v * hw / pr;
    const p = surf(s, u), n = surfN(s, u);
    const bump = th * Math.pow(Math.max(0, 1 - v * v), 0.6) + 0.004;
    return [p[0] + n[0] * bump, p[1] + n[1] * bump, p[2] + n[2] * bump];
  });
  drips.push(addJellyMesh(geo, caramelMat));
}

// whipped cream rosette (star-tip spiral)
const capTop = H + 0.014 + 0.032;
function creamP(t) {
  const th = t * 2.75 * TAU + 0.3;
  const rr = 0.37 * Math.pow(1 - t, 0.9) + 0.012;
  const y = capTop + 0.06 + t * 0.36 + Math.pow(t, 7) * 0.17;
  return new THREE.Vector3(rr * Math.cos(th), y, rr * Math.sin(th));
}
function creamR(t) {
  let r = 0.13 * (1 - 0.55 * t);
  r *= Math.sqrt(Math.min(1, t / 0.035));
  if (t > 0.8) r *= Math.sqrt(Math.max(0, 1 - (t - 0.8) / 0.2));
  return r;
}
const CR_ROWS = 300, CR_COLS = 40;
const cP = [], cN = [], cB = [], cRad = [];
const UP = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < CR_ROWS; i++) {
  const t = i / (CR_ROWS - 1);
  const P = creamP(t);
  const T = creamP(Math.min(1, t + 0.002)).sub(creamP(Math.max(0, t - 0.002))).normalize();
  const Bv = UP.clone().addScaledVector(T, -T.y).normalize();
  const Nv = new THREE.Vector3().crossVectors(T, Bv).normalize();
  cP.push(P); cN.push(Nv); cB.push(Bv); cRad.push(creamR(t));
}
const creamGeo = grid(CR_ROWS, CR_COLS, true, (i, j) => {
  const phi = j / CR_COLS * TAU;
  const t = i / (CR_ROWS - 1);
  const rho = cRad[i] * (1 + 0.18 * Math.cos(8 * phi + t * 5.0));
  const P = cP[i], N = cN[i], Bv = cB[i];
  const cx = Math.cos(phi) * rho, sy = Math.sin(phi) * rho * 0.9;
  return [P.x + N.x * cx + Bv.x * sy, P.y + N.y * cx + Bv.y * sy, P.z + N.z * cx + Bv.z * sy];
});
const cream = addJellyMesh(creamGeo, creamMat);

// maraschino cherry
const CHR = 0.17;
const cherryY = capTop + 0.55;
let cherryGeo = new THREE.SphereGeometry(CHR, 64, 48);
cherryGeo.deleteAttribute('normal');
cherryGeo.deleteAttribute('uv');
cherryGeo = mergeVertices(cherryGeo);
{
  const pa = cherryGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pa.count; i++) {
    v.fromBufferAttribute(pa, i).normalize();
    const theta = Math.acos(THREE.MathUtils.clamp(v.y, -1, 1));
    let k = 1 - 0.22 * Math.exp(-(theta * theta) / 0.06);
    k *= 1 - 0.05 * Math.exp(-Math.pow(Math.PI - theta, 2) / 0.3);
    pa.setXYZ(i, v.x * CHR * k * 1.04, v.y * CHR * k * 0.95 + cherryY, v.z * CHR * k);
  }
  cherryGeo.computeVertexNormals();
}
const cherry = addJellyMesh(cherryGeo, cherryMat);

const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.0, cherryY + 0.10, 0.0),
  new THREE.Vector3(0.005, cherryY + 0.20, 0.0),
  new THREE.Vector3(0.03, cherryY + 0.32, 0.01),
  new THREE.Vector3(0.09, cherryY + 0.42, 0.03),
  new THREE.Vector3(0.17, cherryY + 0.48, 0.05),
  new THREE.Vector3(0.25, cherryY + 0.50, 0.06)
]);
const stem = addJellyMesh(new THREE.TubeGeometry(stemCurve, 64, 0.011, 10, false), stemMat);
const stemEndGeo = new THREE.SphereGeometry(0.012, 12, 10);
stemEndGeo.translate(0.25, cherryY + 0.50, 0.06);
addJellyMesh(stemEndGeo, stemMat);

// ---------------------------------------------------------------- caramel syrup pool
function angDist(a, b) { let d = (a - b) % TAU; if (d < -Math.PI) d += TAU; if (d > Math.PI) d -= TAU; return d; }
function poolOuter(u) {
  let r = RB * (1 + A * flute(u)) + 0.16 + 0.06 * Math.sin(3 * u + 0.4) + 0.04 * Math.sin(5 * u + 2.0) + 0.025 * Math.sin(9 * u + 1.0);
  for (const a of longAngles) { const d = angDist(u, a); r += 0.15 * Math.exp(-(d * d) / (0.16 * 0.16)); }
  return Math.min(r, 1.62);
}
const POOLR = 28, POOLC = 240;
const poolGeo = grid(POOLR, POOLC, true, (i, j) => {
  const t = 1 - Math.pow(1 - i / (POOLR - 1), 2);
  const u = j / POOLC * TAU;
  const rin = RB * 0.9, rout = poolOuter(u);
  const r = rin + (rout - rin) * t;
  const y = 0.003 + 0.03 * Math.sqrt(Math.max(0, 1 - Math.pow(t, 4)));
  return [r * Math.cos(u), y, r * Math.sin(u)];
});
const pool = new THREE.Mesh(poolGeo, poolMat);
pool.receiveShadow = true;
scene.add(pool);

// ---------------------------------------------------------------- plate
const platePts = [new THREE.Vector2(0, 0), new THREE.Vector2(0.5, 0)];
const plateSpline = new THREE.SplineCurve([
  [1.0, 0], [1.6, 0], [1.95, 0.025], [2.2, 0.11], [2.38, 0.175], [2.47, 0.192], [2.535, 0.172],
  [2.53, 0.138], [2.42, 0.108], [2.12, 0.045], [1.78, -0.025], [1.52, -0.07], [1.46, -0.112],
  [1.4, -0.125], [1.33, -0.11], [1.25, -0.085], [0.7, -0.072], [0, -0.07]
].map(p => new THREE.Vector2(p[0], p[1])));
platePts.push(...plateSpline.getPoints(240).map(p => new THREE.Vector2(Math.max(0, p.x), p.y)));
const plate = new THREE.Mesh(new THREE.LatheGeometry(platePts, 160), plateMat);
plate.castShadow = true;
plate.receiveShadow = true;
scene.add(plate);

// ---------------------------------------------------------------- ground + contact shadows
const GROUND = -0.128;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.18, color: 0x3b2410 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = GROUND;
ground.receiveShadow = true;
scene.add(ground);

const blob = blobTexture();
const plateContact = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 6.4), new THREE.MeshBasicMaterial({
  map: blob, transparent: true, opacity: 0.5, color: 0x2a1a0e, depthWrite: false
}));
plateContact.rotation.x = -Math.PI / 2;
plateContact.position.y = GROUND + 0.001;
scene.add(plateContact);

const puddingContact = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 3.0), new THREE.MeshBasicMaterial({
  map: blob, transparent: true, opacity: 0.42, color: 0x2a1200, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2
}));
puddingContact.rotation.x = -Math.PI / 2;
puddingContact.position.y = 0.0015;
scene.add(puddingContact);

// ---------------------------------------------------------------- spring-damper physics
const S = new THREE.Vector2(), V = new THREE.Vector2();
const S2 = new THREE.Vector2(), V2 = new THREE.Vector2();
const target = new THREE.Vector2();
let q = 0, qv = 0;
const K1 = 170, C1 = 2.4, K2 = 520, C2 = 5.0, KQ = 300, CQ = 4.2;

function step(h) {
  const a1x = -K1 * (S.x - target.x) - C1 * V.x;
  const a1y = -K1 * (S.y - target.y) - C1 * V.y;
  V.x += a1x * h; V.y += a1y * h;
  if (V.length() > 3.0) V.setLength(3.0);
  S.x += V.x * h; S.y += V.y * h;
  if (S.length() > 0.5) S.setLength(0.5);
  const a2x = -K2 * S2.x - C2 * V2.x - 0.35 * a1x;
  const a2y = -K2 * S2.y - C2 * V2.y - 0.35 * a1y;
  V2.x += a2x * h; V2.y += a2y * h;
  S2.x += V2.x * h; S2.y += V2.y * h;
  if (S2.length() > 0.2) S2.setLength(0.2);
  const aq = -KQ * q - CQ * qv;
  qv += aq * h;
  q += qv * h;
  q = THREE.MathUtils.clamp(q, -0.25, 0.25);
}

let now = 0;
let hitIdx = 0;
function addRipple(local, amp) {
  JU.uHits.value[hitIdx].set(local.x, local.y, local.z, now);
  JU.uAmps.value[hitIdx] = amp;
  hitIdx = (hitIdx + 1) % 4;
}

// ---------------------------------------------------------------- interaction (registered before OrbitControls)
const raycaster = new THREE.Raycaster();
const pickables = [pudding, cap, cream, cherry, stem, ...drips];
let lastNdc = null, lastRip = 0, dragging = false, lastInteract = -10;
const dragPlane = new THREE.Plane();
const dragStart = new THREE.Vector3();
const camRight = new THREE.Vector3(), camFwd = new THREE.Vector3();

function toNdc(e) {
  const r = canvas.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pickAt(nd) {
  raycaster.setFromCamera(nd, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0] : null;
}

canvas.addEventListener('pointerdown', (e) => {
  const nd = toNdc(e);
  const h = pickAt(nd);
  lastNdc = nd;
  if (!h) return;
  controls.enabled = false;
  dragging = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  canvas.style.cursor = 'grabbing';
  const local = jelly.worldToLocal(h.point.clone());
  addRipple(local, 0.065);
  const radial = new THREE.Vector2(local.x, local.z);
  const rl = radial.length();
  const topness = local.y > H * 0.92 ? THREE.MathUtils.clamp(1 - rl / 0.9, 0.35, 1) : 0;
  if (rl > 1e-3) {
    radial.multiplyScalar(1 / rl);
    V.addScaledVector(radial, -1.7 * (1 - topness * 0.6));
    V2.addScaledVector(radial, 0.6);
  }
  qv -= 2.2 + 2.6 * topness;
  dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), h.point);
  dragStart.copy(h.point);
  lastInteract = now;
});

canvas.addEventListener('pointermove', (e) => {
  const nd = toNdc(e);
  if (dragging) {
    raycaster.setFromCamera(nd, camera);
    const p = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, p)) {
      p.sub(dragStart);
      target.set(p.x, p.z).multiplyScalar(0.55);
      if (target.length() > 0.42) target.setLength(0.42);
    }
    lastInteract = now;
  } else if (e.buttons === 0) {
    const h = pickAt(nd);
    canvas.style.cursor = h ? 'grab' : 'auto';
    if (h && lastNdc) {
      const dx = nd.x - lastNdc.x, dy = nd.y - lastNdc.y;
      const sp = Math.hypot(dx, dy);
      if (sp > 0.0005) {
        camRight.setFromMatrixColumn(camera.matrixWorld, 0); camRight.y = 0; camRight.normalize();
        camera.getWorldDirection(camFwd); camFwd.y = 0; camFwd.normalize();
        const ix = camRight.x * dx + camFwd.x * dy;
        const iz = camRight.z * dx + camFwd.z * dy;
        const gain = 12;
        V.x += THREE.MathUtils.clamp(ix * gain, -0.6, 0.6);
        V.y += THREE.MathUtils.clamp(iz * gain, -0.6, 0.6);
        qv -= Math.min(sp * 6, 0.5);
        if (now - lastRip > 0.12 && sp > 0.004) {
          addRipple(jelly.worldToLocal(h.point.clone()), Math.min(0.045, 0.012 + sp * 1.2));
          lastRip = now;
        }
        lastInteract = now;
      }
    }
  }
  lastNdc = nd;
});

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  controls.enabled = true;
  target.set(0, 0);
  qv += 1.2;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  canvas.style.cursor = 'grab';
  lastInteract = now;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { if (!dragging) canvas.style.cursor = 'auto'; });

// ---------------------------------------------------------------- controls
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.6, 0);
controls.minDistance = 3.2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let nextKick = 2.5;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1 / 30);
  now = clock.elapsedTime;
  JU.uTime.value = now;

  const n = 4, h = dt / n;
  for (let i = 0; i < n; i++) step(h);

  if (now > nextKick) {
    if (now - lastInteract > 3 && !dragging) {
      const a = Math.random() * TAU;
      V.x += Math.cos(a) * 0.45; V.y += Math.sin(a) * 0.45;
      qv -= 0.6;
    }
    nextKick = now + 3.5 + Math.random() * 3;
  }

  const ix = 0.022 * Math.sin(now * 3.9) + 0.007 * Math.sin(now * 7.3 + 1.2);
  const iz = 0.018 * Math.sin(now * 3.1 + 0.6) + 0.006 * Math.sin(now * 6.1);
  const iq = 0.011 * Math.sin(now * 5.2) + 0.004 * Math.sin(now * 9.1);
  JU.uShear.value.set(S.x + ix, S.y + iz);
  JU.uShear2.value.copy(S2);
  JU.uSquash.value = q + iq;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
