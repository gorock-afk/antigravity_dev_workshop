<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wobbly Translucent Caramel Custard Pudding</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #141113;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Renderer Setup ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- Scene & Camera ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x151214);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.2, 7.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.3, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent viewing from under table
    controls.minDistance = 3.5;
    controls.maxDistance = 14.0;

    // --- Procedural High-Quality Studio Environment Map ---
    function createStudioEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      const envCanvas = document.createElement('canvas');
      envCanvas.width = 1024;
      envCanvas.height = 512;
      const ctx = envCanvas.getContext('2d');

      // Warm ambient gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, envCanvas.height);
      bgGrad.addColorStop(0, '#2b2326');
      bgGrad.addColorStop(0.5, '#191418');
      bgGrad.addColorStop(1, '#0d0a0c');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, envCanvas.width, envCanvas.height);

      // Top softbox light
      const topLight = ctx.createRadialGradient(512, 100, 10, 512, 100, 260);
      topLight.addColorStop(0, 'rgba(255, 245, 230, 1.0)');
      topLight.addColorStop(0.5, 'rgba(255, 225, 190, 0.4)');
      topLight.addColorStop(1, 'rgba(255, 210, 170, 0)');
      ctx.fillStyle = topLight;
      ctx.fillRect(0, 0, envCanvas.width, envCanvas.height);

      // Warm Key Light (Right)
      const keyLight = ctx.createRadialGradient(820, 200, 20, 820, 200, 220);
      keyLight.addColorStop(0, 'rgba(255, 220, 170, 0.85)');
      keyLight.addColorStop(1, 'rgba(255, 180, 120, 0)');
      ctx.fillStyle = keyLight;
      ctx.fillRect(0, 0, envCanvas.width, envCanvas.height);

      // Soft Cool Rim/Fill Light (Left)
      const rimLight = ctx.createRadialGradient(200, 220, 20, 200, 220, 240);
      rimLight.addColorStop(0, 'rgba(200, 225, 255, 0.65)');
      rimLight.addColorStop(1, 'rgba(140, 175, 220, 0)');
      ctx.fillStyle = rimLight;
      ctx.fillRect(0, 0, envCanvas.width, envCanvas.height);

      const envTexture = new THREE.CanvasTexture(envCanvas);
      envTexture.mapping = THREE.EquirectangularReflectionMapping;
      const envRenderTarget = pmremGenerator.fromEquirectangular(envTexture);
      envTexture.dispose();
      pmremGenerator.dispose();
      return envRenderTarget.texture;
    }
    const studioEnvMap = createStudioEnvironment();
    scene.environment = studioEnvMap;

    // --- Studio 3-Point Lighting ---
    const hemiLight = new THREE.HemisphereLight(0xfff1e0, 0x221a20, 0.85);
    scene.add(hemiLight);

    const mainKeyLight = new THREE.DirectionalLight(0xffeed6, 2.6);
    mainKeyLight.position.set(4.5, 7.5, 4.0);
    mainKeyLight.castShadow = true;
    mainKeyLight.shadow.mapSize.width = 2048;
    mainKeyLight.shadow.mapSize.height = 2048;
    mainKeyLight.shadow.bias = -0.00015;
    mainKeyLight.shadow.camera.near = 1;
    mainKeyLight.shadow.camera.far = 20;
    mainKeyLight.shadow.camera.left = -4.5;
    mainKeyLight.shadow.camera.right = 4.5;
    mainKeyLight.shadow.camera.top = 4.5;
    mainKeyLight.shadow.camera.bottom = -4.5;
    mainKeyLight.shadow.radius = 2.5;
    scene.add(mainKeyLight);

    const fillLight = new THREE.DirectionalLight(0xbadfff, 0.95);
    fillLight.position.set(-5.0, 4.5, -2.5);
    scene.add(fillLight);

    const rimBackLight = new THREE.DirectionalLight(0xffaa55, 2.8);
    rimBackLight.position.set(-1.0, 5.0, -5.5);
    scene.add(rimBackLight);

    const warmUnderGlow = new THREE.PointLight(0xffaa33, 1.2, 5.0);
    warmUnderGlow.position.set(0, 0.4, 0);
    scene.add(warmUnderGlow);

    // ==========================================
    // 1. Table Top & Contact Shadow Ground
    // ==========================================
    const tableGeo = new THREE.PlaneGeometry(30, 30);
    const tableMat = new THREE.MeshStandardMaterial({
      color: 0x181417,
      roughness: 0.75,
      metalness: 0.15
    });
    const table = new THREE.Mesh(tableGeo, tableMat);
    table.rotation.x = -Math.PI / 2;
    table.position.y = -0.01;
    table.receiveShadow = true;
    scene.add(table);

    // ==========================================
    // 2. Glossy White Ceramic Plate with Raised Rim
    // ==========================================
    function createPlateGeometry() {
      const points = [];
      points.push(new THREE.Vector2(0.0, 0.0));
      points.push(new THREE.Vector2(2.6, 0.0));
      points.push(new THREE.Vector2(3.1, 0.04));
      // Curved inner rise
      points.push(new THREE.Vector2(3.6, 0.18));
      points.push(new THREE.Vector2(4.1, 0.38));
      // Smooth rim crown
      points.push(new THREE.Vector2(4.35, 0.45));
      points.push(new THREE.Vector2(4.45, 0.42));
      // Outer drop
      points.push(new THREE.Vector2(4.4, 0.30));
      points.push(new THREE.Vector2(4.2, 0.12));
      points.push(new THREE.Vector2(3.9, 0.02));
      // Base foot ring
      points.push(new THREE.Vector2(2.8, -0.04));
      points.push(new THREE.Vector2(2.6, -0.04));
      points.push(new THREE.Vector2(2.4, 0.0));
      points.push(new THREE.Vector2(0.0, 0.0));

      const geo = new THREE.LatheGeometry(points, 72);
      geo.computeVertexNormals();
      return geo;
    }

    const plateMat = new THREE.MeshPhysicalMaterial({
      color: 0xfaf8f5,
      roughness: 0.12,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      reflectivity: 0.95,
      envMap: studioEnvMap
    });
    const plateMesh = new THREE.Mesh(createPlateGeometry(), plateMat);
    plateMesh.position.y = 0.04;
    plateMesh.receiveShadow = true;
    plateMesh.castShadow = true;
    scene.add(plateMesh);

    // ==========================================
    // 3. Translucent Caramel Syrup Pool on Plate
    // ==========================================
    function createSyrupPoolGeometry() {
      const segments = 64;
      const geo = new THREE.RingGeometry(0.1, 3.1, segments, 8);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const r = Math.sqrt(x * x + y * y);
        const angle = Math.atan2(y, x);

        // Organic undulating edge for realistic liquid puddle
        const edgeNoise = 0.18 * Math.sin(angle * 5.0) + 0.12 * Math.cos(angle * 8.0 + 1.2);
        const maxR = 2.8 + edgeNoise;

        if (r > 2.0) {
          const factor = (r - 2.0) / (3.1 - 2.0);
          const clampedR = 2.0 + factor * (maxR - 2.0);
          pos.setX(i, Math.cos(angle) * clampedR);
          pos.setY(i, Math.sin(angle) * clampedR);
        }

        // Slight meniscus depth
        let z = 0.045 * Math.sin((r / 3.1) * Math.PI);
        pos.setZ(i, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const syrupMat = new THREE.MeshPhysicalMaterial({
      color: 0x933003,
      transmission: 0.88,
      opacity: 1.0,
      transparent: true,
      roughness: 0.08,
      ior: 1.46,
      thickness: 0.9,
      attenuationColor: 0x5a1801,
      attenuationDistance: 0.45,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      envMap: studioEnvMap
    });
    const syrupPool = new THREE.Mesh(createSyrupPoolGeometry(), syrupMat);
    syrupPool.rotation.x = -Math.PI / 2;
    syrupPool.position.set(0, 0.065, 0);
    syrupPool.receiveShadow = true;
    scene.add(syrupPool);

    // ==========================================
    // 4. Scalloped Frustum Custard Pudding Body
    // ==========================================
    const PUDDING_HEIGHT = 2.35;
    const PUDDING_BASE_R = 2.05;
    const PUDDING_TOP_R = 1.48;
    const FLUTE_COUNT = 18;
    const RAD_SEGS = 108; // 6 segments per flute
    const HEIGHT_SEGS = 54;

    function buildPuddingGeometry() {
      const geo = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      // Grid for the scalloped fluted side mantle
      for (let j = 0; j <= HEIGHT_SEGS; j++) {
        const v = j / HEIGHT_SEGS;
        const y = v * PUDDING_HEIGHT;

        // Base profile: tapered cone with organic bottom flare and rounded shoulder
        const taper = PUDDING_BASE_R - (PUDDING_BASE_R - PUDDING_TOP_R) * v;
        const flare = 0.15 * Math.pow(1.0 - v, 2.5);
        const shoulderRound = -0.06 * Math.pow(v, 4.0);
        const baseR = taper + flare + shoulderRound;

        // Fluted lobe depth (pronounced in the lower/mid body, softer near top cap)
        const fluteAmp = (0.075 * (1.0 - 0.25 * v) + 0.015) * Math.sin(Math.min(v * 4.0, 1.0) * Math.PI * 0.5);

        for (let i = 0; i <= RAD_SEGS; i++) {
          const u = i / RAD_SEGS;
          const theta = u * Math.PI * 2;

          const scallop = 1.0 + fluteAmp * Math.cos(FLUTE_COUNT * theta);
          const r = baseR * scallop;

          const px = r * Math.sin(theta);
          const pz = r * Math.cos(theta);

          positions.push(px, y, pz);
          uvs.push(u, v);
        }
      }

      // Indices for side mantle
      for (let j = 0; j < HEIGHT_SEGS; j++) {
        for (let i = 0; i < RAD_SEGS; i++) {
          const a = j * (RAD_SEGS + 1) + i;
          const b = (j + 1) * (RAD_SEGS + 1) + i;
          const c = (j + 1) * (RAD_SEGS + 1) + (i + 1);
          const d = j * (RAD_SEGS + 1) + (i + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      // Top cap (concentric rings closing smoothly)
      const topStartIdx = positions.length / 3;
      const TOP_RINGS = 12;
      for (let ring = 0; ring <= TOP_RINGS; ring++) {
        const frac = ring / TOP_RINGS; // 1 = outer rim, 0 = center
        const rTop = PUDDING_TOP_R * frac;
        const yTop = PUDDING_HEIGHT + 0.04 * (1.0 - frac * frac); // slight dome

        for (let i = 0; i <= RAD_SEGS; i++) {
          const u = i / RAD_SEGS;
          const theta = u * Math.PI * 2;
          const fluteFade = (1.0 - Math.pow(1.0 - frac, 3.0)) * 0.035;
          const r = rTop * (1.0 + fluteFade * Math.cos(FLUTE_COUNT * theta));

          positions.push(r * Math.sin(theta), yTop, r * Math.cos(theta));
          uvs.push(0.5 + 0.5 * frac * Math.sin(theta), 0.5 + 0.5 * frac * Math.cos(theta));
        }
      }

      for (let ring = 0; ring < TOP_RINGS; ring++) {
        for (let i = 0; i < RAD_SEGS; i++) {
          const a = topStartIdx + ring * (RAD_SEGS + 1) + i;
          const b = topStartIdx + (ring + 1) * (RAD_SEGS + 1) + i;
          const c = topStartIdx + (ring + 1) * (RAD_SEGS + 1) + (i + 1);
          const d = topStartIdx + ring * (RAD_SEGS + 1) + (i + 1);
          indices.push(a, c, b);
          indices.push(a, d, c);
        }
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      return geo;
    }

    const puddingGeo = buildPuddingGeometry();
    const origPuddingPos = new Float32Array(puddingGeo.attributes.position.array);

    const custardMat = new THREE.MeshPhysicalMaterial({
      color: 0xffd668,
      emissive: 0x3d2002,
      emissiveIntensity: 0.16,
      roughness: 0.13,
      metalness: 0.0,
      transmission: 0.65,
      ior: 1.39,
      thickness: 2.2,
      attenuationColor: 0xff9900,
      attenuationDistance: 0.95,
      clearcoat: 0.9,
      clearcoatRoughness: 0.08,
      reflectivity: 0.85,
      envMap: studioEnvMap
    });

    const puddingMesh = new THREE.Mesh(puddingGeo, custardMat);
    puddingMesh.position.y = 0.05;
    puddingMesh.castShadow = true;
    puddingMesh.receiveShadow = true;
    scene.add(puddingMesh);

    // =======================================================
    // 5. Dark-Amber Glossy Caramel Sauce Cap with Thick Drips
    // =======================================================
    // Drip definitions: angles matching fluted crevices and varying drip lengths
    const DRIP_VALLEYS = [
      { angleIdx: 1, length: 0.92, width: 0.15, bulge: 0.09 },
      { angleIdx: 3, length: 1.75, width: 0.18, bulge: 0.12 }, // Runs nearly to plate!
      { angleIdx: 6, length: 0.65, width: 0.14, bulge: 0.08 },
      { angleIdx: 8, length: 1.45, width: 0.16, bulge: 0.11 },
      { angleIdx: 11, length: 0.85, width: 0.15, bulge: 0.085 },
      { angleIdx: 13, length: 1.85, width: 0.19, bulge: 0.13 }, // Long dramatic drip!
      { angleIdx: 15, length: 1.15, width: 0.16, bulge: 0.10 },
      { angleIdx: 17, length: 0.70, width: 0.13, bulge: 0.075 }
    ];

    const caramelGroup = new THREE.Group();
    caramelGroup.position.y = 0.05;
    scene.add(caramelGroup);

    const caramelMat = new THREE.MeshPhysicalMaterial({
      color: 0x481100,
      emissive: 0x220500,
      emissiveIntensity: 0.1,
      roughness: 0.05,
      metalness: 0.0,
      transmission: 0.72,
      ior: 1.48,
      thickness: 1.6,
      attenuationColor: 0x2e0800,
      attenuationDistance: 0.4,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      reflectivity: 0.95,
      envMap: studioEnvMap
    });

    // A. Caramel Top Sauce Cap
    function buildCaramelCapGeometry() {
      const geo = new THREE.CylinderGeometry(PUDDING_TOP_R + 0.02, PUDDING_TOP_R + 0.045, 0.12, 72, 8, false);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);
        const r = Math.sqrt(x * x + z * z);
        const theta = Math.atan2(x, z);

        // Slightly domed top surface with smooth overflowing meniscus
        if (y > 0.02) {
          y += 0.035 * (1.0 - Math.pow(r / (PUDDING_TOP_R + 0.02), 2.0));
        } else {
          // Rounded dripping overhang edge
          y -= 0.025;
        }

        // Subtly conform to flutes
        const flute = 0.025 * Math.cos(FLUTE_COUNT * theta);
        x *= (1.0 + flute);
        z *= (1.0 + flute);

        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }
    const caramelCapGeo = buildCaramelCapGeometry();
    const origCaramelCapPos = new Float32Array(caramelCapGeo.attributes.position.array);
    const caramelCapMesh = new THREE.Mesh(caramelCapGeo, caramelMat);
    caramelCapMesh.position.y = PUDDING_HEIGHT + 0.02;
    caramelCapMesh.castShadow = true;
    caramelGroup.add(caramelCapMesh);

    // B. Thick caramel syrup drips running down fluted sides
    const dripMeshes = [];
    DRIP_VALLEYS.forEach((drip) => {
      const fluteAngle = (drip.angleIdx + 0.5) * (Math.PI * 2 / FLUTE_COUNT);
      const curvePoints = [];
      const steps = 18;

      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const curY = PUDDING_HEIGHT - t * drip.length;
        const v = Math.max(0.0, Math.min(1.0, curY / PUDDING_HEIGHT));

        const taper = PUDDING_BASE_R - (PUDDING_BASE_R - PUDDING_TOP_R) * v;
        const flare = 0.15 * Math.pow(1.0 - v, 2.5);
        const baseR = taper + flare;
        // In the fluted crevice (inward valley)
        const scallop = 1.0 - 0.065 * (1.0 - 0.25 * v);
        const r = baseR * scallop + 0.035; // Hugs surface closely with liquid thickness

        curvePoints.push(new THREE.Vector3(
          r * Math.sin(fluteAngle),
          curY,
          r * Math.cos(fluteAngle)
        ));
      }

      const dripCurve = new THREE.CatmullRomCurve3(curvePoints);
      const dripGeo = new THREE.TubeGeometry(dripCurve, 24, drip.width * 0.45, 12, false);

      // Morph tube: taper in middle, bulbous droplet at teardrop bottom
      const pos = dripGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const frac = Math.max(0.0, Math.min(1.0, (PUDDING_HEIGHT - y) / drip.length));
        let scale = 1.0;
        if (frac < 0.2) {
          // Spreading top attachment
          scale = 1.4 - frac * 2.0;
        } else if (frac > 0.75) {
          // Bulbous dripping teardrop head
          const bulbFrac = (frac - 0.75) / 0.25;
          scale = 0.8 + 1.2 * Math.sin(bulbFrac * Math.PI);
        } else {
          scale = 0.75 + 0.2 * Math.sin(frac * Math.PI);
        }

        const centerPt = dripCurve.getPointAt(frac);
        pos.setX(i, centerPt.x + (pos.getX(i) - centerPt.x) * scale);
        pos.setZ(i, centerPt.z + (pos.getZ(i) - centerPt.z) * scale);
      }

      // Add rounded droplet end cap sphere
      const bottomPt = curvePoints[curvePoints.length - 1];
      const dropSphere = new THREE.SphereGeometry(drip.bulge * 1.15, 16, 12);
      dropSphere.scale(1.0, 1.25, 0.9);
      dropSphere.translate(bottomPt.x, bottomPt.y - drip.bulge * 0.35, bottomPt.z);

      const combinedDripGeo = dripGeo;
      const dripMesh = new THREE.Mesh(combinedDripGeo, caramelMat);
      dripMesh.castShadow = true;
      caramelGroup.add(dripMesh);

      const bulbMesh = new THREE.Mesh(dropSphere, caramelMat);
      bulbMesh.castShadow = true;
      caramelGroup.add(bulbMesh);

      dripMeshes.push({
        mesh: dripMesh,
        bulb: bulbMesh,
        origPos: new Float32Array(dripGeo.attributes.position.array),
        origBulbPos: new Float32Array(dropSphere.attributes.position.array),
        fluteAngle: fluteAngle,
        length: drip.length
      });
    });

    // ==========================================
    // 6. Swirled Fluted Whipped Cream Rosette
    // ==========================================
    function createWhippedCreamGeometry() {
      const geo = new THREE.BufferGeometry();
      const positions = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      const TURNS = 3.2;
      const SPIRAL_STEPS = 120;
      const STAR_POINTS = 8;
      const RADIAL_SEGS = 48; // 6 vertices per star lobe

      for (let s = 0; s <= SPIRAL_STEPS; s++) {
        const t = s / SPIRAL_STEPS; // 0 = base, 1 = crown peak
        const theta = t * TURNS * Math.PI * 2;

        // Spiral spine center
        const spineR = 0.48 * Math.pow(1.0 - t, 0.85);
        const spineX = spineR * Math.cos(theta);
        const spineZ = spineR * Math.sin(theta);
        const spineY = 0.05 + 0.72 * Math.pow(t, 0.9);

        // Cross section radius
        const crossR = 0.36 * (1.0 - 0.75 * t) * (0.8 + 0.2 * Math.sin(t * Math.PI));

        // Tangent frame for sweeping cross section
        const tangent = new THREE.Vector3(
          -spineR * Math.sin(theta) * TURNS * Math.PI * 2 - 0.48 * Math.cos(theta),
          0.72 * 0.9 * Math.pow(Math.max(0.01, t), -0.1),
          spineR * Math.cos(theta) * TURNS * Math.PI * 2 - 0.48 * Math.sin(theta)
        ).normalize();

        const up = new THREE.Vector3(0, 1, 0);
        const normalVec = new THREE.Vector3().crossVectors(tangent, up).normalize();
        const binormalVec = new THREE.Vector3().crossVectors(tangent, normalVec).normalize();

        for (let r = 0; r <= RADIAL_SEGS; r++) {
          const phi = (r / RADIAL_SEGS) * Math.PI * 2;
          // Piping nozzle star profile
          const starLobe = 1.0 + 0.32 * Math.cos(STAR_POINTS * (phi - theta * 0.6));
          const localR = crossR * starLobe;

          const lx = localR * Math.cos(phi);
          const ly = localR * Math.sin(phi);

          const px = spineX + normalVec.x * lx + binormalVec.x * ly;
          const py = spineY + normalVec.y * lx + binormalVec.y * ly;
          const pz = spineZ + normalVec.z * lx + binormalVec.z * ly;

          positions.push(px, py, pz);
          uvs.push(r / RADIAL_SEGS, t);
        }
      }

      for (let s = 0; s < SPIRAL_STEPS; s++) {
        for (let r = 0; r < RADIAL_SEGS; r++) {
          const a = s * (RADIAL_SEGS + 1) + r;
          const b = (s + 1) * (RADIAL_SEGS + 1) + r;
          const c = (s + 1) * (RADIAL_SEGS + 1) + (r + 1);
          const d = s * (RADIAL_SEGS + 1) + (r + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const creamMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.35,
      metalness: 0.0,
      transmission: 0.18,
      thickness: 0.8,
      ior: 1.35,
      attenuationColor: 0xfff3e6,
      attenuationDistance: 0.6,
      clearcoat: 0.25,
      clearcoatRoughness: 0.3,
      sheen: 0.6,
      sheenColor: 0xfff6ec,
      envMap: studioEnvMap
    });

    const creamGeo = createWhippedCreamGeometry();
    const creamMesh = new THREE.Mesh(creamGeo, creamMat);
    creamMesh.position.set(0, PUDDING_HEIGHT + 0.05, 0);
    creamMesh.castShadow = true;
    creamMesh.receiveShadow = true;
    scene.add(creamMesh);

    // ========================================================
    // 7. Glossy Ruby-Red Maraschino Cherry with Curved Green Stem
    // ========================================================
    const cherryGroup = new THREE.Group();
    // Nestled artfully beside the whipped cream rosette
    cherryGroup.position.set(0.38, PUDDING_HEIGHT + 0.48, 0.32);
    scene.add(cherryGroup);

    // A. Cherry Body: Sphere with heart-dimple
    function createCherryGeometry() {
      const geo = new THREE.SphereGeometry(0.38, 48, 36);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Maraschino cherry indentation at top where stem enters
        const distFromTop = Math.sqrt(x * x + z * z);
        if (y > 0.1) {
          y -= 0.12 * Math.exp(-distFromTop * distFromTop * 25.0);
        }
        // Subtle heart shape: slightly narrower base
        if (y < 0.0) {
          x *= (1.0 + 0.15 * y);
          z *= (1.0 + 0.15 * y);
        }

        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const cherryMat = new THREE.MeshPhysicalMaterial({
      color: 0xba0018,
      emissive: 0x400006,
      emissiveIntensity: 0.18,
      roughness: 0.04,
      metalness: 0.0,
      transmission: 0.62,
      ior: 1.48,
      thickness: 1.3,
      attenuationColor: 0x6e0008,
      attenuationDistance: 0.45,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      reflectivity: 0.95,
      envMap: studioEnvMap
    });

    const cherryMesh = new THREE.Mesh(createCherryGeometry(), cherryMat);
    cherryMesh.castShadow = true;
    cherryMesh.rotation.z = 0.15;
    cherryMesh.rotation.x = -0.1;
    cherryGroup.add(cherryMesh);

    // Tiny dark calyx nodule inside the cherry dimple
    const calyxGeo = new THREE.CylinderGeometry(0.045, 0.02, 0.06, 12);
    const calyxMat = new THREE.MeshStandardMaterial({ color: 0x3a421a, roughness: 0.6 });
    const calyxMesh = new THREE.Mesh(calyxGeo, calyxMat);
    calyxMesh.position.set(0, 0.32, 0);
    cherryGroup.add(calyxMesh);

    // B. Curved Green Stem
    function createStemMesh() {
      const stemCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0.0, 0.31, 0.0),
        new THREE.Vector3(0.04, 0.52, 0.02),
        new THREE.Vector3(0.18, 0.88, -0.06),
        new THREE.Vector3(0.42, 1.22, -0.18),
        new THREE.Vector3(0.68, 1.42, -0.32),
        new THREE.Vector3(0.95, 1.48, -0.42)
      ]);

      const stemGeo = new THREE.TubeGeometry(stemCurve, 36, 0.022, 12, false);
      // Taper stem near tip and add slight knobby end
      const pos = stemGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const u = i / pos.count;
        if (u > 0.85) {
          const factor = 1.0 + 0.8 * Math.sin((u - 0.85) / 0.15 * Math.PI);
          pos.setX(i, pos.getX(i) * factor);
          pos.setZ(i, pos.getZ(i) * factor);
        }
      }
      stemGeo.computeVertexNormals();

      const stemMat = new THREE.MeshPhysicalMaterial({
        color: 0x5a7d2d,
        roughness: 0.42,
        metalness: 0.02,
        clearcoat: 0.25,
        clearcoatRoughness: 0.3
      });

      const stemMesh = new THREE.Mesh(stemGeo, stemMat);
      stemMesh.castShadow = true;
      return stemMesh;
    }
    const cherryStem = createStemMesh();
    cherryGroup.add(cherryStem);

    // ========================================================
    // 8. Interactive Jelly Physics (Spring-Damper & Wave Engine)
    // ========================================================
    const physics = {
      // Horizontal Shear
      shearX: 0,
      shearZ: 0,
      velShearX: 0,
      velShearZ: 0,

      // Vertical Squash & Stretch
      squashY: 0,
      velSquashY: 0,

      // Torsional Twist
      twist: 0,
      velTwist: 0,

      // High-Frequency Surface Jiggle Waves
      waveAmp: 0,
      waveVel: 0,
      wavePhase: 0,

      // Physical constants
      springK: 38.0,      // Natural stiffness
      damping: 4.8,       // Viscous jelly damping
      squashK: 45.0,
      squashDamping: 5.2,
      twistK: 32.0,
      twistDamping: 4.5,
      waveK: 55.0,
      waveDamping: 4.2
    };

    // Interaction Raycasting
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    const prevMouse = new THREE.Vector2(-999, -999);
    let mouseSpeed = 0;
    let isHovered = false;

    window.addEventListener('pointermove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      if (prevMouse.x !== -999) {
        const dx = mouse.x - prevMouse.x;
        const dy = mouse.y - prevMouse.y;
        mouseSpeed = Math.sqrt(dx * dx + dy * dy);

        // When mouse brushes over pudding, apply directional kinetic shear!
        if (isHovered && mouseSpeed > 0.005) {
          const impulse = Math.min(mouseSpeed * 12.0, 1.8);
          physics.velShearX += dx * impulse * 14.0;
          physics.velShearZ -= dy * impulse * 14.0;
          physics.waveVel += impulse * 18.0;
          physics.velSquashY += (Math.random() - 0.5) * impulse * 6.0;
          physics.velTwist += dx * impulse * 8.0;
        }
      }
      prevMouse.copy(mouse);
    });

    // Big satisfying squishy jiggle on click or touch
    window.addEventListener('pointerdown', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([puddingMesh, caramelCapMesh, creamMesh, cherryMesh], true);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const localHit = hit.point.clone().sub(puddingMesh.position);

        // Inject hearty multi-axis impulse
        physics.velSquashY -= 2.6; // Deep squish down
        physics.velShearX += (localHit.x * 2.2 + (Math.random() - 0.5) * 1.5);
        physics.velShearZ += (localHit.z * 2.2 + (Math.random() - 0.5) * 1.5);
        physics.velTwist += (Math.random() - 0.5) * 4.5;

        // Big surface jiggle wave
        physics.waveAmp = 0.55;
        physics.waveVel = 32.0;

        // Flash warm internal glow momentarily
        custardMat.emissiveIntensity = 0.45;
      }
    });

    // ==========================================
    // 9. Main Animation & Deformation Loop
    // ==========================================
    let clock = new THREE.Clock();

    function updateJellyPhysics(dt) {
      // Clamp dt to avoid physics instability on tab switch
      const delta = Math.min(dt, 0.05);

      // Continuous gentle breathing/jelly liveness pulse
      const time = clock.getElapsedTime();
      const idleWave = Math.sin(time * 2.8) * 0.018;
      const idleBreathe = Math.cos(time * 1.9) * 0.012;

      // 1. Horizontal Shear ODE: m * x'' + c * x' + k * x = 0
      const forceShearX = -physics.springK * physics.shearX - physics.damping * physics.velShearX;
      physics.velShearX += forceShearX * delta;
      physics.shearX += physics.velShearX * delta;

      const forceShearZ = -physics.springK * physics.shearZ - physics.damping * physics.velShearZ;
      physics.velShearZ += forceShearZ * delta;
      physics.shearZ += physics.velShearZ * delta;

      // 2. Vertical Squash & Stretch ODE (volume-preserving)
      const forceSquashY = -physics.squashK * physics.squashY - physics.squashDamping * physics.velSquashY;
      physics.velSquashY += forceSquashY * delta;
      physics.squashY += physics.velSquashY * delta;

      // 3. Twist ODE
      const forceTwist = -physics.twistK * physics.twist - physics.twistDamping * physics.velTwist;
      physics.velTwist += forceTwist * delta;
      physics.twist += physics.velTwist * delta;

      // 4. Jiggle Wave ripple
      const forceWave = -physics.waveK * physics.waveAmp - physics.waveDamping * physics.waveVel;
      physics.waveVel += forceWave * delta;
      physics.waveAmp += physics.waveVel * delta;
      physics.wavePhase += delta * 24.0;

      // Soft decay for emissive flash
      if (custardMat.emissiveIntensity > 0.16) {
        custardMat.emissiveIntensity += (0.16 - custardMat.emissiveIntensity) * 0.08;
      }

      // ----------------------------------------------------
      // Deform Custard Pudding Mesh Vertices
      // ----------------------------------------------------
      const posAttr = puddingGeo.attributes.position;
      const posArray = posAttr.array;
      const count = posAttr.count;

      const totalShearX = physics.shearX + idleWave;
      const totalShearZ = physics.shearZ + idleWave * 0.7;
      const totalSquashY = physics.squashY + idleBreathe;
      const totalTwist = physics.twist;
      const wave = physics.waveAmp;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const ox = origPuddingPos[i3];
        const oy = origPuddingPos[i3 + 1];
        const oz = origPuddingPos[i3 + 2];

        // Height factor normalized [0, 1]
        const v = Math.max(0.0, Math.min(1.0, oy / PUDDING_HEIGHT));
        const vQuad = Math.pow(v, 1.45); // Top moves most, base anchored to plate

        // 1. Horizontal shear
        let dx = totalShearX * vQuad;
        let dz = totalShearZ * vQuad;

        // 2. Squash and Stretch (Volume preservation: when y squashes, radius bulges out!)
        const radialBulge = -totalSquashY * Math.sin(v * Math.PI) * 0.65;
        const scaleR = 1.0 + radialBulge;

        // 3. Vertical displacement with non-linear spring curve
        const dy = totalSquashY * Math.sin(v * Math.PI * 0.5);

        // 4. Torsional twist
        const twistAngle = totalTwist * vQuad;
        const cosT = Math.cos(twistAngle);
        const sinT = Math.sin(twistAngle);

        let rx = ox * cosT - oz * sinT;
        let rz = ox * sinT + oz * cosT;

        rx *= scaleR;
        rz *= scaleR;

        // 5. Traveling surface jiggle ripple wave
        const ripple = wave * Math.sin(v * 16.0 - physics.wavePhase) * Math.sin(v * Math.PI) * 0.085;

        posArray[i3] = rx + dx + (rx / (PUDDING_BASE_R + 0.1)) * ripple;
        posArray[i3 + 1] = oy + dy;
        posArray[i3 + 2] = rz + dz + (rz / (PUDDING_BASE_R + 0.1)) * ripple;
      }

      posAttr.needsUpdate = true;
      puddingGeo.computeVertexNormals();

      // ----------------------------------------------------
      // Synchronize Caramel Cap & Drips with Pudding Deformation
      // ----------------------------------------------------
      const capPosAttr = caramelCapGeo.attributes.position;
      const capArray = capPosAttr.array;
      const capCount = capPosAttr.count;

      const topDx = totalShearX * 1.0;
      const topDz = totalShearZ * 1.0;
      const topDy = totalSquashY * 1.0;

      for (let i = 0; i < capCount; i++) {
        const i3 = i * 3;
        const ox = origCaramelCapPos[i3];
        const oy = origCaramelCapPos[i3 + 1];
        const oz = origCaramelCapPos[i3 + 2];

        // Torsional twist at top
        const cosT = Math.cos(totalTwist);
        const sinT = Math.sin(totalTwist);
        const rx = ox * cosT - oz * sinT;
        const rz = ox * sinT + oz * cosT;

        capArray[i3] = rx + topDx;
        capArray[i3 + 1] = oy + topDy;
        capArray[i3 + 2] = rz + topDz;
      }
      capPosAttr.needsUpdate = true;
      caramelCapGeo.computeVertexNormals();

      // Update drips
      dripMeshes.forEach((drip) => {
        const dPos = drip.mesh.geometry.attributes.position;
        const dArr = dPos.array;
        const origD = drip.origPos;

        for (let i = 0; i < dPos.count; i++) {
          const i3 = i * 3;
          const oy = origD[i3 + 1];
          const v = Math.max(0.0, Math.min(1.0, oy / PUDDING_HEIGHT));
          const vQuad = Math.pow(v, 1.45);

          const curDx = totalShearX * vQuad;
          const curDz = totalShearZ * vQuad;
          const curDy = totalSquashY * Math.sin(v * Math.PI * 0.5);

          dArr[i3] = origD[i3] + curDx;
          dArr[i3 + 1] = oy + curDy;
          dArr[i3 + 2] = origD[i3 + 2] + curDz;
        }
        dPos.needsUpdate = true;
        drip.mesh.geometry.computeVertexNormals();

        // Bulb droplet
        const bPos = drip.bulb.geometry.attributes.position;
        const bArr = bPos.array;
        const origB = drip.origBulbPos;
        const bulbV = Math.max(0.0, Math.min(1.0, (PUDDING_HEIGHT - drip.length) / PUDDING_HEIGHT));
        const bulbVQuad = Math.pow(bulbV, 1.45);
        const bDx = totalShearX * bulbVQuad;
        const bDz = totalShearZ * bulbVQuad;
        const bDy = totalSquashY * Math.sin(bulbV * Math.PI * 0.5);

        for (let i = 0; i < bPos.count; i++) {
          const i3 = i * 3;
          bArr[i3] = origB[i3] + bDx;
          bArr[i3 + 1] = origB[i3 + 1] + bDy;
          bArr[i3 + 2] = origB[i3 + 2] + bDz;
        }
        bPos.needsUpdate = true;
        drip.bulb.geometry.computeVertexNormals();
      });

      // ----------------------------------------------------
      // Synchronize Whipped Cream Rosette & Cherry Topping
      // ----------------------------------------------------
      creamMesh.position.x = topDx;
      creamMesh.position.y = PUDDING_HEIGHT + 0.05 + topDy;
      creamMesh.position.z = topDz;
      creamMesh.rotation.y = totalTwist;
      creamMesh.rotation.z = -totalShearX * 0.18;
      creamMesh.rotation.x = totalShearZ * 0.18;

      // Cherry sits on cream, wobbling playfully
      cherryGroup.position.x = 0.38 + topDx * 1.15;
      cherryGroup.position.y = PUDDING_HEIGHT + 0.48 + topDy + (idleWave * 0.3);
      cherryGroup.position.z = 0.32 + topDz * 1.15;
      cherryGroup.rotation.z = 0.15 - totalShearX * 0.35 + idleWave * 0.5;
      cherryGroup.rotation.x = -0.1 + totalShearZ * 0.35;
      cherryStem.rotation.z = -totalShearX * 0.45;
      cherryStem.rotation.x = totalShearZ * 0.45;
    }

    // Animation Tick
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      // Check hover state via raycasting
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects([puddingMesh, caramelCapMesh, creamMesh, cherryMesh], true);
      isHovered = hits.length > 0;
      document.body.style.cursor = isHovered ? 'pointer' : 'default';

      updateJellyPhysics(dt);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // ==========================================
    // 10. Responsive Viewport Handler
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
