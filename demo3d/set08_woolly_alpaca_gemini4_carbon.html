// ---------------------------------------------------------------------------
// Deterministic Seeded PRNG
// ---------------------------------------------------------------------------
function createRNG(seed = 8082026) {
  let s = seed >>> 0;
  return function () {
    s += 0x6D2B79F5;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = createRNG(20260808);

// Smooth spatial 3D curl/tuft field for natural fleece clumping
function tuftField(x, y, z) {
  const sx = Math.sin(x * 19.0 + y * 7.3) * Math.cos(z * 17.1 - y * 5.2);
  const sy = Math.sin(y * 18.4 - z * 8.7) * Math.cos(x * 15.6 + z * 6.1);
  const sz = Math.sin(z * 20.2 + x * 9.1) * Math.cos(y * 16.3 - x * 7.4);
  return { x: sx, y: sy, z: sz };
}

// ---------------------------------------------------------------------------
// Procedural Studio Environment Map + Three-Point Lighting
// ---------------------------------------------------------------------------
function createStudioEnvironment(rendererInstance) {
  const pmrem = new THREE.PMREMGenerator(rendererInstance);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  const skyGeo = new THREE.SphereGeometry(20, 32, 24);
  const posAttr = skyGeo.attributes.position;
  const skyColors = new Float32Array(posAttr.count * 3);
  const topCol = new THREE.Color(0xe6f0ff);
  const midCol = new THREE.Color(0xfff8ef);
  const botCol = new THREE.Color(0xd4e6d5);
  const tmpCol = new THREE.Color();

  for (let i = 0; i < posAttr.count; i++) {
    const ny = posAttr.getY(i) / 20;
    if (ny >= 0) {
      tmpCol.copy(midCol).lerp(topCol, Math.pow(ny, 0.65));
    } else {
      tmpCol.copy(midCol).lerp(botCol, Math.pow(-ny, 0.55));
    }
    skyColors[i * 3] = tmpCol.r;
    skyColors[i * 3 + 1] = tmpCol.g;
    skyColors[i * 3 + 2] = tmpCol.b;
  }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(skyColors, 3));
  envScene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));

  // Bright studio softbox panels for rich glossy eye & hoof reflections
  const softboxMat1 = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.6, 3.4, 3.1), side: THREE.DoubleSide });
  const panel1 = new THREE.Mesh(new THREE.PlaneGeometry(7, 5), softboxMat1);
  panel1.position.set(5.5, 6.5, 5.5);
  panel1.lookAt(0, 1, 0);
  envScene.add(panel1);

  const softboxMat2 = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.9, 2.2, 2.7), side: THREE.DoubleSide });
  const panel2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 5), softboxMat2);
  panel2.position.set(-6.0, 4.0, 4.5);
  panel2.lookAt(0, 1, 0);
  envScene.add(panel2);

  const rimBoxMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.0, 2.6, 2.1), side: THREE.DoubleSide });
  const panel3 = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), rimBoxMat);
  panel3.position.set(-3.0, 5.5, -6.5);
  panel3.lookAt(0, 1, 0);
  envScene.add(panel3);

  const envRT = pmrem.fromScene(envScene, 0.035);
  pmrem.dispose();
  skyGeo.dispose();
  return envRT.texture;
}

// ---------------------------------------------------------------------------
// Procedural Canvas Textures (Eye, Soft Contact Shadow, Andean Woven Bandana)
// ---------------------------------------------------------------------------
function createSoftShadowTexture() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 124);
  g.addColorStop(0.0, 'rgba(38, 52, 42, 0.42)');
  g.addColorStop(0.45, 'rgba(42, 58, 46, 0.22)');
  g.addColorStop(0.78, 'rgba(48, 65, 52, 0.06)');
  g.addColorStop(1.0, 'rgba(48, 65, 52, 0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createEyeTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');

  // Deep espresso sclera/edge base
  ctx.fillStyle = '#150c09';
  ctx.fillRect(0, 0, 512, 512);

  // Warm dark chocolate-amber iris glow shifted toward front center (UV 0.5, 0.5)
  const irisGrad = ctx.createRadialGradient(256, 272, 24, 256, 256, 215);
  irisGrad.addColorStop(0.0, '#070506');
  irisGrad.addColorStop(0.42, '#0d0808');
  irisGrad.addColorStop(0.64, '#2c170f');
  irisGrad.addColorStop(0.80, '#462618');
  irisGrad.addColorStop(0.92, '#1d100b');
  irisGrad.addColorStop(1.0, '#0d0706');
  ctx.fillStyle = irisGrad;
  ctx.beginPath();
  ctx.arc(256, 256, 235, 0, Math.PI * 2);
  ctx.fill();

  // Subtle lower warm amber crescent reflection inside iris
  const lowerGlow = ctx.createRadialGradient(256, 336, 10, 256, 330, 120);
  lowerGlow.addColorStop(0.0, 'rgba(135, 78, 42, 0.46)');
  lowerGlow.addColorStop(0.6, 'rgba(92, 50, 26, 0.18)');
  lowerGlow.addColorStop(1.0, 'rgba(30, 15, 10, 0.0)');
  ctx.fillStyle = lowerGlow;
  ctx.fillRect(0, 0, 512, 512);

  // Delicate radial iris striations
  ctx.save();
  ctx.translate(256, 256);
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * Math.PI * 2;
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(110, 65, 38, 0.12)' : 'rgba(15, 8, 6, 0.18)';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 95, Math.sin(a) * 95);
    ctx.lineTo(Math.cos(a) * 195, Math.sin(a) * 195);
    ctx.stroke();
  }
  ctx.restore();

  // Velvety jet-black pupil center
  const pupilGrad = ctx.createRadialGradient(256, 252, 10, 256, 252, 108);
  pupilGrad.addColorStop(0.0, '#040304');
  pupilGrad.addColorStop(0.82, '#080506');
  pupilGrad.addColorStop(1.0, 'rgba(12, 7, 7, 0.0)');
  ctx.fillStyle = pupilGrad;
  ctx.beginPath();
  ctx.arc(256, 252, 108, 0, Math.PI * 2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createAndeanWeaveTextures() {
  const w = 1024, h = 512;
  const colCanvas = document.createElement('canvas');
  colCanvas.width = w;
  colCanvas.height = h;
  const ctx = colCanvas.getContext('2d');

  const bumpCanvas = document.createElement('canvas');
  bumpCanvas.width = w;
  bumpCanvas.height = h;
  const bctx = bumpCanvas.getContext('2d');

  // Rich coral-red woven wool background
  ctx.fillStyle = '#e0423b';
  ctx.fillRect(0, 0, w, h);
  bctx.fillStyle = '#808080';
  bctx.fillRect(0, 0, w, h);

  // Horizontal Andean stripes
  const bands = [
    { y: 0.05, h: 0.04, col: '#fff4e2' },
    { y: 0.11, h: 0.035, col: '#f3b740' },
    { y: 0.16, h: 0.025, col: '#9c1f23' },
    { y: 0.21, h: 0.24, col: '#cc312c' }, // main diamond motif band
    { y: 0.47, h: 0.025, col: '#9c1f23' },
    { y: 0.51, h: 0.035, col: '#f3b740' },
    { y: 0.56, h: 0.04, col: '#fff4e2' },
    { y: 0.64, h: 0.14, col: '#e64c43' },
    { y: 0.80, h: 0.035, col: '#35a69b' },
    { y: 0.85, h: 0.045, col: '#fff4e2' }
  ];
  for (const b of bands) {
    ctx.fillStyle = b.col;
    ctx.fillRect(0, b.y * h, w, b.h * h);
  }

  // Stepped Andean diamond motifs (pallay) across main band & lower band
  const numDiamonds = 16;
  const stepW = w / numDiamonds;
  const cy = 0.33 * h;
  for (let i = 0; i < numDiamonds; i++) {
    const cx = (i + 0.5) * stepW;
    // Outer cream stepped diamond
    const drawDiamond = (rx, ry, color) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx, cy - ry);
      ctx.lineTo(cx + rx, cy);
      ctx.lineTo(cx, cy + ry);
      ctx.lineTo(cx - rx, cy);
      ctx.closePath();
      ctx.fill();
    };
    drawDiamond(stepW * 0.42, h * 0.105, '#fff6e6');
    drawDiamond(stepW * 0.30, h * 0.075, '#f4b942');
    drawDiamond(stepW * 0.19, h * 0.048, '#961d22');
    drawDiamond(stepW * 0.09, h * 0.024, i % 2 === 0 ? '#39ada1' : '#fff6e6');

    // Zigzag accents along lower coral band
    const zy = 0.71 * h;
    ctx.strokeStyle = '#fff5e4';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(i * stepW, zy + 14);
    ctx.lineTo(cx, zy - 14);
    ctx.lineTo((i + 1) * stepW, zy + 14);
    ctx.stroke();
  }

  // Woven warp/weft yarn grain on both color and bump map
  for (let y = 0; y < h; y += 4) {
    for (let x = 0; x < w; x += 6) {
      const odd = ((x / 6 + y / 4) | 0) % 2 === 0;
      ctx.fillStyle = odd ? 'rgba(255,245,230,0.08)' : 'rgba(60,10,10,0.08)';
      ctx.fillRect(x, y, 5, 3);
      bctx.fillStyle = odd ? '#b8b8b8' : '#525252';
      bctx.fillRect(x, y, 5, 3);
    }
  }

  const colTex = new THREE.CanvasTexture(colCanvas);
  colTex.colorSpace = THREE.SRGBColorSpace;
  colTex.wrapS = THREE.RepeatWrapping;
  colTex.wrapT = THREE.RepeatWrapping;
  colTex.anisotropy = 8;

  const bumpTex = new THREE.CanvasTexture(bumpCanvas);
  bumpTex.wrapS = THREE.RepeatWrapping;
  bumpTex.wrapT = THREE.RepeatWrapping;
  bumpTex.anisotropy = 4;

  return { colTex, bumpTex };
}

// ---------------------------------------------------------------------------
// Shared Wind & Fleece Shader System (26,400+ Crimped Strands & Micro-Curls)
// ---------------------------------------------------------------------------
const fleeceUniforms = {
  uTime: { value: 0 },
  uWindStrength: { value: 1.0 }
};

const windGLSL = `
attribute float aStrandH;
attribute vec2 aBrushXZ;
attribute float aPhase;
uniform float uTime;
uniform float uWindStrength;

vec3 computeAlpacaWind(vec3 wp, float t, float ph) {
  float w1 = sin(wp.x * 2.7 - wp.z * 2.3 - t * 2.65 + sin(wp.y * 2.2 + t * 1.15) * 0.55);
  float w2 = sin(wp.z * 4.6 + wp.y * 3.4 - t * 3.9 + ph * 0.4);
  float gust = 0.62 + 0.38 * sin(t * 0.92 - wp.x * 0.75 + wp.z * 0.65);
  float amp = (0.0155 * w1 + 0.0058 * w2) * gust * uWindStrength;
  float flutter = sin(t * 5.8 + ph) * 0.0022 * uWindStrength;
  return vec3(amp * 0.86 + flutter, amp * 0.16, -amp * 0.64 - flutter * 0.5);
}
`;

const fleeceMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.84,
  metalness: 0.0,
  envMapIntensity: 0.52
});

fleeceMaterial.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = fleeceUniforms.uTime;
  shader.uniforms.uWindStrength = fleeceUniforms.uWindStrength;

  shader.vertexShader = shader.vertexShader.replace(
    '#include <common>',
    `#include <common>
    varying float vStrandH;
    ${windGLSL}`
  );

  shader.vertexShader = shader.vertexShader.replace(
    '#include <beginnormal_vertex>',
    `#include <beginnormal_vertex>
    #ifdef USE_INSTANCING
    {
      mat4 mInstW = modelMatrix * instanceMatrix;
      vec3 wRoot = mInstW[3].xyz;
      vec3 axX = normalize(mInstW[0].xyz);
      vec3 axZ = normalize(mInstW[2].xyz);
      vec3 windV = computeAlpacaWind(wRoot, uTime, aPhase);
      vec2 totBend = aBrushXZ + vec2(dot(windV, axX), dot(windV, axZ));
      float bMag = length(totBend);
      objectNormal = normalize(objectNormal + vec3(-totBend.x * aStrandH * 3.0, bMag * aStrandH * 1.1, -totBend.y * aStrandH * 3.0));
    }
    #endif`
  );

  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>
    vStrandH = aStrandH;
    #ifdef USE_INSTANCING
    {
      mat4 mInstW = modelMatrix * instanceMatrix;
      vec3 wRoot = mInstW[3].xyz;
      float sX = max(length(mInstW[0].xyz), 0.0001);
      float sY = max(length(mInstW[1].xyz), 0.0001);
      float sZ = max(length(mInstW[2].xyz), 0.0001);
      vec3 axX = mInstW[0].xyz / sX;
      vec3 axZ = mInstW[2].xyz / sZ;
      vec3 windV = computeAlpacaWind(wRoot, uTime, aPhase);
      vec2 totBend = aBrushXZ + vec2(dot(windV, axX), dot(windV, axZ));
      float bLen = length(totBend);
      float relB = min(bLen / sY, 0.85);
      if (bLen > 0.00001) {
        totBend *= (relB * sY) / bLen;
      }
      float bendW = aStrandH * aStrandH * (1.35 - 0.35 * aStrandH);
      transformed.x += (totBend.x * bendW) / sX;
      transformed.z += (totBend.y * bendW) / sZ;
      transformed.y -= 0.42 * relB * relB * bendW;
    }
    #endif`
  );

  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <common>',
    `#include <common>
    varying float vStrandH;`
  );

  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <color_fragment>',
    `#include <color_fragment>
    vec3 rootChampagne = vec3(0.885, 0.825, 0.725);
    vec3 tipCloudCream = vec3(1.025, 1.008, 0.982);
    diffuseColor.rgb *= mix(rootChampagne, tipCloudCream, smoothstep(0.0, 0.86, vStrandH));`
  );

  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <emissive_fragment>',
    `#include <emissive_fragment>
    vec3 vDir = normalize(vViewPosition);
    vec3 nDir = normalize(vNormal);
    float fuzzRim = pow(clamp(1.0 - abs(dot(nDir, vDir)), 0.0, 1.0), 2.35);
    vec3 cloudScatter = vec3(0.155, 0.140, 0.118) * mix(0.48, 1.0, vStrandH);
    vec3 sunlitHalo = vec3(0.25, 0.225, 0.19) * fuzzRim * (0.35 + 0.65 * vStrandH);
    totalEmissiveRadiance += diffuseColor.rgb * (cloudScatter + sunlitHalo);`
  );
};
fleeceMaterial.customProgramCacheKey = () => 'alpaca-cloud-fleece-v1';

const fleeceDepthMaterial = new THREE.MeshDepthMaterial({
  depthPacking: THREE.RGBADepthPacking
});
fleeceDepthMaterial.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = fleeceUniforms.uTime;
  shader.uniforms.uWindStrength = fleeceUniforms.uWindStrength;
  shader.vertexShader = shader.vertexShader.replace(
    '#include <common>',
    `#include <common>
    ${windGLSL}`
  );
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>
    #ifdef USE_INSTANCING
    {
      mat4 mInstW = modelMatrix * instanceMatrix;
      vec3 wRoot = mInstW[3].xyz;
      float sX = max(length(mInstW[0].xyz), 0.0001);
      float sY = max(length(mInstW[1].xyz), 0.0001);
      float sZ = max(length(mInstW[2].xyz), 0.0001);
      vec3 axX = mInstW[0].xyz / sX;
      vec3 axZ = mInstW[2].xyz / sZ;
      vec3 windV = computeAlpacaWind(wRoot, uTime, aPhase);
      vec2 totBend = aBrushXZ + vec2(dot(windV, axX), dot(windV, axZ));
      float bLen = length(totBend);
      float relB = min(bLen / sY, 0.85);
      if (bLen > 0.00001) {
        totBend *= (relB * sY) / bLen;
      }
      float bendW = aStrandH * aStrandH * (1.35 - 0.35 * aStrandH);
      transformed.x += (totBend.x * bendW) / sX;
      transformed.z += (totBend.y * bendW) / sZ;
      transformed.y -= 0.42 * relB * relB * bendW;
    }
    #endif`
  );
};
fleeceDepthMaterial.customProgramCacheKey = () => 'alpaca-cloud-fleece-depth-v1';

// ---------------------------------------------------------------------------
// 3D Crimped Fleece Strand & Fluffy Micro-Curl Geometries
// ---------------------------------------------------------------------------
function buildLoftedTubeGeometry(spineFn, radiusFn, segsY = 6, radialSegs = 5) {
  const positions = [];
  const strandH = [];
  const indices = [];

  const pPrev = new THREE.Vector3();
  const pCurr = new THREE.Vector3();
  const pNext = new THREE.Vector3();
  const tangent = new THREE.Vector3();
  const normal = new THREE.Vector3();
  const binormal = new THREE.Vector3();
  const upRef = new THREE.Vector3(0, 0, 1);

  for (let iy = 0; iy <= segsY; iy++) {
    const t = iy / segsY;
    spineFn(t, pCurr);
    spineFn(Math.max(0, t - 0.04), pPrev);
    spineFn(Math.min(1, t + 0.04), pNext);
    tangent.subVectors(pNext, pPrev).normalize();

    if (Math.abs(tangent.dot(upRef)) > 0.94) {
      normal.set(1, 0, 0).cross(tangent).normalize();
    } else {
      normal.crossVectors(upRef, tangent).normalize();
    }
    binormal.crossVectors(tangent, normal).normalize();

    const r = radiusFn(t);
    for (let ir = 0; ir < radialSegs; ir++) {
      const ang = (ir / radialSegs) * Math.PI * 2;
      const ca = Math.cos(ang);
      const sa = Math.sin(ang);
      const vx = pCurr.x + (normal.x * ca + binormal.x * sa) * r;
      const vy = pCurr.y + (normal.y * ca + binormal.y * sa) * r;
      const vz = pCurr.z + (normal.z * ca + binormal.z * sa) * r;
      positions.push(vx, vy, vz);
      strandH.push(t);
    }
  }

  // Rounded soft dome cap vertex at tip
  const tipCenter = new THREE.Vector3();
  spineFn(1.0, tipCenter);
  const tipIdx = positions.length / 3;
  positions.push(tipCenter.x, tipCenter.y + 0.025, tipCenter.z);
  strandH.push(1.0);

  for (let iy = 0; iy < segsY; iy++) {
    const rowA = iy * radialSegs;
    const rowB = (iy + 1) * radialSegs;
    for (let ir = 0; ir < radialSegs; ir++) {
      const irNext = (ir + 1) % radialSegs;
      const a = rowA + ir;
      const b = rowA + irNext;
      const c = rowB + irNext;
      const d = rowB + ir;
      indices.push(a, b, c, a, c, d);
    }
  }

  const lastRow = segsY * radialSegs;
  for (let ir = 0; ir < radialSegs; ir++) {
    const irNext = (ir + 1) % radialSegs;
    indices.push(lastRow + ir, lastRow + irNext, tipIdx);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aStrandH', new THREE.Float32BufferAttribute(strandH, 1));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// 1) Crimped Huacaya/Suri Fleece Lock (3D sinusoidal crimp + plump soft tip)
const crimpedStrandGeo = buildLoftedTubeGeometry(
  (t, out) => {
    const crimpWave = Math.sin(t * Math.PI * 3.4) * 0.105 * Math.sin(t * Math.PI * 0.88);
    const twistWave = Math.cos(t * Math.PI * 2.6) * 0.062 * t;
    const drape = 0.14 * t * t;
    out.set(crimpWave, t, twistWave + drape);
  },
  (t) => {
    const crimpPinch = 1.0 + 0.10 * Math.cos(t * Math.PI * 6.8);
    const profile = 0.135 + 0.055 * Math.sin(t * Math.PI * 0.82) - 0.105 * Math.pow(t, 2.4);
    return Math.max(0.035, profile * crimpPinch);
  },
  6,
  5
);

// 2) Cloud Bouclé Ringlet / Micro-Curl (coiled fluffy cloud curl)
const microCurlGeo = buildLoftedTubeGeometry(
  (t, out) => {
    const coilT = Math.max(0, (t - 0.18) / 0.82);
    const theta = coilT * Math.PI * 2.35;
    const loopR = 0.185 * Math.sin(coilT * Math.PI * 0.92);
    const cx = Math.cos(theta) * loopR * coilT;
    const cy = t * 0.72 + Math.sin(theta * 0.5) * 0.14 * coilT;
    const cz = Math.sin(theta) * loopR * coilT + 0.08 * t;
    out.set(cx, cy, cz);
  },
  (t) => {
    return Math.max(0.045, 0.155 + 0.045 * Math.sin(t * Math.PI) - 0.095 * Math.pow(t, 2.6));
  },
  6,
  5
);

// Helper height function of the small pastel meadow mound
function getMoundHeight(x, z) {
  const r2 = (x * x) / (1.42 * 1.42) + (z * z) / (1.28 * 1.28);
  if (r2 >= 1.25) return -0.32;
  // Flat-ish cozy plateau on top (y ≈ 0.0 for r < 0.45) curving smoothly down to -0.32
  const falloff = Math.pow(Math.max(0, 1.0 - r2 * 0.80), 1.65);
  const gentleRipple = (Math.sin(x * 3.8 + 0.5) * Math.cos(z * 4.1 - 0.3)) * 0.012 * Math.min(1, r2 * 2.2);
  return -0.32 + 0.328 * falloff + gentleRipple;
}

// Sculpted Pastel Meadow Mound
{
  const moundGeo = new THREE.CylinderGeometry(1.48, 1.56, 0.36, 72, 18, false);
  const pos = moundGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const topMint = new THREE.Color(0xc6e5be);
  const cloverCream = new THREE.Color(0xd9efd0);
  const sageRim = new THREE.Color(0xaed4b0);
  const earthBase = new THREE.Color(0xd2c8b8);
  const cTmp = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    let vx = pos.getX(i);
    let vy = pos.getY(i);
    let vz = pos.getZ(i);
    // Normalize cylinder height [-0.18, +0.18] -> [0, 1]
    const hNorm = (vy + 0.18) / 0.36;
    const radScale = 1.0 + 0.035 * Math.sin(Math.atan2(vz, vx) * 5.0 + 0.8);
    vx *= radScale;
    vz *= radScale;

    const surfY = getMoundHeight(vx, vz);
    const finalY = THREE.MathUtils.lerp(-0.33, surfY, Math.pow(hNorm, 0.75));
    pos.setXYZ(i, vx, finalY, vz);

    const rDist = Math.hypot(vx / 1.42, vz / 1.28);
    const patch = 0.5 + 0.5 * Math.sin(vx * 5.2 + vz * 4.4);
    cTmp.copy(topMint).lerp(cloverCream, patch * 0.55);
    cTmp.lerp(sageRim, THREE.MathUtils.smoothstep(rDist, 0.45, 0.92) * 0.65);
    cTmp.lerp(earthBase, THREE.MathUtils.smoothstep(finalY, -0.16, -0.32) * 0.85);
    cols[i * 3] = cTmp.r;
    cols[i * 3 + 1] = cTmp.g;
    cols[i * 3 + 2] = cTmp.b;
  }
  moundGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  moundGeo.computeVertexNormals();

  const moundMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.92,

  meadowGroup.add(moundMesh);
}

    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      `#include <common>
      attribute float aBladeH;
      uniform float uTime;`
    );
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
      #ifdef USE_INSTANCING
      {
        vec3 wPos = (modelMatrix * instanceMatrix)[3].xyz;
        float sw = sin(wPos.x * 2.6 - wPos.z * 2.2 - uTime * 2.6) * 0.16;
        transformed.x += sw * aBladeH * aBladeH;
        transformed.z -= sw * 0.6 * aBladeH * aBladeH;
      }
      #endif`
    );
  };

  const grassCount = 1350;
  const grassInst = new THREE.InstancedMesh(bladeGeo, grassMat, grassCount);
  grassInst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  const c1 = new THREE.Color(0xb5dfae);
  const c2 = new THREE.Color(0xd2ecc2);
  const c3 = new THREE.Color(0x9fd0a4);
  const cPick = new THREE.Color();

  let gi = 0;
  let guard = 0;
  while (gi < grassCount && guard < 12000) {
    guard++;
    const ang = rng() * Math.PI * 2;
    const rad = Math.sqrt(rng()) * 1.32;
    const gx = Math.cos(ang) * rad * 1.02;
    const gz = Math.sin(ang) * rad * 0.92;
    // Keep tiny clearings right on the 4 hooves so hooves read super cleanly
    const dHoof = Math.min(
      Math.hypot(gx + 0.185, gz - 0.255),
      Math.hypot(gx - 0.185, gz - 0.255),
      Math.hypot(gx + 0.195, gz + 0.275),
      Math.hypot(gx - 0.195, gz + 0.275)
    );
    if (dHoof < 0.085 && rng() < 0.85) continue;

    const gy = getMoundHeight(gx, gz);
    if (gy < -0.26) continue;

    dummy.position.set(gx, gy - 0.008, gz);
    dummy.rotation.set((rng() - 0.5) * 0.35, rng() * Math.PI * 2, (rng() - 0.5) * 0.35);
    const hScale = 0.048 + rng() * 0.068 * (0.55 + 0.45 * rad);
    dummy.scale.set(0.85 + rng() * 0.5, hScale, 0.85 + rng() * 0.5);
    dummy.updateMatrix();
    grassInst.setMatrixAt(gi, dummy.matrix);

    cPick.copy(c1).lerp(c2, rng()).lerp(c3, rng() * 0.35);
    grassInst.setColorAt(gi, cPick);
    gi++;
  }
  grassInst.count = gi;
  grassInst.instanceMatrix.needsUpdate = true;
  if (grassInst.instanceColor) grassInst.instanceColor.needsUpdate = true;
  meadowGroup.add(grassInst);
}

// Helper to create an ellipsoid mesh & SDF descriptor for clean cloud union sampling
function createEllipsoidLobe(cx, cy, cz, rx, ry, rz, rotX = 0, rotY = 0, rotZ = 0, segs = 24) {
  const geo = new THREE.SphereGeometry(1, segs, Math.round(segs * 0.75));
  const mesh = new THREE.Mesh(geo, undercoatMat);
  mesh.position.set(cx, cy, cz);
  mesh.rotation.set(rotX, rotY, rotZ);
  mesh.scale.set(rx, ry, rz);
  mesh.castShadow = true;
  mesh.receiveShadow = false;
  mesh.updateMatrix();

  const invMat = mesh.matrix.clone().invert();
  return {
    mesh,
    cx, cy, cz, rx, ry, rz,
    matrix: mesh.matrix.clone(),
    invMat
  };
}

    const foldWave = Math.sin(theta * 7.0) * 0.0038 * v * (0.35 + 0.65 * frontFactor);

    const r = THREE.MathUtils.lerp(topR, botR, v) + foldWave;
    const y = THREE.MathUtils.lerp(0.032, 0.032 - bibDrop, v);
    out.set(Math.sin(theta) * r, y, Math.cos(theta) * r);
  }

  const pTmp = new THREE.Vector3();
  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV;
    for (let iu = 0; iu <= segU; iu++) {
      const u = iu / segU;
      bandanaSurface(u, v, pTmp);
      bPos.push(pTmp.x, pTmp.y, pTmp.z);
      bUV.push(u * 2.5, v);
    }
  }
  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * (segU + 1) + iu;
      const b = a + 1;
      const c = a + (segU + 1) + 1;
      const d = a + (segU + 1);
      bIdx.push(a, d, c, a, c, b);
    }
  }

  const bandanaGeo = new THREE.BufferGeometry();
  bandanaGeo.setAttribute('position', new THREE.Float32BufferAttribute(bPos, 3));
  bandanaGeo.setAttribute('uv', new THREE.Float32BufferAttribute(bUV, 2));
  bandanaGeo.setIndex(bIdx);
  bandanaGeo.computeVertexNormals();

  const bandanaMesh = new THREE.Mesh(bandanaGeo, bandanaMat);
  bandanaMesh.castShadow = true;
  bandanaMesh.receiveShadow = true;
  bandanaGroup.add(bandanaMesh);

  // Cute rolled top collar trim & back knot
  const trimPts = [];
  for (let i = 0; i <= 48; i++) {
    const pt = new THREE.Vector3();
    bandanaSurface(i / 48, 0.04, pt);
    trimPts.push(pt);
  }
  const trimCurve = new THREE.CatmullRomCurve3(trimPts, true);
  const trimMesh = new THREE.Mesh(
    new THREE.TubeGeometry(trimCurve, 56, 0.0085, 8, true),
    new THREE.MeshStandardMaterial({ color: 0xd93832, roughness: 0.78 })
  );
  trimMesh.castShadow = true;
  bandanaGroup.add(trimMesh);

  // Back knot + 2 cute woven tie ends
  const knot = new THREE.Mesh(
    new THREE.SphereGeometry(0.022, 12, 10),
    bandanaMat
  );
  knot.scale.set(1.2, 0.95, 0.9);
  knot.position.set(0, 0.005, -0.168);
  bandanaGroup.add(knot);

  // 9 Dangling Andean Yarn Pom-Poms & Fringe Tassels along the front V-trim!
  const pomColors = [0xe8443c, 0xf4b942, 0xfff3de, 0xf06d7e, 0xe8443c, 0xf06d7e, 0xfff3de, 0xf4b942, 0xe8443c];
  const fringeColors = [0xfff3de, 0xe8443c, 0xf4b942, 0xe8443c, 0xf4b942, 0xe8443c, 0xf4b942, 0xe8443c, 0xfff3de];
  const cordMat = new THREE.MeshStandardMaterial({ color: 0xf6c65b, roughness: 0.75 });

  // Reusable puffy bumpy yarn pom-pom geometry
  const pomGeo = new THREE.SphereGeometry(0.017, 14, 12);
  const pp = pomGeo.attributes.position;
  for (let i = 0; i < pp.count; i++) {
    const vx = pp.getX(i), vy = pp.getY(i), vz = pp.getZ(i);
    const bump = 1.0 + 0.16 * Math.sin(vx * 420) * Math.cos(vy * 420) * Math.sin(vz * 420);
    pp.setXYZ(i, vx * bump, vy * bump, vz * bump);
  }
  pomGeo.computeVertexNormals();

  for (let t = 0; t < 9; t++) {
    const u = 0.25 + (t / 8) * 0.50; // spans front V-edge symmetrically, t=4 is center point!
    const anchor = new THREE.Vector3();
    bandanaSurface(u, 0.97, anchor);

    const tPivot = new THREE.Group();
    tPivot.position.copy(anchor);
    // Counter-rotate slightly so tassels hang naturally downward with gravity
    const restRotX = -0.22;
    tPivot.rotation.x = restRotX;
    bandanaGroup.add(tPivot);

    const isCenter = t === 4;
    const scaleT = isCenter ? 1.28 : (t % 2 === 0 ? 1.02 : 0.88);

    // Braided hanging cord
    const cordLen = 0.022 * scaleT;
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.0028, 0.0028, cordLen, 6), cordMat);
    cord.position.y = -cordLen * 0.5;
    tPivot.add(cord);

    // Fluffy Andean Pom-Pom ball
    const pomMat = new THREE.MeshStandardMaterial({ color: pomColors[t], roughness: 0.88 });
    const pom = new THREE.Mesh(pomGeo, pomMat);
    pom.scale.setScalar(scaleT);
    pom.position.y = -cordLen - 0.012 * scaleT;
    pom.castShadow = true;
    tPivot.add(pom);

    // Flared multi-strand yarn tassel skirt beneath pom-pom
    const skirtMat = new THREE.MeshStandardMaterial({ color: fringeColors[t], roughness: 0.86 });
    const skirtGroup = new THREE.Group();
    skirtGroup.position.y = pom.position.y - 0.010 * scaleT;
    const numThreads = 7;
    for (let s = 0; s < numThreads; s++) {
      const sa = (s / numThreads) * Math.PI * 2;
      const th = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0036, 0.028 * scaleT, 5), skirtMat);
      th.position.set(Math.cos(sa) * 0.005 * scaleT, -0.013 * scaleT, Math.sin(sa) * 0.005 * scaleT);
      th.rotation.z = Math.cos(sa) * 0.24;
      th.rotation.x = -Math.sin(sa) * 0.24;
      skirtGroup.add(th);
    }
    tPivot.add(skirtGroup);

    tasselRigList.push({
      pivot: tPivot,
      restRotX,
      phase: t * 0.75,
      velX: 0,
      velZ: 0,
      offX: 0,
      offZ: 0
    });
  }
}

// 5. Spear-Shaped Alpaca Ears (Fluffy Outer Back, Cleanly Defined Pink Inner!)
// ---------------------------------------------------------------------------
function createSpearEarGeometry(side) {
  const segV = 28, segU = 28;
  const positions = [];
  const colors = [];
  const indices = [];

  const outerCream = new THREE.Color(0xfaf2e2);
  const innerRim = new THREE.Color(0xfbe2de);
  const innerPink = new THREE.Color(0xf3b8bf);
  const innerDeep = new THREE.Color(0xe598a3);
  const cTmp = new THREE.Color();

  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV; // 0 = base, 1 = spear tip
    // Spear leaf width profile: slender base -> broad mid -> graceful pointed-rounded spear tip
    const halfW = 0.036 * Math.sin(Math.pow(v, 0.68) * Math.PI * 0.95) + 0.013 * Math.pow(1.0 - v, 1.5);
    const depth = (0.024 * (1.0 - 0.68 * v) + 0.005);
    // Subtle authentic alpaca inward-forward spear tip curve
    const spineX = -side * 0.017 * Math.pow(v, 2.2);
    const spineY = v * 0.192;
    const spineZ = 0.020 * Math.pow(v, 2.0);

    for (let iu = 0; iu <= segU; iu++) {
      const u = (iu / segU) * Math.PI * 2;
      const cu = Math.cos(u);
      const su = Math.sin(u); // su > 0 is front (+Z inner cavity), su < 0 is back (-Z outer)

      const lx = cu * halfW;
      let lz;
      let innerAmount = 0;

      if (su > 0) {
        // Concave cleanly defined inner spear hollow with raised outer ear rims
        const rimFactor = Math.pow(Math.abs(cu), 2.4);
        const hollowMask = Math.sin(Math.min(1, Math.max(0, (v - 0.03) / 0.91)) * Math.PI);
        const cup = -0.58 * depth * su * (1.0 - rimFactor) * hollowMask;
        const rimLift = 0.28 * depth * su * rimFactor;
        lz = cup + rimLift;
        innerAmount = su * (1.0 - 0.65 * rimFactor) * hollowMask;
      } else {
        // Smooth convex outer back of ear
        lz = -depth * Math.pow(-su, 0.82);
      }

      positions.push(spineX + lx, spineY, spineZ + lz);

      if (innerAmount > 0.08) {
        const tPink = Math.min(1, (innerAmount - 0.08) / 0.65);
        cTmp.copy(innerRim).lerp(innerPink, tPink).lerp(innerDeep, (1.0 - v) * tPink * 0.48);
      } else {
        cTmp.copy(outerCream);
      }
      colors.push(cTmp.r, cTmp.g, cTmp.b);
    }
  }

  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * (segU + 1) + iu;
      const b = a + 1;
      const c = a + (segU + 1) + 1;
      const d = a + (segU + 1);
      indices.push(a, b, c, a, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// Surface Sampler & 26,400+ Fleece InstancedMesh Generator
// ---------------------------------------------------------------------------
const fleeceLayers = []; // Tracked for interactive spring-physics mouse brushing
let totalFleeceCount = 0;

// Warm cream-white & soft champagne-ivory natural palette
const paletteStops = [
  new THREE.Color(0xfffdf7), // luminous cloud cream-white
  new THREE.Color(0xfcf6ea), // warm milk ivory
  new THREE.Color(0xf8eedb), // soft buttercream
  new THREE.Color(0xf3e4ca), // soft champagne-ivory
  new THREE.Color(0xfaf3e5), // pearl fleece
  new THREE.Color(0xefe0c4)  // warm toasted champagne accent
];

function pickFleeceColor(outCol) {
  const idx = Math.floor(rng() * paletteStops.length);
  const nextIdx = (idx + 1) % paletteStops.length;
  outCol.copy(paletteStops[idx]).lerp(paletteStops[nextIdx], rng());
  const brightJitter = 0.975 + rng() * 0.045;
  outCol.multiplyScalar(brightJitter);
  return outCol;
}

function buildTriangleTable(meshesInGroupSpace) {
  const tris = [];
  let totalArea = 0;
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const nA = new THREE.Vector3(), nB = new THREE.Vector3(), nC = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), cross = new THREE.Vector3();
  const normalMat = new THREE.Matrix3();

  for (const m of meshesInGroupSpace) {
    m.updateMatrix();
    const mat = m.matrix;
    normalMat.getNormalMatrix(mat);
    const geo = m.geometry;
    const pos = geo.attributes.position;
    const norm = geo.attributes.normal;
    const index = geo.index;
    const triCount = index ? index.count / 3 : pos.count / 3;

    for (let t = 0; t < triCount; t++) {
      const i0 = index ? index.getX(t * 3) : t * 3;
      const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
      const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;

      vA.fromBufferAttribute(pos, i0).applyMatrix4(mat);
      vB.fromBufferAttribute(pos, i1).applyMatrix4(mat);
      vC.fromBufferAttribute(pos, i2).applyMatrix4(mat);

      e1.subVectors(vB, vA);
      e2.subVectors(vC, vA);
      cross.crossVectors(e1, e2);
      const area = 0.5 * cross.length();
      if (area < 1e-8) continue;

      nA.fromBufferAttribute(norm, i0).applyMatrix3(normalMat).normalize();
      nB.fromBufferAttribute(norm, i1).applyMatrix3(normalMat).normalize();
      nC.fromBufferAttribute(norm, i2).applyMatrix3(normalMat).normalize();

      totalArea += area;
      tris.push({
        cumArea: totalArea,
        ax: vA.x, ay: vA.y, az: vA.z,
        bx: vB.x, by: vB.y, bz: vB.z,
        cx: vC.x, cy: vC.y, cz: vC.z,
        nax: nA.x, nay: nA.y, naz: nA.z,
        nbx: nB.x, nby: nB.y, nbz: nB.z,
        ncx: nC.x, ncy: nC.y, ncz: nC.z
      });
    }
  }
  return { tris, totalArea };
}

function populateFleeceOnGroup({
  parentGroup,
  sourceMeshes,
  unionLobes = null,
  crimpedCount,
  curlCount,
  lenRange = [0.068, 0.105],
  widthRange = [0.088, 0.130],
  curlLenRange = [0.055, 0.085],
  curlWidthRange = [0.105, 0.148],
  growthBias = new THREE.Vector3(0, -0.18, -0.04),
  filterAndModulate = null
}) {
  const table = buildTriangleTable(sourceMeshes);
  if (table.tris.length === 0) return;

  const pSample = new THREE.Vector3();
  const nSample = new THREE.Vector3();
  const localCheck = new THREE.Vector3();

  function pickTriangle(targetArea) {
    let lo = 0, hi = table.tris.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (table.tris[mid].cumArea < targetArea) lo = mid + 1;
      else hi = mid;
    }
    return table.tris[lo];
  }

  function spawnLayer(geometry, targetCount, lRange, wRange) {
    if (targetCount <= 0) return;

    const instMesh = new THREE.InstancedMesh(geometry, fleeceMaterial, targetCount);
    instMesh.castShadow = true;
    instMesh.receiveShadow = false; // Crisp cloud shading free of sub-texel fur shadow acne
    instMesh.customDepthMaterial = fleeceDepthMaterial;
    instMesh.frustumCulled = false;

    const brushArr = new Float32Array(targetCount * 2);
    const phaseArr = new Float32Array(targetCount);
    const brushAttr = new THREE.InstancedBufferAttribute(brushArr, 2);
    brushAttr.setUsage(THREE.DynamicDrawUsage);
    geometry = instMesh.geometry; // shared geometry? Wait: each InstancedMesh MUST have its own per-instance attribute buffer!

    // Clone lightweight BufferGeometry wrapper sharing vertex/index GPU buffers so each InstancedMesh owns its own InstancedBufferAttributes!
    const instGeo = geometry.clone();
    instGeo.setAttribute('aBrushXZ', brushAttr);
    const phaseAttr = new THREE.InstancedBufferAttribute(phaseArr, 1);
    instGeo.setAttribute('aPhase', phaseAttr);
    instMesh.geometry = instGeo;

    const roots = new Float32Array(targetCount * 3);
    const tanX = new Float32Array(targetCount * 3);
    const tanZ = new Float32Array(targetCount * 3);
    const velXZ = new Float32Array(targetCount * 2);
    const omegaArr = new Float32Array(targetCount);

    const mat4 = new THREE.Matrix4();
    const axisX = new THREE.Vector3();
    const axisY = new THREE.Vector3();
    const axisZ = new THREE.Vector3();
    const refUp = new THREE.Vector3();
    const tX = new THREE.Vector3();
    const tZ = new THREE.Vector3();
    const colTmp = new THREE.Color();
    const modResult = { scaleMult: 1.0, tiltAddX: 0, tiltAddY: 0, tiltAddZ: 0, tint: null };

    let placed = 0;
    let attempts = 0;
    const maxAttempts = targetCount * 35;

    while (placed < targetCount && attempts < maxAttempts) {
      attempts++;
      const tri = pickTriangle(rng() * table.totalArea);

      let u = rng(), v = rng();
      if (u + v > 1.0) { u = 1.0 - u; v = 1.0 - v; }
      const w = 1.0 - u - v;

      pSample.set(
        tri.ax * w + tri.bx * u + tri.cx * v,
        tri.ay * w + tri.by * u + tri.cy * v,
        tri.az * w + tri.bz * u + tri.cz * v
      );
      nSample.set(
        tri.nax * w + tri.nbx * u + tri.ncx * v,
        tri.nay * w + tri.nby * u + tri.ncy * v,
        tri.naz * w + tri.nbz * u + tri.ncz * v
      ).normalize();

      // Reject interior faces buried strictly inside overlapping cloud lobes
      if (unionLobes) {
        let buried = false;
        for (let li = 0; li < unionLobes.length; li++) {
          localCheck.copy(pSample).applyMatrix4(unionLobes[li].invMat);
          if (localCheck.lengthSq() < 0.935) {
            buried = true;
            break;
          }
        }
        if (buried) continue;
      }

      modResult.scaleMult = 1.0;
      modResult.tiltAddX = 0;
      modResult.tiltAddY = 0;
      modResult.tiltAddZ = 0;
      modResult.tint = null;

      if (filterAndModulate && !filterAndModulate(pSample, nSample, modResult)) {
        continue;
      }

      const tf = tuftField(pSample.x, pSample.y, pSample.z);
      axisY.set(
        nSample.x + tf.x * 0.24 + growthBias.x + modResult.tiltAddX,
        nSample.y + tf.y * 0.24 + growthBias.y + modResult.tiltAddY,
        nSample.z + tf.z * 0.24 + growthBias.z + modResult.tiltAddZ
      ).normalize();

      // Guarantee strands always grow outward from skin
      const nDot = axisY.dot(nSample);
      if (nDot < 0.24) {
        axisY.addScaledVector(nSample, 0.35 - nDot).normalize();
      }

      if (Math.abs(axisY.y) < 0.92) refUp.set(0, 1, 0);
      else refUp.set(1, 0, 0);

      tX.crossVectors(refUp, axisY).normalize();
      tZ.crossVectors(axisY, tX).normalize();

      const spin = rng() * Math.PI * 2;
      const cs = Math.cos(spin), ss = Math.sin(spin);
      axisX.set(tX.x * cs + tZ.x * ss, tX.y * cs + tZ.y * ss, tX.z * cs + tZ.z * ss);
      axisZ.set(-tX.x * ss + tZ.x * cs, -tX.y * ss + tZ.y * cs, -tX.z * ss + tZ.z * cs);

      const sLen = THREE.MathUtils.lerp(lRange[0], lRange[1], rng()) * modResult.scaleMult;
      const sWid = THREE.MathUtils.lerp(wRange[0], wRange[1], rng()) * (0.45 + 0.55 * modResult.scaleMult);

      // Sink root slightly into warm cream undercoat so zero root seams ever appear
      const rx = pSample.x - nSample.x * 0.008;
      const ry = pSample.y - nSample.y * 0.008;
      const rz = pSample.z - nSample.z * 0.008;

      const te = mat4.elements;
      te[0] = axisX.x * sWid; te[4] = axisY.x * sLen; te[8]  = axisZ.x * sWid; te[12] = rx;
      te[1] = axisX.y * sWid; te[5] = axisY.y * sLen; te[9]  = axisZ.y * sWid; te[13] = ry;
      te[2] = axisX.z * sWid; te[6] = axisY.z * sLen; te[10] = axisZ.z * sWid; te[14] = rz;
      te[3] = 0;              te[7] = 0;              te[11] = 0;              te[15] = 1;

      instMesh.setMatrixAt(placed, mat4);

      pickFleeceColor(colTmp);
      if (modResult.tint) {
        colTmp.lerp(modResult.tint, 0.28);
      }
      instMesh.setColorAt(placed, colTmp);

      roots[placed * 3] = rx;
      roots[placed * 3 + 1] = ry;
      roots[placed * 3 + 2] = rz;
      tanX[placed * 3] = axisX.x;
      tanX[placed * 3 + 1] = axisX.y;
      tanX[placed * 3 + 2] = axisX.z;
      tanZ[placed * 3] = axisZ.x;
      tanZ[placed * 3 + 1] = axisZ.y;
      tanZ[placed * 3 + 2] = axisZ.z;

      phaseArr[placed] = rng() * Math.PI * 2;
      omegaArr[placed] = 7.5 + rng() * 4.2;
      placed++;
    }

    instMesh.count = placed;
    instMesh.instanceMatrix.needsUpdate = true;
    if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
    phaseAttr.needsUpdate = true;
    parentGroup.add(instMesh);

    totalFleeceCount += placed;
    fleeceLayers.push({
      group: parentGroup,
      mesh: instMesh,
      count: placed,
      roots,
      tanX,
      tanZ,
      brushArr,
      brushAttr,
      velXZ,
      omegaArr,
      active: false
    });
  }

  spawnLayer(crimpedStrandGeo, crimpedCount, lenRange, widthRange);
  spawnLayer(microCurlGeo, curlCount, curlLenRange, curlWidthRange);
}

let hoverInterest = 0;
const hoverLookLocal = new THREE.Vector2(0, 0);
let hopTimer = -1;
let tailJoyBoost = 0;
let earPerkBoost = 0;

const invGroupMat = new THREE.Matrix4();
const hitLocal = new THREE.Vector3();
const strokeLocal = new THREE.Vector3();
const tasselWorldPos = new THREE.Vector3();

function applyFleeceBrushImpulse(worldCenter, worldImpulse, radius, radialBurstStrength = 0) {
  scene.updateMatrixWorld();
  const rSq = radius * radius;

  for (let li = 0; li < fleeceLayers.length; li++) {
    const layer = fleeceLayers[li];
    invGroupMat.copy(layer.group.matrixWorld).invert();
    hitLocal.copy(worldCenter).applyMatrix4(invGroupMat);

    // Transform world impulse direction into layer.group local space (pure rotation on groups)
    strokeLocal.copy(worldImpulse).transformDirection(invGroupMat).multiplyScalar(worldImpulse.length());

    const roots = layer.roots;
    const tanX = layer.tanX;
    const tanZ = layer.tanZ;
    const velXZ = layer.velXZ;
    const count = layer.count;
    let touched = false;

    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      const dx = roots[i3] - hitLocal.x;
      const dy = roots[i3 + 1] - hitLocal.y;
      const dz = roots[i3 + 2] - hitLocal.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= rSq) continue;

      const falloff = 1.0 - d2 / rSq;
      const weight = falloff * falloff;

      // Combine directional stroke combing + soft radial parting around cursor
      const invDist = 1.0 / (Math.sqrt(d2) + 0.025);
      const radScale = radialBurstStrength * invDist;
      const fx = (strokeLocal.x + dx * radScale) * weight;
      const fy = (strokeLocal.y + dy * radScale) * weight;
      const fz = (strokeLocal.z + dz * radScale) * weight;

      const i2 = i * 2;
      velXZ[i2]     += fx * tanX[i3] + fy * tanX[i3 + 1] + fz * tanX[i3 + 2];
      velXZ[i2 + 1] += fx * tanZ[i3] + fy * tanZ[i3 + 1] + fz * tanZ[i3 + 2];
      touched = true;
    }

    if (touched) layer.active = true;
  }

  // Also gently sway nearby coral-red Andean bandana tassels!
  for (const tas of tasselRigList) {
    tas.pivot.getWorldPosition(tasselWorldPos);
    const dTas = tasselWorldPos.distanceTo(worldCenter);
    if (dTas < radius * 1.25) {
      const tw = Math.pow(1.0 - dTas / (radius * 1.25), 1.5);
      tas.velZ += (worldImpulse.x * 16.0 + (tasselWorldPos.x - worldCenter.x) * radialBurstStrength * 28.0) * tw;
      tas.velX += (worldImpulse.z * 16.0 + (tasselWorldPos.z - worldCenter.z) * radialBurstStrength * 28.0) * tw;
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  isOrbitDragging = false;
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  pointerActive = true;
});

window.addEventListener('pointermove', (e) => {
  if (e.buttons !== 0) {
    const moveDist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    if (moveDist > 5) isOrbitDragging = true;
  } else {
    isOrbitDragging = false;
  }
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  pointerActive = true;
});

window.addEventListener('pointerup', (e) => {
  const moveDist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  if (moveDist <= 6) {
    // Click / tap interaction: check raycast on the baby alpaca!
    pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects(brushColliders, false);
    if (hits.length > 0) {
      // Energetic fluffy rosette poof + joyful baby alpaca hop, ear perk & tail wag!
      applyFleeceBrushImpulse(hits[0].point, new THREE.Vector3(0, 0.12, 0), 0.36, 0.72);
      hopTimer = 0.0;
      tailJoyBoost = 1.0;
      earPerkBoost = 1.0;
    }
  }
  isOrbitDragging = false;
});

canvas.addEventListener('pointerleave', () => {
  pointerActive = false;
  hasPrevHit = false;
});

// ---------------------------------------------------------------------------
// Animation Loop (Head Bob, Ear Rotation, Chewing, Tail Flick, Wind & Brushing)
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
let nextBlinkTime = 2.2;
let blinkTimer = -1;

function animate() {
  requestAnimationFrame(animate);

  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.033);
  const t = clock.elapsedTime;

  fleeceUniforms.uTime.value = t;

  // 1) Continuous Mouse Raycast Brushing Physics
  if (pointerActive && !isOrbitDragging) {
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects(brushColliders, false);
    if (hits.length > 0) {
      hitWorld.copy(hits[0].point);
      if (hasPrevHit) {
        strokeWorld.subVectors(hitWorld, prevHitWorld);
        const stepLen = strokeWorld.length();
        if (stepLen > 0.0006) {
          const clampedSpeed = Math.min(stepLen / Math.max(dt, 0.008), 2.4);
          strokeWorld.normalize().multiplyScalar(clampedSpeed * 0.24);
          applyFleeceBrushImpulse(hitWorld, strokeWorld, 0.25, 0.16);
        } else {
          // Gentle subtle hover parting when resting cursor on the fleece
          applyFleeceBrushImpulse(hitWorld, strokeWorld.set(0, 0, 0), 0.19, 0.035);
        }
      } else {
        applyFleeceBrushImpulse(hitWorld, strokeWorld.set(0, 0, 0), 0.21, 0.14);
      }
      prevHitWorld.copy(hitWorld);
      hasPrevHit = true;

      hoverInterest = THREE.MathUtils.lerp(hoverInterest, 1.0, dt * 4.5);
      hoverLookLocal.x = THREE.MathUtils.clamp(hitWorld.x * 0.42, -0.22, 0.22);
      hoverLookLocal.y = THREE.MathUtils.clamp((hitWorld.y - 1.25) * 0.28, -0.14, 0.16);
      tailJoyBoost = Math.min(1.0, tailJoyBoost + dt * 1.4);
    } else {
      hasPrevHit = false;
      hoverInterest = THREE.MathUtils.lerp(hoverInterest, 0.0, dt * 2.5);
    }
  } else {
    hasPrevHit = false;
    hoverInterest = THREE.MathUtils.lerp(hoverInterest, 0.0, dt * 2.5);
  }

  // Integrate per-strand damped harmonic springs for brushed fleece
  for (let li = 0; li < fleeceLayers.length; li++) {
    const layer = fleeceLayers[li];
    if (!layer.active) continue;

    const pos = layer.brushArr;
    const vel = layer.velXZ;
    const omega = layer.omegaArr;
    const n = layer.count;
    let maxEnergy = 0;

    for (let i = 0; i < n; i++) {
      const i2 = i * 2;
      let px = pos[i2];
      let pz = pos[i2 + 1];
      let vx = vel[i2];
      let vz = vel[i2 + 1];

      if (px === 0 && pz === 0 && vx === 0 && vz === 0) continue;

      const w = omega[i];
      const stiff = w * w;
      const damp = 2.0 * 0.44 * w; // Springy wool bounce with cozy overshoot!

      vx += (-stiff * px - damp * vx) * dt;
      vz += (-stiff * pz - damp * vz) * dt;
      px += vx * dt;
      pz += vz * dt;

      // Soft max bend clamp
      const magSq = px * px + pz * pz;
      if (magSq > 0.0144) {
        const s = 0.12 / Math.sqrt(magSq);
        px *= s;
        pz *= s;
      }

      const energy = Math.abs(px) + Math.abs(pz) + (Math.abs(vx) + Math.abs(vz)) * 0.08;
      if (energy < 0.00025) {
        px = 0; pz = 0; vx = 0; vz = 0;
      } else if (energy > maxEnergy) {
        maxEnergy = energy;
      }

      pos[i2] = px;
      pos[i2 + 1] = pz;
      vel[i2] = vx;
      vel[i2 + 1] = vz;
    }

    layer.brushAttr.needsUpdate = true;
    if (maxEnergy === 0) layer.active = false;
  }

  // 2) Playful Hop on Click + Cozy Breathing Body
  let hopY = 0;
  let hopPitch = 0;
  if (hopTimer >= 0) {
    hopTimer += dt;
    if (hopTimer < 0.52) {
      const u = hopTimer / 0.52;
      hopY = Math.sin(u * Math.PI) * 0.048 * (1.0 - 0.25 * u);
      hopPitch = Math.sin(u * Math.PI * 2) * 0.045;
    } else {
      hopTimer = -1;
    }
  }
  alpacaRoot.position.y = 0.008 + hopY;
  bodyContactShadow.material.opacity = 0.46 * (1.0 - hopY * 4.5);

  const breath = Math.sin(t * 2.15);
  bodyGroup.position.y = 0.66 + breath * 0.0075;
  bodyGroup.rotation.x = hopPitch + Math.sin(t * 1.45) * 0.012;
  bodyGroup.rotation.z = Math.sin(t * 0.95) * 0.014;
  bodyGroup.scale.set(1.0 + breath * 0.012, 1.0 - breath * 0.006, 1.0 + breath * 0.008);

  // 3) Gentle Head Bobbing & Graceful Long Neck Sway
  const bobWave = Math.sin(t * 1.75);
  const curiosityTilt = Math.sin(t * 0.78) * 0.055 + Math.sin(t * 1.9) * 0.018;

  neckLowerGroup.rotation.x = bobWave * 0.032 + 0.02;
  neckLowerGroup.rotation.z = Math.sin(t * 0.85) * 0.024;

  neckUpperGroup.rotation.x = Math.sin(t * 1.75 - 0.45) * 0.038;
  neckUpperGroup.rotation.y = Math.sin(t * 0.62) * 0.055 + hoverLookLocal.x * hoverInterest * 0.45;

  headGroup.rotation.x = Math.sin(t * 1.75 - 0.85) * 0.048 - hoverLookLocal.y * hoverInterest * 0.55;
  headGroup.rotation.y = Math.sin(t * 0.62 - 0.3) * 0.075 + hoverLookLocal.x * hoverInterest * 0.85;
  headGroup.rotation.z = curiosityTilt + hoverLookLocal.x * hoverInterest * -0.18;

  // 4) Spear-Shaped Ear Rotation & Expressive Twitches
  earPerkBoost = Math.max(0, earPerkBoost - dt * 1.3);
  const twitchL = Math.pow(Math.max(0, Math.sin(t * 2.9 + Math.sin(t * 1.3) * 2.0)), 14.0) * 0.22;
  const twitchR = Math.pow(Math.max(0, Math.sin(t * 3.3 + 1.7 + Math.cos(t * 1.1) * 2.0)), 14.0) * 0.22;

  earLGroup.rotation.y = -0.18 + Math.sin(t * 1.35) * 0.16 + twitchL + earPerkBoost * 0.22;
  earLGroup.rotation.z =  0.28 + Math.sin(t * 1.05 + 0.5) * 0.055 - earPerkBoost * 0.10;
  earLGroup.rotation.x =  0.06 + Math.cos(t * 1.55) * 0.045;

  earRGroup.rotation.y =  0.18 - Math.sin(t * 1.25 + 0.8) * 0.16 - twitchR - earPerkBoost * 0.22;
  earRGroup.rotation.z = -0.28 - Math.sin(t * 1.12 + 1.1) * 0.055 + earPerkBoost * 0.10;
  earRGroup.rotation.x =  0.06 + Math.cos(t * 1.48 + 0.6) * 0.045;

  // 5) Cute Rhythmic Circular Chewing Motion & Natural Eye Blinking
  // Alpaca chewing cycle: ~4.4s of cute lateral figure-8 nibbling + ~1.6s attentive pause
  const chewCycle = t % 6.0;
  let chewEnvelope = 0;
  if (chewCycle < 4.4) {
    chewEnvelope = Math.sin(Math.min(1, chewCycle / 0.35) * Math.PI * 0.5) *
                   Math.sin(Math.min(1, (4.4 - chewCycle) / 0.40) * Math.PI * 0.5);
  }
  const chewPhase = t * 18.5; // ~2.95 Hz adorable nibble!
  jawGroup.position.x = Math.sin(chewPhase) * 0.0082 * chewEnvelope;
  jawGroup.position.y = -0.015 + (Math.cos(chewPhase) * 0.0042 - 0.0032) * chewEnvelope;
  jawGroup.rotation.z = -Math.sin(chewPhase) * 0.085 * chewEnvelope;
  jawGroup.rotation.x = (0.045 - Math.cos(chewPhase) * 0.045) * chewEnvelope;
  muzzleGroup.rotation.z = Math.sin(chewPhase) * 0.016 * chewEnvelope;

  // Natural blinking of upper eyelids + long curved eyelashes
  if (t >= nextBlinkTime && blinkTimer < 0) {
    blinkTimer = 0;
    nextBlinkTime = t + 3.0 + ((Math.sin(t * 12.9898) * 43758.5453) % 1 + 1) % 1 * 2.8;
  }
  let blinkAmt = 0;
  if (blinkTimer >= 0) {
    blinkTimer += dt;
    const blinkDur = 0.15;
    if (blinkTimer < blinkDur) {
      blinkAmt = Math.sin((blinkTimer / blinkDur) * Math.PI);
    } else {
      blinkTimer = -1;
    }
  }
  for (const lid of eyelidRigList) {
    lid.pivot.rotation.x = lid.restRotX + blinkAmt * 1.42;
  }

  // 6) Cheerful Fluffy Tail Flick
  tailJoyBoost = Math.max(0, tailJoyBoost - dt * 0.85);
  const periodicFlickEnv = Math.pow(Math.max(0, Math.sin(t * 1.15)), 8.0);
  const flickAmp = 0.08 + periodicFlickEnv * 0.26 + tailJoyBoost * 0.30;
  tailGroup.rotation.z = Math.sin(t * 13.5) * flickAmp + Math.sin(t * 2.1) * 0.06;
  tailGroup.rotation.x = Math.abs(Math.sin(t * 13.5)) * flickAmp * 0.45 + Math.sin(t * 1.8) * 0.05;

  // 7) Bandana Pom-Pom & Tassel Secondary Sway + Meadow Wildflower Breeze
  for (const tas of tasselRigList) {
    const windSwayZ = Math.sin(t * 2.8 + tas.phase) * 0.075;
    const windSwayX = Math.cos(t * 2.3 + tas.phase) * 0.045 - bobWave * 0.05;
    tas.velX += (-85.0 * tas.offX - 7.5 * tas.velX) * dt;
    tas.velZ += (-85.0 * tas.offZ - 7.5 * tas.velZ) * dt;
    tas.offX += tas.velX * dt;
    tas.offZ += tas.velZ * dt;

    tas.pivot.rotation.x = tas.restRotX + windSwayX + THREE.MathUtils.clamp(tas.offX, -0.55, 0.55);
    tas.pivot.rotation.z = windSwayZ + THREE.MathUtils.clamp(tas.offZ, -0.55, 0.55);
  }

  for (const fl of flowerStems) {
    const fw = Math.sin(fl.x * 2.6 - fl.z * 2.2 - t * 2.6 + fl.phase * 0.3) * 0.085;
    fl.group.rotation.z = -fw;
    fl.group.rotation.x = fw * 0.6;
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</head>
<body>
<canvas id="c"></canvas>
</body>
