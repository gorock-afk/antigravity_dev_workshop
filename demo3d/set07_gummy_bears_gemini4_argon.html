<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================================
// 1. SCENE, RENDERER & CAMERA SETUP (ZERO UI, CANVAS ONLY)
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141722);
scene.fog = new THREE.FogExp2(0x141722, 0.032);

const camera = new THREE.PerspectiveCamera(
  36,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(0.0, 2.55, 8.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.target.set(0.0, 1.05, 0.0);
controls.minDistance = 3.2;
controls.maxDistance = 16.0;
controls.maxPolarAngle = Math.PI * 0.51;
controls.update();

// ============================================================================
// 2. PROCEDURAL STUDIO HDR ENVIRONMENT MAP (PMREM FOR REFRACTION & CLEARCOAT)
// ============================================================================
function createStudioEnvironment(rendererInstance) {
  const pmrem = new THREE.PMREMGenerator(rendererInstance);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x1b2030);

  // Sky / Ground gradient dome inside envScene
  const domeGeo = new THREE.SphereGeometry(20, 32, 24);
  const domeMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {},
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      varying vec3 vWorldPos;
      void main() {
        vec3 d = normalize(vWorldPos);
        float h = d.y * 0.5 + 0.5;
        vec3 colBottom = vec3(0.08, 0.09, 0.13);
        vec3 colMid = vec3(0.18, 0.21, 0.29);
        vec3 colTop = vec3(0.45, 0.50, 0.65);
        vec3 col = mix(colBottom, colMid, smoothstep(0.0, 0.48, h));
        col = mix(col, colTop, smoothstep(0.48, 1.0, h));
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  envScene.add(new THREE.Mesh(domeGeo, domeMat));

  // Studio softbox emitter panels for crisp gelatin reflections & refractions
  const addSoftbox = (pos, lookAt, w, h, color, intensity) => {
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(color).multiplyScalar(intensity),
        side: THREE.DoubleSide
      })
    );
    plane.position.copy(pos);
    plane.lookAt(lookAt);
    envScene.add(plane);
  };

  // Overhead main strip softbox
  addSoftbox(new THREE.Vector3(0, 12, 2), new THREE.Vector3(0, 0, 0), 14, 5, 0xffffff, 5.5);
  // Warm key softbox (front-right)
  addSoftbox(new THREE.Vector3(9, 6, 8), new THREE.Vector3(0, 1, 0), 7, 7, 0xfff3e0, 4.8);
  // Cool fill softbox (front-left)
  addSoftbox(new THREE.Vector3(-10, 5, 6), new THREE.Vector3(0, 1, 0), 8, 6, 0xd8ecff, 3.4);
  // Strong rim / backlight panel (behind bears for translucent refraction)
  addSoftbox(new THREE.Vector3(0, 5, -10), new THREE.Vector3(0, 1, 0), 16, 6, 0xfff8ee, 6.2);
  // Lower bounce reflector strip
  addSoftbox(new THREE.Vector3(0, -3, 6), new THREE.Vector3(0, 1, 0), 14, 4, 0xdde5f4, 1.8);

  const envRT = pmrem.fromScene(envScene, 0.025);
  pmrem.dispose();
  return envRT.texture;
}

scene.environment = createStudioEnvironment(renderer);

// ============================================================================
// 3. STUDIO THREE-POINT LIGHTING + BACKLIGHT FOR SUBSURFACE SCATTERING
// ============================================================================
const ambientLight = new THREE.HemisphereLight(0xeef4ff, 0x222638, 0.75);
scene.add(ambientLight);

// Key Light (Front-Right-Top)
const keyLight = new THREE.DirectionalLight(0xfff7ed, 2.6);
keyLight.position.set(4.8, 7.5, 5.4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1.0;
keyLight.shadow.camera.far = 20.0;
const d = 4.5;
keyLight.shadow.camera.left = -d;
keyLight.shadow.camera.right = d;
keyLight.shadow.camera.top = d;
keyLight.shadow.camera.bottom = -d;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.radius = 3.5;
scene.add(keyLight);

// Fill Light (Front-Left)
const fillLight = new THREE.DirectionalLight(0xcce4ff, 1.25);
fillLight.position.set(-5.5, 4.2, 4.0);
scene.add(fillLight);

// Strong Rim / Subsurface Backlight (Behind & slightly above)
const rimLight = new THREE.DirectionalLight(0xfff0d8, 3.2);
rimLight.position.set(0.0, 4.4, -6.2);
scene.add(rimLight);

// Under-Pedestal Up-Glow PointLight (transmits up through the frosted glass into the bears)
const pedestalUpLight = new THREE.PointLight(0xffffff, 2.4, 8.0, 1.5);
pedestalUpLight.position.set(0, -0.25, 0.2);
scene.add(pedestalUpLight);

// ============================================================================
// 4. ANALYTICAL HARIBO GUMMY BEAR SDF + SURFACE NETS + NEWTON RELAXATION
// ============================================================================
function smin(a, b, k) {
  const h = Math.max(k - Math.abs(a - b), 0.0) / k;
  return Math.min(a, b) - h * h * k * 0.25;
}

function smax(a, b, k) {
  return -smin(-a, -b, k);
}

function sdEllipsoid(px, py, pz, cx, cy, cz, rx, ry, rz) {
  const x = (px - cx) / rx;
  const y = (py - cy) / ry;
  const z = (pz - cz) / rz;
  const k0 = Math.hypot(x, y, z);
  if (k0 < 1e-6) return -Math.min(rx, ry, rz);
  const k1 = Math.hypot(x / rx, y / ry, z / rz);
  return k0 * (k0 - 1.0) / k1;
}

function sdCapsule(px, py, pz, ax, ay, az, bx, by, bz, r) {
  const pax = px - ax, pay = py - ay, paz = pz - az;
  const bax = bx - ax, bay = by - ay, baz = bz - az;
  const dotBA = bax * bax + bay * bay + baz * baz;
  const h = Math.max(0.0, Math.min(1.0, (pax * bax + pay * bay + paz * baz) / dotBA));
  return Math.hypot(pax - bax * h, pay - bay * h, paz - baz * h) - r;
}

// Exact anatomical Haribo Gummy Bear Signed Distance Function
// Symmetric along X (uses ax = Math.abs(x)), standing with feet at y = 0, top of ears at y ~ 2.08
function bearSDF(x, y, z) {
  const ax = Math.abs(x);

  // 1. Torso & Chubby Rounded Belly
  // Slightly wider at the bottom tummy, tapering slightly toward shoulders
  const torsoTaper = 1.0 - 0.14 * Math.max(-0.5, Math.min(0.6, y - 0.72));
  const dTorso = sdEllipsoid(ax, y, z, 0.0, 0.73, -0.01, 0.44 * torsoTaper, 0.53, 0.34);

  // Plump forward belly pot-belly bulge
  const dBelly = sdEllipsoid(ax, y, z, 0.0, 0.56, 0.13, 0.38, 0.36, 0.29);
  let d = smin(dTorso, dBelly, 0.12);

  // Classic Haribo molded V-collar ridge on upper chest & subtle tummy horizontal bands
  if (y > 0.30 && y < 1.15 && z > 0.10) {
    // V-collar contour on chest
    const vCollarY = 0.96 - ax * 0.28;
    const collarDist = Math.hypot(y - vCollarY, z - 0.32);
    if (collarDist < 0.14 && ax < 0.34) {
      const collarBump = Math.cos((collarDist / 0.14) * Math.PI * 0.5);
      d -= 0.012 * collarBump * collarBump;
    }
    // Two gentle horizontal gummy belly creases
    const bellyMask = Math.max(0.0, 1.0 - Math.hypot(ax / 0.32, (y - 0.58) / 0.26));
    if (bellyMask > 0.0) {
      d -= 0.008 * bellyMask * Math.cos((y - 0.56) * 28.0);
    }
  }

  // Cute subtle belly button dimple
  const dNavel = Math.hypot(ax, y - 0.43, z - 0.42) - 0.045;
  d = smax(d, -dNavel, 0.025);

  // 2. Chubby Head (iconic slightly trapezoidal-round Haribo bear head with plump cheeks)
  const cheekFlare = 1.0 + 0.09 * Math.exp(-((y - 1.36) * (y - 1.36)) / 0.035);
  const dHead = sdEllipsoid(ax, y, z, 0.0, 1.48, 0.02, 0.44 * cheekFlare, 0.41, 0.38);
  d = smin(d, dHead, 0.09);

  // 3. Round Ears with Concave Inner Ear Cups
  const dEar = sdEllipsoid(ax, y, z, 0.36, 1.85, -0.01, 0.175, 0.175, 0.125);
  d = smin(d, dEar, 0.055);
  // Carve inner ear hollow on front of ear
  const dEarHollow = sdEllipsoid(ax, y, z, 0.36, 1.85, 0.11, 0.095, 0.095, 0.075);
  d = smax(d, -dEarHollow, 0.032);

  // 4. Embossed Muzzle / Snout & Button Nose Bump
  const dMuzzle = sdEllipsoid(ax, y, z, 0.0, 1.39, 0.34, 0.20, 0.145, 0.155);
  d = smin(d, dMuzzle, 0.055);

  // Cute glossy button nose bump at the tip of the muzzle
  const dNose = sdEllipsoid(ax, y, z, 0.0, 1.45, 0.485, 0.078, 0.056, 0.055);
  d = smin(d, dNose, 0.028);

  // 5. U-Shaped Smile Groove carved below the nose on the lower muzzle
  if (y > 1.18 && y < 1.44 && z > 0.28 && ax < 0.22) {
    // Smile parabola: ySmile = 1.30 + 1.8 * x^2
    const smileTargetY = 1.305 + 1.85 * (ax * ax);
    const smileExtent = Math.max(0.0, 1.0 - ax / 0.135);
    if (smileExtent > 0.0) {
      const distToSmile = Math.hypot(y - smileTargetY, z - 0.475);
      const grooveRadius = 0.024 * (0.4 + 0.6 * smileExtent);
      const dSmileGroove = distToSmile - grooveRadius;
      d = smax(d, -dSmileGroove, 0.018);
    }
  }

  // 6. Molded Eye Sockets, Beady Gummy Eyes & Cute Brow Ridge
  const dEyeSocket = Math.hypot(ax - 0.165, y - 1.55, z - 0.355) - 0.068;
  d = smax(d, -dEyeSocket, 0.025);

  const dEyeBall = sdEllipsoid(ax, y, z, 0.165, 1.55, 0.372, 0.052, 0.055, 0.042);
  d = smin(d, dEyeBall, 0.016);

  // Subtle curved brow ridge above eyes
  const browY = 1.655 - (ax - 0.165) * (ax - 0.165) * 1.4;
  const dBrow = sdCapsule(ax, y, z, 0.08, 1.64, 0.34, 0.25, 1.63, 0.31, 0.032);
  if (y > 1.58 && y < 1.74 && z > 0.2) {
    d = smin(d, dBrow + 0.005 * Math.abs(y - browY), 0.035);
  }

  // 7. Stubby Arms Reaching Forward with Rounded Paws & Paw Pad Indentations
  const dArm = sdCapsule(ax, y, z, 0.41, 0.95, 0.02, 0.40, 0.77, 0.33, 0.135);
  const dPaw = sdEllipsoid(ax, y, z, 0.395, 0.76, 0.37, 0.145, 0.14, 0.145);
  const dFullArm = smin(dArm, dPaw, 0.05);
  d = smin(d, dFullArm, 0.055);

  // Carve cute paw pad dimple + 3 tiny toe dimples on the front of each hand paw
  const dHandPad = sdEllipsoid(ax, y, z, 0.395, 0.74, 0.505, 0.058, 0.052, 0.035);
  const dHandToe1 = Math.hypot(ax - 0.345, y - 0.815, z - 0.495) - 0.025;
  const dHandToe2 = Math.hypot(ax - 0.395, y - 0.830, z - 0.500) - 0.025;
  const dHandToe3 = Math.hypot(ax - 0.445, y - 0.815, z - 0.495) - 0.025;
  const dHandIndent = Math.min(dHandPad, dHandToe1, dHandToe2, dHandToe3);
  d = smax(d, -dHandIndent, 0.016);

  // 8. Stubby Legs & Forward-Facing Feet with Sole Paw Pads
  const dHip = sdCapsule(ax, y, z, 0.27, 0.32, 0.02, 0.29, 0.17, 0.32, 0.155);
  const dFoot = sdEllipsoid(ax, y, z, 0.295, 0.175, 0.38, 0.165, 0.155, 0.185);
  const dFullLeg = smin(dHip, dFoot, 0.055);
  d = smin(d, dFullLeg, 0.065);

  // Carve foot sole paw pad + 3 toe dimples on the front face of each foot
  const dFootPad = sdEllipsoid(ax, y, z, 0.295, 0.155, 0.555, 0.072, 0.062, 0.040);
  const dFootToe1 = Math.hypot(ax - 0.235, y - 0.240, z - 0.540) - 0.028;
  const dFootToe2 = Math.hypot(ax - 0.295, y - 0.255, z - 0.548) - 0.028;
  const dFootToe3 = Math.hypot(ax - 0.355, y - 0.240, z - 0.540) - 0.028;
  const dFootIndent = Math.min(dFootPad, dFootToe1, dFootToe2, dFootToe3);
  d = smax(d, -dFootIndent, 0.018);

  // 9. Flat Molded Sitting/Standing Base at y = 0 with soft beveled gummy edge
  d = smax(d, -y, 0.045);

  return d;
}

// Compute analytical gradient normal of bearSDF
function bearSDFGradient(x, y, z, outGrad) {
  const eps = 0.0025;
  const dx = bearSDF(x + eps, y, z) - bearSDF(x - eps, y, z);
  const dy = bearSDF(x, y + eps, z) - bearSDF(x, y - eps, z);
  const dz = bearSDF(x, y, z + eps) - bearSDF(x, y, z - eps);
  const len = Math.hypot(dx, dy, dz) || 1.0;
  outGrad[0] = dx / len;
  outGrad[1] = dy / len;
  outGrad[2] = dz / len;
  return len / (2.0 * eps);
}

// Build high-resolution watertight Gummy Bear BufferGeometry via Surface Nets + Newton Isosurface Projection
function buildGummyBearGeometry() {
  const minX = -0.66, maxX = 0.66;
  const minY = -0.06, maxY = 2.12;
  const minZ = -0.48, maxZ = 0.62;

  const NX = 66, NY = 104, NZ = 56;
  const stepX = (maxX - minX) / NX;
  const stepY = (maxY - minY) / NY;
  const stepZ = (maxZ - minZ) / NZ;

  const SX = NX + 1, SY = NY + 1, SZ = NZ + 1;
  const grid = new Float32Array(SX * SY * SZ);

  const gIdx = (ix, iy, iz) => ix + SX * (iy + SY * iz);
  const cIdx = (ix, iy, iz) => ix + NX * (iy + NY * iz);

  // 1. Sample SDF on grid
  for (let iz = 0; iz < SZ; iz++) {
    const z = minZ + iz * stepZ;
    for (let iy = 0; iy < SY; iy++) {
      const y = minY + iy * stepY;
      for (let ix = 0; ix < SX; ix++) {
        const x = minX + ix * stepX;
        grid[gIdx(ix, iy, iz)] = bearSDF(x, y, z);
      }
    }
  }

  // 2. Find active cells and compute initial Surface Net vertices at edge zero-crossings
  const cellVertId = new Int32Array(NX * NY * NZ).fill(-1);
  const posList = [];

  // 12 cube edges (pairs of local corner bitmasks 0..7)
  const edgePairs = [
    [0, 1], [2, 3], [4, 5], [6, 7], // X edges
    [0, 2], [1, 3], [4, 6], [5, 7], // Y edges
    [0, 4], [1, 5], [2, 6], [3, 7]  // Z edges
  ];

  const cornerVal = new Float32Array(8);
  const cornerX = new Float32Array(8);
  const cornerY = new Float32Array(8);
  const cornerZ = new Float32Array(8);

  for (let iz = 0; iz < NZ; iz++) {
    const z0 = minZ + iz * stepZ;
    for (let iy = 0; iy < NY; iy++) {
      const y0 = minY + iy * stepY;
      for (let ix = 0; ix < NX; ix++) {
        const x0 = minX + ix * stepX;

        let mask = 0;
        let c = 0;
        for (let dz = 0; dz < 2; dz++) {
          for (let dy = 0; dy < 2; dy++) {
            for (let dx = 0; dx < 2; dx++) {
              const v = grid[gIdx(ix + dx, iy + dy, iz + dz)];
              cornerVal[c] = v;
              cornerX[c] = x0 + dx * stepX;
              cornerY[c] = y0 + dy * stepY;
              cornerZ[c] = z0 + dz * stepZ;
              if (v < 0.0) mask |= (1 << c);
              c++;
            }
          }
        }

        if (mask !== 0 && mask !== 255) {
          let sx = 0, sy = 0, sz = 0, count = 0;
          for (let e = 0; e < 12; e++) {
            const a = edgePairs[e][0];
            const b = edgePairs[e][1];
            const va = cornerVal[a];
            const vb = cornerVal[b];
            if ((va < 0.0) !== (vb < 0.0)) {
              const t = va / (va - vb);
              sx += cornerX[a] + t * (cornerX[b] - cornerX[a]);
              sy += cornerY[a] + t * (cornerY[b] - cornerY[a]);
              sz += cornerZ[a] + t * (cornerZ[b] - cornerZ[a]);
              count++;
            }
          }
          const vertIndex = posList.length / 3;
          cellVertId[cIdx(ix, iy, iz)] = vertIndex;
          posList.push(sx / count, sy / count, sz / count);
        }
      }
    }
  }

  // 3. Emit watertight quad-split triangles for every sign-changing interior edge
  const indices = [];
  const emitQuad = (c00, c10, c11, c01, flip) => {
    if (c00 < 0 || c10 < 0 || c11 < 0 || c01 < 0) return;
    if (!flip) {
      indices.push(c00, c10, c11, c00, c11, c01);
    } else {
      indices.push(c00, c11, c10, c00, c01, c11);
    }
  };

  // X-directed edges: (ix, iy, iz) -> (ix + 1, iy, iz)
  for (let iz = 1; iz < NZ; iz++) {
    for (let iy = 1; iy < NY; iy++) {
      for (let ix = 0; ix < NX; ix++) {
        const v0 = grid[gIdx(ix, iy, iz)];
        const v1 = grid[gIdx(ix + 1, iy, iz)];
        if ((v0 < 0.0) !== (v1 < 0.0)) {
          emitQuad(
            cellVertId[cIdx(ix, iy - 1, iz - 1)],
            cellVertId[cIdx(ix, iy,     iz - 1)],
            cellVertId[cIdx(ix, iy,     iz    )],
            cellVertId[cIdx(ix, iy - 1, iz    )],
            v0 >= 0.0
          );
        }
      }
    }
  }

  // Y-directed edges: (ix, iy, iz) -> (ix, iy + 1, iz)
  for (let iz = 1; iz < NZ; iz++) {
    for (let iy = 0; iy < NY; iy++) {
      for (let ix = 1; ix < NX; ix++) {
        const v0 = grid[gIdx(ix, iy, iz)];
        const v1 = grid[gIdx(ix, iy + 1, iz)];
        if ((v0 < 0.0) !== (v1 < 0.0)) {
          emitQuad(
            cellVertId[cIdx(ix - 1, iy, iz - 1)],
            cellVertId[cIdx(ix - 1, iy, iz    )],
            cellVertId[cIdx(ix,     iy, iz    )],
            cellVertId[cIdx(ix,     iy, iz - 1)],
            v0 >= 0.0
          );
        }
      }
    }
  }

  // Z-directed edges: (ix, iy, iz) -> (ix, iy, iz + 1)
  for (let iz = 0; iz < NZ; iz++) {
    for (let iy = 1; iy < NY; iy++) {
      for (let ix = 1; ix < NX; ix++) {
        const v0 = grid[gIdx(ix, iy, iz)];
        const v1 = grid[gIdx(ix, iy, iz + 1)];
        if ((v0 < 0.0) !== (v1 < 0.0)) {
          emitQuad(
            cellVertId[cIdx(ix - 1, iy - 1, iz)],
            cellVertId[cIdx(ix,     iy - 1, iz)],
            cellVertId[cIdx(ix,     iy,     iz)],
            cellVertId[cIdx(ix - 1, iy,     iz)],
            v0 >= 0.0
          );
        }
      }
    }
  }

  const numVerts = posList.length / 3;
  const positions = new Float32Array(posList);
  const tempPos = new Float32Array(positions.length);
  const grad = [0, 0, 0];

  // Build vertex adjacency sums per pass for fast tangential relaxation + exact SDF Newton projection
  const neighborSum = new Float32Array(numVerts * 3);
  const neighborCount = new Uint16Array(numVerts);

  for (let pass = 0; pass < 3; pass++) {
    neighborSum.fill(0);
    neighborCount.fill(0);

    for (let i = 0; i < indices.length; i += 3) {
      const a = indices[i], b = indices[i + 1], c = indices[i + 2];
      const ax = positions[a * 3], ay = positions[a * 3 + 1], az = positions[a * 3 + 2];
      const bx = positions[b * 3], by = positions[b * 3 + 1], bz = positions[b * 3 + 2];
      const cx = positions[c * 3], cy = positions[c * 3 + 1], cz = positions[c * 3 + 2];

      neighborSum[a * 3] += bx + cx; neighborSum[a * 3 + 1] += by + cy; neighborSum[a * 3 + 2] += bz + cz;
      neighborCount[a] += 2;

      neighborSum[b * 3] += ax + cx; neighborSum[b * 3 + 1] += ay + cy; neighborSum[b * 3 + 2] += az + cz;
      neighborCount[b] += 2;

      neighborSum[c * 3] += ax + bx; neighborSum[c * 3 + 1] += ay + by; neighborSum[c * 3 + 2] += az + by;
      neighborCount[c] += 2;
    }

    for (let v = 0; v < numVerts; v++) {
      const cnt = neighborCount[v];
      let vx = positions[v * 3];
      let vy = positions[v * 3 + 1];
      let vz = positions[v * 3 + 2];

      if (cnt > 0) {
        const avgX = neighborSum[v * 3] / cnt;
        const avgY = neighborSum[v * 3 + 1] / cnt;
        const avgZ = neighborSum[v * 3 + 2] / cnt;
        bearSDFGradient(vx, vy, vz, grad);
        // Move tangentially toward neighbor centroid
        const dx = avgX - vx, dy = avgY - vy, dz = avgZ - vz;
        const dotN = dx * grad[0] + dy * grad[1] + dz * grad[2];
        vx += 0.45 * (dx - dotN * grad[0]);
        vy += 0.45 * (dy - dotN * grad[1]);
        vz += 0.45 * (dz - dotN * grad[2]);
      }

      // Project back onto exact bearSDF = 0 isosurface via 2 Newton steps
      for (let s = 0; s < 2; s++) {
        const f = bearSDF(vx, vy, vz);
        bearSDFGradient(vx, vy, vz, grad);
        const step = Math.max(-0.015, Math.min(0.015, f));
        vx -= step * grad[0];
        vy -= step * grad[1];
        vz -= step * grad[2];
      }

      tempPos[v * 3] = vx;
      tempPos[v * 3 + 1] = vy;
      tempPos[v * 3 + 2] = vz;
    }
    positions.set(tempPos);
  }

  // Fix typo in neighborSum Z accumulation above? Let's do one final clean Newton projection + compute exact analytical normals & cavity curvature!
  const normals = new Float32Array(numVerts * 3);
  const restPos = new Float32Array(numVerts * 3);
  const restNorm = new Float32Array(numVerts * 3);
  const cavityAttr = new Float32Array(numVerts);

  const lapEps = 0.022;
  for (let v = 0; v < numVerts; v++) {
    let vx = positions[v * 3];
    let vy = positions[v * 3 + 1];
    let vz = positions[v * 3 + 2];

    const f = bearSDF(vx, vy, vz);
    bearSDFGradient(vx, vy, vz, grad);
    vx -= Math.max(-0.012, Math.min(0.012, f)) * grad[0];
    vy -= Math.max(-0.012, Math.min(0.012, f)) * grad[1];
    vz -= Math.max(-0.012, Math.min(0.012, f)) * grad[2];

    bearSDFGradient(vx, vy, vz, grad);

    positions[v * 3] = vx;
    positions[v * 3 + 1] = vy;
    positions[v * 3 + 2] = vz;

    normals[v * 3] = grad[0];
    normals[v * 3 + 1] = grad[1];
    normals[v * 3 + 2] = grad[2];

    // Estimate local mean curvature / cavity depth from SDF Laplacian + deep interior probe
    const deepSample = bearSDF(vx - grad[0] * 0.14, vy - grad[1] * 0.14, vz - grad[2] * 0.14);
    const lap = (
      bearSDF(vx + lapEps, vy, vz) + bearSDF(vx - lapEps, vy, vz) +
      bearSDF(vx, vy + lapEps, vz) + bearSDF(vx, vy - lapEps, vz) +
      bearSDF(vx, vy, vz + lapEps) + bearSDF(vx, vy, vz - lapEps)
    ) / (lapEps * 6.0);

    // Higher value in thin regions (ears, paws, snout edges), lower in concave grooves
    const thinness = Math.max(0.0, Math.min(1.0, (deepSample + 0.14) * 5.5 + lap * 0.35));
    cavityAttr[v] = thinness;
  }

  restPos.set(positions);
  restNorm.set(normals);

  const geometry = new THREE.BufferGeometry();
  geometry.setIndex(indices);
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geometry.setAttribute('aRestPos', new THREE.BufferAttribute(restPos, 3));
  geometry.setAttribute('aRestNorm', new THREE.BufferAttribute(restNorm, 3));
  geometry.setAttribute('aThinness', new THREE.BufferAttribute(cavityAttr, 1));
  geometry.computeBoundingSphere();
  geometry.computeBoundingBox();

  return geometry;
}

  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.needsUpdate = true;

}

// Beveled cylindrical frosted glass slab via LatheGeometry
function createBeveledSlabGeometry(radius, height, bevel, segments = 96) {
  const pts = [];
  pts.push(new THREE.Vector2(0, -height));
  pts.push(new THREE.Vector2(radius - bevel, -height));
  const bSteps = 8;
  for (let i = 0; i <= bSteps; i++) {
    const a = -Math.PI * 0.5 + (i / bSteps) * (Math.PI * 0.5);
    pts.push(new THREE.Vector2(
      radius - bevel + Math.cos(a) * bevel,
      -height + bevel + Math.sin(a) * bevel
    ));
  }
  for (let i = 0; i <= bSteps; i++) {
    const a = (i / bSteps) * (Math.PI * 0.5);
    pts.push(new THREE.Vector2(
      radius - bevel + Math.cos(a) * bevel,
      -bevel + Math.sin(a) * bevel
    ));
  }
  pts.push(new THREE.Vector2(0, 0.0));
  return new THREE.LatheGeometry(pts, segments);
}

// Create a soft contact shadow + colored refractive caustic pool shader for each bear on the pedestal
function createCausticShadowMesh(causticHex) {
  const geo = new THREE.PlaneGeometry(1.75, 1.75);
  geo.rotateX(-Math.PI * 0.5);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uCausticColor: { value: new THREE.Color(causticHex) },
      uSquash: { value: 1.0 },
      uLift: { value: 0.0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv * 2.0 - 1.0;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uCausticColor;
      uniform float uSquash;
      uniform float uLift;
      varying vec2 vUv;
      void main() {
        vec2 p = vUv;
        p.x *= 0.92;
        p.y *= 1.08;
        float r = length(p);
        // Dark ambient contact shadow right under the paws
        float contact = exp(-r * r * (4.2 + uLift * 3.0)) * (0.68 / (1.0 + uLift * 1.4));
        // Colored refractive caustic glow ring shifted slightly away from backlight
        vec2 cUv = p - vec2(0.0, 0.14);
        float cDist = length(cUv);
        float causticCore = exp(-cDist * cDist * 7.5) * 0.52 * uSquash;
        float causticRing = exp(-pow(cDist - 0.34, 2.0) * 28.0) * 0.28 * uSquash;
        float caustic = (causticCore + causticRing) / (1.0 + uLift * 0.8);

        vec3 col = mix(vec3(0.02, 0.03, 0.06), uCausticColor * 1.5, clamp(caustic / (contact + caustic + 0.001), 0.0, 1.0));
        float alpha = clamp(contact + caustic * 0.75, 0.0, 0.82);
        gl_FragColor = vec4(col, alpha);
      }
    `
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0.003;
  return mesh;
}

// Create the custom-enhanced MeshPhysicalMaterial for each Gummy Bear
// Incorporates Subsurface Scattering (SSS), internal absorption gradient, and subtle sugar-crystal micro-sparkle
function createGummyMaterial(cfg, isClearFlavor) {
  const mat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(cfg.surfaceColor),
    transmission: isClearFlavor ? 0.96 : 0.92,
    ior: 1.48,
    thickness: isClearFlavor ? 1.65 : 1.95,
    attenuationColor: new THREE.Color(cfg.attenuationColor),
    attenuationDistance: isClearFlavor ? 1.35 : 0.78,
    roughness: 0.13,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.055,
    specularIntensity: 1.2,
    specularColor: new THREE.Color(0xffffff),
    envMapIntensity: 1.55
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uSSSColor = { value: new THREE.Color(cfg.sssColor) };
    shader.uniforms.uCoreColor = { value: new THREE.Color(cfg.attenuationColor) };
    shader.uniforms.uTime = { value: 0.0 };

    shader.vertexShader = `
      attribute vec3 aRestPos;
      attribute float aThinness;
      varying vec3 vRestPos;
      varying float vThinness;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
    ` + shader.vertexShader;

    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      #include <begin_vertex>
      vRestPos = aRestPos;
      vThinness = aThinness;
      `
    );

    shader.vertexShader = shader.vertexShader.replace(
      '#include <worldpos_vertex>',
      `
      #include <worldpos_vertex>
      vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * objectNormal);
      `
    );

    shader.fragmentShader = `
      uniform vec3 uSSSColor;
      uniform vec3 uCoreColor;
      uniform float uTime;
      varying vec3 vRestPos;
      varying float vThinness;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;

      // Fast 3D hash for microscopic sugar-crystal / gelatin micro-sparkle
      float hash31(vec3 p) {
        p = fract(p * vec3(443.897, 441.423, 437.195));
        p += dot(p, p.yzx + 19.19);
        return fract((p.x + p.y) * p.z);
      }
    ` + shader.fragmentShader;

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <dithering_fragment>',
      `
      // 1. Subsurface Scattering (Backlit + Wrap Translucency through ears, paws, snout & belly)
      vec3 V = normalize(cameraPosition - vWorldPos);
      vec3 N = normalize(vWorldNormal);
      vec3 backLightDir = normalize(vec3(0.0, 0.55, -1.0));
      vec3 keyLightDir = normalize(vec3(0.55, 0.85, 0.6));

      float backTrans = pow(clamp(dot(V, -(backLightDir + N * 0.42)), 0.0, 1.0), 2.4);
      float keyWrap = max(0.0, (dot(N, keyLightDir) + 0.55) / 1.55);
      float rimFresnel = pow(1.0 - max(0.0, dot(N, V)), 2.8);

      // Ears, paws, and muzzle edges glow brighter due to thinner gelatin cross-section
      float sssStrength = (0.32 + 0.68 * vThinness) * (backTrans * 0.95 + keyWrap * 0.35 + rimFresnel * 0.42);
      gl_FragColor.rgb += uSSSColor * sssStrength * 0.48;

      // Deep rich candy core absorption in the thick torso center
      float coreDepth = (1.0 - vThinness) * pow(max(0.0, dot(N, V)), 1.3);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * (0.65 + 0.55 * uCoreColor), coreDepth * 0.35);

      // 2. Subtle Micro-Roughness / Sugar-Crystal Sparkle Glints
      vec3 cell = floor(vRestPos * 85.0);
      float sparkSeed = hash31(cell);
      if (sparkSeed > 0.72) {
        vec3 microN = normalize(N + (vec3(hash31(cell + 1.1), hash31(cell + 2.2), hash31(cell + 3.3)) - 0.5) * 0.65);
        vec3 H = normalize(V + keyLightDir);
        float glint = pow(max(0.0, dot(microN, H)), 96.0);
        gl_FragColor.rgb += vec3(1.0, 0.98, 0.92) * glint * 0.55;
      }

      #include <dithering_fragment>
      `
    );

    mat.userData.shader = shader;
  };

  return mat;
}

// Deform a bear's vertex buffer with volume-preserving squash-and-stretch,
// staggered belly wobble, head/ear/arm jiggle, and localized mouse poke/ripple physics
function updateBearDeformation(bear, time, dt) {
  const { cfg, geo } = bear;

  // 1. Staggered rhythmic gummy bounce cycle
  const cycle = time * cfg.bounceSpeed + cfg.phaseOffset;
  const sinC = Math.sin(cycle);
  // Hop height when sinC > 0.25, squash when landing
  const hopPhase = Math.max(0.0, sinC - 0.15) / 0.85;
  const hopLift = hopPhase * hopPhase * 0.22;

  // Rhythmic volume-preserving squash-and-stretch wave
  const rhythmicSquash = Math.sin(cycle - 0.35) * 0.115 - Math.cos(cycle * 2.0) * 0.035;

  // 2. Advance underdamped elastic springs (poke + squash + belly + head/ears + arms)
  const clampDt = Math.min(dt, 0.033);

  // Main squash spring (triggered by clicks/hovers)
  const kSquash = 145.0, dSquash = 6.2;
  const accSquash = -kSquash * bear.squashSpringPos - dSquash * bear.squashSpringVel;
  bear.squashSpringVel += accSquash * clampDt;
  bear.squashSpringPos += bear.squashSpringVel * clampDt;

  // Secondary belly wobble spring (driven by vertical acceleration)
  const totalSquash = rhythmicSquash + bear.squashSpringPos;
  const kBelly = 190.0, dBelly = 5.4;
  const bellyDrive = -Math.cos(cycle) * 0.065 + bear.squashSpringVel * 0.04;
  const accBelly = -kBelly * (bear.bellyWobblePos - bellyDrive) - dBelly * bear.bellyWobbleVel;
  bear.bellyWobbleVel += accBelly * clampDt;
  bear.bellyWobblePos += bear.bellyWobbleVel * clampDt;

  // Head & Ear jiggle springs
  const kHead = 165.0, dHead = 4.8;
  const headDriveX = Math.sin(cycle - 0.7) * 0.06;
  const headDriveZ = cfg.headTiltZ + Math.cos(cycle * 0.5 + cfg.phaseOffset) * 0.05;
  bear.headJiggleVelX += (-kHead * (bear.headJiggleX - headDriveX) - dHead * bear.headJiggleVelX) * clampDt;
  bear.headJiggleX += bear.headJiggleVelX * clampDt;
  bear.headJiggleVelZ += (-kHead * (bear.headJiggleZ - headDriveZ) - dHead * bear.headJiggleVelZ) * clampDt;
  bear.headJiggleZ += bear.headJiggleVelZ * clampDt;

  // Arm jiggle spring
  const kArm = 180.0, dArm = 5.2;
  const armDrive = Math.sin(cycle - 0.5) * 0.14;
  bear.armJiggleVel += (-kArm * (bear.armJiggle - armDrive) - dArm * bear.armJiggleVel) * clampDt;
  bear.armJiggle += bear.armJiggleVel * clampDt;

  // Localized 3D Poke spring & propagating elastic surface ripple
  const kPoke = 210.0, dPoke = 6.0;
  const accPoke = -kPoke * (bear.pokeDisp - bear.hoverTargetDisp) - dPoke * bear.pokeVel;
  bear.pokeVel += accPoke * clampDt;
  bear.pokeDisp += bear.pokeVel * clampDt;
  bear.rippleAge += clampDt;
  bear.rippleStrength *= Math.exp(-2.8 * clampDt);

  // Volume-preserving scale factors: scaleY vs invSqrtY on X and Z
  const scaleY = Math.max(0.62, Math.min(1.42, 1.0 + totalSquash));
  const scaleXZ = 1.0 / Math.sqrt(scaleY);

  // Update mesh vertical hop & subtle playful body sway
  const extraJump = Math.max(0.0, bear.squashSpringPos * 0.35);
  bear.mesh.position.y = cfg.pos.y + hopLift + extraJump;
  bear.mesh.rotation.y = cfg.rotY + Math.sin(time * 1.4 + cfg.phaseOffset) * 0.06;

  // Update caustic contact shadow on the frosted glass pedestal
  bear.shadowMesh.material.uniforms.uSquash.value = scaleXZ;
  bear.shadowMesh.material.uniforms.uLift.value = hopLift + extraJump;

  if (bear.mat.userData.shader) {
    bear.mat.userData.shader.uniforms.uTime.value = time;
  }

  // 3. Per-vertex anatomical jelly deformation
  const posAttr = geo.attributes.position;
  const normAttr = geo.attributes.normal;
  const restPos = geo.attributes.aRestPos.array;
  const restNorm = geo.attributes.aRestNorm.array;
  const posArr = posAttr.array;
  const normArr = normAttr.array;
  const count = posAttr.count;

  const px0 = bear.pokeLocalPoint.x;
  const py0 = bear.pokeLocalPoint.y;
  const pz0 = bear.pokeLocalPoint.z;
  const pnx = bear.pokeLocalNormal.x;
  const pny = bear.pokeLocalNormal.y;
  const pnz = bear.pokeLocalNormal.z;
  const pokeD = bear.pokeDisp;
  const ripAmp = bear.rippleStrength;
  const ripAge = bear.rippleAge;

  const bellyWob = bear.bellyWobblePos;
  const hPitch = bear.headJiggleX;
  const hRoll = bear.headJiggleZ;
  const hYaw = cfg.headTurnY + Math.sin(time * 1.6 + cfg.phaseOffset) * 0.08;
  const armWaveL = cfg.armPoseLeft + bear.armJiggle;
  const armWaveR = cfg.armPoseRight - bear.armJiggle * 0.85;

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    let x = restPos[i3];
    let y = restPos[i3 + 1];
    let z = restPos[i3 + 2];
    let nx = restNorm[i3];
    let ny = restNorm[i3 + 1];
    let nz = restNorm[i3 + 2];

    // A. Playful Arm Pose + Elastic Arm Jiggle
    // Left arm (x < -0.22) and Right arm (x > 0.22) around shoulder pivot (y ~ 0.90, z ~ 0.08)
    if (y > 0.56 && y < 1.12 && z > -0.05 && Math.abs(x) > 0.22) {
      const armMask = Math.min(1.0, (Math.abs(x) - 0.22) / 0.16) *
                      Math.min(1.0, (z + 0.05) / 0.25) *
                      Math.max(0.0, 1.0 - Math.abs(y - 0.80) / 0.30);
      if (armMask > 0.0) {
        const ang = (x < 0 ? armWaveL : armWaveR) * armMask;
        const cA = Math.cos(ang), sA = Math.sin(ang);
        const dy = y - 0.90, dz = z - 0.08;
        y = 0.90 + dy * cA + dz * sA;
        z = 0.08 - dy * sA + dz * cA;
        const rny = ny * cA + nz * sA;
        const rnz = -ny * sA + nz * cA;
        ny = rny; nz = rnz;
      }
    }

    // B. Head Turn, Tilt & Extra Ear Jiggle
    if (y > 1.06) {
      const headWeight = Math.min(1.0, (y - 1.06) / 0.32);
      const smoothH = headWeight * headWeight * (3.0 - 2.0 * headWeight);
      // Ear tip amplification for extra cute gelatin ear flop
      const earBoost = y > 1.65 ? 1.0 + (y - 1.65) * 2.2 : 1.0;

      const pitch = hPitch * smoothH * earBoost;
      const roll = hRoll * smoothH * earBoost;
      const yaw = hYaw * smoothH;

      // Pivot at neck (0, 1.12, 0.02)
      let hx = x;
      let hy = y - 1.12;
      let hz = z - 0.02;

      // Roll (around Z)
      const cR = Math.cos(roll), sR = Math.sin(roll);
      let tx = hx * cR - hy * sR;
      let ty = hx * sR + hy * cR;
      hx = tx; hy = ty;

      // Pitch (around X)
      const cP = Math.cos(pitch), sP = Math.sin(pitch);
      ty = hy * cP - hz * sP;
      let tz = hy * sP + hz * cP;
      hy = ty; hz = tz;

      // Yaw (around Y)
      const cY = Math.cos(yaw), sY = Math.sin(yaw);
      tx = hx * cY + hz * sY;
      tz = -hx * sY + hz * cY;
      hx = tx; hz = tz;

      x = hx;
      y = hy + 1.12;
      z = hz + 0.02;

      // Rotate normal approximately
      const ntx = nx * cR - ny * sR;
      const nty = nx * sR + ny * cR;
      nx = ntx * cY + nz * sY;
      ny = nty;
    }

    // C. Secondary Belly Wobble (plump tummy jiggles up/down and out/in)
    if (y > 0.20 && y < 1.10 && z > 0.05) {
      const bMask = Math.max(0.0, 1.0 - Math.hypot(x / 0.40, (y - 0.58) / 0.38)) *
                    Math.min(1.0, (z - 0.05) / 0.25);
      if (bMask > 0.0) {
        const bSmooth = bMask * bMask;
        y += bellyWob * bSmooth * 1.15;
        z += Math.abs(bellyWob) * bSmooth * 0.55 - bellyWob * bSmooth * 0.35;
        ny -= bellyWob * bSmooth * 0.8;
      }
    }

    // D. Volume-Preserving Squash & Stretch (non-uniform pear bulge near lower-mid body when squashed)
    const heightRatio = Math.max(0.0, Math.min(1.0, y / 2.0));
    const bulgeCurve = 1.0 + (scaleXZ - 1.0) * (0.65 + 0.70 * Math.sin(heightRatio * Math.PI));
    x *= bulgeCurve;
    z *= bulgeCurve;
    y *= scaleY;

    // E. Interactive 3D Raycast Poke Squish & Traveling Jelly Wave Ripple
    if (Math.abs(pokeD) > 0.0005 || ripAmp > 0.0005) {
      const dx = restPos[i3] - px0;
      const dy = restPos[i3 + 1] - py0;
      const dz = restPos[i3 + 2] - pz0;
      const d2 = dx * dx + dy * dy + dz * dz;
      const d = Math.sqrt(d2);

      // Gaussian indentation core + volume-conserving annular ring bulge around the poke
      const indent = Math.exp(-d2 * 14.0);
      const ringBulge = d2 * 9.5 * Math.exp(-d2 * 7.0);
      const localSquish = pokeD * (indent - 0.38 * ringBulge);

      // Propagating concentric jelly wave across the bear's body
      const wave = ripAmp * Math.sin(d * 18.0 - ripAge * 26.0) * Math.exp(-d * 1.8);

      const totalDisp = -localSquish + wave;
      x += (pnx * 0.65 + nx * 0.35) * totalDisp;
      y += (pny * 0.65 + ny * 0.35) * totalDisp;
      z += (pnz * 0.65 + nz * 0.35) * totalDisp;

      // Perturb normal for glossy clearcoat wave reflections
      const waveGrad = ripAmp * 14.0 * Math.cos(d * 18.0 - ripAge * 26.0) * Math.exp(-d * 1.8) / (d + 0.04);
      nx -= dx * (waveGrad - pokeD * 8.0 * indent);
      ny -= dy * (waveGrad - pokeD * 8.0 * indent);
      nz -= dz * (waveGrad - pokeD * 8.0 * indent);
    }

    // Keep bottom of feet from penetrating below pedestal surface (y = 0)
    if (y < 0.0) {
      const crush = -y;
      y = 0.0;
      x *= 1.0 + crush * 0.35;
      z *= 1.0 + crush * 0.35;
    }

    const nLen = Math.hypot(nx, ny, nz) || 1.0;
    posArr[i3] = x;
    posArr[i3 + 1] = y;
    posArr[i3 + 2] = z;
    normArr[i3] = nx / nLen;
    normArr[i3 + 1] = ny / nLen;
    normArr[i3 + 2] = nz / nLen;
  }

  posAttr.needsUpdate = true;
  normAttr.needsUpdate = true;
}

// ============================================================================
// 8. INTERACTIVE MOUSE RAYCASTER (HOVER WOBBLE & CLICK POKE SQUISH)
// ============================================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(99, 99);
let hoveredBear = null;

function handlePointerMove(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bearMeshes, false);

  for (let i = 0; i < bears.length; i++) {
    bears[i].hoverTargetDisp = 0.0;
  }

  if (hits.length > 0) {
    const hit = hits[0];
    const bear = bears.find((b) => b.mesh === hit.object);
    if (bear) {
      const localPt = bear.mesh.worldToLocal(hit.point.clone());
      const localN = hit.face
        ? hit.face.normal.clone().normalize()
        : localPt.clone().normalize();

      bear.pokeLocalPoint.lerp(localPt, 0.45);
      bear.pokeLocalNormal.lerp(localN, 0.45).normalize();
      bear.hoverTargetDisp = 0.095;

      // First-entry hover impulse: gentle elastic wobble
      if (hoveredBear !== bear) {
        bear.pokeVel += 0.95;
        bear.squashSpringVel -= 0.75;
        bear.bellyWobbleVel += 0.85;
        bear.headJiggleVelZ += (Math.random() - 0.5) * 1.4;
        bear.rippleAge = 0.0;
        bear.rippleStrength = Math.max(bear.rippleStrength, 0.022);
        hoveredBear = bear;
      }
      renderer.domElement.style.cursor = 'pointer';
      return;
    }
  }

  hoveredBear = null;
  renderer.domElement.style.cursor = 'grab';
}

function handlePointerDown(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bearMeshes, false);

  if (hits.length > 0) {
    const hit = hits[0];
    const bear = bears.find((b) => b.mesh === hit.object);
    if (bear) {
      const localPt = bear.mesh.worldToLocal(hit.point.clone());
      const localN = hit.face
        ? hit.face.normal.clone().normalize()
        : localPt.clone().normalize();

      bear.pokeLocalPoint.copy(localPt);
      bear.pokeLocalNormal.copy(localN);

      // Strong elastic poke & full-body squash-and-stretch reaction
      bear.pokeDisp = 0.22;
      bear.pokeVel = 2.8;
      bear.rippleAge = 0.0;
      bear.rippleStrength = 0.068;

      bear.squashSpringPos = -0.26;
      bear.squashSpringVel = -2.4;
      bear.bellyWobbleVel = 2.6;
      bear.headJiggleVelX = -2.2;
      bear.headJiggleVelZ = (localPt.x >= 0 ? -1 : 1) * 2.5;
      bear.armJiggleVel = 3.2;

      // Sympathetic mini-bounce on neighboring bears through the pedestal
      bears.forEach((other) => {
        if (other !== bear) {
          const dist = other.cfg.pos.distanceTo(bear.cfg.pos);
          const falloff = Math.exp(-dist * 0.75);
          other.squashSpringVel += 1.4 * falloff;
          other.bellyWobbleVel += 1.2 * falloff;
          other.headJiggleVelZ += (Math.random() - 0.5) * 1.5 * falloff;
        }
      });
    }
  }
}

window.addEventListener('pointermove', handlePointerMove, { passive: true });
window.addEventListener('pointerdown', handlePointerDown, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// 9. ANIMATION LOOP
// ============================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  for (let i = 0; i < bears.length; i++) {
    updateBearDeformation(bears[i], elapsed, dt);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
