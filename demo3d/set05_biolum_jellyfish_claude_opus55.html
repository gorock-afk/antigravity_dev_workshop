<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------------
// Renderer / scene / camera
// ------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.036);
scene.fog.color.setRGB(0.003, 0.016, 0.035);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0.6, 1.2, 12.4);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, -2.2, 0);
controls.minDistance = 4;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.64;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.update();

// Environment map for reflections (studio-like room, dimmed per material)
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environment = envTex;

let time = 0;

// ------------------------------------------------------------------
// Helpers
// ------------------------------------------------------------------
let seed = 1337;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function fract(x) { return x - Math.floor(x); }
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function contraction(ph) {
  if (ph < 0.3) { const x = ph / 0.3; return x * x * (3 - 2 * x); }
  const x = (ph - 0.3) / 0.7; return (1 - x) * (1 - x) * (1 + 2 * x);
}
function radialTex(stops, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ------------------------------------------------------------------
// Abyssal background
// ------------------------------------------------------------------
const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform float uTime;
    void main(){
      float h = vDir.y;
      vec3 deep = vec3(0.0004, 0.0015, 0.005);
      vec3 mid  = vec3(0.003, 0.016, 0.035);
      vec3 top  = vec3(0.015, 0.07, 0.13);
      vec3 col = mix(deep, mid, smoothstep(-0.6, 0.15, h));
      col = mix(col, top, smoothstep(0.15, 1.0, h));
      float ang = atan(vDir.z, vDir.x);
      float rays = (0.5 + 0.5 * sin(ang * 7.0 + uTime * 0.05 + sin(ang * 3.0))) * (0.5 + 0.5 * sin(ang * 13.0 - uTime * 0.07));
      col += vec3(0.015, 0.06, 0.09) * rays * smoothstep(0.35, 1.0, h) * 0.7;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const bg = new THREE.Mesh(new THREE.SphereGeometry(120, 48, 32), bgMat);
bg.renderOrder = -1;
scene.add(bg);

// ------------------------------------------------------------------
// Studio three-point lighting
// ------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0x2a6a9a, 0x020308, 0.45));
const key = new THREE.DirectionalLight(0xa8dcff, 2.3);
key.position.set(6, 14, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
{ const sc = key.shadow.camera; sc.left = -14; sc.right = 14; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 60; }
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.03;
key.target.position.set(0, -4, 0);
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0x3a5cff, 0.7); fill.position.set(-8, 2, 5); scene.add(fill);
const rimL = new THREE.DirectionalLight(0xff5ad8, 1.6); rimL.position.set(-2, 5, -9); scene.add(rimL);
const glowLight = new THREE.PointLight(0x55e6ff, 10, 20, 1.6); scene.add(glowLight);

// ------------------------------------------------------------------
// Seabed + soft contact shadow + bioluminescent glow pool
// ------------------------------------------------------------------
const SEABED_Y = -8.5;
{
  const g = new THREE.PlaneGeometry(90, 90, 160, 160);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
    const h = Math.sin(x * 0.35 + z * 0.12) * 0.35 + Math.sin(z * 0.5 - x * 0.2) * 0.25 + Math.sin(x * 1.3 + z * 1.7) * 0.06;
    p.setY(i, h * Math.min(1, (r / 8) * (r / 8)));
  }
  g.computeVertexNormals();
  const seabed = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x1b2b33, roughness: 0.95, metalness: 0, envMapIntensity: 0.15 }));
  seabed.position.y = SEABED_Y;
  seabed.receiveShadow = true;
  scene.add(seabed);
}
const contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
  map: radialTex([[0, 'rgba(0,0,0,0.9)'], [0.45, 'rgba(0,0,0,0.45)'], [1, 'rgba(0,0,0,0)']]),
  transparent: true, depthWrite: false, opacity: 0.6, polygonOffset: true, polygonOffsetFactor: -2
}));
contactShadow.rotation.x = -Math.PI / 2; contactShadow.position.y = SEABED_Y + 0.12; scene.add(contactShadow);
const glowPool = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
  map: radialTex([[0, 'rgba(90,230,255,0.7)'], [0.5, 'rgba(60,120,255,0.2)'], [1, 'rgba(0,0,0,0)']]),
  transparent: true, depthWrite: false, opacity: 0.15, blending: THREE.AdditiveBlending, polygonOffset: true, polygonOffsetFactor: -3
}));
glowPool.rotation.x = -Math.PI / 2; glowPool.position.y = SEABED_Y + 0.14; scene.add(glowPool);

// ------------------------------------------------------------------
// Jellyfish root
// ------------------------------------------------------------------
const jelly = new THREE.Group();
scene.add(jelly);

const CYAN = new THREE.Color(0.1, 0.85, 1.0);
const MAGENTA = new THREE.Color(1.0, 0.2, 0.8);
const WARM = new THREE.Color(1.0, 0.5, 0.3);
const palette = [new THREE.Color(0.25, 1.0, 0.95), new THREE.Color(1.0, 0.3, 0.85), new THREE.Color(0.55, 0.5, 1.0), new THREE.Color(0.45, 1.0, 0.65)];

// ---------- Bell emissive canal texture (R: radial canals, G: ring canal / margin, B: pigment) ----------
function makeBellTexture() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round'; g.lineJoin = 'round';
  const wavy = (u, v0, v1, amp, sd) => {
    g.beginPath();
    for (let s = 0; s <= 48; s++) {
      const v = v0 + (v1 - v0) * s / 48;
      const x = (u + amp * Math.sin(v * 18 + sd) * v) * W, y = v * H;
      if (s === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  };
  const passes = [{ blur: 6, w: 14, a: 0.55 }, { blur: 2, w: 5, a: 0.8 }, { blur: 0, w: 2, a: 1 }];
  for (const ps of passes) {
    g.filter = ps.blur ? `blur(${ps.blur}px)` : 'none';
    g.strokeStyle = `rgba(255,0,0,${ps.a})`; g.lineWidth = ps.w;
    for (let k = 0; k <= 16; k++) wavy(k / 16, 0.06, 0.93, 0.0025, (k % 16) * 1.7);
    g.lineWidth = ps.w * 0.6;
    for (let k = 0; k <= 16; k++) {
      for (const sg of [-1, 1]) {
        const u = k / 16;
        g.beginPath(); g.moveTo(u * W, 0.72 * H);
        g.quadraticCurveTo((u + sg * 0.008) * W, 0.84 * H, (u + sg * 0.018) * W, 0.95 * H);
        g.stroke();
      }
    }
    g.strokeStyle = `rgba(150,0,0,${ps.a})`; g.lineWidth = ps.w * 0.55;
    for (let k = 0; k < 16; k++) wavy((k + 0.5) / 16, 0.32, 0.975, 0.002, k * 2.3);
    g.strokeStyle = `rgba(0,255,0,${ps.a})`; g.lineWidth = ps.w * 0.8;
    g.beginPath(); g.moveTo(0, 0.905 * H);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, (0.905 + 0.006 * Math.sin(x / W * Math.PI * 32)) * H);
    g.stroke();
  }
  g.filter = 'none';
  let gr = g.createLinearGradient(0, 0.93 * H, 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,200,0,1)');
  g.fillStyle = gr; g.fillRect(0, 0.93 * H, W, 0.07 * H);
  g.filter = 'blur(3px)';
  g.fillStyle = 'rgba(0,255,0,1)';
  for (let k = 0; k < 16; k++) { g.beginPath(); g.arc((k + 0.5) / 16 * W, 0.975 * H, 7, 0, Math.PI * 2); g.fill(); }
  g.filter = 'blur(10px)';
  gr = g.createLinearGradient(0, 0, 0, 0.35 * H);
  gr.addColorStop(0, 'rgba(0,0,255,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, 0.35 * H);
  g.fillStyle = 'rgba(0,0,110,1)';
  for (let k = 0; k < 16; k++) {
    for (const o of [0.25, 0.75]) { const x = (k + o) / 16 * W; g.fillRect(x - 7, 0.14 * H, 14, 0.66 * H); }
  }
  g.filter = 'none';
  const t = new THREE.CanvasTexture(c);
  t.flipY = false;
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- Bell geometry (dynamic, scalloped, 16 lobes) ----------
const SEG = 192, RINGS = 64, PHI_MAX = Math.PI * 0.5 * 1.1, R0 = 1.75, H0 = 1.2, T = 3.4;
const BELL_VERTS = (RINGS + 1) * (SEG + 1);
const bellPos = new Float32Array(BELL_VERTS * 3);
const bellUV = new Float32Array(BELL_VERTS * 2);
const bellIdx = [];
for (let i = 0; i <= RINGS; i++) for (let j = 0; j <= SEG; j++) {
  const k = i * (SEG + 1) + j; bellUV[k * 2] = j / SEG; bellUV[k * 2 + 1] = i / RINGS;
}
for (let i = 0; i < RINGS; i++) for (let j = 0; j < SEG; j++) {
  const a = i * (SEG + 1) + j, b = a + 1, c = a + SEG + 1, d = c + 1;
  bellIdx.push(a, b, c, b, d, c);
}
const bellGeo = new THREE.BufferGeometry();
bellGeo.setAttribute('position', new THREE.BufferAttribute(bellPos, 3).setUsage(THREE.DynamicDrawUsage));
bellGeo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(BELL_VERTS * 3), 3).setUsage(THREE.DynamicDrawUsage));
bellGeo.setAttribute('uv', new THREE.BufferAttribute(bellUV, 2));
bellGeo.setIndex(bellIdx);
bellGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0.4, 0), 2.8);

const colCos = new Float32Array(SEG + 1), colSin = new Float32Array(SEG + 1), colLobe = new Float32Array(SEG + 1), colTheta = new Float32Array(SEG + 1);
for (let j = 0; j <= SEG; j++) {
  const th = j / SEG * Math.PI * 2;
  colTheta[j] = th; colCos[j] = Math.cos(th); colSin[j] = Math.sin(th);
  colLobe[j] = Math.pow(Math.abs(Math.cos(8 * th)), 0.55);
}
const ringSp = new Float32Array(RINGS + 1), ringCp = new Float32Array(RINGS + 1), ringC = new Float32Array(RINGS + 1);
for (let i = 0; i <= RINGS; i++) { const phi = i / RINGS * PHI_MAX; ringSp[i] = Math.sin(phi); ringCp[i] = Math.cos(phi); }

const tmpP = { x: 0, y: 0, z: 0 };
function bellPoint(v, sp, cp, cv, cosT, sinT, lobe, theta, out) {
  const m = smooth(0.78, 1.0, v);
  let r = R0 * sp * (1 - 0.2 * cv * Math.pow(v, 1.5)) + m * 0.12 * (1 - cv);
  r *= 1 - m * 0.07 * (1 - lobe);
  r += 0.025 * v * Math.sin(3 * theta + time * 0.6) + 0.012 * v * Math.sin(5 * theta - time * 0.9);
  const y = H0 * cp * (1 + 0.14 * cv * (1 - v)) - m * (0.2 * lobe + 0.06) - m * 0.1 * cv;
  out.x = r * cosT; out.y = y; out.z = r * sinT;
}

const bellUniforms = {
  uTime: { value: 0 }, uFlash: { value: 0 }, uFlashPos: { value: 0 }, uGlow: { value: 1 }, uContract: { value: 0 },
  uColA: { value: CYAN.clone() }, uColB: { value: MAGENTA.clone() }, uColC: { value: WARM.clone() }, uFlashCol: { value: palette[0].clone() }
};
const bellMat = new THREE.MeshPhysicalMaterial({
  color: 0xc4ecff, metalness: 0, roughness: 0.12,
  transmission: 0.93, thickness: 0.8, ior: 1.34,
  attenuationColor: new THREE.Color(0x7fdcff), attenuationDistance: 3.0,
  iridescence: 1.0, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 480],
  clearcoat: 1.0, clearcoatRoughness: 0.08, specularIntensity: 1.0,
  envMapIntensity: 0.8, side: THREE.DoubleSide,
  emissive: 0xffffff, emissiveMap: makeBellTexture()
});
bellMat.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, bellUniforms);
  shader.fragmentShader = `
uniform float uTime; uniform float uFlash; uniform float uFlashPos; uniform float uGlow; uniform float uContract;
uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uColC; uniform vec3 uFlashCol;
` + shader.fragmentShader.replace('#include <emissivemap_fragment>', `
#ifdef USE_EMISSIVEMAP
  vec4 eTex = texture2D( emissiveMap, vEmissiveMapUv );
  float bv = vEmissiveMapUv.y;
  float bu = vEmissiveMapUv.x;
  float flashW = uFlash * exp( -pow( ( bv - uFlashPos ) * 5.0, 2.0 ) );
  float breathe = 0.6 + 0.4 * sin( uTime * 2.1 - bv * 7.0 + sin( bu * 6.2831853 * 16.0 ) * 0.3 );
  float hueMix = 0.5 + 0.5 * sin( bu * 6.2831853 * 2.0 + uTime * 0.35 + bv * 2.5 );
  vec3 canalCol = mix( uColA, uColB, hueMix );
  vec3 en = normalize( normal );
  vec3 ev = normalize( vViewPosition );
  float rimF = pow( 1.0 - clamp( abs( dot( en, ev ) ), 0.0, 1.0 ), 2.5 );
  vec3 glow = canalCol * eTex.r * ( 0.9 * breathe + 0.6 * uContract ) * uGlow;
  glow += mix( uColB, uColA, 0.35 ) * eTex.g * ( 0.8 + 0.7 * uContract ) * uGlow;
  glow += uColC * eTex.b * 0.25 * breathe;
  glow += uFlashCol * ( eTex.r * 2.0 + eTex.g * 2.5 + 0.25 ) * flashW;
  glow += mix( uColA, uColB, bv ) * rimF * ( 0.18 + 0.5 * flashW );
  totalEmissiveRadiance = glow;
#endif
`);
};
const bell = new THREE.Mesh(bellGeo, bellMat);
jelly.add(bell);

// ---------- Rhopalia (16, in the marginal notches) ----------
const rhoMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.6, 2.5, 2.6) });
const rhoGeo = new THREE.SphereGeometry(0.05, 12, 8);
const rhopalia = [];
for (let k = 0; k < 16; k++) { const m = new THREE.Mesh(rhoGeo, rhoMat); jelly.add(m); rhopalia.push(m); }

// ---------- Glowing core: gonads, stomach, manubrium, gastric filaments ----------
const core = new THREE.Group(); core.position.y = 0.55; jelly.add(core);
const gonadMat = new THREE.MeshStandardMaterial({ color: 0xff8fd0, emissive: 0xff3aa8, emissiveIntensity: 1.6, roughness: 0.45, metalness: 0, envMapIntensity: 0.5 });
const stomachMat = new THREE.MeshStandardMaterial({ color: 0xffd2b0, emissive: 0xff8a4a, emissiveIntensity: 1.1, roughness: 0.4, metalness: 0, envMapIntensity: 0.5 });
const maniMat = new THREE.MeshStandardMaterial({ color: 0xffb0e0, emissive: 0xb03090, emissiveIntensity: 0.8, roughness: 0.5, metalness: 0 });
for (let k = 0; k < 4; k++) {
  const g = new THREE.Group(); g.rotation.y = k * Math.PI / 2 + Math.PI / 4; core.add(g);
  const tor = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.065, 14, 48, Math.PI * 1.35), gonadMat);
  tor.rotation.set(Math.PI / 2, 0, -1.675 * Math.PI);
  tor.position.x = 0.36; tor.castShadow = true;
  g.add(tor);
}
{
  const st = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 20), stomachMat);
  st.scale.set(1, 0.55, 1); st.position.y = 0.22; st.castShadow = true; core.add(st);
  const ma = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 0.55, 20), maniMat);
  ma.position.y = -0.15; ma.castShadow = true; core.add(ma);
  const fil = new THREE.InstancedMesh(new THREE.SphereGeometry(0.022, 8, 6), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.4, 2.2, 2.4) }), 48);
  const dm = new THREE.Object3D();
  for (let i = 0; i < 48; i++) {
    const a = rnd() * Math.PI * 2, r = 0.5 + rnd() * 0.25;
    dm.position.set(Math.cos(a) * r, -0.05 + rnd() * 0.18, Math.sin(a) * r);
    dm.updateMatrix(); fil.setMatrixAt(i, dm.matrix);
  }
  core.add(fil);
}

// ------------------------------------------------------------------
// Tentacle / oral-arm machinery
// ------------------------------------------------------------------
function makeFrames(n) { return { n, t: new Float32Array(n * 3), nn: new Float32Array(n * 3), b: new Float32Array(n * 3) }; }
function computeFrames(p, fr, rx, ry, rz) {
  const n = fr.n, Tt = fr.t, N = fr.nn, B = fr.b;
  let qx = rx, qy = ry, qz = rz;
  for (let i = 0; i < n; i++) {
    const a = (i > 0 ? i - 1 : 0) * 3, c = (i < n - 1 ? i + 1 : n - 1) * 3;
    let tx = p[c] - p[a], ty = p[c + 1] - p[a + 1], tz = p[c + 2] - p[a + 2];
    const tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1; tx /= tl; ty /= tl; tz /= tl;
    const d = qx * tx + qy * ty + qz * tz;
    let nx = qx - tx * d, ny = qy - ty * d, nz = qz - tz * d;
    let nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
    if (nl < 1e-5) { nx = 0; ny = tz; nz = -ty; nl = Math.sqrt(ny * ny + nz * nz); if (nl < 1e-5) { nx = 0; ny = 0; nz = 1; nl = 1; } }
    nx /= nl; ny /= nl; nz /= nl;
    const bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
    const k = i * 3;
    Tt[k] = tx; Tt[k + 1] = ty; Tt[k + 2] = tz;
    N[k] = nx; N[k + 1] = ny; N[k + 2] = nz;
    B[k] = bx; B[k + 1] = by; B[k + 2] = bz;
    qx = nx; qy = ny; qz = nz;
  }
}

class Tube {
  constructor(n, radial, radiusFn, material) {
    this.n = n; this.R = radial;
    this.radii = new Float32Array(n);
    for (let i = 0; i < n; i++) this.radii[i] = radiusFn(i / (n - 1));
    this.cs = new Float32Array(radial); this.sn = new Float32Array(radial);
    for (let j = 0; j < radial; j++) { this.cs[j] = Math.cos(j / radial * Math.PI * 2); this.sn[j] = Math.sin(j / radial * Math.PI * 2); }
    const vc = n * radial;
    this.pos = new Float32Array(vc * 3); this.nor = new Float32Array(vc * 3); this.col = new Float32Array(vc * 3);
    const idx = [];
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < radial; j++) {
      const a = i * radial + j, b = i * radial + (j + 1) % radial, c = a + radial, d = b + radial;
      idx.push(a, c, b, b, c, d);
    }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('normal', new THREE.BufferAttribute(this.nor, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setIndex(idx);
    this.mesh = new THREE.Mesh(this.geo, material);
    this.mesh.frustumCulled = false;
  }
  update(p, fr, rc) {
    const n = this.n, R = this.R, pos = this.pos, nor = this.nor, col = this.col, N = fr.nn, B = fr.b;
    for (let i = 0; i < n; i++) {
      const k = i * 3, r = this.radii[i];
      const nx = N[k], ny = N[k + 1], nz = N[k + 2], bx = B[k], by = B[k + 1], bz = B[k + 2];
      const cx = p[k], cy = p[k + 1], cz = p[k + 2];
      for (let j = 0; j < R; j++) {
        const c = this.cs[j], s = this.sn[j];
        const ox = nx * c + bx * s, oy = ny * c + by * s, oz = nz * c + bz * s;
        const m = (i * R + j) * 3;
        pos[m] = cx + ox * r; pos[m + 1] = cy + oy * r; pos[m + 2] = cz + oz * r;
        nor[m] = ox; nor[m + 1] = oy; nor[m + 2] = oz;
        col[m] = rc[k]; col[m + 1] = rc[k + 1]; col[m + 2] = rc[k + 2];
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.normal.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
  }
}

class Ribbon {
  constructor(n, cols, width, angle, phase, material) {
    this.n = n; this.C = cols; this.width = width; this.angle = angle; this.phase = phase;
    const vc = n * cols;
    this.pos = new Float32Array(vc * 3); this.col = new Float32Array(vc * 3);
    const idx = [];
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < cols - 1; j++) {
      const a = i * cols + j, b = a + 1, c = a + cols, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setIndex(idx);
    this.mesh = new THREE.Mesh(this.geo, material);
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = true;
  }
  update(p, fr, rc) {
    const n = this.n, C = this.C, pos = this.pos, col = this.col, N = fr.nn, B = fr.b;
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1);
      const w = this.width * Math.min(1, 0.2 + u * 9) * (1 - 0.75 * u);
      const tw = this.angle + this.phase + i * 0.14 + time * 0.2;
      const ca = Math.cos(tw), sa = Math.sin(tw);
      const k = i * 3;
      const d1x = N[k] * ca + B[k] * sa, d1y = N[k + 1] * ca + B[k + 1] * sa, d1z = N[k + 2] * ca + B[k + 2] * sa;
      const d2x = -N[k] * sa + B[k] * ca, d2y = -N[k + 1] * sa + B[k + 1] * ca, d2z = -N[k + 2] * sa + B[k + 2] * ca;
      const cx = p[k], cy = p[k + 1], cz = p[k + 2];
      const breathe = 1 + 0.15 * Math.sin(i * 0.9 + time * 1.3 + this.phase);
      for (let j = 0; j < C; j++) {
        const sc = j / (C - 1) * 2 - 1, as = Math.abs(sc);
        const ruf = (Math.sin(i * 1.05 + time * 2.0 + this.phase * 3 + sc * 0.9) * 0.12 +
                     Math.sin(i * 1.9 - time * 1.5 + this.phase * 5) * 0.05) * Math.pow(as, 1.5) * (0.45 + u * 0.9);
        const fold = 0.3 * w * sc * sc;
        const lat = sc * w * breathe;
        const off = fold + ruf;
        const m = (i * C + j) * 3;
        pos[m] = cx + d1x * lat + d2x * off;
        pos[m + 1] = cy + d1y * lat + d2y * off;
        pos[m + 2] = cz + d1z * lat + d2z * off;
        const e = 0.25 + 0.75 * as * as;
        col[m] = rc[k] * e; col[m + 1] = rc[k + 1] * e; col[m + 2] = rc[k + 2] * e;
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
}

// ---------- Fluid flow field (ambient current + pulse wake + mouse vortex) ----------
const vortex = {
  c: new THREE.Vector3(0, -100, 0), axis: new THREE.Vector3(0, 0, -1), s: 0, burst: 0,
  vel: new THREE.Vector3(), prev: new THREE.Vector3(), has: false
};
const F = { x: 0, y: 0, z: 0 };
let pulseVelG = 0, cmG = 0;
function flowAt(x, y, z) {
  let fx = 0.09 * Math.sin(time * 0.21 + y * 0.35 + z * 0.1);
  let fy = 0.03 * Math.sin(time * 0.13 + x * 0.3);
  let fz = 0.07 * Math.cos(time * 0.17 + x * 0.28 + y * 0.2);
  const jp = jelly.position;
  const ddx = x - jp.x, ddy = y - jp.y, ddz = z - jp.z;
  const rho2 = ddx * ddx + ddz * ddz;
  if (ddy < 0.6) {
    const fall = Math.exp(-rho2 * 0.3) * Math.exp(Math.min(0, ddy) * 0.22);
    fy -= pulseVelG * 1.3 * fall;
    fx -= ddx * pulseVelG * 0.45 * fall;
    fz -= ddz * pulseVelG * 0.45 * fall;
  }
  const S = vortex.s + vortex.burst;
  if (S > 0.002) {
    const c = vortex.c, a = vortex.axis;
    const vx = x - c.x, vy = y - c.y, vz = z - c.z;
    const al = vx * a.x + vy * a.y + vz * a.z;
    const rx = vx - a.x * al, ry = vy - a.y * al, rz = vz - a.z * al;
    const r2 = rx * rx + ry * ry + rz * rz;
    const fall = Math.exp(-r2 * 0.16 - al * al * 0.05);
    const sw = S * 3.2 / (r2 + 0.4) * fall;
    fx += (a.y * rz - a.z * ry) * sw - rx * sw * 0.15;
    fy += (a.z * rx - a.x * rz) * sw - ry * sw * 0.15;
    fz += (a.x * ry - a.y * rx) * sw - rz * sw * 0.15;
    const push = vortex.s * 0.55 * Math.exp(-r2 * 0.35 - al * al * 0.05);
    fx += vortex.vel.x * push; fy += vortex.vel.y * push; fz += vortex.vel.z * push;
  }
  F.x = fx; F.y = fy; F.z = fz;
}

// ---------- Verlet strand simulation with phase-lagged undulation and fluid drag ----------
function simulate(s, opt, h, limitY) {
  const p = s.p, q = s.q, n = s.n, L = s.L, root = s.root, dir = s.dir, tan = s.tan, rad = s.rad;
  const h2 = h * h;
  const ampMod = opt.amp * (0.6 + 0.7 * cmG);
  for (let i = 1; i < n; i++) {
    const k = i * 3;
    const x = p[k], y = p[k + 1], z = p[k + 2];
    let vx = x - q[k], vy = y - q[k + 1], vz = z - q[k + 2];
    flowAt(x, y, z);
    const u = i / (n - 1);
    const w1 = Math.sin(time * opt.freq - i * opt.lag + s.phase) * ampMod * (0.2 + u);
    const w2 = Math.cos(time * opt.freq * 0.73 - i * opt.lag * 0.8 + s.phase * 1.7) * ampMod * 0.6 * (0.2 + u);
    const tx = (F.x + tan.x * w1 + rad.x * w2) * h;
    const ty = (F.y + tan.y * w1 + rad.y * w2) * h;
    const tz = (F.z + tan.z * w1 + rad.z * w2) * h;
    const dr = opt.drag;
    vx += (tx - vx) * dr; vy += (ty - vy) * dr; vz += (tz - vz) * dr;
    vy -= opt.gravity * h2;
    q[k] = x; q[k + 1] = y; q[k + 2] = z;
    p[k] = x + vx; p[k + 1] = y + vy; p[k + 2] = z + vz;
  }
  p[0] = root.x; p[1] = root.y; p[2] = root.z;
  q[0] = root.x; q[1] = root.y; q[2] = root.z;
  const gd = opt.guide;
  for (let i = 1; i < gd.length && i < n; i++) {
    const k = i * 3, w = gd[i];
    p[k] += (root.x + dir.x * L * i - p[k]) * w;
    p[k + 1] += (root.y + dir.y * L * i - p[k + 1]) * w;
    p[k + 2] += (root.z + dir.z * L * i - p[k + 2]) * w;
  }
  const jp = jelly.position, rr = (R0 * 1.1) * (R0 * 1.1);
  for (let it = 0; it < opt.iters; it++) {
    for (let i = 0; i < n - 1; i++) {
      const a = i * 3, b = a + 3;
      const ex = p[b] - p[a], ey = p[b + 1] - p[a + 1], ez = p[b + 2] - p[a + 2];
      const d = Math.sqrt(ex * ex + ey * ey + ez * ez) + 1e-9;
      const df = (d - L) / d;
      if (i === 0) { p[b] -= ex * df; p[b + 1] -= ey * df; p[b + 2] -= ez * df; }
      else {
        const hf = df * 0.5;
        p[a] += ex * hf; p[a + 1] += ey * hf; p[a + 2] += ez * hf;
        p[b] -= ex * hf; p[b + 1] -= ey * hf; p[b + 2] -= ez * hf;
      }
    }
    for (let i = opt.collideFrom; i < n; i++) {
      const k = i * 3, hx = p[k] - jp.x, hz = p[k + 2] - jp.z;
      if (p[k + 1] > limitY && p[k + 1] < jp.y + 1.4 && hx * hx + hz * hz < rr) p[k + 1] += (limitY - p[k + 1]) * 0.5;
    }
  }
}

function makeStrand(n, len, th) {
  return {
    n, L: len / (n - 1), p: new Float32Array(n * 3), q: new Float32Array(n * 3), phase: rnd() * Math.PI * 2, th,
    root: new THREE.Vector3(), dir: new THREE.Vector3(), tan: new THREE.Vector3(), rad: new THREE.Vector3(),
    rc: new Float32Array(n * 3), fr: makeFrames(n)
  };
}
function initStrand(s) {
  for (let i = 0; i < s.n; i++) {
    const k = i * 3;
    s.p[k] = s.root.x + s.dir.x * s.L * i; s.p[k + 1] = s.root.y + s.dir.y * s.L * i; s.p[k + 2] = s.root.z + s.dir.z * s.L * i;
    s.q[k] = s.p[k]; s.q[k + 1] = s.p[k + 1]; s.q[k + 2] = s.p[k + 2];
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerInside = false, lastMoveTime = -10;
function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;

  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 6 && performance.now() - downT < 500) { setPointer(e); clickImpulse(); }

const ripples = [];
function addRipple(worldPoint, amp) {
  const l = jelly.worldToLocal(worldPoint.clone());
  ripples.push({ x: l.x, y: l.y, z: l.z, t0: time, amp });
  if (ripples.length > 8) ripples.shift();
}
let flashAge = 99, lastFlash = -10, flashStrength = 1, flashIdx = 0;
const flashCol = palette[0].clone();
function triggerFlash(strong) {
  flashAge = 0; lastFlash = time;
  flashCol.copy(palette[(flashIdx++) % palette.length]);
  bellUniforms.uFlashCol.value.copy(flashCol);
  flashStrength = strong ? 1.6 : 1.0;
}
function flashTent(u) {
  if (flashAge > 8) return 0;
  const c = (flashAge - 0.8) * 0.8, d = (u - c) * 6;
  return Math.exp(-d * d) * Math.exp(-flashAge * 0.3) * flashStrength * 2.2;
}
let wob = 0;
function clickImpulse() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) return;
  const h = hits[0];
  if (h.object === bell) addRipple(h.point, 0.13);
  vortex.c.copy(h.point); vortex.axis.copy(raycaster.ray.direction);
  vortex.burst = 1.2; wob = 1;

}

const hitPt = new THREE.Vector3(), tmpC = new THREE.Vector3(), tmpD2 = new THREE.Vector3();
let lastRipple = -10, tiltX = 0, tiltZ = 0;
function updateInteraction(dt) {
  let target = 0;
  if (pointerInside) {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    const ray = raycaster.ray;
    let hitBell = null;
    if (hits.length) { hitPt.copy(hits[0].point); target = 1; if (hits[0].object === bell) hitBell = hits[0]; }
    else {
      tmpC.set(jelly.position.x, jelly.position.y - 2.4, jelly.position.z);
      const tt = Math.max(0, tmpD2.subVectors(tmpC, ray.origin).dot(ray.direction));
      hitPt.copy(ray.direction).multiplyScalar(tt).add(ray.origin);
      const d = hitPt.distanceTo(tmpC);
      target = d < 4.5 ? (1 - d / 4.5) * 0.75 : 0;
    }
    const moving = (time - lastMoveTime) < 0.3;
    if (target > 0) {
      if (!vortex.has) { vortex.prev.copy(hitPt); vortex.has = true; }
      vortex.vel.subVectors(hitPt, vortex.prev).divideScalar(Math.max(dt, 1e-3));
      if (vortex.vel.length() > 8) vortex.vel.setLength(8);
      vortex.prev.copy(hitPt);
      vortex.c.copy(hitPt);
      vortex.axis.copy(ray.direction);
      if (!moving) target *= 0.3;
    } else vortex.has = false;
    if (hitBell && moving && time - lastRipple > 0.16) {
      addRipple(hitBell.point, 0.03 + Math.min(0.05, vortex.vel.length() * 0.01));
      lastRipple = time;
    }
    if (hits.length && moving && time - lastFlash > 2.6) triggerFlash(false);
  } else vortex.has = false;
  if (!vortex.has) vortex.vel.multiplyScalar(Math.exp(-dt * 3));
  vortex.s += (target - vortex.s) * Math.min(1, dt * 3.5);
  vortex.burst *= Math.exp(-dt * 1.4);
  const tx = THREE.MathUtils.clamp(vortex.vel.z * 0.035 * vortex.s, -0.3, 0.3);
  const tz = THREE.MathUtils.clamp(-vortex.vel.x * 0.035 * vortex.s, -0.3, 0.3);
  tiltX += (tx - tiltX) * Math.min(1, dt * 2.5);
  tiltZ += (tz - tiltZ) * Math.min(1, dt * 2.5);
  wob *= Math.exp(-dt * 1.8);
}

// ------------------------------------------------------------------
// Bell update
// ------------------------------------------------------------------
function updateBell() {
  for (let i = 0; i <= RINGS; i++) ringC[i] = contraction(fract(time / T - (i / RINGS) * 0.22));
  for (let r = ripples.length - 1; r >= 0; r--) if (time - ripples[r].t0 > 3.5) ripples.splice(r, 1);
  const nr = ripples.length;
  for (let i = 0; i <= RINGS; i++) {
    const v = i / RINGS, sp = ringSp[i], cp = ringCp[i], cv = ringC[i];
    for (let j = 0; j <= SEG; j++) {
      bellPoint(v, sp, cp, cv, colCos[j], colSin[j], colLobe[j], colTheta[j], tmpP);
      let x = tmpP.x, y = tmpP.y, z = tmpP.z;
      if (nr > 0) {
        let disp = 0;
        for (let r = 0; r < nr; r++) {
          const rp = ripples[r];
          const dx = x - rp.x, dy = y - rp.y, dz = z - rp.z;
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 < 5) {
            const d = Math.sqrt(d2), age = time - rp.t0;
            disp += rp.amp * Math.exp(-age * 1.6) * Math.sin(age * 11 - d * 9) * Math.exp(-d2 * 1.2);
          }
        }
        if (disp !== 0) {
          const ny = y - 0.35, Ln = Math.sqrt(x * x + ny * ny + z * z) || 1;
          x += x / Ln * disp; y += ny / Ln * disp; z += z / Ln * disp;
        }
      }
      const k = (i * (SEG + 1) + j) * 3;
      bellPos[k] = x; bellPos[k + 1] = y; bellPos[k + 2] = z;
    }
  }
  bellGeo.attributes.position.needsUpdate = true;
  bellGeo.computeVertexNormals();
  const nrm = bellGeo.attributes.normal.array;
  for (let i = 0; i <= RINGS; i++) {
    const a = (i * (SEG + 1)) * 3, b = (i * (SEG + 1) + SEG) * 3;
    let nx = nrm[a] + nrm[b], ny = nrm[a + 1] + nrm[b + 1], nz = nrm[a + 2] + nrm[b + 2];
    const l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1; nx /= l; ny /= l; nz /= l;
    nrm[a] = nrm[b] = nx; nrm[a + 1] = nrm[b + 1] = ny; nrm[a + 2] = nrm[b + 2] = nz;
  }
  for (let j = 0; j <= SEG; j++) { const k = j * 3; nrm[k] = 0; nrm[k + 1] = 1; nrm[k + 2] = 0; }
  bellGeo.attributes.normal.needsUpdate = true;

  for (let k = 0; k < 16; k++) {
    const th = (k + 0.5) / 16 * Math.PI * 2, v = 0.975, phi = v * PHI_MAX;
    const cv = contraction(fract(time / T - v * 0.22));
    bellPoint(v, Math.sin(phi), Math.cos(phi), cv, Math.cos(th), Math.sin(th), Math.pow(Math.abs(Math.cos(8 * th)), 0.55), th, tmpP);
    rhopalia[k].position.set(tmpP.x * 0.97, tmpP.y - 0.02, tmpP.z * 0.97);
    rhopalia[k].scale.setScalar(1 + 0.4 * cv + 0.8 * flashTent(0.02));
  }
}

// ------------------------------------------------------------------
// Strand colors
// ------------------------------------------------------------------
function colorMarginal(s, k) {
  const n = s.n, rc = s.rc;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const hm = 0.5 + 0.5 * Math.sin(time * 0.3 + k * 0.6 + u * 2.0);
    const mx = Math.min(1, u * 0.9 * hm + 0.1);
    const pulse = 0.28 + 0.22 * Math.max(0, Math.sin(time * 2.4 - u * 11 + k * 0.7)) + 0.25 * cmG * (1 - u);
    const fw = flashTent(u);
    const j = i * 3;
    rc[j] = (CYAN.r + (MAGENTA.r - CYAN.r) * mx) * pulse + flashCol.r * fw;
    rc[j + 1] = (CYAN.g + (MAGENTA.g - CYAN.g) * mx) * pulse + flashCol.g * fw;
    rc[j + 2] = (CYAN.b + (MAGENTA.b - CYAN.b) * mx) * pulse + flashCol.b * fw;
  }
}
function colorArm(s, k) {
  const n = s.n, rc = s.rc;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const pulse = 0.24 + 0.15 * Math.sin(time * 1.6 - u * 7 + k * 1.3) + 0.15 * cmG * (1 - u);
    const fw = flashTent(u) * 0.8;
    const j = i * 3;
    rc[j] = (1.0 + (0.6 - 1.0) * u) * pulse + flashCol.r * fw;
    rc[j + 1] = (0.35 + (0.5 - 0.35) * u) * pulse + flashCol.g * fw;
    rc[j + 2] = (0.75 + (1.0 - 0.75) * u) * pulse + flashCol.b * fw;
  }
}

// ------------------------------------------------------------------
// Init
// ------------------------------------------------------------------
let jy = 0.3, jvy = 0;
let prevCm = contraction(fract(-0.22));
jelly.position.set(0, jy, 0);
jelly.updateMatrixWorld(true);
updateRoots();
for (const s of marg) initStrand(s);
for (const s of arms) initStrand(s);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
});

// ------------------------------------------------------------------
// Animation loop
// ------------------------------------------------------------------
const clock = new THREE.Clock();
const coreWorld = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1 / 20);
  time += dt;

  // Rhythmic pulse + jet propulsion
  const cm = contraction(fract(time / T - 0.22));
  const pv = (cm - prevCm) / Math.max(dt, 1e-4); prevCm = cm;
  pulseVelG += (pv - pulseVelG) * Math.min(1, dt * 12);
  cmG = cm;
  if (pv > 0) jvy += pv * 1.15 * dt;
  jvy -= (0.24 + (jy - 0.3) * 0.35) * dt;
  jvy *= Math.exp(-1.4 * dt);
  jy = THREE.MathUtils.clamp(jy + jvy * dt, -1.5, 2.0);
  jelly.position.set(0.55 * Math.sin(time * 0.09), jy, 0.4 * Math.sin(time * 0.067 + 1.0));
  jelly.rotation.set(
    0.06 * Math.sin(time * 0.17) + tiltX + wob * 0.08 * Math.sin(time * 6.0),
    time * 0.05,
    0.07 * Math.sin(time * 0.21) + tiltZ + wob * 0.08 * Math.cos(time * 5.0)
  );
  jelly.updateMatrixWorld(true);
  proxy.position.set(jelly.position.x, jelly.position.y - 3.4, jelly.position.z);
  proxy.updateMatrixWorld(true);

  updateInteraction(dt);

  flashAge += dt;
  const flashV = flashAge < 8 ? Math.exp(-flashAge * 0.7) * flashStrength : 0;

  updateBell();

  core.position.y = 0.55 + 0.1 * cm;
  core.scale.setScalar(1 - 0.07 * cm);
  gonadMat.emissiveIntensity = 1.4 + 0.8 * cm + 3.0 * flashV;
  stomachMat.emissiveIntensity = 1.0 + 0.5 * cm + 2.0 * flashV;

  // Tentacles & oral arms
  updateRoots();
  const steps = Math.max(1, Math.min(3, Math.round(dt * 60)));
  const limitY = jelly.position.y - 0.38;
  for (let st = 0; st < steps; st++) {
    for (const s of marg) simulate(s, margOpt, 1 / 60, limitY);
    for (const s of arms) simulate(s, armOpt, 1 / 60, limitY);
  }
  const me = jelly.matrixWorld.elements;
  const rx = me[0], ry = me[1], rz = me[2];
  for (let k = 0; k < marg.length; k++) {
    const s = marg[k];
    computeFrames(s.p, s.fr, rx, ry, rz);
    colorMarginal(s, k);
    s.tube.update(s.p, s.fr, s.rc);
  }
  for (let k = 0; k < arms.length; k++) {
    const s = arms[k];
    computeFrames(s.p, s.fr, rx, ry, rz);
    colorArm(s, k);
    s.rib1.update(s.p, s.fr, s.rc);
    s.rib2.update(s.p, s.fr, s.rc);
  }

  updateSnow(dt);

  // Uniforms & lights
  bellUniforms.uTime.value = time;
  bellUniforms.uContract.value = cm;
  bellUniforms.uFlash.value = flashV;
  bellUniforms.uFlashPos.value = flashAge * 1.1 - 0.1;
  bellUniforms.uGlow.value = 1.0 + 0.4 * vortex.s;
  bgMat.uniforms.uTime.value = time;

  core.getWorldPosition(coreWorld);
  glowLight.position.copy(coreWorld);
  glowLight.intensity = 7 + 3 * cm + 14 * flashV;
  glowLight.color.copy(CYAN).lerp(flashCol, Math.min(1, flashV));

  const height = jelly.position.y - SEABED_Y;
  contactShadow.position.x = jelly.position.x; contactShadow.position.z = jelly.position.z;
  contactShadow.scale.setScalar(4.5 + height * 0.3);
  contactShadow.material.opacity = THREE.MathUtils.clamp(0.8 - height * 0.04, 0.15, 0.7);
  glowPool.position.x = jelly.position.x; glowPool.position.z = jelly.position.z;
  glowPool.scale.setScalar(10 + 2 * cm);
  glowPool.material.opacity = 0.12 + 0.05 * cm + 0.25 * flashV;
  glowPool.material.color.copy(CYAN).lerp(flashCol, Math.min(1, flashV));

  controls.update();
  composer.render();
}
animate();
</script>
