<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluffy Baby Sea Otter Holding a Scallop Shell</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #102632;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. RENDERER, SCENE, CAMERA & CONTROLS
    // =========================================================================
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      60
    );
    camera.position.set(1.75, 1.82, 2.38);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.target.set(0.0, 0.14, -0.02);
    controls.minDistance = 1.35;
    controls.maxDistance = 7.2;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.minPolarAngle = 0.12;
    controls.update();

    // =========================================================================
    // 2. PROCEDURAL STUDIO + COASTAL ENVIRONMENT & THREE-POINT LIGHTING
    // =========================================================================
    function createStudioEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      const envScene = new THREE.Scene();

      // Coastal studio gradient dome
      const domeGeo = new THREE.SphereGeometry(20, 48, 32);
      const domeMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {},
        vertexShader: `
          varying vec3 vWorldDir;
          void main() {
            vWorldDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vWorldDir;
          void main() {
            float y = vWorldDir.y;
            vec3 zenith = vec3(0.42, 0.68, 0.84);
            vec3 horizon = vec3(0.76, 0.91, 0.92);
            vec3 waterBounce = vec3(0.08, 0.52, 0.50);
            vec3 col = y >= 0.0
              ? mix(horizon, zenith, pow(y, 0.65))
              : mix(horizon * 0.75, waterBounce, pow(-y, 0.55));
            float sunGlow = pow(max(dot(vWorldDir, normalize(vec3(0.55, 0.68, 0.48))), 0.0), 16.0);
            col += vec3(1.4, 1.22, 0.95) * sunGlow;
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      envScene.add(new THREE.Mesh(domeGeo, domeMat));

      // HDR-bright studio softbox reflectors for realistic eye catchlights & shell/water speculars
      const softboxGeo = new THREE.PlaneGeometry(6, 4);
      const keyCard = new THREE.Mesh(
        softboxGeo,
        new THREE.MeshBasicMaterial({ color: new THREE.Color(3.6, 3.3, 2.85), side: THREE.DoubleSide })
      );
      keyCard.position.set(5.5, 6.5, 5.0);
      keyCard.lookAt(0, 0, 0);
      envScene.add(keyCard);

      const fillCard = new THREE.Mesh(
        softboxGeo,
        new THREE.MeshBasicMaterial({ color: new THREE.Color(1.25, 1.85, 2.35), side: THREE.DoubleSide })
      );
      fillCard.position.set(-6.5, 4.2, 3.2);
      fillCard.lookAt(0, 0, 0);
      envScene.add(fillCard);

      const rimCard = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 3),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(2.9, 2.25, 1.55), side: THREE.DoubleSide })
      );
      rimCard.position.set(-2.5, 4.5, -6.5);
      rimCard.lookAt(0, 0, 0);
      envScene.add(rimCard);

      const envRT = pmrem.fromScene(envScene, 0.035);
      pmrem.dispose();
      domeGeo.dispose();
      domeMat.dispose();
      softboxGeo.dispose();
      return envRT.texture;
    }

    scene.environment = createStudioEnvironment();

    // Seamless studio radial-gradient backdrop sphere
    const bgDome = new THREE.Mesh(
      new THREE.SphereGeometry(32, 48, 32),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: `
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vDir;
          void main() {
            float up = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
            vec3 bottomCol = vec3(0.055, 0.135, 0.180);
            vec3 midCol    = vec3(0.115, 0.255, 0.315);
            vec3 topCol    = vec3(0.175, 0.345, 0.415);
            vec3 c = mix(bottomCol, midCol, smoothstep(0.15, 0.55, up));
            c = mix(c, topCol, smoothstep(0.55, 0.98, up));
            float sunHaze = pow(max(dot(vDir, normalize(vec3(0.4, 0.5, -0.6))), 0.0), 5.0);
            c += vec3(0.06, 0.09, 0.09) * sunHaze;
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );
    scene.add(bgDome);

    // Studio Three-Point Lighting + Aquamarine Water Bounce
    const hemiLight = new THREE.HemisphereLight(0xdff4ff, 0x1e8f88, 0.85);
    scene.add(hemiLight);

    // 1. Key Light (warm sunlit key with high-res soft shadows)
    const keyLight = new THREE.DirectionalLight(0xfff4e2, 2.55);
    keyLight.position.set(3.6, 5.8, 3.4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1.0;
    keyLight.shadow.camera.far = 14.0;
    keyLight.shadow.camera.left = -2.8;
    keyLight.shadow.camera.right = 2.8;
    keyLight.shadow.camera.top = 2.8;
    keyLight.shadow.camera.bottom = -2.8;
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.018;
    keyLight.shadow.radius = 4.2;
    scene.add(keyLight);

    // 2. Fill Light (cool coastal sky fill)
    const fillLight = new THREE.DirectionalLight(0xb2e2ff, 1.05);
    fillLight.position.set(-4.4, 3.2, 2.2);
    scene.add(fillLight);

    // 3. Rim Light (golden-hour hair halo backlight)
    const rimLight = new THREE.DirectionalLight(0xffe0b5, 2.05);
    rimLight.position.set(-2.2, 3.4, -4.4);
    scene.add(rimLight);

    // Subtle upward turquoise bounce from the translucent lagoon patch
    const waterBounceLight = new THREE.PointLight(0x3cf2de, 0.95, 4.5, 1.6);
    waterBounceLight.position.set(0.0, -0.28, 0.1);
    scene.add(waterBounceLight);

    // =========================================================================
    // 3. DETERMINISTIC NOISE & GEOMETRY HELPERS
    // =========================================================================
    function hash3(x, y, z) {
      const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return h - Math.floor(h);
    }

    function valueNoise3(x, y, z) {
      const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      const fx = x - ix, fy = y - iy, fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const uz = fz * fz * (3 - 2 * fz);
      const lerp = (a, b, t) => a + (b - a) * t;
      const c00 = lerp(hash3(ix, iy, iz), hash3(ix + 1, iy, iz), ux);
      const c10 = lerp(hash3(ix, iy + 1, iz), hash3(ix + 1, iy + 1, iz), ux);
      const c01 = lerp(hash3(ix, iy, iz + 1), hash3(ix + 1, iy, iz + 1), ux);
      const c11 = lerp(hash3(ix, iy + 1, iz + 1), hash3(ix + 1, iy + 1, iz + 1), ux);
      return lerp(lerp(c00, c10, uy), lerp(c01, c11, uy), uz);
    }

    function fbm3(x, y, z) {
      return 0.65 * valueNoise3(x, y, z) + 0.35 * valueNoise3(x * 2.13, y * 2.13, z * 2.13);
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    // Guarantee consistent outward triangle winding relative to an interior reference point
    function ensureOutwardNormals(geometry, interiorPointFn) {
      const pos = geometry.attributes.position;
      const idx = geometry.index;
      const pA = new THREE.Vector3(), pB = new THREE.Vector3(), pC = new THREE.Vector3();
      const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();
      const center = new THREE.Vector3(), ref = new THREE.Vector3();

      if (idx) {
        const arr = idx.array;
        for (let i = 0; i < arr.length; i += 3) {
          pA.fromBufferAttribute(pos, arr[i]);
          pB.fromBufferAttribute(pos, arr[i + 1]);
          pC.fromBufferAttribute(pos, arr[i + 2]);
          e1.subVectors(pB, pA);
          e2.subVectors(pC, pA);
          n.crossVectors(e1, e2);
          center.copy(pA).add(pB).add(pC).multiplyScalar(1 / 3);
          ref.copy(interiorPointFn(center));
          if (n.dot(center.sub(ref)) < 0) {
            const tmp = arr[i + 1];
            arr[i + 1] = arr[i + 2];
            arr[i + 2] = tmp;
          }
        }
        idx.needsUpdate = true;
      }
      geometry.computeVertexNormals();
      return geometry;
    }

    // =========================================================================
    // 4. TRANSLUCENT AQUAMARINE WATER PATCH, CAUSTIC SEABED & RIPPLES
    // =========================================================================
    const waterGroup = new THREE.Group();
    scene.add(waterGroup);

    const WATER_RINGS = 54;
    const WATER_SEGS = 96;
    const WATER_RX = 2.55;
    const WATER_RZ = 2.18;

    // Interactive surface ripples spawned by clicks, hover strokes, and flipper kicks
    const activeRipples = [];
    function spawnWaterRipple(x, z, amp = 0.032) {
      if (activeRipples.length >= 12) activeRipples.shift();
      activeRipples.push({ x, z, t0: performance.now() * 0.001, amp });
    }

    function lagoonContour(angle) {
      return 1.0
        + 0.045 * Math.cos(angle * 2.0 + 0.4)
        + 0.032 * Math.sin(angle * 3.0 - 0.7)
        + 0.018 * Math.cos(angle * 5.0 + 1.1);
    }

    function getWaterHeight(x, z, time) {
      const nx = x / WATER_RX;
      const nz = z / WATER_RZ;
      const rNorm = Math.sqrt(nx * nx + nz * nz);
      const edgeFade = 1.0 - smoothstep(0.72, 1.0, rNorm);

      // Gentle multi-directional swell
      let h = (
        Math.sin(x * 2.1 + time * 1.45) * 0.018 +
        Math.cos(z * 2.4 - time * 1.22) * 0.016 +
        Math.sin((x * 1.6 - z * 1.8) + time * 2.05) * 0.009 +
        Math.cos((x * 3.8 + z * 3.2) - time * 2.6) * 0.004
      );

      // Subtle wake ring radiating from the floating otter
      const otterDist = Math.sqrt((x * 1.18) ** 2 + ((z - 0.06) * 0.75) ** 2);
      const otterWake = Math.sin(otterDist * 13.0 - time * 3.1) * Math.exp(-otterDist * 1.65) * 0.008;
      h += otterWake;

      // Interactive mouse & flipper ripples
      for (let i = 0; i < activeRipples.length; i++) {
        const rp = activeRipples[i];
        const age = time - rp.t0;
        if (age >= 0 && age < 3.6) {
          const d = Math.hypot(x - rp.x, z - rp.z);
          const waveFront = age * 1.35;
          const env = Math.exp(-Math.pow((d - waveFront) * 3.6, 2.0)) * Math.exp(-age * 1.15);
          h += Math.sin((d - waveFront) * 18.0) * rp.amp * env;
        }
      }

      return h * edgeFade;
    }

    // Build shallow sunlit lagoon seabed cushion (catches shadows, caustics & buoyancy contact shadow)
    const otterShadowPosUniform = { value: new THREE.Vector2(0, 0.04) };
    const waterTimeUniform = { value: 0 };

    function createSeabedAndWaterGeometries() {
      // Seabed dish
      const bedPositions = [];
      const bedIndices = [];
      bedPositions.push(0, -0.50, 0); // center vertex 0

      for (let ir = 1; ir <= WATER_RINGS; ir++) {
        const rf = ir / WATER_RINGS;
        // Smooth shallow lagoon basin rising gently to meet the water lens edge
        const dishY = -0.50 * Math.pow(Math.max(0, 1.0 - Math.pow(rf, 2.3)), 0.72) - 0.012;
        for (let ia = 0; ia < WATER_SEGS; ia++) {
          const ang = (ia / WATER_SEGS) * Math.PI * 2;
          const c = lagoonContour(ang);
          const x = Math.cos(ang) * WATER_RX * rf * c;
          const z = Math.sin(ang) * WATER_RZ * rf * c;
          const sandRipple = (1.0 - rf) * 0.014 * Math.sin(x * 7.5 + Math.cos(z * 5.0));
          bedPositions.push(x, dishY + sandRipple, z);
        }
      }

      for (let ia = 0; ia < WATER_SEGS; ia++) {
        const next = (ia + 1) % WATER_SEGS;
        bedIndices.push(0, 1 + next, 1 + ia);
      }
      for (let ir = 1; ir < WATER_RINGS; ir++) {
        const r0 = 1 + (ir - 1) * WATER_SEGS;
        const r1 = 1 + ir * WATER_SEGS;
        for (let ia = 0; ia < WATER_SEGS; ia++) {
          const next = (ia + 1) % WATER_SEGS;
          bedIndices.push(r0 + ia, r0 + next, r1 + next);
          bedIndices.push(r0 + ia, r1 + next, r1 + ia);
        }
      }

      const bedGeo = new THREE.BufferGeometry();
      bedGeo.setAttribute('position', new THREE.Float32BufferAttribute(bedPositions, 3));
      bedGeo.setIndex(bedIndices);
      ensureOutwardNormals(bedGeo, (p) => new THREE.Vector3(p.x * 0.5, -1.8, p.z * 0.5));

      // Water top surface (matching perimeter so water + seabed form a jewel-like translucent water patch)
      const wPositions = new Float32Array((1 + WATER_RINGS * WATER_SEGS) * 3);
      const wBaseXZ = new Float32Array((1 + WATER_RINGS * WATER_SEGS) * 3); // x, z, rFrac
      wPositions[0] = 0; wPositions[1] = 0; wPositions[2] = 0;
      wBaseXZ[0] = 0; wBaseXZ[1] = 0; wBaseXZ[2] = 0;

      let ptr = 3;
      for (let ir = 1; ir <= WATER_RINGS; ir++) {
        const rf = ir / WATER_RINGS;
        for (let ia = 0; ia < WATER_SEGS; ia++) {
          const ang = (ia / WATER_SEGS) * Math.PI * 2;
          const c = lagoonContour(ang);
          const x = Math.cos(ang) * WATER_RX * rf * c;
          const z = Math.sin(ang) * WATER_RZ * rf * c;
          const edgeTuck = rf > 0.92 ? -0.012 * smoothstep(0.92, 1.0, rf) : 0.0;
          wPositions[ptr] = x;
          wPositions[ptr + 1] = edgeTuck;
          wPositions[ptr + 2] = z;
          wBaseXZ[ptr] = x;
          wBaseXZ[ptr + 1] = z;
          wBaseXZ[ptr + 2] = rf;
          ptr += 3;
        }
      }

      const wIndices = [];
      for (let ia = 0; ia < WATER_SEGS; ia++) {
        const next = (ia + 1) % WATER_SEGS;
        wIndices.push(0, 1 + next, 1 + ia);
      }
      for (let ir = 1; ir < WATER_RINGS; ir++) {
        const r0 = 1 + (ir - 1) * WATER_SEGS;
        const r1 = 1 + ir * WATER_SEGS;
        for (let ia = 0; ia < WATER_SEGS; ia++) {
          const next = (ia + 1) % WATER_SEGS;
          wIndices.push(r0 + ia, r0 + next, r1 + next);
          wIndices.push(r0 + ia, r1 + next, r1 + ia);
        }
      }

      const waterGeo = new THREE.BufferGeometry();
      const posAttr = new THREE.BufferAttribute(wPositions, 3);
      posAttr.setUsage(THREE.DynamicDrawUsage);
      waterGeo.setAttribute('position', posAttr);
      waterGeo.setIndex(wIndices);
      ensureOutwardNormals(waterGeo, (p) => new THREE.Vector3(p.x, -1.5, p.z));

      return { bedGeo, waterGeo, wBaseXZ };
    }

    const { bedGeo, waterGeo, wBaseXZ } = createSeabedAndWaterGeometries();

    const seabedMat = new THREE.MeshStandardMaterial({
      color: 0xd9d2c0,
      roughness: 0.88,
      metalness: 0.0
    });
    seabedMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = waterTimeUniform;
      shader.uniforms.uOtterXZ = otterShadowPosUniform;
      shader.vertexShader = shader.vertexShader
        .replace(
          '#include <common>',
          `#include <common>
           varying vec3 vBedPos;`
        )
        .replace(
          '#include <begin_vertex>',
          `#include <begin_vertex>
           vBedPos = position;`
        );
      shader.fragmentShader = shader.fragmentShader
        .replace(
          '#include <common>',
          `#include <common>
           uniform float uTime;
           uniform vec2 uOtterXZ;
           varying vec3 vBedPos;

           float causticCell(vec2 p) {
             vec2 i = floor(p);
             vec2 f = fract(p);
             float minDist = 1.0;
             for (int y = -1; y <= 1; y++) {
               for (int x = -1; x <= 1; x++) {
                 vec2 n = vec2(float(x), float(y));
                 vec2 rnd = fract(sin(vec2(dot(i + n, vec2(127.1, 311.7)), dot(i + n, vec2(269.5, 183.3)))) * 43758.5453);
                 rnd = 0.5 + 0.42 * sin(uTime * 1.15 + 6.2831 * rnd);
                 float d = length(n + rnd - f);
                 minDist = min(minDist, d);
               }
             }
             return pow(clamp(minDist * 1.28, 0.0, 1.0), 2.8);
           }`
        )
        .replace(
          '#include <color_fragment>',
          `#include <color_fragment>
           vec2 uvC = vBedPos.xz * 2.35;
           float c1 = causticCell(uvC + vec2(uTime * 0.12, -uTime * 0.09));
           float c2 = causticCell(uvC * 1.35 - vec2(uTime * 0.08, uTime * 0.11));
           float caustics = pow(c1 * 0.6 + c2 * 0.55, 1.5);

           float radial = length(vec2(vBedPos.x / 2.55, vBedPos.z / 2.18));
           vec3 sandCenter = vec3(0.76, 0.87, 0.83);
           vec3 tealEdge   = vec3(0.08, 0.42, 0.46);
           vec3 baseSand   = mix(sandCenter, tealEdge, smoothstep(0.28, 1.0, radial));

           // Soft contact & buoyancy shadow directly beneath the floating baby otter
           vec2 dOtter = (vBedPos.xz - uOtterXZ) * vec2(1.45, 0.92);
           float contactAO = 1.0 - 0.52 * exp(-dot(dOtter, dOtter) * 2.6);

           diffuseColor.rgb = baseSand * contactAO + vec3(0.28, 0.82, 0.78) * caustics * (1.0 - radial * 0.65) * contactAO;`
        );
    };

    const seabedMesh = new THREE.Mesh(bedGeo, seabedMat);
    seabedMesh.receiveShadow = true;
    waterGroup.add(seabedMesh);

    // Subtle smooth coastal pebbles on the sandy lagoon floor
    const pebbleMat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.02, vertexColors: true });
    const pebbleDefs = [
      { x: -1.45, z: 0.85, r: 0.11, sy: 0.48, c: '#5b7a7c' },
      { x: -1.25, z: 1.02, r: 0.07, sy: 0.52, c: '#8aa39b' },
      { x: 1.52, z: -0.78, r: 0.12, sy: 0.45, c: '#667f82' },
      { x: 1.36, z: -0.95, r: 0.065, sy: 0.55, c: '#a8a293' },
      { x: -1.32, z: -1.05, r: 0.09, sy: 0.46, c: '#4d6c70' },
      { x: 1.18, z: 1.16, r: 0.085, sy: 0.50, c: '#7a948e' }
    ];
    for (const pb of pebbleDefs) {
      const g = new THREE.SphereGeometry(pb.r, 18, 14);
      g.scale(1.15, pb.sy, 0.92);
      const colors = new Float32Array(g.attributes.position.count * 3);
      const col = new THREE.Color(pb.c);
      for (let i = 0; i < g.attributes.position.count; i++) {
        colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
      }
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const rf = Math.hypot(pb.x / WATER_RX, pb.z / WATER_RZ);
      const dishY = -0.50 * Math.pow(Math.max(0, 1.0 - Math.pow(rf, 2.3)), 0.72) - 0.005;
      const m = new THREE.Mesh(g, pebbleMat);
      m.position.set(pb.x, dishY, pb.z);
      m.rotation.y = pb.x * 2.1;
      m.receiveShadow = true;
      waterGroup.add(m);
    }

    // Translucent Aquamarine Water Surface
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color('#98fbf0'),
      transmission: 0.89,
      thickness: 0.85,
      ior: 1.333,
      roughness: 0.045,
      metalness: 0.0,
      attenuationColor: new THREE.Color('#0c9c96'),
      attenuationDistance: 0.92,
      clearcoat: 1.0,
      clearcoatRoughness: 0.035,
      envMapIntensity: 1.35
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterGroup.add(waterMesh);

    function updateWaterSurface(time) {
      const posAttr = waterGeo.attributes.position;
      const arr = posAttr.array;
      arr[1] = getWaterHeight(0, 0, time);
      const count = posAttr.count;
      for (let i = 1; i < count; i++) {
        const idx = i * 3;
        const x = wBaseXZ[idx];
        const z = wBaseXZ[idx + 1];
        const rf = wBaseXZ[idx + 2];
        const edgeTuck = rf > 0.92 ? -0.012 * smoothstep(0.92, 1.0, rf) : 0.0;
        arr[idx + 1] = getWaterHeight(x, z, time) + edgeTuck;
      }
      posAttr.needsUpdate = true;
      waterGeo.computeVertexNormals();
    }

    // Soft pearly-aqua meniscus foam ring cradling the floating otter
    const foamRingGeo = new THREE.RingGeometry(0.42, 0.62, 64, 2);
    foamRingGeo.rotateX(-Math.PI / 2);
    foamRingGeo.scale(1.0, 1.0, 1.82);
    const foamRingMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: { uTime: waterTimeUniform },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          float ang = atan(vPos.z, vPos.x);
          float rFrac = vUv.y;
          float wave = 0.5 + 0.5 * sin(ang * 9.0 + uTime * 2.4) * cos(ang * 5.0 - uTime * 1.7);
          float band = sin(rFrac * 3.14159);
          float alpha = pow(band, 1.8) * (0.14 + 0.14 * wave);
          gl_FragColor = vec4(0.84, 0.99, 0.98, alpha);
        }
      `
    });
    const foamRingMesh = new THREE.Mesh(foamRingGeo, foamRingMat);
    foamRingMesh.position.set(0, 0.008, 0.04);
    foamRingMesh.raycast = () => {};
    waterGroup.add(foamRingMesh);

    // =========================================================================
    // 5. BABY SEA OTTER HIERARCHY & ANATOMICAL SCULPTING
    // =========================================================================
    const otterRoot = new THREE.Group();
    otterRoot.position.set(0, 0.02, 0);
    scene.add(otterRoot);

    const torsoGroup = new THREE.Group();
    otterRoot.add(torsoGroup);

    const breathUniform = { value: 0.0 };

    // Shared plush skin material (with vertex colors matching exact fur root tones)
    function createSkinMaterial(isTorso = false) {
      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.0
      });
      if (isTorso) {
        mat.onBeforeCompile = (shader) => {
          shader.uniforms.uBreath = breathUniform;
          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <common>',
              `#include <common>
               uniform float uBreath;`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
               float chestMask = smoothstep(-0.02, 0.24, position.y)
                               * exp(-pow((position.z + 0.06) / 0.36, 2.0))
                               * exp(-pow(position.x / 0.38, 2.0));
               transformed += vec3(position.x * 0.05, 1.0, 0.0) * (uBreath * 0.026 * chestMask);`
            );
        };
      }
      return mat;
    }

    // Color palette helpers
    const colDarkChocRoot = new THREE.Color('#2a160c');
    const colMidChocRoot  = new THREE.Color('#472919');
    const colTanChestRoot = new THREE.Color('#b6926c');
    const colHeadCreamRoot = new THREE.Color('#cbb08f');
    const colMuzzleIvoryRoot = new THREE.Color('#dfd0bc');

    // ---- 5A. Torso Geometry (Plump floating baby sea otter body) ----
    function evalTorsoSpine(v) {
      // v in [0, 1]: 0 = neck crown (z = -0.66), 1 = rump/tail base (z = +0.76)
      const z = -0.66 + v * 1.42;
      const neckLift = Math.exp(-Math.pow(v / 0.24, 2.0)) * 0.15;
      const tailDip = -smoothstep(0.75, 1.0, v) * 0.06;
      const y = 0.01 + neckLift + tailDip;

      // Smooth end-caps so torso is a seamless watertight plush body
      const capStart = smoothstep(0.0, 0.09, v);
      const capEnd = smoothstep(0.0, 0.10, 1.0 - v);
      const cap = Math.sqrt(Math.max(0.0004, capStart * capEnd));

      const bellyPlump = Math.sin(Math.PI * Math.pow(v, 0.88));
      const rx = (0.17 + 0.265 * bellyPlump) * cap;
      const ryTop = (0.14 + 0.165 * bellyPlump) * cap;
      const ryBot = (0.14 + 0.145 * bellyPlump) * cap;
      return { z, y, rx, ryTop, ryBot };
    }

    function getTorsoColor(x, y, z, forFur = false) {
      const c = new THREE.Color();
      // Creamy-tan bib on throat & upper chest blending smoothly into warm milk-chocolate belly & rich espresso back
      const bibMask = smoothstep(-0.02, 0.25, y)
                    * smoothstep(0.16, -0.34, z)
                    * Math.exp(-Math.pow(x / 0.30, 2.0));
      const bellyMask = smoothstep(-0.04, 0.22, y)
                      * Math.exp(-Math.pow((z - 0.02) / 0.52, 2.0))
                      * Math.exp(-Math.pow(x / 0.36, 2.0));
      const n = fbm3(x * 6.5, y * 6.5, z * 6.5);

      if (forFur) {
        const darkCoat = new THREE.Color('#3c2214').lerp(new THREE.Color('#53311e'), n * 0.75);
        const bellyCoat = new THREE.Color('#6f472f').lerp(new THREE.Color('#8e6346'), n * 0.6);
        const chestCream = new THREE.Color('#dcc2a0').lerp(new THREE.Color('#eee0c9'), n * 0.65);
        c.copy(darkCoat).lerp(bellyCoat, bellyMask * 0.78).lerp(chestCream, bibMask * 0.92);
      } else {
        c.copy(colDarkChocRoot)
         .lerp(colMidChocRoot, bellyMask * 0.75)
         .lerp(colTanChestRoot, bibMask * 0.85);
      }
      return c;
    }

    function createTorsoGeometry() {
      const nV = 64, nU = 56;
      const positions = [];
      const colors = [];
      const indices = [];

      // Pole at v = 0
      const s0 = evalTorsoSpine(0);
      positions.push(0, s0.y, s0.z - 0.02);
      const c0 = getTorsoColor(0, s0.y, s0.z, false);
      colors.push(c0.r, c0.g, c0.b);

      for (let iv = 1; iv < nV; iv++) {
        const v = iv / nV;
        const sp = evalTorsoSpine(v);
        for (let iu = 0; iu < nU; iu++) {
          const u = (iu / nU) * Math.PI * 2;
          const sinU = Math.sin(u);
          const cosU = Math.cos(u);
          const ry = cosU >= 0 ? sp.ryTop : sp.ryBot;
          const x = sp.rx * sinU;
          let y = sp.y + ry * cosU;

          // Subtle cozy cradle on upper belly where the scallop shell rests
          if (cosU > 0.4) {
            const shellCradle = Math.exp(-Math.pow((sp.z + 0.05) / 0.19, 2.0)) * Math.exp(-Math.pow(x / 0.18, 2.0));
            y -= 0.015 * shellCradle * cosU;
          }

          positions.push(x, y, sp.z);
          const vc = getTorsoColor(x, y, sp.z, false);
          colors.push(vc.r, vc.g, vc.b);
        }
      }

      // Pole at v = 1
      const s1 = evalTorsoSpine(1);
      const endPoleIdx = 1 + (nV - 1) * nU;
      positions.push(0, s1.y, s1.z + 0.02);
      const c1 = getTorsoColor(0, s1.y, s1.z, false);
      colors.push(c1.r, c1.g, c1.b);

      for (let iu = 0; iu < nU; iu++) {
        const next = (iu + 1) % nU;
        indices.push(0, 1 + iu, 1 + next);
      }
      for (let iv = 0; iv < nV - 2; iv++) {
        const r0 = 1 + iv * nU;
        const r1 = 1 + (iv + 1) * nU;
        for (let iu = 0; iu < nU; iu++) {
          const next = (iu + 1) % nU;
          indices.push(r0 + iu, r1 + iu, r1 + next);
          indices.push(r0 + iu, r1 + next, r0 + next);
        }
      }
      const lastRing = 1 + (nV - 2) * nU;
      for (let iu = 0; iu < nU; iu++) {
        const next = (iu + 1) % nU;
        indices.push(lastRing + iu, endPoleIdx, lastRing + next);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      return ensureOutwardNormals(geo, (p) => {
        const vApprox = Math.max(0.05, Math.min(0.95, (p.z + 0.66) / 1.42));
        const sp = evalTorsoSpine(vApprox);
        return new THREE.Vector3(0, sp.y, sp.z);
      });
    }

    const torsoGeo = createTorsoGeometry();
    const torsoSkinMat = createSkinMaterial(true);
    const torsoMesh = new THREE.Mesh(torsoGeo, torsoSkinMat);
    torsoMesh.castShadow = true;
    torsoMesh.receiveShadow = true;
    torsoGroup.add(torsoMesh);

    // ---- 5B. Expressive Baby Otter Head (Cheeks, Peanut Muzzle, Diamond Nose, Dual-Catchlight Eyes, Ears, Whiskers) ----
    const headGroup = new THREE.Group();
    const HEAD_BASE_POS = new THREE.Vector3(0, 0.255, -0.60);
    const HEAD_BASE_ROT_X = -0.80; // Tucks chin gently forward so face looks toward belly & camera
    const HEAD_BASE_ROT_Y = 0.11;  // Warm eye-contact angle toward initial three-quarter camera
    headGroup.position.copy(HEAD_BASE_POS);
    headGroup.rotation.set(HEAD_BASE_ROT_X, HEAD_BASE_ROT_Y, 0);
    otterRoot.add(headGroup);

    // Single-source-of-truth analytical head surface function so eyes, nose, whiskers & fur align to sub-millimeter precision
    const _tmpDir = new THREE.Vector3();
    function evalHeadSurface(dx, dy, dz, out = new THREE.Vector3()) {
      const len = Math.hypot(dx, dy, dz) || 1;
      dx /= len; dy /= len; dz /= len;

      // Broad round baby cranium
      let x = dx * 0.325;
      let y = dy * 0.288;
      let z = dz * 0.285;

      // Plump chubby baby otter cheeks
      const cheekL = Math.exp(-((dx + 0.68) ** 2 + (dy + 0.20) ** 2 + (dz - 0.68) ** 2) / 0.24);
      const cheekR = Math.exp(-((dx - 0.68) ** 2 + (dy + 0.20) ** 2 + (dz - 0.68) ** 2) / 0.24);
      const cheek = cheekL + cheekR;
      x += dx * 0.056 * cheek;
      y -= 0.014 * cheek;
      z += 0.032 * cheek;

      // Iconic sea otter "peanut" whisker pads (mystacial pads)
      const padL = Math.exp(-((dx + 0.26) ** 2 + (dy + 0.21) ** 2 + (dz - 0.94) ** 2) / 0.078);
      const padR = Math.exp(-((dx - 0.26) ** 2 + (dy + 0.21) ** 2 + (dz - 0.94) ** 2) / 0.078);
      x += Math.sign(dx || 1) * 0.014 * (padL + padR);
      y -= 0.008 * (padL + padR);
      z += 0.074 * (padL + padR);

      // Central philtrum groove between whisker pads
      if (dz > 0.75) {
        const philtrum = Math.exp(-(dx * dx) / 0.012) * Math.exp(-((dy + 0.22) ** 2) / 0.025) * smoothstep(0.75, 0.95, dz);
        z -= 0.018 * philtrum;
      }

      // Soft tucked lower chin
      const chin = Math.exp(-(dx * dx) / 0.09) * Math.exp(-((dy + 0.50) ** 2 + (dz - 0.85) ** 2) / 0.085);
      y -= 0.012 * chin;
      z += 0.032 * chin;

      // Gentle eye-socket cradles so glossy eyes nestle naturally into fluff
      const sockL = Math.exp(-((dx + 0.41) ** 2 + (dy - 0.28) ** 2 + (dz - 0.87) ** 2) / 0.042);
      const sockR = Math.exp(-((dx - 0.41) ** 2 + (dy - 0.28) ** 2 + (dz - 0.87) ** 2) / 0.042);
      z -= 0.020 * (sockL + sockR);

      // Soft neck blend at bottom-back
      const neckFlare = smoothstep(-0.35, -0.95, dy) * smoothstep(0.35, -0.65, dz);
      x *= (1.0 - 0.10 * neckFlare);
      z -= 0.025 * neckFlare;

      return out.set(x, y, z);
    }

    function getHeadColor(x, y, z, forFur = false) {
      const c = new THREE.Color();
      const n = fbm3(x * 8.5 + 3.1, y * 8.5, z * 8.5);
      const muzzleGlow = Math.exp(-((x / 0.16) ** 2 + ((y + 0.06) / 0.10) ** 2 + ((z - 0.33) / 0.12) ** 2));
      const cheekFluff = smoothstep(-0.08, 0.28, z) * smoothstep(-0.22, 0.22, y);
      const backNeckDark = smoothstep(0.05, -0.26, z) * smoothstep(0.16, -0.26, y);

      // Subtle warm cocoa contour around eye sockets for expressive depth
      const dEyeL = Math.hypot(x + 0.132, y - 0.084, z - 0.248);
      const dEyeR = Math.hypot(x - 0.132, y - 0.084, z - 0.248);
      const eyeRing = Math.exp(-Math.pow(Math.min(dEyeL, dEyeR) / 0.058, 2.0));

      if (forFur) {
        const crownTan = new THREE.Color('#dbc09d').lerp(new THREE.Color('#ebd5b7'), n * 0.75);
        const cheekCream = new THREE.Color('#efe0c8').lerp(new THREE.Color('#fbf2e3'), n * 0.65);
        const ivoryMuzzle = new THREE.Color('#faf1e2');
        const napeChoc = new THREE.Color('#6b462e');
        c.copy(crownTan)
         .lerp(cheekCream, cheekFluff * 0.78)
         .lerp(ivoryMuzzle, muzzleGlow * 0.88)
         .lerp(napeChoc, backNeckDark * 0.82)
         .lerp(new THREE.Color('#7a553c'), eyeRing * 0.55);
      } else {
        c.copy(colHeadCreamRoot)
         .lerp(colMuzzleIvoryRoot, muzzleGlow * 0.75)
         .lerp(colMidChocRoot, backNeckDark * 0.85)
         .lerp(new THREE.Color('#4a3020'), eyeRing * 0.7);
      }
      return c;
    }

    function createHeadGeometry() {
      const nLat = 56, nLon = 72;
      const positions = [];
      const colors = [];
      const indices = [];
      const p = new THREE.Vector3();

      // Top pole
      evalHeadSurface(0, 1, 0, p);
      positions.push(p.x, p.y, p.z);
      const ct = getHeadColor(p.x, p.y, p.z, false);
      colors.push(ct.r, ct.g, ct.b);

      for (let il = 1; il < nLat; il++) {
        const phi = (il / nLat) * Math.PI;
        const sinP = Math.sin(phi);
        const cosP = Math.cos(phi);
        for (let io = 0; io < nLon; io++) {
          const theta = (io / nLon) * Math.PI * 2;
          const dx = sinP * Math.sin(theta);
          const dy = cosP;
          const dz = sinP * Math.cos(theta);
          evalHeadSurface(dx, dy, dz, p);
          positions.push(p.x, p.y, p.z);
          const vc = getHeadColor(p.x, p.y, p.z, false);
          colors.push(vc.r, vc.g, vc.b);
        }
      }

      // Bottom pole
      const botIdx = 1 + (nLat - 1) * nLon;
      evalHeadSurface(0, -1, 0, p);
      positions.push(p.x, p.y, p.z);
      const cb = getHeadColor(p.x, p.y, p.z, false);
      colors.push(cb.r, cb.g, cb.b);

      for (let io = 0; io < nLon; io++) {
        const next = (io + 1) % nLon;
        indices.push(0, 1 + io, 1 + next);
      }
      for (let il = 0; il < nLat - 2; il++) {
        const r0 = 1 + il * nLon;
        const r1 = 1 + (il + 1) * nLon;
        for (let io = 0; io < nLon; io++) {
          const next = (io + 1) % nLon;
          indices.push(r0 + io, r1 + io, r1 + next);
          indices.push(r0 + io, r1 + next, r0 + next);
        }
      }
      const lastR = 1 + (nLat - 2) * nLon;
      for (let io = 0; io < nLon; io++) {
        const next = (io + 1) % nLon;
        indices.push(lastR + io, botIdx, lastR + next);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      return ensureOutwardNormals(geo, () => new THREE.Vector3(0, 0, 0));
    }

    const headGeo = createHeadGeometry();
    const headSkinMat = createSkinMaterial(false);
    const headMesh = new THREE.Mesh(headGeo, headSkinMat);
    headMesh.castShadow = true;
    headMesh.receiveShadow = true;
    headGroup.add(headMesh);

    // ---- Cute Rounded Sea Otter Ears ----
    function createEarGeometry() {
      const nLat = 22, nLon = 28;
      const positions = [];
      const colors = [];
      const indices = [];

      const getEarPt = (phi, theta) => {
        const sp = Math.sin(phi), cp = Math.cos(phi);
        const st = Math.sin(theta), ct = Math.cos(theta);
        let x = sp * st * 0.052;
        let y = cp * 0.064;
        let z = sp * ct * 0.032;
        // Cup hollow on front (+z) face of the rounded pinna
        if (ct > 0) {
          const hollow = Math.pow(ct, 1.4) * Math.pow(sp, 1.2);
          z -= hollow * 0.026;
        }
        return { x, y, z, inner: ct > 0.35 ? (ct - 0.35) / 0.65 * sp : 0 };
      };

      const p0 = getEarPt(0, 0);
      positions.push(p0.x, p0.y, p0.z);
      colors.push(0.45, 0.30, 0.21);

      for (let il = 1; il < nLat; il++) {
        const phi = (il / nLat) * Math.PI;
        for (let io = 0; io < nLon; io++) {
          const theta = (io / nLon) * Math.PI * 2;
          const pt = getEarPt(phi, theta);
          positions.push(pt.x, pt.y, pt.z);
          const outerC = new THREE.Color('#7a573d');
          const innerC = new THREE.Color('#a86e68');
          outerC.lerp(innerC, pt.inner * 0.78);
          colors.push(outerC.r, outerC.g, outerC.b);
        }
      }

      const botIdx = 1 + (nLat - 1) * nLon;
      const pb = getEarPt(Math.PI, 0);
      positions.push(pb.x, pb.y, pb.z);
      colors.push(0.45, 0.30, 0.21);

      for (let io = 0; io < nLon; io++) {
        const next = (io + 1) % nLon;
        indices.push(0, 1 + io, 1 + next);
      }
      for (let il = 0; il < nLat - 2; il++) {
        const r0 = 1 + il * nLon;
        const r1 = 1 + (il + 1) * nLon;
        for (let io = 0; io < nLon; io++) {
          const next = (io + 1) % nLon;
          indices.push(r0 + io, r1 + io, r1 + next);
          indices.push(r0 + io, r1 + next, r0 + next);
        }
      }
      const lastR = 1 + (nLat - 2) * nLon;
      for (let io = 0; io < nLon; io++) {
        const next = (io + 1) % nLon;
        indices.push(lastR + io, botIdx, lastR + next);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      return ensureOutwardNormals(geo, () => new THREE.Vector3(0, 0, -0.008));
    }

    const earGeo = createEarGeometry();
    const earMeshes = [];
    for (const side of [-1, 1]) {
      const earPos = evalHeadSurface(side * 0.96, 0.06, -0.04);
      const ear = new THREE.Mesh(earGeo, headSkinMat);
      ear.position.copy(earPos).addScaledVector(new THREE.Vector3(side, 0.05, 0), 0.012);
      ear.rotation.set(0.18, side * 0.52, -side * 0.38);
      ear.castShadow = true;
      headGroup.add(ear);
      earMeshes.push(ear);
    }

    // ---- Sculpted Diamond-Shaped Black Nose ----
    function createDiamondNoseGeometry() {
      const nLat = 28, nLon = 40;
      const positions = [];
      const colors = [];
      const indices = [];

      const evalNose = (phi, theta) => {
        const sp = Math.sin(phi), cp = Math.cos(phi);
        const st = Math.sin(theta), ct = Math.cos(theta);
        // Map (st, cp) in XY front-projection onto a plump Lp rounded diamond (p = 1.32)
        const angXY = Math.atan2(cp, st);
        const rXY = Math.hypot(st, cp);
        const cosA = Math.cos(angXY), sinA = Math.sin(angXY);
        const pExp = 1.30;
        const diamondEnv = 1.0 / Math.pow(
          Math.pow(Math.abs(cosA), pExp) + Math.pow(Math.abs(sinA), pExp),
          1.0 / pExp
        );

        let x = rXY * cosA * diamondEnv * 0.060;
        let y = rXY * sinA * diamondEnv * (sinA < 0 ? 0.058 : 0.048);
        let z = sp * ct * 0.040;

        // Subtle nostril comma indentations on lower-side bevels
        if (ct > 0.15) {
          const nL = Math.exp(-(((x + 0.025) / 0.014) ** 2 + ((y + 0.010) / 0.011) ** 2));
          const nR = Math.exp(-(((x - 0.025) / 0.014) ** 2 + ((y + 0.010) / 0.011) ** 2));
          const nostril = (nL + nR) * smoothstep(0.15, 0.65, ct);
          z -= 0.012 * nostril;
          return { x, y, z, nostril };
        }
        return { x, y, z, nostril: 0 };
      };

      const pTop = evalNose(0, 0);
      positions.push(pTop.x, pTop.y, pTop.z);
      colors.push(0.10, 0.09, 0.10);

      for (let il = 1; il < nLat; il++) {
        const phi = (il / nLat) * Math.PI;
        for (let io = 0; io < nLon; io++) {
          const theta = (io / nLon) * Math.PI * 2;
          const pt = evalNose(phi, theta);
          positions.push(pt.x, pt.y, pt.z);
          const shade = 0.095 * (1.0 - 0.72 * pt.nostril);
          colors.push(shade * 1.05, shade * 0.94, shade);
        }
      }

      const botIdx = 1 + (nLat - 1) * nLon;
      const pBot = evalNose(Math.PI, 0);
      positions.push(pBot.x, pBot.y, pBot.z);
      colors.push(0.08, 0.07, 0.08);

      for (let io = 0; io < nLon; io++) {
        const next = (io + 1) % nLon;
        indices.push(0, 1 + io, 1 + next);
      }
      for (let il = 0; il < nLat - 2; il++) {
        const r0 = 1 + il * nLon;
        const r1 = 1 + (il + 1) * nLon;
        for (let io = 0; io < nLon; io++) {
          const next = (io + 1) % nLon;
          indices.push(r0 + io, r1 + io, r1 + next);
          indices.push(r0 + io, r1 + next, r0 + next);
        }
      }
      const lastR = 1 + (nLat - 2) * nLon;
      for (let io = 0; io < nLon; io++) {
        const next = (io + 1) % nLon;
        indices.push(lastR + io, botIdx, lastR + next);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      return ensureOutwardNormals(geo, () => new THREE.Vector3(0, 0, -0.004));
    }

    const noseMat = new THREE.MeshPhysicalMaterial({
      vertexColors: true,
      roughness: 0.25,
      metalness: 0.02,
      clearcoat: 0.85,
      clearcoatRoughness: 0.16,
      envMapIntensity: 1.4
    });
    const nosePos = evalHeadSurface(0, 0.055, 0.998);
    const noseMesh = new THREE.Mesh(createDiamondNoseGeometry(), noseMat);
    noseMesh.position.copy(nosePos).add(new THREE.Vector3(0, 0.002, 0.012));
    noseMesh.rotation.x = -0.08;
    noseMesh.castShadow = true;

    // Subtle sweet smile & rosy-cocoa lower lip tucked under the peanut whisker pads
    const mouthPos = evalHeadSurface(0, -0.35, 0.935);
    const lipMesh = new THREE.Mesh(

    // ---- Glossy Dark Eyes with Dual Catchlights & Blinking Eyelids ----
    const eyeMat = new THREE.MeshPhysicalMaterial({

    const catchlightMainMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const catchlightSubMat  = new THREE.MeshBasicMaterial({ color: 0xdcf3ff });
    const eyelidMat = new THREE.MeshStandardMaterial({ color: 0x3a2316, roughness: 0.78 });

    const eyeCentersHeadLocal = [];
    const eyeGroups = [];

    for (const side of [-1, 1]) {
      const sockDir = new THREE.Vector3(side * 0.405, 0.285, 0.868).normalize();
      const surfPt = evalHeadSurface(sockDir.x, sockDir.y, sockDir.z);

      // Dual Catchlights (Primary sunlit upper-right + Secondary sky lower-left)
      const cl1 = new THREE.Mesh(new THREE.CircleGeometry(0.0105, 18), catchlightMainMat);
      const clDir1 = new THREE.Vector3(0.32, 0.36, 0.876).normalize();
      cl1.position.copy(clDir1).multiplyScalar(eyeR + 0.0012);
      cl1.lookAt(clDir1.clone().multiplyScalar(2));
      eg.add(cl1);

      const clDir2 = new THREE.Vector3(-0.34, -0.28, 0.897).normalize();
      cl2.position.copy(clDir2).multiplyScalar(eyeR + 0.0012);
      cl2.lookAt(clDir2.clone().multiplyScalar(2));
      eg.add(cl2);

      // Soft dark-cocoa eyelid rim framing the eye
      const lidRim = new THREE.Mesh(new THREE.TorusGeometry(eyeR * 0.97, 0.0065, 10, 28), eyelidMat);
      lidRim.position.z = eyeR * 0.30;

    // ---- Long White Vibrissae Whiskers Around the Snout (Interactive Spring Physics) ----
    const whiskerMat = new THREE.MeshPhysicalMaterial({
      color: 0xfffdf8,
      roughness: 0.22,
      metalness: 0.0,
      clearcoat: 0.75,
      sheen: 0.5,
      sheenColor: new THREE.Color('#ffffff')
    });

    const whiskers = [];
    function createWhiskerStrand(curvePoints, baseRadius) {
      const curve = new THREE.CatmullRomCurve3(curvePoints);
      const segs = 14, radSegs = 6;
      const frames = curve.computeFrenetFrames(segs, false);
      const positions = [];
      const indices = [];

      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const pt = curve.getPointAt(t);
        const r = baseRadius * (1.0 - 0.85 * Math.pow(t, 0.8));
        const N = frames.normals[i];
        const B = frames.binormals[i];
        for (let j = 0; j < radSegs; j++) {
          const a = (j / radSegs) * Math.PI * 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          positions.push(
            pt.x + (N.x * ca + B.x * sa) * r,
            pt.y + (N.y * ca + B.y * sa) * r,
            pt.z + (N.z * ca + B.z * sa) * r
          );
        }
      }
      const tipPt = curve.getPointAt(1);
      const tipIdx = (segs + 1) * radSegs;
      positions.push(tipPt.x, tipPt.y, tipPt.z);

      for (let i = 0; i < segs; i++) {
        const r0 = i * radSegs;
        const r1 = (i + 1) * radSegs;
        for (let j = 0; j < radSegs; j++) {
          const next = (j + 1) % radSegs;
          indices.push(r0 + j, r1 + j, r1 + next);
          indices.push(r0 + j, r1 + next, r0 + next);
        }
      }
      const lastR = segs * radSegs;
      for (let j = 0; j < radSegs; j++) {
        const next = (j + 1) % radSegs;
        indices.push(lastR + j, tipIdx, lastR + next);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // 4 rows x 5 columns per cheek pad + 3 delicate brow vibrissae per side = 46 individual 3D whiskers
    for (const side of [-1, 1]) {
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 5; col++) {
          const dx = side * (0.14 + col * 0.085 + row * 0.015);
          const dy = -0.10 - row * 0.068 + col * 0.012;
          const dz = 0.95 - col * 0.035;

          const wLen = 0.14 + col * 0.036 + row * 0.022;

            mesh: wMesh,

            velX: 0, velZ: 0,

      }

      // Delicate eyebrow vibrissae
      for (let b = 0; b < 3; b++) {
        const dx = side * (0.32 + b * 0.07);
        const dy = 0.42 + b * 0.02;
        const dz = 0.85;
        const rootPt = evalHeadSurface(dx, dy, dz);
        const wLen = 0.095 + b * 0.018;
        const pts = [
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(side * wLen * 0.38, wLen * 0.45, wLen * 0.12),
          new THREE.Vector3(side * wLen * 0.78, wLen * 0.52, -wLen * 0.02)
        ];
        const wMesh = new THREE.Mesh(createWhiskerStrand(pts, 0.0020), whiskerMat);
        wMesh.position.copy(rootPt);
        wMesh.raycast = () => {};
        headGroup.add(wMesh);
        whiskers.push({
          mesh: wMesh,
          rootLocal: rootPt.clone(),
          side,
          angX: 0, angZ: 0,
          velX: 0, velZ: 0,
          phase: b * 2.1 + side
        });
      }
    }

    // ---- 5C. Ribbed Purple-Pink Scallop Shell on the Otter's Belly ----
    const shellGroup = new THREE.Group();
    const SHELL_BASE_Y = 0.332;
    const SHELL_BASE_Z = -0.055;
    shellGroup.position.set(0, SHELL_BASE_Y, SHELL_BASE_Z);
    shellGroup.rotation.set(0.20, 0.08, 0.0);
    torsoGroup.add(shellGroup);

    function createScallopValveGeometry(valveSign) {
      // valveSign: +1 = upper convex dome, -1 = lower convex dome
      const nR = 36, nA = 76;
      const positions = [];
      const colors = [];
      const indices = [];

      const maxAlpha = 0.98; // ~112 degree fan
      const getPt = (rf, af) => {
        const alpha = af * maxAlpha;
        const fanR = 0.235 * (0.86 + 0.14 * Math.cos(alpha * 1.35));
        const r = rf * fanR;

        // 15 symmetric radiating ribs (costae) + interlocking scalloped margin
        const ribWave = Math.cos(alpha * 22.0);
        const ribAmp = smoothstep(0.06, 0.85, rf) * 0.0095;
        const dome = valveSign * 0.042 * Math.sin(Math.PI * Math.pow(rf, 0.82)) * Math.cos(alpha * 0.72);
        const concentricRing = Math.sin(rf * 58.0) * 0.0009 * smoothstep(0.1, 0.95, rf);

        // Interlocking zig-zag margin at rf == 1, protruding outward on each valve face
        const ribY = ribWave * ribAmp * (valveSign > 0 ? (0.65 + 0.35 * rf) : (0.35 + 0.65 * rf));
        const y = dome + ribY + valveSign * concentricRing;
        const x = Math.sin(alpha) * r;
        const z = -0.105 + Math.cos(alpha) * r; // Hinge at z = -0.105, scalloped edge fanning toward +z

        // Rich purple-pink natural scallop coloration
        const umboPlum = new THREE.Color('#5a204e');
        const midMagenta = new THREE.Color('#a83c70');
        const coralPink = new THREE.Color('#df6b91');
        const creamBlush = new THREE.Color('#fae2e8');

        const c = new THREE.Color().copy(umboPlum);
        c.lerp(midMagenta, smoothstep(0.05, 0.42, rf));
        c.lerp(coralPink, smoothstep(0.38, 0.80, rf));
        c.lerp(creamBlush, smoothstep(0.82, 1.0, rf) * 0.72);

        // Highlight rib crests with warm rosy-pearl & growth bands
        const band = 0.5 + 0.5 * Math.sin(rf * 26.0 + 0.8);
        c.lerp(creamBlush, Math.max(0, ribWave) * 0.32 * smoothstep(0.15, 0.9, rf));
        c.lerp(umboPlum, band * 0.12 * (1.0 - rf * 0.5));
        if (valveSign < 0) c.lerp(creamBlush, 0.28); // Slightly paler underside valve

        return { x, y, z, c };
      };

      for (let ir = 0; ir <= nR; ir++) {
        const rf = ir / nR;
        for (let ia = 0; ia <= nA; ia++) {
          const af = (ia / nA) * 2 - 1;
          const pt = getPt(rf, af);
          positions.push(pt.x, pt.y, pt.z);
          colors.push(pt.c.r, pt.c.g, pt.c.b);
        }
      }

      const stride = nA + 1;
      for (let ir = 0; ir < nR; ir++) {
        for (let ia = 0; ia < nA; ia++) {
          const a = ir * stride + ia;
          const b = (ir + 1) * stride + ia;
          const c = (ir + 1) * stride + (ia + 1);
          const d = ir * stride + (ia + 1);
          if (valveSign > 0) {
            indices.push(a, b, c, a, c, d);
          } else {
            indices.push(a, c, b, a, d, c);
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      return ensureOutwardNormals(geo, () => new THREE.Vector3(0, -valveSign * 0.08, 0.01));
    }

    const shellMat = new THREE.MeshPhysicalMaterial({
      vertexColors: true,
      roughness: 0.27,
      metalness: 0.02,
      clearcoat: 0.58,
      clearcoatRoughness: 0.20,
      iridescence: 0.38,
      iridescenceIOR: 1.35,
