    });

    const upperValveMesh = new THREE.Mesh(createScallopValveGeometry(+1), shellMat);
    const lowerValveMesh = new THREE.Mesh(createScallopValveGeometry(-1), shellMat);
    upperValveMesh.castShadow = true;
    upperValveMesh.receiveShadow = true;
    lowerValveMesh.castShadow = true;
    shellGroup.add(upperValveMesh, lowerValveMesh);

    // Scallop hinge auricles ("ears" at the umbo)
    const earWingGeo = new THREE.BoxGeometry(0.145, 0.014, 0.048, 12, 2, 4);
    const ewPos = earWingGeo.attributes.position;
    const ewCols = new Float32Array(ewPos.count * 3);
    const plumCol = new THREE.Color('#6a2859');
    const roseCol = new THREE.Color('#c25480');
    for (let i = 0; i < ewPos.count; i++) {
      const x = ewPos.getX(i), y = ewPos.getY(i), z = ewPos.getZ(i);
      const taper = 1.0 - 0.35 * (Math.abs(x) / 0.0725);
      const rib = Math.sin(x * 110.0) * 0.0022;
      ewPos.setXYZ(i, x, y * taper + Math.sign(y) * Math.abs(rib), z * taper);
      const col = plumCol.clone().lerp(roseCol, Math.abs(x) / 0.075 * 0.65);
      ewCols[i * 3] = col.r; ewCols[i * 3 + 1] = col.g; ewCols[i * 3 + 2] = col.b;
    }
    earWingGeo.setAttribute('color', new THREE.BufferAttribute(ewCols, 3));
    earWingGeo.computeVertexNormals();
    const hingeEarsMesh = new THREE.Mesh(earWingGeo, shellMat);
    hingeEarsMesh.position.set(0, 0, -0.095);
    hingeEarsMesh.castShadow = true;
    shellGroup.add(hingeEarsMesh);

    // ---- 5D. Helper to Build Curved Organic Limb/Tail Tubes ----
    function createCurvedTubeSkinGeometry(curvePoints, radiiFn, segs = 32, radSegs = 24, colorFn = null) {
      const curve = new THREE.CatmullRomCurve3(curvePoints);
      const frames = curve.computeFrenetFrames(segs, false);
      const positions = [];
      const colors = [];
      const indices = [];

      const p0 = curve.getPointAt(0);
      positions.push(p0.x, p0.y, p0.z);
      const cStart = colorFn ? colorFn(0, p0) : colDarkChocRoot;
      colors.push(cStart.r, cStart.g, cStart.b);

      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const pt = curve.getPointAt(t);
        const { rx, ry } = radiiFn(t);
        const N = frames.normals[i];
        const B = frames.binormals[i];
        for (let j = 0; j < radSegs; j++) {
          const a = (j / radSegs) * Math.PI * 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          const vx = pt.x + N.x * ca * rx + B.x * sa * ry;
          const vy = pt.y + N.y * ca * rx + B.y * sa * ry;
          const vz = pt.z + N.z * ca * rx + B.z * sa * ry;
          positions.push(vx, vy, vz);
          const vc = colorFn ? colorFn(t, new THREE.Vector3(vx, vy, vz)) : colDarkChocRoot;
          colors.push(vc.r, vc.g, vc.b);
        }
      }

      const endIdx = 1 + (segs - 1) * radSegs;
      const p1 = curve.getPointAt(1);
      positions.push(p1.x, p1.y, p1.z);
      const cEnd = colorFn ? colorFn(1, p1) : colDarkChocRoot;
      colors.push(cEnd.r, cEnd.g, cEnd.b);

      for (let j = 0; j < radSegs; j++) {
        const next = (j + 1) % radSegs;
        indices.push(0, 1 + j, 1 + next);
      }
      for (let i = 0; i < segs - 2; i++) {
        const r0 = 1 + i * radSegs;
        const r1 = 1 + (i + 1) * radSegs;
        for (let j = 0; j < radSegs; j++) {
          const next = (j + 1) % radSegs;
          indices.push(r0 + j, r1 + j, r1 + next);
          indices.push(r0 + j, r1 + next, r0 + next);
        }
      }
      const lastR = 1 + (segs - 2) * radSegs;
      for (let j = 0; j < radSegs; j++) {
        const next = (j + 1) % radSegs;
        indices.push(lastR + j, endIdx, lastR + next);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      return ensureOutwardNormals(geo, (p) => {
        let bestD = Infinity, bestPt = p0;
        for (let k = 0; k <= 16; k++) {
          const cp = curve.getPointAt(k / 16);
          const d = cp.distanceToSquared(p);
          if (d < bestD) { bestD = d; bestPt = cp; }
        }
        return bestPt;
      });
    }

    const darkLimbSkinMat = createSkinMaterial(false);
    const pinkPadMat = new THREE.MeshPhysicalMaterial({
      color: 0xef8fa4,
      roughness: 0.42,
      metalness: 0.0,
      clearcoat: 0.25,
      clearcoatRoughness: 0.35,
      emissive: new THREE.Color('#380d18'),
      emissiveIntensity: 0.09
    });
    const pawVelvetMat = new THREE.MeshStandardMaterial({
      color: 0x2c1910,
      roughness: 0.62
    });

    // ---- 5E. Two Front Forelimbs & Paws Holding/Tapping the Scallop Shell ----
    const armData = [];
    for (const side of [-1, 1]) {
      const armGroup = new THREE.Group();
      // Shoulder pivot in torsoGroup local space
      armGroup.position.set(side * 0.32, 0.11, -0.24);
      torsoGroup.add(armGroup);

      // Curve in armGroup local space arching up & inward to hold/tap the scallop shell
      const armCurvePts = [
        new THREE.Vector3(-side * 0.03, -0.02, -0.01),
        new THREE.Vector3(side * 0.04, 0.11, 0.07),
        new THREE.Vector3(-side * 0.06, 0.21, 0.15),
        new THREE.Vector3(-side * 0.17, 0.245, 0.185)
      ];
      const armGeo = createCurvedTubeSkinGeometry(
        armCurvePts,
        (t) => {
          const cap = Math.sqrt(Math.max(0.02, Math.sin(Math.PI * (0.08 + 0.86 * t))));
          const r = (0.085 - 0.024 * t) * cap;
          return { rx: r, ry: r * 0.92 };
        },
        28, 22
      );
      const armMesh = new THREE.Mesh(armGeo, darkLimbSkinMat);
      armMesh.castShadow = true;
      armMesh.receiveShadow = true;
      armGroup.add(armMesh);

      // Cute plump forepaw with 4 stubby digits & soft pink paw pads underneath
      const pawGroup = new THREE.Group();
      pawGroup.position.set(-side * 0.175, 0.242, 0.19);
      pawGroup.rotation.set(0.22, -side * 0.35, side * 0.28);
      armGroup.add(pawGroup);

      const palmMesh = new THREE.Mesh(new THREE.SphereGeometry(0.048, 18, 14), pawVelvetMat);
      palmMesh.scale.set(1.08, 0.62, 1.15);
      palmMesh.castShadow = true;
      pawGroup.add(palmMesh);

      const mainForePad = new THREE.Mesh(new THREE.SphereGeometry(0.024, 14, 10), pinkPadMat);
      mainForePad.scale.set(1.15, 0.42, 1.0);
      mainForePad.position.set(0, -0.024, 0.004);
      pawGroup.add(mainForePad);

      for (let d = 0; d < 4; d++) {
        const da = (d - 1.5) * 0.36;
        const digit = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 10), pawVelvetMat);
        digit.scale.set(0.88, 0.72, 1.38);
        digit.position.set(-side * 0.01 + Math.sin(da) * 0.036, -0.005, 0.044 + Math.cos(da) * 0.010);
        digit.rotation.y = da * 0.5;
        digit.castShadow = true;
        pawGroup.add(digit);

        const toePad = new THREE.Mesh(new THREE.SphereGeometry(0.010, 10, 8), pinkPadMat);
        toePad.scale.set(0.9, 0.48, 1.1);
        toePad.position.set(digit.position.x, -0.016, digit.position.z + 0.004);
        pawGroup.add(toePad);
      }

      armData.push({ side, armGroup, armMesh, armGeo, pawGroup });
    }

    // ---- 5F. Pink-Padded Webbed Hind Flippers Sticking Up & Paddling Gently ----
    const webbingMat = new THREE.MeshStandardMaterial({
      color: 0x2b1911,
      roughness: 0.44,
      metalness: 0.01
    });

    function createWebbingMembraneGeometry(toeDirs, toeLengths) {
      // Closed volumetric webbed membrane spanning between the 5 radiating hind flipper digits
      const positions = [];
      const indices = [];
      const nSpan = 8, nRad = 14;
      const halfThick = 0.0065;

      // Build top (+z) and bottom (-z) sheets + outer scalloped rim
      for (let k = 0; k < 4; k++) {
        const d0 = toeDirs[k], d1 = toeDirs[k + 1];
        const L0 = toeLengths[k] * 0.92, L1 = toeLengths[k + 1] * 0.92;
        const baseVertexOffset = positions.length / 3;

        for (let face = 0; face < 2; face++) {
          const zSign = face === 0 ? 1 : -1;
          for (let ir = 0; ir <= nRad; ir++) {
            const rf = ir / nRad;
            for (let is = 0; is <= nSpan; is++) {
              const sf = is / nSpan;
              const ang = d0 + (d1 - d0) * sf;
              const maxL = (L0 + (L1 - L0) * sf) * (1.0 - 0.14 * Math.sin(Math.PI * sf));
              const r = 0.025 + rf * (maxL - 0.025);
              const x = Math.sin(ang) * r;
              const y = Math.cos(ang) * r;
              const archZ = Math.sin(Math.PI * sf) * 0.004 * rf;
              const thick = halfThick * (1.0 - 0.45 * rf);
              positions.push(x, y, zSign * thick + archZ);
            }
          }
        }

        const sheetCount = (nRad + 1) * (nSpan + 1);
        const stride = nSpan + 1;
        for (let ir = 0; ir < nRad; ir++) {
          for (let is = 0; is < nSpan; is++) {
            // Front (+z) sheet
            const a = baseVertexOffset + ir * stride + is;
            const b = baseVertexOffset + (ir + 1) * stride + is;
            const c = baseVertexOffset + (ir + 1) * stride + (is + 1);
            const d = baseVertexOffset + ir * stride + (is + 1);
            indices.push(a, d, c, a, c, b);

            // Back (-z) sheet
            const a2 = a + sheetCount, b2 = b + sheetCount, c2 = c + sheetCount, d2 = d + sheetCount;
            indices.push(a2, b2, c2, a2, c2, d2);
          }
        }

        // Stitch scalloped outer rim at ir == nRad
        const topRim = baseVertexOffset + nRad * stride;
        const botRim = topRim + sheetCount;
        for (let is = 0; is < nSpan; is++) {
          indices.push(topRim + is, botRim + is, botRim + is + 1);
          indices.push(topRim + is, botRim + is + 1, topRim + is + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const flipperData = [];
    for (const side of [-1, 1]) {
      const hipGroup = new THREE.Group();
      hipGroup.position.set(side * 0.25, 0.02, 0.56);
      torsoGroup.add(hipGroup);

      // Plush furry leg/ankle rising out of the hip
      const legPts = [
        new THREE.Vector3(-side * 0.02, -0.02, -0.02),
        new THREE.Vector3(side * 0.04, 0.06, 0.03),
        new THREE.Vector3(side * 0.08, 0.145, 0.06)
      ];
      const legGeo = createCurvedTubeSkinGeometry(
        legPts,
        (t) => {
          const cap = Math.sqrt(Math.max(0.03, Math.sin(Math.PI * (0.10 + 0.82 * t))));
          return { rx: (0.095 - 0.032 * t) * cap, ry: (0.088 - 0.028 * t) * cap };
        },
        20, 20
      );
      const legMesh = new THREE.Mesh(legGeo, darkLimbSkinMat);
      legMesh.castShadow = true;
      hipGroup.add(legMesh);

      // Articulated webbed flipper paddle sticking UP (+Y) with pink plantar pads facing +Z/+Y
      const ankleGroup = new THREE.Group();
      ankleGroup.position.set(side * 0.082, 0.145, 0.062);
      ankleGroup.rotation.set(-0.22, side * 0.18, -side * 0.34);
      hipGroup.add(ankleGroup);

      // 5 fanning webbed digits (outer lateral digit longest, authentic sea otter flipper shape)
      const baseAngles = [-0.56, -0.28, 0.0, 0.28, 0.56];
      const toeDirs = baseAngles.map((a) => a);
      const toeLengths = side > 0
        ? [0.225, 0.248, 0.268, 0.286, 0.302]
        : [0.302, 0.286, 0.268, 0.248, 0.225];

      const webMesh = new THREE.Mesh(createWebbingMembraneGeometry(toeDirs, toeLengths), webbingMat);
      webMesh.castShadow = true;
      webMesh.receiveShadow = true;
      ankleGroup.add(webMesh);

      // Heel base cushion
      const heelBase = new THREE.Mesh(new THREE.SphereGeometry(0.046, 16, 12), pawVelvetMat);
      heelBase.scale.set(1.05, 1.15, 0.52);
      heelBase.position.set(0, 0.02, 0);
      ankleGroup.add(heelBase);

      // 5 rounded toe rays + 5 cute oval rosy-pink digital toe pads on plantar (+Z) sole
      for (let k = 0; k < 5; k++) {
        const ang = toeDirs[k];
        const L = toeLengths[k];
        const toeGroup = new THREE.Group();
        toeGroup.rotation.z = -ang;
        ankleGroup.add(toeGroup);

        const rayPts = [
          new THREE.Vector3(0, 0.015, 0),
          new THREE.Vector3(0, L * 0.52, 0.003),
          new THREE.Vector3(0, L, -0.004)
        ];
        const rayGeo = createCurvedTubeSkinGeometry(
          rayPts,
          (t) => ({ rx: 0.020 * (1 - 0.22 * t), ry: 0.014 * (1 - 0.20 * t) }),
          14, 12
        );
        const rayMesh = new THREE.Mesh(rayGeo, pawVelvetMat);
        rayMesh.castShadow = true;
        toeGroup.add(rayMesh);

        // Plump oval pink digital toe pad
        const dPad = new THREE.Mesh(new THREE.SphereGeometry(0.0185, 16, 12), pinkPadMat);
        dPad.scale.set(0.88, 1.28, 0.52);
        dPad.position.set(0, L * 0.80, 0.011);
        toeGroup.add(dPad);
      }

      // Adorable central bilobed/heart-shaped pink plantar palm pad
      const palmPadCenter = new THREE.Mesh(new THREE.SphereGeometry(0.036, 18, 14), pinkPadMat);
      palmPadCenter.scale.set(1.22, 0.95, 0.42);
      palmPadCenter.position.set(0, 0.105, 0.012);
      ankleGroup.add(palmPadCenter);

      for (const lobeSide of [-1, 1]) {
        const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.025, 14, 12), pinkPadMat);
        lobe.scale.set(1.0, 1.12, 0.44);
        lobe.position.set(lobeSide * 0.022, 0.118, 0.012);
        lobe.rotation.z = -lobeSide * 0.25;
        ankleGroup.add(lobe);
      }

      const heelPinkPad = new THREE.Mesh(new THREE.SphereGeometry(0.020, 14, 10), pinkPadMat);
      heelPinkPad.scale.set(0.95, 1.15, 0.42);
      heelPinkPad.position.set(0, 0.048, 0.012);
      ankleGroup.add(heelPinkPad);

      flipperData.push({ side, hipGroup, legMesh, legGeo, ankleGroup });
    }

    // ---- 5G. Plush Waterproof Tail Trailing Gently in the Water ----
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, -0.03, 0.70);
    torsoGroup.add(tailGroup);

    const tailPts = [
      new THREE.Vector3(0, 0.01, -0.03),
      new THREE.Vector3(0, 0.00, 0.22),
      new THREE.Vector3(0, -0.01, 0.46),
      new THREE.Vector3(0, 0.01, 0.68)
    ];
    const tailGeo = createCurvedTubeSkinGeometry(
      tailPts,
      (t) => {
        const cap = Math.sqrt(Math.max(0.015, Math.sin(Math.PI * (0.08 + 0.89 * t))));
        return { rx: (0.125 - 0.068 * t) * cap, ry: (0.092 - 0.050 * t) * cap };
      },
      28, 22
    );
    const tailMesh = new THREE.Mesh(tailGeo, darkLimbSkinMat);
    tailMesh.castShadow = true;
    tailMesh.receiveShadow = true;
    tailGroup.add(tailMesh);

    // =========================================================================
    // 6. 37,000 INDIVIDUAL 3D VOLUMETRIC FUR STRANDS (InstancedMesh + Physics)
    // =========================================================================
    function createFurBladeGeometry() {
      // 3-sided volumetric curved tapered prism (looks plush from every 360° angle, zero flat-ribbon edge artifacts)
      const segs = 4;
      const sides = 3;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i < segs; i++) {
        const t = i / segs;
        const r = Math.pow(1.0 - t, 0.72);
        const archZ = 0.16 * t * t;
        for (let s = 0; s < sides; s++) {
          const a = (s / sides) * Math.PI * 2 + Math.PI * 0.5;
          positions.push(Math.cos(a) * r, t, Math.sin(a) * r * 0.82 + archZ);
          uvs.push(s / sides, t);
        }
      }
      // Fine pointed tip vertex
      const tipIdx = segs * sides;
      positions.push(0, 1.0, 0.16);
      uvs.push(0.5, 1.0);

      for (let i = 0; i < segs - 1; i++) {
        const r0 = i * sides;
        const r1 = (i + 1) * sides;
        for (let s = 0; s < sides; s++) {
          const next = (s + 1) % sides;
          indices.push(r0 + s, r0 + next, r1 + next);
          indices.push(r0 + s, r1 + next, r1 + s);
        }
      }
      const lastR = (segs - 1) * sides;
      for (let s = 0; s < sides; s++) {
        const next = (s + 1) % sides;
        indices.push(lastR + s, lastR + next, tipIdx);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const sharedFurBladeGeo = createFurBladeGeometry();

    function createFurMaterial(isTorso = false) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.76,
        metalness: 0.02,
        envMapIntensity: 0.85
      });
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = waterTimeUniform;
        shader.uniforms.uBreath = breathUniform;
        shader.uniforms.uIsTorso = { value: isTorso ? 1.0 : 0.0 };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
             attribute vec3 aBend;
             attribute vec2 aStrandMeta;
             uniform float uTime;
             uniform float uBreath;
             uniform float uIsTorso;
             varying float vFurT;
             varying float vGuard;
             varying float vBendMag;`
          )
          .replace(
            '#include <beginnormal_vertex>',
            `#include <beginnormal_vertex>
             float furT_n = clamp(position.y, 0.0, 1.0);
             #ifdef USE_INSTANCING
               vec3 c0_n = instanceMatrix[0].xyz;
               vec3 c1_n = instanceMatrix[1].xyz;
               vec3 c2_n = instanceMatrix[2].xyz;
               float lx_n = dot(normalize(c0_n), aBend);
               float lz_n = dot(normalize(c2_n), aBend);
               float invL_n = 1.0 / max(length(c1_n), 0.001);
               objectNormal = normalize(objectNormal + vec3(-lx_n * invL_n * 1.15 * furT_n, 0.28 * furT_n, -lz_n * invL_n * 1.15 * furT_n));
             #endif`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             float furT = clamp(position.y, 0.0, 1.0);
             vFurT = furT;
             vGuard = aStrandMeta.y;
             float wCurve = furT * furT;
             #ifdef USE_INSTANCING
               vec3 col0 = instanceMatrix[0].xyz;
               vec3 col1 = instanceMatrix[1].xyz;
               vec3 col2 = instanceMatrix[2].xyz;
               vec3 rootPos = instanceMatrix[3].xyz;
               float len0 = max(length(col0), 0.0001);
               float len1 = max(length(col1), 0.0001);
               float len2 = max(length(col2), 0.0001);
               vec3 e0 = col0 / len0;
               vec3 e1 = col1 / len1;
               vec3 e2 = col2 / len2;

               float phase = aStrandMeta.x;
               float swayAmp = len1 * (0.038 + 0.026 * aStrandMeta.y);
               vec3 ambientSway = (e0 * sin(uTime * 2.0 + phase) + e2 * cos(uTime * 1.65 + phase * 1.3)) * swayAmp;

               vec3 totalBend = aBend + ambientSway;
               float latX = dot(e0, totalBend);
               float latZ = dot(e2, totalBend);
               float axY  = dot(e1, totalBend);

               float latMag = sqrt(latX * latX + latZ * latZ);
               float maxLat = len1 * 0.88;
               if (latMag > maxLat) {
                 float sc = maxLat / latMag;
                 latX *= sc;
                 latZ *= sc;
                 latMag = maxLat;
               }
               vBendMag = clamp(latMag / maxLat, 0.0, 1.0);

               // Length-preserving quadratic cantilever curve
               float tipDrop = -(latMag * latMag) / (2.15 * len1);

               transformed.x += (latX * wCurve) / len0;
               transformed.z += (latZ * wCurve) / len2;
               transformed.y += (axY * 0.30 * wCurve + tipDrop * wCurve) / len1;

               if (uIsTorso > 0.5) {
                 float chestMask = smoothstep(-0.02, 0.24, rootPos.y)
                                 * exp(-pow((rootPos.z + 0.06) / 0.36, 2.0))
                                 * exp(-pow(rootPos.x / 0.38, 2.0));
                 vec3 breathDisp = vec3(rootPos.x * 0.05, 1.0, 0.0) * (uBreath * 0.026 * chestMask);
                 transformed.x += dot(e0, breathDisp) / len0;
                 transformed.y += dot(e1, breathDisp) / len1;
                 transformed.z += dot(e2, breathDisp) / len2;
               }
             #else
               vBendMag = 0.0;
             #endif`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
             varying float vFurT;
             varying float vGuard;
             varying float vBendMag;`
          )
          .replace(
            '#include <color_fragment>',
            `#include <color_fragment>
             float rootAO = mix(0.40, 1.12, pow(clamp(vFurT, 0.0, 1.0), 0.56));
             vec3 tipFrost = vec3(1.0, 0.96, 0.89) * (smoothstep(0.60, 1.0, vFurT) * (0.045 + 0.085 * vGuard + 0.065 * vBendMag));
             diffuseColor.rgb = diffuseColor.rgb * rootAO + tipFrost;`
          )
          .replace(
            '#include <lights_fragment_end>',
            `#include <lights_fragment_end>
             float fresnelRim = pow(1.0 - clamp(abs(dot(geometry.normal, geometry.viewDir)), 0.0, 1.0), 2.35);
             vec3 plushSheen = (diffuseColor.rgb * 0.65 + vec3(0.34, 0.29, 0.23)) * fresnelRim * vFurT * (0.44 + 0.26 * vGuard + 0.28 * vBendMag);
             reflectedLight.indirectDiffuse += plushSheen;`
          );
      };
      return mat;
    }

    const furSystems = [];
    let totalFurStrands = 0;

    // Area-weighted stratified triangle surface sampler for ultra-dense, gap-free plush coats
    function buildFurInstancedSystem({
      parentGroup,
      sources, // [{ geometry, matrix, weightFn }]
      count,
      isTorso = false,
      filterAndStyleFn
    }) {
      const tris = [];
      let totalWeight = 0;
      const pA = new THREE.Vector3(), pB = new THREE.Vector3(), pC = new THREE.Vector3();
      const nA = new THREE.Vector3(), nB = new THREE.Vector3(), nC = new THREE.Vector3();
      const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), cross = new THREE.Vector3();
      const centroid = new THREE.Vector3();

      for (const src of sources) {
        const pos = src.geometry.attributes.position;
        const nrm = src.geometry.attributes.normal;
        const idx = src.geometry.index;
        const mat = src.matrix || new THREE.Matrix4();
        const normalMat = new THREE.Matrix3().getNormalMatrix(mat);
        const triCount = idx ? idx.count / 3 : pos.count / 3;

        for (let t = 0; t < triCount; t++) {
          const i0 = idx ? idx.getX(t * 3) : t * 3;
          const i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
          const i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;

          pA.fromBufferAttribute(pos, i0).applyMatrix4(mat);
          pB.fromBufferAttribute(pos, i1).applyMatrix4(mat);
          pC.fromBufferAttribute(pos, i2).applyMatrix4(mat);

          nA.fromBufferAttribute(nrm, i0).applyMatrix3(normalMat).normalize();
          nB.fromBufferAttribute(nrm, i1).applyMatrix3(normalMat).normalize();
          nC.fromBufferAttribute(nrm, i2).applyMatrix3(normalMat).normalize();

          e1.subVectors(pB, pA);
          e2.subVectors(pC, pA);
          const area = 0.5 * cross.crossVectors(e1, e2).length();
          if (area < 1e-8) continue;

          centroid.copy(pA).add(pB).add(pC).multiplyScalar(1 / 3);
          const w = area * (src.weightFn ? src.weightFn(centroid) : 1.0);
          if (w <= 0) continue;

          totalWeight += w;
          tris.push({
            cdf: totalWeight,
            ax: pA.x, ay: pA.y, az: pA.z,
            bx: pB.x, by: pB.y, bz: pB.z,
            cx: pC.x, cy: pC.y, cz: pC.z,
            nax: nA.x, nay: nA.y, naz: nA.z,
            nbx: nB.x, nby: nB.y, nbz: nB.z,
            ncx: nC.x, ncy: nC.y, ncz: nC.z
          });
        }
      }

      const bladeGeo = sharedFurBladeGeo.clone();
      const bendArray = new Float32Array(count * 3);
      const velArray = new Float32Array(count * 3);
      const rootsArray = new Float32Array(count * 3);
      const normalsArray = new Float32Array(count * 3);
      const metaArray = new Float32Array(count * 2);

      const bendAttr = new THREE.InstancedBufferAttribute(bendArray, 3);
      bendAttr.setUsage(THREE.DynamicDrawUsage);
      bladeGeo.setAttribute('aBend', bendAttr);

      const furMat = createFurMaterial(isTorso);
      const instMesh = new THREE.InstancedMesh(bladeGeo, furMat, count);
      instMesh.receiveShadow = true;
      instMesh.castShadow = false; // Skin underlayer casts clean soft shadows without thin-blade shadow acne
      instMesh.frustumCulled = false;
      instMesh.raycast = () => {}; // Colliders handle fast raycasting

      const pickTri = (target) => {
        let lo = 0, hi = tris.length - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (tris[mid].cdf < target) lo = mid + 1;
          else hi = mid;
        }
        return tris[lo];
      };

      const P = new THREE.Vector3();
      const N = new THREE.Vector3();
      const dirX = new THREE.Vector3(), dirY = new THREE.Vector3(), dirZ = new THREE.Vector3();
      const m4 = new THREE.Matrix4();
      const scaleVec = new THREE.Vector3();

      for (let i = 0; i < count; i++) {
        let accepted = false;
        let style = null;
        for (let attempt = 0; attempt < 12; attempt++) {
          const uStrat = attempt === 0 ? (i + Math.random()) / count : Math.random();
          const tri = pickTri(uStrat * totalWeight);
          const s = Math.sqrt(Math.random());
          const r2 = Math.random();
          const u0 = 1.0 - s, u1 = s * (1.0 - r2), u2 = s * r2;

          P.set(
            tri.ax * u0 + tri.bx * u1 + tri.cx * u2,
            tri.ay * u0 + tri.by * u1 + tri.cy * u2,
            tri.az * u0 + tri.bz * u1 + tri.cz * u2
          );
          N.set(
            tri.nax * u0 + tri.nbx * u1 + tri.ncx * u2,
            tri.nay * u0 + tri.nby * u1 + tri.ncy * u2,
            tri.naz * u0 + tri.nbz * u1 + tri.ncz * u2
          ).normalize();

          const isGuard = (i % 4 === 0) ? 1.0 : 0.0;
          style = filterAndStyleFn(P, N, isGuard);
          if (style) {
            accepted = true;
            metaArray[i * 2] = Math.random() * Math.PI * 2;
            metaArray[i * 2 + 1] = isGuard;
            break;
          }
        }
        if (!accepted) {
          metaArray[i * 2] = 0;
          metaArray[i * 2 + 1] = 0;
          m4.makeScale(0.0001, 0.0001, 0.0001);
          instMesh.setMatrixAt(i, m4);
          instMesh.setColorAt(i, colDarkChocRoot);
          continue;
        }

        // Clump slightly toward soft local tuft centers for authentic plush sea otter coat texture
        const clumpFreq = 19.0;
        const cx = (valueNoise3(P.x * clumpFreq, P.y * clumpFreq, P.z * clumpFreq) - 0.5) * 0.26;
        const cy = (valueNoise3(P.x * clumpFreq + 11.3, P.y * clumpFreq, P.z * clumpFreq) - 0.5) * 0.26;
        const cz = (valueNoise3(P.x * clumpFreq, P.y * clumpFreq + 23.7, P.z * clumpFreq) - 0.5) * 0.26;

        dirY.copy(N)
            .multiplyScalar(style.loft)
            .addScaledVector(style.flow, style.comb)
            .add(new THREE.Vector3(cx, cy, cz));
        if (dirY.dot(N) < 0.22 * dirY.length()) {
          dirY.copy(N).multiplyScalar(0.55).addScaledVector(style.flow, 0.45);
        }
        dirY.normalize();

        // Blade +Z curves gently along the fur comb direction
        dirZ.copy(style.flow).addScaledVector(dirY, -style.flow.dot(dirY));
        if (dirZ.lengthSq() < 1e-5) {
          dirZ.set(0, 0, 1).addScaledVector(dirY, -dirY.z);
          if (dirZ.lengthSq() < 1e-5) dirZ.set(1, 0, 0).addScaledVector(dirY, -dirY.x);
        }
        dirZ.normalize();
        dirX.crossVectors(dirY, dirZ).normalize();
        dirZ.crossVectors(dirX, dirY).normalize();

        m4.makeBasis(dirX, dirY, dirZ);
        scaleVec.set(style.radius, style.length, style.radius);
        m4.scale(scaleVec);
        // Embed hair root slightly (-0.003) into skin so zero gap ever shows when brushed flat
        m4.setPosition(
          P.x - N.x * 0.003,
          P.y - N.y * 0.003,
          P.z - N.z * 0.003
        );
        instMesh.setMatrixAt(i, m4);
        instMesh.setColorAt(i, style.color);

        rootsArray[i * 3] = P.x;
        rootsArray[i * 3 + 1] = P.y;
        rootsArray[i * 3 + 2] = P.z;
        normalsArray[i * 3] = N.x;
        normalsArray[i * 3 + 1] = N.y;
        normalsArray[i * 3 + 2] = N.z;
      }

      bladeGeo.setAttribute('aStrandMeta', new THREE.InstancedBufferAttribute(metaArray, 2));
      instMesh.instanceMatrix.needsUpdate = true;
      if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
      parentGroup.add(instMesh);

      totalFurStrands += count;
      furSystems.push({
        mesh: instMesh,
        parentGroup,
        count,
        roots: rootsArray,
        normals: normalsArray,
        bend: bendArray,
        vel: velArray,
        bendAttr,
        hasActiveEnergy: false
      });
    }

    // 1. Torso Fur (19,000 strands: dense chocolate waterproof back/flanks + fluffy tan chest & warm milk-choc belly)
    const _flowVec = new THREE.Vector3();
    buildFurInstancedSystem({
      parentGroup: torsoGroup,
      sources: [{
        geometry: torsoGeo,
        weightFn: (p) => (p.y > -0.08 ? 1.35 : 0.65) // Extra plush density on visible belly, chest & flanks
      }],
      count: 19000,
      isTorso: true,
      filterAndStyleFn: (P, N, isGuard) => {
        const wetMask = smoothstep(0.05, -0.10, P.y); // Sleeker waterproof lay below waterline
        const chestFluff = smoothstep(-0.02, 0.25, P.y) * smoothstep(0.22, -0.42, P.z);
        const col = getTorsoColor(P.x, P.y, P.z, true);
        if (isGuard > 0.5) {
          col.lerp(new THREE.Color('#d9be9f'), 0.14 + 0.14 * chestFluff);
        } else {
          col.multiplyScalar(0.92 + 0.16 * Math.random());
        }
        if (wetMask > 0.01) col.multiplyScalar(1.0 - 0.24 * wetMask);

        _flowVec.set(P.x * 0.28, -0.05, 1.0).normalize();
        const baseLen = (0.054 + 0.022 * chestFluff - 0.012 * wetMask) * (0.85 + 0.32 * Math.random());
        const length = isGuard > 0.5 ? baseLen * 1.28 : baseLen;
        const radius = isGuard > 0.5 ? 0.0046 : 0.0068;

        return {
          color: col,
          length,
          radius,
          loft: 1.0 - 0.42 * wetMask + 0.25 * chestFluff,
          comb: 0.58 + 0.45 * wetMask - 0.15 * chestFluff,
          flow: _flowVec
        };
      }
    });

    // 2. Head, Chubby Cheeks, Crown & Rounded Ears Fur (9,500 ultra-fluffy creamy-tan strands)
    headGroup.updateMatrixWorld(true);
    const earSources = earMeshes.map((em) => {
      em.updateMatrix();
      return {
        geometry: earGeo,
        matrix: em.matrix.clone(),
        weightFn: () => 1.5
      };
    });

    const noseCenterLocal = noseMesh.position.clone();
    buildFurInstancedSystem({
      parentGroup: headGroup,
      sources: [
        {
          geometry: headGeo,
          weightFn: (p) => (p.z > -0.10 ? 1.45 : 0.85)
        },
        ...earSources
      ],
      count: 9500,
      isTorso: false,
      filterAndStyleFn: (P, N, isGuard) => {
        // Keep glossy dark eyes & leathery black diamond nose completely clear of stray hairs
        const dEyeL = P.distanceTo(eyeCentersHeadLocal[0]);
        const dEyeR = P.distanceTo(eyeCentersHeadLocal[1]);
        const minEyeD = Math.min(dEyeL, dEyeR);
        if (minEyeD < 0.050) return null;

        const dNoseX = (P.x - noseCenterLocal.x) / 0.064;
        const dNoseY = (P.y - noseCenterLocal.y) / 0.058;
        const dNoseZ = (P.z - noseCenterLocal.z) / 0.052;
        const noseDist = Math.hypot(dNoseX, dNoseY, dNoseZ);
        if (noseDist < 1.02 && P.z > 0.26) return null;

        // Keep lower lip center clean
        if (P.distanceTo(lipMesh.position) < 0.026) return null;

        // Smooth velvety short fur framing around eyes, nose & whisker pads, flaring into ultra-fluffy cheeks & crown!
        const eyeTrim = smoothstep(0.050, 0.105, minEyeD);
        const noseTrim = P.z > 0.22 ? smoothstep(1.02, 1.85, noseDist) : 1.0;
        const muzzlePad = Math.exp(-((P.x / 0.15) ** 2 + ((P.y + 0.06) / 0.09) ** 2 + ((P.z - 0.31) / 0.09) ** 2));
        const cheekCrownPuff = smoothstep(0.05, 0.28, Math.abs(P.x)) * smoothstep(-0.18, 0.18, P.y)
                             + smoothstep(0.12, 0.28, P.y);

        const trimFactor = Math.max(0.28, Math.min(eyeTrim, noseTrim) * (1.0 - 0.42 * muzzlePad));
        const col = getHeadColor(P.x, P.y, P.z, true);
        if (isGuard > 0.5) {
          col.lerp(new THREE.Color('#fff9ee'), 0.22);
        } else {
          col.multiplyScalar(0.94 + 0.12 * Math.random());
        }

        // Radiate fur naturally outward from the nose bridge across cheeks & over the crown
        _flowVec.set(P.x * 1.35, P.y * 0.65 - 0.12, -0.55);
        if (_flowVec.lengthSq() < 1e-4) _flowVec.set(0, 1, -0.5);
        _flowVec.normalize();

        const baseLen = (0.046 + 0.024 * Math.min(1.2, cheekCrownPuff)) * trimFactor * (0.86 + 0.28 * Math.random());
        return {
          color: col,
          length: isGuard > 0.5 ? baseLen * 1.24 : baseLen,
          radius: (isGuard > 0.5 ? 0.0042 : 0.0062) * (0.65 + 0.35 * trimFactor),
          loft: 1.18 + 0.25 * Math.min(1.0, cheekCrownPuff),
          comb: 0.48,
          flow: _flowVec
        };
      }
    });

    // 3. Plush Tail Fur (2,800 chocolate waterproof strands)
    buildFurInstancedSystem({
      parentGroup: tailGroup,
      sources: [{ geometry: tailGeo }],
      count: 2800,
      isTorso: false,
      filterAndStyleFn: (P, N, isGuard) => {
        const n = fbm3(P.x * 9, P.y * 9, P.z * 9);
        const col = new THREE.Color('#351e12').lerp(new THREE.Color('#4f2e1c'), n * 0.8);
        if (isGuard > 0.5) col.lerp(new THREE.Color('#9c7656'), 0.18);
        _flowVec.set(0, -0.05, 1.0).normalize();
        const tFrac = Math.max(0, Math.min(1, P.z / 0.68));
        const baseLen = (0.048 - 0.016 * tFrac) * (0.85 + 0.3 * Math.random());
        return {
          color: col,
          length: isGuard > 0.5 ? baseLen * 1.22 : baseLen,
          radius: isGuard > 0.5 ? 0.0042 : 0.0062,
          loft: 0.78,
          comb: 0.78,
          flow: _flowVec
        };
      }
    });

    // 4 & 5. Left and Right Forelimbs Fur (1,600 x 2 = 3,200 strands)
    for (const arm of armData) {
      buildFurInstancedSystem({
        parentGroup: arm.armGroup,
        sources: [{ geometry: arm.armGeo }],
        count: 1600,
        isTorso: false,
        filterAndStyleFn: (P, N, isGuard) => {
          const n = fbm3(P.x * 10, P.y * 10, P.z * 10);
          const col = new THREE.Color('#3b2214').lerp(new THREE.Color('#5a3722'), n * 0.75);
          if (isGuard > 0.5) col.lerp(new THREE.Color('#caa987'), 0.16);
          const wristTaper = 1.0 - 0.38 * smoothstep(0.12, 0.25, P.y);
          _flowVec.set(-arm.side * 0.55, 0.65, 0.52).normalize();
          const baseLen = 0.046 * wristTaper * (0.85 + 0.3 * Math.random());
          return {
            color: col,
            length: isGuard > 0.5 ? baseLen * 1.22 : baseLen,
            radius: isGuard > 0.5 ? 0.0040 : 0.0058,
            loft: 0.95,
            comb: 0.58,
            flow: _flowVec
          };
        }
      });
    }

    // 6 & 7. Left and Right Hind Legs / Flipper Ankles Fur (1,250 x 2 = 2,500 strands)
    // Total = 19,000 + 9,500 + 2,800 + 3,200 + 2,500 = 37,000 individual 3D fur strands!
    for (const fl of flipperData) {
      buildFurInstancedSystem({
        parentGroup: fl.hipGroup,
        sources: [{ geometry: fl.legGeo }],
        count: 1250,
        isTorso: false,
        filterAndStyleFn: (P, N, isGuard) => {
          const n = fbm3(P.x * 10, P.y * 10, P.z * 10);
          const col = new THREE.Color('#361f12').lerp(new THREE.Color('#51301d'), n * 0.75);
          if (isGuard > 0.5) col.lerp(new THREE.Color('#b5906e'), 0.14);
          const ankleTaper = 1.0 - 0.42 * smoothstep(0.06, 0.15, P.y);
          _flowVec.set(fl.side * 0.35, 0.85, 0.35).normalize();
          const baseLen = 0.045 * ankleTaper * (0.85 + 0.3 * Math.random());
          return {
            color: col,
            length: isGuard > 0.5 ? baseLen * 1.2 : baseLen,
            radius: isGuard > 0.5 ? 0.0040 : 0.0058,
            loft: 0.90,
            comb: 0.62,
            flow: _flowVec
          };
        }
      });
    }

    // =========================================================================
    // 7. INTERACTIVE MOUSE RAYCASTER PHYSICS (PETTING FUR, SHELL WOBBLE, WATER RIPPLES)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2(99, 99);
    let pointerOnScreen = false;
    let pointerDownPos = { x: 0, y: 0 };

    const otterColliderMeshes = [
      torsoMesh,
      headMesh,
      ...earMeshes,
      noseMesh,
      tailMesh,
      ...armData.map((a) => a.armMesh),
      ...flipperData.map((f) => f.legMesh)
    ];
    const shellColliderMeshes = [upperValveMesh, lowerValveMesh, hingeEarsMesh];
    const allInteractiveMeshes = [...otterColliderMeshes, ...shellColliderMeshes, waterMesh];

    const brushState = {
      activeOnOtter: false,
      hitWorld: new THREE.Vector3(),
      prevHitWorld: new THREE.Vector3(),
      hasPrev: false,
      strokeVelWorld: new THREE.Vector3(),
      normalWorld: new THREE.Vector3(0, 1, 0),
      petIntensity: 0,
      petTargetLocalHead: new THREE.Vector2(0, 0),
      clickPulse: 0,
      clickWorld: new THREE.Vector3(),
      lastWaterRippleTime: 0
    };

    // Physical angular spring for the scallop shell (reacts to both paw taps & mouse clicks/strokes)
    const shellPhysics = {
      rotX: 0, rotZ: 0, posY: 0,
      velX: 0, velZ: 0, velY: 0
    };

    function performRaycast(isClick = false) {
      if (!pointerOnScreen) {
        brushState.activeOnOtter = false;
        brushState.hasPrev = false;
        return;
      }

      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allInteractiveMeshes, false);

      if (hits.length === 0) {
        brushState.activeOnOtter = false;
        brushState.hasPrev = false;
        return;
      }

      const hit = hits[0];
      const obj = hit.object;

      if (obj === waterMesh) {
        brushState.activeOnOtter = false;
        brushState.hasPrev = false;
        const now = performance.now() * 0.001;
        if (isClick) {
          spawnWaterRipple(hit.point.x, hit.point.z, 0.048);
        } else if (now - brushState.lastWaterRippleTime > 0.11) {
          spawnWaterRipple(hit.point.x, hit.point.z, 0.018);
          brushState.lastWaterRippleTime = now;
        }
        return;
      }

      if (shellColliderMeshes.includes(obj)) {
        // Hovering or clicking the scallop shell wobbles it physically & brushes surrounding belly fur
        const localHit = shellGroup.worldToLocal(hit.point.clone());
        const imp = isClick ? 2.4 : 0.45;
        shellPhysics.velZ -= localHit.x * imp * 3.2;
        shellPhysics.velX += localHit.z * imp * 3.2;
        if (isClick) shellPhysics.velY -= 0.16;
      }

      // Hit on otter body/head/limbs/shell -> brush & part the 37,000 fur strands!
      brushState.activeOnOtter = true;
      if (brushState.hasPrev) {
        brushState.strokeVelWorld.subVectors(hit.point, brushState.prevHitWorld);
        const maxStep = 0.22;
        if (brushState.strokeVelWorld.length() > maxStep) {
          brushState.strokeVelWorld.setLength(maxStep);
        }
      } else {
        brushState.strokeVelWorld.set(0, 0, 0);
      }

      brushState.prevHitWorld.copy(hit.point);
      brushState.hitWorld.copy(hit.point);
      brushState.hasPrev = true;

      if (hit.face) {
        brushState.normalWorld.copy(hit.face.normal).transformDirection(obj.matrixWorld).normalize();
      }

      brushState.petIntensity = Math.min(1.0, brushState.petIntensity + (isClick ? 0.65 : 0.14));

      if (isClick) {
        brushState.clickPulse = 1.0;
        brushState.clickWorld.copy(hit.point);
        spawnWaterRipple(otterRoot.position.x, otterRoot.position.z + 0.05, 0.025);
      }
    }

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      pointerOnScreen = true;
      if (e.buttons === 0) {
        performRaycast(false);
      } else {
        // Camera orbiting when dragging
        brushState.activeOnOtter = false;
        brushState.hasPrev = false;
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      pointerOnScreen = true;
    });

    canvas.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist < 6) {
        performRaycast(true);
      }
    });

    canvas.addEventListener('pointerleave', () => {
      pointerOnScreen = false;
      brushState.activeOnOtter = false;
      brushState.hasPrev = false;
    });

    // Update per-strand spring-damper physics across all 37,000 3D fur strands
    const _invMat = new THREE.Matrix4();
    const _hitLocal = new THREE.Vector3();
    const _strokeLocal = new THREE.Vector3();
    const _clickLocal = new THREE.Vector3();

    function updateFurPhysics(dt) {
      const hasBrush = brushState.activeOnOtter;
      const hasClick = brushState.clickPulse > 0.01;
      const brushRadius = 0.22;
      const brushRadiusSq = brushRadius * brushRadius;
      const clickRadius = 0.36;
      const clickRadiusSq = clickRadius * clickRadius;

      const stiffness = 13.5 * dt;
      const damping = Math.exp(-5.2 * dt);

      for (let s = 0; s < furSystems.length; s++) {
        const sys = furSystems[s];
        if (!hasBrush && !hasClick && !sys.hasActiveEnergy) continue;

        sys.parentGroup.updateWorldMatrix(true, false);
        _invMat.copy(sys.parentGroup.matrixWorld).invert();

        if (hasBrush) {
          _hitLocal.copy(brushState.hitWorld).applyMatrix4(_invMat);
          _strokeLocal.copy(brushState.strokeVelWorld).transformDirection(_invMat);
        }
        if (hasClick) {
          _clickLocal.copy(brushState.clickWorld).applyMatrix4(_invMat);
        }

        const strokeMag = brushState.strokeVelWorld.length();
        const roots = sys.roots;
        const normals = sys.normals;
        const bend = sys.bend;
        const vel = sys.vel;
        const count = sys.count;
        let maxEnergySq = 0;

        const hx = _hitLocal.x, hy = _hitLocal.y, hz = _hitLocal.z;
        const sx = _strokeLocal.x * strokeMag, sy = _strokeLocal.y * strokeMag, sz = _strokeLocal.z * strokeMag;
        const cx = _clickLocal.x, cy = _clickLocal.y, cz = _clickLocal.z;
        const clickStrength = brushState.clickPulse;

        for (let i = 0; i < count; i++) {
          const idx = i * 3;
          let bx = bend[idx], by = bend[idx + 1], bz = bend[idx + 2];
          let vx = vel[idx], vy = vel[idx + 1], vz = vel[idx + 2];

          if (hasBrush) {
            const dx = roots[idx] - hx;
            const dy = roots[idx + 1] - hy;
            const dz = roots[idx + 2] - hz;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < brushRadiusSq) {
              const d = Math.sqrt(d2) + 1e-5;
              const falloff = 1.0 - d / brushRadius;
              const w = falloff * falloff;
              // Part fur radially away from fingertip + comb smoothly along stroke direction
              const partScale = 0.42 * w * dt;
              const strokeScale = 26.0 * w * dt;
              const pressScale = -0.22 * w * dt;
              vx += (dx / d) * partScale + sx * strokeScale + normals[idx] * pressScale;
              vy += (dy / d) * partScale + sy * strokeScale + normals[idx + 1] * pressScale;
              vz += (dz / d) * partScale + sz * strokeScale + normals[idx + 2] * pressScale;
            }
          }

          if (hasClick) {
            const dx = roots[idx] - cx;
            const dy = roots[idx + 1] - cy;
            const dz = roots[idx + 2] - cz;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < clickRadiusSq) {
              const d = Math.sqrt(d2) + 1e-5;
              const ruffle = (1.0 - d / clickRadius) * clickStrength * 1.45 * dt;
              vx += (dx / d) * ruffle;
              vy += (dy / d) * ruffle;
              vz += (dz / d) * ruffle;
            }
          }

          vx = (vx - bx * stiffness) * damping;
          vy = (vy - by * stiffness) * damping;
          vz = (vz - bz * stiffness) * damping;

          bx += vx;
          by += vy;
          bz += vz;

          bend[idx] = bx;
          bend[idx + 1] = by;
          bend[idx + 2] = bz;
          vel[idx] = vx;
          vel[idx + 1] = vy;
          vel[idx + 2] = vz;

          const eSq = bx * bx + by * by + bz * bz + vx * vx + vy * vy + vz * vz;
          if (eSq > maxEnergySq) maxEnergySq = eSq;
        }

        sys.bendAttr.needsUpdate = true;
        sys.hasActiveEnergy = maxEnergySq > 1e-8;
      }

      // Decay per-frame brush stroke delta & click impulse
      brushState.strokeVelWorld.multiplyScalar(0.35);
      brushState.clickPulse *= Math.exp(-8.0 * dt);
      brushState.petIntensity *= Math.exp(-1.6 * dt);
    }

    // Update interactive white snout whiskers
    function updateWhiskers(time, dt) {
      let hasLocalBrush = false;
      if (brushState.activeOnOtter) {
        headGroup.updateWorldMatrix(true, false);
        _invMat.copy(headGroup.matrixWorld).invert();
        _hitLocal.copy(brushState.hitWorld).applyMatrix4(_invMat);
        hasLocalBrush = true;
      }

      for (let i = 0; i < whiskers.length; i++) {
        const w = whiskers[i];
        if (hasLocalBrush) {
          const d = w.rootLocal.distanceTo(_hitLocal);
          if (d < 0.20) {
            const push = (1.0 - d / 0.20) * 5.5 * dt;
            w.velZ += w.side * push;
            w.velX -= push * 0.8;
          }
        }
        w.velX = (w.velX - w.angX * 18.0 * dt) * Math.exp(-6.0 * dt);
        w.velZ = (w.velZ - w.angZ * 18.0 * dt) * Math.exp(-6.0 * dt);
        w.angX += w.velX;
        w.angZ += w.velZ;

        // Subtle lifelike snout twitch + spring deflection
        const twitch = Math.sin(time * 3.4 + w.phase) * 0.022 + Math.sin(time * 7.8 + w.phase * 1.7) * 0.008 * (0.3 + brushState.petIntensity);
        w.mesh.rotation.set(w.angX + twitch * 0.5, 0, w.angZ + w.side * twitch);
      }
    }

    // =========================================================================
    // 8. FULL LIFELIKE ANIMATION LOOP
    //    (Water Bobbing, Chest Breathing, Paw Tapping on Shell, Flipper Wiggling,
    //     Head Curiosity / Petting Reaction, Blinking & Mouse Fur Deflection)
    // =========================================================================
    const clock = new THREE.Clock();
    let prevTapContactR = false;
    let prevTapContactL = false;
    let lastFlipperRippleTime = 0;

    function pawTapWave(phase) {
      // Adorable sea-otter double-pat cadence ("pat - pat ... pause")
      const cyc = ((phase % 1) + 1) % 1;
      if (cyc < 0.22) {
        const u = cyc / 0.22;
        return Math.sin(Math.PI * u);
      } else if (cyc >= 0.26 && cyc < 0.48) {
        const u = (cyc - 0.26) / 0.22;
        return Math.sin(Math.PI * u) * 0.85;
      }
      return 0.0;
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;
      waterTimeUniform.value = time;

      // 1. Update animated translucent aquamarine water patch
      updateWaterSurface(time);

      // 2. Buoyant floating & gentle rocking of the baby sea otter on the real-time water wave
      const hCenter = getWaterHeight(0, 0.04, time);
      const hFront  = getWaterHeight(0, -0.45, time);
      const hBack   = getWaterHeight(0, 0.55, time);
      const hLeft   = getWaterHeight(-0.35, 0.04, time);
      const hRight  = getWaterHeight(0.35, 0.04, time);

      const wavePitch = Math.atan2(hBack - hFront, 1.0) * 0.55;
      const waveRoll  = Math.atan2(hLeft - hRight, 0.70) * 0.62;

      otterRoot.position.y = 0.018 + hCenter * 0.88 + Math.sin(time * 1.45) * 0.008;
      otterRoot.position.x = Math.sin(time * 0.62) * 0.022;
      otterRoot.position.z = Math.cos(time * 0.51) * 0.018;
      otterRoot.rotation.x = wavePitch + Math.sin(time * 1.15) * 0.020;
      otterRoot.rotation.z = waveRoll + Math.cos(time * 1.32) * 0.032;
      otterRoot.rotation.y = Math.sin(time * 0.42) * 0.045;

      otterShadowPosUniform.value.set(otterRoot.position.x, otterRoot.position.z + 0.04);
      foamRingMesh.position.set(otterRoot.position.x, hCenter + 0.007, otterRoot.position.z + 0.05);
      foamRingMesh.rotation.y = otterRoot.rotation.y;

      // 3. Gentle Chest Breathing (synchronized across torso skin, 19,000 belly fur strands, scallop shell & paws)
      const breath = 0.5 + 0.5 * Math.sin(time * 2.05);
      breathUniform.value = breath;

      // 4. Playful Paw Tapping on the Scallop Shell + Physical Shell Response
      const tapSpeed = 0.44 + brushState.petIntensity * 0.22;
      const liftR = pawTapWave(time * tapSpeed);
      const liftL = pawTapWave(time * tapSpeed + 0.50) * 0.55;

      // Detect exact moment paw pats down onto the scallop shell to trigger a physical micro-bounce
      const contactR = liftR < 0.06;
      if (contactR && !prevTapContactR) {
        shellPhysics.velY -= 0.065;
        shellPhysics.velZ -= 0.42;
        shellPhysics.velX += 0.18;
      }
      prevTapContactR = contactR;

      const contactL = liftL < 0.05;
      if (contactL && !prevTapContactL) {
        shellPhysics.velY -= 0.042;
        shellPhysics.velZ += 0.30;
      }
      prevTapContactL = contactL;

      // Left arm (-1) & Right arm (+1)
      const leftArm = armData[0];
      const rightArm = armData[1];
      leftArm.armGroup.position.y = 0.11 + breath * 0.018 + liftL * 0.028;
      leftArm.armGroup.rotation.z = -liftL * 0.16;
      leftArm.pawGroup.rotation.x = 0.22 - liftL * 0.35;

      rightArm.armGroup.position.y = 0.11 + breath * 0.018 + liftR * 0.042;
      rightArm.armGroup.rotation.z = liftR * 0.22;
      rightArm.pawGroup.rotation.x = 0.22 - liftR * 0.45;

      // Scallop shell spring-damper integration
      shellPhysics.velY = (shellPhysics.velY - shellPhysics.posY * 42.0 * dt) * Math.exp(-9.0 * dt);
      shellPhysics.velX = (shellPhysics.velX - shellPhysics.rotX * 36.0 * dt) * Math.exp(-8.0 * dt);
      shellPhysics.velZ = (shellPhysics.velZ - shellPhysics.rotZ * 36.0 * dt) * Math.exp(-8.0 * dt);
      shellPhysics.posY += shellPhysics.velY * dt * 16.0;
      shellPhysics.rotX += shellPhysics.velX * dt;
      shellPhysics.rotZ += shellPhysics.velZ * dt;

      shellGroup.position.y = SHELL_BASE_Y + breath * 0.024 + shellPhysics.posY;
      shellGroup.rotation.set(
        0.20 + shellPhysics.rotX,
        0.08 + Math.sin(time * 0.8) * 0.015,
        shellPhysics.rotZ
      );

      // 5. Pink-Padded Webbed Hind Flippers Paddling & Wiggling Gently
      const wiggleBoost = 1.0 + brushState.petIntensity * 0.85;
      for (let i = 0; i < flipperData.length; i++) {
        const fl = flipperData[i];
        const ph = time * 2.55 * wiggleBoost + (fl.side > 0 ? 0 : Math.PI * 0.82);
        const paddlePitch = Math.sin(ph) * 0.16;
        const paddleFan   = Math.cos(ph * 0.75) * 0.065;

        fl.hipGroup.rotation.x = paddlePitch * 0.38;
        fl.ankleGroup.rotation.x = -0.22 + paddlePitch;
        fl.ankleGroup.rotation.z = -fl.side * 0.34 + fl.side * paddleFan;
        fl.ankleGroup.rotation.y = fl.side * 0.18 + Math.sin(ph * 1.3) * 0.05;
      }

      if (time - lastFlipperRippleTime > 1.35) {
        spawnWaterRipple(
          otterRoot.position.x + (Math.random() > 0.5 ? 0.32 : -0.32),
          otterRoot.position.z + 0.68,
          0.014
        );
        lastFlipperRippleTime = time;
      }

      // 6. Plush Tail Gentle Wave Sway
      tailGroup.rotation.x = Math.sin(time * 1.65 - 0.9) * 0.065;
      tailGroup.rotation.y = Math.cos(time * 1.25) * 0.075;

      // 7. Expressive Head Tilt, Affectionate Petting Lean & Natural Eye Blink
      const petLeanZ = Math.sin(time * 4.2) * 0.065 * brushState.petIntensity;
      const petNodX  = -0.055 * brushState.petIntensity;
      headGroup.rotation.set(
        HEAD_BASE_ROT_X + Math.sin(time * 1.1) * 0.028 + breath * 0.022 + petNodX,
        HEAD_BASE_ROT_Y + Math.sin(time * 0.72) * 0.055,
        Math.cos(time * 0.95) * 0.032 + petLeanZ
      );

      // Gentle periodic blink + happy squint when petted
      const blinkCycle = (time + 1.4) % 4.6;
      let blinkScaleY = 1.0;
      if (blinkCycle < 0.15) {
        const b = Math.sin((blinkCycle / 0.15) * Math.PI);
        blinkScaleY = 1.0 - 0.88 * b;
      }
      const happySquint = 1.0 - 0.20 * brushState.petIntensity;
      for (const eg of eyeGroups) {
        eg.scale.y = Math.max(0.10, blinkScaleY * happySquint);
      }

      // 8. Interactive Mouse Fur Deflection & Whisker Physics
      updateFurPhysics(dt);
      updateWhiskers(time, dt);

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</head>
<body>
  <canvas id="webgl"></canvas>
</body>
</html>
