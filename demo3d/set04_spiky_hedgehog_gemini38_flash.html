<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chubby Baby Hedgehog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #2a221b 0%, #181310 55%, #0b0907 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Renderer Setup ---
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // --- Scene & Camera ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x181310, 0.055);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.7, 4.3);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.8;
    controls.maxDistance = 7.0;
    controls.maxPolarAngle = Math.PI * 0.52;
    controls.target.set(0, 0.0, 0);

    // --- Lighting ---
    const hemiLight = new THREE.HemisphereLight(0xfff3e6, 0x3d2e24, 0.75);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffeedd, 2.4);
    keyLight.position.set(3.5, 5.5, 4.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.02;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xffdfb8, 3.2);
    rimLight.position.set(-1.8, 4.8, -4.5);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xbdd8ff, 0.85);
    fillLight.position.set(-4.0, 2.0, 2.5);
    scene.add(fillLight);

    const groundBounce = new THREE.DirectionalLight(0xd49b70, 0.45);
    groundBounce.position.set(0, -3.0, 1.2);
    scene.add(groundBounce);

    // --- Ground Shadow Disc ---
    const groundGeo = new THREE.PlaneGeometry(8, 8);
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 256;
    shadowCanvas.height = 256;
    const sCtx = shadowCanvas.getContext('2d');
    const sGrad = sCtx.createRadialGradient(128, 128, 10, 128, 128, 120);
    sGrad.addColorStop(0, 'rgba(10, 8, 7, 0.75)');
    sGrad.addColorStop(0.4, 'rgba(12, 9, 8, 0.45)');
    sGrad.addColorStop(0.8, 'rgba(15, 11, 9, 0.15)');
    sGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    sCtx.fillStyle = sGrad;
    sCtx.fillRect(0, 0, 256, 256);

    const shadowTex = new THREE.CanvasTexture(shadowCanvas);
    const groundMat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      depthWrite: false
    });
    const groundDisc = new THREE.Mesh(groundGeo, groundMat);
    groundDisc.rotation.x = -Math.PI / 2;
    groundDisc.position.y = -1.18;
    scene.add(groundDisc);

    // --- Materials ---
    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xc4a386,
      roughness: 0.78,
      metalness: 0.02
    });

    const snoutSkinMaterial = new THREE.MeshStandardMaterial({
      color: 0xcca98f,
      roughness: 0.7,
      metalness: 0.02
    });

    const noseMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x111111,
      roughness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      specularIntensity: 1.0
    });

    const eyeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x070707,
      roughness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      reflectivity: 0.95
    });

    const innerEarMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xefa294,
      roughness: 0.4,
      transmission: 0.25,
      thickness: 0.35
    });

    const jellyPadMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xff7c97,
      emissive: 0x360914,
      transmission: 0.82,
      opacity: 1.0,
      transparent: true,
      roughness: 0.12,
      metalness: 0.02,
      ior: 1.45,
      thickness: 0.65,
      attenuationColor: 0xff3b6f,
      attenuationDistance: 0.45,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06
    });

    const pawSkinMaterial = new THREE.MeshStandardMaterial({
      color: 0xdfb49f,
      roughness: 0.75,
      metalness: 0.02
    });

    // --- Hedgehog Main Hierarchy ---
    const hedgehogRoot = new THREE.Group();
    hedgehogRoot.position.set(0, -0.22, 0);
    scene.add(hedgehogRoot);

    const bodyGroup = new THREE.Group();
    bodyGroup.rotation.x = -0.25; // Tilted back so belly and paws face viewer
    hedgehogRoot.add(bodyGroup);

    // Torso (Chubby egg shape)
    const torsoGeo = new THREE.SphereGeometry(1.0, 48, 48);
    const torsoMesh = new THREE.Mesh(torsoGeo, skinMaterial);
    torsoMesh.scale.set(1.15, 1.28, 1.10);
    torsoMesh.castShadow = true;
    torsoMesh.receiveShadow = true;
    bodyGroup.add(torsoMesh);

    // Head Group
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 0.78, 0.35);
    headGroup.rotation.x = 0.16;
    bodyGroup.add(headGroup);

    // Head base sphere
    const headBaseGeo = new THREE.SphereGeometry(0.55, 36, 36);
    const headBaseMesh = new THREE.Mesh(headBaseGeo, skinMaterial);
    headBaseMesh.scale.set(1.0, 0.95, 0.95);
    headBaseMesh.castShadow = true;
    headGroup.add(headBaseMesh);

    // Snout Group (Tapered conical snout)
    const snoutGroup = new THREE.Group();
    snoutGroup.position.set(0, -0.06, 0.48);
    headGroup.add(snoutGroup);

    const snoutGeo = new THREE.CylinderGeometry(0.12, 0.40, 0.52, 32);
    snoutGeo.rotateX(Math.PI / 2);
    const snoutMesh = new THREE.Mesh(snoutGeo, snoutSkinMaterial);
    snoutMesh.position.set(0, 0, 0.18);
    snoutMesh.castShadow = true;
    snoutGroup.add(snoutMesh);

    // Wet Button Nose
    const noseGroup = new THREE.Group();
    noseGroup.position.set(0, 0.015, 0.46);
    snoutGroup.add(noseGroup);

    const noseGeo = new THREE.SphereGeometry(0.125, 24, 24);
    const noseMesh = new THREE.Mesh(noseGeo, noseMaterial);
    noseMesh.scale.set(1.22, 0.88, 0.88);
    noseMesh.castShadow = true;
    noseGroup.add(noseMesh);

    // Nostril indentations
    const nostrilGeo = new THREE.SphereGeometry(0.028, 12, 12);
    const nostrilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
    const nostrilL = new THREE.Mesh(nostrilGeo, nostrilMat);
    nostrilL.position.set(0.042, -0.02, 0.10);
    noseGroup.add(nostrilL);
    const nostrilR = nostrilL.clone();
    nostrilR.position.x = -0.042;
    noseGroup.add(nostrilR);

    // Whiskers
    const whiskerMat = new THREE.LineBasicMaterial({
      color: 0x3d3027,
      transparent: true,
      opacity: 0.65
    });
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 7; i++) {
        const whiskerPts = [];
        const yOff = (i - 3) * 0.025;
        const start = new THREE.Vector3(side * 0.14, yOff, 0.30);
        const mid = new THREE.Vector3(side * 0.42, yOff - 0.02, 0.38 + i * 0.02);
        const end = new THREE.Vector3(side * 0.65, yOff - 0.08, 0.28 + i * 0.04);
        whiskerPts.push(start, mid, end);
        const whiskerGeo = new THREE.BufferGeometry().setFromPoints(whiskerPts);
        const whiskerLine = new THREE.Line(whiskerGeo, whiskerMat);
        snoutGroup.add(whiskerLine);
      }
    }

    // Eyes (Glossy obsidian beads with catchlights)
    const eyeGeo = new THREE.SphereGeometry(0.09, 32, 32);
    const catchlightGeo = new THREE.SphereGeometry(0.025, 16, 16);
    const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    for (let side = -1; side <= 1; side += 2) {
      const eyeMesh = new THREE.Mesh(eyeGeo, eyeMaterial);
      eyeMesh.position.set(side * 0.34, 0.14, 0.42);
      eyeMesh.castShadow = true;
      headGroup.add(eyeMesh);

      const catchlight = new THREE.Mesh(catchlightGeo, catchlightMat);
      catchlight.position.set(side * 0.36 + side * 0.02, 0.18, 0.49);
      headGroup.add(catchlight);

      // Pale fleshy eye ring
      const ringGeo = new THREE.TorusGeometry(0.095, 0.02, 16, 32);
      const ringMesh = new THREE.Mesh(ringGeo, snoutSkinMaterial);
      ringMesh.position.copy(eyeMesh.position);
      ringMesh.rotation.y = side * 0.55;
      ringMesh.rotation.x = -0.2;
      headGroup.add(ringMesh);
    }

    // Ears (Rounded pink-lined cupped ears)
    const earGroupL = new THREE.Group();
    earGroupL.position.set(0.52, 0.32, 0.08);
    earGroupL.rotation.set(-0.2, 0.45, -0.25);
    headGroup.add(earGroupL);

    const earOuterGeo = new THREE.SphereGeometry(0.18, 24, 24, 0, Math.PI);
    const earOuterMesh = new THREE.Mesh(earOuterGeo, skinMaterial);
    earOuterMesh.scale.set(1.0, 1.25, 0.45);
    earGroupL.add(earOuterMesh);

    const earInnerGeo = new THREE.SphereGeometry(0.14, 24, 24, 0, Math.PI);
    const earInnerMesh = new THREE.Mesh(earInnerGeo, innerEarMaterial);
    earInnerMesh.scale.set(0.9, 1.15, 0.35);
    earInnerMesh.position.set(0, 0, 0.03);
    earGroupL.add(earInnerMesh);

    const earGroupR = new THREE.Group();
    earGroupR.position.set(-0.52, 0.32, 0.08);
    earGroupR.rotation.set(-0.2, -0.45, 0.25);
    headGroup.add(earGroupR);

    const earOuterMeshR = earOuterMesh.clone();
    earGroupR.add(earOuterMeshR);
    const earInnerMeshR = earInnerMesh.clone();
    earGroupR.add(earInnerMeshR);

    // --- Stubby Paws & Pink Translucent Jelly Pads ---
    function createPaw(isFront, side) {
      const paw = new THREE.Group();

      // Main stubby foot/hand
      const handGeo = new THREE.SphereGeometry(0.14, 24, 24);
      const handMesh = new THREE.Mesh(handGeo, pawSkinMaterial);
      handMesh.scale.set(isFront ? 1.0 : 1.15, 0.75, isFront ? 1.15 : 1.35);
      handMesh.castShadow = true;
      paw.add(handMesh);

      // Central squishy palm/plantar jelly pad
      const palmPadGeo = new THREE.CylinderGeometry(isFront ? 0.075 : 0.10, isFront ? 0.085 : 0.11, 0.045, 24);
      const palmPadMesh = new THREE.Mesh(palmPadGeo, jellyPadMaterial);
      palmPadMesh.position.set(0, -0.05, 0);
      palmPadMesh.castShadow = true;
      paw.add(palmPadMesh);

      // 4 stubby toes with squishy digital toe pads
      for (let t = 0; t < 4; t++) {
        const toeAngle = (t - 1.5) * 0.32;
        const toeGroup = new THREE.Group();
        const dist = isFront ? 0.15 : 0.18;
        toeGroup.position.set(Math.sin(toeAngle) * dist, -0.015, Math.cos(toeAngle) * dist);
        paw.add(toeGroup);

        const toeMesh = new THREE.Mesh(new THREE.SphereGeometry(isFront ? 0.042 : 0.052, 16, 16), pawSkinMaterial);
        toeMesh.scale.set(1.0, 0.85, 1.1);
        toeGroup.add(toeMesh);

        // Digital jelly pad
        const toePadMesh = new THREE.Mesh(new THREE.SphereGeometry(isFront ? 0.032 : 0.042, 16, 16), jellyPadMaterial);
        toePadMesh.position.set(0, -0.035, 0);
        toePadMesh.scale.set(1.0, 0.65, 1.0);
        toePadMesh.castShadow = true;
        toeGroup.add(toePadMesh);
      }

      return paw;
    }

    // Front Paws (resting cutely on chest/belly)
    const frontPawL = createPaw(true, 1);
    frontPawL.position.set(0.38, -0.05, 0.85);
    frontPawL.rotation.set(-0.6, -0.25, -0.3);
    bodyGroup.add(frontPawL);

    const frontPawR = createPaw(true, -1);
    frontPawR.position.set(-0.38, -0.05, 0.85);
    frontPawR.rotation.set(-0.6, 0.25, 0.3);
    bodyGroup.add(frontPawR);

    // Rear Paws (sticking forward & outward, displaying squishy pink jelly pads directly to camera!)
    const rearPawL = createPaw(false, 1);
    rearPawL.position.set(0.72, -0.72, 0.58);
    rearPawL.rotation.set(-1.15, -0.35, -0.45);
    bodyGroup.add(rearPawL);

    const rearPawR = createPaw(false, -1);
    rearPawR.position.set(-0.72, -0.72, 0.58);
    rearPawR.rotation.set(-1.15, 0.35, 0.45);
    bodyGroup.add(rearPawR);

    // --- Proxy Collider Mesh for Mouse Sweep Raycasting ---
    const proxyGeo = new THREE.SphereGeometry(1.22, 32, 32);
    const proxyMesh = new THREE.Mesh(proxyGeo, new THREE.MeshBasicMaterial({ visible: false }));
    proxyMesh.scale.set(1.15, 1.28, 1.10);
    bodyGroup.add(proxyMesh);

    // --- PROCEDURAL BANDED QUILLS (18,500 Quills via InstancedMesh) ---
    const QUILL_COUNT = 18500;
    const quillHeight = 0.58;
    const quillGeo = new THREE.CylinderGeometry(0.003, 0.032, quillHeight, 4, 4);
    quillGeo.translate(0, quillHeight * 0.5, 0); // Base at origin

    // Painted Banding: Dark Brown Base -> Warm Honey Cream -> Tapered Ivory Tip
    const qPosAttr = quillGeo.attributes.position;
    const qColorArr = new Float32Array(qPosAttr.count * 3);
    const cBase = new THREE.Color(0x281710);
    const cMid = new THREE.Color(0xdfcfb4);
    const cTip = new THREE.Color(0xfffefa);

    for (let i = 0; i < qPosAttr.count; i++) {
      const yNorm = Math.min(Math.max(qPosAttr.getY(i) / quillHeight, 0.0), 1.0);
      let col = new THREE.Color();
      if (yNorm < 0.28) {
        col.lerpColors(cBase, new THREE.Color(0x42291b), yNorm / 0.28);
      } else if (yNorm < 0.72) {
        const t = (yNorm - 0.28) / (0.72 - 0.28);
        col.lerpColors(new THREE.Color(0x42291b), cMid, t);
      } else {
        const t = (yNorm - 0.72) / (1.0 - 0.72);
        col.lerpColors(cMid, cTip, t);
      }
      qColorArr[i * 3 + 0] = col.r;
      qColorArr[i * 3 + 1] = col.g;
      qColorArr[i * 3 + 2] = col.b;
    }
    quillGeo.setAttribute('color', new THREE.BufferAttribute(qColorArr, 3));

    // Custom Shader with Dynamic Interactive Wave & Startle Puff Bristling
    let quillUniforms = null;
    const quillMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.38,
      metalness: 0.06,
      vertexColors: true
    });

    quillMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = { value: 0 };
      shader.uniforms.uHitPoint = { value: new THREE.Vector3(0, 100, 0) };
      shader.uniforms.uHitActive = { value: 0 };
      shader.uniforms.uPuff = { value: 0 };
      quillUniforms = shader.uniforms;

      shader.vertexShader = `
        attribute vec3 aNormal;
        uniform float uTime;
        uniform vec3 uHitPoint;
        uniform float uHitActive;
        uniform float uPuff;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <project_vertex>',
        `
        vec4 qRoot4 = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vec3 qRoot = qRoot4.xyz;
        vec3 qVec = transformed - qRoot;
        float qLen = length(qVec);

        if (qLen > 0.015) {
          vec4 instWorld = modelMatrix * qRoot4;
          float distToHit = distance(instWorld.xyz, uHitPoint);

          // Wave ripple when cursor sweeps across spines
          float localWave = sin(distToHit * 15.0 - uTime * 20.0) * exp(-distToHit * 2.2);
          float localErect = exp(-distToHit * 2.8) * uHitActive;

          // Global startled puff-up wave
          float puffWave = sin(instWorld.y * 6.5 - uTime * 14.0) * uPuff;
          float totalErect = clamp(localErect * 0.75 + uPuff * 0.88 + localWave * 0.22, 0.0, 1.25);

          vec3 currentDir = qVec / qLen;
          vec3 targetDir = normalize(mix(currentDir, aNormal, totalErect * 0.82));

          // Defensive micro-vibration when bristled
          vec3 flutter = vec3(
            sin(uTime * 36.0 + qRoot.x * 45.0),
            cos(uTime * 32.0 + qRoot.y * 45.0),
            sin(uTime * 38.0 + qRoot.z * 45.0)
          ) * (0.025 * totalErect * (qLen / 0.58));

          transformed = qRoot + targetDir * qLen + flutter;
        }

        #include <project_vertex>
        `
      );
    };

    const quillMesh = new THREE.InstancedMesh(quillGeo, quillMaterial, QUILL_COUNT);
    quillMesh.castShadow = true;
    quillMesh.receiveShadow = true;

    // Distribute Quills over Back, Crown, and Flanks
    const aNormals = new Float32Array(QUILL_COUNT * 3);
    const dummyMat = new THREE.Matrix4();
    const dummyPos = new THREE.Vector3();
    const dummyQuat = new THREE.Quaternion();
    const dummyScale = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    const rx = 1.15, ry = 1.28, rz = 1.10;
    const groomDir = new THREE.Vector3(0, -0.38, -0.85).normalize();

    let qIdx = 0;
    const fibGolden = Math.PI * (3 - Math.sqrt(5));
    let seed = 0;

    while (qIdx < QUILL_COUNT) {
      seed++;
      const yUnit = 1.0 - (seed % 34000) / 17000.0;
      const radiusUnit = Math.sqrt(Math.max(0.0, 1.0 - yUnit * yUnit));
      const theta = fibGolden * seed;

      const px = Math.cos(theta) * radiusUnit * rx;
      const py = yUnit * ry;
      const pz = Math.sin(theta) * radiusUnit * rz;

      // Exclude soft belly front, paws, and face
      if (pz > 0.08 && py < 0.42) continue; // Front belly
      if (pz > 0.20 && py >= 0.42 && Math.abs(px) < 0.42) continue; // Face / Snout
      if (py < -0.88) continue; // Ground contact rump

      dummyPos.set(px, py, pz);

      // Normal on ellipsoid surface
      const norm = new THREE.Vector3(px / (rx * rx), py / (ry * ry), pz / (rz * rz)).normalize();
      aNormals[qIdx * 3 + 0] = norm.x;
      aNormals[qIdx * 3 + 1] = norm.y;
      aNormals[qIdx * 3 + 2] = norm.z;

      // Natural resting quill orientation (blend of normal + grooming flow + organic jitter)
      const qDir = norm.clone().lerp(groomDir, 0.42);
      qDir.x += (Math.random() - 0.5) * 0.18;
      qDir.y += (Math.random() - 0.5) * 0.18;
      qDir.z += (Math.random() - 0.5) * 0.18;
      qDir.normalize();

      dummyQuat.setFromUnitVectors(upAxis, qDir);

      const s = 0.85 + Math.random() * 0.30;
      dummyScale.set(s, s, s);

      dummyMat.compose(dummyPos, dummyQuat, dummyScale);
      quillMesh.setMatrixAt(qIdx, dummyMat);

      // Subtle individual color tint
      const tint = 0.92 + Math.random() * 0.16;
      quillMesh.setColorAt(qIdx, new THREE.Color(tint, tint, tint));

      qIdx++;
    }

    quillGeo.setAttribute('aNormal', new THREE.InstancedBufferAttribute(aNormals, 3));
    quillMesh.instanceMatrix.needsUpdate = true;
    quillMesh.instanceColor.needsUpdate = true;
    bodyGroup.add(quillMesh);

    // --- PROCEDURAL FLUFFY FUR STRANDS (7,500 Strands via InstancedMesh) ---
    const FUR_COUNT = 7500;
    const furHeight = 0.32;
    const furGeo = new THREE.ConeGeometry(0.012, furHeight, 3, 2);
    furGeo.translate(0, furHeight * 0.5, 0);

    const furPosAttr = furGeo.attributes.position;
    const furColorArr = new Float32Array(furPosAttr.count * 3);
    const furBaseCol = new THREE.Color(0xd6c6b2);
    const furTipCol = new THREE.Color(0xfffdf7);

    for (let i = 0; i < furPosAttr.count; i++) {
      const yNorm = Math.min(Math.max(furPosAttr.getY(i) / furHeight, 0.0), 1.0);
      const col = new THREE.Color().lerpColors(furBaseCol, furTipCol, yNorm);
      furColorArr[i * 3 + 0] = col.r;
      furColorArr[i * 3 + 1] = col.g;
      furColorArr[i * 3 + 2] = col.b;
    }
    furGeo.setAttribute('color', new THREE.BufferAttribute(furColorArr, 3));

    let furUniforms = null;
    const furMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.88,
      metalness: 0.02,
      vertexColors: true
    });

    furMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = { value: 0 };
      shader.uniforms.uHitPoint = { value: new THREE.Vector3(0, 100, 0) };
      shader.uniforms.uHitActive = { value: 0 };
      furUniforms = shader.uniforms;

      shader.vertexShader = `
        uniform float uTime;
        uniform vec3 uHitPoint;
        uniform float uHitActive;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <project_vertex>',
        `
        vec4 fRoot4 = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vec3 fRoot = fRoot4.xyz;
        vec3 fVec = transformed - fRoot;
        float fLen = length(fVec);

        if (fLen > 0.005) {
          vec4 instWorld = modelMatrix * fRoot4;
          float dist = distance(instWorld.xyz, uHitPoint);
          float touchWave = exp(-dist * 3.5) * uHitActive * sin(uTime * 12.0) * 0.035;
          float breathRustle = sin(uTime * 2.6 + fRoot.y * 8.0) * 0.018 * (fLen / 0.32);

          transformed.x += breathRustle + touchWave;
          transformed.z += touchWave * 0.5;
        }

        #include <project_vertex>
        `
      );
    };

    const furMesh = new THREE.InstancedMesh(furGeo, furMaterial, FUR_COUNT);
    furMesh.castShadow = true;

    // Distribute Fur over Belly, Chest, Throat, and Cheeks
    let fIdx = 0;
    let furSeed = 0;
    const furFlowDown = new THREE.Vector3(0, -0.85, 0.3).normalize();

    while (fIdx < FUR_COUNT) {
      furSeed++;
      const yUnit = 0.95 - (furSeed % 14000) / 7500.0;
      const radiusUnit = Math.sqrt(Math.max(0.0, 1.0 - yUnit * yUnit));
      const theta = fibGolden * furSeed;

      const px = Math.cos(theta) * radiusUnit * (rx * 0.98);
      const py = yUnit * (ry * 0.98);
      const pz = Math.sin(theta) * radiusUnit * (rz * 0.98);

      // Must be on the front belly, chest, or cheeks
      const isBelly = (pz > 0.12 && py < 0.45 && py > -0.85);
      const isChest = (pz > 0.28 && py >= 0.45 && py < 0.75 && Math.abs(px) < 0.55);
      const isCheek = (pz > 0.15 && py >= 0.35 && py < 0.70 && Math.abs(px) >= 0.32 && Math.abs(px) < 0.65);

      if (!isBelly && !isChest && !isCheek) continue;

      dummyPos.set(px, py, pz);

      const norm = new THREE.Vector3(px / (rx * rx), py / (ry * ry), pz / (rz * rz)).normalize();
      const fDir = norm.clone().lerp(furFlowDown, 0.65);
      fDir.x += (Math.random() - 0.5) * 0.25;
      fDir.y += (Math.random() - 0.5) * 0.2;
      fDir.z += (Math.random() - 0.5) * 0.25;
      fDir.normalize();

      dummyQuat.setFromUnitVectors(upAxis, fDir);

      const s = 0.8 + Math.random() * 0.45;
      dummyScale.set(s, s, s);

      dummyMat.compose(dummyPos, dummyQuat, dummyScale);
      furMesh.setMatrixAt(fIdx, dummyMat);

      fIdx++;
    }

    furMesh.instanceMatrix.needsUpdate = true;
    bodyGroup.add(furMesh);

    // --- Interactive Mouse Physics & Raycasting ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-100, -100);
    const targetHitPoint = new THREE.Vector3(0, 100, 0);
    const currentHitPoint = new THREE.Vector3(0, 100, 0);
    let hitActive = 0.0;
    let puffAmount = 0.0;
    let puffVelocity = 0.0;

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('pointerleave', () => {
      mouse.set(-100, -100);
    });

    // Startled full-body quill bristling puff on click
    window.addEventListener('pointerdown', () => {
      puffVelocity = 1.35;
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.getElapsedTime();

      // 1. Raycast for interactive mouse bristling
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(proxyMesh);
      if (intersects.length > 0) {
        targetHitPoint.copy(intersects[0].point);
        hitActive = Math.min(hitActive + dt * 6.0, 1.0);
      } else {
        hitActive = Math.max(hitActive - dt * 2.5, 0.0);
      }
      currentHitPoint.lerp(targetHitPoint, 0.18);

      // 2. Startled Puff Damped Spring Physics
      puffAmount += puffVelocity * dt;
      puffVelocity += (-puffAmount * 24.0 - puffVelocity * 5.2) * dt;
      puffAmount = Math.max(0.0, puffAmount);

      // Update shader uniforms
      if (quillUniforms) {
        quillUniforms.uTime.value = t;
        quillUniforms.uHitPoint.value.copy(currentHitPoint);
        quillUniforms.uHitActive.value = hitActive;
        quillUniforms.uPuff.value = puffAmount;
      }
      if (furUniforms) {
        furUniforms.uTime.value = t;
        furUniforms.uHitPoint.value.copy(currentHitPoint);
        furUniforms.uHitActive.value = hitActive;
      }

      // 3. Gentle Breathing Rhythm
      const breath = Math.sin(t * 2.4);
      torsoMesh.scale.set(
        1.15 + breath * 0.015 - puffAmount * 0.04,
        1.28 + breath * 0.012 - puffAmount * 0.05,
        1.10 + breath * 0.022 - puffAmount * 0.03
      );

      // 4. Snout Sniffing & Button Nose Twitching
      const sniffCycle = (t * 0.45) % 1.0;
      if (sniffCycle < 0.32) {
        const sniff = Math.sin(t * 36.0);
        snoutGroup.rotation.y = Math.sin(t * 18.0) * 0.025;
        noseGroup.position.y = 0.015 + Math.abs(sniff) * 0.022;
        noseGroup.scale.set(1.0 + sniff * 0.08, 1.0 - sniff * 0.05, 1.0 + sniff * 0.06);
      } else {
        snoutGroup.rotation.y = THREE.MathUtils.lerp(snoutGroup.rotation.y, 0, 0.1);
        noseGroup.position.y = THREE.MathUtils.lerp(noseGroup.position.y, 0.015, 0.1);
        noseGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
      }

      // 5. Paw Micro-Wiggling
      frontPawL.rotation.z = -0.3 + Math.sin(t * 1.8) * 0.035;
      frontPawR.rotation.z = 0.3 - Math.sin(t * 1.8 + 0.4) * 0.035;
      rearPawL.rotation.x = -1.15 + Math.sin(t * 2.2) * 0.025;
      rearPawR.rotation.x = -1.15 + Math.sin(t * 2.2 + 0.5) * 0.025;

      // 6. Occasional Ear Twitch
      const earTwitchCycle = Math.sin(t * 0.7);
      if (earTwitchCycle > 0.88) {
        const twitch = Math.sin(t * 40.0) * 0.08;
        earGroupL.rotation.z = -0.25 + twitch;
        earGroupR.rotation.z = 0.25 - twitch;
      } else {
        earGroupL.rotation.z = -0.25;
        earGroupR.rotation.z = 0.25;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
