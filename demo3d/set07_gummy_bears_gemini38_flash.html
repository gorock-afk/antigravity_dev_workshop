<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Translucent Gummy Bears & Squishy Bounce Physics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Scene, Camera, Renderer Setup ---
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c101a);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.4, 8.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3.2;
    controls.maxDistance = 16.0;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.target.set(0, 1.15, 0);
    controls.update();

    const clock = new THREE.Clock();

    // --- Procedural Studio HDR Environment ---
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x111622);

    const softboxGeo = new THREE.PlaneGeometry(12, 12);
    // Overhead light
    const topLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const topLight = new THREE.Mesh(softboxGeo, topLightMat);
    topLight.position.set(0, 16, 0);
    topLight.rotation.x = Math.PI / 2;
    topLight.scale.set(3, 3, 1);
    envScene.add(topLight);

    // Warm Key Softbox
    const warmLightMat = new THREE.MeshBasicMaterial({ color: 0xffeedd });
    const keySoftbox = new THREE.Mesh(softboxGeo, warmLightMat);
    keySoftbox.position.set(-14, 9, 12);
    keySoftbox.lookAt(0, 2, 0);
    keySoftbox.scale.set(2.5, 4, 1);
    envScene.add(keySoftbox);

    // Cool Rim Softbox
    const coolLightMat = new THREE.MeshBasicMaterial({ color: 0x99ccff });
    const rimSoftbox = new THREE.Mesh(softboxGeo, coolLightMat);
    rimSoftbox.position.set(14, 10, -14);
    rimSoftbox.lookAt(0, 2, 0);
    rimSoftbox.scale.set(3, 5, 1);
    envScene.add(rimSoftbox);

    // Intense pure white backlight for gelatin refraction
    const backLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const backSoftbox = new THREE.Mesh(softboxGeo, backLightMat);
    backSoftbox.position.set(0, 7, -18);
    backSoftbox.lookAt(0, 2, 0);
    backSoftbox.scale.set(5, 3, 1);
    envScene.add(backSoftbox);

    const envRenderTarget = pmremGenerator.fromScene(envScene, 0.04);
    scene.environment = envRenderTarget.texture;

    // --- Studio Three-Point Directional Lights ---
    const keyLight = new THREE.DirectionalLight(0xfff6ec, 2.8);
    keyLight.position.set(-4.5, 8.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 22;
    keyLight.shadow.camera.left = -5.5;
    keyLight.shadow.camera.right = 5.5;
    keyLight.shadow.camera.top = 5.5;
    keyLight.shadow.camera.bottom = -5.5;
    keyLight.shadow.bias = -0.0001;
    keyLight.shadow.radius = 2.5;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xa5d5ff, 1.4);
    fillLight.position.set(5.5, 4.5, 3.5);
    scene.add(fillLight);

    // Intense Backlight for transmission translucency
    const rimLight = new THREE.DirectionalLight(0xffffff, 3.6);
    rimLight.position.set(0, 5.5, -6.5);
    scene.add(rimLight);

    // Soft upward floor bounce
    const floorBounce = new THREE.PointLight(0xffeedd, 0.9, 12);
    floorBounce.position.set(0, -1.8, 0);
    scene.add(floorBounce);

    const ambientLight = new THREE.AmbientLight(0x1e2433, 0.8);
    scene.add(ambientLight);

    // --- Procedural Micro-Sugar Crystal Normal Map ---
    function createSugarSparkleNormalMap() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8080ff';
      ctx.fillRect(0, 0, 256, 256);
      const img = ctx.getImageData(0, 0, 256, 256);
      const d = img.data;
      for (let i = 0; i < 256 * 256; i++) {
        const noise = (Math.random() - 0.5) * 28;
        d[i * 4] = Math.min(255, Math.max(0, 128 + noise));
        d[i * 4 + 1] = Math.min(255, Math.max(0, 128 + noise));
        d[i * 4 + 2] = 255;
        d[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(5, 5);
      return tex;
    }
    const candyNormalMap = createSugarSparkleNormalMap();

    // --- Procedural Radial Shadow & Caustic Textures ---
    function createRadialTexture(innerAlpha, outerAlpha, rCol = 0, gCol = 0, bCol = 0) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, `rgba(${rCol}, ${gCol}, ${bCol}, ${innerAlpha})`);
      grad.addColorStop(0.4, `rgba(${rCol}, ${gCol}, ${bCol}, ${innerAlpha * 0.6})`);
      grad.addColorStop(0.75, `rgba(${rCol}, ${gCol}, ${bCol}, ${innerAlpha * 0.2})`);
      grad.addColorStop(1.0, `rgba(${rCol}, ${gCol}, ${bCol}, ${outerAlpha})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    const shadowMapTex = createRadialTexture(0.9, 0.0, 0, 0, 0);

    // --- Sleek Frosted Glass Pedestal & Base ---
    const pedestalRadius = 4.25;
    const pedestalThickness = 0.38;

    const pedestalShape = new THREE.Shape();
    pedestalShape.absarc(0, 0, pedestalRadius, 0, Math.PI * 2, false);

    const pedestalGeo = new THREE.ExtrudeGeometry(pedestalShape, {
      depth: pedestalThickness,
      bevelEnabled: true,
      bevelSegments: 8,
      steps: 1,
      bevelSize: 0.16,
      bevelThickness: 0.08
    });
    pedestalGeo.rotateX(Math.PI / 2);
    pedestalGeo.translate(0, -pedestalThickness - 0.08, 0);

    const frostedGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.94,
      opacity: 1.0,
      transparent: true,
      roughness: 0.30,
      ior: 1.52,
      thickness: 2.6,
      attenuationColor: 0xe0f7fa,
      attenuationDistance: 4.2,
      clearcoat: 0.65,
      clearcoatRoughness: 0.12
    });

    const pedestalMesh = new THREE.Mesh(pedestalGeo, frostedGlassMat);
    pedestalMesh.receiveShadow = true;
    scene.add(pedestalMesh);

    // Champagne Gold Rim Ring
    const rimRadius = pedestalRadius + 0.18;
    const rimShape = new THREE.Shape();
    rimShape.absarc(0, 0, rimRadius, 0, Math.PI * 2, false);
    const rimHole = new THREE.Path();
    rimHole.absarc(0, 0, pedestalRadius - 0.06, 0, Math.PI * 2, true);
    rimShape.holes.push(rimHole);

    const rimGeo = new THREE.ExtrudeGeometry(rimShape, {
      depth: 0.12,
      bevelEnabled: true,
      bevelThickness: 0.04,
      bevelSize: 0.04,
      bevelSegments: 4
    });
    rimGeo.rotateX(Math.PI / 2);
    rimGeo.translate(0, -pedestalThickness - 0.12, 0);

    const rimMat = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      metalness: 0.88,
      roughness: 0.22
    });
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    scene.add(rimMesh);

    // Dark Floor Plane
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x0a0e16,
      roughness: 0.75,
      metalness: 0.12
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = -pedestalThickness - 0.18;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Soft Shadow Under Pedestal
    const shadowGeo = new THREE.PlaneGeometry(12.5, 12.5);
    const shadowMat = new THREE.MeshBasicMaterial({
      map: shadowMapTex,
      transparent: true,
      opacity: 0.65,
      depthWrite: false
    });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.y = floorMesh.position.y + 0.01;
    scene.add(shadowMesh);

    // --- 5 Iconic Translucent Gummy Bear Configurations ---
    const BEAR_CONFIGS = [
      {
        name: "Ruby Raspberry Red",
        pos: new THREE.Vector3(0, 0, 0.95),
        color: 0xff0d4b,
        attenuationColor: 0x9e002c,
        attenuationDistance: 1.15,
        transmission: 0.90,
        roughness: 0.14,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        ior: 1.48,
        glowColor: [255, 13, 75],
        pose: 'welcome',
        bounceSpeed: 3.2,
        bounceAmp: 0.11,
        phase: 0.0
      },
      {
        name: "Golden Pineapple Yellow",
        pos: new THREE.Vector3(-2.2, 0, 0.45),
        color: 0xffd200,
        attenuationColor: 0xff7b00,
        attenuationDistance: 1.35,
        transmission: 0.92,
        roughness: 0.13,
        clearcoat: 1.0,
        clearcoatRoughness: 0.07,
        ior: 1.48,
        glowColor: [255, 210, 0],
        pose: 'bellyRub',
        bounceSpeed: 2.7,
        bounceAmp: 0.09,
        phase: 1.4
      },
      {
        name: "Emerald Apple Green",
        pos: new THREE.Vector3(2.2, 0, 0.45),
        color: 0x00e676,
        attenuationColor: 0x006a28,
        attenuationDistance: 1.10,
        transmission: 0.89,
        roughness: 0.15,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        ior: 1.48,
        glowColor: [0, 230, 118],
        pose: 'waveHigh',
        bounceSpeed: 3.6,
        bounceAmp: 0.13,
        phase: 2.8
      },
      {
        name: "Juicy Orange",
        pos: new THREE.Vector3(-1.35, 0, -1.35),
        color: 0xff6200,
        attenuationColor: 0xc22000,
        attenuationDistance: 1.20,
        transmission: 0.90,
        roughness: 0.14,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        ior: 1.48,
        glowColor: [255, 98, 0],
        pose: 'curious',
        bounceSpeed: 3.0,
        bounceAmp: 0.10,
        phase: 4.1
      },
      {
        name: "Clear Lemon",
        pos: new THREE.Vector3(1.35, 0, -1.35),
        color: 0xfffde8,
        attenuationColor: 0xffdf6d,
        attenuationDistance: 2.2,
        transmission: 0.95,
        roughness: 0.11,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        ior: 1.49,
        glowColor: [255, 240, 150],
        pose: 'joyJump',
        bounceSpeed: 3.9,
        bounceAmp: 0.14,
        phase: 5.3
      }
    ];

    // --- Anatomical Gummy Bear Builder ---
    const allBearMeshes = [];
    const bears = [];

    function createGummyBear(config) {
      const bearRoot = new THREE.Group();
      bearRoot.position.copy(config.pos);

      // Translucent Gelatin Physical Material
      const material = new THREE.MeshPhysicalMaterial({
        color: config.color,
        transmission: config.transmission,
        opacity: 1.0,
        transparent: true,
        roughness: config.roughness,
        metalness: 0.01,
        ior: config.ior,
        thickness: 1.85,
        attenuationColor: config.attenuationColor,
        attenuationDistance: config.attenuationDistance,
        clearcoat: config.clearcoat,
        clearcoatRoughness: config.clearcoatRoughness,
        normalMap: candyNormalMap,
        normalScale: new THREE.Vector2(0.035, 0.035),
        specularIntensity: 1.0
      });

      // Animation pivot standing on pedestal at y = 0
      const animPivot = new THREE.Group();
      bearRoot.add(animPivot);

      // 1. Chubby Pear-Shaped Torso with Anatomical Mold Seam
      const torsoGeo = new THREE.SphereGeometry(0.68, 32, 24);
      const pos = torsoGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Chubby pear taper: wider hips/waist
        const normY = (y + 0.68) / 1.36;
        const taper = 0.86 + (1 - normY) * 0.44;
        x *= taper;
        z *= taper;

        // Front belly bulge
        if (z > 0) {
          const bellyFactor = Math.sin(Math.max(0, Math.min(Math.PI, (y + 0.4) / 0.75 * Math.PI)));
          z += bellyFactor * 0.28 * Math.max(0, 1.0 - Math.abs(x) * 1.1);
        }
        // Mold seam flat back with gentle center furrow
        if (z < 0) {
          z *= 0.82;
          const furrow = Math.exp(-Math.pow(x / 0.18, 2)) * 0.055;
          z += furrow;
        }
        // Flattened bottom
        if (y < -0.5) {
          y = -0.5 + (y + 0.5) * 0.35;
        }
        pos.setXYZ(i, x, y, z);
      }
      torsoGeo.computeVertexNormals();

      const torsoMesh = new THREE.Mesh(torsoGeo, material);
      torsoMesh.position.set(0, 0.82, 0);
      torsoMesh.castShadow = true;
      torsoMesh.receiveShadow = true;
      animPivot.add(torsoMesh);

      // Rounded Chubby Belly Cap (for secondary wobble)
      const bellyGeo = new THREE.SphereGeometry(0.42, 24, 16);
      bellyGeo.scale(1.05, 0.95, 0.68);
      const bellyMesh = new THREE.Mesh(bellyGeo, material);
      bellyMesh.position.set(0, 0.68, 0.36);
      bellyMesh.castShadow = true;
      animPivot.add(bellyMesh);

      // 2. Head Joint (Pivot for Nod & Wobble)
      const headJoint = new THREE.Group();
      headJoint.position.set(0, 1.48, 0);
      animPivot.add(headJoint);

      const headGeo = new THREE.SphereGeometry(0.52, 32, 24);
      const hpos = headGeo.attributes.position;
      for (let i = 0; i < hpos.count; i++) {
        let x = hpos.getX(i);
        let y = hpos.getY(i);
        let z = hpos.getZ(i);

        // Chubby cheeks
        if (y < 0) {
          const cheekFactor = (1.0 + y / 0.52) * (-y / 0.52);
          x *= (1.0 + cheekFactor * 0.42);
        }
        if (z < 0) z *= 0.86;
        if (y > 0.32) y = 0.32 + (y - 0.32) * 0.78;
        hpos.setXYZ(i, x, y, z);
      }
      headGeo.computeVertexNormals();

      const headMesh = new THREE.Mesh(headGeo, material);
      headMesh.castShadow = true;
      headMesh.receiveShadow = true;
      headJoint.add(headMesh);

      // Embossed Muzzle / Snout
      const snoutGeo = new THREE.SphereGeometry(0.24, 24, 16);
      snoutGeo.scale(1.15, 0.85, 0.95);
      const snoutMesh = new THREE.Mesh(snoutGeo, material);
      snoutMesh.position.set(0, -0.07, 0.38);
      snoutMesh.castShadow = true;
      headJoint.add(snoutMesh);

      // Nose Bump
      const noseGeo = new THREE.SphereGeometry(0.065, 14, 10);
      noseGeo.scale(1.2, 0.8, 0.85);
      const noseMesh = new THREE.Mesh(noseGeo, material);
      noseMesh.position.set(0, 0.055, 0.22);
      snoutMesh.add(noseMesh);

      // U-Shaped Smile Groove
      const smileGeo = new THREE.TorusGeometry(0.08, 0.022, 10, 20, Math.PI * 0.85);
      smileGeo.rotateZ(Math.PI * 1.075);
      const smileMesh = new THREE.Mesh(smileGeo, material);
      smileMesh.position.set(0, -0.06, 0.20);
      snoutMesh.add(smileMesh);

      // Eye Bead Indentations
      for (const s of [-1, 1]) {
        const eyeGeo = new THREE.SphereGeometry(0.055, 14, 10);
        eyeGeo.scale(0.9, 1.1, 0.65);
        const eyeMesh = new THREE.Mesh(eyeGeo, material);
        eyeMesh.position.set(s * 0.20, 0.12, 0.44);
        headJoint.add(eyeMesh);
      }

      // Cup-Shaped Haribo Ears
      for (const s of [-1, 1]) {
        const earGroup = new THREE.Group();
        earGroup.position.set(s * 0.36, 0.42, 0.04);
        earGroup.rotation.z = -s * 0.32;
        earGroup.rotation.y = s * 0.12;
        earGroup.rotation.x = 0.08;

        const outerEarGeo = new THREE.SphereGeometry(0.21, 24, 16);
        outerEarGeo.scale(1.0, 1.0, 0.58);
        const outerEarMesh = new THREE.Mesh(outerEarGeo, material);
        outerEarMesh.castShadow = true;
        earGroup.add(outerEarMesh);

        // Inner Ear Hollow/Indent
        const innerEarGeo = new THREE.SphereGeometry(0.135, 20, 14);
        innerEarGeo.scale(0.95, 0.95, 0.35);
        const innerEarMesh = new THREE.Mesh(innerEarGeo, material);
        innerEarMesh.position.set(0, 0, 0.07);
        earGroup.add(innerEarMesh);

        headJoint.add(earGroup);
      }

      // 3. Stubby Curved Arms with Paw Indentations
      function createArm(side, poseType) {
        const armJoint = new THREE.Group();
        armJoint.position.set(side * 0.54, 1.05, 0.08);

        const upperArmLength = 0.44;
        const armRadius = 0.165;
        const armGeo = new THREE.CapsuleGeometry(armRadius, upperArmLength, 16, 16);
        const armMesh = new THREE.Mesh(armGeo, material);
        armMesh.position.set(0, -upperArmLength * 0.45, 0);
        armMesh.castShadow = true;
        armJoint.add(armMesh);

        const pawGeo = new THREE.SphereGeometry(0.18, 18, 14);
        pawGeo.scale(1.0, 0.85, 1.15);
        const pawMesh = new THREE.Mesh(pawGeo, material);
        pawMesh.position.set(0, -upperArmLength * 0.92, 0.08);
        pawMesh.castShadow = true;
        armJoint.add(pawMesh);

        for (let f = -1; f <= 1; f++) {
          const padGeo = new THREE.SphereGeometry(0.045, 10, 8);
          padGeo.scale(0.85, 0.7, 1.2);
          const padMesh = new THREE.Mesh(padGeo, material);
          padMesh.position.set(f * 0.07, -upperArmLength * 0.95, 0.20);
          armJoint.add(padMesh);
        }

        let rotX = 0.3, rotY = 0, rotZ = side * 0.25;

        if (poseType === 'welcome') {
          rotX = 0.45;
          rotZ = side * 0.45;
          rotY = -side * 0.25;
        } else if (poseType === 'bellyRub') {
          rotX = 0.75;
          rotY = -side * 0.5;
          rotZ = side * 0.15;
        } else if (poseType === 'waveHigh') {
          if (side > 0) {
            rotX = -0.3;
            rotZ = 2.4;
            rotY = 0.4;
          } else {
            rotX = 0.5;
            rotZ = -0.25;
          }
        } else if (poseType === 'curious') {
          if (side < 0) {
            rotX = 1.1;
            rotY = 0.4;
            rotZ = -0.1;
          } else {
            rotX = 0.4;
            rotZ = 0.3;
          }
        } else if (poseType === 'joyJump') {
          rotX = -0.25;
          rotZ = side * 2.3;
          rotY = -side * 0.2;
        }

        armJoint.rotation.set(rotX, rotY, rotZ);
        return { joint: armJoint, defaultRot: new THREE.Euler(rotX, rotY, rotZ) };
      }

      const leftArm = createArm(-1, config.pose);
      const rightArm = createArm(1, config.pose);
      animPivot.add(leftArm.joint);
      animPivot.add(rightArm.joint);

      // 4. Chunky Stubby Legs with Paw Pads
      function createLeg(side) {
        const legJoint = new THREE.Group();
        legJoint.position.set(side * 0.34, 0.40, 0.08);

        const thighGeo = new THREE.CapsuleGeometry(0.19, 0.26, 16, 16);
        const thighMesh = new THREE.Mesh(thighGeo, material);
        thighMesh.position.set(0, -0.10, 0);
        thighMesh.rotation.x = 0.12;
        thighMesh.rotation.z = -side * 0.15;
        thighMesh.castShadow = true;
        legJoint.add(thighMesh);

        // Foot flush with ground at y = 0
        const footGeo = new THREE.SphereGeometry(0.23, 20, 16);
        footGeo.scale(0.92, 0.55, 1.38);
        const footMesh = new THREE.Mesh(footGeo, material);
        footMesh.position.set(0, -0.26, 0.14);
        footMesh.castShadow = true;
        footMesh.receiveShadow = true;
        legJoint.add(footMesh);

        for (let t = -1; t <= 1; t++) {
          const toeGeo = new THREE.SphereGeometry(0.052, 10, 8);
          toeGeo.scale(0.85, 0.75, 1.15);
          const toeMesh = new THREE.Mesh(toeGeo, material);
          toeMesh.position.set(t * 0.078, -0.27, 0.36);
          legJoint.add(toeMesh);
        }
        return legJoint;
      }

      const leftLeg = createLeg(-1);
      const rightLeg = createLeg(1);
      animPivot.add(leftLeg);
      animPivot.add(rightLeg);

      // 5. Caustic Glow Disc on Glass Pedestal Under Bear
      const causticTex = createRadialTexture(0.75, 0.0, ...config.glowColor);
      const causticGeo = new THREE.PlaneGeometry(1.6, 1.6);
      const causticMat = new THREE.MeshBasicMaterial({
        map: causticTex,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const causticMesh = new THREE.Mesh(causticGeo, causticMat);
      causticMesh.rotation.x = -Math.PI / 2;
      causticMesh.position.set(config.pos.x, 0.005, config.pos.z);
      scene.add(causticMesh);

      // Bear Runtime State Object
      const bearData = {
        config,
        root: bearRoot,
        animPivot,
        bellyMesh,
        headJoint,
        leftArm,
        rightArm,
        leftLeg,
        rightLeg,
        material,
        causticMesh,
        // Elastic Squish Spring State
        squash: 1.0,
        squashVel: 0.0,
        wobbleX: 0.0,
        wobbleXVel: 0.0,
        wobbleZ: 0.0,
        wobbleZVel: 0.0,
        isHovered: false,
        defaultHeadRot: headJoint.rotation.clone()
      };

      bearRoot.traverse(child => {
        if (child.isMesh) {
          child.userData.bear = bearData;
          allBearMeshes.push(child);
        }
      });

      scene.add(bearRoot);
      return bearData;
    }

    BEAR_CONFIGS.forEach(cfg => {
      bears.push(createGummyBear(cfg));
    });

    // --- Dynamic Pedestal Ripple Waves ---
    const ripples = [];
    const rippleGeo = new THREE.RingGeometry(0.1, 0.22, 32);

    function createRipple(pos, rgbCol) {
      const col = new THREE.Color(`rgb(${rgbCol[0]}, ${rgbCol[1]}, ${rgbCol[2]})`);
      const mat = new THREE.MeshBasicMaterial({
        color: col,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(rippleGeo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(pos.x, 0.015, pos.z);
      scene.add(mesh);

      ripples.push({
        mesh,
        scale: 1.0,
        opacity: 0.8,
        maxScale: 4.8,
        growthSpeed: 4.2
      });
    }

    function updateRipples(dt) {
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.scale += dt * r.growthSpeed;
        r.opacity -= dt * 1.35;
        r.mesh.scale.set(r.scale, r.scale, 1);
        r.mesh.material.opacity = Math.max(0, r.opacity);

        if (r.opacity <= 0 || r.scale >= r.maxScale) {
          scene.remove(r.mesh);
          r.mesh.material.dispose();
          ripples.splice(i, 1);
        }
      }
    }

    // --- Mouse & Pointer Interaction Physics ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-9999, -9999);
    const pointerDownPos = new THREE.Vector2();

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.set(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', (e) => {
      const dist = pointerDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));
      if (dist < 6) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(allBearMeshes, true);
        if (intersects.length > 0) {
          const hitBear = intersects[0].object.userData.bear;
          if (hitBear) {
            // Strong Elastic Poke Squish
            hitBear.squashVel = -7.8;
            hitBear.wobbleXVel = (Math.random() - 0.5) * 6.5;
            hitBear.wobbleZVel = (Math.random() - 0.5) * 6.5;
            createRipple(hitBear.config.pos, hitBear.config.glowColor);
          }
        }
      }
    });

    // --- Main Physics & Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // Check Hovered Bear via Raycaster
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(allBearMeshes, true);
      let newlyHoveredBear = null;

      if (intersects.length > 0) {
        newlyHoveredBear = intersects[0].object.userData.bear;
        document.body.style.cursor = 'pointer';
      } else {
        document.body.style.cursor = 'default';
      }

      bears.forEach(bear => {
        if (bear === newlyHoveredBear) {
          if (!bear.isHovered) {
            // First frame of hover: reactive poke
            bear.squashVel -= 3.4;
            bear.wobbleXVel += (Math.random() - 0.5) * 3.2;
            bear.wobbleZVel += (Math.random() - 0.5) * 3.2;
            bear.isHovered = true;
            createRipple(bear.config.pos, bear.config.glowColor);
          }
        } else {
          bear.isHovered = false;
        }

        const cfg = bear.config;
        const bouncePhase = time * cfg.bounceSpeed + cfg.phase;
        const rawBounce = Math.sin(bouncePhase);

        // Staggered Non-linear Squishy Bounce
        let idleSquashTarget = 1.0;
        let jumpY = 0.0;

        if (rawBounce > 0) {
          // Airborne Stretch
          jumpY = Math.pow(rawBounce, 1.4) * cfg.bounceAmp * 2.2;
          idleSquashTarget = 1.0 + Math.pow(rawBounce, 1.2) * (cfg.bounceAmp * 0.85);
        } else {
          // Ground Squash Impact
          jumpY = 0.0;
          idleSquashTarget = 1.0 - Math.pow(Math.abs(rawBounce), 1.6) * (cfg.bounceAmp * 1.6);
        }

        // Additional hover compression & micro-jelly vibration
        if (bear.isHovered) {
          idleSquashTarget -= 0.12;
          bear.wobbleXVel += Math.sin(time * 18.0) * 0.22;
        }

        // Elastic 2nd-Order Spring-Damper Simulation
        const springK = 85.0;
        const damping = 9.2;
        const squashAcc = -springK * (bear.squash - idleSquashTarget) - damping * bear.squashVel;
        bear.squashVel += squashAcc * dt;
        bear.squash += bear.squashVel * dt;

        // Lateral Wobble Springs
        const wobbleK = 95.0;
        const wobbleDamp = 8.6;
        const wobbleAccX = -wobbleK * bear.wobbleX - wobbleDamp * bear.wobbleXVel;
        bear.wobbleXVel += wobbleAccX * dt;
        bear.wobbleX += bear.wobbleXVel * dt;

        const wobbleAccZ = -wobbleK * bear.wobbleZ - wobbleDamp * bear.wobbleZVel;
        bear.wobbleZVel += wobbleAccZ * dt;
        bear.wobbleZ += bear.wobbleZVel * dt;

        // Physical volume conservation: S_y * S_x * S_z = 1.0
        const currentSquash = Math.max(0.38, Math.min(1.7, bear.squash));
        const volumeScaleXZ = 1.0 / Math.sqrt(currentSquash);

        // Scale animPivot (squashes down against floor without dipping)
        bear.animPivot.scale.set(
          volumeScaleXZ * (1.0 + bear.wobbleX),
          currentSquash,
          volumeScaleXZ * (1.0 + bear.wobbleZ)
        );

        // Jump Elevation
        bear.root.position.y = cfg.pos.y + jumpY;

        // Secondary Belly Wobble
        if (bear.bellyMesh) {
          const bellyBulge = (1.0 - currentSquash) * 1.3;
          bear.bellyMesh.scale.set(
            1.05 + bear.wobbleX * 0.65,
            0.95 - (currentSquash - 1.0) * 0.45,
            0.68 + bellyBulge + bear.wobbleZ * 0.55
          );
        }

        // Head Nod & Jiggle
        bear.headJoint.rotation.x = bear.defaultHeadRot.x - bear.squashVel * 0.038 + Math.sin(bouncePhase + 0.3) * 0.045;
        bear.headJoint.rotation.z = bear.defaultHeadRot.z + bear.wobbleX * 0.38 + Math.cos(bouncePhase * 0.7) * 0.035;
        bear.headJoint.rotation.y = bear.defaultHeadRot.y + bear.wobbleZ * 0.28;

        // Arm Jiggle
        const armJiggle = bear.squashVel * 0.065 + Math.sin(bouncePhase + 0.6) * 0.09;
        bear.leftArm.joint.rotation.z = bear.leftArm.defaultRot.z + armJiggle;
        bear.rightArm.joint.rotation.z = bear.rightArm.defaultRot.z - armJiggle;

        // Caustic Glow Intensity Response
        if (bear.causticMesh) {
          const glowScale = (1.0 + (1.0 - currentSquash) * 0.75) / (1.0 + jumpY * 2.0);
          bear.causticMesh.scale.set(glowScale, glowScale, 1);
          bear.causticMesh.material.opacity = Math.max(0.1, 0.45 / (1.0 + jumpY * 3.5));
        }
      });

      updateRipples(dt);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- Window Resize Handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
