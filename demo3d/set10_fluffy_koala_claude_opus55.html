<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- renderer / scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const BG = new THREE.Color(0xd3dcd7);
scene.background = BG;
scene.fog = new THREE.Fog(BG, 10, 26);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(-1.75, 0.95, 4.3);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------------------------------------------------------------- lights (three-point studio)
scene.add(new THREE.HemisphereLight(0xf3f6ff, 0x8a8f7e, 0.45));
const key = new THREE.DirectionalLight(0xfff1e2, 2.4);
key.position.set(-3.5, 6, 4.5);
key.target.position.set(0, 0, 0.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -4;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 25;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xdfe9ff, 0.7);
fill.position.set(4.5, 2, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 2.0);
rim.position.set(1.5, 4, -5);
scene.add(rim);

// ---------------------------------------------------------------- floor + contact shadow
const GROUND_Y = -2.1;
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0xc9d3ce, roughness: 1, metalness: 0 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = GROUND_Y;
floor.receiveShadow = true;
scene.add(floor);

function blobTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.75)');
  gr.addColorStop(0.45, 'rgba(0,0,0,0.3)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const blobTex = blobTexture();

// ---------------------------------------------------------------- shared helpers
const UP = new THREE.Vector3(0, 1, 0);
const ZX = new THREE.Vector3(0, 0, 1);
const randVec = s => new THREE.Vector3((Math.random() - 0.5) * 2 * s, (Math.random() - 0.5) * 2 * s, (Math.random() - 0.5) * 2 * s);
function ellipsoidSample(a, b, c) {
  const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
  const x = r * Math.cos(th), y = u, z = r * Math.sin(th);
  return { p: new THREE.Vector3(a * x, b * y, c * z), n: new THREE.Vector3(x / a, y / b, z / c).normalize() };
}

// ---------------------------------------------------------------- eucalyptus trunk
const TILT = 0.5;
const AX = new THREE.Vector3(Math.sin(TILT), Math.cos(TILT), 0);
const BX = new THREE.Vector3().crossVectors(AX, ZX).normalize();
const T0 = new THREE.Vector3(0, 0, 0.62);
const S_MIN = -2.75, S_MAX = 4.0;
const trunkR = s => 0.245 - 0.0225 * s;
const trunkC = s => T0.clone().addScaledVector(AX, s);
const radialDir = a => ZX.clone().multiplyScalar(Math.cos(a)).addScaledVector(BX, Math.sin(a));
const tangentDir = a => ZX.clone().multiplyScalar(-Math.sin(a)).addScaledVector(BX, Math.cos(a));
function insideTrunk(p, margin) {
  const v = p.clone().sub(T0);
  const s = v.dot(AX);
  if (s < S_MIN || s > S_MAX) return false;
  v.addScaledVector(AX, -s);
  return v.length() < trunkR(s) + margin;
}

function barkTexture() {
  const W = 512, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#9a8d7a'; g.fillRect(0, 0, W, H);
  const cols = ['#cbbfa6', '#b4a98f', '#8f9180', '#a39a86', '#dad1bd', '#7d7466', '#a8a28c'];
  g.filter = 'blur(9px)';
  for (let i = 0; i < 80; i++) {
    g.fillStyle = cols[i % cols.length];
    g.globalAlpha = 0.3 + Math.random() * 0.45;
    const x = Math.random() * W, y = Math.random() * H, rx = 20 + Math.random() * 60, ry = 40 + Math.random() * 150;
    for (const ox of [-W, 0, W]) { g.beginPath(); g.ellipse(x + ox, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
  }
  g.filter = 'none';
  g.globalAlpha = 1;
  for (let i = 0; i < 1500; i++) {
    const x = Math.random() * W, y = Math.random() * H, l = 20 + Math.random() * 130;
    g.strokeStyle = Math.random() < 0.5 ? 'rgba(60,48,36,0.18)' : 'rgba(238,228,208,0.15)';
    g.lineWidth = 0.6 + Math.random() * 1.8;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x + (Math.random() - 0.5) * 6, y + l * 0.33, x + (Math.random() - 0.5) * 6, y + l * 0.66, x + (Math.random() - 0.5) * 4, y + l);
    g.stroke();
  }
  for (let i = 0; i < 110; i++) {
    const x = Math.random() * W, y = Math.random() * H, l = 8 + Math.random() * 30;
    g.strokeStyle = 'rgba(45,36,28,0.45)'; g.lineWidth = 1 + Math.random() * 1.5;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l * 0.5, y + (Math.random() - 0.5) * 6, x + l, y + (Math.random() - 0.5) * 4); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 3);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const barkTex = barkTexture();
const trunkMat = new THREE.MeshStandardMaterial({ map: barkTex, bumpMap: barkTex, bumpScale: 1.5, roughness: 0.86, metalness: 0, envMapIntensity: 0.6 });
{
  const len = S_MAX - S_MIN, sc = (S_MAX + S_MIN) / 2;
  const tg = new THREE.CylinderGeometry(trunkR(S_MAX), trunkR(S_MIN), len, 64, 110, false);
  const p = tg.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ang = Math.atan2(x, z), s = y + sc;
    let f = 1 + 0.035 * Math.sin(ang * 5 + s * 1.7) + 0.025 * Math.sin(ang * 9 - s * 3.1) + 0.018 * Math.sin(s * 11 + ang * 3);
    f += 0.5 * Math.exp(-(s - S_MIN) * 3.0);
    p.setXYZ(i, x * f, y, z * f);
  }
  tg.computeVertexNormals();
  const trunk = new THREE.Mesh(tg, trunkMat);
  trunk.position.copy(trunkC(sc));
  trunk.rotation.z = -TILT;
  trunk.castShadow = true; trunk.receiveShadow = true;
  scene.add(trunk);
  const sGround = (GROUND_Y - T0.y) / AX.y;
  const gp = trunkC(sGround);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.4), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.65 }));
  blob.rotation.x = -Math.PI / 2;
  blob.position.set(gp.x + 0.08, GROUND_Y + 0.004, gp.z);
  scene.add(blob);
}

// ---------------------------------------------------------------- eucalyptus leaves & twigs
function leafTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 128, 0);
  gr.addColorStop(0, '#5f8679'); gr.addColorStop(0.5, '#95b9ac'); gr.addColorStop(1, '#5f8679');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 512);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${(200 + Math.random() * 40) | 0},${(220 + Math.random() * 30) | 0},215,${Math.random() * 0.08})`;
    g.fillRect(Math.random() * 128, Math.random() * 512, 2 + Math.random() * 4, 2 + Math.random() * 6);
  }
  g.strokeStyle = 'rgba(215,230,205,0.35)'; g.lineWidth = 1;
  for (let y = 30; y < 520; y += 22) {
    g.beginPath(); g.moveTo(64, y); g.quadraticCurveTo(90, y - 14, 124, y - 34); g.stroke();
    g.beginPath(); g.moveTo(64, y); g.quadraticCurveTo(38, y - 14, 4, y - 34); g.stroke();
  }
  g.strokeStyle = 'rgba(225,232,200,0.85)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(64, 0); g.lineTo(64, 512); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function makeLeafGeo() {
  const L = 0.40, W = 0.055;
  const g = new THREE.PlaneGeometry(1, 1, 4, 18);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i), v = p.getY(i) + 0.5;
    const w = W * Math.pow(Math.max(0, Math.sin(Math.PI * v)), 0.75) * (1.15 - 0.45 * v);
    p.setXYZ(i, u * 2 * w + 0.06 * v * v, v * L, Math.abs(u) * 2 * w * 0.45 - 0.05 * v * v);
  }
  g.computeVertexNormals();
  return g;
}
const leafTex = leafTexture();
const leafGeo = makeLeafGeo();
const leafMats = [0xffffff, 0xdfeee6, 0xc9ddd2, 0xf0e2d6].map(c => new THREE.MeshStandardMaterial({ map: leafTex, color: c, roughness: 0.55, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.7 }));
const twigMat = new THREE.MeshStandardMaterial({ color: 0x7c6a58, roughness: 0.8 });
const swayers = [];

function makeTwig(s, a, len, upBias, nLeaves) {
  const rd = radialDir(a);
  const base = trunkC(s).addScaledVector(rd, trunkR(s) * 0.85);
  const dir = rd.clone().addScaledVector(AX, upBias).normalize();
  const pivot = new THREE.Group();
  pivot.position.copy(base);
  const baseQ = new THREE.Quaternion().setFromUnitVectors(UP, dir);
  pivot.quaternion.copy(baseQ);
  scene.add(pivot);
  const tg = new THREE.CylinderGeometry(0.011, 0.03, len, 8, 6);
  tg.translate(0, len / 2, 0);
  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) { const f = tp.getY(i) / len; tp.setX(i, tp.getX(i) + 0.08 * f * f); }
  tg.computeVertexNormals();
  const tm = new THREE.Mesh(tg, twigMat);
  tm.castShadow = true;
  pivot.add(tm);
  swayers.push({ obj: pivot, q: baseQ.clone(), p: Math.random() * 6.28, f: 0.6 + Math.random() * 0.3, amp: 0.045 });
  const invQ = baseQ.clone().invert();
  const gLocal = new THREE.Vector3(0, -1, 0).applyQuaternion(invQ);
  const addLeaf = (t, ld) => {
    const lp = new THREE.Group();
    lp.position.set(0.08 * t * t, t * len, 0);
    ld.addScaledVector(gLocal, 0.8).normalize();
    const lq = new THREE.Quaternion().setFromUnitVectors(UP, ld);
    lq.multiply(new THREE.Quaternion().setFromAxisAngle(UP, Math.random() * Math.PI * 2));
    lp.quaternion.copy(lq);
    const leaf = new THREE.Mesh(leafGeo, leafMats[(Math.random() * leafMats.length) | 0]);
    leaf.scale.setScalar(0.8 + Math.random() * 0.45);
    leaf.castShadow = true; leaf.receiveShadow = true;
    lp.add(leaf);
    pivot.add(lp);
    swayers.push({ obj: lp, q: lq.clone(), p: Math.random() * 6.28, f: 1.1 + Math.random() * 0.9, amp: 0.1 + Math.random() * 0.08 });
  };
  for (let i = 0; i < nLeaves; i++) {
    const t = 0.25 + 0.7 * (i / Math.max(1, nLeaves - 1));
    const side = i % 2 ? 1 : -1;
    addLeaf(t, new THREE.Vector3(side * (0.6 + Math.random() * 0.3), 0.35 + Math.random() * 0.3, (Math.random() - 0.5) * 0.8));
  }
  for (let k = 0; k < 3; k++) addLeaf(1.0, new THREE.Vector3((k - 1) * 0.5 + (Math.random() - 0.5) * 0.2, 1.0, (Math.random() - 0.5) * 0.6));
}
makeTwig(1.6, 0.9, 0.9, 0.2, 7);
makeTwig(2.0, -1.2, 1.05, 0.1, 8);
makeTwig(2.6, 1.8, 0.9, 0.5, 6);
makeTwig(-1.3, 1.6, 0.85, 0.6, 6);
makeTwig(-1.9, -1.5, 0.75, 0.5, 5);
makeTwig(3.0, 0.4, 0.9, 1.0, 6);
makeTwig(3.6, -1.0, 0.8, 0.9, 6);
makeTwig(3.9, 1.0, 0.6, 1.4, 5);

// ---------------------------------------------------------------- fur material (GPU brushing / breeze / fluff)
const furUniforms = {
  uTime: { value: 0 },
  uPets: { value: Array.from({ length: 6 }, () => new THREE.Vector4(0, 0, 0, 0)) },
  uDirs: { value: Array.from({ length: 6 }, () => new THREE.Vector3()) },
  uRad: { value: 0.36 },
  uFluff: { value: 0 },
  uFluffPos: { value: new THREE.Vector3(0, 100, 0) }
};
const furMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, metalness: 0, envMapIntensity: 0.55 });
furMat.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, furUniforms);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
uniform float uTime;
uniform vec4 uPets[6];
uniform vec3 uDirs[6];
uniform float uRad;
uniform float uFluff;
uniform vec3 uFluffPos;
varying float vH;
float fhash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }`)
    .replace('#include <defaultnormal_vertex>', `#include <defaultnormal_vertex>
#ifdef USE_INSTANCING
{
  mat3 fim = mat3(instanceMatrix);
  vec3 fAxis = normalize(fim[1]);
  vec3 fRad = normalize(fim * vec3(normal.x, 0.0, normal.z) + vec3(1e-6));
  transformedNormal = normalize(normalMatrix * normalize(mix(fRad, fAxis, 0.62)));
}
#endif`)
    .replace('#include <project_vertex>', `
vH = position.y;
#ifdef USE_INSTANCING
mat4 fIM = instanceMatrix;
#else
mat4 fIM = mat4(1.0);
#endif
mat4 fMM = modelMatrix * fIM;
vec4 wPos = fMM * vec4(transformed, 1.0);
vec3 wRoot = (fMM * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
vec3 wTip = (fMM * vec4(0.0, 1.0, 0.0, 1.0)).xyz;
vec3 sDir = wTip - wRoot;
float sLen = length(sDir);
sDir /= max(sLen, 1e-5);
float hh = position.y * position.y;
float rnd = fhash(wRoot);
vec3 disp = vec3(0.0);
disp.y -= 0.35 * hh * sLen * (1.0 - abs(sDir.y) * 0.5);
disp += vec3(sin(uTime * 1.7 + rnd * 6.28 + wRoot.y * 4.0), sin(uTime * 1.3 + rnd * 4.0) * 0.5, cos(uTime * 1.5 + rnd * 5.0 + wRoot.x * 4.0)) * 0.07 * hh * sLen;
for (int i = 0; i < 6; i++) {
  vec4 P = uPets[i];
  if (abs(P.w) < 0.001) continue;
  vec3 toR = wRoot - P.xyz;
  float d = length(toR);
  float w = P.w * (1.0 - smoothstep(0.0, uRad, d));
  vec3 away = toR / max(d, 1e-4);
  disp += (away * 0.55 + uDirs[i] * 1.1 - sDir * 0.3) * w * hh * sLen * 1.4;
}
float fd = length(wRoot - uFluffPos);
float fw = uFluff * (1.0 - smoothstep(0.0, 0.9, fd));
disp += (sDir * 0.6 + (vec3(fhash(wRoot + 1.3), fhash(wRoot + 2.7), fhash(wRoot + 4.1)) - 0.5) * 0.9) * fw * position.y * sLen;
wPos.xyz += disp;
vec4 mvPosition = viewMatrix * wPos;
gl_Position = projectionMatrix * mvPosition;
`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
varying float vH;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
diffuseColor.rgb *= mix(0.42, 1.12, smoothstep(0.0, 1.0, vH));`);
};

const furGeo = new THREE.ConeGeometry(1, 1, 3, 3, true);
furGeo.translate(0, 0.5, 0);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _s = new THREE.Vector3();
let totalStrands = 0;
const furJobs = [];
function buildFur(parent, count, sampler) {
  const mesh = new THREE.InstancedMesh(furGeo, furMat, count);
  let n = 0, tries = 0;
  while (n < count && tries < count * 10) {
    tries++;
    const r = sampler();
    if (!r) continue;
    _q.setFromUnitVectors(UP, r.d);
    _q2.setFromAxisAngle(UP, Math.random() * Math.PI * 2);
    _q.multiply(_q2);
    _s.set(r.th, r.len, r.th);
    _m.compose(r.p, _q, _s);
    mesh.setMatrixAt(n, _m);
    mesh.setColorAt(n, r.col);
    n++;
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.frustumCulled = false;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  totalStrands += n;
  return mesh;
}

const C_GREY = new THREE.Color(0x9a9ca2), C_GREY_D = new THREE.Color(0x74767c), C_SILVER = new THREE.Color(0xcbcdd2);
const C_WHITE = new THREE.Color(0xf5f3ef), C_CREAM = new THREE.Color(0xe6e1d8);
function greyCol() {
  const c = C_GREY.clone(); const r = Math.random();
  if (r < 0.25) c.lerp(C_GREY_D, Math.random() * 0.8);
  else if (r > 0.6) c.lerp(C_SILVER, Math.random() * 0.9);
  return c;
}
const whiteCol = () => C_WHITE.clone().lerp(C_CREAM, Math.random() * 0.6);
const silverCol = () => C_SILVER.clone().lerp(C_WHITE, Math.random() * 0.6);

// ---------------------------------------------------------------- koala body
const koala = new THREE.Group();
scene.add(koala);
const sphereGeo = new THREE.SphereGeometry(1, 40, 28);
const hullGeo = new THREE.SphereGeometry(1, 18, 12);
const hullMat = new THREE.MeshBasicMaterial({ visible: false });
const hitMeshes = [];
const skin = hex => new THREE.MeshStandardMaterial({ color: hex, roughness: 1, metalness: 0 });
const greySkin = skin(0x85878c), lightSkin = skin(0xb2b3b5), pawSkin = skin(0x4a4a4e), earSkin = skin(0x8e9095);
function addSkin(parent, rx, ry, rz, mat, pos) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.scale.set(rx, ry, rz);
  if (pos) m.position.copy(pos);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  const h = new THREE.Mesh(hullGeo, hullMat);
  h.scale.set(rx + 0.1, ry + 0.1, rz + 0.1);
  if (pos) h.position.copy(pos);
  parent.add(h);
  hitMeshes.push(h);
  return m;
}

// torso + hips
const torso = new THREE.Group();
torso.position.set(0, -0.08, 0);
torso.rotation.z = -0.1;
koala.add(torso);
addSkin(torso, 0.6, 0.72, 0.52, lightSkin);
const hips = new THREE.Group();
hips.position.set(0, -0.48, -0.04);
torso.add(hips);
addSkin(hips, 0.56, 0.42, 0.5, lightSkin);

// head
const head = new THREE.Group();
const headBase = new THREE.Vector3(-0.2, 0.92, 0.1);
const headRot = new THREE.Euler(0.06, -0.22, -0.12);
head.position.copy(headBase);
head.rotation.copy(headRot);
koala.add(head);
const HA = 0.6, HB = 0.52, HC = 0.5;
addSkin(head, HA, HB, HC, greySkin);

// eyes
const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x1a0f0a, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6 });
const socketMat = skin(0x3b3b3e);
const lidMat = new THREE.MeshStandardMaterial({ color: 0x5d5f64, roughness: 0.75, side: THREE.DoubleSide });
const catchMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
function makeEye(side) {
  const dir = new THREE.Vector3(side * 0.36, 0.17, 0.92).normalize();
  const surf = new THREE.Vector3(HA * dir.x, HB * dir.y, HC * dir.z);
  const nrm = new THREE.Vector3(surf.x / (HA * HA), surf.y / (HB * HB), surf.z / (HC * HC)).normalize();
  const g = new THREE.Group();
  g.position.copy(surf).multiplyScalar(0.965);
  g.quaternion.setFromUnitVectors(ZX, nrm);
  head.add(g);
  const sock = new THREE.Mesh(sphereGeo, socketMat);
  sock.scale.set(0.068, 0.064, 0.04); sock.position.z = -0.012;
  g.add(sock);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.055, 32, 24), eyeMat);
  g.add(ball);
  const cl = new THREE.Mesh(new THREE.SphereGeometry(0.011, 12, 8), catchMat);
  cl.position.set(-0.018, 0.022, 0.047);
  g.add(cl);
  const cl2 = new THREE.Mesh(new THREE.SphereGeometry(0.005, 8, 6), catchMat);
  cl2.position.set(0.02, -0.015, 0.05);
  g.add(cl2);
  const lidPivot = new THREE.Group();
  const lid = new THREE.Mesh(new THREE.SphereGeometry(0.072, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), lidMat);
  lid.castShadow = false;
  lidPivot.add(lid);
  lidPivot.rotation.x = -0.5;
  g.add(lidPivot);
  return { g, lidPivot, pos: g.position.clone() };
}
const eyes = [makeEye(-1), makeEye(1)];

// nose
const noseBump = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    const v = (Math.random() * 120 + 60) | 0;
    g.fillStyle = `rgba(${v},${v},${v},0.5)`;
    g.beginPath(); g.arc(Math.random() * 256, Math.random() * 256, 0.8 + Math.random() * 2.2, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
const noseMat = new THREE.MeshPhysicalMaterial({ color: 0x232326, roughness: 0.42, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.4, bumpMap: noseBump, bumpScale: 1.2, envMapIntensity: 1.0 });
const nostrilMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.7 });
const noseCenter = new THREE.Vector3(0, -0.07, 0.5);
const noseG = new THREE.Group();
noseG.position.copy(noseCenter);
noseG.rotation.x = -0.12;
head.add(noseG);
{
  const nose = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), noseMat);
  nose.scale.set(0.15, 0.21, 0.12);
  nose.castShadow = true;
  noseG.add(nose);
  for (const side of [-1, 1]) {
    const ns = new THREE.Mesh(sphereGeo, nostrilMat);
    ns.scale.set(0.036, 0.02, 0.02);
    ns.position.set(side * 0.058, -0.13, 0.072);
    ns.rotation.z = side * 0.55;
    noseG.add(ns);
  }
}

// ears
const pinkMat = new THREE.MeshPhysicalMaterial({ color: 0xe9a3a6, roughness: 0.6, sheen: 0.6, sheenColor: new THREE.Color(0xffd6d6) });
function makeEar(side) {
  const g = new THREE.Group();
  g.position.set(side * 0.5, 0.34, -0.04);
  const base = new THREE.Euler(-0.1, side * 0.38, -side * 0.28);
  g.rotation.copy(base);
  head.add(g);
  addSkin(g, 0.3, 0.28, 0.085, earSkin);
  const pink = new THREE.Mesh(sphereGeo, pinkMat);
  pink.scale.set(0.2, 0.19, 0.04);
  pink.position.z = 0.055;
  g.add(pink);
  return { g, base, side, next: 1.5 + Math.random() * 4, t0: -10 };
}
const ears = [makeEar(-1), makeEar(1)];

// limbs, paws, claws
const clawGeo = (() => {
  const g = new THREE.ConeGeometry(0.014, 0.11, 8, 6);
  g.translate(0, 0.055, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const tt = p.getY(i) / 0.11; p.setZ(i, p.getZ(i) - 0.065 * tt * tt); }
  g.computeVertexNormals();
  return g;
})();
const clawMat = new THREE.MeshPhysicalMaterial({ color: 0x2b2622, roughness: 0.28, clearcoat: 0.6, metalness: 0 });

function makePaw(s, a, isFoot) {
  const r = trunkR(s), rd = radialDir(a), C = trunkC(s);
  const X = new THREE.Vector3().crossVectors(AX, rd);
  const g = new THREE.Group();
  g.position.copy(C).addScaledVector(rd, r + (isFoot ? 0.075 : 0.065));
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, AX, rd));
  koala.add(g);
  const sz = isFoot ? [0.15, 0.12, 0.09] : [0.13, 0.11, 0.085];
  addSkin(g, sz[0], sz[1], sz[2], pawSkin);
  const sign = a < 0 ? 1 : -1;
  const td = tangentDir(a).multiplyScalar(sign);
  const cx = new THREE.Vector3().crossVectors(td, rd);
  const cq = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(cx, td, rd));
  for (let k = 0; k < 4; k++) {
    const off = (k - 1.5) * (isFoot ? 0.045 : 0.04);
    const claw = new THREE.Mesh(clawGeo, clawMat);
    claw.position.copy(C).addScaledVector(rd, r + 0.03).addScaledVector(td, isFoot ? 0.1 : 0.085).addScaledVector(AX, off);
    claw.quaternion.copy(cq);
    claw.castShadow = true;
    koala.add(claw);
  }
  furJobs.push(() => buildFur(g, 280, () => {
    const e = ellipsoidSample(sz[0], sz[1], sz[2]);
    if (e.n.z < -0.25) return null;
    const wp = e.p.clone().applyMatrix4(g.matrixWorld);
    if (insideTrunk(wp, 0.005)) return null;
    const d = e.n.clone().add(randVec(0.3)).normalize();
    return { p: e.p.multiplyScalar(0.985), d, len: 0.055 + Math.random() * 0.03, th: 0.012 + Math.random() * 0.004, col: greyCol().lerp(C_GREY_D, 0.3) };
  }));
  return g.position.clone();
}
function makeLimb(p0, p1, rad, count, baseLen, lightChance) {
  const g = new THREE.Group();
  const dir = p1.clone().sub(p0); const len = dir.length(); dir.normalize();
  g.position.copy(p0).add(p1).multiplyScalar(0.5);
  g.quaternion.setFromUnitVectors(UP, dir);
  koala.add(g);
  const a = rad, b = len * 0.5 + rad * 0.3, c = rad;
  addSkin(g, a, b, c, greySkin);
  furJobs.push(() => buildFur(g, count, () => {
    const e = ellipsoidSample(a, b, c);
    const wp = e.p.clone().applyMatrix4(g.matrixWorld);
    if (insideTrunk(wp, 0.01)) return null;
    const n = e.n;
    const comb = UP.clone().addScaledVector(n, -n.y);
    const d = n.clone().addScaledVector(comb, 0.55).add(randVec(0.28)).normalize();
    return { p: e.p.multiplyScalar(0.985), d, len: baseLen + Math.random() * 0.045, th: 0.013 + Math.random() * 0.005, col: Math.random() < lightChance ? silverCol() : greyCol() };
  }));
}
const pawL = makePaw(0.5, -0.75, false);
const pawR = makePaw(0.75, 0.7, false);
const footL = makePaw(-0.75, -1.3, true);
const footR = makePaw(-0.55, 0.85, true);
makeLimb(new THREE.Vector3(-0.42, 0.36, 0.2), pawL, 0.15, 1600, 0.1, 0.15);
makeLimb(new THREE.Vector3(0.44, 0.36, 0.2), pawR, 0.15, 1600, 0.1, 0.15);
makeLimb(new THREE.Vector3(-0.4, -0.55, 0.15), footL, 0.17, 1800, 0.11, 0.1);
makeLimb(new THREE.Vector3(0.36, -0.58, 0.15), footR, 0.17, 1800, 0.11, 0.1);

// ---------------------------------------------------------------- fur jobs for torso / hips / head / ears
furJobs.push(() => buildFur(torso, 7200, () => {
  const e = ellipsoidSample(0.6, 0.72, 0.52);
  const n = e.n;
  const wp = e.p.clone().applyMatrix4(torso.matrixWorld);
  if (insideTrunk(wp, 0.0)) return null;
  const white = n.z > 0.3 + Math.random() * 0.15 && n.y < 0.72;
  const comb = new THREE.Vector3(0, -1, 0).addScaledVector(n, n.y);
  const d = n.clone().addScaledVector(comb, 0.45).add(randVec(0.3)).normalize();
  return { p: e.p.multiplyScalar(0.985), d, len: (white ? 0.13 : 0.12) + Math.random() * 0.06, th: 0.013 + Math.random() * 0.005, col: white ? whiteCol() : greyCol() };
}));
furJobs.push(() => buildFur(hips, 2600, () => {
  const e = ellipsoidSample(0.56, 0.42, 0.5);
  const n = e.n, p = e.p;
  const wp = p.clone().applyMatrix4(hips.matrixWorld);
  if (insideTrunk(wp, 0.0)) return null;
  let col = greyCol();
  if (n.z > 0.25 + Math.random() * 0.15) col = whiteCol();
  else if (n.z < -0.2 && n.y < 0.3) {
    const spot = Math.sin(p.x * 18) * Math.sin(p.y * 15 + 1) * Math.sin(p.z * 17 + 2);
    if (spot > 0.3) col = whiteCol();
  }
  const comb = new THREE.Vector3(0, -1, 0).addScaledVector(n, n.y);
  const d = n.clone().addScaledVector(comb, 0.4).add(randVec(0.3)).normalize();
  return { p: p.multiplyScalar(0.985), d, len: 0.12 + Math.random() * 0.06, th: 0.013 + Math.random() * 0.005, col };
}));
furJobs.push(() => buildFur(head, 6400, () => {
  const e = ellipsoidSample(HA, HB, HC);
  const p = e.p, n = e.n;
  const de = Math.min(p.distanceTo(eyes[0].pos), p.distanceTo(eyes[1].pos));
  if (de < 0.085) return null;
  const nx = p.x / 0.2, ny = (p.y - noseCenter.y) / 0.27;
  if (p.z > 0.2 && nx * nx + ny * ny < 1) return null;
  let len = 0.1 + Math.random() * 0.04;
  let col = greyCol();
  if (n.z > 0.55) len = 0.055 + Math.random() * 0.025;
  if (de < 0.15) len = 0.035 + Math.random() * 0.02;
  if (Math.abs(n.x) > 0.6 && n.y < 0.35) len = 0.13 + Math.random() * 0.05;
  if (n.y < -0.45 && n.z > -0.2) { col = whiteCol(); len = 0.11 + Math.random() * 0.05; }
  if (n.z > 0.4 && n.y < -0.15 && Math.abs(p.x) < 0.33) col = silverCol();
  const comb = new THREE.Vector3(p.x * 0.6, -0.25, -0.35);
  comb.addScaledVector(n, -comb.dot(n));
  const d = n.clone().addScaledVector(comb, 0.5).add(randVec(0.28)).normalize();
  return { p: p.multiplyScalar(0.985), d, len, th: 0.012 + Math.random() * 0.005, col };
}));
for (const ear of ears) {
  const g = ear.g;
  furJobs.push(() => buildFur(g, 900, () => {
    const e = ellipsoidSample(0.3, 0.28, 0.085);
    if (e.n.z > 0.25) return null;
    const rad = new THREE.Vector3(e.p.x, e.p.y, 0).normalize();
    const d = e.n.clone().addScaledVector(rad, 0.5).add(randVec(0.3)).normalize();
    return { p: e.p.multiplyScalar(0.985), d, len: 0.07 + Math.random() * 0.04, th: 0.011 + Math.random() * 0.004, col: Math.random() < 0.25 ? silverCol() : greyCol() };
  }));
  furJobs.push(() => buildFur(g, 1200, () => {
    const phi = Math.random() * Math.PI * 2;
    const k = 0.9 + Math.random() * 0.1;
    const p = new THREE.Vector3(0.29 * Math.cos(phi) * k, 0.27 * Math.sin(phi) * k, -0.02 + Math.random() * 0.07);
    const d = new THREE.Vector3(Math.cos(phi), Math.sin(phi), 0.45 + Math.random() * 0.5).normalize().add(randVec(0.35)).normalize();
    const outer = Math.max(0, 0.5 * Math.sin(phi) + 0.5 * Math.cos(phi) * ear.side);
    const len = (0.15 + Math.random() * 0.17) * (0.8 + 0.5 * outer);
    return { p, d, len, th: 0.008 + Math.random() * 0.003, col: Math.random() < 0.8 ? whiteCol() : silverCol() };
  }));
  furJobs.push(() => buildFur(g, 600, () => {
    const phi = Math.random() * Math.PI * 2;
    const k = 0.55 + Math.random() * 0.45;
    const p = new THREE.Vector3(0.2 * k * Math.cos(phi), 0.19 * k * Math.sin(phi), 0.07);
    const d = new THREE.Vector3(Math.cos(phi) * 0.7, Math.sin(phi) * 0.7, 0.9).add(randVec(0.3)).normalize();
    return { p, d, len: 0.1 + Math.random() * 0.1, th: 0.008 + Math.random() * 0.003, col: whiteCol() };
  }));
}

scene.updateMatrixWorld(true);
for (const job of furJobs) job();
console.log('Koala fur strands:', totalStrands);

// ---------------------------------------------------------------- interaction (Raycaster petting)
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const petData = Array.from({ length: 6 }, () => ({ s: 0, age: 99 }));
let petIdx = 0, lastHit = null, lastPetTime = 0;
let pointerDown = false, pointerDownOnKoala = false;
let fluffE = 0;
let controls = null;
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  return hits.length ? hits[0].point.clone() : null;
}
function addPet(point, dirVec, strength) {
  petIdx = (petIdx + 1) % 6;
  furUniforms.uPets.value[petIdx].set(point.x, point.y, point.z, 0);
  furUniforms.uDirs.value[petIdx].copy(dirVec);
  petData[petIdx].s = strength;
  petData[petIdx].age = 0;
}
canvas.addEventListener('pointerdown', (e) => {
  pointerDown = true;
  const p = pick(e);
  if (p) {
    pointerDownOnKoala = true;
    if (controls) controls.enabled = false;
    fluffE = 1;
    furUniforms.uFluffPos.value.copy(p);
    lastHit = p;
    addPet(p, new THREE.Vector3(), 1.0);
    const near = ears.reduce((best, ear) => {
      const ep = new THREE.Vector3().setFromMatrixPosition(ear.g.matrixWorld);
      return ep.distanceTo(p) < best.d ? { d: ep.distanceTo(p), ear } : best;
    }, { d: Infinity, ear: ears[0] });
    near.ear.next = 0;
  }
}, { capture: true });
window.addEventListener('pointerup', () => {
  pointerDown = false;
  if (pointerDownOnKoala) { pointerDownOnKoala = false; if (controls) controls.enabled = true; }
});
canvas.addEventListener('pointermove', (e) => {
  if (pointerDown && !pointerDownOnKoala) return;
  const p = pick(e);
  const now = performance.now() / 1000;
  if (!p) { lastHit = null; return; }
  if (!lastHit) { lastHit = p; addPet(p, new THREE.Vector3(), pointerDownOnKoala ? 1.0 : 0.55); lastPetTime = now; return; }
  const delta = p.clone().sub(lastHit);
  const dl = delta.length();
  if (dl > 0.025 || now - lastPetTime > 0.12) {
    const dir = dl > 1e-4 ? delta.multiplyScalar(Math.min(1.2, 0.4 + dl * 8) / dl) : new THREE.Vector3();
    addPet(p, dir, pointerDownOnKoala ? 1.0 : 0.6);
    lastHit = p;
    lastPetTime = now;
  }
});

controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0.05, 0.3, 0.45);
controls.minDistance = 2.2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI / 2 + 0.12;
controls.update();

// ---------------------------------------------------------------- animation
const clock = new THREE.Clock();
const _e = new THREE.Euler(), _qa = new THREE.Quaternion();
let content = 0;
let nextBlink = 1.5, blinkStart = -10, blinkDur = 0.24;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  furUniforms.uTime.value = t;

  // petting springs (bend, then overshoot back)
  let petLevel = 0;
  for (let i = 0; i < 6; i++) {
    const pd = petData[i];
    pd.age += dt;
    const rise = 1 - Math.exp(-pd.age * 14);
    const env = Math.exp(-1.5 * pd.age);
    furUniforms.uPets.value[i].w = pd.s * rise * env * Math.cos(3.0 * pd.age);
    petLevel += pd.s * env;
  }
  fluffE *= Math.exp(-dt * 2.5);
  furUniforms.uFluff.value = fluffE * (0.75 + 0.25 * Math.sin(t * 18));
  content += (Math.min(1, petLevel * 0.5) - content) * Math.min(1, dt * 2.5);

  // slow peaceful breathing
  const br = Math.sin(t * 1.25);
  torso.scale.set(1 + 0.022 * br, 1 + 0.012 * br, 1 + 0.03 * br);
  head.position.set(headBase.x, headBase.y + 0.012 * br, headBase.z + 0.006 * br);
  head.rotation.set(
    headRot.x + 0.015 * br + 0.04 * content,
    headRot.y + 0.04 * Math.sin(t * 0.37),
    headRot.z - 0.06 * content + 0.015 * Math.sin(t * 0.29)
  );

  // sleepy blinks
  if (t >= nextBlink) {
    blinkStart = t;
    blinkDur = Math.random() < 0.3 ? 1.4 : 0.24;
    nextBlink = t + blinkDur + 2.2 + Math.random() * 4;
  }
  let blinkAmt = 0;
  const bt = (t - blinkStart) / blinkDur;
  if (bt >= 0 && bt <= 1) blinkAmt = blinkDur > 1 ? Math.min(1, Math.sin(bt * Math.PI) * 1.8) : Math.sin(bt * Math.PI);
  const lidOpen = -0.5 + 0.12 * Math.sin(t * 0.21);
  const lidA = lidOpen + (1.62 - lidOpen) * Math.max(blinkAmt, content * 0.78);
  for (const eye of eyes) eye.lidPivot.rotation.x = lidA;

  // ear twitches
  for (const ear of ears) {
    if (t > ear.next) { ear.t0 = t; ear.next = t + 2.5 + Math.random() * 5; }
    const a = t - ear.t0;
    const tw = a < 1.5 ? Math.exp(-a * 5) * Math.sin(a * 32) : 0;
    ear.g.rotation.set(
      ear.base.x + tw * 0.12 + 0.01 * br,
      ear.base.y + tw * 0.18 * ear.side,
      ear.base.z + tw * 0.25 * ear.side
    );
  }

  // eucalyptus breeze
  const gust = 0.65 + 0.35 * Math.sin(t * 0.23) * Math.sin(t * 0.37 + 1.0);
  for (const sw of swayers) {
    _e.set(Math.sin(t * sw.f + sw.p) * sw.amp * gust, 0, Math.cos(t * sw.f * 0.8 + sw.p * 1.3) * sw.amp * 0.7 * gust);
    _qa.setFromEuler(_e);
    sw.obj.quaternion.copy(sw.q).multiply(_qa);
  }

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});
</script>
</body>
</html>
