<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud-Fluffy Baby White Alpaca</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #dcebf7; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------
    // 1. Scene, Renderer, Camera & Tone Mapping Setup
    // -------------------------------------------------------------
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xddecf8);
    scene.fog = new THREE.FogExp2(0xddecf8, 0.05);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.4, 2.2, 4.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.35, 0);
    controls.minDistance = 1.6;
    controls.maxDistance = 7.5;
    controls.maxPolarAngle = Math.PI * 0.52;

    // -------------------------------------------------------------
    // 2. Procedural Studio Environment Map & Three-Point Lighting
    // -------------------------------------------------------------
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0xdcebf7);
    const topDome = new THREE.Mesh(
      new THREE.SphereGeometry(15, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
      new THREE.MeshBasicMaterial({ color: 0xfff7ec, side: THREE.BackSide })
    );
    envScene.add(topDome);
    const botDome = new THREE.Mesh(
      new THREE.SphereGeometry(15, 16, 8, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5),
      new THREE.MeshBasicMaterial({ color: 0xa8cfa3, side: THREE.BackSide })
    );
    envScene.add(botDome);
    const envMap = pmremGenerator.fromScene(envScene).texture;
    scene.environment = envMap;

    // Three-point lights
    const hemiLight = new THREE.HemisphereLight(0xfff6eb, 0xaed3a8, 0.75);
    scene.add(hemiLight);

    // Warm Sun Key Light
    const keyLight = new THREE.DirectionalLight(0xfff5e6, 2.2);
    keyLight.position.set(4, 6, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0003;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 16;
    keyLight.shadow.camera.left = -2.2;
    keyLight.shadow.camera.right = 2.2;
    keyLight.shadow.camera.top = 3.2;
    keyLight.shadow.camera.bottom = -0.5;
    scene.add(keyLight);

    // Soft Cool Fill Light
    const fillLight = new THREE.DirectionalLight(0xd4e7ff, 0.9);
    fillLight.position.set(-4, 3, -2);
    scene.add(fillLight);

    // Strong Warm Golden Rim Light (Backlight for wool glow halo)
    const rimLight = new THREE.DirectionalLight(0xffe3b8, 2.8);
    rimLight.position.set(-2, 4.5, -4.5);
    scene.add(rimLight);

    // -------------------------------------------------------------
    // 3. Pastel Meadow Mound & Natural Flora
    // -------------------------------------------------------------
    const moundGroup = new THREE.Group();
    scene.add(moundGroup);

    const moundGeo = new THREE.CylinderGeometry(2.7, 3.2, 0.7, 48, 8);
    // Sculpt mound to be rounded and organic
    const mPos = moundGeo.attributes.position;
    for (let i = 0; i < mPos.count; i++) {
      let y = mPos.getY(i);
      let r = Math.sqrt(mPos.getX(i)**2 + mPos.getZ(i)**2);
      if (y > 0.3) {
        mPos.setY(i, y + Math.cos(r * 0.9) * 0.22);
      }
    }
    moundGeo.computeVertexNormals();

    const moundMat = new THREE.MeshStandardMaterial({
      color: 0x93cb82,
      roughness: 0.85,
      metalness: 0.02
    });
    const mound = new THREE.Mesh(moundGeo, moundMat);
    mound.position.y = 0.2;
    mound.receiveShadow = true;
    moundGroup.add(mound);

    // Soft contact shadow disc
    const shadowGeo = new THREE.RingGeometry(0.1, 1.4, 32);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x486441,
      transparent: true,
      opacity: 0.45,
      side: THREE.DoubleSide
    });
    const contactShadow = new THREE.Mesh(shadowGeo, shadowMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.set(0, 0.56, 0);
    moundGroup.add(contactShadow);

    // Tiny 3D Pastel Meadow Flowers (Buttercups & Daisies)
    const flowerColors = [0xffd166, 0xff9ebb, 0xffffff, 0xc7b9ff, 0xffe29a];
    const flowerPetalGeo = new THREE.ConeGeometry(0.04, 0.09, 5);
    flowerPetalGeo.rotateX(Math.PI * 0.5);
    const flowerCenterGeo = new THREE.SphereGeometry(0.03, 8, 8);
    const centerMat = new THREE.MeshStandardMaterial({ color: 0xffb703, roughness: 0.5 });

    for (let i = 0; i < 38; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.75 + Math.random() * 1.7;
      const fx = Math.cos(angle) * radius;
      const fz = Math.sin(angle) * radius;
      const fy = 0.52 + Math.cos(radius * 0.9) * 0.18;

      const fGroup = new THREE.Group();
      fGroup.position.set(fx, fy, fz);
      fGroup.rotation.y = Math.random() * Math.PI * 2;
      fGroup.rotation.x = (Math.random() - 0.5) * 0.3;
      fGroup.rotation.z = (Math.random() - 0.5) * 0.3;

      const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
      const petalMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });

      const center = new THREE.Mesh(flowerCenterGeo, centerMat);
      fGroup.add(center);

      const petalCount = 5;
      for (let p = 0; p < petalCount; p++) {
        const petal = new THREE.Mesh(flowerPetalGeo, petalMat);
        petal.rotation.y = (p / petalCount) * Math.PI * 2;
        petal.position.x = Math.sin((p / petalCount) * Math.PI * 2) * 0.045;
        petal.position.z = Math.cos((p / petalCount) * Math.PI * 2) * 0.045;
        fGroup.add(petal);
      }
      fGroup.scale.setScalar(0.7 + Math.random() * 0.6);
      moundGroup.add(fGroup);
    }

    // Smooth decorative pebbles
    const pebbleGeo = new THREE.DodecahedronGeometry(0.06, 1);
    const pebbleMat = new THREE.MeshStandardMaterial({ color: 0xc8c3b7, roughness: 0.9 });
    for (let i = 0; i < 22; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 1.0 + Math.random() * 1.5;
      const pebble = new THREE.Mesh(pebbleGeo, pebbleMat);
      pebble.position.set(Math.cos(angle) * radius, 0.54, Math.sin(angle) * radius);
      pebble.scale.set(1.0 + Math.random() * 0.8, 0.5 + Math.random() * 0.4, 0.9 + Math.random() * 0.7);
      pebble.rotation.set(Math.random(), Math.random(), Math.random());
      pebble.castShadow = true;
      moundGroup.add(pebble);
    }

    // -------------------------------------------------------------
    // 4. Baby Alpaca Hierarchical Rig Structure
    // -------------------------------------------------------------
    const alpacaRoot = new THREE.Group();
    scene.add(alpacaRoot);

    // Materials for skin/under-body
    const fleshColor = 0xf8f2e6;
    const bodyMat = new THREE.MeshStandardMaterial({
      color: fleshColor,
      roughness: 0.78,
      metalness: 0.02
    });

    // Muzzle Material (Velvety soft cream-peach)
    const muzzleMat = new THREE.MeshStandardMaterial({
      color: 0xf5e5d3,
      roughness: 0.62,
      metalness: 0.01
    });

    // Nose / Nostril Material
    const noseMat = new THREE.MeshStandardMaterial({
      color: 0xdf9a9e,
      roughness: 0.48
    });

    // Cloven Hooves Material
    const hoofMat = new THREE.MeshStandardMaterial({
      color: 0x3d352e,
      roughness: 0.82
    });

    // Body Group (torso)
    const bodyGroup = new THREE.Group();
    bodyGroup.position.set(0, 1.25, 0);
    alpacaRoot.add(bodyGroup);

    // Torso Under-Mesh (rounded plump barrel)
    const torsoGeo = new THREE.CylinderGeometry(0.38, 0.42, 0.95, 24, 8);
    torsoGeo.rotateX(Math.PI * 0.5);
    const torsoMesh = new THREE.Mesh(torsoGeo, bodyMat);
    torsoMesh.castShadow = true;
    torsoMesh.receiveShadow = true;
    bodyGroup.add(torsoMesh);

    // Neck Base Group
    const neckGroup = new THREE.Group();
    neckGroup.position.set(0, 0.28, 0.42);
    neckGroup.rotation.x = -0.15; // angled gracefully forward
    bodyGroup.add(neckGroup);

    // Neck Under-Mesh (long baby alpaca neck)
    const neckGeo = new THREE.CylinderGeometry(0.21, 0.29, 0.88, 20, 8);
    neckGeo.translate(0, 0.44, 0);
    const neckMesh = new THREE.Mesh(neckGeo, bodyMat);
    neckMesh.castShadow = true;
    neckMesh.receiveShadow = true;
    neckGroup.add(neckMesh);

    // Head Group (attached to top of neck)
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 0.92, 0.04);
    neckGroup.add(headGroup);

    // Head Base Skull (cute baby proportions, chubby cheeks)
    const skullGeo = new THREE.SphereGeometry(0.30, 24, 20);
    skullGeo.scale(1.0, 1.05, 1.02);
    const skullMesh = new THREE.Mesh(skullGeo, bodyMat);
    skullMesh.castShadow = true;
    headGroup.add(skullMesh);

    // Chubby Cheeks
    const cheekGeo = new THREE.SphereGeometry(0.14, 16, 12);
    const cheekL = new THREE.Mesh(cheekGeo, bodyMat);
    cheekL.position.set(0.16, -0.06, 0.10);
    headGroup.add(cheekL);
    const cheekR = cheekL.clone();
    cheekR.position.x = -0.16;
    headGroup.add(cheekR);

    // Muzzle (Snout - cleanly defined, velvety smooth)
    const muzzleGroup = new THREE.Group();
    muzzleGroup.position.set(0, -0.09, 0.24);
    headGroup.add(muzzleGroup);

    const snoutGeo = new THREE.SphereGeometry(0.145, 20, 16);
    snoutGeo.scale(1.05, 0.85, 1.25);
    const snoutMesh = new THREE.Mesh(snoutGeo, muzzleMat);
    snoutMesh.castShadow = true;
    muzzleGroup.add(snoutMesh);

    // Pink-tinted cute Nose Pad
    const nosePadGeo = new THREE.SphereGeometry(0.04, 12, 12);
    nosePadGeo.scale(1.3, 0.8, 0.8);
    const nosePad = new THREE.Mesh(nosePadGeo, noseMat);
    nosePad.position.set(0, 0.035, 0.16);
    muzzleGroup.add(nosePad);

    // Left and Right Nostrils
    const nostrilGeo = new THREE.SphereGeometry(0.015, 8, 8);
    const nostrilMat = new THREE.MeshBasicMaterial({ color: 0x753b40 });
    const nostrilL = new THREE.Mesh(nostrilGeo, nostrilMat);
    nostrilL.position.set(0.026, 0.025, 0.185);
    muzzleGroup.add(nostrilL);
    const nostrilR = nostrilL.clone();
    nostrilR.position.x = -0.026;
    muzzleGroup.add(nostrilR);

    // Happy Y-shaped smile mouth line
    const smileCurve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(-0.045, -0.02, 0.16),
      new THREE.Vector3(-0.02, -0.04, 0.17),
      new THREE.Vector3(0.02, -0.04, 0.17),
      new THREE.Vector3(0.045, -0.02, 0.16)
    );
    const smileGeo = new THREE.TubeGeometry(smileCurve, 12, 0.007, 6, false);
    const smileMat = new THREE.MeshBasicMaterial({ color: 0x6e3b3e });
    const smileMesh = new THREE.Mesh(smileGeo, smileMat);
    muzzleGroup.add(smileMesh);

    // Vertical cleft of the Y-smile
    const cleftGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.038, 6);
    const cleftMesh = new THREE.Mesh(cleftGeo, smileMat);
    cleftMesh.position.set(0, 0.002, 0.17);
    cleftMesh.rotation.x = -0.2;
    muzzleGroup.add(cleftMesh);

    // Moving Jaw Group (for chewing cud motion)
    const jawGroup = new THREE.Group();
    jawGroup.position.set(0, -0.15, 0.16);
    headGroup.add(jawGroup);
    const chinGeo = new THREE.SphereGeometry(0.09, 16, 12);
    chinGeo.scale(0.9, 0.6, 1.1);
    const chinMesh = new THREE.Mesh(chinGeo, muzzleMat);
    jawGroup.add(chinMesh);

    // Big Expressive Dark Anime/Disney Eyes with Dual Catchlights & Lashes
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0x120d0a,
      roughness: 0.04,
      metalness: 0.1
    });
    const eyeGeo = new THREE.SphereGeometry(0.075, 20, 16);
    const catchlight1Geo = new THREE.SphereGeometry(0.024, 12, 12);
    const catchlight2Geo = new THREE.SphereGeometry(0.012, 8, 8);
    const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function createEye(isLeft) {
      const eyePivot = new THREE.Group();
      const eye = new THREE.Mesh(eyeGeo, eyeMat);
      eyePivot.add(eye);

      // Primary top-front catchlight
      const cl1 = new THREE.Mesh(catchlight1Geo, catchlightMat);
      cl1.position.set(0.015, 0.025, 0.065);
      eyePivot.add(cl1);

      // Secondary soft sparkle catchlight
      const cl2 = new THREE.Mesh(catchlight2Geo, catchlightMat);
      cl2.position.set(-0.02, -0.025, 0.065);
      eyePivot.add(cl2);

      // Delicate sculpted upper eyelashes
      const lashCurve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(-0.07, 0.04, 0.04),
        new THREE.Vector3(0.0, 0.085, 0.05),
        new THREE.Vector3(0.07, 0.04, 0.04)
      );
      const lashGeo = new THREE.TubeGeometry(lashCurve, 12, 0.008, 6, false);
      const lashMesh = new THREE.Mesh(lashGeo, new THREE.MeshBasicMaterial({ color: 0x0a0705 }));
      eyePivot.add(lashMesh);

      const sign = isLeft ? 1 : -1;
      eyePivot.position.set(sign * 0.21, 0.06, 0.17);
      eyePivot.rotation.y = sign * 0.38;
      eyePivot.rotation.x = -0.05;
      return eyePivot;
    }
    const eyeL = createEye(true);
    const eyeR = createEye(false);
    headGroup.add(eyeL);
    headGroup.add(eyeR);

    // Spear-Shaped Alpaca Ears (Clean, smooth pastel-pink inner cavity)
    const innerEarMat = new THREE.MeshStandardMaterial({
      color: 0xf7b8b8,
      roughness: 0.55,
      metalness: 0.0
    });

    function createEar(isLeft) {
      const earGroup = new THREE.Group();
      // Outer shell
      const earShellGeo = new THREE.ConeGeometry(0.09, 0.42, 16);
      earShellGeo.scale(0.85, 1.0, 0.45);
      const earShell = new THREE.Mesh(earShellGeo, bodyMat);
      earShell.position.y = 0.21;
      earShell.castShadow = true;
      earGroup.add(earShell);

      // Inner pink cavity
      const innerGeo = new THREE.ConeGeometry(0.065, 0.35, 16);
      innerGeo.scale(0.85, 1.0, 0.3);
      const innerEar = new THREE.Mesh(innerGeo, innerEarMat);
      innerEar.position.set(0, 0.20, 0.015);
      earGroup.add(innerEar);

      const sign = isLeft ? 1 : -1;
      earGroup.position.set(sign * 0.18, 0.25, -0.05);
      earGroup.rotation.z = sign * -0.55;
      earGroup.rotation.x = -0.25;
      earGroup.rotation.y = sign * 0.35;
      return earGroup;
    }
    const earL = createEar(true);
    const earR = createEar(false);
    headGroup.add(earL);
    headGroup.add(earR);

    // Four Cute Legs & Hooves
    const legFL = new THREE.Group();
    const legFR = new THREE.Group();
    const legBL = new THREE.Group();
    const legBR = new THREE.Group();

    legFL.position.set(0.24, -0.15, 0.32);
    legFR.position.set(-0.24, -0.15, 0.32);
    legBL.position.set(0.24, -0.15, -0.32);
    legBR.position.set(-0.24, -0.15, -0.32);

    bodyGroup.add(legFL, legFR, legBL, legBR);

    function buildLeg(group) {
      // Upper leg thigh
      const thighGeo = new THREE.CylinderGeometry(0.14, 0.11, 0.38, 16);
      thighGeo.translate(0, -0.18, 0);
      const thigh = new THREE.Mesh(thighGeo, bodyMat);
      thigh.castShadow = true;
      group.add(thigh);

      // Lower slender leg
      const shinGeo = new THREE.CylinderGeometry(0.08, 0.065, 0.38, 16);
      shinGeo.translate(0, -0.48, 0);
      const shin = new THREE.Mesh(shinGeo, bodyMat);
      shin.castShadow = true;
      group.add(shin);

      // Cloven baby hoof
      const hoofGeo = new THREE.CylinderGeometry(0.065, 0.08, 0.10, 12);
      hoofGeo.translate(0, -0.66, 0.015);
      const hoof = new THREE.Mesh(hoofGeo, hoofMat);
      hoof.castShadow = true;
      group.add(hoof);
    }
    [legFL, legFR, legBL, legBR].forEach(buildLeg);

    // Perky Baby Tail
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 0.20, -0.48);
    tailGroup.rotation.x = -0.65;
    bodyGroup.add(tailGroup);

    const tailStubGeo = new THREE.ConeGeometry(0.09, 0.22, 12);
    tailStubGeo.translate(0, 0.11, 0);
    const tailStub = new THREE.Mesh(tailStubGeo, bodyMat);
    tailGroup.add(tailStub);

    // -------------------------------------------------------------
    // 5. Woven Coral-Red Andean Bandana & Dangling Tassels
    // -------------------------------------------------------------
    const bandanaGroup = new THREE.Group();
    bandanaGroup.position.set(0, 0.20, 0.06);
    bandanaGroup.rotation.x = 0.22;
    neckGroup.add(bandanaGroup);

    // Woven Coral-Red Collar Band
    const collarGeo = new THREE.TorusGeometry(0.27, 0.042, 12, 32);
    collarGeo.scale(1.0, 1.0, 0.85);
    const collarMat = new THREE.MeshStandardMaterial({
      color: 0xe63946, // Andean coral-red
      roughness: 0.72,
      metalness: 0.05
    });
    const collarMesh = new THREE.Mesh(collarGeo, collarMat);
    collarMesh.rotation.x = Math.PI * 0.5;
    bandanaGroup.add(collarMesh);

    // Geometric Zigzag Andean Border Ring
    const borderGeo = new THREE.TorusGeometry(0.275, 0.012, 8, 32);
    borderGeo.scale(1.0, 1.0, 0.85);
    const borderMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.6 });
    const borderMesh = new THREE.Mesh(borderGeo, borderMat);
    borderMesh.rotation.x = Math.PI * 0.5;
    bandanaGroup.add(borderMesh);

    // Dangling Colorful Pom-Pom Tassels with Physics Swing
    const tasselColors = [0x2ec4b6, 0xffd166, 0xe63946, 0xff70a6, 0x70c1b3, 0xff9f1c, 0x2ec4b6];
    const tassels = [];
    const tasselPomGeo = new THREE.SphereGeometry(0.042, 12, 10);
    const cordGeo = new THREE.CylinderGeometry(0.007, 0.007, 0.14, 6);
    cordGeo.translate(0, -0.07, 0);

    const numTassels = 7;
    for (let i = 0; i < numTassels; i++) {
      const tAngle = Math.PI * 0.22 + (i / (numTassels - 1)) * Math.PI * 0.56;
      const tx = Math.cos(tAngle) * 0.28;
      const tz = Math.sin(tAngle) * 0.25;

      const tGroup = new THREE.Group();
      tGroup.position.set(tx, -0.02, tz);
      bandanaGroup.add(tGroup);

      const cordMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.8 });
      const cord = new THREE.Mesh(cordGeo, cordMat);
      tGroup.add(cord);

      const pomMat = new THREE.MeshStandardMaterial({
        color: tasselColors[i % tasselColors.length],
        roughness: 0.85
      });
      const pom = new THREE.Mesh(tasselPomGeo, pomMat);
      pom.position.y = -0.15;
      pom.castShadow = true;
      tGroup.add(pom);

      tassels.push({
        group: tGroup,
        rotX: 0, rotZ: 0,
        velX: 0, velZ: 0,
        baseAngle: tAngle
      });
    }

    // -------------------------------------------------------------
    // 6. 28,000+ 3D Crimped Fleece Strands & Micro-Curls (InstancedMesh)
    // -------------------------------------------------------------
    // Distinct wool staple: 3D tapered crimped spiral strand
    function createCrimpedStrandGeometry() {
      const segments = 5;
      const height = 0.26;
      const geo = new THREE.CylinderGeometry(0.007, 0.024, height, 4, segments);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const t = (y + height * 0.5) / height; // 0 at base to 1 at tip
        // Multi-frequency corkscrew curl and crimp
        const angle = t * Math.PI * 3.6;
        const wave = Math.sin(t * Math.PI) * 0.038;
        const micro = Math.cos(angle) * 0.022;
        pos.setX(i, pos.getX(i) + wave + micro);
        pos.setZ(i, pos.getZ(i) + Math.sin(angle) * 0.025);
        if (t > 0.65) {
          pos.setX(i, pos.getX(i) + (t - 0.65) * 0.05);
        }
      }
      geo.computeVertexNormals();
      return geo;
    }

    const strandGeo = createCrimpedStrandGeometry();

    // Uniforms for Wind Ripples & Interactive Mouse Brushing
    const furUniforms = {
      uTime: { value: 0 },
      uBrushPos: { value: new THREE.Vector3(999, 999, 999) },
      uBrushRadius: { value: 0.65 },
      uBrushStrength: { value: 0.0 }
    };

    // PBR Fleece Material with Vertex Shader Hooks
    const fleeceMat = new THREE.MeshStandardMaterial({
      roughness: 0.82,
      metalness: 0.01
    });

    fleeceMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = furUniforms.uTime;
      shader.uniforms.uBrushPos = furUniforms.uBrushPos;
      shader.uniforms.uBrushRadius = furUniforms.uBrushRadius;
      shader.uniforms.uBrushStrength = furUniforms.uBrushStrength;

      shader.vertexShader = `
        uniform float uTime;
        uniform vec3 uBrushPos;
        uniform float uBrushRadius;
        uniform float uBrushStrength;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>

        float strandT = clamp((position.y + 0.13) / 0.26, 0.0, 1.0);

        // Continuous wind waves rippling across the coat
        float wTime = uTime * 3.2;
        float wave1 = sin(wTime + position.x * 4.5 + float(gl_InstanceID) * 0.07) * 0.038 * strandT;
        float wave2 = cos(wTime * 0.8 + position.z * 4.0 + float(gl_InstanceID) * 0.11) * 0.032 * strandT;
        transformed.x += wave1;
        transformed.z += wave2;

        // Interactive mouse brushing reaction
        #ifdef USE_INSTANCING
          vec4 wPos = modelMatrix * instanceMatrix * vec4(position, 1.0);
        #else
          vec4 wPos = modelMatrix * vec4(position, 1.0);
        #endif

        float distToBrush = distance(wPos.xyz, uBrushPos);
        if (distToBrush < uBrushRadius) {
          float bFactor = (1.0 - distToBrush / uBrushRadius) * uBrushStrength * strandT;
          transformed += normal * (bFactor * 0.14);
          transformed.x += sin(float(gl_InstanceID)) * bFactor * 0.07;
          transformed.z += cos(float(gl_InstanceID)) * bFactor * 0.07;
        }
        `
      );
    };

    // Warm cream-white and champagne-ivory color variations
    const furPalette = [
      new THREE.Color(0xfcfaf4), // warm cloud white
      new THREE.Color(0xf9f3e5), // champagne ivory
      new THREE.Color(0xf4ebd7), // soft milk vanilla
      new THREE.Color(0xfaf5ec), // pale pearl white
      new THREE.Color(0xeee2ce), // honey-tinted tip
      new THREE.Color(0xfffbf2)  // pure fleece white
    ];

    const dummy = new THREE.Object3D();

    // Helper to generate instances
    function populateFur(instMesh, count, sampleFn) {
      for (let i = 0; i < count; i++) {
        const { pos, normal, scale } = sampleFn(i, count);
        dummy.position.copy(pos);

        // Align strand orientation along outward surface normal
        const up = new THREE.Vector3(0, 1, 0);
        dummy.quaternion.setFromUnitVectors(up, normal);

        // Random subtle curl swirl around normal
        const swirlAngle = Math.random() * Math.PI * 2;
        const tiltAngle = (Math.random() - 0.5) * 0.45;
        const qTilt = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(Math.cos(swirlAngle), 0, Math.sin(swirlAngle)),
          tiltAngle
        );
        dummy.quaternion.multiply(qTilt);

        const s = scale || (0.85 + Math.random() * 0.35);
        dummy.scale.set(s, s * (0.9 + Math.random() * 0.3), s);
        dummy.updateMatrix();

        instMesh.setMatrixAt(i, dummy.matrix);

        // Pick fleece color with champagne gradients
        const col = furPalette[Math.floor(Math.random() * furPalette.length)];
        instMesh.setColorAt(i, col);
      }
      instMesh.instanceMatrix.needsUpdate = true;
      if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
    }

    // 1. Torso Fleece (11,000 crimped strands)
    const torsoFurCount = 11000;
    const torsoFurMesh = new THREE.InstancedMesh(strandGeo, fleeceMat, torsoFurCount);
    torsoFurMesh.castShadow = true;
    bodyGroup.add(torsoFurMesh);

    populateFur(torsoFurMesh, torsoFurCount, (i, total) => {
      // Golden spiral distribution on ellipsoid
      const phi = Math.acos(1 - 2 * (i + 0.5) / total);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const rx = 0.40, ry = 0.44, rz = 0.62;

      let x = Math.sin(phi) * Math.cos(theta) * rx;
      let y = Math.cos(phi) * ry;
      let z = Math.sin(phi) * Math.sin(theta) * rz;

      // Surface normal
      const nx = x / (rx * rx);
      const ny = y / (ry * ry);
      const nz = z / (rz * rz);
      const normal = new THREE.Vector3(nx, ny, nz).normalize();

      // Organic jitter
      x += (Math.random() - 0.5) * 0.035;
      y += (Math.random() - 0.5) * 0.035;
      z += (Math.random() - 0.5) * 0.035;

      return { pos: new THREE.Vector3(x, y, z), normal, scale: 0.95 + Math.random() * 0.3 };
    });

    // 2. Neck Fleece (6,500 crimped strands)
    const neckFurCount = 6500;
    const neckFurMesh = new THREE.InstancedMesh(strandGeo, fleeceMat, neckFurCount);
    neckFurMesh.castShadow = true;
    neckGroup.add(neckFurMesh);

    populateFur(neckFurMesh, neckFurCount, (i, total) => {
      const u = (i + 0.5) / total;
      const y = u * 0.85 + 0.02;
      const angle = i * 2.39996; // golden angle
      const rad = 0.22 + (1.0 - u) * 0.08;

      let x = Math.cos(angle) * rad;
      let z = Math.sin(angle) * rad;
      const normal = new THREE.Vector3(Math.cos(angle), 0.12, Math.sin(angle)).normalize();

      x += (Math.random() - 0.5) * 0.025;
      z += (Math.random() - 0.5) * 0.025;

      return { pos: new THREE.Vector3(x, y, z), normal, scale: 0.9 + Math.random() * 0.35 };
    });

    // 3. Head & Cloud Topknot Fleece (6,800 crimped strands)
    // Leaves the cute muzzle and inner ears cleanly visible!
    const headFurCount = 6800;
    const headFurMesh = new THREE.InstancedMesh(strandGeo, fleeceMat, headFurCount);
    headFurMesh.castShadow = true;
    headGroup.add(headFurMesh);

    populateFur(headFurMesh, headFurCount, (i, total) => {
      let x, y, z, normal, isTopknot = false;

      // 60% of strands form the giant puffy cloud topknot (정수리 털뭉치)
      if (Math.random() < 0.60) {
        isTopknot = true;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI * 0.45; // top hemisphere
        const rad = 0.28 + Math.random() * 0.18; // billowing cloud puff
        x = Math.sin(phi) * Math.cos(theta) * rad;
        y = 0.18 + Math.cos(phi) * rad * 0.9;
        z = Math.sin(phi) * Math.sin(theta) * rad + 0.04;
        normal = new THREE.Vector3(x, y - 0.18, z).normalize();
      } else {
        // Cheeks and back of cranium
        const theta = Math.random() * Math.PI * 2;
        const phi = 0.35 + Math.random() * (Math.PI - 0.7);
        const rad = 0.31;
        x = Math.sin(phi) * Math.cos(theta) * rad;
        y = Math.cos(phi) * rad;
        z = Math.sin(phi) * Math.sin(theta) * rad;

        // Clean mask: Exclude muzzle area and eyes
        if (z > 0.12 && y < 0.05 && Math.abs(x) < 0.18) {
          // Push back into cheeks or skull
          z = -0.15;
        }
        if (z > 0.10 && y > 0.02 && Math.abs(x) > 0.15 && Math.abs(x) < 0.28) {
          // Eye socket clearance
          x = (x > 0 ? 0.29 : -0.29);
        }
        normal = new THREE.Vector3(x, y, z).normalize();
      }

      const scale = isTopknot ? (1.1 + Math.random() * 0.4) : (0.8 + Math.random() * 0.3);
      return { pos: new THREE.Vector3(x, y, z), normal, scale };
    });

    // 4. Legs Fleece (3,200 crimped strands across 4 legs)
    const legFurCount = 3200;
    const legFurMesh = new THREE.InstancedMesh(strandGeo, fleeceMat, legFurCount);
    legFurMesh.castShadow = true;
    bodyGroup.add(legFurMesh);

    const legPositions = [
      new THREE.Vector3(0.24, -0.15, 0.32),
      new THREE.Vector3(-0.24, -0.15, 0.32),
      new THREE.Vector3(0.24, -0.15, -0.32),
      new THREE.Vector3(-0.24, -0.15, -0.32)
    ];

    populateFur(legFurMesh, legFurCount, (i, total) => {
      const legIdx = i % 4;
      const legBase = legPositions[legIdx];
      const u = Math.random(); // 0 is thigh, 1 is near ankle
      const y = -0.05 - u * 0.48; // covers thigh down to above hoof
      const rad = 0.13 - u * 0.05;
      const angle = Math.random() * Math.PI * 2;

      const lx = Math.cos(angle) * rad;
      const lz = Math.sin(angle) * rad;
      const normal = new THREE.Vector3(Math.cos(angle), -0.05, Math.sin(angle)).normalize();

      const pos = new THREE.Vector3(legBase.x + lx, legBase.y + y, legBase.z + lz);
      return { pos, normal, scale: 0.75 + Math.random() * 0.25 };
    });

    // 5. Tail Fluffy Fleece (1,000 crimped strands)
    const tailFurCount = 1000;
    const tailFurMesh = new THREE.InstancedMesh(strandGeo, fleeceMat, tailFurCount);
    tailFurMesh.castShadow = true;
    tailGroup.add(tailFurMesh);

    populateFur(tailFurMesh, tailFurCount, (i, total) => {
      const phi = Math.acos(1 - 2 * (i + 0.5) / total);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const rad = 0.14 + Math.random() * 0.06;

      const x = Math.sin(phi) * Math.cos(theta) * rad;
      const y = 0.12 + Math.cos(phi) * rad * 1.3;
      const z = Math.sin(phi) * Math.sin(theta) * rad;
      const normal = new THREE.Vector3(x, y - 0.12, z).normalize();

      return { pos: new THREE.Vector3(x, y, z), normal, scale: 0.95 + Math.random() * 0.3 };
    });

    // Total crimped fleece instances: 11,000 + 6,500 + 6,800 + 3,200 + 1,000 = 28,500 strands!

    // -------------------------------------------------------------
    // 7. Interactive Mouse Physics & Raycast Brushing
    // -------------------------------------------------------------
    // Invisible Raycast Proxy Mesh covering the alpaca
    const proxyGroup = new THREE.Group();
    scene.add(proxyGroup);

    const hitProxyGeo = new THREE.CapsuleGeometry(0.55, 1.1, 8, 16);
    hitProxyGeo.rotateX(Math.PI * 0.5);
    const hitProxyMat = new THREE.MeshBasicMaterial({ visible: false });
    const bodyProxy = new THREE.Mesh(hitProxyGeo, hitProxyMat);
    bodyProxy.position.set(0, 1.25, 0);
    proxyGroup.add(bodyProxy);

    const headProxyGeo = new THREE.SphereGeometry(0.52, 12, 12);
    const headProxy = new THREE.Mesh(headProxyGeo, hitProxyMat);
    headProxy.position.set(0, 1.95, 0.45);
    proxyGroup.add(headProxy);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    let isBrushing = false;
    let brushTarget = new THREE.Vector3();
    let joyfulBounce = 0.0;
    let joyTilt = 0.0;
    let joyExcitement = 0.0;

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects([bodyProxy, headProxy], false);
      if (hits.length > 0) {
        brushTarget.copy(hits[0].point);
        furUniforms.uBrushPos.value.lerp(brushTarget, 0.38);
        furUniforms.uBrushStrength.value = Math.min(furUniforms.uBrushStrength.value + 0.35, 1.9);
      }
    });

    // Click / Tap Joyful Reaction (happy bounce, ear twitch, tail wag)
    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects([bodyProxy, headProxy], false);
      if (hits.length > 0) {
        brushTarget.copy(hits[0].point);
        furUniforms.uBrushPos.value.copy(brushTarget);
        furUniforms.uBrushStrength.value = 2.4;
        joyfulBounce = 1.0;
        joyTilt = (Math.random() - 0.5) * 0.4;
        joyExcitement = 1.0;
      }
    });

    // -------------------------------------------------------------
    // 8. Dreamy Floating Sunlit Spores / Dust Motes
    // -------------------------------------------------------------
    const sporeCount = 140;
    const sporeGeo = new THREE.BufferGeometry();
    const sporePos = new Float32Array(sporeCount * 3);
    for (let i = 0; i < sporeCount; i++) {
      sporePos[i * 3 + 0] = (Math.random() - 0.5) * 4.5;
      sporePos[i * 3 + 1] = 0.4 + Math.random() * 2.8;
      sporePos[i * 3 + 2] = (Math.random() - 0.5) * 4.5;
    }
    sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
    const sporeMat = new THREE.PointsMaterial({
      color: 0xfff3d6,
      size: 0.035,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending
    });
    const spores = new THREE.Points(sporeGeo, sporeMat);
    scene.add(spores);

    // -------------------------------------------------------------
    // 9. Animation State Variables & Life Behaviors
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    let earTimerL = 0, earTimerR = 0;
    let nextTwitchL = 2.0, nextTwitchR = 3.5;
    let twitchProgressL = 0, twitchProgressR = 0;

    // -------------------------------------------------------------
    // 10. Main Animation Loop
    // -------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // Update shader time for wind waves
      furUniforms.uTime.value = time;

      // Smooth decay of interactive mouse brushing
      furUniforms.uBrushStrength.value *= 0.94;
      if (furUniforms.uBrushStrength.value < 0.01) {
        furUniforms.uBrushStrength.value = 0.0;
      }

      // Smooth decay of joyful click reaction
      joyfulBounce *= 0.92;
      joyTilt *= 0.93;
      joyExcitement *= 0.94;

      // 1. Gentle Alpaca Breathing & Head Bobbing
      const breath = Math.sin(time * 2.0);
      bodyGroup.position.y = 1.25 + breath * 0.012 + joyfulBounce * 0.06;
      bodyGroup.rotation.z = Math.sin(time * 1.4) * 0.015;

      neckGroup.rotation.z = Math.sin(time * 1.5 - 0.3) * 0.025 + joyTilt * 0.3;
      neckGroup.rotation.x = -0.15 + Math.sin(time * 2.0 - 0.2) * 0.02;

      // Head inquisitive tilt and gentle bob
      headGroup.position.y = 0.92 + breath * 0.015 + joyfulBounce * 0.08;
      headGroup.rotation.z = Math.sin(time * 1.6) * 0.045 + Math.cos(time * 0.8) * 0.03 + joyTilt * 0.6;
      headGroup.rotation.x = Math.sin(time * 2.0) * 0.035;

      // 2. Realistic Side-to-Side Cud-Chewing Motion
      const chewCycle = time * 7.5;
      jawGroup.position.x = Math.sin(chewCycle) * 0.015;
      jawGroup.position.y = -0.15 - Math.abs(Math.cos(chewCycle)) * 0.012;
      jawGroup.rotation.z = Math.sin(chewCycle) * 0.04;
      snoutMesh.scale.x = 1.05 + Math.sin(chewCycle) * 0.02;

      // 3. Autonomous Ear Twitching & Listening Rotation
      earTimerL += dt;
      earTimerR += dt;
      if (earTimerL > nextTwitchL || joyExcitement > 0.5) {
        twitchProgressL = 0.32;
        earTimerL = 0;
        nextTwitchL = 2.5 + Math.random() * 3.5;
      }
      if (earTimerR > nextTwitchR || joyExcitement > 0.5) {
        twitchProgressR = 0.32;
        earTimerR = 0;
        nextTwitchR = 3.0 + Math.random() * 4.0;
      }

      let twitchRotL = 0, twitchRotR = 0;
      if (twitchProgressL > 0) {
        twitchProgressL -= dt;
        twitchRotL = Math.sin(twitchProgressL * 45.0) * 0.32;
      }
      if (twitchProgressR > 0) {
        twitchProgressR -= dt;
        twitchRotR = Math.sin(twitchProgressR * 45.0) * 0.32;
      }

      earL.rotation.y = 0.35 + Math.sin(time * 1.3) * 0.12 + twitchRotL;
      earR.rotation.y = -0.35 + Math.cos(time * 1.5) * 0.12 + twitchRotR;
      earL.rotation.z = -0.55 + Math.cos(time * 2.0) * 0.05;
      earR.rotation.z = 0.55 - Math.cos(time * 2.0) * 0.05;

      // 4. Perky Tail Flick
      const tailWag = Math.sin(time * 5.0 + joyExcitement * 9.0) * (0.16 + joyExcitement * 0.35);
      tailGroup.rotation.y = tailWag;
      tailGroup.rotation.x = -0.65 + Math.sin(time * 2.5) * 0.08;

      // 5. Andean Tassel Pendulum Physics
      for (let i = 0; i < tassels.length; i++) {
        const tas = tassels[i];
        const targetRotX = -neckGroup.rotation.x * 2.2 + Math.sin(time * 3.0 + i) * 0.15;
        const targetRotZ = -neckGroup.rotation.z * 2.2 + Math.cos(time * 2.5 + i) * 0.15;

        tas.velX += (targetRotX - tas.rotX) * 16.0 * dt;
        tas.velZ += (targetRotZ - tas.rotZ) * 16.0 * dt;
        tas.velX *= 0.88;
        tas.velZ *= 0.88;
        tas.rotX += tas.velX * dt;
        tas.rotZ += tas.velZ * dt;

        tas.group.rotation.x = tas.rotX;
        tas.group.rotation.z = tas.rotZ;
      }

      // 6. Upward Drifting Sunlit Spores
      const sPos = sporeGeo.attributes.position.array;
      for (let i = 1; i < sPos.length; i += 3) {
        sPos[i] += dt * 0.15;
        if (sPos[i] > 3.2) sPos[i] = 0.4;
      }
      sporeGeo.attributes.position.needsUpdate = true;

      // Orbit controls update
      controls.update();

      // Render frame
      renderer.render(scene, camera);
    }

    animate();

    // -------------------------------------------------------------
    // 11. Window Resize Handling
    // -------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
